<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Appearance — Review</title>
<style>
:root{--bg:#f7f6f2;--card:#fff;--tx:#1f2430;--mut:#6b7280;--ac:#3b5bdb;--ok:#2b8a3e;--okb:#e6f4ea;--no:#c92a2a;--nob:#fdeaea;--bd:#e3e1d9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171c;--card:#1e2128;--tx:#e8e9ee;--mut:#9aa0ad;--ac:#7c9cff;--ok:#69db7c;--okb:#173a22;--no:#ff8787;--nob:#3f1c1c;--bd:#2f333c}}
:root[data-theme="dark"]{--bg:#15171c;--card:#1e2128;--tx:#e8e9ee;--mut:#9aa0ad;--ac:#7c9cff;--ok:#69db7c;--okb:#173a22;--no:#ff8787;--nob:#3f1c1c;--bd:#2f333c}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{display:grid;grid-template-columns:1fr 220px;gap:16px;max-width:1000px;margin:auto;padding:12px}
main{min-width:0}aside{position:sticky;top:12px;align-self:start;max-height:90vh;overflow:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 16px;margin-bottom:14px}
h1{font-size:24px;margin:6px 0 2px}h2{font-size:18px;margin:0 0 4px}h3{font-size:15px;margin:0 0 6px}.mut{color:var(--mut);font-size:14px}
table{border-collapse:collapse;width:100%;font-size:14px}td{padding:5px 6px;border-bottom:1px solid var(--bd)}
button,select,input{font:inherit;color:var(--tx)}button{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;cursor:pointer}button:hover{border-color:var(--ac)}button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
input,select{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:5px 8px;min-width:120px}input.w{width:100%;box-sizing:border-box}
.it{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;border:1px solid transparent;margin:3px 0}
.it.ok{background:var(--okb);border-color:var(--ok)}.it.no{background:var(--nob);border-color:var(--no)}.it.shown{background:var(--bg);border-color:var(--ac)}
.n{font-weight:700;color:var(--mut);width:20px}.q{flex:1;min-width:200px}.fb{font-size:14px;font-weight:600;flex-basis:100%;padding-left:28px}.it.ok .fb{color:var(--ok)}.it.no .fb{color:var(--no)}
.sp{visibility:hidden;padding:2px 7px}.it.ok .sp,.it.no .sp,.it.shown .sp{visibility:visible}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}.sc{font-weight:700}.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
@media(max-width:760px){.wrap{grid-template-columns:1fr}aside{order:-1;position:static;max-height:180px}}
</style></head><body><div class="wrap"><main>
<div class="card"><h1>🔁 Appearance — повторение</h1><p class="mut" style="margin:0">3 упражнения по 10 пунктов: перевод, выбор глагола, исправление ошибок.</p></div>
<div class="card"><h2>Слова для разогрева</h2><p class="mut">Нажмите на слово, чтобы услышать (Google US English / Samantha). <span id="vl"></span></p><div class="chips" id="ch"></div>
<div class="bar"><button class="p" id="pa">▶ Прослушать все</button><button id="ps">■ Стоп</button></div></div>
<div id="ex"></div>
<div class="card"><h2>Итоги</h2><p>Всего: <b id="tot">0 / 30</b></p><div class="bar"><button class="p" id="ca">📋 Копировать все ответы</button><button id="at">🔊 Проверить звук</button><span id="as" class="mut"></span></div></div>
</main><aside class="card"><h3>⚠️ Проблемные слова</h3><table id="pl"></table><div class="bar"><button id="pr">Очистить</button></div></aside></div>
<script>
const $=s=>document.querySelector(s),n=s=>String(s).toLowerCase().replace(/[’‘`]/g,"'").replace(/\s+/g,' ').trim().replace(/[.!?]$/,'');
const W=['skinny','chubby','average','slim','overweight','olive skin','pale complexion','scar','pimple','wrinkles','freckles','mole','dimples','dark circles','birthmark'];
let voice=null,stop=0;
function pick(){if(!('speechSynthesis' in window)){$('#vl').textContent='⚠ озвучка не поддерживается';return}const v=speechSynthesis.getVoices();voice=v.find(x=>/Google US English/i.test(x.name))||v.find(x=>/Samantha/i.test(x.name))||v.find(x=>/^en[-_]US/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null;$('#vl').textContent=voice?'Сейчас: '+voice.name:'Сейчас: голос по умолчанию'}
if('speechSynthesis' in window){speechSynthesis.onvoiceschanged=pick;pick()}
function say(t,end,start){if(!('speechSynthesis' in window)){alert('Озвучка не поддерживается — откройте в Chrome или Safari');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';if(voice)u.voice=voice;u.rate=.9;if(end){u.onend=end;u.onerror=end}if(start)u.onstart=start;speechSynthesis.speak(u)}
$('#ch').innerHTML=W.map(w=>`<button>🔊 ${w}</button>`).join('');$('#ch').onclick=e=>{const b=e.target.closest('button');if(b)say(b.textContent.slice(3))};
$('#pa').onclick=()=>{stop=0;let i=0;const go=()=>{if(stop||i>=W.length)return;say(W[i++],()=>setTimeout(go,350))};go()};$('#ps').onclick=()=>{stop=1;speechSynthesis.cancel()};
$('#at').onclick=()=>{const st=$('#as');if(!('speechSynthesis' in window)){st.textContent='✗ Озвучка не поддерживается';return}st.textContent='Проверка…';let ok=0;say('Audio test. She has olive skin.',()=>{if(ok)st.textContent='✓ Звук работает: '+(voice?voice.name:'голос по умолчанию')},()=>ok=1);setTimeout(()=>{if(!ok)st.textContent='✗ Звука нет: проверьте громкость и разрешения'},2500)};
let prob={};try{prob=JSON.parse(localStorage.getItem('prob_rev')||'{}')}catch(e){}
function saveP(){try{localStorage.setItem('prob_rev',JSON.stringify(prob))}catch(e){}const k=Object.keys(prob).sort((a,b)=>prob[b]-prob[a]);$('#pl').innerHTML=k.length?k.map(w=>`<tr><td><b>${w}</b></td><td>×${prob[w]}</td></tr>`).join(''):'<tr><td class="mut">Пока пусто 🎉</td></tr>'}
$('#pr').onclick=()=>{prob={};saveP()};saveP();
const O={be:'is / are (be)',look:'look(s)',have:'has / have (got)',of:'is / are of (+ build)'};
const E=[
{t:'1 · Переведите на английский',d:'Впишите слово или сочетание.',k:'t',items:[['пухлый',['chubby'],'chubby'],['шрам',['scar'],'scar'],['веснушки',['freckles'],'freckles'],['бледный цвет лица',['pale complexion'],'pale complexion'],['худой',['skinny','thin'],'skinny'],['родинка',['mole'],'mole'],['морщины',['wrinkles'],'wrinkles'],['круги под глазами',['dark circles'],'dark circles'],['оливковая кожа',['olive skin'],'olive skin'],['ямочки',['dimples'],'dimples']].map(([r,a,w])=>({q:`<b>${r}</b> → {}`,a,w,sp:a[0]}))},
{t:'2 · Выберите: be / look / have / be of',d:'Какая конструкция подходит в пропуск?',k:'s',items:[['He’s {} medium build.','of','average'],['You {} so thin in this photo!','look','skinny'],['My sister {} freckles.','have','freckles'],['Her skin {} quite pale.','be','pale complexion'],['They’re {} average build.','of','average'],['He {} a birthmark on his neck.','have','birthmark'],['She {} older with those glasses.','look','wrinkles'],['He {} tall and slim.','be','slim'],['The twins {} fair skin.','have','olive skin'],['She’s {} slim build.','of','slim']].map(([q,a,w])=>({q,a:[a],w,sp:q.replace('{}',{of:'of',look:'look',have:'have',be:'is'}[a])}))},
{t:'3 · Найдите ошибку и перепишите предложение',d:'Впишите правильный вариант целиком.',k:'t',items:[['She is of olive skin.',['She has olive skin','She has got olive skin','She’s got olive skin'],'olive skin'],['He’s from average build.',['He’s of average build','He is of average build'],'average'],['You are look slim.',['You look slim'],'slim'],['Her skin has quite pale.',['Her skin is quite pale'],'pale complexion'],['He have dimples.',['He has dimples','He has got dimples'],'dimples'],['She’s slim build.',['She’s of slim build','She is of slim build'],'slim'],['I has freckles.',['I have freckles','I’ve got freckles','I have got freckles'],'freckles'],['They look of medium build.',['They’re of medium build','They are of medium build'],'average'],['He has got of dark circles.',['He has dark circles','He has got dark circles'],'dark circles'],['She is a scar on her face.',['She has a scar on her face','She has got a scar on her face','She’s got a scar on her face'],'scar']].map(([q,a,w])=>({q:`<s style="color:var(--no)">${q}</s><input class="w" placeholder="…" autocomplete="off" autocapitalize="off" spellcheck="false">`,a,w,sp:a[0],raw:q,full:1}))}
];
const val=d=>{const s=d.querySelector('select'),i=d.querySelector('input');return s?s.value:i.value};
const ans=(e,it)=>e.k=='s'?O[it.a[0]]:it.a[0];
function exText(e){return e.t+'\n'+e.ds.map((d,i)=>{const it=e.items[i],v=val(d),q=it.raw?it.raw:it.q.replace(/<[^>]+>/g,'').replace('{}','['+(v?(e.k=='s'?O[v]:v):'—')+']');return `${i+1}. ${q}${it.raw?' → '+(v||'—'):''} | верно: ${ans(e,it)}`}).join('\n')}
function cp(t,b){const o=b.textContent,done=()=>{b.textContent='✓ Скопировано';setTimeout(()=>b.textContent=o,1500)},fb=()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');done()}catch(x){prompt('Скопируйте текст:',t)}a.remove()};navigator.clipboard?navigator.clipboard.writeText(t).then(done,fb):fb()}
const tot=()=>$('#tot').textContent=E.reduce((a,e)=>a+(e.score||0),0)+' / 30';
E.forEach(e=>{const s=document.createElement('section');s.className='card';
s.innerHTML=`<h2>${e.t}</h2><p class="mut">${e.d}</p><div></div><div class="bar"><button class="p" data-a="c">Проверить</button><button data-a="s">Показать ответы</button><button data-a="r">Сбросить</button><button data-a="p">📋 Копировать</button><span class="sc"></span></div>`;
const box=s.firstElementChild.nextElementSibling.nextElementSibling;e.ds=[];
e.items.forEach((it,i)=>{const d=document.createElement('div');d.className='it';
const c=e.k=='s'?`<select><option value="">— выберите —</option>${Object.entries(O).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select>`:'<input autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="…">';
d.innerHTML=`<span class="n">${i+1}</span><span class="q">${it.full?it.q:it.q.replace('{}',c)}</span><button class="sp" data-s="${i}">🔊</button><span class="fb"></span>`;box.appendChild(d);e.ds.push(d)});
s.onclick=ev=>{const b=ev.target.closest('button');if(!b)return;if(b.dataset.s!==undefined){say(e.items[b.dataset.s].sp);return}const a=b.dataset.a;
if(a=='c'){let ok=0;e.ds.forEach((d,i)=>{const it=e.items[i],v=n(val(d)),g=it.a.some(x=>n(x)==v);d.className='it '+(g?'ok':'no');d.querySelector('.fb').textContent=g?'✓':'✗';if(g)ok++;else if(v&&!d.dataset.l){prob[it.w]=(prob[it.w]||0)+1;d.dataset.l=1}});e.score=ok;s.querySelector('.sc').textContent=ok+' / 10';saveP();tot()}
if(a=='s')e.ds.forEach((d,i)=>{const it=e.items[i],c=d.querySelector('select')||d.querySelector('input');c.value=it.a[0];d.className='it shown';d.querySelector('.fb').textContent='→ '+ans(e,it)});
if(a=='r'){e.ds.forEach(d=>{d.className='it';d.dataset.l='';d.querySelector('.fb').textContent='';(d.querySelector('select')||d.querySelector('input')).value=''});e.score=0;s.querySelector('.sc').textContent='';tot()}
if(a=='p')cp(exText(e),b)};
$('#ex').appendChild(s)});
$('#ca').onclick=function(){cp(E.map(exText).join('\n\n'),this)};
</script></body></html>
