<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>MAKE or DO — 2</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff4e3;--card:#fff;--tx:#2b2540;--mut:#7a7390;--mk:#ff5d8f;--do:#12b3c2;--ok:#22b573;--no:#ee4b4b;--yl:#ffc83d;--ln:#eadfce;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1b1730;--card:#2a2445;--tx:#f3efff;--mut:#a9a2c4;--ln:#3d3660;color-scheme:dark}}
:root[data-theme=dark]{--bg:#1b1730;--card:#2a2445;--tx:#f3efff;--mut:#a9a2c4;--ln:#3d3660;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:500 16px/1.5 Nunito,system-ui,sans-serif;background-image:radial-gradient(circle at 8% 4%,rgba(255,93,143,.25),transparent 32%),radial-gradient(circle at 95% 10%,rgba(18,179,194,.25),transparent 30%)}
header{padding:18px 16px 6px;text-align:center}h1{font:800 clamp(34px,8vw,58px)/1 'Baloo 2',system-ui,sans-serif;margin:0}
h1 .m{color:var(--mk)}h1 .d{color:var(--do)}h1 .o{font-size:.4em;color:var(--mut);margin:0 .3em}
.tools{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:8px}.tools input,.tools select{padding:7px 12px;border-radius:12px;border:2px solid var(--ln);background:var(--card);color:var(--tx);font:inherit}.tools input{width:150px}.tools select{max-width:260px}
small{color:var(--mut)}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 14px;justify-content:center}nav button{flex:none;border:2px solid var(--ln);background:var(--card);color:var(--tx);border-radius:99px;padding:6px 14px;font:700 14px Nunito,sans-serif;cursor:pointer}nav button.on{background:var(--mk);border-color:var(--mk);color:#fff}
.wrap{display:grid;grid-template-columns:1fr 210px;gap:14px;max-width:1000px;margin:0 auto;padding:0 14px 90px}
@media(max-width:760px){.wrap{grid-template-columns:1fr}aside{order:2}}
main,aside{background:var(--card);border-radius:22px;padding:18px;box-shadow:0 6px 0 var(--ln)}aside{align-self:start;position:sticky;top:10px}aside h3{margin:0 0 8px;font:800 18px 'Baloo 2',sans-serif}
.sec{display:none}.sec.on{display:block}.sec h2{font:800 26px 'Baloo 2',sans-serif;margin:0}.intro{color:var(--mut);margin:2px 0 14px}
.btn,.pl,.pwd{font:700 15px Nunito,sans-serif;border:2px solid var(--ln);background:var(--card);color:var(--tx);border-radius:14px;padding:8px 14px;cursor:pointer}
.btn{background:var(--do);border-color:var(--do);color:#fff;margin:4px 6px 0 0}.btn:nth-child(2){background:var(--yl);border-color:var(--yl);color:#2b2540}.btn:nth-child(3){background:var(--card);border-color:var(--ln);color:var(--tx)}
.pwd{display:block;width:100%;text-align:left;margin:0 0 6px;padding:5px 10px;background:rgba(255,200,61,.2)}
.sc{font:800 20px 'Baloo 2',sans-serif;margin-left:8px}.ctl{margin-top:14px}.row{margin:0 0 14px;line-height:2.4}
.ans{font:700 16px Nunito,sans-serif;border:2px solid var(--ln);border-bottom-width:3px;border-radius:10px;padding:3px 8px;background:var(--card);color:var(--tx);min-width:70px;max-width:100%;margin:0 6px 0 0}
.ans.ok,.mc.ok{background:rgba(34,181,115,.22);border-color:var(--ok)}.ans.no{background:rgba(238,75,75,.2);border-color:var(--no)}.ans.shown,.mc.shown{background:rgba(255,200,61,.3);border-color:var(--yl)}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}@media(max-width:520px){.mem{grid-template-columns:repeat(3,1fr)}}
.mc{min-height:74px;font:700 14px Nunito,sans-serif;border-radius:14px;border:2px solid var(--ln);background:linear-gradient(135deg,rgba(255,93,143,.3),rgba(18,179,194,.3));color:var(--tx);cursor:pointer;padding:4px}.mc.up{background:var(--card);border-color:var(--do)}
textarea{width:100%;min-height:150px;font:600 16px/1.5 Nunito,sans-serif;border:2px solid var(--ln);border-radius:14px;padding:10px;background:var(--card);color:var(--tx)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.tags span{padding:3px 11px;border-radius:99px;border:2px solid var(--ln);font-weight:700;font-size:14px}.tags span.on{background:rgba(34,181,115,.25);border-color:var(--ok)}
footer{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));text-align:center;background:var(--card);box-shadow:0 -4px 14px rgba(0,0,0,.12)}
#toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:99px;display:none}
</style></head><body>
<header><h1><span class="m">MAKE</span><span class="o">or</span><span class="d">DO</span> <small style="font-size:.4em">part 2</small></h1>
<div class="tools"><input id="nm" placeholder="Твоё имя"><button class="btn" id="tv">🔊 Проверить звук</button><select id="vsel"></select><small id="vs"></small></div></header>
<nav id="nav"></nav>
<div class="wrap"><main id="main"></main><aside><h3>⚠️ Проблемные слова</h3><div id="pw"><small>Пока пусто 🎉<br>Ошибки появятся здесь — нажми, чтобы послушать.</small></div></aside></div>
<footer><button class="btn" id="cp">📋 Скопировать мои ответы</button></footer><div id="toast"></div>
<script>
const $=(s,e=document)=>e.querySelector(s),el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const norm=s=>s.toLowerCase().replace(/[’‘]/g,"'").replace(/[.!?,]/g,'').replace(/\s+/g,' ').trim();
const W=[['make','a phone call','позвонить'],['make','friends','подружиться'],['make','plans','строить планы'],['make','an excuse','придумать отговорку'],['make','an effort','приложить усилия'],['make','a decision','принять решение'],['make','sure','убедиться'],['make','a mistake','сделать ошибку'],['make','a noise','шуметь'],['do','sport','заниматься спортом'],['do','exercise','делать упражнения'],['do','housework','делать работу по дому'],['do','your hair','сделать причёску'],['do','your nails','сделать маникюр'],['do','a course','пройти курс'],['do','your best','сделать всё возможное'],['do','homework','делать домашнее задание']];
const full=w=>w[0]+' '+w[1];
// voice: Google US English natural / Samantha first, manual choice available
let V=null,UV=null;const pick=()=>{try{const v=speechSynthesis.getVoices().filter(x=>/^en[-_]/i.test(x.lang)),us=v.filter(x=>/^en[-_]US/i.test(x.lang));V=UV||us.find(x=>/google/i.test(x.name)&&/natural/i.test(x.name))||us.find(x=>/natural/i.test(x.name))||us.find(x=>/Samantha/i.test(x.name))||us.find(x=>/Google US English/i.test(x.name))||us[0]||null;const sl=$('#vsel');if(sl.options.length!=v.length+1){sl.innerHTML='<option value="">Авто (Google US English natural / Samantha)</option>'+v.map((x,i)=>`<option value="${i}">${x.name} (${x.lang})</option>`).join('');sl.onchange=()=>{UV=sl.value===''?null:v[+sl.value];pick();say('Make a decision. Do your best!')}}$('#vs').textContent=V?'Голос: '+V.name:'Голос: по умолчанию'}catch(e){$('#vs').textContent='Нет звука в этом браузере'}};
const say=t=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.9;if(V||pick())u.voice=V;speechSynthesis.speak(u)}catch(e){}};
try{speechSynthesis.onvoiceschanged=pick}catch(e){}pick();$('#tv').onclick=()=>say('Make a decision. Do your best!');
const P={};function bad(k){P[k]=(P[k]||0)+1;const d=$('#pw');d.innerHTML='';Object.entries(P).sort((a,b)=>b[1]-a[1]).forEach(([k,n])=>{const x=el('button','pwd',`${k} <b>×${n}</b>`);x.onclick=()=>say(k);d.append(x)})}
const S=[
{e:'🧠',n:'Memory',t:'Memory: find the pairs',i:'Открывай по две карточки: английская фраза и её перевод. Английские фразы озвучиваются. Найди все 8 пар!',build(b){const ws=sh(W).slice(0,8),cs=sh(ws.flatMap(w=>[{w,t:full(w),s:0},{w,t:w[2],s:1}]));let open=[],lock=false,tries=0;const g=el('div','mem');cs.forEach(c=>{const x=el('button','mc','❓');c.x=x;x.onclick=()=>{if(lock||c.up||c.done)return;c.up=true;x.classList.add('up');x.textContent=c.t;if(!c.s)say(c.t);open.push(c);if(open.length==2){tries++;const[a,d]=open;open=[];if(a.w==d.w){a.done=d.done=true;a.x.classList.add('ok');d.x.classList.add('ok')}else{lock=true;setTimeout(()=>{[a,d].forEach(k=>{k.up=false;k.x.classList.remove('up');k.x.textContent='❓'});lock=false},1100)}}};g.append(x)});b.append(g);const left=()=>cs.filter(c=>!c.done);return{check(){b.dataset.log='Пар найдено: '+(8-left().length/2)+'/8, попыток: '+tries;left().filter(c=>!c.s).forEach(c=>bad(full(c.w)));return[8-left().length/2,8]},show(){cs.forEach(c=>{c.x.textContent=c.t;c.x.classList.add('shown');c.done=true})}}}},
{e:'🎧',n:'Dictation',t:'Dictation: listen & type',i:'Нажми 🔊, послушай и напиши фразу целиком (make/do + слово). Можно слушать сколько угодно раз.',build(b){sh(W).slice(0,8).forEach(w=>{const p=el('p','row'),pl=el('button','pl','🔊'),i=el('input','ans');pl.onclick=()=>say(full(w));i.dataset.a=full(w)+(w[1].startsWith('your ')?'|'+w[0]+' my '+w[1].slice(5):'');i.dataset.k=full(w);i.size=22;i.autocomplete='off';i.spellcheck=false;i.autocapitalize='off';i.placeholder='Type what you hear…';p.append(pl,' ',i);b.append(p)});return{check(){let ok=0,n=0;b.querySelectorAll('.ans').forEach(i=>{n++;const g=i.dataset.a.split('|').includes(norm(i.value));i.classList.remove('ok','no','shown');i.classList.add(g?'ok':'no');if(g)ok++;else bad(i.dataset.k)});return[ok,n]},show(){b.querySelectorAll('.ans').forEach(i=>{i.value=i.dataset.a.split('|')[0];i.classList.remove('ok','no');i.classList.add('shown')})}}}},
{e:'🎤',n:'Production',t:'Your turn: write about your week',i:'Напиши 5–7 предложений о своей неделе или выходных. Используй минимум 6 разных фраз с make/do (в любом времени). Использованные фразы подсветятся.',build(b){const rx=W.map(w=>{const n=w[1].replace(/^(a|an|your)\s+/,''),v=w[0]=='make'?'(?:make|makes|made|making)':'(?:do|does|did|doing|done)';return new RegExp('\\b'+v+'\\s+(?:(?:a|an|the|my|your|his|her|our|their|some)\\s+)?(?:\\w+\\s+)?'+n+'\\b','i')}),ta=el('textarea');ta.placeholder='Last weekend I made plans with my friends…';const tg=el('div','tags'),sp=W.map(w=>{const s=el('span','',full(w));tg.append(s);return s}),inf=el('small','');b.append(ta,inf,tg);const used=()=>rx.map(r=>r.test(ta.value));const up=()=>{const u=used();sp.forEach((s,i)=>s.classList.toggle('on',u[i]));const n=u.filter(Boolean).length;inf.textContent=`Использовано фраз: ${n} / 6 · слов: ${ta.value.split(/\s+/).filter(Boolean).length}`;b.dataset.log=ta.value+'\n\nФразы: '+W.filter((w,i)=>u[i]).map(full).join(', ')};ta.oninput=up;up();return{check(){up();return[Math.min(used().filter(Boolean).length,6),6]},show(){ta.value='Last weekend I made plans with my friends. First, I did my homework and did the housework. Then I made a phone call to my grandma. I made a mistake and made an excuse. In the evening I did sport and did my best to sleep early.';up()}}}}
];
const main=$('#main'),nav=$('#nav');
S.forEach((s,i)=>{const sec=el('section','sec'),b=el('div','body'),ct=el('div','ctl'),sc=el('span','sc');sec.append(el('h2','',`${s.e} ${s.t}`),el('p','intro',s.i),b,ct);s.box=b;let H;const go=()=>{b.innerHTML='';sc.textContent='';b.dataset.log='';H=s.build(b)};const mk=(l,f)=>{const x=el('button','btn',l);x.onclick=f;ct.append(x)};go();
mk('✔ Проверить',()=>{const[o,n]=H.check();sc.textContent=`${o} / ${n}`+(o==n?' 🎉':'')});mk('👀 Ответы',()=>H.show());mk('🔄 Заново',go);ct.append(sc);main.append(sec);
const n=el('button','',`${s.e} ${s.n}`);n.onclick=()=>{document.querySelectorAll('.sec').forEach((x,j)=>x.classList.toggle('on',j==i));nav.querySelectorAll('button').forEach((x,j)=>x.classList.toggle('on',j==i))};nav.append(n)});
nav.firstChild.click();
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2200)};
const txt=n=>n.tagName=='INPUT'?'['+n.value+']':n.textContent;
$('#cp').onclick=()=>{const t=`Имя: ${$('#nm').value||'—'}\n\n`+S.map((s,i)=>`${i+1}. ${s.t}\n`+(s.box.dataset.log||[...s.box.querySelectorAll('.row')].map(r=>[...r.childNodes].map(txt).join('')).join('\n'))).join('\n\n')+'\n\nПроблемные слова: '+(Object.entries(P).map(([k,n])=>k+' ×'+n).join(', ')||'нет');
const fb=()=>{const a=el('textarea');a.value=t;document.body.append(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove()};
(navigator.clipboard?navigator.clipboard.writeText(t).catch(fb):Promise.resolve(fb())).then(()=>toast('Скопировано ✅'))};
</script></body></html>
