<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Personal information: повторение</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f5fb;--card:#fff;--ink:#17244f;--mut:#5b6689;--line:#d5dcee;--ok:#1b8a5a;--bad:#d4303f;--acc:#2b4bd6;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1530;--card:#182044;--ink:#e8ecff;--mut:#9aa6d4;--line:#2b3566;--ok:#4cd39a;--bad:#ff6b78;--acc:#8ea2ff}}
:root[data-theme="dark"]{--bg:#0f1530;--card:#182044;--ink:#e8ecff;--mut:#9aa6d4;--line:#2b3566;--ok:#4cd39a;--bad:#ff6b78;--acc:#8ea2ff}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Manrope,system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0;z-index:-1;opacity:.4;background:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:26px 26px}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 60px}
h1{font:700 clamp(2.2rem,6vw,3.4rem)/1 Caveat,cursive;margin:8px 0 4px;color:var(--bad)}
h2{font:700 1.7rem/1.1 Caveat,cursive;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px 18px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:1fr 230px;gap:18px;align-items:start}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
aside{position:sticky;top:12px}
button,select{font:600 .9rem Manrope,sans-serif;color:var(--ink)}
button{cursor:pointer;background:var(--card);border:1.5px solid var(--ink);border-radius:5px;padding:6px 12px}
button:hover{background:var(--acc);color:#fff;border-color:var(--acc)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.play{padding:2px 8px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
#st{font-size:.88rem;margin-top:8px}#st.w{color:var(--bad)}#st.g{color:var(--ok)}
ol.rows{list-style:none;padding:0;margin:10px 0;counter-reset:n}
.row{counter-increment:n;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.row::before{content:counter(n)".";color:var(--mut);width:1.5em}
.lead{font-weight:600}.lead.big{font:700 1.5rem Caveat,cursive;letter-spacing:.04em}
input{font:500 1.5rem Caveat,cursive;color:var(--ink);background:transparent;border:0;border-bottom:2px solid var(--ink);min-width:240px;flex:1;max-width:520px;padding:0 4px}
select{background:var(--card);border:1.5px solid var(--ink);border-radius:5px;padding:4px}
.ok{border-color:var(--ok)!important;color:var(--ok)}.bad{border-color:var(--bad)!important;color:var(--bad)}
.hint{color:var(--mut);font-size:.85rem}.ans{color:var(--ok);font:700 1.3rem Caveat,cursive;flex-basis:100%;padding-left:1.9em}
.sc{font-weight:800;margin-left:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{border-color:var(--bad);color:var(--bad);padding:2px 8px}
.chip b{margin-left:4px}
#pw:empty::before{content:"Пока пусто. Слова с ошибками появятся здесь.";color:var(--mut);font-size:.85rem}
</style></head><body><div class="wrap">
<h1>Review: personal information</h1>
<p class="sub">Повторение на новых предложениях: пиши от руки, проверяй, копируй результат.</p>

<div class="card"><h2>Голос</h2>
<div class="bar"><select id="vs" aria-label="Голос"></select>
<label><input type="checkbox" id="slow" style="min-width:0;flex:none"> медленно</label>
<button id="test">Проверить звук</button></div>
<div id="st"></div></div>

<div class="grid"><main id="ex"></main>
<aside class="card"><h2>Проблемные слова</h2><div id="pw" class="chips"></div>
<div class="bar"><button id="clr">Очистить</button></div></aside></div>

<div class="card"><h2>Всё вместе</h2><p class="hint">Копирует задания, твои ответы, правильные ответы и результат.</p>
<div class="bar"><button id="copy">Копировать все ответы</button><span id="cm" class="hint"></span></div></div>
</div>
<script>
const $=s=>document.querySelector(s);
const norm=s=>(s||'').toLowerCase().replace(/ё/g,'е').replace(/[^\p{L}\p{N}\s]/gu,'').replace(/\s+/g,' ').trim();
const expand=a=>a.split('|').flatMap(x=>{const r=[x];if(/\b(what|where|he|she|it|who|how)'s\b/i.test(x))r.push(x.replace(/\b(what|where|he|she|it|who|how)'s\b/gi,'$1 is'));if(/\bi'm\b/i.test(x))r.push(x.replace(/\bi'm\b/gi,'I am'));return r});
const esc=s=>s.replace(/"/g,'&quot;');
const sw=s=>{const a=s.replace(/[?.!]/g,'').split(' '),o=a.join(' ');let r;do{r=a.slice().sort(()=>Math.random()-.5)}while(r.join(' ')==o);return r.join(' / ')};
const mk={
sen:([a,h])=>({l:`<span class="lead big">${sw(a)}</span>`,a,h}),
lis:([a])=>({l:`<button class="play" data-s="${esc(a)}" aria-label="Слушать">🔊</button><button class="play" data-s="${esc(a)}" data-slow="1" aria-label="Медленно">🐢</button>`,a,h:'напиши то, что услышал'}),
mis:([w,a])=>({l:w,a,h:'исправь ошибку'}),
tr:([w,a])=>({l:w,a,h:'переведи на английский'})};
const EX=[
{t:'Put the words in order',d:'Составь предложение из слов.',k:'sen',it:[['My surname is Green.','моя фамилия Грин'],['Are you married or single?','ты женат или холост?'],['She is thirty years old.','ей тридцать лет'],['What is his phone number?','какой у него номер телефона?'],['He is divorced.','он разведён'],['Where is she from?','откуда она?'],['My postcode is easy.','мой индекс простой'],['How do you spell your name?','как пишется твоё имя?']]},
{t:'Listen and write',d:'Нажми 🔊 и напиши предложение (🐢 — медленно).',k:'lis',it:[['I am from Poland.'],['He is not divorced.'],['How do you spell your surname?'],['What is his phone number?'],['My address is twelve Green Street.'],['Where is she from?'],['Are you married or single?'],['My postcode is easy.']]},
{t:'Find the mistake',d:'Найди ошибку и напиши предложение правильно.',k:'mis',it:[['She are married.','She is married.'],['Where is you from?','Where are you from?'],["He's divorce.","He's divorced.|He is divorced."],['My surname are Brown.','My surname is Brown.'],['I from Poland.',"I'm from Poland.|I am from Poland."],['How old is you?','How old are you?'],['What your address?',"What's your address?"],['I am single, and he am married.','I am single, and he is married.']]},
{t:'Translate into English',d:'Переведи предложение на английский.',k:'tr',it:[['Меня зовут Анна.',"My name is Anna.|I'm Anna."],['Мне двадцать лет.',"I'm twenty years old."],['Она разведена.','She is divorced.'],['Как пишется ваша фамилия?','How do you spell your surname?'],['Откуда он?',"Where is he from?"],["Я не женат.","I'm not married.|I'm single."],['Какой у тебя адрес?',"What's your address?"],['Какой у неё номер телефона?',"What's her phone number?"]]}];
const R=[],PW={};
EX.forEach((e,i)=>{const s=document.createElement('section');s.className='card';R[i]=[];
s.innerHTML=`<h2>Ex. ${i+1}. ${e.t}</h2><p class="sub">${e.d}</p><ol class="rows">`+e.it.map((x,j)=>{const q=mk[e.k](x);R[i][j]=q;
return `<li class="row"><span class="lead">${q.l}</span><input id="e${i}_${j}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="ответ ${j+1}">${q.h?`<span class="hint">(${q.h})</span>`:''}<span class="ans" hidden></span></li>`}).join('')+`</ol><div class="bar"><button data-c="${i}">Проверить</button><button data-a="${i}">Показать ответы</button><button data-r="${i}">Сбросить</button><span class="sc" id="sc${i}"></span></div>`;
$('#ex').appendChild(s)});
const val=(i,j)=>$(`#e${i}_${j}`).value.trim();
const ansOf=(i,j)=>expand(R[i][j].a)[0];
const isOk=(i,j)=>expand(R[i][j].a).some(a=>norm(a)==norm(val(i,j)));
function drawPW(){$('#pw').innerHTML=Object.entries(PW).sort((a,b)=>b[1]-a[1]).map(([w,n])=>`<button class="chip" data-s="${esc(w)}">${w}<b>×${n}</b></button>`).join('')}
function check(i){let ok=0;EX[i].it.forEach((x,j)=>{const el=$(`#e${i}_${j}`),v=val(i,j),g=isOk(i,j);el.classList.remove('ok','bad');if(v)el.classList.add(g?'ok':'bad');
if(g)ok++;else if(v){const got=norm(v).split(' ');norm(ansOf(i,j)).split(' ').forEach(w=>{if(w.length>1&&!got.includes(w)&&/[a-z]/.test(w))PW[w]=(PW[w]||0)+1})}});
$('#sc'+i).textContent=ok+'/8';drawPW()}
function showAns(i){$('#ex').children[i].querySelectorAll('.ans').forEach((a,j)=>{a.hidden=!a.hidden;a.textContent=a.hidden?'':'✔ '+ansOf(i,j)})}
function reset(i){const s=$('#ex').children[i];s.querySelectorAll('input').forEach(x=>{x.value='';x.classList.remove('ok','bad')});s.querySelectorAll('.ans').forEach(a=>{a.hidden=true;a.textContent=''});$('#sc'+i).textContent=''}
document.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;const d=b.dataset;
if(d.c!==undefined)check(+d.c);else if(d.a!==undefined)showAns(+d.a);else if(d.r!==undefined)reset(+d.r);else if(d.s!==undefined)speak(d.s,d.slow)});
$('#clr').onclick=()=>{for(const k in PW)delete PW[k];drawPW()};
let vs=[];const st=(t,c)=>{const s=$('#st');s.textContent=t;s.className=c||''};
function loadV(){vs=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));const sel=$('#vs');
const pref=vs.find(v=>/google us english/i.test(v.name))||vs.find(v=>/samantha/i.test(v.name))||vs.find(v=>v.lang=='en-US')||vs[0];
sel.innerHTML=vs.map((v,i)=>`<option value="${i}">${v.name} (${v.lang})</option>`).join('');
if(pref){const good=/google us english|samantha/i.test(pref.name);sel.value=vs.indexOf(pref);st('Голос: '+pref.name+(good?' ✔':' (Google US English / Samantha не найден, выбери другой в списке)'),good?'g':'w')}
else st('Английские голоса не найдены. Открой страницу в Chrome или Safari.','w')}
function speak(t,slow){if(!('speechSynthesis' in window)){st('Браузер не поддерживает озвучку.','w');return}
speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t),v=vs[+$('#vs').value];if(v)u.voice=v;u.lang=v?v.lang:'en-US';u.rate=(slow||$('#slow').checked)?.6:.9;
u.onerror=e=>{if(!/interrupted|canceled/.test(e.error))st('Ошибка аудио: '+e.error+'. Проверь звук и выбери другой голос.','w')};speechSynthesis.speak(u)}
if('speechSynthesis' in window){loadV();speechSynthesis.onvoiceschanged=loadV}else st('Браузер не поддерживает озвучку.','w');
$('#test').onclick=()=>{speak("Audio test. What is your name?");const v=vs[+$('#vs').value];if(v)st('Играет: '+v.name+'. Если звука нет, проверь громкость или выбери другой голос.','g')};
$('#copy').onclick=async()=>{let o='Review: personal information\n';
EX.forEach((e,i)=>{o+=`\nExercise ${i+1}. ${e.t}\n`;e.it.forEach((x,j)=>{const q=R[i][j],lead=e.k=='lis'?'[audio]':q.l.replace(/<[^>]+>/g,'');
o+=`${j+1}. ${lead} | Student: ${val(i,j)||'—'} | Correct: ${ansOf(i,j)} | ${val(i,j)?(isOk(i,j)?'OK':'MISTAKE'):'not answered'}\n`})});
const p=Object.entries(PW).map(([w,n])=>w+' ×'+n).join(', ');o+=`\nProblem words: ${p||'none'}\n`;
try{await navigator.clipboard.writeText(o)}catch(_){const t=document.createElement('textarea');t.value=o;document.body.appendChild(t);t.select();try{document.execCommand('copy')}catch(__){}t.remove()}
$('#cm').textContent='Скопировано ✔'};
</script></body></html>
