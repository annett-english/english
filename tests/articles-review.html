<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Артикли — повторение</title>
<style>
:root{--bg:#f6f7fb;--c:#fff;--t:#1d2433;--m:#5d6679;--b:#d9deea;--ac:#3a5bd9;--ok:#1f8a4c;--okb:#e3f5ea;--no:#c0392b;--nob:#fde8e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171f;--c:#1e2330;--t:#e8ebf3;--m:#9aa3b8;--b:#343b4f;--ac:#7b96ff;--ok:#5fd18a;--okb:#18362a;--no:#ff8a7d;--nob:#3d2220}}
:root[data-theme="dark"]{--bg:#14171f;--c:#1e2330;--t:#e8ebf3;--m:#9aa3b8;--b:#343b4f;--ac:#7b96ff;--ok:#5fd18a;--okb:#18362a;--no:#ff8a7d;--nob:#3d2220}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 14px 60px}
h1{font-size:1.6rem;margin:.2em 0}.sub{color:var(--m);margin:0 0 18px}
section{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:16px;margin-bottom:18px}
h2{font-size:1.15rem;margin:0 0 2px}.d{color:var(--m);font-size:.9rem;margin:0 0 12px}
.item{padding:10px 0;border-top:1px solid var(--b)}.q{margin:0 0 8px;font-weight:500}
.o{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
button{font:inherit;cursor:pointer;border:1px solid var(--b);background:var(--c);color:var(--t);border-radius:10px;padding:7px 12px;text-align:left}
button:hover{border-color:var(--ac)}button.sel{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac) inset}
button.ok{background:var(--okb);border-color:var(--ok)}button.bad{background:var(--nob);border-color:var(--no)}
input[type=text],textarea{font:inherit;width:100%;border:1px solid var(--b);border-radius:8px;padding:7px 10px;background:var(--bg);color:var(--t)}
textarea{min-height:140px;resize:vertical}
.ok.f{background:var(--okb);border-color:var(--ok)}.bad.f{background:var(--nob);border-color:var(--no)}
.ex{margin-top:8px;font-size:.9rem;color:var(--m);padding-left:10px;border-left:3px solid var(--ac)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.bar .p{background:var(--ac);color:#fff;border-color:var(--ac)}.sc{font-weight:600;margin-left:auto}
ul.ck{list-style:none;padding:0;margin:10px 0}ul.ck li{padding:4px 0;color:var(--m)}ul.ck li.y{color:var(--ok);font-weight:600}
</style></head><body><main>
<h1>🔁 Артикли — повторение</h1>
<p class="sub">3 упражнения: Rephrase, Write about yourself, Two truths and a lie.</p>
<div id="app"></div>
</main>
<script>
const nm=v=>v.toLowerCase().replace(/[’‘`]/g,"'").replace(/[.,!?;:]/g,"").replace(/\s+/g," ").trim();
const RE=[
["Say it with a superlative: Nobody in the class is taller than Tom.",/^tom is the tallest( boy| student| pupil| person| one)? in (the|our) class$/,"Tom is the tallest in the class.",`Превосходная степень → <b>the tallest</b>.`],
["Rewrite with “by”: I travel to work on a bus.",/^i travel to work by bus$/,"I travel to work by bus.",`<b>by bus</b> — после by без артикля; <b>to work</b> — тоже без артикля.`],
["Rewrite with ’s: the car of my mother",/^my (mother|mum|mom)'s car$/,"my mother’s car",`Притяжательное ’s вместо the … of; артикля нет.`],
["Write two sentences: “I have a cat.” and then say that the cat is black.",/^i have a cat the cat is black$/,"I have a cat. The cat is black.",`Первое упоминание — <b>a cat</b>, повторное — <b>the cat</b>.`],
["Make it shorter with “go”: I’m going to my home.",/^i(')?m going home$|^i am going home$/,"I’m going home.",`<b>go home</b> — без to, без артикля и без my.`],
["Say with “have”: Мы обедаем в час.",/^we have lunch at (1|one)( o'clock| pm)?$/,"We have lunch at one o’clock.",`Приём пищи — без артикля: <b>have lunch</b>.`],
["Add the right article: Sun is a star.",/^the sun is a star$/,"The sun is a star.",`Солнце одно — <b>the sun</b>; <b>a star</b> — одна из многих звёзд.`]
].map(x=>({q:x[0],r:x[1],a:x[2],e:x[3]}));
const TL=[
[["I usually go to school by bus.","I have the breakfast at 7.","My brother’s room is big."],1,"Приём пищи — без артикля: <b>have breakfast</b>."],
[["The sun is a star.","She is the tallest girl in the class.","I go to the work at 9."],2,"Надо <b>go to work</b> — обычное назначение места."],
[["I saw a cat. The cat was black.","We go home by the train.","Dogs are friendly."],1,"После by без артикля: <b>by train</b>."],
[["Let’s have a pizza.","This is the my phone.","I have lunch at one."],1,"Артикль и притяжательное не сочетаются: <b>my phone</b>."],
[["He is best player in our team.","I need an umbrella.","The Moon goes around the Earth."],0,"Нужно <b>the best player</b> — превосходная степень."],
[["I go to bed at ten.","The cats are cute animals.","She has dinner at six."],1,"О кошках вообще — <b>Cats are cute animals</b>."],
[["I live in a small town.","He goes to the university by car.","The internet is useful."],1,"<b>go to university</b> — обычное назначение места, без артикля."]
].map(x=>({q:"Какое предложение — «ложь» (в нём ошибка с артиклем)?",o:x[0],a:x[1],e:x[2]}));
const WR=[
["a / an — первое упоминание",/\b(a|an) [a-z]+/i],
["the + превосходная степень (the biggest, the best…)",/\bthe (best|worst|biggest|largest|smallest|oldest|youngest|tallest|shortest|longest|nicest|fastest|cheapest|happiest|funniest|easiest|hardest|newest|greatest|most [a-z]+)\b/i],
["have / has breakfast, lunch или dinner (без артикля)",/\b(have|has|had|having) (breakfast|lunch|dinner)\b/i],
["by + транспорт (by bus, by car, by train…)",/\bby (car|bus|train|bike|bicycle|plane|metro|tram|taxi|foot|subway)\b/i],
["go to work / school / university / bed или go home",/\b(go|goes|going|went) (to (work|school|university|bed)|home)\b/i]];
const SAMPLE="I live in a small flat in Kraków. My room is the biggest in the flat. I have breakfast at seven. I go to university by tram. After lessons I go home.";
const EX=[{t:"1. Rephrase",d:"Перепиши предложение по заданию. Регистр и точка не важны.",k:"r",items:RE},{t:"2. Write about yourself",d:"Напиши 5 предложений о себе. В них должны быть все 5 структур — счётчик обновляется по ходу письма.",k:"w"},{t:"3. Two truths and a lie",d:"В каждой тройке два предложения правильные, одно — «ложь» (ошибка с артиклем). Найди его.",k:"c",items:TL}];
const app=document.getElementById("app");
function build(xi){
  const x=EX[xi],s=document.createElement("section");
  s.innerHTML=`<h2>${x.t}</h2><p class="d">${x.d}</p>`;
  const bar=document.createElement("div");bar.className="bar";
  bar.innerHTML=`<button class="p">Проверить</button><button>${x.k==="w"?"Показать пример":"Показать ответы"}</button><button>Сначала</button><span class="sc"></span>`;
  const [bc,bs,br]=bar.querySelectorAll("button"),sc=bar.querySelector(".sc");
  br.onclick=()=>s.replaceWith(build(xi));
  if(x.k==="w"){
    const ta=document.createElement("textarea");ta.placeholder="I live in …";
    const ul=document.createElement("ul");ul.className="ck";
    ul.innerHTML=WR.map(w=>`<li>⬜ ${w[0]}</li>`).join("");
    const info=document.createElement("div");info.className="ex";info.hidden=true;
    s.append(ta,ul,bar,info);
    const upd=(final)=>{let n=0;[...ul.children].forEach((li,i)=>{const y=WR[i][1].test(ta.value);if(y)n++;li.className=y?"y":"";li.textContent=(y?"✅ ":"⬜ ")+WR[i][0]});
      const sn=ta.value.split(/[.!?]+/).filter(t=>t.trim()).length;
      sc.textContent=`Структур: ${n}/5 · предложений: ${sn}`;
      if(final){info.hidden=false;info.innerHTML=n===5?"Отлично, все структуры использованы! 🎉 Проверь ещё, что артикли стоят по правилам.":"Добавь недостающие структуры (отмечены ⬜). Не хватает: "+[...ul.children].map((l,i)=>l.className?"":WR[i][0]).filter(Boolean).join("; ")+"."}};
    ta.oninput=()=>upd(false);bc.onclick=()=>upd(true);
    bs.onclick=()=>{ta.value=SAMPLE;upd(false);info.hidden=false;info.innerHTML="Пример: <b>a</b> small flat · <b>the</b> biggest · have breakfast · <b>by</b> tram + go to university · go home."};
    upd(false);return s;
  }
  const els=[];
  x.items.forEach((it,i)=>{
    const d=document.createElement("div");d.className="item";it.sel=null;
    d.innerHTML=`<p class="q">${i+1}. ${it.q}</p>`+(x.k==="r"?'<input type="text" autocomplete="off" placeholder="Твой вариант…">':'<div class="o">'+it.o.map((o,j)=>`<button data-j="${j}">${o}</button>`).join("")+"</div>")+'<div class="ex" hidden></div>';
    if(x.k==="c")d.querySelectorAll("button").forEach(b=>b.onclick=()=>{it.sel=+b.dataset.j;d.querySelectorAll("button").forEach(c=>c.classList.toggle("sel",c===b))});
    els.push(d);s.appendChild(d);
  });
  s.appendChild(bar);
  function run(rev){
    let n=0;
    x.items.forEach((it,i)=>{
      const d=els[i],e=d.querySelector(".ex");
      if(x.k==="r"){
        const inp=d.querySelector("input");if(rev)inp.value=it.a;
        const raw=inp.value.trim(),ok=raw&&it.r.test(nm(raw));if(ok)n++;
        inp.classList.remove("ok","bad","f");if(raw){inp.classList.add("f",ok||rev?"ok":"bad")}
        e.hidden=!(rev||raw);e.innerHTML=(ok||rev?"✔ ":"✘ Ответ: <b>"+it.a+"</b>. ")+it.e;
      }else{
        const bs_=d.querySelectorAll("button");bs_.forEach(b=>b.classList.remove("ok","bad"));
        if(it.sel===it.a)n++;
        if(rev)bs_[it.a].classList.add("ok");
        else if(it.sel!==null){bs_[it.sel].classList.add(it.sel===it.a?"ok":"bad");bs_[it.a].classList.add("ok")}
        e.hidden=!(rev||it.sel!==null);e.innerHTML=it.e;
      }
    });
    sc.textContent=rev?"":`Верно: ${n} из ${x.items.length}`;
  }
  bc.onclick=()=>run(false);bs.onclick=()=>run(true);
  return s;
}
EX.forEach((_,i)=>app.appendChild(build(i)));
</script></body></html>
