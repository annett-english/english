<!DOCTYPE html>
<html lang="ru">
<head>

<title>Еда: исчисляемые и неисчисляемые существительные</title>
<style>

    --accent-light:#eef2ff;

  .word-card .en{font-weight:600;font-size:14.5px;}
  .word-card .ipa{color:var(--accent);font-size:12.5px;}

  .type-U{background:#f97316;}
  .play-btn{

    background:#4f46e5;
    color:#fff;
    width:32px;height:32px;
    border-radius:50%;
    cursor:pointer;
    font-size:14px;

  }

    gap:24px;
    align-items:flex-start;

  .side-col{
    width:260px;

  }

    .layout{flex-direction:column;}
    .side-col{width:100%;position:static;}
  }

  .sidebar-box{
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:0 6px 20px rgba(0,0,0,.06);

  }

  .empty-msg{color:var(--muted);font-size:13px;}

    border-radius:var(--radius);

<script>
/* ================= DATA ================= */
const words = [

  {key:"strawberry", en:"a strawberry", bare:"strawberry", ipa:"/ˈstrɔːbəri/",ru:"клубника",  emoji:"🍓", type:"C"},
  {key:"melon",      en:"a melon",      bare:"melon",      ipa:"/ˈmelən/",    ru:"дыня",      emoji:"🍈", type:"C"},
  {key:"pear",       en:"a pear",       bare:"pear",       ipa:"/peər/",      ru:"груша",     emoji:"🍐", type:"C"},
  {key:"cheese",     en:"cheese",       bare:"cheese",     ipa:"/tʃiːz/",     ru:"сыр",       emoji:"🧀", type:"U"},
  {key:"butter",     en:"butter",       bare:"butter",     ipa:"/ˈbʌtər/",    ru:"масло",     emoji:"🧈", type:"U"},
  {key:"egg",        en:"an egg",       bare:"egg",        ipa:"/eɡ/",        ru:"яйцо",      emoji:"🥚", type:"C"},
  {key:"milk",       en:"milk",         bare:"milk",       ipa:"/mɪlk/",      ru:"молоко",    emoji:"🥛", type:"U"},
  {key:"fish",       en:"fish",         bare:"fish",       ipa:"/fɪʃ/",       ru:"рыба",      emoji:"🐟", type:"U"},

function norm(s){
  return (s||"").toLowerCase().trim().replace(/[.,!?;:]+$/,"").replace(/\s+/g," ");
}
function normStrict(s){
  return (s||"").toLowerCase().replace(/[^a-zа-я\s]/gi,"").replace(/\s+/g," ").trim();
}

const exercises = [
  {
    id:"ex1",
    title:"Упражнение 1. Перевод с русского на английский",
    instr:"Переведите слово на английский язык (не забудьте a / an, если нужно).",
    type:"text",
    items:[

      {word:"cheese",     prompt:"сыр", accept:["cheese"]},

      {word:"milk",       prompt:"молоко", accept:["milk"]},
      {word:"pear",       prompt:"груша", accept:["a pear","pear"]},

    type:"audio",
    items:[

      {word:"orange",     audio:"an orange", accept:["an orange"]},
      {word:"pear",       audio:"a pear", accept:["a pear"]},
      {word:"milk",       audio:"milk", accept:["milk"]},
      {word:"egg",        audio:"an egg", accept:["an egg"]},
      {word:"strawberry", audio:"a strawberry", accept:["a strawberry"]},
      {word:"butter",     audio:"butter", accept:["butter"]},
      {word:"fish",       audio:"fish", accept:["fish"]},
      {word:"melon",      audio:"a melon", accept:["a melon"]},
      {word:"orange",     audio:"oranges", accept:["oranges"]},
    ]
  },
  {
    id:"ex3",
    title:"Упражнение 3. Исчисляемое или неисчисляемое?",
    instr:"Напишите «исч» — если слово исчисляемое, или «неисч» — если неисчисляемое.",
    type:"classify",
    items:[
      {word:"butter",     prompt:"butter", answer:"U"},
      {word:"pear",       prompt:"a pear", answer:"C"},
      {word:"fish",       prompt:"fish", answer:"U"},
      {word:"egg",        prompt:"an egg", answer:"C"},
      {word:"milk",       prompt:"milk", answer:"U"},
      {word:"orange",     prompt:"an orange", answer:"C"},
      {word:"cheese",     prompt:"cheese", answer:"U"},
      {word:"strawberry", prompt:"a strawberry", answer:"C"},

    items:[

      {word:"cheese",     emoji:"🧀", accept:["cheese"]},
      {word:"melon",      emoji:"🍈", accept:["a melon","melon"]},
      {word:"egg",        emoji:"🥚", accept:["an egg","egg"]},

      {word:"butter",     emoji:"🧈", accept:["butter"]},
      {word:"orange",     emoji:"🍊", accept:["an orange","orange"]},

  {

    type:"correct",
    items:[
      {word:"fish", prompt:"I eat a fish every day.",
        accept:["i eat fish every day"],
        rule:n=>/\bfish\b/.test(n) && !/\ba fish\b/.test(n)},
      {word:"milk", prompt:"I have three milk in the fridge.",
        accept:["i have milk in the fridge","i have some milk in the fridge"],
        rule:n=>/\bmilk\b/.test(n) && !/\bthree milk\b/.test(n)},
      {word:"butter", prompt:"She bought a butter at the shop.",
        accept:["she bought butter at the shop"],
        rule:n=>/\bbutter\b/.test(n) && !/\ba butter\b/.test(n)},
      {word:"cheese", prompt:"There is an cheese on the table.",
        accept:["there is cheese on the table"],
        rule:n=>/\bcheese\b/.test(n) && !/\ban cheese\b/.test(n)},
      {word:"pear", prompt:"He ate two pear this morning.",
        accept:["he ate two pears this morning"],
        rule:n=>/\bpears\b/.test(n)},
      {word:"milk", prompt:"I want an milk, please.",
        accept:["i want milk please","i want some milk please"],
        rule:n=>/\bmilk\b/.test(n) && !/\ban milk\b/.test(n)},
      {word:"egg", prompt:"This is egg.",
        accept:["this is an egg"],
        rule:n=>/\ban egg\b/.test(n)},
      {word:"fish", prompt:"I like a fish.",
        accept:["i like fish"],
        rule:n=>/\bfish\b/.test(n) && !/\ba fish\b/.test(n)},
      {word:"strawberry", prompt:"She has a many strawberries.",
        accept:["she has many strawberries"],
        rule:n=>/\bmany strawberries\b/.test(n)},
      {word:"orange", prompt:"I bought a oranges.",

/* ================= AUDIO ================= */
let cachedVoice = null;
function pickVoice(){
  const voices = window.speechSynthesis ? speechSynthesis.getVoices() : [];
  if(!voices || voices.length===0) return null;
  return voices.find(v=>/Google US English/i.test(v.name)) ||
         voices.find(v=>v.lang==="en-US") ||
         voices.find(v=>/en/i.test(v.lang)) ||
         voices[0];
}
function ensureVoices(cb){
  if(!('speechSynthesis' in window)){ cb(null); return; }
  let v = pickVoice();
  if(v){ cb(v); return; }
  speechSynthesis.onvoiceschanged = ()=>{ cb(pickVoice()); };
  // fallback in case event never fires
  setTimeout(()=>{ if(!cachedVoice) cb(pickVoice()); }, 400);
}
function speak(text){
  if(!('speechSynthesis' in window)){
    alert("Ваш браузер не поддерживает озвучивание (Web Speech API).");
    return;
  }
  speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = "en-US";
  utter.rate = 0.85;
  ensureVoices(v=>{
    if(v){ utter.voice = v; cachedVoice = v; }
    speechSynthesis.speak(utter);
  });
}

/* ================= PROBLEM WORDS TRACKING ================= */
const problemCounts = {}; // key -> count
function markProblem(wordKey){
  problemCounts[wordKey] = (problemCounts[wordKey]||0) + 1;
  renderProblemTable();
}
function renderProblemTable(){
  const tbody = document.querySelector("#problemTable tbody");
  const emptyMsg = document.getElementById("problemEmpty");
  const entries = Object.entries(problemCounts).sort((a,b)=>b[1]-a[1]);
  tbody.innerHTML = "";
  if(entries.length===0){
    emptyMsg.style.display = "block";
    document.getElementById("problemTable").style.display = "none";
    return;
  }
  emptyMsg.style.display = "none";
  document.getElementById("problemTable").style.display = "table";
  entries.forEach(([key,count])=>{
    const w = words.find(w=>w.key===key);
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${w ? w.en : key}</td><td>${count}</td>`;
    tbody.appendChild(tr);
  });
}

/* ================= RENDER REMINDER ================= */
function renderWordGrid(){
  const grid = document.getElementById("wordGrid");
  grid.innerHTML = "";
  words.forEach(w=>{
    const card = document.createElement("div");
    card.className = "word-card";
    card.innerHTML = `
      <div class="emoji">${w.emoji}</div>
      <div class="info">
        <div class="en">${w.en} <span class="type-tag type-${w.type}">${w.type==="C"?"исч.":"неисч."}</span></div>
        <div class="ipa">${w.ipa}</div>
        <div class="ru">${w.ru}</div>
      </div>
      <button class="play-btn" title="Прослушать">🔊</button>
    `;
    card.querySelector(".play-btn").addEventListener("click", ()=>speak(w.en));
    grid.appendChild(card);
  });
}

/* ================= RENDER EXERCISES ================= */
function checkAnswer(item, rawValue){
  const val = item.type === undefined ? rawValue : rawValue;
  if(item.answer !== undefined){
    // classification exercise
    const v = norm(rawValue).replace(/\./g,"");
    const isC = /^(c|исч|исчисляемое)$/i.test(v);
    const isU = /^(u|неисч|неисчисляемое)$/i.test(v);
    if(item.answer==="C") return isC;
    if(item.answer==="U") return isU;
    return false;
  }
  const strict = normStrict(rawValue);
  const acceptStrict = (item.accept||[]).map(normStrict);
  if(acceptStrict.includes(strict)) return true;
  if(item.rule && item.rule(strict)) return true;
  // also allow loose (light) comparison ignoring articles for text/picture/audio types
  const loose = norm(rawValue);
  const acceptLoose = (item.accept||[]).map(norm);
  return acceptLoose.includes(loose);
}

function correctAnswerLabel(item){
  if(item.answer!==undefined){
    return item.answer==="C" ? "исч. (C)" : "неисч. (U)";
  }
  return item.accept[0];
}

function renderExercises(){
  const root = document.getElementById("exercisesRoot");
  root.innerHTML = "";
  exercises.forEach((ex, exIndex)=>{
    const section = document.createElement("section");
    section.className = "exercise";
    section.id = ex.id;

    const header = document.createElement("h2");
    header.innerHTML = `<span class="ex-num">${exIndex+1}</span> ${ex.title}`;
    section.appendChild(header);

    const instr = document.createElement("p");
    instr.className = "ex-instructions";
    instr.textContent = ex.instr;
    section.appendChild(instr);

    ex.items.forEach((item, i)=>{
      const row = document.createElement("div");
      row.className = "item-row";
      row.dataset.exIndex = exIndex;
      row.dataset.itemIndex = i;

      const idx = document.createElement("div");
      idx.className = "item-index";
      idx.textContent = (i+1)+".";
      row.appendChild(idx);

      const promptEl = document.createElement("div");
      promptEl.className = "item-prompt";

      if(ex.type === "text"){
        promptEl.innerHTML = `<span class="rus">${item.prompt}</span>`;
      } else if(ex.type === "audio"){
        promptEl.innerHTML = `<button class="mini-play" type="button">🔊 Слушать</button>`;
      } else if(ex.type === "classify"){
        promptEl.innerHTML = `<span class="rus">${item.prompt}</span>`;
      } else if(ex.type === "picture"){
        promptEl.innerHTML = `<span class="item-emoji">${item.emoji}</span>`;
      } else if(ex.type === "correct"){
        promptEl.innerHTML = `<span class="sentence-wrong">“${item.prompt}”</span>`;
      }
      row.appendChild(promptEl);

      if(ex.type === "audio"){
        promptEl.querySelector(".mini-play").addEventListener("click", ()=>speak(item.audio));
      }

      const input = document.createElement("input");
      input.type = "text";
      input.className = "answer-input";
      input.autocomplete = "off";
      input.spellcheck = false;
      input.placeholder = ex.type === "classify" ? "исч / неисч" : "напишите ответ...";
      row.appendChild(input);

      const feedback = document.createElement("div");
      feedback.className = "feedback-icon";
      row.appendChild(feedback);

      const reveal = document.createElement("div");
      reveal.className = "answer-reveal";
      reveal.textContent = "Правильный ответ: " + correctAnswerLabel(item);
      row.appendChild(reveal);

      section.appendChild(row);
    });

    const footer = document.createElement("div");
    footer.className = "ex-footer";
    footer.innerHTML = `
      <button class="action-btn btn-check" data-action="check">Проверить ответы</button>
      <button class="action-btn btn-show" data-action="show">Показать ответы</button>
      <button class="action-btn btn-reset" data-action="reset">Очистить</button>
      <span class="score-badge" data-score></span>
    `;
    section.appendChild(footer);

    footer.querySelector('[data-action="check"]').addEventListener("click", ()=>gradeExercise(exIndex, section));
    footer.querySelector('[data-action="show"]').addEventListener("click", ()=>{
      section.querySelectorAll(".answer-reveal").forEach(r=>r.classList.add("show"));
    });
    footer.querySelector('[data-action="reset"]').addEventListener("click", ()=>{
      section.querySelectorAll(".answer-input").forEach(inp=>{
        inp.value = "";
        inp.classList.remove("correct","incorrect");
      });
      section.querySelectorAll(".answer-reveal").forEach(r=>r.classList.remove("show"));
      section.querySelector("[data-score]").textContent = "";
    });

    root.appendChild(section);
  });
}

function gradeExercise(exIndex, section){
  const ex = exercises[exIndex];
  const rows = section.querySelectorAll(".item-row");
  let correctCount = 0;
  rows.forEach((row, i)=>{
    const item = ex.items[i];
    const input = row.querySelector(".answer-input");
    const ok = checkAnswer(item, input.value);
    input.classList.remove("correct","incorrect");
    input.classList.add(ok ? "correct" : "incorrect");
    if(ok){
      correctCount++;
    } else {
      markProblem(item.word);
    }
  });
  section.querySelector("[data-score]").textContent = `Результат: ${correctCount}/${ex.items.length}`;
}

function gradeAll(){
  let totalCorrect = 0, totalItems = 0;
  document.querySelectorAll(".exercise").forEach((section, exIndex)=>{
    gradeExercise(exIndex, section);
    const scoreText = section.querySelector("[data-score]").textContent;
    const m = scoreText.match(/(\d+)\/(\d+)/);
    if(m){ totalCorrect += parseInt(m[1]); totalItems += parseInt(m[2]); }
  });
  document.getElementById("totalScore").innerHTML =
    `Общий результат: <b>${totalCorrect} / ${totalItems}</b>`;
}

function collectAllAnswers(){
  let lines = [];
  const now = new Date();
  lines.push("Ответы студента — " + now.toLocaleString());
  lines.push("=".repeat(50));
  document.querySelectorAll(".exercise").forEach((section, exIndex)=>{
    const ex = exercises[exIndex];
    lines.push("");
    lines.push(ex.title);
    const rows = section.querySelectorAll(".item-row");
    rows.forEach((row, i)=>{
      const input = row.querySelector(".answer-input");
      const val = input.value.trim();
      lines.push(`  ${i+1}. ${val || "(пусто)"}`);
    });
  });
  const scoreLine = document.getElementById("totalScore").textContent;
  if(scoreLine){
    lines.push("");
    lines.push(scoreLine);
  }
  return lines.join("\n");
}

function downloadAnswers(){
  const text = collectAllAnswers();
  const blob = new Blob([text], {type:"text/plain;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "moi_otvety.txt";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function resetAll(){
  document.querySelectorAll(".answer-input").forEach(inp=>{
    inp.value = "";
    inp.classList.remove("correct","incorrect");
  });
  document.querySelectorAll(".answer-reveal").forEach(r=>r.classList.remove("show"));
  document.querySelectorAll("[data-score]").forEach(s=>s.textContent = "");
  document.getElementById("totalScore").textContent = "";
  for(const k in problemCounts) delete problemCounts[k];
  renderProblemTable();
}

/* ================= INIT ================= */
renderWordGrid();
renderExercises();
renderProblemTable();
document.getElementById("checkAllBtn").addEventListener("click", gradeAll);
document.getElementById("downloadBtn").addEventListener("click", downloadAnswers);
document.getElementById("resetAllBtn").addEventListener("click", resetAll);

// warm up voice list (some browsers need a nudge)
if('speechSynthesis' in window){
  speechSynthesis.getVoices();
}
</script>
