<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Jeopardy A2</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:#0b1a6b;color:#fff;font-family:system-ui,Arial,sans-serif;padding:10px}
h1{text-align:center;color:#ffcc00;margin:6px 0;font-size:1.6rem;letter-spacing:2px}
.teams{display:flex;gap:10px;justify-content:center;margin:8px 0}
.team{background:#12258f;border:3px solid transparent;border-radius:10px;padding:6px 14px;text-align:center;cursor:pointer;min-width:120px}
.team.on{border-color:#ffcc00}
.team b{display:block;font-size:1.5rem;color:#ffcc00}
.wrap{overflow-x:auto}
.board{display:grid;grid-template-columns:repeat(6,minmax(100px,1fr));gap:6px;min-width:660px}
.cat{background:#1a34c4;text-align:center;font-weight:700;padding:10px 4px;display:flex;align-items:center;justify-content:center;min-height:64px;font-size:.95rem;text-transform:uppercase}
.cell{background:#1a34c4;color:#ffcc00;font-size:1.8rem;font-weight:800;border:0;border-radius:4px;padding:22px 0;cursor:pointer}
.cell:hover{background:#2a48e0}
.cell.done{visibility:hidden}
#modal{display:none;position:fixed;inset:0;background:#0b1a6bf2;align-items:center;justify-content:center;padding:20px;z-index:5}
#modal.show{display:flex}
.card{max-width:640px;width:100%;text-align:center}
.pts{color:#ffcc00;font-size:1.2rem}
#h{opacity:.8;font-size:1rem}
#q{font-size:1.7rem;margin:16px 0;line-height:1.3}
#a{font-size:1.6rem;color:#ffcc00;font-weight:800;min-height:2.6rem;margin-bottom:16px}
button.b{font-size:1.1rem;padding:10px 18px;margin:4px;border:0;border-radius:8px;cursor:pointer;font-weight:700}
.ok{background:#2ecc71}.no{background:#e74c3c;color:#fff}.sh{background:#ffcc00}.sk{background:#888;color:#fff}
</style></head><body>
<h1>JEOPARDY · A2</h1>
<div class="teams">
<div class="team on" id="t0" onclick="sel(0)">Team 1<b id="s0">0</b></div>
<div class="team" id="t1" onclick="sel(1)">Team 2<b id="s1">0</b></div>
</div>
<div class="wrap"><div class="board" id="board"></div></div>
<div id="modal"><div class="card">
<div class="pts" id="p"></div><div id="h"></div><div id="q"></div><div id="a"></div>
<button class="b sh" onclick="reveal()">Показать ответ</button>
<button class="b ok" onclick="fin(1)">✔ Верно</button>
<button class="b no" onclick="fin(-1)">✘ Неверно</button>
<button class="b sk" onclick="fin(0)">Закрыть</button>
</div></div>
<script>
/* [category, hint, [[clue, answer] x5]] */
const D=[
["Weather","What's the weather like?",[
["☀️ The sun is shining. It's ___.","sunny"],
["☁️ There are a lot of clouds. It's ___.","cloudy"],
["💨 There is a lot of wind. It's ___.","windy"],
["🌫 You can't see far. It's ___.","foggy"],
["❄️ White flakes fall from the sky. It's ___.","snowing"]]],
["Landscape","What is it?",[
["🌲 A lot of trees growing together.","a forest"],
["🏔 Very high land, snow on the top.","a mountain"],
["🌋 A mountain with hot lava inside.","a volcano"],
["🏜 Hot and dry, lots of sand, almost no water.","a desert"],
["💧 Water falls down from a high rock.","a waterfall"]]],
["Compare","comparative / superlative",[
["Russia is ___ than Poland. (big)","bigger"],
["Is English ___ than Maths? (difficult)","more difficult"],
["Everest is ___ mountain in the world. (high)","the highest"],
["This is ___ day of my life! (good)","the best"],
["Today's weather is ___ than yesterday's. (bad)","worse"]]],
["Travel","Say it in English / fill the gap",[
["забронировать билет на самолёт","book a flight"],
["We ___ by train. (go, Past Simple)","went (We went by train.)"],
["арендовать машину","rent a car"],
["I ___ some souvenirs for my family. (buy, Past Simple)","bought"],
["осуществить свои мечты","make your dreams come true"]]],
["Big numbers","Say the number!",[
["2,500","two thousand, five hundred"],
["345,678","three hundred (and) forty-five thousand, six hundred (and) seventy-eight"],
["9,876,543","nine million, eight hundred (and) seventy-six thousand, five hundred (and) forty-three"],
["12,345,678","twelve million, three hundred (and) forty-five thousand, six hundred (and) seventy-eight"],
["Без точного числа: «Сотни людей пришли на концерт.»","Hundreds of people came to the concert. (-s + of)"]]],
["Speaking","Talk for 30 seconds!",[
["🌤 Describe the weather today. What's your favourite weather?","It's sunny and warm today. I like... because..."],
["🏞 Mountains, sea or forest: which is best for a holiday? Why?","I think ... is the best because it's quieter / more beautiful than..."],
["🆚 Compare two cities or countries you know.","... is bigger / more interesting than... but ... is the cheapest / the most beautiful."],
["✈️ Tell us about your last holiday: where, how, where did you stay, what did you do?","Last summer we went by ... We stayed in ... We visited... We had a really good time."],
["🌍 Your dream trip: where, how much does it cost, how many tourists go there?","My dream is to go to ... Thousands of tourists... It can make my dream come true."]]]
];
let cur=null,team=0,sc=[0,0];
const bd=document.getElementById('board');
D.forEach(c=>{const d=document.createElement('div');d.className='cat';d.textContent=c[0];bd.appendChild(d)});
for(let r=0;r<5;r++)D.forEach((c,i)=>{const b=document.createElement('button');b.className='cell';b.textContent=(r+1)*100;b.onclick=()=>open_(b,i,r);bd.appendChild(b)});
function open_(b,i,r){cur=b;p.textContent=D[i][0]+' · '+(r+1)*100;h.textContent=D[i][1];q.textContent=D[i][2][r][0];a.textContent='';a.dataset.v=D[i][2][r][1];a.dataset.pt=(r+1)*100;modal.classList.add('show')}
function reveal(){a.textContent=a.dataset.v}
function fin(k){if(k)sc[team]+=k*a.dataset.pt;document.getElementById('s'+team).textContent=sc[team];cur.classList.add('done');modal.classList.remove('show')}
function sel(i){team=i;t0.classList.toggle('on',i==0);t1.classList.toggle('on',i==1)}
</script></body></html>
