<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Shopping Vocabulary: Review</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f4ef;--cd:#fff;--tx:#1d2330;--mu:#6a7285;--ac:#2f6fed;--ok:#1f9d55;--bad:#d64545;--wn:#d99a00;--bd:#e2ddd2}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#151922;--cd:#1e2430;--tx:#e8ebf2;--mu:#98a1b5;--ac:#6b9bff;--ok:#3ec97c;--bad:#ff7070;--wn:#f2c14e;--bd:#2d3545}}
:root[data-theme=dark]{--bg:#151922;--cd:#1e2430;--tx:#e8ebf2;--mu:#98a1b5;--ac:#6b9bff;--ok:#3ec97c;--bad:#ff7070;--wn:#f2c14e;--bd:#2d3545}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1100px;margin:auto;padding:14px;display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:16px}
@media(max-width:800px){.wrap{grid-template-columns:1fr}}
aside{position:sticky;top:12px;align-self:start}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:16px}
h1{font-size:1.5rem;margin:.2em 0}h2{font-size:1.15rem;margin:0 0 4px}h3{margin:0 0 8px;font-size:1rem}
.d{color:var(--mu);font-size:.92rem;margin:0 0 12px}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:9px;padding:6px 12px}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1.5px solid var(--bd);border-radius:8px;padding:5px 8px;min-width:0}
table{width:100%;border-collapse:collapse}td{padding:5px 6px;border-bottom:1px solid var(--bd)}
.ipa{color:var(--mu)}
.row{display:flex;gap:8px;align-items:flex-start;padding:8px;border-radius:10px;border:1.5px solid transparent;flex-wrap:wrap}
.row .n{font-weight:700;color:var(--mu);min-width:1.4em}.row .q{flex:1;min-width:200px}
.row.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent)}
.row.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.rev{flex-basis:100%;margin-left:28px;color:var(--wn);font-weight:600;font-size:.93rem}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}.sc{font-weight:700}
.pw li{display:flex;justify-content:space-between}.st{font-size:.88rem;color:var(--mu)}
textarea{width:100%;box-sizing:border-box;min-height:120px;font:13px monospace;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px}
</style></head><body><div class="wrap"><main>
<div class="card"><h1>🔁 Shopping: Review</h1>
<p class="d">Повторение: 4 упражнения по 6 пунктов. Сначала прослушайте слова, затем впишите ответы и нажмите «Проверить».</p>
<div class="bar" style="margin:0 0 6px"><label>Голос: <select id="vs"></select></label><button id="all">▶ Прослушать все</button><button id="tst">🔊 Проверить звук</button></div>
<div class="st" id="stt" style="margin:0 0 10px">Рекомендуемый голос: Google US English / Samantha</div>
<table id="vt"></table></div>
<div id="ex"></div>
<div class="card"><h2>📋 Все ответы</h2><p class="d">Скопируйте ответы одной кнопкой.</p>
<div class="bar"><button class="p" id="cp">Копировать все ответы</button><span id="cps" class="sc"></span></div><textarea id="out" readonly placeholder="Здесь появится текст с ответами…" style="margin-top:10px"></textarea></div>
</main><aside><div class="card"><h3>⚠ Проблемные слова</h3><ul class="pw" id="pw" style="padding-left:18px;margin:0"></ul><button id="clr" style="margin-top:10px;font-size:.85rem">Очистить</button></div></aside></div>
<script>
const $=s=>$d(s),$d=s=>document.querySelector(s),norm=s=>s.toLowerCase().replace(/[’`]/g,"'").replace(/[^a-z0-9%£' ]/g," ").replace(/\s+/g," ").trim();
const V=[["a basket / a trolley","ˈbæskɪt / ˈtrɑːli","корзина / тележка"],["a receipt","rɪˈsiːt","чек"],["a refund","ˈriːfʌnd","возврат денег"],["get a refund","ɡet ə ˈriːfʌnd","получить возврат денег"],["a discount / a bargain","ˈdɪskaʊnt / ˈbɑːrɡən","скидка / выгодная покупка"],["a chain store","tʃeɪn stɔːr","сеть магазинов"],["a shopping centre / a mall","ˈʃɑːpɪŋ ˈsentər / mɔːl","торговый центр"],["put on a shirt","pʊt ɑːn","надеть"],["try on a shirt","traɪ ɑːn","примерить"],["It fits you","fɪts","подходит по размеру"],["It suits you","suːts","идёт, к лицу"]];
const E=[
{t:"1. Choose and write",d:"Выберите правильное слово из скобок и впишите его.",items:[
["Take a (basket / trolley) — we're buying only milk and bread.",["basket"],"basket","basket"],
["I'd like to (put on / try on) these jeans before I buy them.",["try on"],"try on","try on"],
["Blue really (fits / suits) you.",["suits"],"suit","suits"],
["Keep your (receipt / refund) in your bag.",["receipt"],"receipt","receipt"],
["It was only £5 — what a (discount / bargain)!",["bargain"],"bargain","bargain"],
["We did a big weekly shop, so we needed a (basket / trolley).",["trolley"],"trolley","trolley"]]},
{t:"2. Перевод RU → EN",d:"Напишите по-английски.",items:[
["скидка для студентов",["student discount","discount for students"],"discount","a student discount"],
["получить возврат денег",["get a refund","get the refund"],"get a refund","get a refund"],
["Это мне не подходит по размеру.",["doesn't fit me","does not fit me","doesnt fit me","don't fit me","don't fit"],"fit","It doesn't fit me."],
["торговый центр",["shopping centre","shopping center","mall"],"mall","a shopping centre / a mall"],
["надеть куртку",["put on a jacket","put on the jacket","put on my jacket","put on your jacket"],"put on","put on a jacket"],
["сетевой магазин",["chain store"],"chain store","a chain store"]]},
{t:"3. Прослушайте и впишите",d:"Нажмите 🔊 (или 🐢 — медленно) и напишите то, что услышали.",m:"dict",items:[
["get a refund",["get a refund"],"get a refund","get a refund","ɡet ə ˈriːfʌnd"],
["it fits you",["fits you"],"fit","it fits you","ɪt fɪts juː"],
["a shopping trolley",["shopping trolley","trolley"],"trolley","a shopping trolley","ə ˈʃɑːpɪŋ ˈtrɑːli"],
["try on a shirt",["try on a shirt"],"try on","try on a shirt","traɪ ɑːn ə ʃɜːrt"],
["a big discount",["big discount"],"discount","a big discount","ə bɪɡ ˈdɪskaʊnt"],
["meet at the mall",["meet at the mall"],"mall","meet at the mall","miːt æt ðə mɔːl"]]},
{t:"4. Mini-situations",d:"Завершите мини-диалоги.",items:[
["– The phone doesn't work. – Take it back to the shop and get a ___.",["refund"],"refund","refund"],
["– Can I return this? – Only if you have the ___.",["receipt"],"receipt","receipt"],
["– Does this dress look good on me? – Yes, it really ___ you.",["suits"],"suit","suits"],
["– I need a ___ — I'm buying lots of heavy things.",["trolley"],"trolley","trolley"],
["– Shall we go to the ___ on Saturday? There are lots of shops.",["mall","shopping centre","shopping center"],"mall","mall / shopping centre"],
["– It's freezing outside! – ___ your coat.",["put on"],"put on","Put on"]]}];
let voice;const st=t=>$d("#stt").textContent=t;
function pick(){if(!window.speechSynthesis)return st("⚠ Браузер не поддерживает озвучку");const vs=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)),s=$d("#vs"),cur=voice&&voice.name;s.innerHTML=vs.map((v,i)=>`<option value="${i}">${v.name} (${v.lang})</option>`).join("");
voice=vs.find(v=>v.name===cur)||vs.find(v=>/Google US English/i.test(v.name))||vs.find(v=>/Samantha/i.test(v.name))||vs.find(v=>v.lang==="en-US")||vs[0];if(voice)s.value=vs.indexOf(voice);s._v=vs}
if(window.speechSynthesis){pick();speechSynthesis.onvoiceschanged=pick}
$d("#vs").onchange=e=>{voice=e.target._v[e.target.value]};
function speak(t,r=.9,cb){if(!window.speechSynthesis){st("⚠ Браузер не поддерживает озвучку");return}speechSynthesis.cancel();setTimeout(()=>{const u=new SpeechSynthesisUtterance(t);u.lang="en-US";if(voice)u.voice=voice;u.rate=r;u.onstart=()=>st("🔊 Звук работает. Голос: "+(voice?voice.name:"по умолчанию"));u.onend=()=>cb&&cb();u.onerror=()=>{st("⚠ Не удалось воспроизвести: проверьте звук и выберите другой голос");cb&&cb()};speechSynthesis.speak(u)},60)}
$d("#tst").onclick=()=>speak("Get a refund. It suits you!");
const AL=V.flatMap(v=>v[0].split(" / "));
$d("#all").onclick=()=>{let i=0;const nx=()=>{if(i<AL.length)speak(AL[i++],.85,()=>setTimeout(nx,300))};nx()};
$d("#vt").innerHTML=V.map((v,i)=>`<tr><td><button data-s="${i}">🔊</button></td><td><b>${v[0]}</b></td><td class="ipa">/${v[1]}/</td><td>${v[2]}</td></tr>`).join("");
$d("#vt").onclick=e=>{const b=e.target.closest("[data-s]");if(b)speak(V[b.dataset.s][0].split(" / ")[0])};
let P={};try{P=JSON.parse(localStorage.getItem("pw2")||"{}")}catch(e){}
function rp(){const a=Object.entries(P).sort((x,y)=>y[1]-x[1]);$d("#pw").innerHTML=a.length?a.map(([w,c])=>`<li><span>${w}</span><b>×${c}</b></li>`).join(""):'<li style="list-style:none;color:var(--mu)">Пока ошибок нет 🎉</li>'}
function sp(w){P[w]=(P[w]||0)+1;try{localStorage.setItem("pw2",JSON.stringify(P))}catch(e){}rp()}
$d("#clr").onclick=()=>{P={};try{localStorage.removeItem("pw2")}catch(e){}rp()};rp();
$d("#ex").innerHTML=E.map((e,ei)=>{const b=e.items.map((it,i)=>{const inp=`<input id="i${ei}_${i}" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="…">`;let q;
if(e.m==="dict")q=`<button data-p="${it[0]}">🔊</button> <button data-p="${it[0]}" data-r=".55">🐢</button> ${inp}`;
else if(it[0].includes("___"))q=it[0].replace("___",inp);else q=`${it[0]} → ${inp}`;
return`<div class="row" id="r${ei}_${i}"><span class="n">${i+1}</span><div class="q">${q}</div><div class="rev" hidden></div></div>`}).join("");
return`<div class="card"><h2>${e.t}</h2><p class="d">${e.d}</p>${b}<div class="bar"><button class="p" data-a="c${ei}">Проверить</button><button data-a="s${ei}">Показать ответы</button><button data-a="r${ei}">Сбросить</button><span class="sc" id="sc${ei}"></span></div></div>`}).join("");
function chk(ei){const e=E[ei];let ok=0;e.items.forEach((it,i)=>{const v=norm($d(`#i${ei}_${i}`).value),r=$d(`#r${ei}_${i}`),g=v&&it[1].some(a=>v.includes(norm(a)));r.className="row "+(g?"ok":v?"bad":"");if(g)ok++;else if(v&&r.dataset.l!==v)sp(it[2]);r.dataset.l=v});$d(`#sc${ei}`).textContent=`${ok}/${e.items.length}`}
function shw(ei){const e=E[ei];e.items.forEach((it,i)=>{const v=$d(`#r${ei}_${i}`).querySelector(".rev");v.hidden=false;v.textContent="✔ "+it[3]+(e.m==="dict"?"   /"+it[4]+"/":"")})}
function rst(ei){$d(`#sc${ei}`).textContent="";E[ei].items.forEach((it,i)=>{const r=$d(`#r${ei}_${i}`);r.className="row";r.querySelector(".rev").hidden=true;delete r.dataset.l;$d(`#i${ei}_${i}`).value=""})}
$d("#ex").onclick=e=>{const a=e.target.closest("[data-a]"),p=e.target.closest("[data-p]");if(p)return speak(p.dataset.p,+(p.dataset.r||.9));if(a)({c:chk,s:shw,r:rst})[a.dataset.a[0]](+a.dataset.a.slice(1))};
function collect(){let o="Shopping Vocabulary: Review — ответы студента\n";E.forEach((e,ei)=>{o+=`\n${e.t}\n`;e.items.forEach((it,i)=>{const v=$d(`#i${ei}_${i}`).value.trim(),c=$d(`#r${ei}_${i}`).classList,s=c.contains("ok")?"✓":c.contains("bad")?"✗":"не проверено";o+=`${i+1}. ${e.m==="dict"?"[audio]":it[0]} → ${v||"—"}  [${s}]${s!=="✓"?"  (правильно: "+it[3]+")":""}\n`})});
const pr=Object.entries(P).sort((a,b)=>b[1]-a[1]).map(([w,c])=>`${w}×${c}`).join(", ");return o+"\nПроблемные слова: "+(pr||"нет")}
$d("#cp").onclick=async()=>{const t=collect(),o=$d("#out");o.value=t;let ok=false;try{await navigator.clipboard.writeText(t);ok=true}catch(e){try{o.select();ok=document.execCommand("copy")}catch(e2){}}$d("#cps").textContent=ok?"✓ Скопировано!":"Выделите текст ниже и скопируйте вручную";setTimeout(()=>$d("#cps").textContent="",3500)};
</script></body></html>
