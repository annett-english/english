<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Road Trip: Phrasal Verbs</title>
<style>
:root{--bg:#e8e6df;--card:#fff;--tx:#1d1f23;--mu:#5d636d;--line:#d3d0c6;--acc:#f5c400;--sign:#0b6b3a;--ok:#1a8f4d;--okb:#d9f2e3;--bad:#c92a23;--badb:#fbe0de;--sel:#fff1a8;--road:#3a3d42;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16171a;--card:#24262b;--tx:#ecebe6;--mu:#a3a8b1;--line:#3b3e45;--sign:#0f7f48;--okb:#17402b;--badb:#47201e;--sel:#5a4d00;--road:#0e0f11;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#16171a;--card:#24262b;--tx:#ecebe6;--mu:#a3a8b1;--line:#3b3e45;--sign:#0f7f48;--okb:#17402b;--badb:#47201e;--sel:#5a4d00;--road:#0e0f11;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;min-height:100%}
header{background:var(--road);padding:18px 16px 26px;position:relative;overflow:hidden}
header::after{content:"";position:absolute;left:0;right:0;bottom:11px;height:4px;background:repeating-linear-gradient(90deg,var(--acc) 0 36px,transparent 36px 64px)}
.car{position:absolute;bottom:14px;font-size:26px;animation:drive 14s linear infinite;left:-40px}
@keyframes drive{to{left:105%}}@media (prefers-reduced-motion:reduce){.car{animation:none;left:12px}}
.sign{background:var(--sign);color:#fff;border:3px solid #fff;outline:3px solid var(--sign);border-radius:10px}
h1{display:inline-block;margin:0 0 0 3px;padding:6px 16px;font:800 clamp(20px,5vw,30px)/1.15 "Arial Narrow",Arial,sans-serif;letter-spacing:.02em}
h1 small{display:block;font-size:.5em;font-weight:600;opacity:.9}
nav{display:flex;gap:8px;overflow-x:auto;padding:12px 14px;background:var(--road);border-top:2px solid #0006}
nav button{flex:none;border:2px solid #fff;background:var(--sign);color:#fff;border-radius:8px;padding:6px 11px;font:600 14px system-ui,sans-serif;cursor:pointer}
nav button[aria-selected=true]{background:var(--acc);color:#1d1f23;border-color:#1d1f23}
.wrap{display:grid;grid-template-columns:1fr 250px;gap:16px;max-width:1040px;margin:16px auto;padding:0 14px}
@media(max-width:800px){.wrap{grid-template-columns:1fr}}
main,aside .box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
aside .box{margin-bottom:14px;border-top:6px solid var(--acc)}
aside h3{margin:0 0 8px;font-size:16px}aside ul{list-style:none;margin:0;padding:0}
aside li{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--line);cursor:pointer}
aside li span{color:var(--bad);font-weight:700}.mu{color:var(--mu);font-size:14px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
h2{margin:0;font-size:20px}.lead{margin:6px 0 12px}
.b{background:var(--sign);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:600 15px system-ui,sans-serif;cursor:pointer}
.b.alt{background:transparent;color:var(--tx);border:2px solid var(--line)}
.b:focus-visible,nav button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}.sc{font-weight:700}
ol.q{padding-left:22px;margin:0}ol.q li{padding:9px 10px;margin-bottom:8px;border-radius:8px;border:1px solid var(--line)}
ol.q li.ok{background:var(--okb);border-color:var(--ok)}ol.q li.bad{background:var(--badb);border-color:var(--bad)}
.p small{display:block;color:var(--mu);font-size:13px}
input[type=text],select,textarea{width:100%;margin-top:6px;padding:8px 10px;font:inherit;color:var(--tx);background:var(--bg);border:2px solid var(--line);border-radius:8px}
.ans{color:var(--ok);font-weight:600;margin-top:4px}
table{border-collapse:collapse;width:100%}td{padding:8px 6px;border-bottom:1px dashed var(--line);vertical-align:middle}
.ipa{color:var(--mu);font-size:14px}
.play{border:2px solid var(--sign);background:transparent;border-radius:50%;width:36px;height:36px;cursor:pointer;font-size:16px}
.txt{font-size:18px;line-height:2}.txt b{font-weight:400;padding:1px 2px;border-radius:5px;cursor:pointer}
.txt b.sel{background:var(--sel)}.txt b.ok{background:var(--okb);outline:2px solid var(--ok)}
.txt b.bad{background:var(--badb);outline:2px solid var(--bad)}.txt b.miss{outline:2px dashed var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip,.tick{border:2px solid var(--line);border-radius:999px;padding:5px 12px;font-weight:600}
.chip.on{background:var(--okb);border-color:var(--ok)}
.tick{display:flex;gap:6px;align-items:center;cursor:pointer;border-radius:8px}
.tick.ok{background:var(--okb);border-color:var(--ok)}.tick.bad{background:var(--badb);border-color:var(--bad)}.tick.miss{border:2px dashed var(--bad)}
.ticks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.card{padding:34px 16px;text-align:center;min-height:170px;cursor:pointer;display:flex;flex-direction:column;justify-content:center;gap:6px}
.big{font:800 26px "Arial Narrow",Arial,sans-serif}
.wg{display:grid;gap:6px;width:max-content;margin:10px auto}.wr{display:flex;gap:6px}
.wc{width:46px;height:46px;border:2px solid var(--line);display:grid;place-items:center;font:800 22px system-ui;text-transform:uppercase;border-radius:6px}
.wc.g{background:#1a8f4d;color:#fff;border-color:#1a8f4d}.wc.y{background:#d9a400;color:#111;border-color:#d9a400}.wc.x{background:#6b7078;color:#fff;border-color:#6b7078}
.wi{display:flex;gap:8px}.wi input{margin:0;max-width:160px;text-transform:uppercase}
footer{max-width:1040px;margin:0 auto 24px;padding:0 14px}
textarea.out{height:120px;font-size:13px}
</style></head><body>
<header><div class="car">🚗</div><h1 class="sign">ROAD TRIP<small>Phrasal verbs · 6 стоп-пунктов</small></h1></header>
<nav id="nav" role="tablist"></nav>
<div class="wrap"><main id="main"></main>
<aside>
<div class="box"><h3>⚠️ Проблемные слова</h3><ul id="pw"></ul></div>
<div class="box"><h3>Звук</h3><div class="mu" id="vst"></div><select id="vs" aria-label="Голос"></select>
<div class="bar"><button class="b alt" id="vt">🔊 Проверить звук</button></div><div class="mu" id="vr"></div></div>
<div class="box"><h3>Сдать ответы</h3><input type="text" id="nm" placeholder="Ваше имя"><div class="bar"><button class="b" id="cp">📋 Скопировать мои ответы</button></div><div class="mu" id="cm"></div>
<details id="dt"><summary class="mu">Текст ответов</summary><textarea class="out" id="out" readonly></textarea></details></div>
</aside></div>
<script>
const $=(s,e=document)=>e.querySelector(s);
const sh=a=>{a=[...a];for(let i=a.length;i>1;){const j=Math.random()*i--|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const mix=(a,k)=>{let r;for(let i=0;i<80;i++){r=sh(a);if(r.every((x,j)=>!j||k(x)!==k(r[j-1])))break}return r};
const norm=s=>s.toLowerCase().replace(/[^a-z ]/g,'').replace(/\s+/g,' ').trim();
const wc=s=>s.trim().split(/\s+/).filter(Boolean).length;
const strip=s=>s.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
const V=[
{id:'lo',en:'look out / watch out',ru:'осторожно!; берегись',ipa:'/lʊk aʊt/ · /wɑːtʃ aʊt/',say:'Look out! Watch out!',ex:'Watch out! You’re going to fall!',re:/\b(look|watch)(s|ed|ing)? out\b/i,def:'to warn someone about danger'},
{id:'do',en:'drop off',ru:'подвезти и высадить; оставить',ipa:'/drɑːp ɔːf/',say:'drop off',ex:'Can you drop me off at the airport?',re:/\bdropp?(s|ed|ing)?\b.*\boff\b/i,def:'to take someone somewhere and leave them there'},
{id:'ro',en:'run out of',ru:'у кого-то закончилось',ipa:'/rʌn aʊt əv/',say:'run out of',ex:'We’ve run out of sugar. Can you buy some?',re:/\b(run|runs|ran|running) out of\b/i,def:'to use all of something so none is left'},
{id:'so',en:'set off',ru:'отправиться в путь',ipa:'/set ɔːf/',say:'set off',ex:'We set off early in the morning.',re:/\b(set|sets|setting) off\b/i,def:'to start a journey'},
{id:'eu',en:'end up',ru:'оказаться (в итоге)',ipa:'/end ʌp/',say:'end up',ex:'We took the wrong bus and ended up in the wrong place.',re:/\b(end|ends|ended|ending) up\b/i,def:'to be somewhere unplanned at the end'},
{id:'pu',en:'pick up',ru:'забрать (кого-то)',ipa:'/pɪk ʌp/',say:'pick up',ex:'I’ll pick you up at work at 5.',re:/\bpick(s|ed|ing)?\b.*\bup\b/i,def:'to collect someone or something'}];
const byId=id=>V.find(v=>v.id===id);
/* ---- audio ---- */
let voice,run=0;
const tts='speechSynthesis' in window;
function voices(){if(!tts)return;const vs=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));const sel=$('#vs'),cur=sel.value;
 sel.innerHTML=vs.map((v,i)=>`<option value="${i}">${v.name} (${v.lang})</option>`).join('');
 let k=vs.findIndex(v=>/Google US English/i.test(v.name));if(k<0)k=vs.findIndex(v=>/Samantha/i.test(v.name));if(k<0)k=vs.findIndex(v=>v.lang==='en-US');
 if(k<0)k=0;sel.value=cur&&vs[cur]?cur:k;voice=vs[sel.value];
 $('#vst').textContent=voice?'Голос: '+voice.name:'Английские голоса не найдены, будет голос по умолчанию.';sel.onchange=()=>{voice=vs[sel.value];$('#vst').textContent='Голос: '+voice.name}}
if(tts){voices();speechSynthesis.onvoiceschanged=voices}else $('#vst').textContent='⚠️ Этот браузер не поддерживает озвучку. Откройте страницу в Chrome или Safari.';
const say=t=>new Promise(r=>{if(!tts)return r();try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';if(voice)u.voice=voice;u.rate=.9;u.onend=u.onerror=()=>r();speechSynthesis.speak(u)}catch(e){r()}});
$('#vt').onclick=async()=>{const t0=Date.now();$('#vr').textContent='…играет';await say('Audio check. Can you hear me?');
 $('#vr').textContent=Date.now()-t0>900?'✅ Звук работает. Если не слышно — проверьте громкость.':'⚠️ Звук не воспроизвёлся. Проверьте громкость и выберите другой голос.'};
/* ---- problem words ---- */
const P={};
function bad(id){if(!id)return;P[id]=(P[id]||0)+1;const e=Object.entries(P).sort((a,b)=>b[1]-a[1]);
 $('#pw').innerHTML=e.map(([i,n])=>`<li data-i="${i}">${byId(i).en}<span>×${n}</span></li>`).join('')}
$('#pw').innerHTML='<li class="mu">Пока ошибок нет 👍</li>';
$('#pw').onclick=e=>{const l=e.target.closest('li[data-i]');if(l)say(byId(l.dataset.i).say)};
/* ---- generic typed quiz ---- */
function quiz(el,lead,items){
 el.innerHTML=`<p class="lead">${lead}</p><ol class="q"></ol><div class="bar"><button class="b" data-a="c">Проверить</button><button class="b alt" data-a="s">Показать ответы</button><span class="sc"></span></div>`;
 const ol=$('.q',el);
 items.forEach(it=>{const li=document.createElement('li');
  li.innerHTML=`<div class="p">${it.p}</div>`+(it.opts?`<select><option value="">—</option>${sh(it.opts).map(o=>`<option value="${o[0]}">${o[1]}</option>`).join('')}</select>`:'<input type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="введите ответ">')+'<div class="ans"></div>';ol.append(li)});
 const val=li=>$('select,input',li).value.trim();
 el.onclick=e=>{const a=e.target.dataset.a;if(!a)return;
  if(a==='c'){let n=0;[...ol.children].forEach((li,i)=>{const v=val(li),ok=v&&items[i].ok(v);li.className=ok?'ok':'bad';if(ok)n++;else if(!li.dataset.c){li.dataset.c=1;bad(items[i].v)}});$('.sc',el).textContent=`Верно: ${n} / ${items.length}`}
  else[...ol.children].forEach((li,i)=>$('.ans',li).textContent='✔ '+items[i].ans)};
 el.onkeydown=e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT')el.querySelector('[data-a=c]').click()};
 return()=>strip(lead)+'\n'+[...ol.children].map((li,i)=>`${i+1}. ${strip(items[i].p)} → ${val(li)||'—'} [${li.className==='ok'?'верно':li.className==='bad'?'ошибка':'не проверено'}]`).join('\n')}
/* ---- tabs ---- */
function startB(el){el.innerHTML=`<p class="lead">🎧 Прослушайте каждое выражение и повторите вслух. Голос: Google US English или Samantha (выбор слева).</p><table>${V.map(v=>`<tr><td><button class="play" data-s="${v.id}" aria-label="Слушать">▶</button></td><td><b>${v.en}</b><div class="ipa">${v.ipa}</div></td><td>${v.ru}</td></tr>`).join('')}</table><div class="bar"><button class="b" id="pa">▶ Прослушать все</button></div>`;
 el.onclick=async e=>{const s=e.target.dataset.s;if(s)say(byId(s).say);if(e.target.id==='pa'){const r=++run;for(const v of V){if(r!==run)break;await say(v.say);await new Promise(r=>setTimeout(r,500))}}};return()=>'Вводная часть пройдена'}
function wildB(el){
 el.innerHTML=`<p class="lead">Найдите в тексте все phrasal verbs из урока (их 8) и кликните по фразе целиком. Лишние фразы тоже кликабельны — будьте внимательны.</p>
<p class="txt">We <b data-v="so">set off</b> at six. Dad <b data-v="do">dropped off</b> the bags at the hotel, then <b data-v="pu">picked up</b> our cousin Max. Max <b>turned on</b> the radio. Soon we <b data-v="ro">ran out of</b> petrol! “<b data-v="lo">Watch out!</b>” shouted Mum when a truck came up behind us. We <b>looked at</b> the map and <b data-v="eu">ended up</b> in a small village. We had some tea, and in the evening we <b data-v="so">set off</b> again. Max wanted to <b>give up</b> and sleep, but Dad said: “<b data-v="lo">Look out</b> for the sign to Kraków!”</p>
<div class="bar"><button class="b" data-a="c">Проверить</button><button class="b alt" data-a="s">Показать ответы</button><span class="sc"></span></div>`;
 const bs=[...el.querySelectorAll('.txt b')];
 el.onclick=e=>{const b=e.target.closest('.txt b');if(b){b.className=b.className==='sel'?'':'sel';return}
  const a=e.target.dataset.a;if(!a)return;
  if(a==='s'){bs.forEach(b=>b.className=b.dataset.v?'ok':'');return}
  let n=0;bs.forEach(b=>{const t=!!b.dataset.v,s=b.className==='sel'||b.className==='ok';
   if(t&&s){n++;b.className='ok'}else if(t){b.className='miss';bad(b.dataset.v)}else if(s)b.className='bad'});
  $('.sc',el).textContent=`Найдено: ${n} / 8`};
 return()=>'Find them in the wild: выбрано — '+(bs.filter(b=>/sel|ok|bad/.test(b.className)).map(b=>b.textContent).join(', ')||'—')+'; '+($('.sc',el).textContent||'не проверено')}
const G=[['lo','___! You’re going to fall!',['look out','watch out'],'Осторожно! Ты упадёшь!'],['lo','___! A car is coming!',['watch out','look out'],'Берегись! Едет машина!'],
['do','Can you ___ the kids at school today?',['drop off'],'Ты сможешь отвезти детей в школу?'],['do','Mum ___ me at the station and drove away.',['dropped off'],'Мама высадила меня у вокзала.'],
['ro','We’ve ___ sugar. Can you buy some?',['run out of'],'У нас закончился сахар.'],['ro','The car stopped because we ___ petrol.',['ran out of'],'Машина встала: бензин кончился.'],
['so','We ___ early in the morning.',['set off'],'Мы отправились рано утром.'],['so','Tomorrow they ___ for Kraków at dawn.',['set off'],'Завтра они выедут в Краков на рассвете.'],
['eu','We took the wrong bus and ___ in the wrong place.',['ended up'],'Мы сели не на тот автобус и оказались не там.'],['eu','If you drive without a map, you may ___ lost.',['end up'],'Без карты можно заблудиться.'],
['pu','I’ll ___ Anna from work at 5.',['pick up'],'Я заберу Анну с работы в 5.'],['pu','He ___ his friend from the station yesterday.',['picked up'],'Вчера он забрал друга с вокзала.']];
function gapB(el){const first=V.map(v=>sh(G.filter(g=>g[0]===v.id))[0]),rest=sh(G.filter(g=>!first.includes(g))).slice(0,2);
 return quiz(el,'Впишите нужное выражение (в правильной форме) <small class="mu">— руками, без подсказок</small>',mix([...first,...rest],g=>g[0]).map(g=>({v:g[0],p:`${g[1]}<small>${g[3]}</small>`,ok:x=>g[2].includes(norm(x)),ans:g[2].join(' / ')})))}
function defB(el){const A=sh(V).slice(0,4),B=sh(V).slice(2).concat(sh(V)).filter(v=>!A.includes(v)).slice(0,2),B2=sh(V.filter(v=>!B.includes(v))).slice(0,2);
 const it=[...A.map(v=>({v:v.id,p:`Определение: <i>${v.def}</i><small>Какое это выражение?</small>`,opts:V.map(x=>[x.id,x.en]),ok:x=>x===v.id,ans:v.en})),
 ...[...B,...B2].map(v=>({v:v.id,p:`<b>${v.en}</b><small>Выберите определение</small>`,opts:V.map(x=>[x.id,x.def]),ok:x=>x===v.id,ans:v.def}))];
 return quiz(el,'Дефиниция: соедините слово и определение (слово ↔ определение).',mix(it,x=>x.v))}
function listenB(el){const T=V.map(v=>({id:v.id,l:v.en})),D=['turn on','give up','take off','look after','get in','come back','turn off','get off'].map(l=>({l}));
 const all=sh([...T,...D]),spk=sh([...sh(T).slice(0,5),...sh(D).slice(0,3)]),words=spk.map(x=>x.id==='lo'?(Math.random()<.5?'look out':'watch out'):x.l);
 el.innerHTML=`<p class="lead">Нажмите «Слушать»: прозвучат 8 выражений. Отметьте те, что услышали. Можно слушать повторно.</p><div class="bar"><button class="b" data-a="p">▶ Слушать (8 фраз)</button></div><div class="ticks" style="margin-top:12px">${all.map((x,i)=>`<label class="tick" data-i="${i}"><input type="checkbox"> ${x.l}</label>`).join('')}</div><div class="bar"><button class="b" data-a="c">Проверить</button><button class="b alt" data-a="s">Показать ответы</button><span class="sc"></span></div>`;
 const ls=[...el.querySelectorAll('.tick')];
 el.onclick=async e=>{const a=e.target.dataset.a;if(!a)return;
  if(a==='p'){const r=++run;for(const w of words){if(r!==run)break;await say(w);await new Promise(r=>setTimeout(r,900))}}
  if(a==='s')ls.forEach((l,i)=>l.className='tick '+(spk.includes(all[i])?'ok':''));
  if(a==='c'){let n=0;ls.forEach((l,i)=>{const s=spk.includes(all[i]),t=l.firstChild.checked;
   if(s&&t){n++;l.className='tick ok'}else if(s){l.className='tick miss';bad(all[i].id)}else if(t)l.className='tick bad';else l.className='tick'});$('.sc',el).textContent=`Верно отмечено: ${n} / 8`}};
 return()=>'Listen & tick: отмечено — '+(ls.filter(l=>l.firstChild.checked).map(l=>l.textContent.trim()).join(', ')||'—')+'. Прозвучало: '+words.join(', ')}
function cardsB(el){let d=sh(V),f=false;const log=[];
 const draw=()=>{if(!d.length){el.innerHTML='<p class="lead">🏁 Все карточки пройдены!</p>';return}
  const c=d[0];el.innerHTML=`<p class="lead">Осталось карточек: ${d.length}. Нажмите на карточку, чтобы перевернуть.</p><div class="card sign" data-f="1">${f?`<div class="big">${c.ru}</div><div>${c.ipa}</div><i>${c.ex}</i>`:`<div class="big">${c.en}</div>`}</div><div class="bar"><button class="play" data-s="1" aria-label="Слушать">🔊</button><button class="b" data-k="2">Знаю</button><button class="b alt" data-k="1">Не уверен</button><button class="b alt" data-k="0">Не знаю</button></div>`};
 el.onclick=e=>{const c=d[0];if(!c)return;if(e.target.closest('[data-f]')){f=!f;draw();return}
  if(e.target.dataset.s)return void say(c.say);const k=e.target.dataset.k;if(k===undefined)return;
  log.push(`${c.en}: ${['не знаю','не уверен','знаю'][k]}`);d.shift();if(k<2){if(k==0)bad(c.id);d.push(c)}f=false;draw()};
 draw();return()=>'Flashcards: '+(log.join('; ')||'—')}
const R=[['lo','Be careful! A bike is coming!','Watch out! A bike is coming!'],['lo','Take care! The floor is wet.','Look out! The floor is wet.'],['do','Can you take me to the airport and leave me there?','Can you drop me off at the airport?'],['ro','We have no more sugar.','We’ve run out of sugar.'],['ro','There is no bread left in the shop.','The shop has run out of bread.'],['so','We began our journey early in the morning.','We set off early in the morning.'],['eu','We arrived at the wrong place by mistake.','We ended up in the wrong place.'],['pu','I’ll collect you from work at 5.','I’ll pick you up at work at 5.']];

function storyB(el){const ws=sh(V).slice(0,5);

function wordleB(el){const W=[['route','маршрут'],['drive','ехать за рулём'],['truck','грузовик'],['coach','междугородний автобус'],['trail','тропа'],['brake','тормоз'],['wheel','колесо'],['ferry','паром'],['train','поезд'],['plane','самолёт']];

 $('.b',el).onclick=go;inp.onkeydown=e=>{if(e.key==='Enter')go()};draw();
 return()=>`Wordle (${w}): `+(g.join(', ')||'—')}
