<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A2 Holiday & Places — упражнения 6–8</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7fb;--card:#fff;--tx:#1d2433;--mu:#667;--ac:#3b6cf6;--ok:#1a9a57;--bad:#d6344a;--bd:#dde1ec;--hl:#fff3c4}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12151d;--card:#1b2030;--tx:#e8ebf5;--mu:#9aa3b8;--ac:#7c9bff;--ok:#4cd08a;--bad:#ff6b7f;--bd:#2c3348;--hl:#4a4220}}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px;display:grid;grid-template-columns:1fr 240px;gap:16px}
@media(max-width:800px){.wrap{grid-template-columns:1fr}aside{order:-1}}
h1{font-size:1.5rem;margin:0 0 4px}h2{font-size:1.15rem;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:16px}
aside .card{position:sticky;top:12px}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:9px;padding:6px 12px}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
input{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:5px 8px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:8px 0}
.fb{font-weight:700;min-width:1.2em}.fb.ok{color:var(--ok)}.fb.no{color:var(--bad)}
.ans{display:none;width:100%;color:var(--ok);font-size:.9rem}.show .ans{display:block}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}.sc,.st{color:var(--mu)}.st{font-size:.85rem}
.tag{display:inline-block;background:var(--hl);border-radius:8px;padding:2px 8px;margin:2px}
</style></head><body>
<div class="wrap"><main>
<h1>🌍 Holiday & Places — A2: упражнения 6–8</h1>
<div class="st" id="vs">Голос: ищу…</div>
<div class="bar" style="margin:6px 0 14px"><button onclick="speak('Audio test. Hello, this is a sunny and lovely holiday.')">🔈 Проверить звук</button></div>

<section class="card" id="e6"><h2>6. Listen and write — послушай и напиши (на слух)</h2><div id="b6"></div>
<div class="bar"><button class="p" onclick="chk(6)">Проверить</button><button onclick="shw(6)">Показать ответы</button><span class="sc" id="sc6"></span></div></section>

<section class="card" id="e7"><h2>7. Translate — переведи на английский</h2><div id="b7"></div>
<div class="bar"><button class="p" onclick="chk(7)">Проверить</button><button onclick="shw(7)">Показать ответы</button><span class="sc" id="sc7"></span></div></section>

<section class="card" id="e8"><h2>8. Unscramble — собери слово из букв</h2><div id="b8"></div>
<div class="bar"><button class="p" onclick="chk(8)">Проверить</button><button onclick="shw(8)">Показать ответы</button><span class="sc" id="sc8"></span></div></section>

<section class="card"><h2>📋 Результаты</h2><div class="bar"><button class="p" onclick="copyAll()">Скопировать все ответы одной кнопкой</button><span class="sc" id="cp"></span></div></section>
</main>
<aside><div class="card"><h2>⚠️ Проблемные слова</h2><div id="pw" class="st">Пока ошибок нет 👍</div></div></aside></div>
<script>
const $=s=>document.querySelector(s);
let VO=null;
function pick(){const vs=speechSynthesis.getVoices();VO=vs.find(v=>/google us english/i.test(v.name))||vs.find(v=>/samantha/i.test(v.name))||vs.find(v=>v.lang==="en-US")||vs.find(v=>/^en/.test(v.lang))||null;
$("#vs").textContent=VO?"🔊 Голос: "+VO.name+" ("+VO.lang+")":"⚠️ Английский голос не найден — звук может не работать в этом браузере";}
if("speechSynthesis" in window){pick();speechSynthesis.onvoiceschanged=pick}else $("#vs").textContent="⚠️ Браузер не поддерживает озвучку";
function speak(t){if(!("speechSynthesis" in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";if(VO)u.voice=VO;u.rate=.9;speechSynthesis.speak(u)}

const P=new Map();
function rp(){const s=[...new Set(P.values())];$("#pw").innerHTML=s.length?s.map(w=>`<span class=tag>${w}</span>`).join(""):"Пока ошибок нет 👍"}
function mark(n,i,ok,w){const f=$(`#f${n}_${i}`);f.textContent=ok?"✓":"✗";f.className="fb "+(ok?"ok":"no");ok?P.delete(n+"_"+i):P.set(n+"_"+i,w);rp()}
const N=s=>s.trim().toLowerCase().replace(/\s+/g," ");
const fb=(n,i)=>`<span class=fb id=f${n}_${i}></span>`;

const D6=["foggy","book a flight","uncomfortable","sunbathe on the beach","helpful","go sightseeing","take photos"];
const D7=[["облачный","cloudy"],["купить сувениры","buy souvenirs"],["поехать за границу","go abroad"],["шумный","noisy"],["тратить деньги","spend money"],["удобный","comfortable"],["снять квартиру","rent an apartment"],["роскошный","luxurious"]];
const D8=[["lcdoyu","cloudy","облачный"],["tireblre","terrible","ужасный"],["sbaic","basic","простой"],["lvyelo","lovely","прекрасный"],["rwdceod","crowded","многолюдный"],["ytdir","dirty","грязный"],["ufwal","awful","ужасный"],["dwniy","windy","ветреный"]];
const inp=(n,i)=>`<input id=i${n}_${i} size=22 autocomplete=off autocapitalize=off spellcheck=false>`;
$("#b6").innerHTML=D6.map((a,i)=>`<div class=row><button onclick="speak(D6[${i}])">🔊 ${i+1}</button>${inp(6,i)}${fb(6,i)}<div class=ans>✔ ${a}</div></div>`).join("");
$("#b7").innerHTML=D7.map((r,i)=>`<div class=row><span style="min-width:170px">${i+1}. ${r[0]}</span>${inp(7,i)}${fb(7,i)}<div class=ans>✔ ${r[1]}</div></div>`).join("");
$("#b8").innerHTML=D8.map((r,i)=>`<div class=row><b style="min-width:90px;letter-spacing:2px">${r[0]}</b><span class=st>(${r[2]})</span>${inp(8,i)}${fb(8,i)}<div class=ans>✔ ${r[1]}</div></div>`).join("");

function chk(n){let ok=0,tot=0;
(n==6?D6:n==7?D7:D8).forEach((r,i)=>{const a=n==6?r:r[1];const g=N($(`#i${n}_${i}`).value)===a;tot++;ok+=g;mark(n,i,g,a)});
$("#sc"+n).textContent=`Результат: ${ok}/${tot}`}
function shw(n){$("#e"+n).classList.toggle("show")}

function copyAll(){let t="A2 Holiday & Places — упражнения 6–8, мои ответы\n";
t+="\n6. Listen and write\n"+D6.map((a,i)=>{const v=$("#i6_"+i).value.trim();return `${i+1}. ${v||"—"}  ${N(v)===a?"✓":"✗ → "+a}`}).join("\n");
t+="\n\n7. Translate\n"+D7.map((r,i)=>{const v=$("#i7_"+i).value.trim();return `${r[0]} → ${v||"—"}  ${N(v)===r[1]?"✓":"✗ → "+r[1]}`}).join("\n");
t+="\n\n8. Unscramble\n"+D8.map((r,i)=>{const v=$("#i8_"+i).value.trim();return `${r[0]} → ${v||"—"}  ${N(v)===r[1]?"✓":"✗ → "+r[1]}`}).join("\n");
const ps=[...new Set(P.values())];t+="\n\nПроблемные слова: "+(ps.join(", ")||"нет");
const done=()=>{$("#cp").textContent="✅ Скопировано!"};
const fall=()=>{const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");done()}catch(e){$("#cp").textContent="Не удалось скопировать"}a.remove()};
try{navigator.clipboard.writeText(t).then(done,fall)}catch(e){fall()}}
</script></body></html>
