<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Jeopardy A2 — Clothes, Body, Hair, Shops</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:#0b1a6b;color:#fff;font-family:system-ui,Arial,sans-serif;padding:10px}
h1{text-align:center;color:#ffcc00;margin:6px 0;font-size:1.6rem;letter-spacing:2px}
.teams{display:flex;gap:10px;justify-content:center;margin:8px 0}
.team{background:#12258f;border:3px solid transparent;border-radius:10px;padding:6px 14px;text-align:center;cursor:pointer;min-width:120px}
.team.on{border-color:#ffcc00}
.team b{display:block;font-size:1.5rem;color:#ffcc00}
.wrap{overflow-x:auto}
.board{display:grid;grid-template-columns:repeat(5,minmax(120px,1fr));gap:6px;min-width:660px}
.cat{background:#1a34c4;text-align:center;font-weight:700;padding:10px 4px;display:flex;align-items:center;justify-content:center;min-height:64px;font-size:.95rem;text-transform:uppercase}
.cell{background:#1a34c4;color:#ffcc00;font-size:1.8rem;font-weight:800;border:0;border-radius:4px;padding:22px 0;cursor:pointer}
.cell:hover{background:#2a48e0}
.cell.done{visibility:hidden}
#modal{display:none;position:fixed;inset:0;background:#0b1a6bf2;align-items:center;justify-content:center;padding:20px;z-index:5}
#modal.show{display:flex}
.card{max-width:640px;width:100%;text-align:center}
.pts{color:#ffcc00;font-size:1.2rem}
#h{opacity:.8;font-size:1rem}
#q{font-size:1.7rem;margin:16px 0;line-height:1.3}
#a{font-size:1.3rem;line-height:1.35;color:#ffcc00;font-weight:800;min-height:2.6rem;margin-bottom:16px}
button.b{font-size:1.1rem;padding:10px 18px;margin:4px;border:0;border-radius:8px;cursor:pointer;font-weight:700}
.ok{background:#2ecc71}.no{background:#e74c3c;color:#fff}.sh{background:#ffcc00}.sk{background:#888;color:#fff}
</style></head><body>
<h1>JEOPARDY · A2</h1>
<div class="teams">
<div class="team on" id="t0" onclick="sel(0)">Team 1<b id="s0">0</b></div>
<div class="team" id="t1" onclick="sel(1)">Team 2<b id="s1">0</b></div>
</div>
<div class="wrap"><div class="board" id="board"></div></div>
<div id="modal"><div class="card">
<div class="pts" id="p"></div><div id="h"></div><div id="q"></div><div id="a"></div>
<div id="tmr" style="font-size:2rem;color:#ffcc00;min-height:2.4rem"></div>
<button class="b sh" onclick="timer()">⏱ 30 сек</button>
<button class="b sh" onclick="reveal()">Показать ответ</button>
<button class="b ok" onclick="fin(1)">✔ Верно</button>
<button class="b no" onclick="fin(-1)">✘ Неверно</button>
<button class="b sk" onclick="fin(0)">Закрыть</button>
</div></div>
<script>
/* [category, hint, [[clue, answer] x5]] */
const D=[
["Clothes","🗣 Speak!",[
["🧥 It's cold and rainy. What do you wear? Name 3 things.","jacket / coat / scarf / gloves / boots / sweater"],
["👟 Name 4 things you wear on your feet.","socks, sneakers, slippers, boots, sandals, flip-flops, heels"],
["🗣 Describe what you are wearing now. (I'm wearing...)","I'm wearing a grey sweater, blue jeans and white sneakers. They're comfortable."],
["🗣 What do you wear to a job interview, to a party and at home? Explain.","To an interview: a suit, a shirt and a tie. To a party: a dress and heels. At home: a tracksuit, socks and slippers."],
["🗣 Describe your favourite outfit for summer or winter. Why do you like it?","My favourite summer outfit is a T-shirt, shorts and sandals. I like it because it's light and cool."]]],
["Body","🗣 Speak!",[
["Name 3 words to describe a person's build.","chubby, average, slim, skinny / thin, overweight"],
["Name 3 words for skin colour (complexion).","pale, fair, olive, medium, dark"],
["🗣 Explain the difference: a scar, a birthmark, a mole.","A scar is a mark after an injury. A birthmark is a mark you have from birth. A mole is a small dark spot on the skin."],
["🗣 Describe a person in your family: build, skin, face. (He / She is... has...)","My sister is slim and has fair skin. She has freckles and dimples. She has dark circles when she's tired."],
["🗣 Describe a famous person. Don't say the name! Your partner guesses.","He / She is tall and slim. He has dark skin and a beard... (use is / has / looks like)"]]],
["Hair","🗣 Speak!",[
["Name 3 words for the shape of hair.","straight, wavy, curly, coily, spiky, frizzy"],
["Name 3 hair colours.","light brown, dark brown, grey, ash blonde, red"],
["🗣 Describe your hair (or your friend's hair).","I have short, straight, dark brown hair. My friend has long, curly, red hair and a ponytail."],
["🗣 What do you do to your hair? Use: wash, brush, dye, cut, straighten, curl, tie.","I wash my hair every two days. I brush it every morning. Sometimes I tie it or straighten it. I dye it once a year."],
["🗣 Tell us about a bad haircut (real or imaginary). What happened? (Past Simple)","Last year I went to a new hairdresser's. She cut my hair too short! I looked terrible, but it grew back."]]],
["Shopping","🗣 Speak!",[
["Where do you pay in a shop? (2 words)","the till / the (self-service) checkout"],
["Who works in a shop and helps customers?","a shop assistant"],
["🗣 Role-play: in a clothes shop. Ask about size, try on, changing room.","Can I try this on? Where's the changing room? Do you have it in a larger size? It doesn't fit / suit me."],
["🗣 You want to take something back to the shop. What do you say? (receipt, fit, suit)","I'd like to take this back. It doesn't fit. Here's the receipt. Can I get a refund?"],
["🗣 Do you like shopping at the sales, in chain stores or online? Explain.","I like shopping at the sales because things are cheaper. I don't like crowds, so I often shop online."]]],
["Shops","🗣 Speak!",[
["Where do you buy bread?","the baker's"],
["Where do you buy medicine?","a pharmacy / the chemist's"],
["Name the shop: 1) meat  2) fruit and vegetables  3) newspapers","the butcher's; the greengrocer's; the newsagent's"],
["🗣 Where do you go in your town for: food, clothes, shoes, a haircut? (4 sentences)","I go to the supermarket for food. I buy clothes in a department store. I get shoes at the shoe shop and go to the hairdresser's for a haircut."],
["🗣 Describe your favourite shop: where, what they sell, why you like it.","My favourite shop is a small bookshop near my house. They sell books and cards. It's quiet and the shop assistant is very friendly."]]]
];
let cur=null,team=0,sc=[0,0];
const bd=document.getElementById('board');
D.forEach(c=>{const d=document.createElement('div');d.className='cat';d.textContent=c[0];bd.appendChild(d)});
for(let r=0;r<D[0][2].length;r++)D.forEach((c,i)=>{const b=document.createElement('button');b.className='cell';b.textContent=(r+1)*100;b.onclick=()=>open_(b,i,r);bd.appendChild(b)});
function open_(b,i,r){cur=b;p.textContent=D[i][0]+' · '+(r+1)*100;h.textContent=D[i][1];q.textContent=D[i][2][r][0];a.textContent='';a.dataset.v=D[i][2][r][1];a.dataset.pt=(r+1)*100;clearInterval(ti);tmr.textContent='';modal.classList.add('show')}
let ti;function timer(){clearInterval(ti);let n=30;tmr.textContent=n;ti=setInterval(()=>{n--;tmr.textContent=n;if(n<=0){clearInterval(ti);tmr.textContent='⏰ Time!'}},1000)}
function reveal(){a.textContent=a.dataset.v}
function fin(k){clearInterval(ti);tmr.textContent='';if(k)sc[team]+=k*a.dataset.pt;document.getElementById('s'+team).textContent=sc[team];cur.classList.add('done');modal.classList.remove('show')}
function sel(i){team=i;t0.classList.toggle('on',i==0);t1.classList.toggle('on',i==1)}
</script></body></html>
