<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English A2: Collocations & Tenses</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7fb;--card:#fff;--tx:#1d2230;--mu:#667085;--ac:#3b5bdb;--ok:#2b8a3e;--okb:#d3f9d8;--bad:#c92a2a;--badb:#ffe3e3;--bd:#dde1ec}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161d;--card:#1e222d;--tx:#e8eaf2;--mu:#9aa3b5;--ac:#8ea2ff;--ok:#69db7c;--okb:#16351f;--bad:#ff8787;--badb:#3d1a1a;--bd:#323848}}
:root[data-theme="dark"]{--bg:#14161d;--card:#1e222d;--tx:#e8eaf2;--mu:#9aa3b5;--ac:#8ea2ff;--ok:#69db7c;--okb:#16351f;--bad:#ff8787;--badb:#3d1a1a;--bd:#323848}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px;display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:16px}
@media(max-width:800px){.wrap{grid-template-columns:1fr}}
aside{position:sticky;top:12px;align-self:start}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:18px;margin:0 0 4px}h3{font-size:15px;margin:0 0 8px}
.mu{color:var(--mu);font-size:14px}
button,select,input{font:inherit;color:var(--tx)}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:6px 12px;cursor:pointer}
button.g{background:transparent;color:var(--ac);border:1px solid var(--ac)}
button.s{padding:2px 8px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:5px 6px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}
.ipa{color:var(--mu);font-family:"Segoe UI",system-ui,sans-serif}
ol.ex{padding-left:24px;margin:8px 0}ol.ex li{margin:10px 0}
input.t{background:var(--card);border:0;border-bottom:2px solid var(--bd);width:130px;padding:2px 4px;outline:0;text-align:center}
input.t.w{display:block;width:100%;max-width:460px;text-align:left;margin-top:4px}
input.t:focus{border-color:var(--ac)}
input.ok{background:var(--okb);border-color:var(--ok)}input.bad{background:var(--badb);border-color:var(--bad)}
.ans{display:none;color:var(--ok);font-size:14px;margin-left:6px}.ans.on{display:inline}
.w+.ans,.w~.ans{display:block;margin:2px 0 0}
.h{color:var(--mu);font-size:13px}
.sc{font-weight:600}
#ptab td:last-child{text-align:right;width:30px}
#out{width:100%;height:120px;display:none;margin-top:8px;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px}
.opt{display:block;width:100%;text-align:left;margin:6px 0;background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.opt.c{background:var(--okb);border-color:var(--ok)}.opt.x{background:var(--badb);border-color:var(--bad)}.opt[disabled]{opacity:.45}
#lad{font-size:13px;columns:2;padding-left:0;list-style:none;margin:8px 0}#lad li{padding:1px 6px}#lad li.cur{background:var(--ac);color:#fff;border-radius:4px}
</style></head><body>
<div class="wrap"><main>
<div class="card"><h1>English A2 · Словосочетания и времена</h1>
<div class="row"><label>Имя: <input id="nm" class="t" style="width:160px"></label>
<button id="cp">Скопировать мои ответы</button></div>
<textarea id="out" readonly></textarea><div id="cps" class="mu"></div></div>

<div class="card"><h2>Повторение слов</h2>
<p class="mu">🎧 Задание: нажми ▶ и послушай каждое словосочетание, затем повтори вслух. Голос: Google US English или Samantha.</p>
<div class="row"><select id="vs"></select><button class="g" id="tv">🔊 Проверить звук</button><button id="pa">▶ Слушать всё</button><button class="g" id="st">■ Стоп</button></div>
<div id="vst" class="mu"></div>
<div style="overflow-x:auto"><table id="vt"></table></div></div>
<div id="exs"></div>

<div class="card"><h2>Кто хочет стать миллионером?</h2>
<div class="row"><button id="qs">Начать заново</button><button class="g" id="q50">50:50</button><span id="qi" class="sc"></span></div>
<div id="qb"></div><ol id="lad"></ol></div>
</main>
<aside><div class="card"><h3>⚠️ Проблемные слова</h3><table id="ptab"></table><p id="pe" class="mu">Пока ошибок нет.</p></div></aside></div>
<script>
const $=s=>document.querySelector(s),ce=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const V=[["invite somebody to a dinner","пригласить кого-то на ужин","/ɪnˈvaɪt ˈsʌmbɑːdi tə ə ˈdɪnər/"],["invite somebody to a restaurant","пригласить кого-то в ресторан","/ɪnˈvaɪt ˈsʌmbɑːdi tə ə ˈrestərɑːnt/"],["take somebody to a restaurant","отвести кого-то в ресторан","/teɪk ˈsʌmbɑːdi tə ə ˈrestərɑːnt/"],["have a great time","отлично провести время","/hæv ə ɡreɪt taɪm/"],["drive along the high street","ехать по главной улице","/draɪv əˈlɔːŋ ðə haɪ striːt/"],["meet in a coffee bar","встретиться в кофейне","/miːt ɪn ə ˈkɔːfi bɑːr/"],["give somebody your phone number","дать кому-то свой номер телефона","/ɡɪv ˈsʌmbɑːdi jʊr foʊn ˈnʌmbər/"],["wait for somebody","ждать кого-то","/weɪt fɔːr ˈsʌmbɑːdi/"],["be in a hurry","спешить, быть в спешке","/bi ɪn ə ˈhɜːri/"],["play a song","сыграть / включить песню","/pleɪ ə sɔːŋ/"],["leave the club (very late)","уйти из клуба (очень поздно)","/liːv ðə klʌb/"],["run across the road","перебежать дорогу","/rʌn əˈkrɔːs ðə roʊd/"]];
/* Audio */
const hasTTS='speechSynthesis' in window;let voice=null,vl=[],stop=false;
function loadV(){if(!hasTTS){$('#vst').textContent='⚠️ Этот браузер не поддерживает озвучку.';return}
vl=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));
voice=vl.find(v=>v.name==='Google US English')||vl.find(v=>/samantha/i.test(v.name))||vl.find(v=>v.lang==='en-US')||vl[0]||null;
const s=$('#vs');s.innerHTML='';vl.forEach((v,i)=>{const o=new Option(v.name+' ('+v.lang+')',i);if(v===voice)o.selected=true;s.add(o)});
$('#vst').textContent=voice?'Выбран голос: '+voice.name:'Английские голоса не найдены — проверь настройки устройства.'}
function say(t,cb){if(!hasTTS)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);if(voice)u.voice=voice;u.lang='en-US';u.rate=.9;if(cb)u.onend=cb;speechSynthesis.speak(u)}
if(hasTTS){loadV();speechSynthesis.onvoiceschanged=loadV}
$('#vs').onchange=e=>{voice=vl[e.target.value];$('#vst').textContent='Выбран голос: '+voice.name};
$('#tv').onclick=()=>say('Hello! This is a sound test.');
$('#st').onclick=()=>{stop=true;hasTTS&&speechSynthesis.cancel()};
$('#pa').onclick=()=>{stop=false;let i=0;const n=()=>{if(stop||i>=V.length)return;say(V[i++][0].replace(/\(.*\)/,''),()=>setTimeout(n,300))};n()};
const vt=$('#vt');vt.innerHTML='<tr><th></th><th>English</th><th>Транскрипция</th><th>Перевод</th></tr>';
V.forEach(v=>{const r=ce('tr');const b=ce('button','s g','▶');b.onclick=()=>say(v[0].replace(/\(.*\)/,''));const c=ce('td');c.append(b);r.append(c,ce('td','',v[0]),ce('td','ipa',v[2]),ce('td','',v[1]));vt.append(r)});
/* Problem words */
const P={};function renderP(){const t=$('#ptab');t.innerHTML='';const k=Object.keys(P).filter(x=>P[x].size).sort((a,b)=>P[b].size-P[a].size);$('#pe').style.display=k.length?'none':'';k.forEach(x=>{const r=ce('tr');r.append(ce('td','',x),ce('td','',P[x].size));t.append(r)})}
const addP=(k,id)=>{(P[k]=P[k]||new Set()).add(id);renderP()};
/* Exercises */
const norm=s=>s.toLowerCase().replace(/[’`]/g,"'").replace(/'s going/g," is going").replace(/n't/g," not").replace(/'ve/g," have").replace(/'re/g," are").replace(/'m/g," am").replace(/[.!?]+$/,"").replace(/\s+/g," ").trim();
const I=(q,a,k,h)=>({q,a:[].concat(a),k,h});
const EX=[
{t:'Упр. 1 — Впиши глагол',d:'Подбери глагол к словосочетанию.',it:[I('___ a song','play','play'),I('___ for somebody','wait','wait'),I('___ somebody your phone number','give','give'),I('___ across the road','run','run'),I('___ the club (very late)','leave','leave'),I('___ a great time','have','have'),I('___ in a coffee bar','meet','meet'),I('___ along the high street','drive','drive')]},
{t:'Упр. 2 — Допиши глагол в предложении',d:'Впиши подходящий глагол (начальная форма).',it:[I('Shall we ___ in a coffee bar at five?','meet','meet'),I('Please ___ me your phone number.','give','give'),I('Could you ___ a song for us?','play','play'),I("Don't ___ across the road without looking!",'run','run'),I("I'd like to ___ you to a restaurant tonight.",['invite','take'],'invite / take'),I("Please don't ___ for me, I'll be late.",'wait','wait'),I('We usually ___ the club very late.','leave','leave'),I('Did you ___ a great time at the party?','have','have')]},
{t:'Упр. 3 — Впиши предлог или артикль',d:'Одно слово в пропуск (for, to, in, across, along, a).',it:[I('wait ___ somebody','for','wait for'),I('invite somebody ___ a dinner','to','invite … to'),I('be ___ a hurry','in','be in a hurry'),I('run ___ the road','across','across the road'),I('meet ___ a coffee bar','in','in a coffee bar'),I('drive ___ the high street','along','along the high street'),I('take somebody ___ a restaurant','to','take … to'),I('play ___ song','a','play a song')]},
{t:'Упр. 4 — Дополни предложение (времена)',d:'Поставь глагол в скобках в нужное время. Present Perfect, Past Continuous, Past Simple, Present Simple, be going to.',it:[I('I ___ (live) in Kraków since 2019.','have lived','live — Present Perfect','Present Perfect'),I('At 8 o\'clock yesterday we ___ (have) dinner.','were having','have — Past Continuous','Past Continuous'),I('She ___ (leave) the club at midnight last Saturday.','left','leave — Past Simple','Past Simple'),I('He usually ___ (drive) along the high street to work.','drives','drive — Present Simple','Present Simple'),I('Look at those clouds! It ___ (rain).','is going to rain','rain — be going to','be going to'),I('I ___ (not / meet) your brother yet.','have not met','meet — Present Perfect','Present Perfect'),I('While I ___ (wait) for Anna, I saw Tom.','was waiting','wait — Past Continuous','Past Continuous'),I('They ___ (invite) us to dinner next Friday. It\'s their plan.','are going to invite','invite — be going to','be going to')]},
{t:'Упр. 5 — Rephrase: измени время',d:'Перепиши предложение целиком в указанном времени.',it:[I('She gives me her phone number.','she gave me her phone number','give — Past Simple','Past Simple'),I('We run across the road.','we were running across the road','run — Past Continuous','Past Continuous'),I('He leaves the club very late.','he has left the club very late','leave — Present Perfect','Present Perfect'),I('They wait for Tom.','they are going to wait for tom','wait — be going to','be going to'),I('I had a great time.','i have a great time','have — Present Simple','Present Simple'),I('She was driving along the high street.','she drove along the high street','drive — Past Simple','Past Simple'),I('I meet my friends in a coffee bar.','i have met my friends in a coffee bar','meet — Present Perfect','Present Perfect'),I('Did you invite him to dinner?','are you going to invite him to dinner','invite — be going to','be going to')]}];
const log=[];const exs=$('#exs');
EX.forEach((e,ei)=>{const c=ce('div','card');c.append(ce('h2','',e.t),ce('p','mu',e.d));const ol=ce('ol','ex');
e.it.forEach((it,ii)=>{it.id=ei+'-'+ii;const li=ce('li');const inp=ce('input','t');inp.autocomplete='off';inp.spellcheck=false;inp.autocapitalize='none';inp.setAttribute('autocorrect','off');it.inp=inp;
if(it.q.includes('___')){const p=it.q.split('___');li.append(document.createTextNode(p[0]),inp,document.createTextNode(p[1]))}else{li.append(document.createTextNode(it.q));inp.classList.add('w');li.append(inp)}
if(it.h)li.append(ce('span','h',' ['+it.h+']'));
it.an=ce('span','ans','✔ '+it.a[0]);li.append(it.an);inp.oninput=()=>{inp.classList.remove('ok','bad')};ol.append(li)});
const sc=ce('span','sc');const r=ce('div','row');const cb=ce('button','','Проверить'),sb=ce('button','g','Показать ответы'),rb=ce('button','g','Сбросить');
cb.onclick=()=>{let n=0;e.it.forEach(it=>{const v=norm(it.inp.value),ok=it.a.some(a=>norm(a)===v);it.ok=ok;if(ok)n++;it.inp.classList.toggle('ok',ok);it.inp.classList.toggle('bad',!ok&&!!v);if(!ok&&v)addP(it.k,it.id)});sc.textContent=n+' / '+e.it.length};
sb.onclick=()=>e.it.forEach(it=>it.an.classList.toggle('on'));
rb.onclick=()=>{e.it.forEach(it=>{it.inp.value='';it.inp.className=it.inp.className.replace(/ ?(ok|bad)/g,'');it.an.classList.remove('on');it.ok=null});sc.textContent=''};
r.append(cb,sb,rb,sc);c.append(ol,r);exs.append(c)});
/* Millionaire */
const L=[100,200,300,500,1000,2000,4000,8000,16000,32000,64000,125000,250000,500000,1000000];
const Q=[["Can you ___ me your phone number?",["take","play","give","run"],2],["I ___ for you for an hour yesterday.",["waited","waiting","have wait","was wait"],0],["We ___ a great time at the party.",["were","played","drove","had"],3],["Don't run ___ the road!",["along","across","in","for"],1],["I'm ___ a hurry.",["on","at","for","in"],3],["Yesterday I ___ the club at 2 a.m.",["left","leave","leaving","have leave"],0],["Look! She ___ play a song.",["is go to","going to","is going to","goes to"],2],["I ___ to London twice.",["was","have been","am being","been"],1],["While he ___ along the high street, he saw a cat.",["was driving","drove","has driven","drives"],0],["Jack wants to ___ us to dinner.",["wait","run","have","invite"],3],["She ___ a song every morning.",["played","plays","was playing","has play"],1],["We ___ in a coffee bar last week.",["meet","have met","met","are going to met"],2],["Which phrase is correct?",["wait to somebody","wait at somebody","wait of somebody","wait for somebody"],3],["I ___ my keys. I can't find them.",["have lost","was losing","am going lose","lose last night"],0],["Tonight we ___ take Anna to a restaurant.",["are go to","are going to","were going to","go to"],1]];
let n=0,used=false,hid=[];const lad=$('#lad');
function qr(){const b=$('#qb');b.innerHTML='';lad.innerHTML='';L.forEach((m,i)=>{const li=ce('li',i===n?'cur':'','$'+m.toLocaleString('en-US'));lad.prepend(li)});
$('#qi').textContent=n<15?'Вопрос '+(n+1)+' / 15 · $'+L[n].toLocaleString('en-US'):'';
if(n>=15){b.append(ce('h3','','🏆 Миллион! Поздравляем!'));return}
const q=Q[n];b.append(ce('h3','',q[0]));q[1].forEach((o,i)=>{const x=ce('button','opt','ABCD'[i]+'. '+o);if(hid.includes(i))x.disabled=true;x.onclick=()=>{b.querySelectorAll('.opt').forEach(z=>z.disabled=true);
if(i===q[2]){x.classList.add('c');n++;setTimeout(qr,800)}else{x.classList.add('x');b.children[q[2]+1].classList.add('c');const s=n>=10?L[9]:n>=5?L[4]:0;addP('Quiz: '+q[1][q[2]],'q'+n);b.append(ce('p','','Неверно. Твой выигрыш: $'+s.toLocaleString('en-US')+'. Жми «Начать заново».'))}
qlog=n<15?'Quiz: дошёл до вопроса '+(n+1):''};b.append(x)});$('#q50').disabled=used}
let qlog='';
$('#q50').onclick=()=>{if(used||n>=15)return;used=true;const c=Q[n][2];hid=[0,1,2,3].filter(i=>i!==c).sort(()=>Math.random()-.5).slice(0,2);qr()};
$('#qs').onclick=()=>{n=0;used=false;hid=[];qr()};qr();
/* Copy */
$('#cp').onclick=()=>{let t='Имя: '+($('#nm').value||'—')+'\nДата: '+new Date().toLocaleDateString()+'\n';
EX.forEach(e=>{t+='\n'+e.t+'\n';e.it.forEach((it,i)=>{const v=it.inp.value.trim(),ok=it.a.some(a=>norm(a)===norm(v));t+=(i+1)+'. '+it.q+' → '+(v||'(пусто)')+(ok?' ✔':' ✘ (правильно: '+it.a[0]+')')+'\n'})});
const pk=Object.keys(P).filter(x=>P[x].size);t+='\nПроблемные слова: '+(pk.length?pk.map(x=>x+' ×'+P[x].size).join(', '):'—')+'\n'+(qlog||'Quiz: вопрос '+(n+1)+' из 15')+'\n';
const o=$('#out');o.value=t;o.style.display='block';o.select();let ok=false;
try{navigator.clipboard.writeText(t).then(()=>$('#cps').textContent='✔ Скопировано!',()=>{try{document.execCommand('copy');$('#cps').textContent='✔ Скопировано!'}catch(e){$('#cps').textContent='Выдели текст выше и скопируй вручную.'}})}catch(e){try{document.execCommand('copy');$('#cps').textContent='✔ Скопировано!'}catch(e2){$('#cps').textContent='Выдели текст выше и скопируй вручную.'}}};
</script></body></html>
