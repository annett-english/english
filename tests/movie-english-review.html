<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Movie Night English · Review &amp; Write</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#120c0e;--card:#1e1417;--red:#b3162b;--gold:#f2c14e;--tx:#f5ece0;--mut:#b9a99a;--ok:#2e9e5b;--no:#d6455d;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#3a0f18,var(--bg) 60%) fixed;color:var(--tx);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
h1,h2,h3{font-family:'Bebas Neue',Impact,sans-serif;letter-spacing:.06em;font-weight:400;margin:0}
header{text-align:center;padding:26px 14px 18px;border-bottom:14px solid #000;background:linear-gradient(#2a0b12,#120c0e);position:relative}
header:after{content:"";position:absolute;left:0;right:0;bottom:-11px;height:8px;background:repeating-linear-gradient(90deg,transparent 0 10px,#f2c14e 10px 22px)}
h1{font-size:clamp(34px,7vw,60px);color:var(--gold);text-shadow:0 0 18px #b3162b}
header p{margin:4px 0 12px;color:var(--mut)}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:20px;max-width:1150px;margin:26px auto;padding:0 14px}
@media(max-width:850px){.wrap{grid-template-columns:1fr}aside{order:-1;position:static!important}}
.card{background:var(--card);border:1px solid #3b262b;border-left:6px solid var(--red);border-radius:14px;padding:18px;margin-bottom:22px;box-shadow:0 6px 20px #0008}
.card h2{font-size:28px;color:var(--gold);display:flex;gap:10px;align-items:center}
.card h2 span{background:var(--red);color:#fff;border-radius:50%;width:34px;height:34px;display:grid;place-items:center;font-size:18px;flex:none}
.tag{font-size:13px;background:#3b262b;border-radius:20px;padding:2px 10px;color:var(--mut);font-family:system-ui}
.d{color:var(--mut);margin:4px 0 14px}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:7px 14px;background:var(--red);color:#fff}
button:hover{filter:brightness(1.2)}button.alt{background:#3b262b;color:var(--tx)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
.sc{color:var(--gold);font-weight:700}
.rem{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.rem button{background:#2a1a1f;color:var(--tx);border:1px dashed #6b4a52;font-size:14px;padding:4px 10px}
select,input,textarea{font:inherit;background:#120c0e;color:var(--tx);border:1px solid #6b4a52;border-radius:6px;padding:5px 8px;max-width:100%}
input{min-width:180px}textarea{width:100%;min-height:150px}
.ok{border-color:var(--ok)!important;background:#12301f!important}.no{border-color:var(--no)!important;background:#3a1119!important}
.q{margin:12px 0}.q small{color:var(--mut)}
.sol{display:block;color:var(--gold);font-size:14px}
.chip{display:inline-block;margin:3px;padding:3px 10px;border-radius:20px;background:#3b262b}.chip.used{background:var(--ok)}.chip.ex{border:1px solid var(--gold)}
aside{position:sticky;top:10px;align-self:start;background:#000;border:2px solid var(--gold);border-radius:12px;padding:12px}
aside h3{color:var(--gold);font-size:22px}
table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}td{padding:3px;border-bottom:1px solid #333}
</style></head><body>
<header><h1>🎬 Review &amp; Write</h1><p>B1 · 2 упражнения на повторение + 1 продакшн</p>
<button id="test">🔊 Проверить звук</button> <span id="vs" style="color:var(--mut);font-size:14px"></span></header>
<div class="wrap"><main id="m"></main>
<aside><h3>🚨 Проблемные слова</h3><table id="pw"></table><button class="alt" id="clr">Очистить</button></aside></div>
<script>
const $=(s,e=document)=>e.querySelector(s),$$=(s,e=document)=>[...e.querySelectorAll(s)];
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const norm=s=>s.toLowerCase().replace(/[’‘]/g,"'").replace(/[^a-z' ]/g,' ').replace(/\s+/g,' ').trim();
let voice=null;
function pick(){const v=speechSynthesis.getVoices();voice=v.find(x=>/Google US English/i.test(x.name))||v.find(x=>/Samantha/i.test(x.name))||v.find(x=>x.lang=='en-US')||v.find(x=>/^en/.test(x.lang))||null;$('#vs').textContent=voice?'Голос: '+voice.name:'Английский голос не найден — проверьте звук/браузер'}
function say(t,q){if(!window.speechSynthesis)return alert('Озвучка не поддерживается этим браузером');if(!q)speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';if(voice)u.voice=voice;u.rate=.9;speechSynthesis.speak(u)}
if(window.speechSynthesis){pick();speechSynthesis.onvoiceschanged=pick}else $('#vs').textContent='Озвучка недоступна';
$('#test').onclick=()=>say('Audio check. Welcome back to Movie Night!');
const P={};
function bad(w){if(!w)return;P[w]=(P[w]||0)+1;rp()}
function rp(){$('#pw').innerHTML=Object.entries(P).sort((a,b)=>b[1]-a[1]).map(([w,n])=>`<tr><td>${w}</td><td>×${n}</td><td><button class="alt" data-say="${w}">🔊</button></td></tr>`).join('')||'<tr><td style="color:#b9a99a">Пока ошибок нет 🎉</td></tr>'}
rp();$('#clr').onclick=()=>{for(const k in P)delete P[k];rp()};
const D=[['subtitles','words at the bottom of the screen that show what people say'],['soundtrack','the music that is played in a film'],['star','a famous actor in a main role'],['special effects','tricks that create things that cannot be real'],['set','the place with scenery where a film is made'],['critic','a person who writes opinions about films'],['scene','a short part of a film in one place'],['audience','the people who watch a film'],['trailer','a short video that advertises a film'],['extra','an actor in the background with no lines'],['sequel','a film that continues an earlier story'],['plot','the series of events in a story'],['review','a written opinion about a film'],['script','the written text with all the dialogue'],['cast','all the actors in a film']];
const E=[['is based on','is based on|was based on','is based on'],['is set in','is set in|was set in','is set in'],['plays the part of','plays the part of|played the part of','plays the part of'],['is directed by','is directed by|was directed by','is directed by'],['was shot on location','was shot on location|were shot on location','was shot on location'],['is dubbed into','is dubbed into|was dubbed into','is dubbed into']];
const sel=o=>'<select><option value="">…</option>'+sh(o).map(x=>`<option>${x}</option>`).join('')+'</select>';
const inp='<input autocomplete="off" spellcheck="false">';
const X={};
X[1]={tag:'Повторение',t:'Definition match',d:'Прочитайте определение и выберите слово. Нажмите 🔊 в блоке повторения, если нужно вспомнить звучание.',
b:()=>{const w=sh(D).slice(0,8),o=w.map(x=>x[0]);return `<div class="rem">${sh(o).map(x=>`<button data-say="${x}">🔊 ${x}</button>`).join('')}</div>`+w.map((x,i)=>`<div class="q" data-a="${x[0]}" data-t="${x[0]}">${i+1}. ${x[1]}.<br>${sel(o)}</div>`).join('')},bt:'chk show reset'};
X[2]={tag:'Повторение',t:'Expressions in context',d:'Впишите выражение целиком в нужной форме (is based on, is set in, plays the part of, is directed by, was shot on location, is dubbed into).',
b:()=>`<div class="rem">${E.map(x=>`<button data-say="${x[0]}">🔊 ${x[0]}</button>`).join('')}</div>`+sh([['The film ? a novel by Stephen King.','Present','is based on'],['The story ? London in the 1980s.','Present','is set in'],['Emma Stone ? a young inventor in the film.','Present','plays the part of'],['The new series ? a Korean director.','Present','is directed by'],['The desert scenes ? in Morocco.','Past','was shot on location'],['The film ? German for the local audience.','Present','is dubbed into']]).map((x,i)=>{const a=E.find(e=>e[0]==x[2]||e[2]==x[2])||[];return `<div class="q" data-a="${x[2]}${x[2]=='was shot on location'?'|were shot on location':''}" data-t="${x[2]}">${i+1}. <small>(${x[1]})</small> ${x[0].replace('?',inp)}</div>`}).join(''),bt:'chk show reset'};
const PAT={'based on':'\\bbased on\\b','set in':'\\bset in\\b','directed by':'\\bdirected by\\b','plays the part of':'\\bplay(s|ed)? the part of\\b','shot on location':'\\bshot on location\\b','dubbed into':'\\bdubbed into\\b'};
X[3]={tag:'Продакшн',t:'Write a mini review',d:'Напишите короткую рецензию на любимый (или выдуманный) фильм: 6–8 предложений. Используйте минимум 8 слов из списка, из них минимум 3 выражения (золотая рамка).',
b:()=>{const ws=D.map(x=>x[0]);return `<div id="ch">${Object.keys(PAT).map(x=>`<span class="chip ex" data-k="${x}">${x}</span>`).join('')}${ws.map(x=>`<span class="chip" data-k="${x}">${x}</span>`).join('')}</div><p class="sc" id="cnt">Слов: 0/8 · Выражений: 0/3 · Предложений: 0</p><div class="q" data-p="My film review:\n"><textarea placeholder="The film … is based on …"></textarea></div>`},bt:'copy reset',
i(s){const ta=$('textarea',s);ta.oninput=()=>{const v=ta.value.toLowerCase();let n=0,e=0;$$('.chip',s).forEach(c=>{const k=c.dataset.k,u=new RegExp(PAT[k]||'\\b'+k+'(s)?\\b').test(v);c.classList.toggle('used',u);if(u){n++;if(PAT[k])e++}});const sn=(ta.value.match(/[.!?]+(\s|$)/g)||[]).length;$('#cnt',s).textContent=`Слов: ${n}/8 · Выражений: ${e}/3 · Предложений: ${sn}`+(n>=8&&e>=3&&sn>=6?' 🎉 Задание выполнено!':'')}}};
const BT={chk:['Проверить'],show:['Показать ответы'],copy:['📋 Копировать'],reset:['↻ Заново']};
function render(n){let s=$('#s'+n);if(!s){s=document.createElement('section');s.className='card';s.id='s'+n;$('#m').append(s)}const x=X[n];s.innerHTML=`<h2><span>${n}</span>${x.t} <span class="tag">${x.tag}</span></h2><p class="d">${x.d}</p>${x.b()}<div class="bar">${x.bt.split(' ').map(k=>`<button class="${k=='chk'||k=='copy'?'':'alt'}" data-act="${k}">${BT[k][0]}</button>`).join('')}<span class="sc" data-res></span></div>`;x.i&&x.i(s)}
Object.keys(X).forEach(render);
const val=q=>{const c=$('select,input,textarea',q);return c?c.value.trim():''};
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.say)return say(b.dataset.say);const a=b.dataset.act;if(!a)return;const s=b.closest('section'),n=+s.id.slice(1);
if(a=='reset')render(n);
else if(a=='chk'){let ok=0,all=0;$$('.q[data-a]',s).forEach(q=>{const c=$('select,input',q),v=norm(c.value);const g=q.dataset.a.split('|').some(y=>norm(y)==v);all++;c.classList.remove('ok','no');c.classList.add(g?'ok':'no');g?ok++:bad(q.dataset.t)});$('[data-res]',s).textContent=ok+'/'+all}
else if(a=='show')$$('.q[data-a]',s).forEach(q=>{const c=$('select,input',q);c.value=q.dataset.a.split('|')[0];c.classList.remove('no');c.classList.add('ok')});
else if(a=='copy'){const t=$$('.q',s).map(q=>q.dataset.p+val(q)).join('\n');navigator.clipboard.writeText(t).then(()=>{b.textContent='✓ Скопировано'},()=>{prompt('Скопируйте текст:',t)});setTimeout(()=>b.textContent=BT.copy[0],1800)}
});
</script></body></html>
