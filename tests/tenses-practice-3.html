<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Времена B1 — ошибки, конструктор, миллионер</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1d2433;--mu:#667;--bd:#dde1ea;--ac:#4f46e5;--ok:#15803d;--okb:#dcfce7;--no:#b91c1c;--nob:#fee2e2;--hi:#eef2ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141c;--card:#1b1e29;--tx:#e8eaf2;--mu:#9aa0b4;--bd:#2d3242;--ac:#818cf8;--ok:#4ade80;--okb:#12301d;--no:#f87171;--nob:#3a1717;--hi:#23264a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12141c;--card:#1b1e29;--tx:#e8eaf2;--mu:#9aa0b4;--bd:#2d3242;--ac:#818cf8;--ok:#4ade80;--okb:#12301d;--no:#f87171;--nob:#3a1717;--hi:#23264a;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:.2em 0}h2{font-size:1.15rem;margin:.2em 0}.mu{color:var(--mu);font-size:.9rem}
details{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;margin:10px 0}
summary{cursor:pointer;font-weight:600}details li{margin:4px 0}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 0}nav button{flex:none}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--ac)}button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
button:disabled{opacity:.4;cursor:default}
nav button.on{background:var(--hi);border-color:var(--ac);font-weight:600}
.item{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin:10px 0}
.item.ok{border-color:var(--ok)}.item.bad{border-color:var(--no)}
textarea{font:inherit;width:100%;box-sizing:border-box;padding:7px 10px;margin-top:6px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
.acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.fb{margin-top:8px;padding:8px 10px;border-radius:8px;font-size:.93rem;display:none}
.fb.ok{display:block;background:var(--okb)}.fb.no{display:block;background:var(--nob)}.fb.info{display:block;background:var(--hi)}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}.sc{margin-left:auto;font-weight:700}
.tk{display:inline-block;margin:2px;padding:2px 8px;border-radius:6px;border:1px solid var(--bd);cursor:pointer}
.tk.sel{background:var(--hi);border-color:var(--ac)}
.area{min-height:40px;border:1px dashed var(--bd);border-radius:10px;padding:6px;margin:6px 0}
.ladder{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0}
.ladder span{padding:2px 8px;border-radius:6px;border:1px solid var(--bd);font-size:.85rem}
.ladder .cur{background:var(--ac);color:#fff;border-color:var(--ac)}.ladder .done{background:var(--okb)}
.q{font-size:1.1rem;font-weight:600;margin:10px 0}
.qo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:520px){.qo{grid-template-columns:1fr}}
.qo button{text-align:left;padding:10px}
.qo .c{background:var(--okb);border-color:var(--ok)}.qo .w{background:var(--nob);border-color:var(--no)}.qo .h{visibility:hidden}
</style></head><body><main>
<h1>Времена · B1</h1>
<p class="mu">Find the mistake · Sentence Builder · свои предложения · «Кто хочет стать миллионером»</p>
<details><summary>Шпаргалка по временам</summary><ul id="rules"></ul></details>
<nav id="nav"></nav><div id="view"></div>
</main>
<script>
const R={
A:"Present Perfect Continuous: have/has been + V-ing — действие длится до сих пор или только что закончилось с видимым результатом.",
B:"Present Perfect Simple: have/has + V3 — результат, количество, глаголы состояния (yet, already, ever, never).",
C:"Past Simple: V2 / did + V1 — законченное действие с точным временем (yesterday, last year, ago).",
D:"Present Simple: V1 / V+s (he/she/it) — привычки и факты (every day, usually).",
E:"Present Continuous: am/is/are + V-ing — действие происходит сейчас (now, right now).",
F:"Future Simple: will + V1 (без to) — прогноз, решение в момент речи (tomorrow, I think).",
G:"С for/since нельзя Present Simple или Continuous — нужен Present Perfect (Continuous). live и work допускают обе формы.",
H:"Глаголы состояния (know, like, want, have) не используются в Continuous.",
I:"How long → чаще Present Perfect Continuous; How many/much → Present Perfect Simple.",
J:"Вопрос и отрицание: have/has (+ been), did/didn’t + V1, do/does + V1, won’t + V1."};
document.getElementById("rules").innerHTML=Object.values(R).map(r=>"<li>"+r+"</li>").join("");
const EX=[
{t:"find",title:"1. Find the mistake",intro:"Нажмите на слово с ошибкой.",items:[
["I *live* here since 2015.","have lived / have been living","G","since требует Present Perfect."],
["She *go* to work every day.","goes","D","she + Present Simple → V+s."],
["We *visit* Rome last year.","visited","C","last year → Past Simple."],
["Look! It *rains*.","is raining","E","Look! — действие происходит сейчас."],
["He *haven’t* called me since Monday.","hasn’t","J","he → hasn’t called."],
["I will *to* help you tomorrow.","(убрать to)","F","После will — V1 без to."],
["I didn’t *went* to school yesterday.","go","J","После didn’t — V1."],
["She is *knowing* the answer.","knows","H","know — глагол состояния, не Continuous."]]},
{t:"build",title:"2. Sentence Builder",intro:"Соберите предложение, нажимая на слова по порядку.",items:[
["I have been learning English for three years.","A","for three years + длящееся действие."],
["She went to Kraków last summer.","C","last summer → Past Simple."],
["Are you listening to me right now?","E","right now → Present Continuous, вопрос: Are + you + V-ing."],
["He doesn’t usually drink coffee.","D","usually → Present Simple, отрицание doesn’t + V1."],
["We will meet you at the station tomorrow.","F","tomorrow → will + V1."],
["How long have you been waiting?","I","How long → have + you + been + V-ing."],
["They haven’t finished the project yet.","B","yet → Present Perfect Simple."],
["Did you see that film last night?","C","last night → Past Simple, вопрос: Did + you + V1."]]}
];
const OPEN=["Yesterday I …","Right now I am …","I have been … for …","Tomorrow I will …","I usually … every …","I have already …"];
const QUIZ=[
["She ___ tea every morning.",["drinks","is drinking","has drunk","drank"],0,"every morning — привычка → Present Simple."],
["Yesterday we ___ to the cinema.",["go","went","have gone","are going"],1,"yesterday → Past Simple."],
["Quiet! The baby ___.",["sleeps","is sleeping","has slept","slept"],1,"Действие идёт прямо сейчас."],
["I ___ here since 2018.",["live","am living","have been living","lived"],2,"since 2018 → Present Perfect Continuous."],
["I think she ___ the exam tomorrow.",["passes","will pass","has passed","passed"],1,"I think + tomorrow → will."],
["How many pages ___ today?",["have you read","have you been reading","do you read","are you reading"],0,"How many → Present Perfect Simple."],
["He ___ me since Monday.",["doesn’t call","didn’t call","hasn’t called","isn’t calling"],2,"since Monday → Present Perfect."],
["Какой глагол НЕ используется в Continuous?",["run","wait","know","rain"],2,"know — глагол состояния."],
["Какой вопрос правильный?",["How long you have been waiting?","How long have you been waiting?","How long are you waiting?","How long did you been waiting?"],1,"Have + you + been + V-ing."],
["Какое предложение правильное?",["I have seen him yesterday.","I saw him yesterday.","I have been seeing him yesterday.","I see him yesterday."],1,"yesterday → только Past Simple."]];
const PRIZE=["100","200","300","500","1 000","2 000","4 000","8 000","16 000","32 000"],SAFE=4;
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const $=h=>{const d=document.createElement("div");d.innerHTML=h;return d.firstElementChild};
const nav=document.getElementById("nav"),view=document.getElementById("view");
const tabs=[...EX.map((e,i)=>["Упр. "+(i+1),()=>exercise(e)]),["Свои идеи",ideas],["Миллионер",quiz]];
tabs.forEach(([n,f])=>{const b=document.createElement("button");b.textContent=n;b.onclick=()=>{[...nav.children].forEach(x=>x.classList.remove("on"));b.classList.add("on");view.innerHTML="";f();scrollTo(0,0)};nav.appendChild(b)});
nav.children[0].click();
function exercise(ex){
 view.appendChild($(`<div><h2>${ex.title}</h2><p class="mu">${ex.intro}</p></div>`));
 const bar=$(`<div class="bar"><button class="pri" data-a="chk">Проверить всё</button><button data-a="ans">Показать все ответы</button><button data-a="rst">Сбросить</button><span class="sc"></span></div>`);
 view.appendChild(bar);const box=document.createElement("div");view.appendChild(box);let units=[];
 const score=()=>{bar.querySelector(".sc").textContent=units.filter(u=>u.ok).length+" / "+units.length};
 function draw(){box.innerHTML="";units=[];
  ex.items.forEach((d,i)=>{
   const it=$(`<div class="item"><b>${i+1}.</b> <span class="body"></span><div class="acts"><button class="pri">Проверить</button><button>Ответ</button></div><div class="fb"></div></div>`);
   const body=it.querySelector(".body"),fb=it.querySelector(".fb"),[bc,ba]=it.querySelectorAll("button");
   const u={ok:false,...mk(ex.t,d,body)};
   const expl=()=>`<br><b>Почему:</b> ${R[u.rule]} ${u.note}`;
   u.check=()=>{if(!u.filled()){fb.className="fb info";fb.textContent="Сначала выберите или соберите ответ.";return}
    u.ok=u.test();it.className="item "+(u.ok?"ok":"bad");fb.className="fb "+(u.ok?"ok":"no");
    fb.innerHTML=(u.ok?"✅ Верно!":"❌ Неверно. Правильный ответ: <b>"+u.ans+"</b>")+expl();score()};
   u.show=()=>{fb.className="fb info";fb.innerHTML="Ответ: <b>"+u.ans+"</b>"+expl()};
   bc.onclick=u.check;ba.onclick=u.show;units.push(u);box.appendChild(it)});score()}
 bar.onclick=e=>{const a=e.target.dataset.a;if(a=="chk")units.forEach(u=>u.check());if(a=="ans")units.forEach(u=>u.show());if(a=="rst")draw()};
 draw();
}
function mk(t,d,body){
 const rule=d[d.length-2],note=d[d.length-1];
 if(t=="find"){let sel=null;const tk=d[0].split(" "),w=tk.findIndex(x=>x.includes("*"));
  body.innerHTML=`<div>${tk.map(x=>`<span class="tk">${x.replace(/\*/g,"")}</span>`).join(" ")}</div>`;
  const bs=[...body.querySelectorAll(".tk")];bs.forEach((b,i)=>b.onclick=()=>{bs.forEach(x=>x.classList.remove("sel"));b.classList.add("sel");sel=i});
  return{rule,note,filled:()=>sel!==null,test:()=>sel===w,ans:tk[w].replace(/\*/g,"").replace(/[.,?]$/,"")+" → "+d[1]}}
 const w=d[0].split(" "),order=shuf(w);let ch=[];
 body.innerHTML=`<div class="area"></div><div class="pool"></div><button class="clr">Очистить</button>`;
 const area=body.querySelector(".area"),pool=body.querySelector(".pool");
 const draw=()=>{area.innerHTML=ch.map(x=>`<span class="tk sel">${x}</span>`).join(" ");pool.innerHTML="";
  const left=order.slice();ch.forEach(x=>left.splice(left.indexOf(x),1));
  left.forEach(x=>{const s=document.createElement("span");s.className="tk";s.textContent=x;s.onclick=()=>{ch.push(x);draw()};pool.appendChild(s)})};
 draw();body.querySelector(".clr").onclick=()=>{ch=[];draw()};
 return{rule,note,filled:()=>ch.length>0,test:()=>ch.join(" ")===d[0],ans:d[0]};
}
function ideas(){
 view.appendChild($(`<div><h2>Закончите предложения со своими идеями</h2><p class="mu">Допишите начало (замените …) и скопируйте всё одной кнопкой.</p></div>`));
 const box=document.createElement("div");view.appendChild(box);
 OPEN.forEach((s,i)=>box.appendChild($(`<div class="item"><b>${i+1}.</b> ${s}<textarea rows="2" placeholder="Напишите предложение целиком"></textarea></div>`)));
 const bar=$(`<div class="bar"><button class="pri">📋 Скопировать все ответы</button><span class="mu"></span></div>`);view.appendChild(bar);
 bar.querySelector("button").onclick=async()=>{
  const txt="Времена B1 — мои предложения\n"+[...box.querySelectorAll("textarea")].map((t,i)=>(i+1)+". "+(t.value.trim()||"(пусто)")).join("\n");
  let ok=false;try{await navigator.clipboard.writeText(txt);ok=true}catch(e){}
  if(!ok){try{const t=document.createElement("textarea");t.value=txt;document.body.appendChild(t);t.select();ok=document.execCommand("copy");t.remove()}catch(e){}}
  bar.querySelector("span").textContent=ok?"Скопировано ✅":"Не удалось скопировать — выделите текст вручную"};
}
function quiz(){
 let n=0,fifty=true,locked=false;const root=document.createElement("div");view.appendChild(root);
 const restart=()=>{n=0;fifty=true;draw()};
 function draw(){locked=false;const q=QUIZ[n];
  root.innerHTML=`<h2>Кто хочет стать миллионером?</h2>
  <div class="ladder">${PRIZE.map((p,i)=>`<span class="${i==n?"cur":i<n?"done":""}">${i+1}: $${p}${i==SAFE?" ★":""}</span>`).join("")}</div>
  <div class="q">Вопрос ${n+1}. ${q[0]}</div>
  <div class="qo">${q[1].map((o,i)=>`<button data-i="${i}"><b>${"ABCD"[i]}.</b> ${o}</button>`).join("")}</div>
  <div class="bar"><button id="f">50:50</button></div><div class="fb"></div>`;
  const f=root.querySelector("#f"),fb=root.querySelector(".fb"),bs=[...root.querySelectorAll(".qo button")];
  f.disabled=!fifty;
  f.onclick=()=>{if(locked)return;fifty=false;f.disabled=true;shuf(bs.map((_,i)=>i).filter(i=>i!=q[2])).slice(0,2).forEach(i=>bs[i].classList.add("h"))};
  bs.forEach(b=>b.onclick=()=>{if(locked)return;locked=true;const i=+b.dataset.i;bs[q[2]].classList.add("c");
   if(i==q[2]){fb.className="fb ok";fb.innerHTML="✅ Верно! "+q[3]+'<div class="acts"><button class="pri" id="nx">'+(n==QUIZ.length-1?"Завершить":"Дальше")+"</button></div>";
    root.querySelector("#nx").onclick=()=>{n++;n==QUIZ.length?end():draw()}}
   else{b.classList.add("w");fb.className="fb no";fb.innerHTML="❌ Неверно. "+q[3]+"<br>Ваш выигрыш: <b>"+(n>SAFE?"$"+PRIZE[SAFE]:"$0")+'</b><div class="acts"><button class="pri" id="rs">Играть снова</button></div>';
    root.querySelector("#rs").onclick=restart}})}
 function end(){root.innerHTML=`<h2>🏆 Вы выиграли $${PRIZE[PRIZE.length-1]}!</h2><p>Вы ответили на все вопросы — времена у вас под контролем.</p><button class="pri" id="rs">Играть снова</button>`;root.querySelector("#rs").onclick=restart}
 draw();
}
</script></body></html>
