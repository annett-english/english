<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>B1 Collocations: friendship, leadership, membership…</title>
<style>
:root{--bg:#f6f6f2;--cd:#fff;--tx:#1d1d1f;--mu:#6b6b70;--ac:#2563eb;--ok:#15803d;--okb:#dcfce7;--no:#b91c1c;--nob:#fee2e2;--bd:#deded8;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141416;--cd:#1e1e21;--tx:#ececee;--mu:#9a9aa2;--ac:#7aa2ff;--ok:#6ee7a0;--okb:#12301f;--no:#fca5a5;--nob:#3a1818;--bd:#33333a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141416;--cd:#1e1e21;--tx:#ececee;--mu:#9a9aa2;--ac:#7aa2ff;--ok:#6ee7a0;--okb:#12301f;--no:#fca5a5;--nob:#3a1818;--bd:#33333a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1100px;margin:auto;padding:16px;display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:16px}
@media(max-width:820px){.wrap{grid-template-columns:1fr}}
h1{font-size:1.4rem;margin:0}h2{font-size:1.1rem;margin:0 0 4px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--cd);border:1px solid var(--bd);border-radius:8px;padding:6px 10px}
button{cursor:pointer}button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) button.p{color:#111}}
.tb{width:100%;border-collapse:collapse}.tb td{padding:4px 6px;border-bottom:1px solid var(--bd);vertical-align:middle}
.tb .ip{color:var(--mu);font-family:ui-monospace,Menlo,monospace;font-size:.88rem}
.in{color:var(--mu);margin:0 0 8px}.txt{background:var(--bg);padding:10px;border-radius:8px}
.it{padding:7px 8px;border-radius:8px;margin:4px 0;border:1px solid transparent}
.it.good{background:var(--okb);border-color:var(--ok)}.it.bad{background:var(--nob);border-color:var(--no)}
.it input:not(.sm),.it textarea{width:100%;box-sizing:border-box;margin-top:4px}.sm{width:9em}
.res{font-size:.9rem;min-height:1em}.res b{color:var(--ac)}
.ch{margin:3px;padding:4px 10px}.ans{min-height:36px;border:1px dashed var(--bd);border-radius:8px;padding:2px;margin-top:4px}
.sc{font-weight:600;color:var(--mu)}
aside .card{position:sticky;top:12px}aside ul{padding-left:0;list-style:none;margin:6px 0;max-height:60vh;overflow:auto}
aside li{padding:4px 0;border-bottom:1px solid var(--bd);font-size:.92rem;cursor:pointer}aside li span{color:var(--no);font-weight:600}
#man{width:100%;height:120px;box-sizing:border-box}
</style></head><body><div class="wrap"><main>
<div class="card"><h1>B1 · Collocations: friendship · leadership · membership · partnership · relationship</h1>
<div class="bar"><label>Голос: <select id="vs"></select></label><button id="tst">🔊 Проверить звук</button><button id="all" class="p">📋 Скопировать все ответы</button><span id="msg" class="in"></span></div>
<div id="vst" class="in"></div><textarea id="man" hidden></textarea></div>
<div class="card"><h2>Повторение слов</h2><p class="in">Прослушайте каждое выражение (голос Google US English / Samantha) и повторите вслух.</p>
<div class="bar"><button id="pa">▶ Прослушать все</button></div><table class="tb" id="ref"></table></div>
<div id="ex"></div></main>
<aside><div class="card"><h2>Проблемные слова</h2><p class="in">Здесь собираются выражения, в которых была ошибка. Нажмите, чтобы послушать.</p><ul id="pl"></ul><button id="pc">Очистить</button></div></aside></div>
<script>
const $=s=>document.querySelector(s),sh=a=>[...a].sort(()=>Math.random()-.5);
const N={friendship:"ˈfrend.ʃɪp",leadership:"ˈliː.dɚ.ʃɪp",membership:"ˈmem.bɚ.ʃɪp",partnership:"ˈpɑːrt.nɚ.ʃɪp",relationship:"rɪˈleɪ.ʃən.ʃɪp",form:"fɔːrm",develop:"dɪˈvel.əp",build:"bɪld",end:"end",show:"ʃoʊ",get:"ɡet",apply:"əˈplaɪ",for:"fɚ",cancel:"ˈkæn.səl",a:"ə",skills:"skɪlz"};
const V=[["form a friendship","завязать дружбу"],["develop a friendship","развивать дружбу"],["build a friendship","выстраивать дружбу"],["end a friendship","закончить дружбу"],["show leadership","проявлять лидерские качества"],["develop leadership skills","развивать лидерские навыки"],["build leadership skills","развивать лидерские навыки"],["get membership","получить членство"],["apply for membership","подать заявку на вступление"],["cancel membership","отменить членство"],["form a partnership","создать партнёрство"],["develop a partnership","развивать партнёрство"],["build a partnership","выстраивать партнёрство"],["end a partnership","прекратить партнёрство"],["form a relationship","начать отношения"],["develop a relationship","развивать отношения"],["build a relationship","выстраивать отношения"],["end a relationship","закончить отношения"]];
$("#ref").innerHTML=V.map(([e,r])=>`<tr><td><button data-s="${e}" data-act="say">🔊</button></td><td><b>${e}</b></td><td class="ip">/${e.split(" ").map(w=>N[w]).join(" ")}/</td><td>${r}</td></tr>`).join("");
const VB=["form","develop","build","end","show","get","apply","cancel"];
const G=["applied for membership","formed a friendship","built a partnership","develop leadership skills","showed great leadership","ended the partnership","developed their relationship","cancelled his membership"];
const E=[
{t:"1. Listen and write",i:"Нажмите 🔊 и впишите выражение, которое услышали (с артиклем, если он есть).",it:[{s:"apply for membership"},{s:"end a relationship"},{s:"develop leadership skills",a:["develop leadership skills","build leadership skills"]},{s:"form a friendship"},{s:"cancel membership"},{s:"build a partnership"},{s:"show leadership"},{s:"develop a relationship"}]},
{t:"2. Collocations: choose the verb",i:"Выберите глагол, который сочетается с существительным.",it:[["It’s easy to ___ a friendship at summer camp.","form"],["I want to ___ my membership — I never go to the gym.","cancel"],["Teachers help children ___ leadership skills.","develop"],["You can ___ membership online in five minutes.","get"],["A good captain must ___ leadership on the field.","show"],["Honesty helps to ___ a relationship based on trust.","build"],["She decided to ___ the relationship after years of arguments.","end"],["Anyone can ___ for membership of the club.","apply"]].map(([q,a])=>({q,a:[a],o:VB}))},
{t:"3. Verb tenses",i:"Поставьте глагол в скобках в нужную форму.",it:[{q:"They ___ (form) a close friendship last year.",a:["formed"]},{q:"We ___ (develop) a good partnership since 2020.",a:["have developed"]},{q:"She ___ (end) the relationship tomorrow — she has decided.",a:["is ending","is going to end","will end"]},{q:"He ___ (build) a strong relationship with clients right now.",a:["is building"]},{q:"I ___ (cancel) my membership yesterday.",a:["cancelled","canceled"]},{q:"She often ___ (show) great leadership.",a:["shows"]},{q:"Before the meeting, they ___ (apply) for membership.",a:["had applied"]},{q:"Anna ___ (get) membership when she was 18.",a:["got"]}]},
{t:"4. Rephrase",i:"Перепишите предложение с выражением в скобках.",it:[["They became friends at school. (form)",["formed","friendship"],"They formed a friendship at school."],["Their cooperation is getting stronger. (develop)",["develop","partnership"],"They are developing their partnership."],["She stopped being a member of the gym. (cancel)",["cancel","membership"],"She cancelled her membership at the gym."],["He led the team very well. (show)",["show","leadership"],"He showed great leadership."],["They are slowly learning to trust each other. (build)",["build","relationship"],"They are building a relationship."],["Mark and Lena are no longer friends. (end)",["end","friendship"],"Mark and Lena ended their friendship."],["She asked to join the chess club. (apply)",["appl","membership"],"She applied for membership of the chess club."],["Helen wants to improve her ability to lead. (develop)",["develop","leadership"],"Helen wants to develop leadership skills."]].map(([q,k,m])=>({q,k,m}))},
{t:"5. Fill the text",i:"Выберите выражение для каждого пропуска по контексту.",x:"Last year Sam <b>(1)</b> at a local sports club, and there he <b>(2)</b> with Max. Soon they <b>(3)</b> and started a coaching business. Sam wanted to <b>(4)</b>, so he took a course. Max always <b>(5)</b> on the field. After a year they <b>(6)</b> because of a money problem, but later they <b>(7)</b> through honest talks. Then Sam moved abroad and <b>(8)</b>.",it:G.map((g,k)=>({q:"("+(k+1)+")",a:[g],o:G}))},
{t:"6. Build the chunk",i:"Нажимайте на слова, чтобы собрать выражение. Нажмите на слово в рамке, чтобы убрать.",it:[["apply for membership online","подайте заявку на членство онлайн"],["show real leadership","проявить настоящие лидерские качества"],["develop leadership skills at work","развивать лидерские навыки на работе"],["build a strong partnership","выстроить крепкое партнёрство"],["cancel my gym membership","отменить моё членство в спортзале"],["end a toxic friendship","закончить токсичную дружбу"],["form a business partnership","создать деловое партнёрство"],["develop a good relationship","развивать хорошие отношения"]].map(([a,q])=>({q,a:[a],t:1}))},
{t:"7. Complete the mini-situations",i:"Что вы скажете в этой ситуации? Напишите предложение с подходящим выражением.",it:[["You never use the gym, so you stop paying.",["cancel","membership"],"I want to cancel my membership."],["Two companies decide to work together.",["partnership"],"They formed a partnership."],["You want to join a library.",["appl","membership"],"I’ll apply for membership."],["A captain leads the team brilliantly in the final.",["show","leadership"],"He showed great leadership."],["You and your old friend stopped speaking for good.",["end","friendship"],"We ended our friendship."],["Two new neighbours start spending time together and become close.",["friendship"],"They formed a friendship."],["A manager wants to improve how she leads.",["develop","leadership"],"She wants to develop leadership skills."],["A couple works hard to make their trust stronger.",["build","relationship"],"They are building a relationship."]].map(([q,k,m])=>({q,k,m}))},
{t:"8. Finish with your own ideas",i:"Закончите предложения по-своему. Затем скопируйте все ответы одной кнопкой.",cp:1,free:1,it:[["I formed a friendship with …","my neighbour because we both love chess."],["To develop leadership skills, you should …","lead small projects at work."],["I would apply for membership in … because …","a swimming club because I need exercise."],["A strong partnership needs …","trust and honest communication."],["If I ended a friendship, it would be because …","the person lied to me again and again."],["To build a good relationship, it is important to …","listen and respect each other."],["I would cancel my membership if …","the prices went up too much."],["A person shows leadership when …","they help the team in difficult moments."]].map(([q,m])=>({q,m,free:1}))}
];
let P={};try{P=JSON.parse(localStorage.getItem("p1")||"{}")}catch(e){}
const norm=s=>s.toLowerCase().replace(/[’']/g,"'").replace(/[.,!?;]/g,"").replace(/\s+/g," ").trim();
const ok=(it,v)=>{const x=norm(v);return it.a?it.a.map(norm).includes(x):it.k.every(k=>x.includes(k))};
const row=(i,j)=>$(`#e${i} [data-j="${j}"]`);
const disp=it=>it.m||(it.q&&it.q.includes("___")?it.q.replace("___",it.a[0]):it.a[0]);
function drawP(){const k=Object.keys(P);$("#pl").innerHTML=k.length?k.map(w=>`<li data-act="say" data-s="${w.replace(/"/g,"")}">🔊 ${w} <span>×${P[w]}</span></li>`).join(""):"<li>Пока ошибок нет 🎉</li>";try{localStorage.setItem("p1",JSON.stringify(P))}catch(e){}}
function fieldH(it){if(it.t)return'<div class="ans"></div><div class="tl"></div>';if(it.free)return'<textarea rows="2" data-f placeholder="Ваше продолжение…"></textarea>';if(it.o)return`<select data-f><option value="">—</option>${it.oo.map(o=>`<option>${o}</option>`).join("")}</select>`;return`<input data-f class="${it.q&&it.q.includes("___")?"sm":""}" autocomplete="off" autocapitalize="off" spellcheck="false">`}
function draw(i){const ex=E[i];let h=`<h2>${ex.t} <span class="sc"></span></h2><p class="in">${ex.i}</p>${ex.x?`<p class="txt">${ex.x}</p>`:""}`;
ex.it.forEach((it,j)=>{if(!it.init){if(!it.a&&it.s)it.a=[it.s];if(it.o)it.oo=ex.fx?it.o:sh(it.o);if(it.t){it.w=it.a[0].split(" ");it.ord=sh(it.w.map((_,k)=>k))}it.init=1}it.cur=[];
const f=fieldH(it);let q=it.s?`<button data-act="say" data-s="${it.s}">🔊</button>`:it.q,inl=0;if(it.q&&it.q.includes("___")){q=it.q.replace("___",f);inl=1}
h+=`<div class="it" data-j="${j}"><div>${j+1}. ${q}${it.t?"":""}</div>${inl?"":f}<div class="res"></div></div>`});
h+=`<div class="bar">${ex.free?"":'<button class="p" data-act="chk">Проверить</button>'}<button data-act="shw">${ex.free?"Показать примеры":"Показать ответы"}</button><button data-act="rst">Сбросить</button>${ex.cp?'<button class="p" data-act="cpe">📋 Скопировать ответы</button>':""}</div>`;
$("#e"+i).innerHTML=h;ex.it.forEach((it,j)=>it.t&&tl(i,j))}
function tl(i,j){const it=E[i].it[j],r=row(i,j);r.querySelector(".ans").innerHTML=it.cur.map(k=>`<button class="ch" data-act="un" data-k="${k}">${it.w[k]}</button>`).join("")||'<i class="in"> …</i>';r.querySelector(".tl").innerHTML=it.ord.filter(k=>!it.cur.includes(k)).map(k=>`<button class="ch" data-act="tk" data-k="${k}">${it.w[k]}</button>`).join("")}
function getV(i,j){const it=E[i].it[j];if(it.t)return it.cur.map(k=>it.w[k]).join(" ");const f=row(i,j).querySelector("[data-f]");return f?f.value.trim():""}
function chk(i){let n=0;E[i].it.forEach((it,j)=>{const r=row(i,j),v=getV(i,j),g=ok(it,v);r.classList.toggle("good",g);r.classList.toggle("bad",!g);r.querySelector(".res").textContent=g?"✓":"✗";if(g)n++;else{const d=disp(it);P[d]=(P[d]||0)+1}});$(`#e${i} .sc`).textContent=n+" / "+E[i].it.length;drawP()}
function shw(i){E[i].it.forEach((it,j)=>{row(i,j).querySelector(".res").innerHTML="→ <b>"+disp(it)+"</b>"})}
function txt(ix){let t="";ix.forEach(i=>{t+=`\n${E[i].t}\n`;E[i].it.forEach((it,j)=>{const v=getV(i,j)||"—",q=it.s?"":it.q||"";t+=`${j+1}. `+(q.includes("___")?q.replace("___","["+v+"]"):q?q+" → "+v:v)+"\n"})});return t}
function msg(m){$("#msg").textContent=m;setTimeout(()=>$("#msg").textContent="",4000)}
async function cp(t){try{await navigator.clipboard.writeText(t);msg("Скопировано ✓")}catch(e){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();let g=false;try{g=document.execCommand("copy")}catch(_){}a.remove();msg(g?"Скопировано ✓":"Выделите текст в поле ниже и скопируйте вручную");if(!g){const m=$("#man");m.hidden=false;m.value=t;m.select()}}}
let VO=[];
function lv(){if(!("speechSynthesis"in window)){$("#vst").textContent="Озвучка не поддерживается этим браузером.";return}VO=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));const s=$("#vs");s.innerHTML=VO.map((v,k)=>`<option value="${k}">${v.name} (${v.lang})</option>`).join("");let k=VO.findIndex(v=>/Google US English/i.test(v.name));if(k<0)k=VO.findIndex(v=>/Samantha/i.test(v.name));if(k<0)k=VO.findIndex(v=>v.lang.replace("_","-")=="en-US");s.value=Math.max(k,0);$("#vst").textContent=VO.length?"":"Английские голоса не найдены — установите голос в системе."}
function say(t,q){if(!("speechSynthesis"in window))return;if(!q)speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";const v=VO[$("#vs").value];if(v)u.voice=v;u.rate=.9;speechSynthesis.speak(u)}
if("speechSynthesis"in window){speechSynthesis.onvoiceschanged=lv}lv();
$("#ex").innerHTML=E.map((_,i)=>`<section class="card" id="e${i}"></section>`).join("");E.forEach((_,i)=>draw(i));drawP();
$("#tst").onclick=()=>{say("Audio test. Form a friendship.");msg("Если вы слышите голос — звук работает")};
$("#pa").onclick=()=>{speechSynthesis.cancel();V.forEach(([e])=>say(e,1))};
$("#all").onclick=()=>cp("B1 Collocations — мои ответы\n"+txt(E.map((_,i)=>i)));
$("#pc").onclick=()=>{P={};drawP()};
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,s=b.closest("section"),i=s?+s.id.slice(1):0,r=b.closest("[data-j]"),j=r?+r.dataset.j:0;
if(a=="say")say(b.dataset.s);else if(a=="chk")chk(i);else if(a=="shw")shw(i);else if(a=="rst")draw(i);else if(a=="cpe")cp(txt([i]));
else if(a=="tk"){E[i].it[j].cur.push(+b.dataset.k);tl(i,j)}else if(a=="un"){const c=E[i].it[j].cur;c.splice(c.indexOf(+b.dataset.k),1);tl(i,j)}});
</script></body></html>
