<style>

</style></head><body><div class="w">
<h1>🎧 Collocations · A2</h1>
<div class="tabs" id="tabs"></div>
<div class="g"><main id="main"></main>
<aside><h3>⚠️ Проблемные слова</h3><small>Фразы, где была ошибка</small><ul id="ml"></ul><button id="mc">Очистить</button></aside></div>
<footer><h3>🔊 Проверка аудио</h3>

<button id="cp" class="pri">Скопировать мои ответы</button><textarea id="out" readonly placeholder="Здесь появятся ответы…"></textarea></footer>
</div>
<script>
const RAW=`wear|jewellery|носить украшения
wear|clothes|носить одежду
carry|a bag|носить / нести сумку
carry|a baby|нести ребёнка
win|a match|выиграть матч
win|a medal|выиграть / получить медаль
win|a prize|выиграть приз
earn|a salary|получать зарплату
earn|money|зарабатывать деньги
know|somebody well|хорошо знать кого-либо
know|something|знать что-либо
meet|somebody for the first time|впервые встретиться с кем-либо
meet|somebody at 11 o’clock|встретиться с кем-либо в 11 часов
hope|that something good will happen|надеяться, что произойдёт что-то хорошее
hope|to do something|надеяться сделать что-либо
wait for|a bus|ждать автобус
wait|for a long time|ждать долго
watch|TV|смотреть телевизор
watch|a match|смотреть матч
look at|a photo|смотреть на фотографию
look at|a view|смотреть на вид / пейзаж
look|happy|выглядеть счастливым
look|about 25 years old|выглядеть примерно на 25 лет
look like|your mother|быть похожим на маму
look like|a model|выглядеть как модель
miss|the bus|опоздать на автобус
miss|a class|пропустить занятие
lose|a match|проиграть матч
lose|your glasses|потерять очки
bring|your dictionary to class|принести словарь на занятие
bring|an umbrella with you|взять с собой зонтик
bring|something back from holiday|привезти что-либо из отпуска
take|your children to school|отвести детей в школу
look for|your glasses|искать очки
look for|a job|искать работу
find|your glasses|найти очки
find|a job|найти работу
say|sorry|сказать «извини»
say|hello|поздороваться / сказать «привет»
say|something to somebody|сказать что-либо кому-либо
tell|a joke|рассказать шутку
tell|a lie|солгать / сказать неправду
tell|somebody something|сказать / рассказать кому-либо что-либо
lend|money to somebody|одолжить деньги кому-либо
borrow|money from somebody|занять деньги у кого-либо
hear|a noise|услышать шум
hear|the doorbell|услышать звонок в дверь
listen to|music|слушать музыку
listen to|the radio|слушать радио`;
const IPA={wear:'/wɛr/',carry:'/ˈkæri/',win:'/wɪn/',earn:'/ɝn/',know:'/noʊ/',meet:'/mit/',hope:'/hoʊp/',wait:'/weɪt/',watch:'/wɑtʃ/',look:'/lʊk/',miss:'/mɪs/',lose:'/luz/',bring:'/brɪŋ/',take:'/teɪk/',find:'/faɪnd/',say:'/seɪ/',tell:'/tɛl/',lend:'/lɛnd/',borrow:'/ˈbɑroʊ/',hear:'/hɪr/',listen:'/ˈlɪsən/'};
const P=RAW.split('\n').map((l,i)=>{const[v,r,ru]=l.split('|');return{v,r,ru,i,t:v+' '+r}});
const $=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const nz=s=>s.toLowerCase().replace(/[’‘`]/g,"'").replace(/[.,!?;]/g,'').replace(/\s+/g,' ').trim();
const valid=(v,r)=>!!v&&P.some(p=>nz(p.v)==nz(v)&&nz(p.r)==nz(r));
const PH=/somebody|something|your|that/;
/* ---- audio ---- */
let V=null,VL=[];
function initV(){if(!window.speechSynthesis)return;VL=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));
 V=VL.find(v=>/Google US English/i.test(v.name))||VL.find(v=>/Samantha/i.test(v.name))||VL.find(v=>v.lang.replace('_','-')=='en-US')||VL[0]||null;
 const s=document.getElementById('vsel');s.innerHTML=VL.map((v,i)=>`<option value="${i}"${v==V?' selected':''}>${v.name} (${v.lang})</option>`).join('');
 const ok=V&&/Google US English|Samantha/i.test(V.name);
 document.getElementById('vst').textContent=!window.speechSynthesis?'❌ Аудио не поддерживается браузером':!V?'⚠️ Английские голоса не найдены':ok?'✅ Голос: '+V.name:'⚠️ Google US English / Samantha не найдены, используется: '+V.name}
function say(t,q){try{if(!q)speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';if(V)u.voice=V;u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
if(window.speechSynthesis){speechSynthesis.onvoiceschanged=initV}
/* ---- mistakes ---- */
let M={};try{M=JSON.parse(localStorage.getItem('colM')||'{}')}catch(e){}
function bump(i){M[i]=(M[i]||0)+1;try{localStorage.setItem('colM',JSON.stringify(M))}catch(e){}renderM()}
function renderM(){const ul=document.getElementById('ml');const a=Object.entries(M).sort((x,y)=>y[1]-x[1]).slice(0,10);
 ul.innerHTML=a.length?'':'<small>Пока ошибок нет 👍</small>';
 a.forEach(([i,n])=>{const li=$('li','',`<button class="sp">🔊</button> ${P[i].t} <b>×${n}</b>`);li.querySelector('button').onclick=()=>say(P[i].t);ul.append(li)})}
document.getElementById('mc').onclick=()=>{M={};try{localStorage.removeItem('colM')}catch(e){}renderM()};
/* ---- engine ---- */
function row(b,h){const r=$('div','row');r.append($('div','q',h));b.append(r);return r}
function mkS(i,f,ans,ok,ik){return{el:i,get:()=>i.value,ok:v=>ok(nz(v)),mark:b=>{i.className=b?'ok':'no';f.textContent=b?'✓':'✗'},show:()=>{i.value=ans;i.className='sh';f.textContent='→ '+ans},ik}}
function tin(r,ans,ok,ik,ph){const i=$('input');i.placeholder=ph||'';i.setAttribute('autocapitalize','off');i.setAttribute('autocomplete','off');i.spellcheck=false;const f=$('div','fb');r.append(i,f);return mkS(i,f,ans,ok,ik)}
function tch(r,os,ok,ik,ans){let sel='';const w=$('div','opts'),f=$('div','fb');
 os.forEach(o=>{const x=$('button','opt',o);x.onclick=()=>{sel=o;[...w.children].forEach(c=>{c.classList.remove('good','bad');c.classList.toggle('on',c==x)})};w.append(x)});r.append(w,f);
 return{el:w,get:()=>sel,ok:v=>ok(v),mark:b=>{[...w.children].forEach(c=>{if(c.classList.contains('on'))c.classList.add(b?'good':'bad')});f.textContent=b?'✓':'✗'},
 show:()=>{[...w.children].forEach(c=>{c.classList.remove('on','bad','good');if(c.textContent==ans)c.classList.add('good')});f.textContent='→ '+ans},ik}}
const EX=[],secs=[];
function mkEx(title,desc,build){const s=$('section','pn',`<h2>${title}</h2><p class="d">${desc}</p>`);const b=$('div'),S=[],bar=$('div','bar'),sc=$('span','sc');
 const bt=(t,f,c)=>{const x=$('button',c||'',t);x.onclick=f;bar.append(x)};
 bt('Проверить',()=>{let n=0;S.forEach(x=>{const v=x.get(),o=x.ok(v);x.st=o?'✓':'✗';x.mark(o);if(o)n++;else if(x.ik!=null&&v&&x.lg!==v)bump(x.ik);x.lg=v});sc.textContent=`${n} / ${S.length}`},'pri');
 bt('Показать ответы',()=>{S.forEach(x=>{x.show();x.st='👁'});sc.textContent=''});
 bt('Новый набор',()=>{b.innerHTML='';S.length=0;sc.textContent='';build(b,S)});
 bar.append(sc);s.append(b,bar);EX.push({title,S});build(b,S);secs.push(s);return s}
/* ---- exercises ---- */
const G=[['wear','carry','take','bring'],['win','earn','find'],['say','tell'],['lend','borrow'],['hear','listen to','watch'],['look','look at','look like','look for','watch'],['miss','lose'],['find','look for','lose'],['know','meet']];
const VS=[...new Set(P.map(p=>p.v))];
function opts(p){let c=sh([...new Set(G.filter(g=>g.includes(p.v)).flat())]).filter(o=>o!=p.v&&!valid(o,p.r)).slice(0,3);
 sh(VS).forEach(o=>{if(c.length<3&&o!=p.v&&!c.includes(o)&&!valid(o,p.r))c.push(o)});return sh([p.v,...c])}
function e3(b,S){sh(P).slice(0,8).forEach(p=>{const r=row(b,`<b>___</b> ${p.r}<small>${p.ru}</small>`);S.push(tch(r,opts(p),v=>valid(v,p.r),p.i,p.v))})}
function e2(b,S){sh(P).slice(0,8).forEach(p=>{const r=row(b,`<button class="sp">🔊 Слушать</button><small>${p.ru}</small>`);r.querySelector('button').onclick=()=>say(p.t);S.push(tin(r,p.t,v=>v==nz(p.t),p.i,'Напиши фразу целиком'))})}
function e4(b,S){const u=new Set(),ps=[];sh(P).forEach(p=>{if(ps.length<8&&!u.has(p.r)){u.add(p.r);ps.push(p)}});
 const L=sh(ps),R=sh(ps),pl=L.map(()=>-1);let sl=-1;const g=$('div','mt'),cl=$('div'),cr=$('div');g.append(cl,cr);
 const lb=L.map(p=>{const x=$('button','opt',p.v);cl.append(x);return x}),rb=R.map(p=>{const x=$('button','opt',p.r);cr.append(x);return x});
 const clr=()=>[...lb,...rb].forEach(x=>x.classList.remove('good','bad'));
 const paint=()=>{[...lb,...rb].forEach(x=>{x.style.borderColor='';x.classList.remove('on')});pl.forEach((ri,li)=>{if(ri>=0)lb[li].style.borderColor=rb[ri].style.borderColor=`hsl(${li*45},70%,50%)`});if(sl>=0)lb[sl].classList.add('on')};
 lb.forEach((x,li)=>x.onclick=()=>{clr();sl=li;paint()});
 rb.forEach((x,ri)=>x.onclick=()=>{if(sl<0)return;clr();pl.forEach((v,k)=>{if(v==ri)pl[k]=-1});pl[sl]=ri;sl=-1;paint()});
 b.append($('small','','Нажми глагол слева, затем окончание справа.'),g);
 L.forEach((p,li)=>S.push({el:g,get:()=>pl[li]>=0?R[pl[li]].r:'',ok:v=>valid(p.v,v),mark:o=>{lb[li].classList.add(o?'good':'bad')},show:()=>{pl[li]=R.indexOf(p);lb[li].classList.remove('bad');lb[li].classList.add('good');paint()},ik:p.i}))}
const TX=["I love football and I always {watch} matches on TV with my dad. Our team plays well: we often {win}, but sometimes we {lose}. On Saturday I {meet} my friends at 11 o'clock. I never {miss} the bus, because I {wait} for it at the stop. I {bring} my scarf and I {say} hello to everybody.",
"Every morning I {look for} my glasses, but I can't {find} them. At breakfast we {listen to} the radio. I never {borrow} money from my friends, but sometimes I {lend} money to my brother. When I {hear} the doorbell, I {say} hello. Then I {take} the kids to school."];
let tn=0;
function e5(b,S){const t=TX[tn++%2];const ws=[...t.matchAll(/\{(.+?)\}/g)].map(m=>m[1]);
 b.append($('div','bank',sh(ws).map(w=>`<span>${w}</span>`).join('')));const p=$('p','txt');
 t.split(/\{(.+?)\}/).forEach((s,j)=>{if(j%2){const i=$('input','g');i.style.width=(s.length+3)+'ch';i.setAttribute('autocapitalize','off');const f=$('span','fb');p.append(i,f);S.push(mkS(i,f,s,v=>v==nz(s),null))}else p.append(s)});b.append(p)}
const MODS=['every morning','with my friends','at the weekend','in the city','after school','on Sunday'];
function e6(b,S){sh(P.filter(p=>!PH.test(p.r))).slice(0,8).forEach(p=>{const m=sh(MODS)[0];
 const r=row(b,`Расширь: <i>I … </i> + <b>${p.t}</b><small>Добавь где / когда / с кем (${p.ru})</small>`);
 S.push(tin(r,`I ${p.t} ${m}.`,v=>v.includes(nz(p.r))&&v.split(' ').length>=p.t.split(' ').length+2,p.i,'Напиши предложение'))})}
function e7(b,S){const sel=new Set(Object.entries(M).sort((x,y)=>y[1]-x[1]).slice(0,3).map(e=>+e[0]));
 b.append($('p','d','Выбери 3 фразы, в которых ты меньше всего уверен(а). Твои ошибки уже отмечены.'));
 const cw=$('div','chips'),out=$('div');
 P.forEach(p=>{const c=$('button','chip'+(sel.has(p.i)?' on':''),p.t);c.onclick=()=>{if(sel.has(p.i))sel.delete(p.i);else if(sel.size<3)sel.add(p.i);c.classList.toggle('on',sel.has(p.i))};cw.append(c)});
 const go=$('button','pri','Создать задания');
 go.onclick=()=>{out.innerHTML='';S.length=0;[...sel].forEach(i=>{const p=P[i];let r=row(out,`🇷🇺→🇬🇧 <b>${p.ru}</b>`);
  S.push(tin(r,p.t,v=>v==nz(p.t),p.i,'Напиши по-английски'));
  r=row(out,'<button class="sp">🔊 Слушать</button> и напиши');r.querySelector('button').onclick=()=>say(p.t);S.push(tin(r,p.t,v=>v==nz(p.t),p.i));
  r=row(out,`Своё предложение с <b>${p.t}</b>`);const ph=PH.test(p.r);
  S.push(tin(r,'I '+p.t+(ph?' (подставь своё слово)':' every day.'),v=>(ph||v.includes(nz(p.r)))&&v.split(' ').length>3,p.i,'Своё предложение'))})};
 b.append(cw,go,out)}
/* ---- quiz ---- */
const L=[100,200,300,500,1000,2000,4000,8000,16000,32000,64000,125000,250000,500000,1000000];
function mkQuiz(){const s=$('section','pn','<h2>🎰 Кто хочет стать миллионером?</h2><p class="d">15 вопросов. Ошибка — игра окончена. Подсказка 50:50 — один раз.</p>');
 const bd=$('div');s.append(bd);let mode='ch';
 const start=()=>run(sh(P).slice(0,15).map((p,i)=>({p,t:mode=='ty'?i%2:i%3})),0,true);
 function run(qs,n,ff){bd.innerHTML='';const{p,t}=qs[n];
  bd.append($('div','lad',`Вопрос <b>${n+1}</b>/15 · 💰 ${n?L[n-1]:0} → ${L[n]}`));
  const md=$('button','',mode=='ch'?'Режим: варианты ✎ сменить на «пишу сам»':'Режим: пишу сам ✎ сменить на «варианты»');md.onclick=()=>{mode=mode=='ch'?'ty':'ch';start()};bd.append(md);
  bd.append($('div','qq',t==0?`<b>___ ${p.r}</b><small>${p.ru}</small>`:t==1?`Как по-английски: <b>${p.ru}</b>?`:`Что значит: <b>${p.t}</b>?`));
  const ans=t==0?p.v:t==1?p.t:p.ru,msg=$('div','d');
  const end=ok=>{if(ok){if(n==14){msg.innerHTML='🎉 <b>Миллион! Ты выиграл(а) 1 000 000!</b>'}else{msg.textContent='✓ Верно!';setTimeout(()=>run(qs,n+1,ff),800);return}}else{bump(p.i);msg.innerHTML=`✗ Правильно: <b>${ans}</b>. Твой выигрыш: 💰 ${n?L[n-1]:0}`}
   const r=$('button','pri','Играть снова');r.onclick=start;msg.append($('br'),r)};
  if(mode=='ch'){const os=t==0?opts(p):t==1?opts(p).map(o=>o+' '+p.r):sh([p.ru,...sh(P.filter(x=>x.ru!=p.ru)).slice(0,3).map(x=>x.ru)]);
   const w=$('div','opts');const bs=os.map(o=>{const x=$('button','opt',o);x.onclick=()=>{bs.forEach(y=>y.disabled=true);const ok=o==ans||(t==0&&valid(o,p.r))||(t==1&&nz(o)==nz(p.t));x.classList.add(ok?'good':'bad');bs.forEach(y=>{if(y.textContent==ans)y.classList.add('good')});end(ok)};w.append(x);return x});bd.append(w);
   if(ff){const f=$('button','','50:50');f.onclick=()=>{sh(bs.filter(y=>y.textContent!=ans&&!(t==0&&valid(y.textContent,p.r)))).slice(0,2).forEach(y=>y.style.visibility='hidden');f.remove();ff=false};bd.append($('br'),f)}}
  else{const i=$('input');i.placeholder='Твой ответ';i.setAttribute('autocapitalize','off');const go=$('button','pri','Ответить');
   const chk=()=>{i.disabled=go.disabled=true;const ok=t==0?valid(i.value,p.r):nz(i.value)==nz(p.t);i.className=ok?'ok':'no';end(ok)};go.onclick=chk;i.onkeydown=e=>{if(e.key=='Enter')chk()};bd.append(i,' ',go)}
  bd.append(msg)}
 start();secs.push(s)}
