<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Transport · B1 vocabulary</title>
<style>
:root{color-scheme:light dark;--bg:#f7f6f2;--card:#fff;--tx:#1d1d1b;--mu:#6b6a64;--ac:#2a5bd7;--ok:#1f8a4c;--no:#c93a3a;--bd:#e2e0d8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#16171a;--card:#202226;--tx:#ecebe6;--mu:#9a998f;--ac:#7aa2ff;--ok:#4fcf84;--no:#ff7a7a;--bd:#33353b}}
:root[data-theme=dark]{--bg:#16171a;--card:#202226;--tx:#ecebe6;--mu:#9a998f;--ac:#7aa2ff;--ok:#4fcf84;--no:#ff7a7a;--bd:#33353b}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px;display:grid;grid-template-columns:1fr 250px;gap:16px;align-items:start}
@media(max-width:800px){.wrap{grid-template-columns:1fr}aside{order:-1}}
h1{margin:0 0 4px;font-size:26px}h2{font-size:18px;margin:0 0 4px;display:flex;justify-content:space-between;gap:8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px}
.mu{color:var(--mu);margin:0 0 10px;font-size:14px}
aside .card{position:sticky;top:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.w{border:1px solid var(--bd);border-radius:8px;padding:8px 10px;font-size:14px}
.w b{font-size:16px}.ipa{color:var(--ac);font-size:13px}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:6px 12px}
button:hover{border-color:var(--ac)}
.ic{padding:0 6px;border-radius:50%}.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
.it{padding:10px 0;border-top:1px solid var(--bd)}.q{margin-bottom:6px}
.op{display:flex;flex-wrap:wrap;gap:6px}
.o.ok,.fb.ok{border-color:var(--ok);color:var(--ok)}.o.no,.fb.no{border-color:var(--no);color:var(--no)}
.ty{display:flex;gap:6px;flex-wrap:wrap}
input,textarea{font:inherit;flex:1;min-width:160px;padding:6px 10px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
.fb{margin-top:4px;font-size:14px;min-height:0}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;padding:3px 0;border-bottom:1px solid var(--bd)}
.sc{color:var(--mu);font-weight:400}
</style></head><body>
<div class="wrap"><main>
<h1>🚗 Transport · B1</h1>
<p class="mu">Повторение лексики и практика: 3 задания на узнавание и 4 на письмо.</p>
<div class="card"><h2>Слова темы</h2>
<p class="mu">Задание: нажми 🔊, прослушай каждое слово и повтори вслух. <span id="vs"></span></p>
<p><button class="pri" id="all">▶ Прослушать все</button> <button id="test">Проверить звук</button></p>
<div class="grid" id="words"></div></div>
<div id="ex"></div>
<div class="card"><h2>Итог</h2><p id="sum" class="mu"></p>
<button class="pri" id="copy">📋 Скопировать все мои ответы</button> <button id="re">↻ Начать заново (перемешать)</button> <span id="cs" class="mu"></span></div>
</main>
<aside><div class="card"><h2>Проблемные слова</h2><div id="pw" class="mu">Пока ошибок нет 🎉</div></div></aside></div>
<script>
const W=[["truck","грузовик (амер.)","/trʌk/"],["scooter","скутер, самокат","/ˈskuːtər/"],["the Underground","лондонское метро","/ði ˈʌndərɡraʊnd/"],["lorry","грузовик (брит.)","/ˈlɔːri/"],["motorway","автострада (брит.)","/ˈmoʊtərweɪ/"],["subway","метро (амер.)","/ˈsʌbweɪ/"],["freeway","автострада (амер.)","/ˈfriːweɪ/"],["coach","междугородний автобус","/koʊtʃ/"],["van","фургон","/væn/"],["ferry","паром","/ˈferi/"],["motorbike","мотоцикл","/ˈmoʊtərbaɪk/"],["tram","трамвай","/træm/"],["traffic jam","пробка","/ˈtræfɪk dʒæm/"],["petrol station","автозаправка","/ˈpetrəl ˌsteɪʃn/"],["speed camera","камера контроля скорости","/ˈspiːd ˌkæmərə/"],["pedestrian zone","пешеходная зона","/pəˈdestriən zoʊn/"],["road works","дорожные работы","/ˈroʊd wɜːrks/"],["speed limit","ограничение скорости","/ˈspiːd ˌlɪmɪt/"],["cycle lane","велодорожка","/ˈsaɪkl leɪn/"],["rush hour","час пик","/ˈrʌʃ aʊər/"],["seat belt","ремень безопасности","/ˈsiːt belt/"],["zebra crossing","пешеходный переход","/ˌzebrə ˈkrɒsɪŋ/"],["parking fine","штраф за парковку","/ˈpɑːrkɪŋ faɪn/"],["taxi rank","стоянка такси","/ˈtæksi ræŋk/"],["car crash","авария","/ˈkɑːr kræʃ/"],["traffic lights","светофор","/ˈtræfɪk laɪts/"]];
const $=s=>document.querySelector(s);
const sh=a=>{a=[...a];for(let i=a.length;i>1;){const j=Math.random()*i--|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const n=s=>s.toLowerCase().replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim();
const cmp=s=>n(s).replace(/^the /,'').replace(/ /g,'');
const oth=(w,k)=>sh(W.filter(x=>x!==w)).slice(0,k);
let V=null,P={},S={},L={},T={};
function pick(){const v=speechSynthesis.getVoices();V=v.find(x=>/Google US English/i.test(x.name))||v.find(x=>/Samantha/i.test(x.name))||v.find(x=>x.lang=='en-US'||x.lang=='en_US')||v.find(x=>/^en/i.test(x.lang))||null;$('#vs').textContent=V?'Голос: '+V.name+'.':'Английский голос не найден — используется голос по умолчанию.'}
function say(t){if(!('speechSynthesis' in window)){alert('Озвучка не поддерживается этим браузером. Попробуйте Chrome или Safari.');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.9;if(V)u.voice=V;speechSynthesis.speak(u)}
if('speechSynthesis' in window){pick();speechSynthesis.onvoiceschanged=pick}else $('#vs').textContent='Озвучка недоступна в этом браузере.';
document.addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(b)say(b.dataset.s)});
$('#test').onclick=()=>say('Hello! Let’s practise transport vocabulary.');
$('#all').onclick=()=>{if(!('speechSynthesis' in window))return say('');speechSynthesis.cancel();W.forEach(w=>{const u=new SpeechSynthesisUtterance(w[0]);u.lang='en-US';u.rate=.85;if(V)u.voice=V;speechSynthesis.speak(u)})};
$('#words').innerHTML=W.map(w=>`<div class="w"><b>${w[0]}</b> <button class="ic" data-s="${w[0]}">🔊</button><br><span class="ipa">${w[2]}</span><br>${w[1]}</div>`).join('');
function renderP(){const e=Object.entries(P).sort((a,b)=>b[1]-a[1]);$('#pw').innerHTML=e.length?'<table>'+e.map(x=>`<tr><td>${x[0]}</td><td>×${x[1]}</td></tr>`).join('')+'</table>':'Пока ошибок нет 🎉'}
function sec(id,t,ins,items){
 S[id]=new Set();L[id]={};T[id]=t;
 const s=document.createElement('section');s.className='card';
 s.innerHTML=`<h2><span>${t}</span><span class="sc">0/${items.length}</span></h2><p class="mu">${ins}</p>`;
 items.forEach((it,i)=>{
  const d=document.createElement('div');d.className='it';
  const plain=it.q.replace(/<[^>]+>/g,'');
  d.innerHTML=`<div class="q">${i+1}. ${it.q}${it.say?` <button class="ic" data-s="${it.say}">🔊</button>`:''}</div>`+
   (it.opts?`<div class="op">${it.opts.map(o=>`<button class="o">${o}</button>`).join('')}</div><div class="ty"><button class="b2">Показать ответ</button></div>`
   :`<div class="ty">${it.ta?'<textarea rows="2" placeholder="Write here…"></textarea>':'<input autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type here…">'}<button class="b1">Проверить</button><button class="b2">Показать ответ</button></div>`)+'<div class="fb"></div>';
  const fb=d.querySelector('.fb');let bad=false,done=false;
  const sc=()=>s.querySelector('.sc').textContent=S[id].size+'/'+items.length;
  const miss=()=>{if(!bad){bad=true;if(it.w){P[it.w]=(P[it.w]||0)+1;renderP()}}};
  const good=()=>{done=true;if(!bad)S[id].add(i);sc()};
  const show=()=>{fb.className='fb no';fb.textContent='Ответ: '+it.show;miss()};
  if(it.opts){
   const bs=[...d.querySelectorAll('.o')];
   bs.forEach(b=>b.onclick=()=>{if(done)return;const v=b.textContent;if(v===it.ans){b.classList.add('ok');L[id][i]=`${i+1}. ${plain} → ${v} ${bad?'(с ошибкой)':'✓'}`;good()}else{b.classList.add('no');miss();L[id][i]=`${i+1}. ${plain} → ${v} ✗`}});
   d.querySelector('.b2').onclick=()=>{if(done)return;bs.forEach(b=>{if(b.textContent===it.ans)b.classList.add('ok')});miss();done=true;L[id][i]=`${i+1}. ${plain} → (показан ответ: ${it.ans})`;sc()};
  }else{
   const inp=d.querySelector('input,textarea');
   d.querySelector('.b1').onclick=()=>{const v=inp.value.trim();if(!v){fb.textContent='Сначала напиши ответ.';fb.className='fb';return}
    const r=it.chk(v);L[id][i]=`${i+1}. ${plain} → ${v} ${r?'✓':'✗'}`;
    if(r){fb.className='fb ok';fb.textContent='✅ Верно! '+(it.ta?'':'Образец: '+it.show);good()}else{fb.className='fb no';fb.textContent=it.ta?'Нужно слово «'+it.w+'» и минимум 4 слова.':'Пока не совсем. Попробуй ещё или нажми «Показать ответ».';miss()}};
   d.querySelector('.b2').onclick=()=>{show();if(!L[id][i])L[id][i]=`${i+1}. ${plain} → (показан ответ: ${it.show})`};
  }
  s.appendChild(d)});
 $('#ex').appendChild(s)}
const DEF=[["ferry","a boat that carries people and cars across water"],["tram","an electric vehicle that runs on rails in the street"],["traffic jam","a long line of cars that are moving very slowly or not at all"],["seat belt","a strap you wear in a car to keep you safe"],["speed camera","a device by the road that photographs cars driving too fast"],["zebra crossing","black and white stripes where people can cross the road"],["taxi rank","a place where taxis wait for passengers"],["petrol station","a place where you buy fuel for your car"],["cycle lane","a part of the road just for people on bikes"],["rush hour","the time of day when roads and trains are the busiest"]];
const GAP=[["I was late because we got stuck in a ___ on the way to work.","traffic jam"],["Slow down! The ___ here is 30 km/h.","speed limit"],["Always fasten your ___ before you start driving.","seat belt"],["Only one lane is open because of ___ ahead.","road works"],["There is no bridge, so we crossed the river by ___.","ferry"],["He got a ___ because he left his car outside the shop for three hours.","parking fine"],["In London I take ___ to work.","the Underground"],["Cars can’t enter the city centre. It’s a ___.","pedestrian zone"],["Wait for the ___ to turn green before you cross.","traffic lights"],["Two cars were badly damaged in a ___ on the motorway.","car crash"]];
const FIRST=["truck","subway","ferry","seat belt","speed camera","road works","parking fine","taxi rank","zebra crossing","freeway"];
const TR=[["Мы застряли в пробке на автостраде.",[["stuck"],["traffic jam"],["motorway","freeway"]],"We got stuck in a traffic jam on the motorway."],["Пристегни ремень безопасности.",[["seat belt","seatbelt"],["fasten","buckle","put on"]],"Fasten your seat belt."],["Ограничение скорости здесь — 50 км/ч.",[["speed limit"],["50","fifty"]],"The speed limit here is 50 km/h."],["В час пик я езжу на трамвае.",[["rush hour"],["tram"]],"In rush hour I go by tram."],["Он получил штраф за парковку.",[["parking fine"]],"He got a parking fine."],["Здесь стоит камера контроля скорости.",[["speed camera"]],"There is a speed camera here."],["Переходи дорогу по зебре.",[["zebra crossing"],["cross"]],"Cross the road at the zebra crossing."],["На дороге ремонт, поэтому движение медленное.",[["road works","roadworks"],["slow"]],"There are road works, so the traffic is slow."],["Паром отправляется через час.",[["ferry"],["hour"]],"The ferry leaves in an hour."],["В центре пешеходная зона, машинам нельзя.",[["pedestrian zone"],["car"]],"The city centre is a pedestrian zone — no cars allowed."]];
const OWN=[["traffic jam","Describe a day when you were late.","I was late for school because of a traffic jam."],["rush hour","How do you travel at this time?","In rush hour I usually take the tram."],["ferry","Have you ever been on one?","I took a ferry to Sweden last summer."],["speed limit","What is it near your home?","The speed limit near my house is 50 km/h."],["cycle lane","Are there any in your city?","There is a new cycle lane near my school."],["the Underground","Compare it with the bus.","The Underground is faster than the bus."],["car crash","Say what you would do.","If I see a car crash, I call an ambulance."],["taxi rank","Where is the nearest one?","The nearest taxi rank is next to the station."]];
function build(){
 $('#ex').innerHTML='';P={};renderP();
 sec('A','1. Listen & pick','Послушай слово и выбери его значение.',sh(W).slice(0,10).map(w=>({w:w[0],say:w[0],q:'Что это значит?',opts:sh([w[1],...oth(w,3).map(x=>x[1])]),ans:w[1],show:w[1]})));
 sec('B','2. Guess the word','Прочитай определение и выбери слово.',sh(DEF).map(d=>({w:d[0],q:'<i>'+d[1]+'</i>',opts:sh([d[0],...oth(W.find(x=>x[0]==d[0]),3).map(x=>x[0])]),ans:d[0],show:d[0]})));
 sec('C','3. Which word fits?','Выбери слово, которое подходит по смыслу.',sh(GAP).map(g=>({w:g[1],q:g[0].replace('___','_____'),opts:sh([g[1],...oth(W.find(x=>x[0]==g[1]),3).map(x=>x[0])]),ans:g[1],show:g[1]})));
 sec('D','4. Listen & write ✍️','Послушай и напиши слово или выражение (можно слушать сколько угодно).',sh(["scooter","lorry","motorway","motorbike","petrol station","speed limit","rush hour","cycle lane","tram","freeway"]).map(w=>({w,say:w,q:'Напиши, что услышал(а):',chk:v=>cmp(v)==cmp(w),show:w})));
 sec('E','5. Первая буква дана ✍️','Вспомни английское слово по переводу и первой букве.',sh(FIRST).map(w=>{const x=W.find(y=>y[0]==w);return{w,q:`${x[1]} — <b>${w.replace(/\S+/g,t=>t[0]+'_'.repeat(t.length-1))}</b>`,chk:v=>cmp(v)==cmp(w),show:w}}));
 sec('F','6. Translate into English ✍️','Переведи предложение. Проверка идёт по ключевым словам темы.',sh(TR).map(t=>({w:t[1][0][0],q:t[0],chk:v=>{const s=n(v);return t[1].every(g=>g.some(a=>s.includes(a)))},show:t[2]})));
 sec('G','7. Write your own sentence ✍️','Напиши своё предложение (минимум 4 слова) с данным словом.',sh(OWN).map(o=>({w:o[0],q:`Use <b>${o[0]}</b>. <span class="mu">${o[1]}</span>`,ta:1,chk:v=>n(v).split(' ').length>=4&&n(v).includes(o[0].replace(/^the /,'')),show:o[2]})));
}
build();
$('#re').onclick=()=>{build();scrollTo(0,0)};
$('#copy').onclick=async()=>{
 let out='Transport B1 — мои ответы\n';
 for(const k in L){out+=`\n${T[k]} (${S[k].size}/${Object.keys(L[k]).length||0} верно с первой попытки)\n`+Object.keys(L[k]).sort((a,b)=>a-b).map(i=>L[k][i]).join('\n')+'\n'}
 const p=Object.entries(P);if(p.length)out+='\nПроблемные слова: '+p.map(x=>x[0]+' ×'+x[1]).join(', ');
 let ok=false;try{await navigator.clipboard.writeText(out);ok=true}catch(e){const t=document.createElement('textarea');t.value=out;document.body.appendChild(t);t.select();try{ok=document.execCommand('copy')}catch(_){}t.remove()}
 $('#cs').textContent=ok?'Скопировано ✓':'Не удалось скопировать'};
setInterval(()=>{const t=Object.values(S).reduce((a,s)=>a+s.size,0);$('#sum').textContent=`Верно с первой попытки: ${t} из 70.`},500);
</script></body></html>
