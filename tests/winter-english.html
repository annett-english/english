<style>

<header><h1>❄️ Cosy <span>Winter</span> English</h1><p>7 expressions · 8 steps · type, listen, play</p><div class="stat">⭐ <span id="pc">0/0</span></div></header>
<nav id="nav"></nav>
<div class="wrap"><main id="main"></main><aside><h3>🚩 Problem words</h3><div id="pw"></div><button class="bt sh" id="clr">Clear</button><hr><div class="vt" id="vt"></div><button class="bt" id="vtest">🔊 Test audio</button></aside></div>
<script>
const $=(s,e=document)=>e.querySelector(s),K=["turn","hunker","blues","gather","excuse","slow","beats"];
const W={turn:["turn sth into sth","/tɜːrn ˈsʌmθɪŋ ˈɪntuː ˈsʌmθɪŋ/","превращать что-то во что-то","turn something into something","She turned her garage into a studio."],hunker:["hunker down","/ˈhʌŋkər daʊn/","засесть дома, переждать","hunker down","We hunkered down until the storm passed."],blues:["beat the winter blues","/biːt ðə ˈwɪntər bluːz/","прогнать зимнюю хандру","beat the winter blues","Dancing helps me beat the winter blues."],gather:["gather around","/ˈɡæðər əˈraʊnd/","собираться вокруг","gather around","The kids gathered around the fire."],excuse:["an excuse to + verb","/ən ɪkˈskjuːs tuː/","повод (сделать что-то)","an excuse to do something","Snow is an excuse to stay in."],slow:["slow down","/sloʊ daʊn/","замедлиться, сбавить темп","slow down","Winter makes us slow down."],beats:["nothing beats…","/ˈnʌθɪŋ biːts/","ничто не сравнится с…","nothing beats","Nothing beats hot chocolate."]};
const S={log:{},ok:{},prob:{},n:0};let U=0,V=null;
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const norm=s=>s.toLowerCase().replace(/[’‘]/g,"'").replace(/[.,!?;:"“”]/g,"").replace(/\s+/g," ").trim();
const plain=s=>s.replace(/<br>/g,"\n").replace(/<[^>]+>/g,"");
/* ---------- audio ---------- */
function pickVoice(){const vs=speechSynthesis.getVoices();V=vs.find(v=>/google us english/i.test(v.name))||vs.find(v=>/samantha/i.test(v.name))||vs.find(v=>v.lang==="en-US")||vs.find(v=>/^en/i.test(v.lang))||null;$("#vt").textContent=V?"Voice: "+V.name:"No English voice found — try Chrome or Safari."}
function say(t,end){if(!("speechSynthesis" in window)){$("#vt").textContent="Audio is not supported in this browser.";return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.9;if(V)u.voice=V;if(end)u.onend=end;speechSynthesis.speak(u)}
if("speechSynthesis" in window){speechSynthesis.onvoiceschanged=pickVoice;pickVoice()}else $("#vt").textContent="Audio is not supported in this browser.";
/* ---------- state ---------- */
function ui(){const c=Object.values(S.ok).filter(x=>x===true).length;$("#pc").textContent=c+"/"+S.n;const e=Object.entries(S.prob).sort((a,b)=>b[1]-a[1]);$("#pw").innerHTML=e.length?e.map(([k,n])=>`<div class="pr"><span>${W[k][0]}</span><b>${n}</b></div>`).join(""):'<div class="vt">No mistakes yet 🎉</div>'}
function log(id,it,ans,ok){S.log[id]={sec:it.sec,q:plain(it.q),ans,ok};S.ok[id]=ok}
const bad=k=>{if(k)S.prob[k]=(S.prob[k]||0)+1};
/* ---------- exercise engine ---------- */
const T=(w,q,a,x={})=>({t:"t",w,q,a:[].concat(a),...x}),C=(w,q,a,o,x={})=>({t:"c",w,q,a:[a],o:[a,...o],...x}),O=(w,q,x={})=>({t:"o",w,q,a:[],...x}),P=(w,q,o)=>({t:"p",w,q,o}),L=(w,s,a)=>T(w,"Listen and write what you hear.",a||s,{say:s});
function mk(sec,items,box){items.forEach(it=>{const id="i"+ ++U;it.sec=sec;S.n++;const d=document.createElement("div");d.className="it";
let h=`<div class="q">${it.say?`<button class="sp" data-s="${it.say}">🔊 Play</button> `:""}${it.q}</div>`;
if(it.t=="t")h+=`<input class="in" placeholder="${it.ph||"type here…"}" autocomplete="off" autocapitalize="off" spellcheck="false">`;
if(it.t=="o")h+=`<textarea class="in" rows="2" placeholder="write here…"></textarea>`;
if(it.o)h+=`<div>${shuffle(it.o).map(o=>`<button class="op">${o}</button>`).join("")}</div>`;
if(it.t!="p")h+=`<div>${it.t!="c"?'<button class="bt ck">Check</button>':""}<button class="bt sh">Show answer</button></div>`;
d.innerHTML=h+'<div class="fb"></div>';box.appendChild(d);
const fb=$(".fb",d),inp=$(".in",d);
const chk=(v,b)=>{if(!v.trim())return;let ok;if(it.t=="c")ok=v===it.a[0];else{const n=norm(v);ok=it.re?it.re.test(n):it.a.some(a=>norm(a)==n);if(it.t=="o"&&!it.re)ok=v.trim().length>8}
if(b)b.classList.add(ok?"good":"bad");if(inp){inp.classList.toggle("good",ok);inp.classList.toggle("bad",!ok)}
fb.className="fb "+(ok?"good":"bad");fb.textContent=ok?"✓ Correct!":it.t=="o"?"Use the target phrase ✍️":"✗ Not yet — try again or peek.";if(!ok)bad(it.w);log(id,it,v,ok);ui()};
d.addEventListener("click",e=>{const b=e.target.closest("button");if(!b||b.classList.contains("sp"))return;
if(b.classList.contains("op")){if(it.t=="p"){d.querySelectorAll(".op").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");log(id,it,b.textContent,null);fb.textContent="Saved ✓";return}chk(b.textContent,b)}
if(b.classList.contains("ck"))chk(inp.value);
if(b.classList.contains("sh")){const a=it.show||it.a[0];fb.className="fb";fb.innerHTML="👀 Answer: <b>"+a+"</b>";d.querySelectorAll(".op").forEach(o=>{if(o.textContent===a)o.classList.add("good")});if(S.ok[id]!==true){bad(it.w);log(id,it,(inp?inp.value:"")+" [peeked]",false)}ui()}});
if(inp&&it.t=="t")inp.addEventListener("keydown",e=>{if(e.key=="Enter")chk(inp.value)})})}
/* ---------- layout helpers ---------- */
const main=$("#main"),panes=[],NT=["Warm-up","Wild & Guess","Listen & Match","Forms & Context","Situations","Grammar lab","Fun time","My 3 + Results"];
function pane(i,t,s){const p=document.createElement("section");p.className="pn";p.innerHTML=`<h2>${i+1}. ${t}</h2><p class="in2">${s}</p>`;main.appendChild(p);panes[i]=p;return p}
function blk(p,h,sub){const c=document.createElement("div");c.className="cd";c.innerHTML=`<h3>${h}</h3>${sub?`<p class="sb">${sub}</p>`:""}`;const x=document.createElement("div");c.appendChild(x);p.appendChild(c);return x}
function go(i){panes.forEach((p,j)=>p.classList.toggle("on",i==j));[...$("#nav").children].forEach((b,j)=>b.classList.toggle("on",i==j));scrollTo(0,0);if(i==7)resBuild()}
NT.forEach((t,i)=>{const b=document.createElement("button");b.innerHTML=`<b>${i+1}</b>${t}`;b.onclick=()=>go(i);$("#nav").appendChild(b)});
/* 1 Warm-up */
let p=pane(0,"Warm-up: meet the words","🎧 Listen to each expression (voice: Google US English or Samantha) and repeat it out loud.");
let x=blk(p,"Your 7 expressions");x.innerHTML=`<div class="wg">${K.map(k=>{const w=W[k];return `<div class="wc"><button class="sp big" data-s="${w[3]}">🔊</button><div><b>${w[0]}</b><div class="ip">${w[1]}</div><div class="ru">${w[2]}</div><div class="ex">${w[4]}</div></div></div>`}).join("")}</div><button class="bt main" id="pa">▶ Play all</button>`;
$("#pa").onclick=()=>{const q=K.map(k=>W[k][3]);const n=()=>{if(q.length)say(q.shift(),()=>setTimeout(n,400))};n()};
/* 2 Wild / Guess / Speed */
p=pane(1,"Find, guess, match","Spot the expressions in a text, guess them from definitions, then race the clock.");
x=blk(p,"🔎 Find them in the wild","Click whole phrases that contain our expressions. 7 are hidden — some clicks are traps!");S.n++;
x.innerHTML=`<p class="txt">When the first snow falls, my family <i class="p">likes to</i> <i class="p" data-k="hunker">hunker down</i> at home. We <i class="p" data-k="turn">turn the living room into a cosy cinema</i>, and everyone <i class="p" data-k="gather">gathers around</i> the fireplace. <i class="p">Dark mornings feel heavy</i>, so we <i class="p" data-k="slow">slow down</i> and <i class="p">plan little things</i> to <i class="p" data-k="blues">beat the winter blues</i>. Cold weather is also <i class="p" data-k="excuse">an excuse to bake cookies</i>. Honestly, <i class="p" data-k="beats">nothing beats hot chocolate</i> <i class="p">on a snowy evening</i>!</p><div class="bar"><b id="wc">0/7</b><button class="bt sh" id="ws">Show answers</button></div>`;
let f=0;const wl=()=>{$("#wc").textContent=f+"/7";log("wild",{sec:"2 Wild",q:"Find them in the wild"},f+"/7 found",f==7);ui()};
x.onclick=e=>{const i=e.target.closest(".p");if(!i||i.classList.contains("good"))return;if(i.dataset.k){i.classList.add("good");f++}else{i.classList.add("bad");setTimeout(()=>i.classList.remove("bad"),600)}wl()};
$("#ws").onclick=()=>{x.querySelectorAll("[data-k]:not(.good)").forEach(i=>{i.classList.add("good");bad(i.dataset.k)});f=7;wl();S.ok.wild=false};
x=blk(p,"💡 Guess the word","Type the expression that matches the definition.");
mk("2 Guess",[T("blues","“to fight the sad, low mood of dark, cold months”","beat the winter blues"),T("slow","“to go or work less fast”","slow down"),T("turn","“to change one thing so that it becomes another”",["turn into","turn something into something","turn sth into sth"]),T("beats","“used to say something is the very best”","nothing beats"),T("hunker","“to stay in a safe, cosy place until bad weather passes”","hunker down"),T("excuse","“a reason (not always serious) to do what you want”",["an excuse to","excuse to","an excuse to + verb"]),T("gather","“to come together in a group close to something”","gather around")],x);
x=blk(p,"⚡ Speed match","Pick an English phrase on the left, then its meaning on the right. 45 seconds!");S.n++;
x.innerHTML=`<div class="bar"><button class="bt main" id="go">▶ Start</button><b id="tm">45</b><span id="sm"></span></div><div class="sm" id="sg"></div>`;
let tmr,m=0,sel=null;const fin=()=>{clearInterval(tmr);$("#sm").textContent=`Matched ${m}/7`;log("speed",{sec:"2 Speed",q:"Speed match"},m+"/7",m==7);ui()};
$("#go").onclick=()=>{clearInterval(tmr);m=0;sel=null;let t=45;$("#tm").textContent=t;$("#sm").textContent="";const L=shuffle(K),R=shuffle(K);$("#sg").innerHTML=L.map((k,i)=>`<button class="bt l" data-k="${k}">${W[k][0]}</button><button class="bt r" data-k="${R[i]}">${W[R[i]][2]}</button>`).join("");
tmr=setInterval(()=>{$("#tm").textContent=--t;if(t<=0){fin();$("#sg").querySelectorAll("button").forEach(b=>b.disabled=true)}},1e3)};
$("#sg").onclick=e=>{const b=e.target.closest("button");if(!b||b.disabled)return;if(b.classList.contains("l")){$("#sg").querySelectorAll(".l").forEach(y=>y.style.outline="");sel=b;b.style.outline="3px solid var(--ac)";return}
if(!sel)return;if(sel.dataset.k==b.dataset.k){sel.classList.add("good");b.classList.add("good");sel.disabled=b.disabled=true;sel.style.outline="";sel=null;if(++m==7)fin()}else{b.classList.add("bad");setTimeout(()=>b.classList.remove("bad"),500);bad(sel.dataset.k);ui()}};
/* 3 Listen & Match */
p=pane(2,"Listen & match","Write what you hear, then pick the right partner word.");
mk("3 Listen",[L("gather","gather around"),L("excuse","Snow is an excuse to stay in.",["snow is an excuse to stay in"]),L("beats","Nothing beats a hot bath.","nothing beats a hot bath"),L("turn","turn something into something",["turn something into something","turn sth into sth"]),L("blues","beat the winter blues")],blk(p,"🎧 Write the expression by ear","Press Play (you can replay it)."));
mk("3 Collocations",[C("slow","slow ___ before the corner","down",["off","away"]),C("turn","turn the garage ___ a studio","into",["to","onto","in"]),C("excuse","an excuse ___ see friends","to",["of","at","about"]),C("blues","beat the winter ___","blues",["cold","rain","blue"]),C("beats","nothing ___ a long walk","beats",["beat","wins","passes"]),C("hunker","hunker ___ for the storm","down",["up","off","in"])],blk(p,"🧩 Which word fits?","Choose the correct partner."));
/* 4 Forms & Context */
p=pane(3,"Forms & context","Change the verb, guess meaning from the sentence, then rephrase.");
mk("4 Forms",[T("gather","By 7 p.m. all the kids ____ the TV. <small>(gather around, past perfect)</small>",["had gathered around"]),T("hunker","Yesterday, because of the storm, we ____ in the cabin. <small>(hunker down, past simple)</small>","hunkered down"),T("turn","Right now, Mia ____ her old shed into a gym. <small>(turn, present continuous)</small>","is turning"),T("blues","Next weekend we ____ the winter blues with a trip. <small>(beat, future)</small>",["will beat","are going to beat"]),T("slow","Last winter I ____ and read more books. <small>(slow down, past simple)</small>","slowed down")],blk(p,"⏳ Change the verb"));
mk("4 Context",[C("beats","“Nothing beats grandma’s soup when you’re ill.” → the soup is…","the very best thing",["too hot","not tasty"]),C("hunker","“The roads were closed, so we hunkered down until Monday.” → hunkered down =","stayed somewhere safe and waited",["drove very fast","went shopping"]),C("excuse","“I need an excuse to leave this party.” → an excuse =","a reason for doing something",["a gift","a ticket"]),C("turn","“Dave turned his old van into a tiny home.” → he…","changed it so it became a tiny home",["sold it","painted it blue"])],blk(p,"🕵️ Guess the meaning from context"));
mk("4 Rephrase",[T("slow","Use <b>slow down</b>: “Please go less fast.”",["please slow down","slow down please"]),T("beats","Use <b>nothing beats</b>: “A long walk is the best thing in winter.”",[],{re:/^nothing beats .*walk.*winter/,show:"Nothing beats a long walk in winter."}),T("gather","Use <b>gather around</b>: “The kids came together close to the fire.”",[],{re:/^the kids gathered around the fire/,show:"The kids gathered around the fire."})],blk(p,"🔁 Rephrase"));
/* 5 Situations */
p=pane(4,"Mini-situations & dialogue","Complete real-life moments.");
mk("5 Situations",[T("excuse","🎬 It’s snowing. “It’s the perfect ____ have a movie night.”",["excuse to","an excuse to"]),T("hunker","❄️ A snowstorm is coming. “Let’s ____ and watch films all weekend.”","hunker down"),T("beats","☕ After skiing: “____ ____ a hot chocolate right now!”","nothing beats"),T("slow","🏃 Your boss walks too fast. “Could you ____ a bit?”","slow down"),T("blues","😔 Your friend is sad in dark mornings. “Try yoga to ____.”","beat the winter blues"),T("gather","🔥 Everyone is cold. “Let’s ____ the fireplace.”","gather around")],blk(p,"🎭 Complete the mini-situations"));
x=blk(p,"💬 Finish the dialogue","Fill each gap, then copy the finished dialogue.");
mk("5 Dialogue",[T("hunker","<b>A:</b> The forecast is awful this weekend.<br><b>B:</b> Then let’s ______ at my place.","hunker down"),T("turn","<b>A:</b> But my living room is so boring.<br><b>B:</b> No problem — we can ______ a cinema!",["turn it into","turn the living room into","turn your living room into"],{ph:"turn … into"}),T("gather","<b>A:</b> Will everyone fit?<br><b>B:</b> Sure! We’ll ______ the big screen.","gather around"),T("beats","<b>A:</b> And snacks?<br><b>B:</b> Hot chocolate, of course. ______ hot chocolate on a snowy night!","nothing beats")],x);
x.insertAdjacentHTML("beforeend",'<button class="bt main cpy" data-sec="5 Dialogue" data-l="📋 Copy my dialogue">📋 Copy my dialogue</button>');
/* 6 Grammar lab */
p=pane(5,"Grammar lab","Fix mistakes, rephrase, complete — <b>nothing beats</b> + noun/-ing, <b>turn A into B</b>, <b>an excuse to</b> + verb.");
mk("6 Grammar",[T("beats","✏️ Fix the mistake: <i>Nothing beats to walk in the snow.</i>","nothing beats walking in the snow"),T("turn","✏️ Fix the mistake: <i>She turned the old barn on a gallery.</i>","she turned the old barn into a gallery"),T("excuse","✍️ Complete: Cold weather gives me an excuse to ______.",[],{re:/^(?!to\b)(?![a-z]+ing\b)[a-z]+/,show:"…an excuse to stay in / bake / read"}),T("beats","🔁 Use <b>nothing beats</b>: “Hot soup is the best thing after skiing.”",[],{re:/^nothing beats (a )?hot soup after skiing/,show:"Nothing beats hot soup after skiing."}),T("turn","✍️ Complete: Let’s turn this boring room ______.",[],{re:/^into (an? |the )?\w+/,show:"…into a game room"}),T("excuse","✏️ Fix the mistake: <i>Rainy days are an excuse for stay home.</i>","rainy days are an excuse to stay home"),T("turn","🔁 Use <b>turn</b>: “He changed his tiny balcony into a garden.”","he turned his tiny balcony into a garden"),T("excuse","🔁 Use <b>an excuse to</b>: “Snow gives me a reason to stay home.”",[],{re:/excuse to stay (at )?home/,show:"Snow gives me an excuse to stay home."}),T("beats","✍️ Complete: Nothing beats ______ on a cold evening.",[],{re:/^(\w+ing|an? \w+|the \w+|\w+ \w+)/,show:"…a hot bath / reading by the fire"})],blk(p,"🧪 Mixed practice"));
/* 7 Fun */
p=pane(6,"Fun time","No wrong answers here — just use the language!");
x=blk(p,"🤔 Would you rather…");
mk("7 Would you rather",[P("hunker","…hunker down at home for a week or spend a week in a snowy cabin?",["hunker down at home","a snowy cabin"]),P("blues","…beat the winter blues with a trip to the sun or turn your home into a cosy cinema?",["trip to the sun","cosy cinema at home"]),O("excuse","Explain your choice in one sentence with <b>an excuse to</b> or <b>nothing beats</b>.",{re:/(excuse to|nothing beats)/,show:"Nothing beats a warm blanket and a good movie."})],x);
mk("7 Predict",[C("gather","📖 <i>It was the coldest night of the year. Anna wanted to hunker down with a book, but the lights went out. She slowed down, lit candles, and…</i>","the neighbours gathered around her fireplace — nothing beat that night",["went skiing at midnight","called an office meeting"]),O("slow","Write your own ending (one sentence).",{show:"Model: …and she turned the dark evening into a magical story night."})],blk(p,"🔮 Predict the ending"));
/* 8 My 3 + Results */
const M={turn:[T("turn","Let’s turn this boring room ___ a game room.","into"),C("turn","Choose the correct sentence:","She turned the box into a robot.",["She turned the box on a robot.","She turned into the box a robot."])],hunker:[T("hunker","Storm warning! Time to ___ ___ at home.","hunker down"),C("hunker","“Hunker down” means…","stay somewhere safe and wait",["run outside quickly","work faster"])],blues:[T("blues","Dancing helps me beat the winter ___.","blues"),C("blues","“Winter blues” are…","a sad, low mood in winter",["a blue jacket","a cold wind"])],gather:[T("gather","The kids ___ around the tree this morning. (gather)","gathered"),C("gather","Everyone gathered ___ the fire.","around",["into","down","away"])],excuse:[T("excuse","Rain is the perfect ___ to read all day.","excuse"),C("excuse","Which is correct?","It’s an excuse to relax.",["It’s an excuse relaxing.","It’s an excuse of relax."])],slow:[T("slow","Please ___ ___ — I can’t keep up!","slow down"),C("slow","“Slow down” means…","go or work less fast",["stop forever","speak louder"])],beats:[T("beats","___ ___ a warm blanket in winter!","nothing beats"),C("beats","Which is correct?","Nothing beats sleeping in.",["Nothing beats to sleep in.","Nothing beat sleeping in."])]};
p=pane(7,"My 3 words + results","Pick the 3 words you feel least sure about — we’ll build mini-tasks for them.");
x=blk(p,"🎯 Choose 3 words");x.innerHTML=`<div>${K.map(k=>`<button class="chip" data-k="${k}">${W[k][0]}</button>`).join("")}</div><button class="bt main" id="b3">Build my mini-tasks ✨</button><div id="m3"></div>`;
let ch=[],n3=0;x.onclick=e=>{const c=e.target.closest(".chip");if(!c)return;const k=c.dataset.k;ch=ch.includes(k)?ch.filter(y=>y!=k):[...ch,k].slice(-3);x.querySelectorAll(".chip").forEach(y=>y.classList.toggle("sel",ch.includes(y.dataset.k)))};
$("#b3").onclick=()=>{const b=$("#m3");if(ch.length!=3){b.innerHTML='<p class="fb bad">Please choose exactly 3 words.</p>';return}Object.keys(S.log).forEach(i=>{if(S.log[i].sec=="8 My 3"){delete S.log[i];delete S.ok[i]}});S.n-=n3;b.innerHTML="";const s=S.n;mk("8 My 3",shuffle(ch.flatMap(k=>M[k])),b);n3=S.n-s;ui()};
x=blk(p,"📊 My results & copy");x.innerHTML=`<input class="in" id="nm" placeholder="Your name"><p id="sc"></p><textarea class="out" id="ot" readonly></textarea><button class="bt main cpy" data-l="📋 Copy all my answers">📋 Copy all my answers</button> <button class="bt" id="t2">🔊 Test audio</button>`;
$("#t2").onclick=$("#vtest").onclick=()=>say("Nothing beats a hot chocolate on a snowy evening.");
$("#clr").onclick=()=>{S.prob={};ui()};
function dump(sec){const e=Object.values(S.log).filter(y=>!sec||y.sec==sec);if(sec=="5 Dialogue")return e.map(y=>y.q.replace(/_{3,}/,"["+y.ans.replace(" [peeked]","")+"]")).join("\n\n");return e.map(y=>`[${y.sec}] ${y.q}\n   → ${y.ans} ${y.ok===true?"✅":y.ok===false?"❌":"•"}`).join("\n")}
function full(){const c=Object.values(S.ok).filter(y=>y===true).length,pr=Object.entries(S.prob).map(([k,n])=>W[k][0]+" ×"+n).join(", ")||"none";return `Student: ${$("#nm").value||"—"}\nScore: ${c}/${S.n}\nProblem words: ${pr}\n\n${dump()}`}
function resBuild(){const c=Object.values(S.ok).filter(y=>y===true).length;$("#sc").innerHTML=`Score: <b>${c}/${S.n}</b>`;$("#ot").value=full()}
function cp(t,b){const d=()=>{b.textContent="Copied ✓";setTimeout(()=>b.textContent=b.dataset.l,1500)},fb=()=>{const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(e){}a.remove();d()};navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(t).then(d,fb):fb()}
document.addEventListener("click",e=>{const s=e.target.closest(".sp");if(s)say(s.dataset.s);const c=e.target.closest(".cpy");if(c)cp(c.dataset.sec?dump(c.dataset.sec):full(),c)});
panes.slice(0,7).forEach((q,i)=>{const b=document.createElement("button");b.className="bt main";b.textContent="Next step →";b.onclick=()=>go(i+1);q.appendChild(b)});
ui();go(0);
</script></body></html>
