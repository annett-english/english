<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>At, in, on: повторение (A2)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f5f8;--card:#fff;--ink:#1b2733;--mut:#566676;--line:#d8e0e7;--at:#b36a00;--atb:#fff0d2;--in:#0b7a75;--inb:#d7f1ee;--on:#6a3fc4;--onb:#ebe3fb;--ok:#177a3c;--okb:#dcf3e3;--bad:#b3261e;--badb:#fbe3e1;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12181f;--card:#1a222b;--ink:#e8edf2;--mut:#9aa9b8;--line:#2b3744;--at:#f0a63a;--atb:#3a2d12;--in:#4cc9c0;--inb:#11302e;--on:#b79af0;--onb:#2a2145;--ok:#62d38a;--okb:#14301e;--bad:#ff8a80;--badb:#3b1a18;color-scheme:dark}}
:root[data-theme=dark]{--bg:#12181f;--card:#1a222b;--ink:#e8edf2;--mut:#9aa9b8;--line:#2b3744;--at:#f0a63a;--atb:#3a2d12;--in:#4cc9c0;--inb:#11302e;--on:#b79af0;--onb:#2a2145;--ok:#62d38a;--okb:#14301e;--bad:#ff8a80;--badb:#3b1a18;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Onest,system-ui,-apple-system,"Segoe UI",sans-serif}
header,main{max-width:860px;margin:0 auto;padding:0 16px}header{padding-top:26px}
h1{font-size:clamp(26px,5vw,38px);line-height:1.1;margin:0 0 6px;letter-spacing:-.02em;font-weight:800}
h1 span{padding:0 .12em;border-radius:6px}.a{background:var(--atb);color:var(--at)}.i{background:var(--inb);color:var(--in)}.o{background:var(--onb);color:var(--on)}
header p{margin:0 0 4px;color:var(--mut)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:14px 16px;max-width:860px;margin:0 auto}
.tab{flex:none;font:inherit;font-size:14px;padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);cursor:pointer}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:24px;counter-reset:q}
h2{margin:0 0 4px;font-size:21px}.ins{margin:0 0 12px;color:var(--mut)}
.q{padding:10px;border-top:1px solid var(--line);border-left:4px solid transparent;counter-increment:q}
.q.ok{border-left-color:var(--ok);background:var(--okb)}.q.bad{border-left-color:var(--bad);background:var(--badb)}.q.shown{border-left-color:var(--in);background:var(--inb)}
.s{margin:0 0 6px;font-weight:500}.q .s::before{content:counter(q) ". ";color:var(--mut);font-weight:700}
.gap{display:inline-block;min-width:2.5em;border-bottom:2px solid var(--ink)}
.exp{font-size:14px;margin:6px 0 0;opacity:.85}
.row{display:flex;gap:8px;flex-wrap:wrap}
.opt{flex:1;min-width:70px;font:inherit;font-weight:700;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);cursor:pointer}
.opt.on{border:2px solid var(--ink);padding:7px 9px}
select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:3px 6px;margin:0 2px}
select.ok{background:var(--okb);border-color:var(--ok)}select.bad{background:var(--badb);border-color:var(--bad)}select.shown{background:var(--inb);border-color:var(--in)}
.txt{line-height:2.2;font-size:17px;margin:0 0 8px}
.ex{border-left:3px solid var(--line);padding-left:10px}
.pool,.ans{display:flex;flex-wrap:wrap;gap:6px;min-height:42px;padding:6px;border-radius:8px}
.pool{background:var(--bg)}.ans{border:2px dashed var(--line);margin-bottom:6px}
.chip{padding:4px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);cursor:pointer;font-size:15px;user-select:none}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
.btn{font:inherit;font-weight:700;padding:9px 16px;border-radius:9px;border:0;background:var(--ink);color:var(--bg);cursor:pointer}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line);font-weight:500}.res{font-weight:700}
.hint{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 0;font-size:14px}.hint b{padding:2px 8px;border-radius:6px;font-weight:500}
</style></head><body>
<header><h1>Повторение: <span class="a">at</span> <span class="i">in</span> <span class="o">on</span></h1><p>Уровень A2 · 3 упражнения на закрепление</p>
<div class="hint"><b class="a">at — точное время, night, Christmas</b><b class="i">in — части дня, сезоны, годы, века</b><b class="o">on — дни недели и даты</b></div></header>
<nav class="tabs" id="tabs"></nav><main id="main"></main>
<script>
const $=(s,r=document)=>r.querySelector(s);
const h=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.innerHTML=x;return e};
const shuf=a=>[...a].sort(()=>Math.random()-.5);
const mark=(i,c)=>{i.box.classList.remove('ok','bad','shown');i.box.classList.add(c);i.exp.hidden=false};
function ex(title,ins,build){
 const sec=h('section','card');sec.append(h('h2',0,title),h('p','ins',ins));
 const body=h('div'),bar=h('div','bar'),res=h('span','res');let items=[];
 const run=()=>{body.innerHTML='';items=build(body);res.textContent=''};
 const b=(t,f,c)=>{const x=h('button','btn '+(c||''),t);x.onclick=f;return x};
 bar.append(b('Проверить',()=>{let n=0;items.forEach(i=>{const k=i.ok();n+=k;mark(i,k?'ok':'bad')});res.textContent='Результат: '+n+' из '+items.length}),
  b('Показать ответы',()=>{items.forEach(i=>{i.ans();mark(i,'shown')});res.textContent=''},'ghost'),b('Заново',run,'ghost'),res);
 sec.append(body,bar);run();return sec}

/* 1 */
const A=[['The concert is ___ Saturday.','on','День недели → on Saturday.'],['I have breakfast ___ 8 o’clock.','at','Точное время → at 8 o’clock.'],['My sister was born ___ April.','in','Месяц → in April.'],['We play football ___ the afternoon.','in','Часть дня → in the afternoon.'],['Kids get presents ___ Christmas Day.','on','Конкретный день (есть слово Day) → on Christmas Day. Просто «период Рождества» — at Christmas.'],['It is very cold ___ winter.','in','Сезон → in winter.'],['My brother works ___ night.','at','Исключение: at night.'],['She finished school ___ 2019.','in','Год → in 2019.'],['We stay at home ___ New Year’s Eve.','on','Конкретный праздничный вечер → on New Year’s Eve.'],['I call my friend ___ the weekend.','at','В британском английском at the weekend (в США — on the weekend).']];
const e1=ex('1. Выбери at, in или on','Нажми на нужный предлог.',b=>A.map(([s,c,e])=>{
 let sel='';const box=h('div','q'),row=h('div','row');box.append(h('p','s',s.replace('___','<b class="gap">&nbsp;&nbsp;&nbsp;&nbsp;</b>')));
 const bs=['at','in','on'].map(p=>{const x=h('button','opt',p);x.onclick=()=>{sel=p;bs.forEach(y=>y.classList.toggle('on',y==x))};return x});
 const exp=h('p','exp','<b>'+c+'.</b> '+e);exp.hidden=true;row.append(...bs);box.append(row,exp);b.append(box);
 return{box,exp,ok:()=>sel==c,ans:()=>{sel=c;bs.forEach(y=>y.classList.toggle('on',y.textContent==c))}}}));

/* 2 */
const X=[['at','at 7 o’clock — точное время.'],['in','in the morning — часть дня.'],['On','on Monday — день недели.'],['on','on Friday evening — день + часть дня.'],['At','at the weekend — выходные (брит.).'],['in','in 2011 — год.'],['on','on 3rd June — дата.'],['In','in summer — сезон.'],['At','at night — исключение.'],['At','at Christmas — праздничный период.']];
const tx='My name is Kate. I get up {0} 7 o’clock {1} the morning. {2} Monday I have English, and {3} Friday evening I meet my friends. {4} the weekend I sleep late. I was born {5} 2011, {6} 3rd June. {7} summer we go to the sea. {8} night I read a book. {9} Christmas we visit my grandparents.';
const e2=ex('2. Текст с пропусками','Выбери предлог в каждом пропуске.',b=>{
 const p=h('p','txt'),list=h('div','ex'),out=[];const parts=tx.split(/\{(\d)\}/);
 parts.forEach((t,i)=>{if(i%2==0)p.append(document.createTextNode(t));else{
  const k=+t,sel=h('select',0,'<option value="">…</option><option>at</option><option>in</option><option>on</option>');p.append(sel);
  const exp=h('p','exp','('+(k+1)+') '+X[k][1]);exp.hidden=true;list.append(exp);
  out.push({box:sel,exp,ok:()=>sel.value==X[k][0].toLowerCase(),ans:()=>sel.value=X[k][0].toLowerCase()})}});
 b.append(p,list);return out});

/* 3 */
const W=[['The lesson starts at 9 o’clock.','At + точное время.'],['We go skiing in winter.','In + сезон.'],['My birthday is on 14th July.','On + дата.'],['She was born in 2008.','In + год.'],['He doesn’t work on Sunday.','On + день недели; he → doesn’t work.'],['They have lunch at one o’clock.','At + точное время.'],['We visit Grandma at Christmas.','At + праздничный период.'],['I do my homework in the evening.','In + часть дня.'],['The party is on Friday evening.','День + часть дня → on.'],['Phones were not popular in the 1990s.','In + десятилетие.']];
const e3=ex('3. Составь предложение','Нажимай на слова по порядку. Нажми на слово в ответе, чтобы убрать его.',b=>W.map(([s,e])=>{
 const box=h('div','q'),pool=h('div','pool'),ans=h('div','ans'),ws=s.split(' ');
 const cs=ws.map(w=>{const c=h('span','chip',w);c.dataset.w=w;c.onclick=()=>(c.parentElement==pool?ans:pool).append(c);return c});
 shuf(cs).forEach(c=>pool.append(c));
 const exp=h('p','exp','<b>'+s+'</b><br>'+e);exp.hidden=true;box.append(h('p','s','Составь предложение:'),ans,pool,exp);b.append(box);
 return{box,exp,ok:()=>[...ans.children].map(c=>c.dataset.w).join(' ')==s,ans:()=>cs.forEach(c=>ans.append(c))}}));

const S=[['1 Выбери предлог',e1],['2 Текст',e2],['3 Предложения',e3]],tb=$('#tabs'),mn=$('#main');
const show=i=>{[...tb.children].forEach((b,j)=>b.classList.toggle('on',i==j));mn.innerHTML='';mn.append(S[i][1])};
S.forEach(([n],i)=>{const b=h('button','tab',n);b.onclick=()=>show(i);tb.append(b)});show(0);
</script></body></html>
