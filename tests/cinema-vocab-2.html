<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cinema Vocab 2: повторение и продакшн</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&family=Bungee&display=swap">
<style>
:root{--bg:#f6efe0;--card:#fffaf0;--ink:#1d1a2b;--mut:#6b6580;--acc:#d62839;--gold:#f2a900;--ok:#1f9d55;--no:#d62839;--line:#e3d6b8;--okbg:#d9f3e3;--nobg:#fbdadd;--shbg:#fff0c2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14122a;--card:#1f1c3d;--ink:#f4eee0;--mut:#a9a3c7;--acc:#ff4d5e;--gold:#ffc83d;--ok:#4ade80;--no:#ff6b78;--line:#38336a;--okbg:#17402b;--nobg:#4a1d2a;--shbg:#4a3d10}}
:root[data-theme="dark"]{--bg:#14122a;--card:#1f1c3d;--ink:#f4eee0;--mut:#a9a3c7;--acc:#ff4d5e;--gold:#ffc83d;--ok:#4ade80;--no:#ff6b78;--line:#38336a;--okbg:#17402b;--nobg:#4a1d2a;--shbg:#4a3d10}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Rubik,system-ui,sans-serif}
header{background:#14122a;color:#fff;text-align:center;padding:28px 16px 34px;border-bottom:14px solid transparent;border-image:repeating-linear-gradient(90deg,#14122a 0 14px,#f2a900 14px 26px) 14}
h1{font:2rem/1.1 Bungee,Rubik,sans-serif;margin:0;color:#f2a900}
header p{margin:8px 0 0;color:#cfc9ee}
.wrap{max-width:1040px;margin:0 auto;padding:18px 14px 60px;display:grid;grid-template-columns:1fr 210px;gap:18px;align-items:start}
@media(max-width:800px){.wrap{grid-template-columns:1fr}aside{order:-1;position:static!important}}
aside{position:sticky;top:12px;background:var(--card);border:2px dashed var(--acc);border-radius:14px;padding:12px}
aside h3{margin:0 0 8px;font:1rem Bungee,sans-serif;color:var(--acc)}
.chip{display:inline-block;margin:2px;padding:2px 9px;border-radius:99px;background:var(--nobg);color:var(--no);font-weight:500;font-size:.88rem}
.chip.g{background:var(--okbg);color:var(--ok)}
.card{background:var(--card);border:1px solid var(--line);border-left:8px solid var(--gold);border-radius:6px 18px 18px 6px;padding:16px 18px;margin-bottom:20px}
.card h2{margin:0 0 2px;font:1.2rem Bungee,sans-serif}
.hint{color:var(--mut);margin:0 0 12px;font-size:.93rem}
button{font:inherit;cursor:pointer;border:2px solid var(--ink);background:var(--gold);color:#1d1a2b;border-radius:10px;padding:6px 13px;font-weight:700}
button.sec{background:transparent;color:var(--ink)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.score{font-weight:700;color:var(--mut)}
.row{padding:8px 0;border-bottom:1px dashed var(--line)}
.row input{font:inherit;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:3px 8px;width:170px;max-width:100%}
.row textarea{display:block;width:100%;font:inherit;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:8px;margin-top:6px;min-height:70px}
.row.ok input{border-color:var(--ok);background:var(--okbg)}.row.no input{border-color:var(--no);background:var(--nobg)}.row.sh input{border-color:var(--gold);background:var(--shbg)}
.m{margin-left:8px;font-weight:700}
.def{font-style:italic}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;opacity:0;transition:opacity .2s;pointer-events:none}.toast.on{opacity:1}
</style>
</head>
<body>
<header><h1>🎞 Cinema Vocab 2</h1><p>Повторение и продакшн: вспомни, расскажи, напиши</p></header>
<div class="wrap"><main id="main"></main>
<aside><h3>Проблемные слова</h3><div id="prob"><span class="hint">Пока пусто. Ошибки появятся здесь.</span></div></aside></div>
<div class="toast" id="toast"></div>
<script>
const D=[["subtitles","words at the bottom of the screen that show what people say"],["soundtrack","the music from a film"],["star","a famous actor in the main role"],["special effects","computer tricks that make impossible things look real"],["set","the place built for a film where the actors work"],["critic","a person who writes opinions about films"],["scene","a short part of a film in one place"],["audience","the people who watch a film"],["trailer","a short video that advertises a film"],["extra","an actor in the background with no lines"],["sequel","a film that continues the story of an earlier film"],["plot","the story of a film"],["review","a text with an opinion about a film"],["script","the written text of a film with all the dialogue"],["cast","all the actors in a film"]];
const WORDS=D.map(d=>d[0]);
const $=s=>document.querySelector(s);
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const norm=s=>s.toLowerCase().trim().replace(/\s+/g," ");
const prob=new Set();
function bad(w){prob.add(w);$("#prob").innerHTML=[...prob].map(x=>`<span class="chip">${x}</span>`).join("")}
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),1800)}
function copy(text){text=text.trim();const ok=()=>toast("Скопировано ✓");
if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(text).then(ok,fb);else fb();
function fb(){const t=document.createElement("textarea");t.value=text;document.body.appendChild(t);t.select();try{document.execCommand("copy");ok()}catch(e){toast("Выделите и скопируйте текст вручную")}t.remove()}}
const sec=(id,t,h,body,btns)=>`<section class="card" id="${id}"><h2>${t}</h2><p class="hint">${h}</p>${body}<div class="bar">${btns}<span class="score"></span></div></section>`;
const bCheck='<button data-a="check">Проверить</button><button class="sec" data-a="show">Показать ответы</button>';
const bCopy='<button data-a="copy">📋 Скопировать мои идеи</button>';
const defs=shuf(D).slice(0,10);
const qs=shuf(["Which trailer made you want to watch a film? (use: trailer)","Do you prefer subtitles or dubbing? Why? (use: subtitles)","Describe the plot of a film you saw recently. (use: plot)","Which film deserves a sequel? What should happen in it? (use: sequel)","What do critics and the audience think about your favourite film? (use: critic, audience)","Which scene do you remember best? Why? (use: scene)"]).slice(0,5);
$("#main").innerHTML=
sec("a1","1. Повторение: определение → слово","Прочитайте определение на английском и впишите слово.",defs.map(([w,d])=>`<div class="row" data-ans="${w}" data-w="${w}"><span class="def">${d}</span><br><input autocomplete="off" autocapitalize="off" spellcheck="false"><span class="m"></span></div>`).join(""),bCheck)+
sec("a2","2. Продакшн: ответьте на вопросы","Отвечайте полными предложениями (2-3 предложения) и используйте слово из скобок.",qs.map(q=>`<div class="row"><span class="q">${q}</span><textarea placeholder="Пишите здесь..."></textarea></div>`).join(""),bCopy)+
sec("a3","3. Продакшн: рецензия на фильм","Напишите рецензию (5-7 предложений): название фильма, сюжет, актёры, спецэффекты, музыка, ваше мнение. Использованные слова загорятся зелёным. Цель: 8 слов и больше.",`<div class="bar" id="chips">${WORDS.map(w=>`<span class="chip" data-f="${w}">${w}</span>`).join("")}<b id="fc">0/15</b></div><div class="row"><span class="q">My film review:</span><textarea id="rev" style="min-height:150px" placeholder="Last weekend I watched..."></textarea></div>`,bCopy+'<button class="sec" data-a="all">📋 Скопировать всё (2 и 3)</button>');
const own=s=>"== "+s.querySelector("h2").textContent+" ==\n"+[...s.querySelectorAll(".row")].map(r=>(r.querySelector(".q")?.textContent||"")+"\n→ "+r.querySelector("textarea").value).join("\n\n");
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b||!b.dataset.a)return;const s=b.closest("section"),a=b.dataset.a;
if(a==="copy")return copy(own(s));
if(a==="all")return copy(own($("#a2"))+"\n\n"+own($("#a3"))+"\n\nСлов использовано: "+$("#fc").textContent);
let ok=0;const rows=s.querySelectorAll("[data-ans]");
rows.forEach(r=>{const i=r.querySelector("input"),m=r.querySelector(".m");r.classList.remove("ok","no","sh");
if(a==="show"){i.value=r.dataset.ans;r.classList.add("sh");m.textContent="";return}
const g=norm(i.value)===r.dataset.ans;r.classList.add(g?"ok":"no");m.textContent=g?"✓":"✗";m.style.color=g?"var(--ok)":"var(--no)";if(g)ok++;else bad(r.dataset.w)});
if(a==="check")s.querySelector(".score").textContent=`Верно: ${ok} из ${rows.length}`});
$("#rev").addEventListener("input",e=>{const t=e.target.value.toLowerCase();let n=0;
document.querySelectorAll("[data-f]").forEach(c=>{const u=new RegExp("\\b"+c.dataset.f+"\\b").test(t);c.classList.toggle("g",u);if(u)n++});$("#fc").textContent=n+"/15"});
</script>
</body>
</html>
