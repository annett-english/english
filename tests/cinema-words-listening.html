<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cinema Words · Listening & Speaking</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4efe6;--card:#fffdf8;--ink:#1c1a17;--mut:#6b655c;--gold:#b8860b;--red:#b3261e;--grn:#1f7a45;--line:#d9d0bf;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0d0c;--card:#1a1816;--ink:#f3ecdd;--mut:#a39b8c;--gold:#f5c542;--red:#ff6b5e;--grn:#5fd18a;--line:#2e2a25;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e0d0c;--card:#1a1816;--ink:#f3ecdd;--mut:#a39b8c;--gold:#f5c542;--red:#ff6b5e;--grn:#5fd18a;--line:#2e2a25;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Manrope,system-ui,sans-serif}
.strip{height:18px;background:repeating-linear-gradient(90deg,var(--ink) 0 14px,transparent 14px 28px) center/100% 8px no-repeat,var(--gold)}
header{padding:18px 16px 8px;max-width:1100px;margin:auto}
h1{font:400 clamp(34px,8vw,58px)/1 'Bebas Neue',Impact,sans-serif;letter-spacing:2px;margin:0}
h1 span{color:var(--gold)}
.sub{color:var(--mut);font-size:14px}
#nav{display:flex;gap:8px;flex-wrap:wrap;max-width:1100px;margin:8px auto;padding:0 16px}
#nav button{height:36px;padding:0 16px;border-radius:18px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:800 14px Manrope,sans-serif;cursor:pointer}
#nav button.on{background:var(--gold);color:#111;border-color:var(--gold)}
.wrap{display:grid;grid-template-columns:1fr 240px;gap:16px;max-width:1100px;margin:auto;padding:8px 16px 40px}
@media(max-width:800px){.wrap{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
h2{font:400 32px/1.1 'Bebas Neue',Impact,sans-serif;letter-spacing:1px;margin:0 0 4px}
.ins{color:var(--mut);margin:0 0 14px}
.btn{background:var(--gold);color:#111;border:0;border-radius:10px;padding:9px 16px;font-weight:800;cursor:pointer;font-family:inherit;font-size:15px}
.btn.g{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.s{padding:3px 10px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px;align-items:center}
.q{border:2px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.q.ok{border-color:var(--grn)}.q.bad{border-color:var(--red)}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.opt{border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:8px 12px;font:inherit;cursor:pointer}
.opt:hover{border-color:var(--gold)}
.opt.sel{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 22%,transparent)}
.opt.right{border-color:var(--grn);background:color-mix(in srgb,var(--grn) 25%,transparent)}
input[type=text]{font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;margin-top:8px}
.spk{border:0;background:var(--gold);border-radius:20px;height:34px;padding:0 12px;cursor:pointer;font-size:15px}
.ans{display:none;color:var(--grn);font-weight:700;margin-top:6px}
.ans.v{display:block}
.fb{margin-top:6px;font-size:15px}
.fb u{color:var(--red);text-decoration-thickness:2px}
.fb s{color:var(--grn);text-decoration:none;font-weight:700}
.mut{color:var(--mut)}
.res{font-weight:800;color:var(--gold);margin-top:8px}
.txt{display:none;font-style:italic;margin-top:6px}
.txt.v{display:block}
aside h3{font:400 24px 'Bebas Neue',Impact,sans-serif;margin:0 0 8px;color:var(--red)}
aside .card{position:sticky;top:12px}
.p{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:14px}
.p i{font-style:normal;background:var(--red);color:#fff;border-radius:8px;padding:0 7px;font-size:12px}
</style></head><body>
<div class="strip"></div>
<header><h1>CINEMA <span>WORDS</span> · LISTENING</h1>
<div class="sub">Слушаем и говорим · <span id="vs"></span> <button class="btn g s" onclick="say('Lights, camera, action!')">🔊 тест звука</button></div></header>
<div id="nav"></div>
<div class="wrap"><main class="card"><h2 id="ti"></h2><p class="ins" id="in"></p><div id="box"></div>
<div class="row"><button class="btn g" id="rp">📋 Скопировать весь отчёт</button></div></main>
<aside><div class="card"><h3>Проблемные слова</h3><div id="pw"></div></div></aside></div>
<script>
const $=s=>document.querySelector(s);
const sh=a=>{a=[...a];for(let i=a.length;i>1;){let j=Math.random()*i--|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const tok=s=>s.toLowerCase().replace(/[’']/g,'').replace(/[^a-z0-9]+/g,' ').trim().split(' ').filter(Boolean);
function lcs(a,b){const m=a.length,n=b.length,d=Array.from({length:m+1},()=>Array(n+1).fill(0));for(let i=m-1;i>=0;i--)for(let j=n-1;j>=0;j--)d[i][j]=a[i]==b[j]?d[i+1][j+1]+1:Math.max(d[i+1][j],d[i][j+1]);const h=Array(m).fill(false);let i=0,j=0;while(i<m&&j<n){if(a[i]==b[j]){h[i]=true;i++;j++}else if(d[i+1][j]>=d[i][j+1])i++;else j++}return h}
let V=null,LOG={},P={},cur=0;
function pick(){const v=speechSynthesis.getVoices();V=v.find(x=>/Google US English/i.test(x.name))||v.find(x=>/Samantha/i.test(x.name))||v.find(x=>x.lang=='en-US')||v.find(x=>/^en/.test(x.lang))||null;$('#vs').textContent='Голос: '+(V?V.name:'системный')}
if('speechSynthesis' in window){speechSynthesis.onvoiceschanged=pick;pick()}else $('#vs').textContent='озвучка не поддерживается';
function say(t,r){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';if(V)u.voice=V;u.rate=r||.9;speechSynthesis.speak(u)}
function bad(e){P[e]=(P[e]||0)+1;renderP()}
function renderP(){const k=Object.keys(P).sort((a,b)=>P[b]-P[a]);$('#pw').innerHTML=k.length?'':'<span class="mut">Пока пусто — отлично!</span>';k.forEach(e=>{const d=document.createElement('div');d.className='p';d.innerHTML=`<span><b>${e}</b></span><span><i>${P[e]}</i> <button class="spk" style="height:26px;font-size:12px">🔊</button></span>`;d.querySelector('button').onclick=()=>say(e);$('#pw').append(d)})}
async function copy(t,b){try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.append(a);a.select();try{document.execCommand('copy')}catch(_){}a.remove()}const o=b.textContent;b.textContent='Скопировано ✓';setTimeout(()=>b.textContent=o,1600)}
function report(){let s='CINEMA WORDS · LISTENING & SPEAKING\n';for(const k in LOG)s+='\n== '+k+' ==\n'+LOG[k].join('\n')+'\n';const pk=Object.keys(P);if(pk.length)s+='\n== Проблемные слова ==\n'+pk.map(e=>e+' ('+P[e]+')').join(', ');return s}
function btn(txt,f,c){const b=document.createElement('button');b.className='btn '+(c||'');b.textContent=txt;b.onclick=()=>f(b);return b}
function controls(box,ex,again,check,show){const r=document.createElement('div');r.className='res';const row=document.createElement('div');row.className='row';
 if(check)row.append(btn('✓ Проверить',()=>{r.textContent=check()}));row.append(btn('👁 Показать ответы',show,'g'),btn('↻ Заново',again,'g'));box.append(row,r)}
const D=[["The actors were on set at six in the morning.","on set"],["The last scene of the epic made everyone cry.","epic"],["Most of the western was shot in the desert.","western"],["I love a good rom-com on a rainy Sunday.","rom-com"],["The thriller kept me on the edge of my seat.","thriller"],["She doesn’t like horror films because they are too scary.","horror film"],["This animation is a musical for the whole family.","animation"],["The war film is based on a true historical story.","war film"]];
const G=[["Two soldiers cross a battlefield in 1944 and try to survive.","war film"],["A cowboy rides into a small town in the Wild West.","western"],["A girl and a boy hate each other, but then they fall in love, and it is very funny.","rom-com"],["A spaceship travels to a distant planet where robots live.","science fiction film"],["Someone is following the hero, and nobody knows who the killer is.","thriller"],["A ghost walks through the house at night and the family is terrified.","horror film"],["The hero fights twenty men, jumps from a car and the building explodes.","action film"],["The characters sing and dance in the street in almost every scene.","musical"],["The story takes place in Rome two thousand years ago.","historical film"],["A drawn rabbit and a talking dog go on an adventure.","animation"]];
const GN=["action film","musical","comedy","animation","historical film","science fiction film","rom-com","thriller","war film","western","horror film","drama"];
const S=[["I’m a big fan of science fiction films.","science fiction film"],["The first scene was shot in Iceland.","be shot"],["We were on set for ten hours.","on set"],["Drama is more serious than comedy.","drama"],["It’s an epic about a brave king.","epic"]];
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const E=[
{t:'Dictation',i:'Нажми 🔊 (или 🐢 для медленного темпа), послушай предложение и напиши его целиком. Можно слушать сколько угодно раз.',run(b){
 const go=()=>{b.innerHTML='';const items=sh(D).slice(0,6),L=[];
  items.forEach((s,n)=>{const d=document.createElement('div');d.className='q';d.innerHTML=`<b>${n+1}.</b> `;
   const a=document.createElement('button');a.className='spk';a.textContent='🔊';a.onclick=()=>say(s[0]);
   const c=document.createElement('button');c.className='spk';c.textContent='🐢 медленно';c.onclick=()=>say(s[0],.55);
   const i=document.createElement('input');i.type='text';i.autocomplete='off';i.spellcheck=false;i.placeholder='Напиши, что услышал(а)…';
   const f=document.createElement('div');f.className='fb';const an=document.createElement('div');an.className='ans';an.textContent='✔ '+s[0];
   d.append(a,' ',c,i,f,an);b.append(d);L.push({s,i,f,d,an})});
  controls(b,E[0],go,()=>{let k=0;LOG['Dictation']=L.map(({s,i,f,d},n)=>{const t=tok(s[0]),u=tok(i.value),h=lcs(t,u);const ok=h.every(Boolean)&&t.length==u.length;if(ok)k++;else bad(s[1]);d.classList.remove('ok','bad');d.classList.add(ok?'ok':'bad');f.innerHTML=ok?'🎬 Всё верно!':'Слова из предложения: '+t.map((w,j)=>h[j]?`<s>${w}</s>`:`<u>${w}</u>`).join(' ')+' <span class="mut">(красным — пропущено или с ошибкой)</span>';return `${n+1}. ${s[0]} → ${i.value||'—'} ${ok?'✓':'✗'}`});return `Результат: ${k} / ${L.length}`},()=>L.forEach(x=>x.an.classList.add('v')))};go()}},
{t:'Guess the genre',i:'Послушай описание и выбери жанр. Если трудно — нажми «Показать текст».',run(b){
 const go=()=>{b.innerHTML='';const items=sh(G).slice(0,8),L=[];
  items.forEach((g,n)=>{const d=document.createElement('div');d.className='q';d.innerHTML=`<b>${n+1}.</b> `;
   const a=document.createElement('button');a.className='spk';a.textContent='🔊 слушать';a.onclick=()=>say(g[0]);
   const t=document.createElement('button');t.className='btn g s';t.textContent='📄 Показать текст';const tx=document.createElement('div');tx.className='txt';tx.textContent=g[0];t.onclick=()=>tx.classList.toggle('v');
   const o=document.createElement('div');o.className='opts';let v='';
   sh([g[1],...sh(GN.filter(x=>x!=g[1])).slice(0,3)]).forEach(x=>{const ob=document.createElement('button');ob.className='opt';ob.textContent=x;ob.onclick=()=>{o.querySelectorAll('.opt').forEach(y=>y.classList.remove('sel'));ob.classList.add('sel');v=x};o.append(ob)});
   d.append(a,' ',t,tx,o);b.append(d);L.push({g,d,o,get:()=>v})});
  controls(b,E[1],go,()=>{let k=0;LOG['Guess the genre']=L.map(({g,d,get},n)=>{const ok=get()==g[1];if(ok)k++;else bad(g[1]);d.classList.remove('ok','bad');d.classList.add(ok?'ok':'bad');return `${n+1}. ${g[0]} → ${get()||'—'} ${ok?'✓':'✗'}`});return `Результат: ${k} / ${L.length}`},()=>L.forEach(({g,o})=>o.querySelectorAll('.opt').forEach(x=>x.classList.toggle('right',x.textContent==g[1]))))};go()}},
{t:'Listen & repeat',i:'Послушай, повтори вслух, потом оцени себя. Если браузер поддерживает микрофон (лучше Chrome), нажми 🎤 — страница сравнит твою речь с предложением.',run(b){
 b.innerHTML='';if(!SR)b.insertAdjacentHTML('beforeend','<p class="mut">🎤 Проверка микрофоном недоступна в этом браузере — просто оцени себя сам.</p>');
 const sc=[];LOG['Listen & repeat']=[];
 sh(S).forEach((s,n)=>{const d=document.createElement('div');d.className='q';d.innerHTML=`<b>${n+1}.</b> <i>${s[0]}</i><div class="row"></div><div class="fb"></div>`;
  const r=d.querySelector('.row'),f=d.querySelector('.fb');
  r.append(btn('🔊 Слушать',()=>say(s[0]),'s'),btn('🐢 Медленно',()=>say(s[0],.55),'g s'));
  if(SR)r.append(btn('🎤 Говорить',bt=>{const rc=new SR();rc.lang='en-US';bt.textContent='🎤 Слушаю…';rc.onresult=e=>{const heard=e.results[0][0].transcript,t=tok(s[0]),h=lcs(t,tok(heard)),p=Math.round(100*h.filter(Boolean).length/t.length);f.innerHTML=`Я услышал: “${heard}” — совпадение <b>${p}%</b> ${p>=80?'🎬':'· попробуй ещё раз'}`;if(p<80)bad(s[1]);LOG['Listen & repeat'][n]=`${s[0]} → ${heard} (${p}%)`};rc.onerror=()=>{f.textContent='Не удалось распознать — проверь доступ к микрофону.'};rc.onend=()=>bt.textContent='🎤 Говорить';try{rc.start()}catch(_){}},'s'));
  const rt=document.createElement('div');rt.className='opts';[['😕','Трудно'],['🙂','Нормально'],['😎','Легко']].forEach(o=>{const ob=document.createElement('button');ob.className='opt';ob.textContent=o[0]+' '+o[1];ob.onclick=()=>{rt.querySelectorAll('.opt').forEach(y=>y.classList.remove('sel'));ob.classList.add('sel');if(o[0]=='😕')bad(s[1]);LOG['Listen & repeat'][n]=(LOG['Listen & repeat'][n]||s[0])+' · самооценка: '+ob.textContent};rt.append(ob)});
  d.append(rt);b.append(d)})}}
];
E.forEach((e,i)=>{const b=document.createElement('button');b.textContent=`${i+1}. ${['Dictation','Genres','Repeat'][i]}`;b.onclick=()=>show(i);$('#nav').append(b)});
function show(i){try{speechSynthesis.cancel()}catch(e){}cur=i;[...$('#nav').children].forEach((b,j)=>b.classList.toggle('on',j==i));$('#ti').textContent=`${i+1}. ${E[i].t}`;$('#in').textContent=E[i].i;E[i].run($('#box'))}
$('#rp').onclick=e=>copy(report(),e.target);
renderP();show(0);
</script></body></html>
