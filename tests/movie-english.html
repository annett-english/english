<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Movie Night English · B1</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#120c0e;--card:#1e1417;--red:#b3162b;--gold:#f2c14e;--tx:#f5ece0;--mut:#b9a99a;--ok:#2e9e5b;--no:#d6455d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#3a0f18,var(--bg) 60%) fixed;color:var(--tx);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
h1,h2,h3{font-family:'Bebas Neue',Impact,sans-serif;letter-spacing:.06em;font-weight:400;margin:0}
header{text-align:center;padding:26px 14px 18px;border-bottom:14px solid #000;background:linear-gradient(#2a0b12,#120c0e);position:relative}
header:after{content:"";position:absolute;left:0;right:0;bottom:-11px;height:8px;background:repeating-linear-gradient(90deg,transparent 0 10px,#f2c14e 10px 22px)}
h1{font-size:clamp(34px,7vw,60px);color:var(--gold);text-shadow:0 0 18px #b3162b}
header p{margin:4px 0 12px;color:var(--mut)}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:20px;max-width:1150px;margin:26px auto;padding:0 14px}
@media(max-width:850px){.wrap{grid-template-columns:1fr}aside{order:-1;position:static!important}}
.card{background:var(--card);border:1px solid #3b262b;border-left:6px solid var(--red);border-radius:14px;padding:18px;margin-bottom:22px;box-shadow:0 6px 20px #0008}
.card h2{font-size:28px;color:var(--gold);display:flex;gap:10px;align-items:center}
.card h2 span{background:var(--red);color:#fff;border-radius:50%;width:34px;height:34px;display:grid;place-items:center;font-size:20px;flex:none}
.d{color:var(--mut);margin:4px 0 14px}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:7px 14px;background:var(--red);color:#fff}
button:hover{filter:brightness(1.2)}
button.alt{background:#3b262b;color:var(--tx)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
.sc{color:var(--gold);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.wc{background:#2a1a1f;border:1px dashed #6b4a52;border-radius:10px;padding:8px 10px;display:grid;grid-template-columns:1fr auto;gap:0 6px}
.wc b{color:var(--gold)}.wc i{color:var(--mut);font-size:14px}.wc span{grid-column:1}.wc button{grid-row:1/4;grid-column:2;align-self:center;padding:6px 10px}
select,input,textarea{font:inherit;background:#120c0e;color:var(--tx);border:1px solid #6b4a52;border-radius:6px;padding:5px 8px;max-width:100%}
input{min-width:200px}textarea{width:100%;min-height:60px}
.ok{border-color:var(--ok)!important;background:#12301f!important}.no{border-color:var(--no)!important;background:#3a1119!important}
.q{margin:10px 0}.q small{color:var(--mut);margin-right:6px}
.sol{display:block;color:var(--gold);font-size:14px;margin-top:2px}
.txt{font-size:18px;line-height:2}
.w{cursor:pointer;border-radius:4px;padding:1px 2px}.w:hover{background:#ffffff14}
.w.sel{background:#f2c14e44}.w.ok{background:#2e9e5b66!important}.w.no{background:#d6455d66!important}.w.miss{outline:2px dashed var(--gold)}
.sm{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.sm div{display:flex;flex-direction:column;gap:6px}
.it{background:#2a1a1f;color:var(--tx);text-align:left}.it.act{outline:2px solid var(--gold)}.it.done{background:var(--ok);opacity:.6}
.chip{display:inline-block;margin:3px;padding:3px 10px;border-radius:20px;background:#3b262b}.chip.used{background:var(--ok)}
aside{position:sticky;top:10px;align-self:start;background:#000;border:2px solid var(--gold);border-radius:12px;padding:12px}
aside h3{color:var(--gold);font-size:22px}
table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}td{padding:3px;border-bottom:1px solid #333}
.lv button{background:#3b262b;margin:2px;font-size:20px;padding:4px 10px}.lv button.on{background:var(--gold);color:#000}
.rate{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:6px 0;border-bottom:1px solid #3b262b;padding-bottom:4px}
</style></head><body>
<header><h1>🎬 Movie Night English</h1><p>B1 · Cinema vocabulary &amp; expressions</p>
<button id="test">🔊 Проверить звук</button> <span id="vs" style="color:var(--mut);font-size:14px"></span></header>
<div class="wrap"><main id="m"></main>
<aside><h3>🚨 Проблемные слова</h3><table id="pw"></table><button class="alt" id="clr">Очистить</button></aside></div>
<script>
const $=(s,e=document)=>e.querySelector(s),$$=(s,e=document)=>[...e.querySelectorAll(s)];
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const norm=s=>s.toLowerCase().replace(/[’‘]/g,"'").replace(/[^a-z' ]/g,' ').replace(/\s+/g,' ').trim();
let voice=null;
function pick(){const v=speechSynthesis.getVoices();voice=v.find(x=>/Google US English/i.test(x.name))||v.find(x=>/Samantha/i.test(x.name))||v.find(x=>x.lang=='en-US')||v.find(x=>/^en/.test(x.lang))||null;$('#vs').textContent=voice?'Голос: '+voice.name:'Английский голос не найден — проверьте звук/браузер'}
function say(t,q){if(!window.speechSynthesis)return alert('Озвучка не поддерживается этим браузером');if(!q)speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';if(voice)u.voice=voice;u.rate=.9;speechSynthesis.speak(u)}
if(window.speechSynthesis){pick();speechSynthesis.onvoiceschanged=pick}else $('#vs').textContent='Озвучка недоступна'
const P={};
function bad(w){if(!w)return;P[w]=(P[w]||0)+1;rp()}
function rp(){$('#pw').innerHTML=Object.entries(P).sort((a,b)=>b[1]-a[1]).map(([w,n])=>`<tr><td>${w}</td><td>×${n}</td><td><button class="alt" data-say="${w}">🔊</button></td></tr>`).join('')||'<tr><td style="color:#b9a99a">Пока ошибок нет 🎉</td></tr>'}
rp();$('#clr').onclick=()=>{for(const k in P)delete P[k];rp()};
$('#test').onclick=()=>say('Audio check. Welcome to Movie Night!');
const V=[['subtitles','/ˈsʌbˌtaɪtlz/','субтитры'],['soundtrack','/ˈsaʊndtræk/','саундтрек'],['star','/stɑːr/','звезда'],['special effects','/ˌspeʃl ɪˈfekts/','спецэффекты'],['set','/set/','съёмочная площадка'],['critic','/ˈkrɪtɪk/','критик'],['scene','/siːn/','сцена'],['audience','/ˈɔːdiəns/','зрители'],['trailer','/ˈtreɪlər/','трейлер'],['extra','/ˈekstrə/','статист'],['sequel','/ˈsiːkwəl/','продолжение'],['plot','/plɑːt/','сюжет'],['review','/rɪˈvjuː/','рецензия'],['script','/skrɪpt/','сценарий'],['cast','/kæst/','актёрский состав']];
const F=[['is based on','/beɪst ɑːn/','основан на'],['is set in','/set ɪn/','действие происходит в'],['is directed by','/dəˈrektɪd baɪ/','режиссёр — …'],['plays the part of','/pleɪz ðə pɑːrt əv/','играет роль'],['was shot on location','/wʌz ʃɑːt ɑːn loʊˈkeɪʃn/','снимали на натуре'],['is dubbed into','/dʌbd ˈɪntə/','дублирован на …']];
const sel=o=>'<select><option value="">…</option>'+sh(o).map(x=>`<option>${x}</option>`).join('')+'</select>';
const inp='<input autocomplete="off" spellcheck="false">';
const w=(t,c)=>`<span class="w" data-c="${c}">${t}</span>`;
const card=x=>`<div class="wc"><b>${x[0]}</b><i>${x[1]}</i><span>${x[2]}</span><button data-say="${x[0]}">🔊</button></div>`;
const X={};let tm,cw;
X[0]={t:'Warm-up: слова и выражения',d:'Прослушайте каждое слово (голос Google US English / Samantha) и повторите вслух.',b:()=>`<button data-act="all">▶ Прослушать всё</button><h3 style="margin:14px 0 6px">Words</h3><div class="grid">${V.map(card).join('')}</div><h3 style="margin:14px 0 6px">Expressions</h3><div class="grid">${F.map(card).join('')}</div>`,bt:''};
X[1]={t:'Find them in the wild',d:'Нажимайте на целые выражения о кино (6 штук). Остальные фразы — ловушки.',b:()=>`<p class="txt">This thriller ${w('is based on',1)} ${w('a true story',0)}. It ${w('is set in',1)} ${w('1920s Chicago',0)} and ${w('is directed by',1)} ${w('a young newcomer',0)}. The lead star ${w('plays the part of',1)} a tired detective. Most of the film ${w('was shot on location',1)}, and it ${w('is dubbed into',1)} ${w('twelve languages',0)}. The plot is simple, but the special effects are great.</p>`,bt:'chk show reset',i(s){$$('.w',s).forEach(e=>e.onclick=()=>{e.classList.toggle('sel');e.classList.remove('ok','no','miss')})},chk(s){let ok=0;$$('.w',s).forEach(e=>{const c=e.dataset.c=='1',on=e.classList.contains('sel');e.classList.remove('ok','no','miss');if(c&&on){e.classList.add('ok');ok++}else if(!c&&on)e.classList.add('no');else if(c){e.classList.add('miss');bad(e.textContent)}});return ok+'/6'},show(s){$$('.w',s).forEach(e=>{e.classList.remove('sel','no','miss','ok');if(e.dataset.c=='1')e.classList.add('ok')})}};
X[2]={t:'Which word fits?',d:'Выберите предлог: on, in, by, into, of, at.',b:()=>{const r=[['The film is based ? a bestselling novel.','on','is based on'],['The story is set ? Paris in 1960.','in','is set in'],['The movie is directed ? a famous woman.','by','is directed by'],['The film is dubbed ? Polish.','into','is dubbed into'],['The scene was shot ? location in Iceland.','on','was shot on location'],['She plays the part ? a queen.','of','plays the part of'],['The actors met ? the set at six.','at','set']];return sh(r).slice(0,6).map((x,i)=>`<div class="q" data-a="${x[1]}" data-t="${x[2]}">${i+1}. ${x[0].replace('?',sel(['on','in','by','into','of','at']))}</div>`).join('')},bt:'chk show reset'};
X[3]={t:'Speed match',d:'60 секунд: нажмите слово слева, затем его значение справа.',b:()=>`<button data-act="start">▶ Старт</button> ⏱ <b id="tmr">60</b> <b class="sc" id="smsg"></b><div class="sm" id="sm"></div>`,bt:'',i(s){const box=$('#sm',s);let w8,cur,left,t;const fin=m=>{clearInterval(tm);$('#smsg',s).textContent=m};s.start=()=>{clearInterval(tm);w8=sh(V).slice(0,8);left=8;t=60;cur=null;$('#smsg',s).textContent='';$('#tmr',s).textContent=t;box.innerHTML='<div>'+sh(w8).map(x=>`<button class="it" data-w="${x[0]}">${x[0]}</button>`).join('')+'</div><div>'+sh(w8).map(x=>`<button class="it" data-m="${x[0]}">${x[2]}</button>`).join('')+'</div>';tm=setInterval(()=>{$('#tmr',s).textContent=--t;if(t<=0){fin('Время вышло! '+(8-left)+'/8');$$('.it',box).forEach(b=>b.disabled=true)}},1000)};box.onclick=e=>{const b=e.target.closest('.it');if(!b||b.disabled)return;if(b.dataset.w){$$('.act',box).forEach(x=>x.classList.remove('act'));b.classList.add('act');cur=b;say(b.dataset.w)}else if(cur){if(cur.dataset.w==b.dataset.m){[cur,b].forEach(x=>{x.classList.add('done');x.disabled=true});cur=null;if(!--left)fin('🎉 Все 8 за '+(60-t)+' с!')}else{bad(cur.dataset.w);b.classList.add('no');setTimeout(()=>b.classList.remove('no'),400)}}}}};
X[4]={t:'Listen and type',d:'Нажмите 🔊 и впишите услышанное слово или выражение.',b:()=>sh([...F.map(x=>x[0]),'special effects','soundtrack','sequel','trailer','subtitles','audience']).slice(0,6).map((x,i)=>`<div class="q" data-a="${x}" data-t="${x}">${i+1}. <button data-say="${x}">🔊</button> ${inp}</div>`).join(''),bt:'chk show reset'};
X[5]={t:'Passive voice: tenses',d:'Поставьте глагол в скобках в Passive в указанном времени.',b:()=>sh([['Present Simple','The script ? (write) by two authors.','is written','write'],['Past Simple','The scene ? (shoot) on location last week.','was shot','shoot'],['Present Perfect','The trailer ? (release) already.','has been released','release'],['Future Simple','The sequel ? (film) next year.','will be filmed','film'],['Present Continuous','The set ? (build) right now.','is being built','build'],['Past Perfect','The plot ? (change) before the premiere.','had been changed','change']]).map((x,i)=>`<div class="q" data-a="${x[2]}" data-t="${x[3]}">${i+1}. <small>${x[0]}</small> ${x[1].replace('?',inp)}</div>`).join(''),bt:'chk show reset'};
X[6]={t:'Fill the text',d:'Вставьте слова по контексту. Каждое слово используется один раз.',b:()=>{const a=['trailer','audience','critic','review','soundtrack','subtitles','extra','sequel'];const T=['Last night I saw a new film. First I watched the @ online, and it looked great. The @ loved the film and clapped at the end. A famous @ wrote a positive @ in the paper. The film has an amazing @ and I want to buy the music. I don’t speak Italian, so I turned on the @. One @ even appeared for two seconds in the café scene! I hope there will be a @.'];let i=0;return `<p class="txt">${T[0].replace(/@/g,()=>`<span class="q" data-a="${a[i]}" data-t="${a[i++]}">${sel(a)}</span>`)}</p>`},bt:'chk show reset'};
X[7]={t:'Rephrase',d:'Перепишите предложение, используя выражение в скобках. Минимум 4 слова.',b:()=>sh([['The novel is the source of the film.','based on','The film is based on a novel.'],['Spielberg is the director of the movie.','directed by','The movie is directed by Spielberg.'],['The story takes place in Rome.','set in','The story is set in Rome.'],['They filmed the scenes in real places.','shot on location','The scenes were shot on location.'],['Tom Hanks acts as a pilot.','plays the part of','Tom Hanks plays the part of a pilot.'],['The film has Spanish voices instead of the original.','dubbed into','The film is dubbed into Spanish.']]).slice(0,5).map((x,i)=>`<div class="q" data-k="${x[1]}" data-t="${x[1]}" data-s="${x[2]}" data-p="${x[0]} → ">${i+1}. ${x[0]} <small>(${x[1]})</small><br>${inp.replace('<input','<input style="width:100%"')}</div>`).join(''),bt:'chk show copy reset'};
X[8]={t:'Finish with your own ideas',d:'Закончите предложения по-своему. Затем скопируйте ответы и отправьте учителю.',b:()=>sh(['My favourite film is based on','I would love to see a sequel to … because','The best soundtrack I have ever heard is','If I were a film critic, I would','I would like to play the part of … in a film that is set in','The audience at the cinema usually','A good trailer should']).slice(0,6).map((x,i)=>`<div class="q" data-p="${x} ">${i+1}. ${x}<textarea></textarea></div>`).join(''),bt:'copy reset'};
X[9]={t:'Story with 5 words',d:'Напишите мини-рассказ (4–6 предложений), используя все 5 слов.',b:()=>{const ws=sh(V).slice(0,5).map(x=>x[0]);return `<div id="ch">${ws.map(x=>`<span class="chip" data-w="${x}">${x}</span>`).join('')}</div><b class="sc" id="cnt">0/5</b><div class="q" data-p="Words: ${ws.join(', ')}\n"><textarea style="min-height:130px"></textarea></div>`},bt:'copy reset',i(s){const ta=$('textarea',s);ta.oninput=()=>{const v=ta.value.toLowerCase();let n=0;$$('.chip',s).forEach(c=>{const u=new RegExp('\\b'+c.dataset.w+'(s|es)?\\b').test(v);c.classList.toggle('used',u);n+=u});$('#cnt',s).textContent=n+'/5'+(n==5?' 🎉':'')}}};
const R=['Пока не уверен','Почти','Уверен!'],E=['😕','🙂','🤩'];
X[10]={t:'Что я теперь знаю',d:'Оцените себя: нажимайте на смайлик.',b:()=>['Я могу рассказать о сюжете фильма (plot)','Я знаю слова про съёмки: set, scene, extra, script','Я могу описать актёров: star, cast','Я могу написать review и сказать, что думает critic','Я могу сказать, на чём основан фильм и где происходит действие','Я могу использовать Passive: was shot, is directed by','Я понимаю trailer, sequel, subtitles, soundtrack, audience'].map(x=>`<div class="rate"><span>${x}</span><span class="lv" data-v="0">${E.map((e,i)=>`<button data-r="${i}">${e}</button>`).join('')}</span></div>`).join('')+'<p id="fin" class="sc"></p>',bt:'',i(s){s.onclick=e=>{const b=e.target.closest('[data-r]');if(!b)return;$$('button',b.parentNode).forEach(x=>x.classList.remove('on'));b.classList.add('on');b.parentNode.dataset.v=b.dataset.r;const l=$$('.lv',s).filter(x=>x.querySelector('.on')),g=l.filter(x=>x.dataset.v==2).length,p=Object.keys(P);$('#fin',s).textContent=`Уверен: ${g} из ${l.length} отмеченных.`+(p.length?` Повторить: ${p.slice(0,6).join(', ')}.`:' Ошибок нет — отличная работа! 🎬')}}};
const BT={chk:['Проверить','chk'],show:['Показать ответы','show'],copy:['📋 Копировать','copy'],reset:['↻ Заново','reset']};
function render(n){let s=$('#s'+n);if(!s){s=document.createElement('section');s.className='card';s.id='s'+n;$('#m').append(s)}const x=X[n];s.innerHTML=`<h2><span>${n||'★'}</span>${x.t}</h2><p class="d">${x.d}</p>${x.b()}`+(x.bt?`<div class="bar">${x.bt.split(' ').map(k=>`<button class="${k=='chk'||k=='copy'?'':'alt'}" data-act="${k}">${BT[k][0]}</button>`).join('')}<span class="sc"></span></div>`:'');x.i&&x.i(s)}
Object.keys(X).forEach(render);
function val(q){const c=$('select,input,textarea',q);return c?c.value.trim():''}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.say)return say(b.dataset.say);const a=b.dataset.act;if(!a)return;const s=b.closest('section'),n=+s.id.slice(1),x=X[n];
if(a=='all'){speechSynthesis.cancel();[...V,...F].forEach(y=>say(y[0],1))}
else if(a=='start')s.start();
else if(a=='reset')render(n);
else if(a=='chk'){if(x.chk)$('.sc',s).textContent=x.chk(s);else{let ok=0,all=0;$$('.q[data-a],.q[data-k]',s).forEach(q=>{const c=$('select,input',q),v=norm(c.value);const g=q.dataset.a?q.dataset.a.split('|').some(y=>norm(y)==v):v.split(' ').length>=4&&v.includes(q.dataset.k);all++;c.classList.remove('ok','no');c.classList.add(g?'ok':'no');g?ok++:bad(q.dataset.t)});$('.sc',s).textContent=ok+'/'+all}}
else if(a=='show'){if(x.show)x.show(s);else $$('.q',s).forEach(q=>{const c=$('select,input',q);$$('.sol',q).forEach(y=>y.remove());if(q.dataset.s){const sp=document.createElement('span');sp.className='sol';sp.textContent='Пример: '+q.dataset.s;q.append(sp)}else if(c){c.value=q.dataset.a.split('|')[0];c.classList.remove('no');c.classList.add('ok')}})}
else if(a=='copy'){const t=$$('.q',s).map(q=>q.dataset.p+val(q)).join('\n');navigator.clipboard.writeText(t).then(()=>{b.textContent='✓ Скопировано'},()=>{prompt('Скопируйте текст:',t)});setTimeout(()=>b.textContent=BT.copy[0],1800)}
});
</script></body></html>
