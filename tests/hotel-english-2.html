<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hotel English 2 · повторение</title>
<style>
:root{--bg1:#e6fbf3;--bg2:#e4ecff;--card:#fff;--ink:#23213a;--mut:#6b6885;--acc:#0fa3b1;--acc2:#6c5ce7;--ok:#12a36b;--okbg:#d9f7ea;--bad:#e5484d;--badbg:#ffe1e2;--warn:#f5a524;--warnbg:#fff1d6;--line:#dcebf0;--sel:#d4f1f4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg1:#0f2a2c;--bg2:#10192e;--card:#1b2840;--ink:#eef6fb;--mut:#9fb3c8;--okbg:#103c2e;--badbg:#472026;--warnbg:#463615;--line:#2f4560;--sel:#1f5a63}}
:root[data-theme="dark"]{color-scheme:dark;--bg1:#0f2a2c;--bg2:#10192e;--card:#1b2840;--ink:#eef6fb;--mut:#9fb3c8;--okbg:#103c2e;--badbg:#472026;--warnbg:#463615;--line:#2f4560;--sel:#1f5a63}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--bg1),var(--bg2)) fixed;min-height:100vh}
.wrap{max-width:1080px;margin:0 auto;padding:16px;display:grid;grid-template-columns:1fr 250px;gap:16px;align-items:start}
header{grid-column:1/-1;text-align:center;padding:18px 8px 4px}
h1{margin:0;font-size:clamp(26px,5vw,40px);background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
header p{margin:4px 0 0;color:var(--mut)}
.card,aside{background:var(--card);border-radius:22px;padding:18px;margin-bottom:16px;box-shadow:0 8px 24px rgba(15,163,177,.14);border:1px solid var(--line)}
aside{position:sticky;top:12px;margin:0}aside h3{margin:0 0 8px}
h2{margin:0;font-size:20px}.sub{margin:2px 0 12px;color:var(--mut);font-size:14px}
button{font:inherit;cursor:pointer;border:0}
.b{background:linear-gradient(90deg,var(--acc),var(--acc2));color:#fff;padding:8px 16px;border-radius:999px;font-weight:600}
.ghost{background:transparent;color:var(--acc);border:2px solid var(--acc)}
.sp{background:var(--sel);border-radius:50%;width:36px;height:36px;flex:none}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
.sc{font-weight:700;color:var(--acc)}
.q{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0;padding-bottom:10px;border-bottom:1px dashed var(--line)}
.opts{display:flex;gap:8px;flex-wrap:wrap;width:100%}
.opt{background:var(--card);border:2px solid var(--line);color:var(--ink);border-radius:12px;padding:6px 12px}
.opt:hover{border-color:var(--acc)}
.ok{background:var(--okbg);border-color:var(--ok)}.bad{background:var(--badbg);border-color:var(--bad)}
textarea{font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:12px;padding:8px 10px;width:100%;min-height:150px}
textarea.ok{border-color:var(--ok)}textarea.bad{border-color:var(--bad)}
.line{min-height:46px;border:2px dashed var(--line);border-radius:12px;padding:6px;display:flex;gap:6px;flex-wrap:wrap;width:100%}
.pool{display:flex;gap:6px;flex-wrap:wrap;width:100%}
.wd{background:var(--sel);color:var(--ink);border-radius:10px;padding:5px 10px;font-weight:600}
.wd.u{opacity:.25;pointer-events:none}
.fb{font-size:14px;width:100%;color:var(--mut)}.fb b{color:var(--ok)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{border:2px solid var(--line);border-radius:999px;padding:3px 12px;font-size:14px}
.pw{display:flex;justify-content:space-between;gap:6px;padding:6px 8px;border-radius:10px;background:var(--badbg);margin:5px 0;cursor:pointer;font-size:14px}
.hint{color:var(--mut);font-size:13px}
@media(max-width:860px){.wrap{grid-template-columns:1fr}aside{position:static;order:-1}}
</style></head><body>
<div class="wrap">
<header><h1>🔁 Hotel English · повторение</h1><p>2 упражнения на повтор + 1 на письмо · голос: <b id="vn">…</b></p></header>
<main id="main"></main>
<aside><h3>⚠️ Проблемные слова</h3><p class="hint">Фразы с ошибками. Нажми — послушай.</p><div id="pw"><p class="hint">Пока пусто 🎉</p></div></aside>
</div>
<script>
const E={ci:['🛎️','check in / check out','check in. check out'],ask:['🙋','I think I asked for…','I think I asked for'],chg:['🔄','If you could change …, it would be great','If you could change the room, it would be great'],rev:['⭐','leave a good / bad review','leave a bad review'],nm:['🤷','never mind','never mind'],suf:['🐌','suffer from bad / slow service','suffer from slow service'],mix:['🌀','get something mixed up','get something mixed up'],go:['👉','go ahead','go ahead'],ac:['❄️','get the air conditioning working','get the air conditioning working']};
const $=s=>document.querySelector(s),sh=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const norm=s=>s.toLowerCase().replace(/[’]/g,"'").replace(/[^a-z' ]/g,' ').replace(/\s+/g,' ').trim();
let V=null;
function pick(){const v=speechSynthesis.getVoices();V=v.find(x=>/Google US English/i.test(x.name))||v.find(x=>/Samantha/i.test(x.name))||v.find(x=>x.lang==='en-US')||v.find(x=>/^en/i.test(x.lang))||null;$('#vn').textContent=V?V.name:'по умолчанию'}
if('speechSynthesis' in window){pick();speechSynthesis.onvoiceschanged=pick}else $('#vn').textContent='озвучка недоступна';
function say(t){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.9;if(V)u.voice=V;speechSynthesis.speak(u)}
document.addEventListener('click',e=>{const s=e.target.closest('[data-say]');if(s)say(s.dataset.say)});
const P={};
function bad(id){P[id]=(P[id]||0)+1;$('#pw').innerHTML=Object.keys(P).map(k=>`<div class="pw" data-say="${E[k][2]}"><span>${E[k][0]} ${E[k][1]}</span><b>×${P[k]}</b></div>`).join('')}
function sec(t,s,o={}){const d=document.createElement('section');d.className='card';d.innerHTML=`<h2>${t}</h2><p class="sub">${s}</p><div class="body"></div><div class="bar">${o.nochk?'':'<button class="b" data-a="chk">Проверить</button>'}<button class="b ghost" data-a="show">Показать ответы</button>${o.copy?'<button class="b ghost" data-a="cp">📋 Скопировать мой текст</button>':''}<span class="sc"></span></div>`;$('#main').append(d);d.score=(a,b)=>d.querySelector('.sc').textContent=`${a} / ${b}`;d.on=(a,f)=>{const b=d.querySelector(`[data-a=${a}]`);if(b)b.onclick=f};d.body=d.querySelector('.body');return d}
async function copy(t,btn){try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.append(a);a.select();try{document.execCommand('copy')}catch(_){}a.remove()}const o=btn.textContent;btn.textContent='✅ Скопировано!';setTimeout(()=>btn.textContent=o,1600)}
// 1 choose the phrase
(()=>{const d=sec('1 · Choose the phrase','Выбери выражение, которое подходит в пропуск. Нажми 🔊, чтобы услышать предложение.',{nochk:1});
const S={ci:'check in',ask:'I think I asked for',go:'go ahead',nm:'never mind',ac:'get the air conditioning working',rev:'leave a bad review',suf:'suffer from slow service',mix:'got the dates mixed up'};
const it=sh([['ci','We arrive at noon, but we can ___ only after 3 pm.'],['ask','___ tea, not coffee.'],['go','— Can I ask a question? — Sure, ___!'],['nm','— Do you need help? — No, ___, I found it.'],['ac','The room is too hot. Could you ___?'],['rev','The staff were rude, so I will ___.'],['suf','Guests here ___: it takes an hour to get a drink.'],['mix','I’m sorry, I ___.']]);
let k=0,n=0;
it.forEach(x=>{const o=sh([x[0],...sh(Object.keys(S).filter(i=>i!==x[0])).slice(0,3)]);const q=document.createElement('div');q.className='q';const full=x[1].replace('___',S[x[0]]);
q.innerHTML=`<button class="sp" data-say="${full.replace(/"/g,'')}">🔊</button><b>${x[1]}</b><div class="opts">${o.map(i=>`<button class="opt" data-id="${i}">${S[i]}</button>`).join('')}</div>`;
q.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(q.dataset.d)return;q.dataset.d=1;n++;if(b.dataset.id===x[0])k++;else{bad(x[0]);b.classList.add('bad')}q.querySelector(`[data-id=${x[0]}]`).classList.add('ok');d.score(k,n)});d.body.append(q)});
d.on('show',()=>d.body.querySelectorAll('.q').forEach((q,i)=>{q.dataset.d=1;q.querySelector(`[data-id=${it[i][0]}]`).classList.add('ok')}))})();
// 2 scramble
(()=>{const d=sec('2 · Собери фразу','Нажимай на слова по порядку. Нажми на слово в строке, чтобы убрать его.');
const it=sh([['ci','check in at the hotel'],['go','go ahead and ask'],['ac','get the air conditioning working'],['rev','leave a bad review online'],['suf','suffer from slow service'],['ask','I think I asked for a quiet room']]);
const R=[];
it.forEach(x=>{const w=x[1].split(' ');let m=sh(w);for(let i=0;i<9&&m.join(' ')===x[1];i++)m=sh(w);
const q=document.createElement('div');q.className='q';q.innerHTML='<button class="sp" data-say="'+x[1]+'">🔊</button><div class="line"></div><div class="pool"></div><div class="fb"></div>';
const ln=q.querySelector('.line'),pl=q.querySelector('.pool');
m.forEach(t=>{const b=document.createElement('button');b.className='wd';b.textContent=t;b.onclick=()=>{const c=document.createElement('button');c.className='wd';c.textContent=t;c.onclick=()=>{c.remove();b.classList.remove('u')};b.classList.add('u');ln.append(c);ln.classList.remove('ok','bad')};pl.append(b)});
R.push({q,ln,x});d.body.append(q)});
d.on('chk',()=>{let k=0;R.forEach(r=>{const a=[...r.ln.children].map(c=>c.textContent).join(' '),ok=a===r.x[1];r.ln.className='line '+(ok?'ok':'bad');r.q.querySelector('.fb').textContent=ok?'✅':'❌ Попробуй ещё раз';if(ok)k++;else bad(r.x[0])});d.score(k,R.length)});
d.on('show',()=>R.forEach(r=>r.q.querySelector('.fb').innerHTML='Ответ: <b>'+r.x[1]+'</b>'))})();
// 3 production
(()=>{const d=sec('3 · Write: жалоба или отзыв об отеле','Напиши отзыв или письмо в отель (4–6 предложений) и используй как можно больше выражений — минимум 5 из 9. Ответов может быть много.',{copy:1});
const R=[['ci',/check(ed|ing)? (in|out)/],['ask',/i think i asked for/],['chg',/if you could .*would be great/],['rev',/leav(e|ing) (a )?(good|bad) review|left (a )?(good|bad) review/],['nm',/never ?mind/],['suf',/suffer(ed|ing)? from .*service/],['mix',/(get|got|getting|gets) .*mixed up/],['go',/go ahead/],['ac',/(get|got|getting) the air conditioning working/]];
d.body.innerHTML='<textarea placeholder="Dear manager, …"></textarea><div class="chips">'+R.map(r=>`<span class="chip" data-id="${r[0]}">${E[r[0]][0]} ${E[r[0]][1]}</span>`).join('')+'</div><div class="fb" id="fb3"></div>';
const ta=d.body.querySelector('textarea');
d.on('chk',()=>{const t=norm(ta.value);let k=0;R.forEach(r=>{const ok=r[1].test(t),c=d.body.querySelector(`[data-id=${r[0]}]`);c.classList.toggle('ok',ok);c.classList.remove('bad');if(ok)k++});d.score(k,R.length);ta.className=k>=5?'ok':'bad';$('#fb3').textContent=k>=5?'✅ Отлично, цель достигнута!':'❌ Использовано '+k+' из минимум 5. Подсвечены уже использованные выражения.';if(k<5)R.filter(r=>!r[1].test(t)).forEach(r=>bad(r[0]))});
d.on('show',()=>$('#fb3').innerHTML='<b>Пример:</b> Dear manager, last week we stayed at your hotel. We wanted to check in at noon, but we waited an hour, so we suffer from slow service. I think I asked for a quiet room, but we got a noisy one. Your staff got our names mixed up. The air conditioning was broken. If you could change our room, it would be great. Go ahead and fix it, please! Otherwise I will leave a bad review. Never mind, thanks!');
d.on('cp',()=>copy(ta.value,d.querySelector('[data-a=cp]')))})();
</script></body></html>
