<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Second Conditional — повторение и практика</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff4e8;--card:#fff;--ink:#2b2140;--mut:#6f6590;--p:#ff7a45;--p2:#ff3d8b;--ok:#17a673;--okb:#dcf8ec;--bad:#e5484d;--badb:#ffe3e4;--line:#ffe0c9;--y:#ffd54a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#241528;--card:#33203a;--ink:#fff0f5;--mut:#d3b4c6;--okb:#12392e;--badb:#40191d;--line:#533050;--ok:#3ddc97;--bad:#ff7a7f}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#241528;--card:#33203a;--ink:#fff0f5;--mut:#d3b4c6;--okb:#12392e;--badb:#40191d;--line:#533050;--ok:#3ddc97;--bad:#ff7a7f}
*{box-sizing:border-box}html{scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 Fredoka,system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--p);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:linear-gradient(90deg,var(--p),var(--p2));color:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
header b{font-size:18px}.pill{background:rgba(255,255,255,.25);padding:4px 14px;border-radius:99px;font-weight:600;white-space:nowrap}
main{max-width:760px;margin:0 auto;padding:16px}
.hero{text-align:center;padding:18px 0 6px}.hero h1{margin:0;font-size:32px;line-height:1.1}.hero p{color:var(--mut);margin:6px 0}
.recap{background:var(--card);border:2px dashed var(--p);border-radius:18px;padding:12px 16px;margin-top:14px;text-align:center}
.f{background:var(--line);padding:2px 8px;border-radius:8px;font-weight:600}
.card{background:var(--card);border-radius:22px;padding:18px;margin:18px 0;border:2px solid var(--line);box-shadow:0 6px 0 var(--line)}
.card h2{margin:0 0 4px;font-size:22px}.hint{color:var(--mut);margin:0 0 12px;font-size:15px}
.num{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--p);color:#fff;margin-right:8px;font-size:18px}
.tag{font-size:13px;background:var(--y);color:#3b2e00;border-radius:99px;padding:2px 10px;margin-left:6px;vertical-align:middle}
.item{padding:10px 0;border-top:1px dashed var(--line)}.q{margin:0 0 8px}
.opts{display:flex;flex-wrap:wrap;gap:8px}button{font:inherit;cursor:pointer}
.opt{background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:6px 14px}
.opt:hover{border-color:var(--p)}.opt.sel{background:var(--p);color:#fff;border-color:var(--p)}
.opt.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.opt.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.chips span{background:var(--line);border-radius:10px;padding:2px 10px;font-weight:500}
input,textarea{font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:6px 10px;width:100%}
input:focus,textarea:focus{outline:none;border-color:var(--p)}
input.ok,textarea.ok{border-color:var(--ok);background:var(--okb)}input.bad,textarea.bad{border-color:var(--bad);background:var(--badb)}
.fb{margin-top:6px;font-size:15px;border-radius:10px}.fb.ok,.fb.bad,.fb.tip{padding:6px 10px}
.fb.ok{background:var(--okb);color:var(--ok)}.fb.bad{background:var(--badb);color:var(--bad)}.fb.tip{background:var(--line);color:var(--ink)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
.b1,.b2,.b3{border:0;border-radius:14px;padding:8px 18px;font-weight:600}
.b1{background:var(--p);color:#fff;box-shadow:0 4px 0 #c24a1c}.b2{background:var(--y);color:#3b2e00;box-shadow:0 4px 0 #c9a21b}.b3{background:var(--line);color:var(--ink)}
.b1:active,.b2:active{transform:translateY(3px);box-shadow:none}.res{font-weight:600;margin-left:auto}
.cnt{font-weight:600;color:var(--p)}
</style></head><body>
<header><b>🔁 Second Conditional · Practice</b><span class="pill">⭐ <span id="sc">0</span> / <span id="mx">0</span></span></header>
<main>
<div class="hero"><h1>Review &amp; Produce 🎤</h1><p>Два задания на повторение и одно на речевую практику</p>
<div class="recap"><span class="f">If + Past Simple, would / could + infinitive</span><br><small>If I were you… · никакого would в if-clause · запятая, если if-clause в начале</small></div></div>
<div id="ex"></div>
</main>
<script>
const $=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const norm=s=>s.toLowerCase().replace(/[’‘`]/g,"'").replace(/won't/g,"will not").replace(/n't/g," not").replace(/'d\b/g," would").replace(/[^a-z\s]/g,"").replace(/\s+/g," ").trim();
const ex=s=>{const m=s.match(/\{([^{}]*)\}/);return m?m[1].split("|").flatMap(o=>ex(s.replace(m[0],o))):[s]};
const acc=a=>a.split(";").flatMap(ex).map(norm);
const shown=a=>ex(a.split(";")[0])[0];
const EX=[
{k:"c",ic:"🧠",t:"Choose the correct answer",tag:"Повторение",h:"Выбери правильный вариант.",items:[
{q:"If I ___ a superhero, I would help everyone.",o:["were","would be","am"],a:0,e:"В if-clause — Past Simple от be: were (с I допустимо и was). Would в if-clause не ставим."},
{q:"If you ___ harder, you would pass the test.",o:["study","studied","would study"],a:1,e:"После if — Past Simple: studied."},
{q:"I ___ be nervous if I had to sing on stage.",o:["will","had","would"],a:2,e:"Главная часть Second Conditional: would + infinitive."},
{q:"If we had a car, we ___ travel around Europe. (возможность)",o:["did","could","can"],a:1,e:"could + infinitive выражает возможность вместо would."},
{q:"If I ___ you, I wouldn’t tell him the secret.",o:["am","was","were"],a:2,e:"If I were you… — в советах всегда were, не was."},
{q:"She would learn faster if she ___ every day.",o:["practised","practises","would practise"],a:0,e:"If-clause в конце: запятой нет, а после if нужен Past Simple (practised)."},
{q:"What ___ you do if you saw a ghost?",o:["will","would","did"],a:1,e:"Вопрос: would + подлежащее + infinitive. Ситуация воображаемая."},
{q:"If it ___ so cold, we would go for a walk.",o:["isn’t","won’t be","wasn’t"],a:2,e:"Нужен Past Simple: wasn’t (или weren’t). Isn’t и won’t be — формы реальных условий."}]},
{k:"t",ic:"🧩",t:"Unscramble the sentences",tag:"Повторение",h:"Составь предложение из слов и напиши его целиком. Не забудь про Past Simple и would.",items:[
{q:"<span class='chips'><span>if</span><span>I</span><span>had</span><span>wings</span><span>I</span><span>would</span><span>fly</span><span>to</span><span>school</span></span>",a:"If I had wings, I would fly to school;I would fly to school if I had wings",e:"If + Past Simple (had), would + infinitive (fly). Можно начать и с главной части — тогда запятой нет."},
{q:"<span class='chips'><span>would</span><span>she</span><span>be</span><span>happy</span><span>if</span><span>she</span><span>won</span></span>",a:"She would be happy if she won;If she won, she would be happy",e:"won — Past Simple в if-clause, would be happy — главная часть."},
{q:"<span class='chips'><span>if</span><span>were</span><span>I</span><span>you</span><span>I’d</span><span>apologise</span></span>",a:"If I were you, I would apologise;I would apologise if I were you",e:"If I were you… — советуем, всегда were."},
{q:"<span class='chips'><span>we</span><span>could</span><span>if</span><span>had</span><span>time</span><span>more</span><span>visit</span><span>we</span><span>the</span><span>museum</span></span>",a:"If we had more time, we could visit the museum;We could visit the museum if we had more time",e:"could выражает возможность: we could visit."},
{q:"<span class='chips'><span>he</span><span>if</span><span>on</span><span>the</span><span>Moon</span><span>lived</span><span>he</span><span>would</span><span>miss</span><span>pizza</span></span>",a:"If he lived on the Moon, he would miss pizza;He would miss pizza if he lived on the Moon",e:"lived — Past Simple, would miss — would + infinitive."},
{q:"<span class='chips'><span>wouldn’t</span><span>I</span><span>eat</span><span>that</span><span>if</span><span>I</span><span>were</span><span>you</span></span>",a:"I wouldn't eat that if I were you;If I were you, I wouldn't eat that",e:"Совет в отрицательной форме: wouldn’t + infinitive."},
{q:"<span class='chips'><span>if</span><span>they</span><span>knew</span><span>the</span><span>answer</span><span>they</span><span>would</span><span>tell</span><span>us</span></span>",a:"If they knew the answer, they would tell us;They would tell us if they knew the answer",e:"knew — Past Simple, would tell — would + infinitive."},
{q:"<span class='chips'><span>what</span><span>would</span><span>you</span><span>do</span><span>if</span><span>you</span><span>lost</span><span>your</span><span>phone</span></span>",a:"What would you do if you lost your phone",e:"В вопросе would стоит перед подлежащим: What would you do…?"}]}
];
const score=[],max=[];
const upd=()=>{sc.textContent=score.reduce((a,b)=>a+(b||0),0);mx.textContent=max.reduce((a,b)=>a+b,0)};
const fb=(b,c,m)=>{const f=b.querySelector(".fb");f.className="fb "+c;f.innerHTML=m};
function mk(x,it,i){
 const box=$("div","item"),f=$("div","fb");let chk,show,rs;
 if(x.k=="c"){
  const q=$("p","q",`<b>${i+1}.</b> ${it.q.replace("___","<u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u>")}`),o=$("div","opts"),bs=[];it.sel=-1;
  it.o.forEach((t,j)=>{const b=$("button","opt",t);b.onclick=()=>{bs.forEach(k=>k.classList.remove("sel"));b.classList.add("sel");it.sel=j};bs.push(b);o.append(b)});
  box.append(q,o,f);
  chk=()=>{if(it.sel<0){fb(box,"tip","👆 Выбери вариант");return null}const r=it.sel==it.a;bs.forEach((b,j)=>{b.classList.remove("ok","bad");if(j==it.sel)b.classList.add(r?"ok":"bad")});fb(box,r?"ok":"bad",r?"✅ Верно! "+it.e:"❌ Не совсем. Попробуй ещё раз или нажми «Ответы».");return r};
  show=()=>{bs.forEach((b,j)=>{b.classList.remove("sel","bad","ok");if(j==it.a)b.classList.add("ok")});fb(box,"tip","💡 "+it.e)};
  rs=()=>{it.sel=-1;bs.forEach(b=>b.classList.remove("sel","ok","bad"));f.className="fb";f.innerHTML=""};
 }else{
  const p=$("p","q",`<b>${i+1}.</b>`),n=$("input");n.autocomplete="off";n.placeholder="Напиши предложение…";
  box.append(p,$("div","",it.q),n,f);const A=acc(it.a);
  chk=()=>{if(!n.value.trim()){fb(box,"tip","✍️ Напиши ответ");return null}const r=A.includes(norm(n.value));n.className=r?"ok":"bad";fb(box,r?"ok":"bad",r?"✅ Верно! "+it.e:"❌ Пока не то. Подумай ещё или нажми «Ответы».");return r};
  show=()=>{n.value=shown(it.a);n.className="ok";fb(box,"tip","💡 "+it.e)};
  rs=()=>{n.value="";n.className="";f.className="fb";f.innerHTML=""};
 }
 return{box,chk,show,rs}}
const root=document.getElementById("ex");
function btns(c,n,L){
 const bar=$("div","bar"),res=$("span","res"),b1=$("button","b1","Проверить"),b2=$("button","b2","Ответы"),b3=$("button","b3","Сбросить");
 bar.append(b1,b2,b3,res);c.append(bar);max[n]=L.length;
 b1.onclick=()=>{let ok=0;L.forEach(l=>{if(l.chk()===true)ok++});score[n]=ok;res.textContent=`${ok} / ${L.length}`+(ok==L.length?" 🎉":"");upd()};
 b2.onclick=()=>L.forEach(l=>l.show());
 b3.onclick=()=>{L.forEach(l=>l.rs());score[n]=0;res.textContent="";upd()}}
EX.forEach((x,n)=>{const c=$("section","card");
 c.innerHTML=`<h2><span class="num">${n+1}</span>${x.ic} ${x.t}<span class="tag">${x.tag}</span></h2><p class="hint">${x.h}</p>`;
 const L=x.items.map((it,i)=>mk(x,it,i));L.forEach(l=>c.append(l.box));btns(c,n,L);root.append(c)});
// Production
(()=>{const n=2,c=$("section","card");
 c.innerHTML=`<h2><span class="num">3</span>🎤 What would you do if…?<span class="tag">Практика</span></h2><p class="hint">Ответь на 5 вопросов о себе полными предложениями в Second Conditional. Каждый ответ нужно начать с if или использовать if-clause внутри. Потом задай эти вопросы партнёру!</p>`;
 const P=[
 ["What would you do if you won a million dollars?","If I won a million dollars, I would buy a small house by the sea."],
 ["Who would you meet if you could travel back in time?","If I could travel back in time, I would meet Leonardo da Vinci."],
 ["What would you do if you were invisible for a day?","If I were invisible for a day, I would go to my favourite café and listen to people’s conversations."],
 ["Where would you live if you could live anywhere?","I would live in Japan if I could live anywhere."],
 ["Your friend can’t sleep at night. Give advice: If I were you…","If I were you, I would turn off my phone an hour before bed."]];
 const ok=s=>{s=s.toLowerCase().replace(/[’]/g,"'");return /\bif\b/.test(s)&&/\b(would|could)\b|'d\b|wouldn't|couldn't/.test(s)&&!/\bwill\b/.test(s)&&!/\bif\s+(i|you|we|they|he|she|it)\s+(would|will)\b/.test(s)&&s.trim().split(/\s+/).length>=6};
 const R=P.map((p,i)=>{const b=$("div","item"),t=$("textarea");t.rows=2;t.placeholder="Your answer…";const f=$("div","fb");b.append($("p","q",`<b>${i+1}.</b> ${p[0]}`),t,f);c.append(b);
  t.oninput=()=>{t.className=t.value.trim()?(ok(t.value)?"ok":"bad"):"";f.className="fb"+(t.value.trim()&&!ok(t.value)?" bad":"");f.textContent=t.value.trim()&&!ok(t.value)?"Проверь: есть ли if + Past Simple и would/could + infinitive? Нужно минимум 6 слов, без will.":"";cnt()};
  return{t,f,p,ok:()=>ok(t.value)}});
 const k=$("p","cnt","Использовано: 0 / 5");c.append(k);
 function cnt(){const m=R.filter(r=>r.ok()).length;k.textContent="Использовано: "+m+" / 5"+(m==5?" 🏆 Отличная речь!":"");score[n]=m;res.textContent=m+" / 5";upd()}
 const bar=$("div","bar"),res=$("span","res"),b2=$("button","b2","Примеры ответов"),b3=$("button","b3","Сбросить");bar.append(b2,b3,res);c.append(bar);max[n]=5;
 b2.onclick=()=>R.forEach(r=>{r.f.className="fb tip";r.f.innerHTML="💡 Пример: <i>"+r.p[1]+"</i>"});
 b3.onclick=()=>{R.forEach(r=>{r.t.value="";r.t.className="";r.f.className="fb";r.f.textContent=""});cnt()};
 c.append($("p","hint","Счётчик засчитывает ответ, если в нём есть if и would/could, нет will и не меньше 6 слов. Преподаватель или партнёр оценит смысл и грамматику сам."));
 root.append(c)})();
upd();
</script></body></html>
