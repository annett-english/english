<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><title>Scams — повторение</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f5f6fa;--c:#fff;--t:#1d2433;--m:#667085;--p:#4f46e5;--b:#dde1ea;--ok:#16a34a;--no:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141c;--c:#1c1f2b;--t:#e8eaf2;--m:#98a2b3;--b:#323648}}
:root[data-theme="dark"]{--bg:#12141c;--c:#1c1f2b;--t:#e8eaf2;--m:#98a2b3;--b:#323648}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--t);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:820px;margin:auto;padding:12px}
h1{margin:.3em 0}h2{margin:0 0 4px;font-size:1.15rem}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:14px;margin-bottom:14px}
.inst,.m{color:var(--m);font-size:.92rem}.inst{margin:2px 0 8px}
ol{padding-left:22px}li{margin:9px 0}
input,select{font:inherit;color:var(--t);background:var(--bg);border:1.5px solid var(--b);border-radius:8px;padding:4px 8px;max-width:100%}
input.wide{display:block;width:100%;box-sizing:border-box;margin-top:4px}
.ok{border-color:var(--ok)!important}.no{border-color:var(--no)!important}
.fb{margin-left:6px;font-size:.9rem;color:var(--m)}
button{font:inherit;cursor:pointer;border:1px solid var(--b);background:var(--c);color:var(--t);border-radius:8px;padding:5px 11px}
button.p{background:var(--p);border-color:var(--p);color:#fff}
.sp{padding:1px 6px;margin-left:6px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}.sc{font-weight:600}
#pw{margin:6px 0 0;padding:0;list-style:none;display:flex;gap:8px;flex-wrap:wrap}#pw li{margin:0;border:1px solid var(--b);border-radius:20px;padding:2px 10px;font-size:.9rem}
</style></head><body><div class="wrap">
<h1>🔁 Повторение: scams &amp; suspicious activity</h1>
<div class="card"><h2>⚠️ Проблемные слова</h2><ul id="pw"></ul><div class="bar"><button id="cl">Очистить</button><button class="p" id="cp">📋 Копировать все ответы</button><span class="m" id="msg"></span></div></div>
<div id="ex"></div>
<div class="card"><div class="bar"><button class="p" id="cp2">📋 Копировать все ответы</button><button id="ta">🔊 Проверить звук</button><span class="m" id="au"></span></div></div>
</div>
<script>
const $=(s,e=document)=>e.querySelector(s),h=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.innerHTML=x;return e};
const norm=s=>s.toLowerCase().replace(/[’]/g,"'").replace(/[.,!?]/g,'').replace(/\s+/g,' ').trim();
const shuf=a=>{a=[...a];for(let i=a.length;i>1;){const j=Math.random()*i--|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let V=null;const TS=window.speechSynthesis;
function pick(){if(!TS)return;const v=TS.getVoices();V=v.find(x=>/Google US English/i.test(x.name))||v.find(x=>/Samantha/i.test(x.name))||v.find(x=>x.lang==='en-US')||v.find(x=>/^en/.test(x.lang))||null}
if(TS){pick();TS.onvoiceschanged=pick}
function say(t){if(!TS)return;try{TS.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.9;if(V)u.voice=V;TS.speak(u)}catch(e){}}
$('#ta').onclick=()=>{say("Don't fall for online scams. Report suspicious activity.");$('#au').textContent=TS?'Голос: '+(V?V.name:'системный')+' — если слышите речь, всё работает ✅':'❌ Браузер не поддерживает озвучку'};
let P={};try{P=JSON.parse(localStorage.getItem('pw')||'{}')}catch(e){}
function bad(w){if(!w)return;P[w]=(P[w]||0)+1;try{localStorage.setItem('pw',JSON.stringify(P))}catch(e){}rp()}
function rp(){const e=Object.entries(P).sort((a,b)=>b[1]-a[1]);$('#pw').innerHTML=e.length?e.map(([w,n])=>`<li>${w} <b>×${n}</b><button class="sp" data-w="${w}">🔊</button></li>`).join(''):'<li>пока пусто 🎉</li>'}
$('#pw').onclick=e=>{const w=e.target.dataset.w;if(w)say(w)};
$('#cl').onclick=()=>{P={};try{localStorage.removeItem('pw')}catch(e){}rp()};rp();
const ALL=[];
async function cp(){const s='Scams — повторение, мои ответы\n'+ALL.map(f=>f()).join('\n');try{await navigator.clipboard.writeText(s)}catch(e){const t=h('textarea');t.value=s;document.body.append(t);t.select();try{document.execCommand('copy')}catch(_){}t.remove()}$('#msg').textContent='Скопировано ✅';setTimeout(()=>$('#msg').textContent='',2500)}
$('#cp').onclick=$('#cp2').onclick=cp;
function mk(title,inst,items,o={}){
 const card=h('div','card'),ul=h('ol'),bar=h('div','bar'),sc=h('span','sc');let its=[];
 const build=()=>{ul.innerHTML='';sc.textContent='';its=items.map(x=>({...x,ct:0}));
  its.forEach(it=>{const li=h('li'),[a,b='']=it.q.split('___');let c;
   if(it.o){c=h('select');c.innerHTML='<option value="">—</option>'+shuf(it.o).map(x=>`<option>${x}</option>`).join('')}
   else{c=h('input');c.type='text';c.autocomplete='off';c.spellcheck=false;c.placeholder=it.ph||'…';if(o.wide)c.className='wide'}
   it.c=c;it.fb=h('span','fb');it.sp=h('button','sp','🔊');it.sp.style.display='none';it.sp.onclick=()=>say(it.ex||it.a[0]);
   li.append(h('span','',a),c,h('span','',b),it.fb,it.sp);ul.append(li)})};
 const chk=it=>{const v=norm(it.c.value),ok=!!v&&it.a.some(x=>norm(x)==v);it.c.classList.remove('ok','no');it.c.classList.add(ok?'ok':'no');it.fb.textContent=ok?'✓':'✗';it.sp.style.display='';if(!ok&&!it.ct){it.ct=1;bad(it.w)}return ok};
 const bt=(t,f,c)=>{const b=h('button',c,t);b.onclick=f;bar.append(b)};
 bt('Проверить',()=>{sc.textContent=its.filter(chk).length+'/'+its.length},'p');
 bt('Показать ответы',()=>its.forEach(it=>{it.fb.textContent='→ '+(it.ex||it.a[0]);it.sp.style.display=''}));
 bt('Сбросить',build);bar.append(sc);
 card.append(h('h2','',title),h('p','inst',inst),ul,bar);$('#ex').append(card);build();
 ALL.push(()=>`\n== ${title} ==\n`+its.map((it,i)=>`${i+1}. ${it.q} → ${it.c.value||'(пусто)'} ${it.c.classList.contains('ok')?'✓':it.c.classList.contains('no')?'✗':''}  [ключ: ${it.ex||it.a[0]}]`).join('\n'));
}
mk('1. Translate into English','Переведи на английский и напиши руками.',[
 ['подозрительная активность',['suspicious activity']],['заблокировать номер',['block a number','block the number']],['попасться на мошенничество',['fall for a scam']],['запросить оплату',['request payment']],['сообщить о мошенничестве',['report a scam','report the scam']],['небольшая сумма',['a small amount']],['ради собственной выгоды',['for their own gain','for your own gain','for his own gain','for her own gain']],['поддельное предложение о работе',['a fake job offer','fake job offer']]
].map(([q,a])=>({q:q+' → ___',a,w:a[0]})));
mk('2. Choose the correct option','Выбери правильный вариант (порядок вариантов перемешивается).',[
 {q:'The bank ___ suspicious activity on my account.',o:['noticed','fell for','spent'],a:['noticed'],w:'notice suspicious activity'},
 {q:"Don't ___ online scams.",o:['fall for','fell for','falling for'],a:['fall for'],w:'fall for a scam'},
 {q:'She ___ a fake offer yesterday.',o:['fell for','fall for','has fall for'],a:['fell for'],w:'fall – fell – fallen'},
 {q:'I ___ the person who kept messaging me.',o:['blocked','blocking','have block'],a:['blocked'],w:'block someone'},
 {q:'They requested ___ by Friday.',o:['payment','a scam','a trick'],a:['payment'],w:'request payment'},
 {q:'You should ___ it to the police.',o:['report','reporting','reported'],a:['report'],w:'report someone'},
 {q:'They did it ___.',o:['for their own gain','on their own gain','to their own gain'],a:['for their own gain'],w:'for their own gain'},
 {q:'I try to save ___ every month.',o:['a small amount','a small amounts','small amount of'],a:['a small amount'],w:'save a small amount'}]);
mk('3. Correct the mistake','В каждом предложении есть ошибка. Перепиши предложение правильно.',[
 ['He fall for a scam yesterday.','He fell for a scam yesterday.','fall – fell – fallen'],
 ['The bank noticed activity suspicious.','The bank noticed suspicious activity.','suspicious activity'],
 ['I reported to the scam to the bank.','I reported the scam to the bank.','report a scam'],
 ['They lied by their own gain.','They lied for their own gain.','for their own gain'],
 ['She received a job fake offer.','She received a fake job offer.','a fake job offer'],
 ['The scammer requested to me money.','The scammer requested money from me.','request money'],
 ["Don't falling for online scams.","Don't fall for online scams.",'fall for a scam'],
 ['I only spent small amount money.','I only spent a small amount of money.','a small amount']
].map(([q,a,w])=>({q:q+' ✎',a:[a],w,ex:a,ph:'Correct sentence…'})),{wide:1});
</script></body></html>
