<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clothes & Shoes · A2–B1</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f4ef;--card:#fff;--tx:#1f2430;--mu:#6b7280;--br:#ddd8cc;--ac:#2f6fed;--ok:#1b8a4b;--okb:#e2f5ea;--no:#c0392b;--nob:#fbe5e2;--sel:#e6eefc}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171c;--card:#1f232b;--tx:#e8eaef;--mu:#9aa1ad;--br:#343a46;--ac:#6b9bff;--ok:#5fd18d;--okb:#17301f;--no:#ff8a7d;--nob:#3a1d1a;--sel:#26324d}}
:root[data-theme="dark"]{--bg:#15171c;--card:#1f232b;--tx:#e8eaef;--mu:#9aa1ad;--br:#343a46;--ac:#6b9bff;--ok:#5fd18d;--okb:#17301f;--no:#ff8a7d;--nob:#3a1d1a;--sel:#26324d}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px;display:grid;grid-template-columns:1fr 230px;gap:16px}
@media(max-width:820px){.wrap{grid-template-columns:1fr}aside{order:-1;position:static!important}}
h1{margin:0 0 4px;font-size:26px}h2{margin:0 0 6px;font-size:19px}
.card{background:var(--card);border:1px solid var(--br);border-radius:14px;padding:16px;margin-bottom:16px}
.mu{color:var(--mu);font-size:14px}
button{font:inherit;cursor:pointer;border:1px solid var(--br);background:var(--card);color:var(--tx);border-radius:10px;padding:7px 12px}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}button:hover{filter:brightness(.96)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
select,input,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--br);border-radius:10px;padding:7px 10px;max-width:100%}
input[type=text],.it input{width:min(100%,380px)}textarea{width:100%;resize:vertical}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-bottom:12px}
.w{display:flex;align-items:center;gap:8px;border:1px solid var(--br);border-radius:10px;padding:6px 8px}
.w div{flex:1;line-height:1.25}.w b{display:block}.ipa{color:var(--mu);font-size:13px}
.ab{padding:3px 8px;border-radius:8px}
.it{padding:10px 0;border-top:1px solid var(--br)}.q{margin-bottom:6px}
.opts{display:flex;flex-wrap:wrap;gap:6px}.opt.sel{background:var(--sel);border-color:var(--ac)}
.opt.right{background:var(--okb);border-color:var(--ok)}.opt.wrong{background:var(--nob);border-color:var(--no)}
.it.ok input,.it.ok textarea{border-color:var(--ok);background:var(--okb)}.it.bad input,.it.bad textarea{border-color:var(--no);background:var(--nob)}
.fb{font-size:14px;margin-top:4px;min-height:0}.fb.o{color:var(--ok)}.fb.b{color:var(--no)}
.chip{display:inline-block;border:1px solid var(--br);border-radius:99px;padding:2px 10px;margin:2px;font-size:14px}.chip.on{background:var(--okb);border-color:var(--ok);color:var(--ok)}
aside{position:sticky;top:12px;align-self:start;max-height:90vh;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:14px}td{padding:4px 2px;border-top:1px solid var(--br)}
.sc{font-weight:600;margin-left:auto}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:99px;display:none}
</style></head><body>
<div class="wrap"><main>
<div class="card"><h1>👕 Clothes & Shoes <span class="mu">· A2–B1</span></h1>
<div class="bar"><input type="text" id="nm" placeholder="Имя ученика"> <select id="vs" title="Голос"></select>
<button id="tst">🔊 Проверить звук</button></div><div class="mu" id="vi">Загружаю голоса…</div></div>

<div class="card"><h2>1. Повтори слова</h2>
<div class="mu">🎧 Задание: нажимай на 🔊 и повторяй каждое слово вслух. Затем нажми «Прослушать все».</div>
<div class="bar"><button class="p" id="all">▶ Прослушать все</button><button id="stp">■ Стоп</button></div><div id="vocab"></div></div>

<div id="exs"></div>

<div class="card"><h2>🏁 Что я теперь знаю</h2>
<label><input type="checkbox" class="sa"> Я могу назвать одежду и обувь по-английски</label><br>
<label><input type="checkbox" class="sa"> Я знаю wear – wore – worn и могу использовать их в предложениях</label><br>
<label><input type="checkbox" class="sa"> Я могу описать, что ношу в разную погоду</label>
<div class="bar"><button class="p" id="cp">📋 Копировать все мои ответы</button></div>
<div class="mu">Вставь скопированный текст в чат или письмо учителю.</div></div>
</main>
<aside class="card"><h2>⚠️ Проблемные слова</h2><div id="pw" class="mu">Пока пусто. Ошибки появятся здесь.</div></aside></div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s),sh=a=>{a=[...a];for(let i=a.length;i>1;){let j=Math.random()*i--|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const G=[["Одежда","leggings|легинсы|ˈleɡɪŋz;jacket|куртка|ˈdʒækɪt;dress|платье|dres;coat|пальто|kəʊt;cardigan|кардиган|ˈkɑːdɪɡən;blouse|блузка|blaʊz;jeans|джинсы|dʒiːnz;T-shirt|футболка|ˈtiː ʃɜːt;shorts|шорты|ʃɔːts;skirt|юбка|skɜːt;trousers|брюки|ˈtraʊzəz;tracksuit|спортивный костюм|ˈtræksuːt;socks|носки|sɒks;suit|костюм|suːt;sweater / jumper|свитер|ˈswetə / ˈdʒʌmpə;underwear|нижнее бельё|ˈʌndəweə;tights|колготки|taɪts;top|топ, майка|tɒp;shirt|рубашка|ʃɜːt;pyjamas|пижама|pəˈdʒɑːməz"],
["Аксессуары","hat|шляпа|hæt;scarf|шарф|skɑːf;belt|ремень|belt;cap|кепка|kæp;gloves|перчатки|ɡlʌvz;tie|галстук|taɪ"],
["Обувь","sneakers|кроссовки|ˈsniːkəz;slippers|тапочки|ˈslɪpəz;heels|туфли на каблуках|hiːlz;boots|ботинки, сапоги|buːts;sandals|сандалии|ˈsændlz;flip-flops|вьетнамки|ˈflɪp flɒps;rubber boots|резиновые сапоги|ˌrʌbə ˈbuːts"],
["Глагол","wear – wore – worn|носить|weə – wɔː – wɔːn"]];
const P=r=>r.split(";").map(x=>{x=x.split("|");return{en:x[0],ru:x[1],ipa:x[2],say:x[0].split(" / ")[0]}});
const W=[...P(G[0][1]),...P(G[1][1]),...P(G[2][1])];
const nW=s=>s.toLowerCase().replace(/[^a-z]/g,""),nS=s=>s.toLowerCase().replace(/[’']/g,"").replace(/[^a-z ]/g," ").replace(/\s+/g," ").trim();
const lev=(a,b)=>{let p=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let c=[i];for(let j=1;j<=b.length;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]==b[j-1]?0:1));p=c}return p[b.length]};
/* ---- audio ---- */
const syn=window.speechSynthesis;let V=[];
function auto(){return V.find(v=>/Google US English/i.test(v.name))||V.find(v=>/Samantha/i.test(v.name))||V.find(v=>v.lang.replace("_","-")=="en-US")||V[0]}
function cur(){const n=$("#vs").value;return V.find(v=>v.name==n)||auto()}
function loadV(){if(!syn)return;V=syn.getVoices().filter(v=>/^en/i.test(v.lang));const s=$("#vs"),old=s.value;
s.innerHTML=`<option value="">Авто: Google US English / Samantha</option>`+V.map(v=>`<option>${v.name}</option>`).join("");s.value=old;info()}
function info(){const v=cur();$("#vi").textContent=!syn?"⚠️ Озвучка не поддерживается в этом браузере. Открой в Chrome или Safari.":v?"Голос: "+v.name+" ("+v.lang+")":"Голоса загружаются… нажми «Проверить звук»."}
function say(t,q){if(!syn)return;const u=new SpeechSynthesisUtterance(t);const v=cur();if(v)u.voice=v;u.lang="en-US";u.rate=.85;syn.speak(u)}
function speak(t){if(!syn)return;syn.cancel();say(t)}
if(syn){loadV();syn.onvoiceschanged=loadV}else info();
$("#vs").onchange=info;$("#tst").onclick=()=>{speak("Hello! The audio works. Jacket, coat, scarf.");info()};
$("#all").onclick=()=>{if(!syn)return;syn.cancel();W.forEach(w=>say(w.say));say("wear, wore, worn")};$("#stp").onclick=()=>syn&&syn.cancel();
/* ---- vocab ---- */
$("#vocab").innerHTML=G.map(([t,r])=>`<h2 style="font-size:16px">${t}</h2><div class="g">`+P(r).map(w=>`<div class="w"><button class="ab" data-s="${w.say}">🔊</button><div><b>${w.en}</b><span class="ipa">/${w.ipa}/</span> · ${w.ru}</div></div>`).join("")+`</div>`).join("");
/* ---- problem words ---- */
const PR={};function prob(w){if(!w)return;PR[w]=(PR[w]||0)+1;$("#pw").className="";$("#pw").innerHTML="<table>"+Object.entries(PR).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`<tr><td><button class="ab" data-s="${k}">🔊</button></td><td>${k}</td><td>×${n}</td></tr>`).join("")+"</table>"}
/* ---- exercise data ---- */
let last=-1;const mc=(w,a,d,x)=>{let o=sh([a,...d]);if(o.indexOf(a)==last){const j=(last+1)%o.length,i=o.indexOf(a);[o[i],o[j]]=[o[j],o[i]]}last=o.indexOf(a);return{t:"mc",w,a,o,...x}};
const rows=a=>a.map(s=>s.split("|"));
const EX=[
{n:"2. Listen & pick",d:"Послушай слово и выбери его значение.",gen:()=>sh(W).slice(0,10).map(x=>mc(x.say,x.ru,sh(W.filter(y=>y.ru!=x.ru)).slice(0,3).map(y=>y.ru),{q:"Что ты услышал?",say:x.say}))},
{n:"3. Which word fits?",d:"Выбери слово, которое подходит по смыслу (обрати внимание на wear – wore – worn).",gen:()=>sh(rows(["It’s snowing. Put on your warm ___ and gloves.|scarf|shorts,sandals,flip-flops","I need a ___ to hold my trousers up.|belt|tie,cap,scarf","She ___ a beautiful dress to the party yesterday.|wore|wear,worn,wears","He has never ___ a suit before.|worn|wore,wear,wearing","It’s raining. Wear your ___.|rubber boots|sandals,shorts,tights","At the beach I usually wear ___.|flip-flops|boots,gloves,heels","Men often wear a ___ with a shirt at work.|tie|slippers,leggings,blouse","It’s freezing! Where are my ___?|gloves|shorts,sandals,flip-flops","I always wear ___ in bed.|pyjamas|a suit,heels,jeans","My feet are cold. I’ll put on warm ___.|socks|sandals,shorts,a blouse"])).map(r=>mc(r[1],r[1],r[2].split(","),{q:r[0]}))},
{n:"4. Odd one out",d:"Найди лишнее слово — по значению, не по форме.",gen:()=>sh(rows(["boots,sandals,slippers|scarf","skirt,trousers,shorts|blouse","jacket,coat,cardigan|flip-flops","tie,suit,shirt|tracksuit","gloves,scarf,hat|shorts","socks,tights,leggings|tie","sandals,flip-flops,shorts|gloves","heels,sneakers,rubber boots|cap"])).map(r=>mc(r[1],r[1],r[0].split(","),{q:"Which word is the odd one out?"}))},
{n:"5. Listen & write",d:"Послушай и впиши слово по-английски.",gen:()=>sh(W).slice(0,10).map(x=>({t:"x",w:x.say,a:x.en,acc:x.en.split(" / ").map(nW),q:"Напиши услышанное слово",say:x.say}))},
{n:"6. Read the transcription",d:"Прочитай транскрипцию и напиши слово.",gen:()=>sh(W).slice(0,8).map(x=>({t:"x",w:x.say,a:x.en,acc:x.en.split(" / ").map(nW),q:"Какое это слово?",ipa:x.ipa}))},
{n:"7. Translate into English",d:"Переведи предложения. Небольшие опечатки (1–2 буквы) принимаются.",gen:()=>sh(["На ней было красное платье.#wore#She wore a red dress.#She was wearing a red dress.","Надень пальто, на улице холодно.#coat#Put on your coat, it’s cold outside.#Wear your coat, it’s cold outside.#Put on your coat, it is cold outside.","Он никогда не носил галстук.#worn#He has never worn a tie.","Я купил новые кроссовки.#sneakers#I bought new sneakers.#I bought a new pair of sneakers.#I’ve bought new sneakers.","Летом я ношу шорты и сандалии.#shorts#In summer I wear shorts and sandals.#I wear shorts and sandals in summer.#In the summer I wear shorts and sandals.","Эта юбка слишком короткая.#skirt#This skirt is too short.","Где мои носки?#socks#Where are my socks?","Мой брат носит костюм на работу.#suit#My brother wears a suit to work.#My brother wears a suit at work.","Вчера он надел кепку и куртку.#jacket#Yesterday he wore a cap and a jacket.#Yesterday he put on a cap and a jacket."]).map(s=>{s=s.split("#");return{t:"x",s:1,w:s[1],a:s[2],acc:s.slice(2).map(nS),q:s[0]}})},
{n:"8. Write your own",d:"Закончи предложения своими идеями и напиши мини-рассказ. Это свободное задание: проверяется, что ответ написан.",gen:()=>[...rows(["Today I’m wearing|jeans and a warm sweater.","Yesterday I wore|a black jacket and sneakers.","I have never worn|a tie.","In winter I always wear|a scarf, gloves and boots.","My favourite clothes are|jeans and a T-shirt.","I can’t wear heels because|they are uncomfortable.","When it’s raining, you should wear|rubber boots and a coat.","Never wear flip-flops to|a business meeting."]).map(r=>({t:"f",pre:r[0],a:r[0]+" "+r[1],q:"<b>"+r[0]+"</b>"})),{t:"s",q:"<b>Story with 5 words:</b> напиши 2–3 предложения и используй минимум 5 слов из списка.",chips:sh(W).slice(0,6).map(x=>x.say),a:"Example: Yesterday it was cold, so I wore a coat, a scarf, gloves, boots and a hat."}]}];
/* ---- render ---- */
const used=(it,v)=>it.chips.filter(c=>new RegExp("\\b"+c.toLowerCase()+"s?\\b").test(v.toLowerCase()));
const val=it=>it.t=="mc"?(it.d.querySelector(".opt.sel")||{}).textContent||"":it.d.querySelector("input,textarea").value.trim();
function draw(e){const b=$("#b"+e.i);e.items=e.gen();b.innerHTML="";$("#s"+e.i).textContent="";
e.items.forEach((it,k)=>{const d=it.d=document.createElement("div");d.className="it";
let h=`<div class="q"><b>${k+1}.</b> ${it.q||""}${it.ipa?` <span class="ipa">/${it.ipa}/</span>`:""}${it.say?` <button class="ab" data-s="${it.say}">🔊</button>`:""}</div>`;
if(it.t=="mc")h+=`<div class="opts">${it.o.map(o=>`<button class="opt">${o}</button>`).join("")}</div>`;
else if(it.t=="x")h+=`<input type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${it.s?"напиши по-английски":"…"}">`;
else if(it.t=="f")h+=`<textarea rows="1" placeholder="продолжи…"></textarea>`;
else h+=`<div>${it.chips.map(c=>`<span class="chip">${c}</span>`).join("")} <span class="mu cnt">0/5</span></div><textarea rows="4" placeholder="Write your story…"></textarea>`;
d.innerHTML=h+`<div class="fb"></div>`;b.appendChild(d);
if(it.t=="s")d.querySelector("textarea").oninput=ev=>{const u=used(it,ev.target.value);d.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",u.includes(c.textContent)));d.querySelector(".cnt").textContent=u.length+"/5"}})}
function check(e){let n=0;e.items.forEach(it=>{const v=val(it);let ok,fb="";
if(it.t=="mc")ok=v==it.a;else if(it.t=="x"){if(it.s){const s=nS(v),m=Math.min(...it.acc.map(c=>lev(s,c)));ok=s&&m<=2;if(ok&&m)fb="✔ почти идеально, проверь: "+it.a}else ok=it.acc.includes(nW(v))}
else if(it.t=="f")ok=v.split(/\s+/).filter(Boolean).length>=2;else ok=used(it,v).length>=5;
it.ok=!!ok;n+=ok?1:0;it.d.classList.toggle("ok",!!ok);it.d.classList.toggle("bad",!ok);
if(it.t=="mc")it.d.querySelectorAll(".opt").forEach(o=>{o.classList.remove("wrong","right");if(o.classList.contains("sel"))o.classList.add(ok?"right":"wrong")});
const f=it.d.querySelector(".fb");f.className="fb "+(ok?"o":"b");f.textContent=fb||(ok?"✔ Верно":it.t=="f"||it.t=="s"?"Дополни ответ":"✘ Попробуй ещё раз");
if(!ok&&!it.wr&&it.w)prob(it.w);it.wr=!ok})
$("#s"+e.i).textContent=n+" / "+e.items.length}
function show(e){e.items.forEach(it=>{const f=it.d.querySelector(".fb");f.className="fb o";f.textContent="→ "+it.a;if(it.t=="mc")it.d.querySelectorAll(".opt").forEach(o=>o.classList.toggle("right",o.textContent==it.a))})}
EX.forEach((e,i)=>{e.i=i;$("#exs").insertAdjacentHTML("beforeend",`<div class="card"><h2>${e.n}</h2><div class="mu">${e.d}</div><div id="b${i}"></div>
<div class="bar"><button class="p" data-a="c" data-i="${i}">Проверить</button><button data-a="s" data-i="${i}">Показать ответы</button><button data-a="r" data-i="${i}">↻ Заново (перемешать)</button><span class="sc" id="s${i}"></span></div></div>`);draw(e)});
/* ---- events ---- */
document.addEventListener("click",ev=>{const t=ev.target;if(t.dataset.s)return speak(t.dataset.s);
if(t.classList.contains("opt")){t.parentNode.querySelectorAll(".opt").forEach(o=>o.classList.remove("sel","wrong","right"));t.classList.add("sel")}
if(t.dataset.a){const e=EX[t.dataset.i];({c:check,s:show,r:draw})[t.dataset.a](e)}});
function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";setTimeout(()=>t.style.display="none",2200)}
$("#cp").onclick=async()=>{let s="Clothes & Shoes — ответы ученика: "+($("#nm").value||"(без имени)")+"\n";
EX.forEach(e=>{s+="\n"+e.n+"\n";e.items.forEach((it,k)=>{const v=val(it),m=it.ok===true?" ✓":it.ok===false?" ✗":"";
const q=it.say?"[audio]"+(it.ipa?"":""):it.ipa?"/"+it.ipa+"/":it.t=="f"?it.pre:it.t=="s"?"Story ["+it.chips.join(", ")+"]":it.q;
s+=(k+1)+". "+q+" → "+(it.t=="f"?it.pre+" ":"")+(v||"—")+m+(it.ok===false&&it.t!="f"&&it.t!="s"?"  (правильно: "+it.a+")":"")+"\n"})});
s+="\nЧто я знаю: "+[...document.querySelectorAll(".sa")].map(c=>(c.checked?"✔ ":"✘ ")+c.parentNode.textContent.trim()).join(" | ");
const w=Object.keys(PR);if(w.length)s+="\nПроблемные слова: "+w.join(", ");
try{await navigator.clipboard.writeText(s);toast("Скопировано ✔")}catch(_){const a=document.createElement("textarea");a.value=s;document.body.appendChild(a);a.select();try{document.execCommand("copy");toast("Скопировано ✔")}catch(_){toast("Не удалось скопировать")}a.remove()}};
</script></body></html>
