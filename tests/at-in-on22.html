<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>At, in, on: предлоги времени (A2)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f5f8;--card:#fff;--ink:#1b2733;--mut:#566676;--line:#d8e0e7;--at:#b36a00;--atb:#fff0d2;--in:#0b7a75;--inb:#d7f1ee;--on:#6a3fc4;--onb:#ebe3fb;--ok:#177a3c;--okb:#dcf3e3;--bad:#b3261e;--badb:#fbe3e1;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12181f;--card:#1a222b;--ink:#e8edf2;--mut:#9aa9b8;--line:#2b3744;--at:#f0a63a;--atb:#3a2d12;--in:#4cc9c0;--inb:#11302e;--on:#b79af0;--onb:#2a2145;--ok:#62d38a;--okb:#14301e;--bad:#ff8a80;--badb:#3b1a18;color-scheme:dark}}
:root[data-theme=dark]{--bg:#12181f;--card:#1a222b;--ink:#e8edf2;--mut:#9aa9b8;--line:#2b3744;--at:#f0a63a;--atb:#3a2d12;--in:#4cc9c0;--inb:#11302e;--on:#b79af0;--onb:#2a2145;--ok:#62d38a;--okb:#14301e;--bad:#ff8a80;--badb:#3b1a18;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Onest,system-ui,-apple-system,"Segoe UI",sans-serif}
header,main{max-width:860px;margin:0 auto;padding:0 16px}
header{padding-top:26px}
h1{font-size:clamp(26px,5vw,38px);line-height:1.1;margin:0 0 6px;letter-spacing:-.02em;font-weight:800}
h1 span{padding:0 .12em;border-radius:6px}
.a{background:var(--atb);color:var(--at)}.i{background:var(--inb);color:var(--in)}.o{background:var(--onb);color:var(--on)}
header p{margin:0;color:var(--mut)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:14px 16px;max-width:860px;margin:0 auto}
.tab{flex:none;font:inherit;font-size:14px;padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);cursor:pointer}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:24px;counter-reset:q}
h2{margin:0 0 4px;font-size:21px}.ins{margin:0 0 12px;color:var(--mut)}
.q{padding:10px 10px;border-top:1px solid var(--line);border-left:4px solid transparent;counter-increment:q}
.q.ok{border-left-color:var(--ok);background:var(--okb)}.q.bad{border-left-color:var(--bad);background:var(--badb)}.q.shown{border-left-color:var(--in);background:var(--inb)}
.s{margin:0 0 6px;font-weight:500}.s::before{content:counter(q) ". ";color:var(--mut);font-weight:700}
.gap{display:inline-block;min-width:2.5em;border-bottom:2px solid var(--ink);text-align:center}
.exp{font-size:14px;color:var(--ink);margin:6px 0 0;opacity:.85}
.opt{display:block;width:100%;text-align:left;font:inherit;font-size:15px;padding:8px 10px;margin:4px 0;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);cursor:pointer}
.opt.on{border:2px solid var(--ink);padding:7px 9px}.opt.good{background:var(--okb);border-color:var(--ok)}.opt.bad2{background:var(--badb);border-color:var(--bad)}.opt:disabled{cursor:default}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
input{width:100%;max-width:420px}.s input{width:11em;margin:0 4px}
textarea{width:100%;min-height:150px;resize:vertical}
.w{font:inherit;background:none;border:0;border-bottom:2px dashed transparent;color:var(--ink);padding:2px 3px;margin:0 1px;cursor:pointer;border-radius:4px}
.w:hover{background:var(--line)}.w.on{background:var(--badb);border-bottom-color:var(--bad)}
.lab{font-size:14px;color:var(--mut);margin-right:6px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
.btn{font:inherit;font-weight:700;padding:9px 16px;border-radius:9px;border:0;background:var(--ink);color:var(--bg);cursor:pointer}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line);font-weight:500}.btn:disabled{opacity:.4}
.res{font-weight:700}
.zones{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
.zone{min-height:150px;border-radius:10px;padding:8px;display:flex;flex-wrap:content;flex-wrap:wrap;gap:6px;align-content:flex-start}
.zone[data-p=at]{background:var(--atb)}.zone[data-p=in]{background:var(--inb)}.zone[data-p=on]{background:var(--onb)}
.zone[data-p=""]{background:var(--bg);border:1px dashed var(--line);min-height:70px;grid-column:1/-1}
.zh{font-weight:800;margin:0}.zh+.zone{margin-top:4px}
.chip{display:inline-block;padding:4px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);cursor:grab;font-size:14px;user-select:none}
.chip.sel{outline:2px solid var(--ink)}.chip.ok{border-color:var(--ok);background:var(--okb)}.chip.bad{border-color:var(--bad);background:var(--badb)}.chip.shown{border-color:var(--in)}
.chip small{display:block;color:var(--mut);font-size:12px}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.rl{border-radius:12px;padding:14px}.rl h3{margin:0 0 6px;font-size:26px}.rl ul{margin:0;padding-left:18px}.rl li{margin:3px 0}
.rl.a{background:var(--atb)}.rl.i{background:var(--inb)}.rl.o{background:var(--onb)}
.chk{list-style:none;padding:0;margin:10px 0}.chk li{padding:4px 0;color:var(--mut)}.chk li.y{color:var(--ok);font-weight:700}.chk li::before{content:"○ "}.chk li.y::before{content:"✔ "}
.cnt{font-weight:700}
.mil{display:grid;grid-template-columns:1fr 130px;gap:16px}
.ladder{list-style:none;margin:0;padding:0;display:flex;flex-direction:column-reverse;font-size:13px;font-variant-numeric:tabular-nums}
.ladder li{padding:3px 8px;border-radius:6px;color:var(--mut)}.ladder li.done{color:var(--ok)}.ladder li.cur{background:var(--ink);color:var(--bg);font-weight:700}
.s2{font-size:19px;font-weight:700;margin:4px 0 10px}.mq{margin:0;color:var(--mut);font-size:14px}
details{margin-top:14px}summary{cursor:pointer;font-weight:700}
@media(max-width:620px){.zones{grid-template-columns:1fr}.mil{grid-template-columns:1fr}.ladder{flex-direction:row;flex-wrap:wrap;gap:3px}}
</style></head><body>
<header><h1>Предлоги времени: <span class="a">at</span> <span class="i">in</span> <span class="o">on</span></h1><p>Уровень A2 · 7 упражнений с проверкой, ответами и объяснениями</p></header>
<nav class="tabs" id="tabs"></nav>
<main id="main"></main>
<script>
const $=(s,r=document)=>r.querySelector(s);
const h=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.innerHTML=x;return e};
const norm=s=>s.toLowerCase().replace(/[’‘`]/g,"'").replace(/[^a-z0-9' ]/g,' ').replace(/'/g,'').replace(/\boclock\b/g,'').replace(/\s+/g,' ').trim();
const shuf=a=>[...a].sort(()=>Math.random()-.5);
const mark=(i,c)=>{i.box.classList.remove('ok','bad','shown');i.box.classList.add(c);i.exp.hidden=false};
function ex(title,ins,build){
 const sec=h('section','card');sec.append(h('h2',0,title),h('p','ins',ins));
 const body=h('div'),bar=h('div','bar'),res=h('span','res');let items=[];
 const run=()=>{body.innerHTML='';items=build(body);res.textContent=''};
 const b=(t,f,c)=>{const x=h('button','btn '+(c||''),t);x.onclick=f;return x};
 bar.append(b('Проверить',()=>{let n=0;items.forEach(i=>{const k=i.ok();n+=k;mark(i,k?'ok':'bad')});res.textContent='Результат: '+n+' из '+items.length}),
  b('Показать ответы',()=>{items.forEach(i=>{i.ans();mark(i,'shown')});res.textContent=''},'ghost'),b('Заново',run,'ghost'),res);
 sec.append(body,bar);run();return sec}
const pick=(bs,i)=>bs.forEach((x,j)=>x.classList.toggle('on',j==i));

/* Правило */
const rule=h('section','card');rule.innerHTML=`<h2>Правило</h2><p class="ins">Три предлога — три «размера» времени.</p><div class="rules">
<div class="rl a"><h3>at</h3><ul><li>точное время: at 6 o’clock, at midnight, at lunchtime</li><li>at night</li><li>at the weekend (брит.)</li><li>праздничный период: at Christmas, at Easter</li></ul></div>
<div class="rl i"><h3>in</h3><ul><li>части дня: in the morning / afternoon / evening</li><li>сезоны: in summer, in winter</li><li>годы: in 2020, десятилетия: in the 1990s</li><li>века: in the 5th century</li></ul></div>
<div class="rl o"><h3>on</h3><ul><li>дни недели: on Monday, on Tuesday</li><li>даты: on 1st March, on 25th December</li><li>праздничные дни: on New Year’s Day, on Valentine’s Day, on Halloween</li><li>день + часть дня: on Friday evening</li></ul></div></div>
<p class="ins" style="margin-top:14px">Запомни: in the morning, но at night. Если есть слово day, а также дата или день недели — используй on.</p>`;

/* 1 */
const O1=['at — точное время, night, weekend, Christmas / Easter','in — части дня, сезоны, месяцы, годы, века','on — дни недели и даты'];
const R=[['My lesson is ___ Tuesday.',2,'День недели → on Tuesday.'],['We swim in the sea ___ summer.',1,'Сезон → in summer.'],['The film starts ___ 6 o’clock.',0,'Точное время на часах → at 6 o’clock.'],['I was born ___ 1st March.',2,'Конкретная дата → on 1st March.'],['She doesn’t sleep ___ night.',0,'Night — исключение: at night (но in the morning / afternoon / evening).'],['We visit Grandma ___ Christmas.',0,'Праздничный период → at Christmas, at Easter.'],['I go out ___ Friday evening.',2,'День недели + часть дня → on Friday evening.'],['My dad works ___ the afternoon.',1,'Часть дня → in the afternoon.'],['Cinema was very popular ___ the 1990s.',1,'Десятилетие → in the 1990s.'],['We have a break ___ lunchtime.',0,'Lunchtime — момент в течение дня → at lunchtime.']];
const e1=ex('1. Выбери верное объяснение','Вставь мысленно предлог и выбери правило, которое подходит.',b=>R.map(([s,c,e])=>{
 let sel=-1;const box=h('div','q');box.append(h('p','s',s.replace('___','<b class="gap">&nbsp;</b>')));
 const bs=O1.map((t,i)=>{const x=h('button','opt',t);x.onclick=()=>{sel=i;pick(bs,i)};return x});
 const exp=h('p','exp','<b>'+['at','in','on'][c]+'.</b> '+e);exp.hidden=true;box.append(...bs,exp);b.append(box);
 return{box,exp,ok:()=>sel==c,ans:()=>{sel=c;pick(bs,c)}}}));

/* 2 */
const C='summer|in|сезон;my birthday|on|конкретный день;winter|in|сезон;6 o’clock|at|точное время;2020|in|год;the evening|in|часть дня;New Year’s Day|on|конкретный праздничный день;2018|in|год;midnight|at|точное время;25th December|on|дата;night|at|исключение: at night;the weekend|at|брит. (в США on the weekend);Easter|at|праздничный период;Christmas|at|праздничный период;the morning|in|часть дня;Friday evening|on|день + часть дня;Tuesday|on|день недели;the 1990s|in|десятилетие;Monday|on|день недели;lunchtime|at|момент времени;the afternoon|in|часть дня;1st March|on|дата;Valentine’s Day|on|конкретный день;New Year’s Eve|on|конкретный день;the 5th century|in|век;Halloween|on|конкретный день';
const e2=ex('2. Таблица: at, in или on','Перетащи выражение в нужный столбец (на телефоне: нажми выражение, затем столбец).',b=>{
 let cur=null;const sel=c=>{document.querySelectorAll('.chip.sel').forEach(x=>x.classList.remove('sel'));cur=c;if(c)c.classList.add('sel')};
 const zs={};const grid=h('div','zones');
 ['at','in','on',''].forEach(p=>{const w=h('div');if(p)w.append(h('p','zh',p));const z=h('div','zone');z.dataset.p=p;zs[p]=z;
  z.ondragover=e=>e.preventDefault();z.ondrop=e=>{e.preventDefault();if(cur)z.append(cur);sel(null)};
  z.onclick=e=>{if(cur&&!e.target.closest('.chip')){z.append(cur);sel(null)}};w.append(z);grid.append(w)});
 grid.lastChild.style.gridColumn='1/-1';b.append(grid);
 return shuf(C.split(';')).map(r=>{const[t,p,why]=r.split('|');const c=h('span','chip',t);c.draggable=true;
  c.ondragstart=()=>sel(c);c.onclick=e=>{e.stopPropagation();sel(cur===c?null:c)};
  const exp=h('small',0,'→ '+p+' ('+why+')');exp.hidden=true;c.append(exp);zs[''].append(c);
  return{box:c,exp,ok:()=>c.parentElement.dataset.p==p,ans:()=>zs[p].append(c)}})});

/* 3 */
const G=[['Anna ___ (get up) at 6 o’clock every day.','gets up','Present Simple: she → get<b>s</b> up. At + точное время.'],['We ___ (go) to the beach in summer.','go','Привычка → Present Simple; we → go без -s. In + сезон.'],['My little sister ___ (be) born in 2018.','was','Прошедшее время: was born (родилась). In + год.'],['He ___ (not / work) on Sunday.','doesn’t work|does not work','Отрицание: he → doesn’t + глагол без -s. On + день недели.'],['My parents ___ (visit) us at Christmas.','visit','Parents — множественное число → visit без -s. At Christmas.'],['Last year we ___ (see) fireworks on New Year’s Eve.','saw','Last year → Past Simple; see → saw (неправильный глагол). On + день.'],['The café ___ (not / open) on Monday.','doesn’t open|does not open','The café = it → doesn’t open. On Monday.'],['She ___ (have) a big party on her birthday.','has','She → has (особая форма have). On her birthday.'],['The baby ___ (sleep) a lot at night.','sleeps','The baby = he / she → sleeps (-s). At night.'],['In the 1990s people ___ (not / have) smartphones.','didn’t have|did not have','Прошлое (the 1990s) → didn’t + have. In + десятилетие.']];
const e3=ex('3. Вставь слово в правильной форме','Поставь глагол в скобках в нужную форму (Present или Past Simple).',b=>G.map(([s,a,e])=>{
 const box=h('div','q'),p=h('p','s'),inp=h('input'),[x,y]=s.split('___'),v=a.split('|');
 p.append(document.createTextNode(x),inp,document.createTextNode(y));
 const exp=h('p','exp','Ответ: <b>'+v.join(' / ')+'</b>. '+e);exp.hidden=true;box.append(p,exp);b.append(box);
 return{box,exp,ok:()=>v.some(z=>norm(z)==norm(inp.value)),ans:()=>inp.value=v[0]}}));

/* 4 */
const M=[['We have English [in] Monday.','on','Дни недели — только on.'],['I always get up [in] 7 o’clock.','at','Точное время → at.'],['She was born [on] 2005.','in','Год → in 2005.'],['They go skiing [at] winter.','in','Сезон → in winter.'],['My birthday is [in] 25th December.','on','Дата → on 25th December.'],['I do my homework [at] the evening.','in','Часть дня → in the evening.'],['We meet [in] Friday evening.','on','День + часть дня → on Friday evening.'],['He never sleeps [in] night.','at','Исключение: at night.'],['Our school closes [on] Easter.','at','Праздничный период → at Easter.'],['The castle was built [on] the 5th century.','in','Век → in the 5th century.']];
const e4=ex('4. Найди ошибку','В каждом предложении один неверный предлог. Нажми на него и выбери правильный.',b=>M.map(([s,c,e])=>{
 const t=s.split(' '),w=t.findIndex(x=>x[0]=='['),wrong=t[w].slice(1,-1);t[w]=wrong;let sel=-1;
 const box=h('div','q'),p=h('p','s');
 const bs=t.map((x,i)=>{const k=h('button','w',x);k.onclick=()=>{sel=i;pick(bs,i)};return k});p.append(...bs);
 const dd=h('select',0,'<option value="">—</option><option>at</option><option>in</option><option>on</option>');
 const exp=h('p','exp','Ошибка: <b>'+wrong+'</b> → <b>'+c+'</b>. '+e);exp.hidden=true;
 box.append(p,h('span','lab','Правильный предлог:'),dd,exp);b.append(box);
 return{box,exp,ok:()=>sel==w&&dd.value==c,ans:()=>{sel=w;pick(bs,w);dd.value=c}}}));

/* 5 */
const T=[['Я встаю в 7 часов.',['I get up at 7 o’clock.'],'At + точное время.'],['Мы ходим в школу в понедельник.',['We go to school on Monday.','We go to school on Mondays.'],'On + день недели (on Mondays — каждый понедельник).'],['Летом я плаваю в море.',['I swim in the sea in summer.','In summer I swim in the sea.'],'In + сезон; обстоятельство времени может стоять в начале или в конце.'],['Мой день рождения 1 марта.',['My birthday is on 1st March.','My birthday is on the 1st of March.','My birthday is on March 1st.'],'On + дата.'],['Мы празднуем Рождество 25 декабря.',['We celebrate Christmas on 25th December.','We celebrate Christmas on the 25th of December.','We celebrate Christmas on December 25th.'],'On + дата.'],['Она не спит ночью.',['She doesn’t sleep at night.','She does not sleep at night.'],'At night — исключение; she → doesn’t + sleep.'],['Я смотрю телевизор вечером.',['I watch TV in the evening.','I watch television in the evening.','In the evening I watch TV.'],'In + часть дня, с артиклем the.'],['Мы встречаемся в пятницу вечером.',['We meet on Friday evening.','On Friday evening we meet.'],'День + часть дня → on Friday evening.'],['Мой папа родился в 2000 году.',['My dad was born in 2000.','My father was born in 2000.'],'In + год; «родился» → was born.'],['На выходных я отдыхаю.',['I relax at the weekend.','At the weekend I relax.','I rest at the weekend.','I relax on the weekend.','On the weekend I relax.','I rest on the weekend.'],'At the weekend (брит.) / on the weekend (амер.).']];
const e5=ex('5. Переведи на английский','Напиши предложение полностью. Регистр и пунктуация не важны.',b=>T.map(([ru,v,e])=>{
 const box=h('div','q'),inp=h('input');inp.placeholder='Напиши по-английски';
 const exp=h('p','exp','Ответ: <b>'+v[0]+'</b>'+(v[1]?'<br>Тоже верно: '+v.slice(1).join(' / '):'')+'<br>'+e);exp.hidden=true;
 box.append(h('p','s',ru),inp,exp);b.append(box);
 return{box,exp,ok:()=>v.some(z=>norm(z)==norm(inp.value)),ans:()=>inp.value=v[0]}}));

/* 6 */
const e6=h('section','card');
const K=[['at + время: <i>I get up at 7 o’clock</i>',/\bat (\d|\w+ o.clock|midnight|lunchtime|night|noon|the weekend|christmas|easter)/i],['in + сезон, часть дня или месяц: <i>In winter…</i>',/\bin (the (morning|afternoon|evening)|summer|winter|spring|autumn|january|february|march|april|may|june|july|august|september|october|november|december)\b/i],['on + день недели: <i>On Monday…</i>',/\bon (monday|tuesday|wednesday|thursday|friday|saturday|sunday)s?\b/i],['день рождения с датой: <i>My birthday is on 12th April</i>',/birthday[^.]*\bon (the )?(\d|\w+ \d)/i],['born in + год: <i>I was born in 2012</i>',/\bborn in \d{4}/i]];
const ta=h('textarea');ta.placeholder='Напиши 5 предложений о себе…';
const ul=h('ul','chk',K.map(k=>'<li>'+k[0]+'</li>').join('')),cnt=h('p','cnt');
const upd=()=>{let n=0;[...ul.children].forEach((li,i)=>{const y=K[i][1].test(ta.value);li.classList.toggle('y',y);n+=y});
 const s=ta.value.split(/[.!?]+/).filter(x=>x.trim()).length;cnt.textContent='Структур использовано: '+n+' из 5 · Предложений: '+s+' из 5'+(n==5&&s>=5?' — отлично!':'')};
ta.oninput=upd;const demo='I get up at 7 o’clock every day. In winter I like skiing. On Monday I have English. My birthday is on 12th April. I was born in 2012.';
const sb=h('button','btn ghost','Показать пример');sb.onclick=()=>{ta.value=demo;upd()};
e6.append(h('h2',0,'6. Расскажи о себе'),h('p','ins','Напиши 5 предложений. Каждое должно содержать одну из структур — счётчик отметит, какие уже использованы.'),ul,ta,cnt,h('div','bar'));
e6.lastChild.append(sb,h('span','lab','Здесь нет единственно верного ответа — важно использовать структуры правильно.'));upd();

/* 7 */
