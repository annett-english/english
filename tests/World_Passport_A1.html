<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0}[hidden]{display:none!important}</style></head><body><title>World Passport A1</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=Nunito:wght@400;600;800&family=Noto+Sans:wght@400&display=swap">
<style>
/* layout: passport cover hero, numbered route of tasks, sticky "problem words" luggage tag on the right */
:root{--bg:#e8f3f5;--card:#fff;--fg:#14304a;--muted:#56708a;--line:#bcd6dd;--navy:#173a63;--on-navy:#f4f9ff;--coral:#e4572e;--sun:#ffc43d;--ok:#16795a;--okbg:#dcf3e9;--bad:#b3261e;--badbg:#fde4e1;--soft:#f1f8fa;
--fd:'Unbounded','Trebuchet MS',sans-serif;--fb:'Nunito',system-ui,sans-serif;--fi:'Noto Sans',sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d1b2a;--card:#152a3f;--fg:#e7f1fa;--muted:#9db5cb;--line:#2e4a66;--navy:#244f82;--on-navy:#f4f9ff;--coral:#ff7a54;--sun:#ffc43d;--ok:#6ee0b5;--okbg:#123d31;--bad:#ff9d94;--badbg:#4a1f22;--soft:#1b344d;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0d1b2a;--card:#152a3f;--fg:#e7f1fa;--muted:#9db5cb;--line:#2e4a66;--navy:#244f82;--on-navy:#f4f9ff;--coral:#ff7a54;--sun:#ffc43d;--ok:#6ee0b5;--okbg:#123d31;--bad:#ff9d94;--badbg:#4a1f22;--soft:#1b344d;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.6 var(--fb)}
.wrap{max-width:1120px;margin:0 auto;padding-block:20px 90px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2{font-family:var(--fd);line-height:1.25;margin:0;text-wrap:balance}
h1{font-size:clamp(1.5rem,5vw,2.5rem);font-weight:800}
h2{font-size:1.1rem;font-weight:500}
button{font:800 .9rem var(--fb);border:2px solid var(--navy);background:var(--card);color:var(--fg);border-radius:10px;padding:7px 14px;cursor:pointer}
button:hover{background:var(--soft)}
button.main{background:var(--navy);color:var(--on-navy)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,.chunk:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
input[type=text],textarea,select{font:600 1rem var(--fb);color:var(--fg);background:var(--soft);border:2px solid var(--line);border-radius:9px;padding:7px 10px;max-width:100%}
textarea{width:100%;resize:vertical;min-height:64px}
.hero{background:var(--navy);color:var(--on-navy);border-radius:22px;padding:26px;display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:space-between;border:6px double var(--sun)}
.hero>div:first-child{flex:1 1 300px;min-width:0}
.hero p{margin:10px 0}
.hero input{background:var(--card)}
.compass{width:210px;height:210px;border-radius:50%;border:3px solid var(--sun);position:relative;margin:auto;flex:none}
.compass::before{content:"";position:absolute;left:50%;top:50%;width:18px;height:112px;margin:-56px 0 0 -9px;background:linear-gradient(var(--coral) 50%,var(--on-navy) 50%);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);transform:rotate(var(--turn,0deg));transition:transform .6s cubic-bezier(.3,1.6,.5,1)}
.compass button{position:absolute;border-color:var(--sun);background:var(--navy);color:var(--on-navy);padding:3px 9px}
.compass button:hover{background:var(--coral)}
.c-n{top:6px;left:50%;transform:translateX(-50%)}.c-s{bottom:6px;left:50%;transform:translateX(-50%)}.c-w{left:6px;top:50%;transform:translateY(-50%)}.c-e{right:6px;top:50%;transform:translateY(-50%)}
.audio{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0;font-size:.9rem}
#vstat{color:var(--muted);flex:1 1 220px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:20px;align-items:start}
section{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:18px;position:relative;scroll-margin-top:12px}
.head{display:flex;gap:12px;align-items:center;padding-right:74px}
.num{font:800 .95rem var(--fd);background:var(--sun);color:#14304a;border-radius:50%;width:38px;height:38px;display:grid;place-items:center;flex:none}
.stamp{position:absolute;right:14px;top:14px;font:800 .62rem var(--fd);color:var(--coral);border:3px solid var(--coral);border-radius:50%;width:66px;height:66px;display:grid;place-items:center;transform:rotate(-14deg);animation:st .35s ease-out}
@keyframes st{from{transform:rotate(-14deg) scale(2)}}
.task{color:var(--muted);margin:8px 0 14px;min-height:30px;padding-right:70px}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:10px}
.word{display:flex;gap:10px;align-items:center;text-align:left;border:2px solid var(--line);font-weight:600;min-width:0}
.word.heard{border-color:var(--ok);background:var(--okbg)}
.word b{display:block;font-size:1.05rem}.ipa{font-family:var(--fi);color:var(--muted);font-size:.85rem;display:block}
.play{color:var(--coral);flex:none}
ol{padding-left:22px;margin:0}li{margin-bottom:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row input[type=text]{flex:1 1 190px;min-width:0}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;align-items:center}
.score{font-weight:800}
.ans{display:block;color:var(--coral);font-weight:800;margin-top:3px}
.note{display:block;font-size:.9rem;margin-top:3px;color:var(--muted)}
input.ok,textarea.ok,.opt.ok{border-color:var(--ok);background:var(--okbg)}
input.bad,textarea.bad,.opt.bad{border-color:var(--bad);background:var(--badbg)}
.story{background:var(--soft);border-radius:12px;padding:14px;line-height:2.4}
.chunk{cursor:pointer;border-radius:6px;padding:3px 2px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.chunk:hover{background:var(--line)}
.chunk.sel{background:var(--sun);color:#14304a}
.chunk.ok{background:var(--okbg);color:var(--ok);font-weight:800}
.chunk.bad{background:var(--badbg);color:var(--bad);text-decoration:line-through}
.chunk.miss{outline:3px dashed var(--coral)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin-top:12px}
.match>div{display:flex;flex-direction:column;gap:8px;min-width:0}
.match button{min-height:46px;border-color:var(--line);overflow-wrap:anywhere}
.match button.sel{background:var(--sun);color:#14304a}
.match button.ok{background:var(--okbg);border-color:var(--ok);opacity:.75}
.match button.bad{background:var(--badbg);border-color:var(--bad)}
.timer{font:800 1.3rem var(--fd);font-variant-numeric:tabular-nums}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.bank span{border:2px dashed var(--navy);border-radius:8px;padding:2px 10px;font-weight:800}
.gaps{line-height:2.9}.gaps input{width:11.5em;padding:3px 8px}
.pattern{font:500 1rem var(--fd);letter-spacing:.08em}
.blip{background:var(--sun);color:#14304a;border-radius:6px;padding:0 8px;font-weight:800}
.opt{border-color:var(--line)}.opt[aria-pressed=true]{background:var(--sun);color:#14304a}
.opt.ok[aria-pressed=true]{background:var(--okbg);color:var(--fg)}.opt.bad[aria-pressed=true]{background:var(--badbg);color:var(--fg)}
aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);background:var(--card);border:2px dashed var(--coral);border-radius:16px;padding:14px;max-height:calc(100vh - 40px);overflow:auto}
aside h2{font-size:.9rem}
#plist{list-style:none;padding:0;margin:10px 0}
#plist li{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:6px}
#plist button{padding:3px 9px;border-color:var(--line);text-align:left}
.cnt{background:var(--badbg);color:var(--bad);border-radius:20px;padding:0 9px;font-weight:800;flex:none}
#fab{display:none}
.self{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
#out{margin-top:10px;min-height:170px}
@media(max-width:860px){
.grid{grid-template-columns:minmax(0,1fr)}
aside{position:fixed;top:auto;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 68px);max-height:50vh;z-index:5;display:none;box-shadow:0 8px 30px #0006}
aside.open{display:block}
#fab{display:block;position:fixed;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:6;background:var(--coral);border-color:var(--coral);color:#fff;box-shadow:0 4px 14px #0005}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
<header class="hero">
 <div><h1>World Passport</h1><p>Continents, nationalities &amp; directions · A1<br>Выполняй задания и собирай штампы в паспорт путешественника.</p>
 <label>Passenger: <input type="text" id="name" placeholder="Твоё имя"></label></div>
 <div class="compass" id="compass" aria-label="Компас">
  <button class="c-n" data-dir="north" data-deg="0">north</button><button class="c-e" data-dir="east" data-deg="90">east</button><button class="c-s" data-dir="south" data-deg="180">south</button><button class="c-w" data-dir="west" data-deg="270">west</button>
 </div>
</header>
<div class="audio"><label for="voice">Голос:</label><select id="voice"></select><label><input type="checkbox" id="slow"> медленно</label><button id="test">▶ Проверить звук</button><span id="vstat" role="status"></span></div>
<div class="grid"><main id="main"></main>
<aside id="aside"><h2>Проблемные слова</h2><ul id="plist"></ul><button id="pclear">Очистить список</button><p class="note" id="stamps"></p></aside></div>
</div>
<button id="fab">Проблемные слова (0)</button>

<script>
const W=[['Africa','ˈæfrɪkə','Африка'],['African','ˈæfrɪkən','африканский; африканец'],['Asia','ˈeɪʒə','Азия'],['Asian','ˈeɪʒən','азиатский; азиат'],['Australia','ɒˈstreɪliə','Австралия'],['Australian','ɒˈstreɪliən','австралийский; австралиец'],['Europe','ˈjʊərəp','Европа'],['European','ˌjʊərəˈpiːən','европейский; европеец'],['North America','ˌnɔːθ əˈmerɪkə','Северная Америка'],['North American','ˌnɔːθ əˈmerɪkən','североамериканский; североамериканец'],['South America','ˌsaʊθ əˈmerɪkə','Южная Америка'],['South American','ˌsaʊθ əˈmerɪkən','южноамериканский; южноамериканец'],['north','nɔːθ','север'],['south','saʊθ','юг'],['west','west','запад'],['east','iːst','восток']];
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const el=(t,a={},h='')=>{const e=document.createElement(t);for(const k in a)e.setAttribute(k,a[k]);e.innerHTML=h;return e};
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};

/* ---------- audio ---------- */
const synth=window.speechSynthesis; let voices=[], current;
const rank=v=>{const n=v.name;if(/google us english.*(natural)/i.test(n))return 0;if(/google us english/i.test(n))return 1;if(/samantha/i.test(n))return 2;if(/en[-_]US/i.test(v.lang))return /natural/i.test(n)?3:4;return 5};
function loadVoices(){if(!synth){$('#vstat').textContent='Этот браузер не поддерживает озвучку. Открой страницу в Chrome или Safari.';return}
 voices=synth.getVoices().filter(v=>/^en/i.test(v.lang)).sort((a,b)=>rank(a)-rank(b));
 const sel=$('#voice'),keep=sel.value;sel.innerHTML='';
 voices.forEach(v=>sel.add(new Option(v.name+' ('+v.lang+')',v.name)));
 if(!voices.length)sel.add(new Option('Английский голос по умолчанию',''));
 if(voices.some(v=>v.name===keep))sel.value=keep;
 voiceInfo()}
function voiceInfo(){const v=voices.find(v=>v.name===$('#voice').value);
 $('#vstat').textContent=!v?'Список голосов пока пуст. Нажми «Проверить звук».':rank(v)<=2?'Выбран нужный голос.':'Google US English и Samantha здесь не найдены, играет другой английский голос. Они обычно есть в Chrome (Google) и на устройствах Apple (Samantha).'}
function speak(text){if(!synth){loadVoices();return}
 synth.cancel();const u=new SpeechSynthesisUtterance(text);const v=voices.find(v=>v.name===$('#voice').value);
 if(v){u.voice=v;u.lang=v.lang}else u.lang='en-US';
 u.rate=$('#slow').checked?0.65:0.92;
 u.onerror=e=>{if(!['canceled','interrupted'].includes(e.error))$('#vstat').textContent='Звук не воспроизвёлся. Проверь громкость или открой страницу в Chrome или Safari.'};
 current=u;synth.resume();synth.speak(u)}
if(synth){synth.addEventListener?.('voiceschanged',loadVoices);setTimeout(loadVoices,300);setTimeout(loadVoices,1500)}
$('#voice').onchange=()=>{voiceInfo();speak('Hello! North America, South America.')};
$('#test').onclick=()=>speak('Hello! Welcome to the world passport.');
$$('#compass button').forEach(b=>b.onclick=()=>{$('#compass').style.setProperty('--turn',b.dataset.deg+'deg');speak(b.dataset.dir)});

/* ---------- problem words & stamps ---------- */
let probs=load('wp-probs',{}); const seen=new Set();
function miss(words,key){if(seen.has(key))return;seen.add(key);words.forEach(w=>probs[w]=(probs[w]||0)+1);save('wp-probs',probs);drawProbs()}
function drawProbs(){const l=$('#plist');l.innerHTML='';const e=Object.entries(probs).sort((a,b)=>b[1]-a[1]);
 if(!e.length)l.append(el('li',{},'<span class="note">Пока пусто. Здесь появятся слова, в которых была ошибка.</span>'));
 e.forEach(([w,n])=>{const info=W.find(x=>x[0]===w),li=el('li');const b=el('button',{},'▶ '+w+(info?'<span class="ipa">/'+info[1]+'/ '+info[2]+'</span>':''));b.onclick=()=>speak(w);li.append(b,el('span',{class:'cnt',title:'Ошибок'},n));l.append(li)});
 $('#fab').textContent='Проблемные слова ('+e.length+')'}
$('#pclear').onclick=()=>{probs={};seen.clear();save('wp-probs',probs);drawProbs()};
$('#fab').onclick=()=>$('#aside').classList.toggle('open');
const done=new Set(); const TOTAL=11;
function stamp(sec,on){const old=$('.stamp',sec);if(on){done.add(sec.id);if(!old)sec.append(el('div',{class:'stamp'},'DONE'))}else{done.delete(sec.id);old?.remove()}$('#stamps').textContent='Штампы в паспорте: '+done.size+' из '+TOTAL}

function section(id,n,title,task){const s=el('section',{id},`<div class="head"><span class="num">${n}</span><h2>${title}</h2></div><p class="task">${task}</p><div class="body"></div><div class="bar"></div>`);$('#main').append(s);return [s,$('.body',s),$('.bar',s)]}
function btn(bar,label,fn,cls=''){const b=el('button',{type:'button',class:cls},label);b.onclick=()=>fn(b);bar.append(b);return b}
function answersBtn(bar,fn,label='Показать ответы'){let on=false;btn(bar,label,b=>{on=!on;fn(on);b.textContent=on?'Скрыть ответы':label}).dataset.role='answers'}
const norm=s=>s.toLowerCase().replace(/[’‘]/g,"'").replace(/\b(he|she|it)'s\b/g,'$1 is').replace(/[.,!?;:"]/g,'').replace(/\s+/g,' ').trim();
function input(id,label){return el('input',{type:'text',id,'aria-label':label,autocomplete:'off',autocapitalize:'off',autocorrect:'off',spellcheck:'false'})}
/* typed exercises with fixed answers */
function typedChecker(s,bar,items){const sc=el('span',{class:'score',role:'status'});
 btn(bar,'Проверить',()=>{let ok=0;items.forEach(it=>{const v=norm(it.inp.value);it.inp.classList.remove('ok','bad');if(!v)return;const good=it.acc.some(a=>norm(a)===v);it.inp.classList.add(good?'ok':'bad');if(good)ok++;else miss(it.words,it.inp.id+':'+v)});sc.textContent=`Верно: ${ok} из ${items.length}`;stamp(s,ok===items.length)},'main');
 answersBtn(bar,on=>items.forEach(it=>{it.ansEl?.remove();if(on){it.ansEl=el('span',{class:'ans'},'→ '+it.show);it.inp.after(it.ansEl)}}));
 btn(bar,'Сбросить',()=>{items.forEach(it=>{it.inp.value='';it.inp.classList.remove('ok','bad')});sc.textContent='';stamp(s,false);persist()});
 items.forEach(it=>it.inp.oninput=()=>it.inp.classList.remove('ok','bad'));bar.append(sc)}

/* 0 warm-up */
{const[s,b,bar]=section('t0','★','Warm-up: listen &amp; repeat','Нажми на каждую карточку, прослушай слово и повтори его вслух 2 раза.');
 const g=el('div',{class:'words'});const heard=new Set(),c=el('span',{class:'score'},'Прослушано: 0 из 16');
 W.forEach(([w,i,r])=>{const k=el('button',{type:'button',class:'word'},`<span class="play">▶</span><span><b>${w}</b><span class="ipa">/${i}/</span>${r}</span>`);k.onclick=()=>{speak(w);k.classList.add('heard');heard.add(w);c.textContent=`Прослушано: ${heard.size} из 16`;if(heard.size===16)stamp(s,true)};g.append(k)});
 b.append(g);bar.append(c)}

/* 1 find in the wild */
{const[s,b,bar]=section('t1',1,'Find them in the wild','Прочитай рассказ. Нажми на 8 фраз, в которых есть континент, слово о жителе или принадлежности к континенту, или сторона света. Нажми ещё раз, чтобы снять выбор.');
 const T=['My name is Ola.','I love my photo album.','On page one,',['there is a lion in Africa.','Africa'],'Next to it',['you can see my Asian friend Min.','Asian'],'She has a small dog.','Then there is a big beach',['in the south of Spain.','south'],'My teacher Tom',['is North American.','North American'],'He likes green tea.',['Here is a koala from Australia.','Australia'],'It sleeps all day.','My uncle works',['in a European city.','European'],'His office is very old.','This is a river',['in South America.','South America'],'The last photo shows',['a red sun in the west.','west'],'Good night, album!'];
 const p=el('p',{class:'story'});const ch=T.map((t,i)=>{const [txt,w]=Array.isArray(t)?t:[t,null];const c=el('span',{class:'chunk',role:'button',tabindex:'0','aria-pressed':'false'},txt);if(w)c.dataset.w=w;
  c.onclick=()=>{c.classList.remove('ok','bad');c.setAttribute('aria-pressed',c.classList.toggle('sel'))};c.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();c.click()}};p.append(c,' ');return c});
 b.append(p);const sc=el('span',{class:'score',role:'status'});
 btn(bar,'Проверить',()=>{let ok=0,wrong=0;ch.forEach((c,i)=>{c.classList.remove('ok','bad');if(!c.classList.contains('sel'))return;if(c.dataset.w){c.classList.add('ok');ok++}else{c.classList.add('bad');wrong++}});
  if(ok+wrong)ch.forEach((c,i)=>{if(c.dataset.w&&!c.classList.contains('sel'))miss([c.dataset.w],'f'+i)});
  sc.textContent=`Найдено: ${ok} из 8 · лишних: ${wrong}`;stamp(s,ok===8&&!wrong)},'main');
 answersBtn(bar,on=>ch.forEach(c=>c.classList.toggle('miss',on&&!!c.dataset.w)));
 btn(bar,'Сбросить',()=>{ch.forEach(c=>{c.classList.remove('sel','ok','bad');c.setAttribute('aria-pressed','false')});sc.textContent='';stamp(s,false)});bar.append(sc)}

/* 2 speed match */
{const[s,b,bar]=section('t2',2,'Speed match','Соедини слово и значение как можно быстрее. В каждом раунде 8 пар. Таймер запускается кнопкой «Старт».');
 const top=el('div',{class:'row'},'<span class="timer">0.0 s</span><span class="score" role="status"></span>'),m=el('div',{class:'match'}),key=el('div');b.append(top,m,key);
 let tm,pairs=[],pick=null,found=0,errs=0;const T=$('.timer',top),info=$('.score',top);let best=load('wp-best',null);
 function reset(){clearInterval(tm);m.innerHTML='';key.innerHTML='';pick=null;found=errs=0;T.textContent='0.0 s';info.textContent=best?`Рекорд: ${best} s`:''}
 function start(){reset();stamp(s,false);pairs=shuffle(W).slice(0,8);const t0=Date.now();tm=setInterval(()=>T.textContent=((Date.now()-t0)/1000).toFixed(1)+' s',100);
  const L=el('div'),R=el('div'),lo=shuffle(pairs);let ro=shuffle(pairs);while(ro.some((x,i)=>x===lo[i]))ro=shuffle(pairs);
  const make=(p,side,col)=>{const x=el('button',{type:'button'},side?p[2]:p[0]);x.dataset.k=p[0];x.dataset.side=side;col.append(x);x.onclick=()=>{
   if(!pick||pick.dataset.side===x.dataset.side){pick?.classList.remove('sel');pick=x;x.classList.add('sel');return}
   const a=pick;pick=null;a.classList.remove('sel');
   if(a.dataset.k===x.dataset.k){[a,x].forEach(y=>{y.classList.add('ok');y.disabled=true});if(++found===8){clearInterval(tm);const sec=+((Date.now()-t0)/1000).toFixed(1);T.textContent=sec+' s';if(!best||sec<best){best=sec;save('wp-best',best)}info.textContent=`Готово! Ошибок: ${errs} · Рекорд: ${best} s`;stamp(s,true)}}
   else{errs++;info.textContent='Ошибок: '+errs;const en=a.dataset.side==='0'?a:x;miss([en.dataset.k],'m'+en.dataset.k+Date.now());[a,x].forEach(y=>{y.classList.add('bad');setTimeout(()=>y.classList.remove('bad'),600)})}}};
  lo.forEach(p=>make(p,0,L));ro.forEach(p=>make(p,1,R));m.append(L,R)}
 btn(bar,'Старт / новый раунд',start,'main');
 answersBtn(bar,on=>{key.innerHTML='';if(on){const list=pairs.length?pairs:W;key.innerHTML='<p class="ans">'+list.map(p=>p[0]+' — '+p[2]).join('<br>')+'</p>'}});reset()}

 const ol=el('ol');const st=Q.map(([q,o,c,w])=>{const li=el('li',{},q.replace('BLIP','<span class="blip">BLIP</span>')),r=el('div',{class:'row'}),it={c,w,sel:null,li};it.btns=o.map((t,j)=>{const x=el('button',{type:'button',class:'opt','aria-pressed':'false'},t);x.onclick=()=>{it.sel=j;it.btns.forEach((y,k)=>{y.className='opt';y.setAttribute('aria-pressed',k===j)})};r.append(x);return x});li.append(r);ol.append(li);return it});
 b.append(ol);const sc=el('span',{class:'score',role:'status'});

 btn(bar,'Сбросить',()=>{st.forEach(it=>{it.sel=null;it.btns.forEach(y=>{y.className='opt';y.setAttribute('aria-pressed','false')})});sc.textContent='';stamp(s,false)});bar.append(sc)}

/* 8-10 production */
const PROD=[];
function production(id,n,title,task,data,check){const[s,b,bar]=section(id,n,title,task);const ol=el('ol');
 const items=data.map((d,i)=>{const li=el('li',{},d.q),t=el('textarea',{id:id+'-'+i,'aria-label':title+' '+(i+1),placeholder:'Write here…'}),note=el('span',{class:'note'});li.append(t,note);ol.append(li);t.oninput=()=>{t.classList.remove('ok','bad');note.textContent=''};return{t,note,li,...d}});
 b.append(ol);PROD.push({title,items});const sc=el('span',{class:'score',role:'status'});
 btn(bar,'Проверить',()=>{let ok=0;items.forEach(it=>{const v=it.t.value.trim();it.t.classList.remove('ok','bad');it.note.textContent='';if(!v)return;const tips=check(v,it);it.t.classList.add(tips.length?'bad':'ok');it.note.textContent=tips.length?tips.join(' '):'Базовая проверка пройдена. Грамматику проверит учитель.';if(!tips.length)ok++;else if(it.need&&!has(v,it.need))miss([it.need],it.t.id+':'+v)});sc.textContent=`Прошли проверку: ${ok} из ${items.length}`;stamp(s,ok===items.length)},'main');
 answersBtn(bar,on=>items.forEach(it=>{it.a?.remove();if(on){it.a=el('span',{class:'ans'},'Пример: '+it.ex);it.li.append(it.a)}}),'Показать примеры ответов');
 btn(bar,'Копировать мои ответы',()=>copy([{title,items}]));
 btn(bar,'Сбросить',()=>{items.forEach(it=>{it.t.value='';it.t.classList.remove('ok','bad');it.note.textContent=''});sc.textContent='';stamp(s,false);persist()});bar.append(sc)}
const has=(v,w)=>new RegExp('\\b'+w+'\\b','i').test(v);
const basic=(v,min)=>{const t=[];if(v.split(/\s+/).length<min)t.push(`Напиши минимум ${min} слов(а).`);if(!/^[A-Z]/.test(v))t.push('Начни с большой буквы.');if(!/[.!?]$/.test(v))t.push('Поставь точку в конце.');if(/[а-яё]/i.test(v))t.push('Пиши по-английски.');return t};

production('t8',8,'Expand the sentence','Сделай предложение длиннее: добавь детали из подсказки. Здесь много правильных вариантов.',[
 {q:'<b>I have a friend.</b> (+ South American, + name)',ex:'I have a South American friend, and her name is Ana.'},
 {q:'<b>My city is in Poland.</b> (+ north / south / east / west)',ex:'My city is in the west of Poland.'},
 {q:'<b>This is food.</b> (+ Asian, + what is in it?)',ex:'This is tasty Asian food with rice.'},
 {q:'<b>I want to go.</b> (+ where? + why?)',ex:'I want to go to Australia because I like koalas.'},
 {q:'<b>I like music.</b> (+ African, + why?)',ex:'I like African music because it is happy.'},
 {q:'<b>It is a city.</b> (+ European, + big / small / old)',ex:'It is a big old European city.'}
],(v,it)=>{const base=it.q.match(/<b>(.*?)<\/b>/)[1];const t=basic(v,5);if(v.split(/\s+/).length<=base.split(' ').length)t.push('Предложение должно стать длиннее.');return t});

production('t9',9,'Answer the questions','Ответь на вопросы полным предложением.',[
 {q:'Which continent is Egypt in?',ex:'Egypt is in Africa.'},
 {q:'Where does the sun come up?',ex:'The sun comes up in the east.'},
 {q:'Is Italian pizza European food or Asian food?',ex:'Italian pizza is European food.'},
 {q:'Is Mexico in North America or South America?',ex:'Mexico is in North America.'},
 {q:'Which continent do you want to visit? Why?',ex:'I want to visit South America because I like nature.'},
 {q:'What city is in the north of your country?',ex:'Gdańsk is in the north of Poland.'},
 {q:'Do you know an Australian animal? What is it?',ex:'Yes, I do. It is a kangaroo.'}
],v=>basic(v,3));

production('t10',10,'Write your own sentence','Напиши своё предложение с данным словом.',[
 ['Australia','Australia is very far from my home.'],['European','My favourite European city is Rome.'],['east','My school is in the east of the city.'],['North American','I have a North American teacher.'],['Asia','Thailand is a country in Asia.'],['west','The sun goes down in the west.'],['South American','Brazil is a South American country.']
].map(([need,ex])=>({q:`<b>${need}</b>`,need,ex})),(v,it)=>{const t=basic(v,4);if(!has(v,it.need))t.unshift(`Используй «${it.need}».`);else if(/^[A-Z]/.test(it.need)&&!new RegExp(it.need).test(v))t.push('Названия и такие прилагательные пишутся с большой буквы.');return t});

/* copy */
{const[s,b]=section('copybox','✈','Отправить учителю','Здесь копируются твои ответы только из заданий 8–10, где вариантов ответа много.');s.querySelector('.bar').remove();
 const bar=el('div',{class:'bar'});btn(bar,'Копировать все мои ответы',()=>copy(PROD),'main');
 b.append(bar,el('p',{class:'note',id:'cstat',role:'status'}),el('textarea',{id:'out',readonly:'','aria-label':'Текст для копирования'}));$('#out',b).hidden=true}
function buildText(list){const name=$('#name').value.trim();let t='World Passport A1'+(name?'\nStudent: '+name:'')+'\n';
 list.forEach(g=>{t+='\n'+g.title+'\n';g.items.forEach((it,i)=>{t+=`${i+1}. ${it.q.replace(/<[^>]+>/g,'')}\n   ${it.t.value.trim()||'—'}\n`})});return t}
function copy(list){const out=$('#out'),st=$('#cstat');if(!list.some(g=>g.items.some(i=>i.t.value.trim()))){st.textContent='Сначала напиши хотя бы один ответ.';$('#copybox').scrollIntoView();return}
 out.value=buildText(list);out.hidden=false;
 const fail=()=>{out.focus();out.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}st.textContent=ok?'Скопировано! Вставь текст в сообщение учителю.':'Текст выделен. Нажми Ctrl+C (⌘+C) или «Копировать» на телефоне.';if(!ok)$('#copybox').scrollIntoView();toast(ok)};
 const toast=ok=>{const b=document.activeElement;if(ok&&b?.tagName==='BUTTON'){const o=b.textContent;b.textContent='Скопировано ✓';setTimeout(()=>b.textContent=o,1500)}};
 const btnEl=document.activeElement;
 if(navigator.clipboard?.writeText)navigator.clipboard.writeText(out.value).then(()=>{st.textContent='Скопировано! Вставь текст в сообщение учителю.';btnEl?.focus?.();toast(true)}).catch(fail);else fail()}

{const[s,b,bar]=section('self','✓','Что я теперь знаю','Честно оцени себя.');

 b.append(ol);bar.append(res);setTimeout(upd)}
