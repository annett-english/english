<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Character adjectives — Extra practice</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1d2433;--mu:#6b7488;--ac:#4f46e5;--ok:#16a34a;--bad:#dc2626;--bd:#dde1ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151f;--card:#1c2030;--tx:#e8ebf5;--mu:#98a1b8;--ac:#8b85ff;--ok:#4ade80;--bad:#f87171;--bd:#2d3350}}
:root[data-theme="dark"]{--bg:#12151f;--card:#1c2030;--tx:#e8ebf5;--mu:#98a1b8;--ac:#8b85ff;--ok:#4ade80;--bad:#f87171;--bd:#2d3350}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:auto;padding:12px}h1{margin:6px 0 2px;font-size:1.45rem}h2{margin:0 0 4px;font-size:1.15rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}.in,.mu{color:var(--mu);font-size:.9rem;margin:0 0 8px}
ol{padding-left:22px;margin:6px 0}ol li{margin:10px 0}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:9px;padding:6px 11px}button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
input{font:inherit;border:1.5px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:7px;padding:3px 8px;min-width:90px}
input.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}input.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.ans{color:var(--ok);font-weight:600;margin-left:8px}.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}.sc{font-weight:700}
.sc2{font-family:monospace;color:var(--ac);letter-spacing:2px;font-weight:700;margin-right:8px}
</style></head><body><main>
<h1>Extra practice · Character adjectives 🧩</h1>
<p class="mu">Дополнительные упражнения: пиши слова руками, потом проверяй.</p>
<div id="exs"></div>
<section class="card"><h2>Мои результаты</h2><div class="bar"><button class="p" id="cp">📋 Копировать все мои ответы</button><span class="sc" id="cps"></span></div><p class="mu" id="pw"></p></section>
</main>
<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const n=s=>s.toLowerCase().replace(/[’`]/g,"'").replace(/[\s\-.,!?]+/g,"");
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const spread=a=>{for(let i=1;i<a.length;i++)if(a[i].a[0]===a[i-1].a[0]){const j=a.findIndex((x,k)=>k>i&&x.a[0]!==a[i-1].a[0]&&(!a[i+1]||x.a[0]!==a[i+1].a[0]));if(j>0)[a[i],a[j]]=[a[j],a[i]]}return a};
const EX=[
{id:"e1",title:"Ex. 1 · Translate into English",instr:"Напиши английское слово.",items:[
{t:"добрый → {}",a:["kind"]},{t:"щедрый → {}",a:["generous"]},{t:"ленивый → {}",a:["lazy"]},{t:"застенчивый → {}",a:["shy"]},
{t:"глупый → {}",a:["stupid"]},{t:"трудолюбивый → {}",a:["hard-working"]},{t:"свайпать → {}",a:["swipe"]}]},
{id:"e2",title:"Ex. 2 · What’s … like? or What does … like?",instr:"Впиши недостающее слово: What’s / does / do / is / are / like.",items:[
{t:"{} your sister like? — She’s shy and quiet.",a:["What’s","What is"]},
{t:"What {} your sister like? — She likes dancing.",a:["does"]},
{t:"— What’s your dad {}? — He’s funny and generous.",a:["like"]},
{t:"— What does your dad {}? — He likes football.",a:["like"]},
{t:"What {} your teacher like? — She’s serious but kind.",a:["is"]},
{t:"What {} your friends like? — They like pizza and films.",a:["do"]},
{t:"What {} your friends like? — They’re extroverts.",a:["are"]}]},
{id:"e3",title:"Ex. 3 · Unscramble the word",instr:"Переставь буквы и напиши слово.",sc:1,items:[
{t:"yazl → {}",a:["lazy"]},{t:"vlecer → {}",a:["clever"]},{t:"uqeit → {}",a:["quiet"]},{t:"souirse → {}",a:["serious"]},
{t:"esugenro → {}",a:["generous"]},{t:"yhs → {}",a:["shy"]},{t:"nyfun → {}",a:["funny"]}]},
{id:"e4",title:"Ex. 4 · Dating app profiles",instr:"Прочитай профиль и напиши одним словом, какой это человек.",items:[
{t:"“I never stop talking!” → He’s {}.",a:["talkative"]},
{t:"“I help everybody and I’m nice to animals.” → She’s {}.",a:["kind"]},
{t:"“I work 12 hours a day. I never rest.” → He’s {}.",a:["hard-working"]},
{t:"“I love parties and new friends!” → She’s an {}.",a:["extrovert"]},
{t:"“I stay in bed until 2 pm.” → He’s {}.",a:["lazy"]},
{t:"“I never say hello to people.” → She’s {}.",a:["unfriendly","unkind","mean"]},
{t:"“I buy dinner for all my friends.” → He’s {}.",a:["generous"]}]}
];
const P={};
function rp(){const k=Object.keys(P);$("#pw").textContent=k.length?"Повтори эти слова: "+k.map(w=>w+" ×"+P[w]).join(", "):""}
function build(ex){const box=$("#"+ex.id);ex.cur=spread(shuf(ex.items)).map(x=>({...x,f:0}));
$("ol",box).innerHTML=ex.cur.map(it=>`<li>${it.t.replace("{}",`<input autocomplete="off" autocapitalize="off" spellcheck="false" size="${Math.max(9,it.a[0].length+3)}">`)}<span class="ans"></span></li>`).join("");$(".sc",box).textContent="";ex.score=""}
EX.forEach(ex=>{$("#exs").insertAdjacentHTML("beforeend",`<section class="card" id="${ex.id}" data-ex="${ex.id}"><h2>${ex.title}</h2><p class="in">${ex.instr}</p><ol></ol><div class="bar"><button class="p" data-a="chk">Проверить</button><button data-a="shw">Показать ответы</button><button data-a="rst">Заново (перемешать)</button><span class="sc"></span></div></section>`);build(ex)});
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const sec=b.closest("[data-ex]"),ex=EX.find(x=>x.id===sec.dataset.ex),a=b.dataset.a;
if(a==="rst")build(ex);
if(a==="chk"){let c=0;$$("li",sec).forEach((li,i)=>{const it=ex.cur[i],inp=$("input",li),ok=it.a.some(x=>n(x)===n(inp.value));inp.classList.toggle("ok",ok);inp.classList.toggle("bad",!ok);if(ok)c++;else if(!it.f){it.f=1;P[it.a[0]]=(P[it.a[0]]||0)+1;rp()}});
ex.score=c+"/"+ex.cur.length;$(".sc",sec).textContent=ex.score+(c===ex.cur.length?" 🎉":"")}
if(a==="shw")$$("li",sec).forEach((li,i)=>$(".ans",li).textContent="→ "+ex.cur[i].a.join(" / "))});
function copy(txt,btn){const done=()=>{$("#cps").textContent="✓ Скопировано";setTimeout(()=>$("#cps").textContent="",1800)};
const fb=()=>{const t=document.createElement("textarea");t.value=txt;document.body.appendChild(t);t.select();try{document.execCommand("copy")}catch(e){}t.remove();done()};
if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(txt).then(done,fb);else fb()}
$("#cp").onclick=function(){let o="Character adjectives — extra practice, мои ответы\n\n";
EX.forEach(ex=>{o+=ex.title+" ("+(ex.score||"не проверено")+")\n";$$("#"+ex.id+" li").forEach((li,i)=>{const c=li.cloneNode(true);$$("input",c).forEach(x=>x.replaceWith("["+x.value+"]"));$$(".ans",c).forEach(x=>x.remove());
const inp=$("input",li),m=inp.classList.contains("ok")?" ✓":inp.classList.contains("bad")?" ✗ (→ "+ex.cur[i].a[0]+")":"";o+=(i+1)+". "+c.textContent.replace(/\s+/g," ").trim()+m+"\n"});o+="\n"});
o+="Повторить: "+(Object.keys(P).join(", ")||"—");copy(o,this)};
</script></body></html>
