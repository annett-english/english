html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Trebuchet MS","Segoe UI",system-ui,sans-serif}

.intro{color:var(--mut);margin:0 0 12px;font-size:14px}

.badge.p{background:var(--hot)}
aside{position:sticky;top:12px;background:var(--card);border:2px dashed var(--bad);border-radius:20px;padding:14px}

#bad span{display:inline-block;margin:3px;padding:2px 10px;border-radius:99px;background:var(--bad);color:#fff;font-size:14px;cursor:pointer}
button{font:inherit;cursor:pointer;border:2px solid var(--pri);background:transparent;color:var(--pri);border-radius:12px;padding:5px 12px;font-weight:700}
button:hover{background:var(--pri);color:#fff}
button:focus-visible,input:focus-visible{outline:3px solid var(--hot);outline-offset:2px}
button.main{background:var(--pri);color:#fff}
.it{border-top:1px solid var(--line);padding:12px 0}
.q{margin-bottom:8px}

.fb{margin-left:6px;font-weight:700}
.ok{color:var(--ok)}.no{color:var(--bad)}
.rev{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.rev div{border:1px solid var(--line);border-radius:14px;padding:8px 12px}
.rev small{color:var(--mut)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cols button{display:block;width:100%;margin-bottom:8px;text-align:left}
.cols button.sel{background:var(--hot);border-color:var(--hot);color:#fff}
.cols button.done{visibility:hidden}
.chips button{margin:3px}
.chips .k1{background:var(--hot);border-color:var(--hot);color:#fff}
.chips .k2{background:var(--ok);border-color:var(--ok);color:#fff}

</style></head>
