<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reported Speech B1 — упражнения</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1d2233;--mu:#5d647a;--ac:#3b5bdb;--acs:#e7ecff;--ok:#2b8a3e;--oks:#e3f6e8;--bad:#c92a2a;--bads:#fde8e8;--bd:#d9dded;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13151d;--card:#1c1f2b;--tx:#e8eaf3;--mu:#9aa1b8;--ac:#8ea6ff;--acs:#27304f;--ok:#69db7c;--oks:#17301f;--bad:#ff8787;--bads:#3a1c1c;--bd:#323750;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#13151d;--card:#1c1f2b;--tx:#e8eaf3;--mu:#9aa1b8;--ac:#8ea6ff;--acs:#27304f;--ok:#69db7c;--oks:#17301f;--bad:#ff8787;--bads:#3a1c1c;--bd:#323750;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:8px 0 2px}.sub{color:var(--mu);margin:0 0 14px}
#tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
#tabs button{white-space:nowrap}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:7px 12px;border-radius:10px;cursor:pointer}
button.pri,#tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button.pri,:root:not([data-theme="light"]) #tabs button.on{color:#11131a}}
.panel{display:none;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-top:8px}.panel.on{display:block}
.panel h2{margin:0 0 4px;font-size:1.2rem}.desc{color:var(--mu);margin:0 0 12px}
.it{border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin:8px 0}
.it.ok{background:var(--oks);border-color:var(--ok)}.it.bad{background:var(--bads);border-color:var(--bad)}.it.shown{background:var(--acs);border-color:var(--ac)}
input,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:4px 8px;max-width:100%;box-sizing:border-box}
input.w,textarea{width:100%;margin-top:6px}
.fb{font-size:.92rem;color:var(--mu);margin-top:6px}.fb:empty{display:none}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}.sc{font-weight:600}
.opt{display:block;width:100%;text-align:left;margin:5px 0}
.opt.on{background:var(--acs);border-color:var(--ac)}.opt.ok{background:var(--oks);border-color:var(--ok)}.opt.bad{background:var(--bads);border-color:var(--bad)}
.txt{line-height:2.1}.w{cursor:pointer;border-radius:5px;padding:1px 2px}.w:hover{background:var(--acs)}.w.sel{background:var(--acs);outline:2px solid var(--ac)}
.w.good{background:var(--oks);outline:2px solid var(--ok)}.w.miss{background:var(--bads);outline:2px dashed var(--bad)}.w.err{background:var(--bads);outline:2px solid var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0;min-height:36px}.chip{padding:4px 10px}.chip.used{opacity:.3;pointer-events:none}
.ans{border-bottom:2px dashed var(--bd);padding-bottom:4px}.ans .chip{background:var(--acs)}
.dice{font-size:3rem;text-align:center;margin:6px 0}.sit{font-size:1.1rem;font-weight:600;text-align:center}
.cl label{display:flex;gap:10px;align-items:flex-start;margin:8px 0;cursor:pointer}.cl input{margin-top:5px;width:18px;height:18px}
.prog{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin-top:12px}.prog i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
</style>
</head>
<body>
<main>
<h1>Reported Speech · B1</h1>
<p class="sub">Said vs told, сдвиг времён и слов-указателей времени. Выполняйте задания, проверяйте и смотрите ответы с объяснениями.</p>
<div id="tabs"></div><div id="panels"></div>
</main>
<script>
const $=(s,r=document)=>r.querySelector(s);
const norm=s=>s.toLowerCase().replace(/[’‘]/g,"'").replace(/[.!?"“”]/g,'').replace(/\s+/g,' ').trim();
const exp=a=>{let r=[];(Array.isArray(a)?a:[a]).forEach(x=>x.includes('(that)')?r.push(x.replace('(that) ',''),x.replace('(that)','that')):r.push(x));return r.map(norm)};
const first=a=>Array.isArray(a)?a[0]:a;
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function bar(p,chk,show,rst){const b=el('div','bar','<button class="pri">Проверить</button><button>Показать ответы</button><button>Сначала</button><span class="sc"></span>');const[a,s,r]=b.querySelectorAll('button'),sc=$('.sc',b);a.onclick=()=>sc.textContent=chk();s.onclick=()=>{show();sc.textContent=''};r.onclick=()=>{rst();sc.textContent=''};p.append(b)}

const FIND='I met my friend Kate yesterday. She told me that she {{had moved}} to a new flat the week before. She said she {{was working}} at a café and that she {{loved}} it. She added that she {{couldn’t come}} to my party because she {{had to study}}. I told her that I {{would call}} her the next day, and she said she {{would be}} free then. Kate also said that she {{had seen}} our old teacher in the park.';
const FINDE=['<b>had moved</b> — «I moved» (Past Simple) → Past Perfect; last week → the week before.','<b>was working</b> — «I’m working» (Present Continuous) → Past Continuous.','<b>loved</b> — «I love it» (Present Simple) → Past Simple.','<b>couldn’t come</b> — can’t → couldn’t.','<b>had to study</b> — must → had to.','<b>would call</b> — will → would; tomorrow → the next day.','<b>would be</b> — will → would.','<b>had seen</b> — Past Simple / Present Perfect → Past Perfect.'];

const EX=[
{t:'1. Find it in the wild',d:'Кликните по всем формам, где время сдвинулось назад (целиком, например «had moved»). Повторный клик снимает выделение. Всего 8.',k:'find'},
{t:'2. Rule check',d:'Выберите верное объяснение из трёх.',k:'mc',items:[
{q:'«I work a lot.» → She said she …',o:['work a lot','worked a lot','was working a lot'],c:1,e:'Present Simple → Past Simple.'},
{q:'«I’m studying.» → He said he …',o:['is studying','studied','was studying'],c:2,e:'Present Continuous → Past Continuous (was/were + -ing).'},
{q:'«I’ve finished.» → She said she …',o:['had finished','has finished','finished'],c:0,e:'Present Perfect → Past Perfect (had + V3).'},
{q:'«I saw him.» → He said he …',o:['saw him','had seen him','was seeing him'],c:1,e:'Past Simple → Past Perfect. А Past Perfect («I’d finished») уже не меняется.'},
{q:'«I’ll call you.» → He said he …',o:['will call me','would call me','called me'],c:1,e:'will → would; you → me.'},
{q:'«I must leave.» → She said she … leave.',o:['must','would','had to'],c:2,e:'must → had to (may → might, can → could).'},
{q:'He ___ me (that) he was tired.',o:['said','told','both are correct'],c:1,e:'После told обязательно идёт person: told me. Без person — said (said he was tired).'},
{q:'Когда время в косвенной речи МОЖЕТ остаться прежним?',o:['Когда прошло много лет','Когда передаём слова почти сразу после разговора','Никогда'],c:1,e:'«I’ve just spoken to Adam, he said he can’t come tonight.» Также could, might, should обычно не меняются.'}]},
{t:'3. Fill in the gaps',d:'Поставьте глагол в скобках в нужную форму.',k:'in',items:[
{q:'«I live in Warsaw.» Tom said he ___ (live) in Warsaw.',a:'lived',e:'Present Simple → Past Simple.'},
{q:'«I’m watching a film.» Anna said she ___ (watch) a film.',a:'was watching',e:'Present Continuous → was + -ing.'},
{q:'«We’ve bought a car.» They told me they ___ (buy) a car.',a:'had bought',e:'Present Perfect → had + V3.'},
{q:'«I visited Rome.» He said he ___ (visit) Rome.',a:'had visited',e:'Past Simple → Past Perfect.'},
{q:'«I’ll help you.» She told me she ___ (help) me.',a:'would help',e:'will → would.'},
{q:'«I can speak French.» He said he ___ (can) speak French.',a:'could',e:'can → could.'},
{q:'«I must go.» She said she ___ (must) go.',a:'had to',e:'must → had to.'},
{q:'«I’d already eaten.» Ben said he ___ (eat) already.',a:'had eaten',e:'Past Perfect не меняется: had eaten.'}]},
{t:'4. Change the time expression',d:'Впишите нужное слово или выражение вместо подчёркивания.',k:'in',items:[
{q:'«I’ll see you tomorrow.» He said he would see me ___.',a:['the next day','the following day'],e:'tomorrow → the next day / the following day.'},
{q:'«I’m busy now.» She said she was busy ___.',a:['then','at that time'],e:'now → then / at that time.'},
{q:'«I met him yesterday.» He said he had met him ___.',a:['the day before','the previous day'],e:'yesterday → the day before / the previous day.'},
{q:'«I’m free tonight.» She said she was free ___.',a:'that night',e:'tonight → that night.'},
{q:'«We’re leaving next week.» They said they were leaving ___.',a:['the following week','the week after'],e:'next week → the following week.'},
{q:'«I called her two days ago.» Tom said he had called her ___.',a:'two days before',e:'ago → before: two days ago → two days before.'},
{q:'«I like it here.» She said she liked it ___.',a:'there',e:'here → there.'},
{q:'«I love these shoes.» He said he loved ___ shoes.',a:'those',e:'these → those (this → that).'}]},
{t:'5. Sentence Builder',d:'Соберите предложение: нажимайте на слова по порядку. Нажатие на слово в ответе вернёт его назад.',k:'build',items:[
{s:'She said she was tired.',e:'said + (that) + Past Simple: am/is → was.'},
{s:'He told me he would call me the next day.',e:'told + person; will → would; tomorrow → the next day.'},
{s:'They said they had finished the project.',e:'Present Perfect → Past Perfect.'},
{s:'Tom told her he couldn’t come that night.',e:'can’t → couldn’t; tonight → that night.'},
{s:'Anna said she had seen him the day before.',e:'Past Simple → Past Perfect; yesterday → the day before.'},
{s:'She said she had to leave.',e:'must → had to.'},
{s:'He said he might come to the party.',e:'may → might.'},
{s:'My mother told me she was cooking dinner.',e:'told me + Present Continuous → was cooking.'}]},
{t:'6. Rephrase',d:'Перепишите прямую речь в косвенную. (that) можно писать или опускать.',k:'in',items:[
{q:'Kate: «I don’t like coffee.»',a:'Kate said (that) she didn’t like coffee.',e:'don’t like → didn’t like.'},
{q:'Mark: «I’m going to Paris next week.»',a:['Mark said (that) he was going to Paris the following week.','Mark said (that) he was going to Paris the week after.'],e:'am going → was going; next week → the following week.'},
{q:'They (told me): «We’ve lost the keys.»',a:'They told me (that) they had lost the keys.',e:'told me; Present Perfect → Past Perfect; we → they.'},
{q:'Sara: «I can’t find my phone here.»',a:'Sara said (that) she couldn’t find her phone there.',e:'can’t → couldn’t; my → her; here → there.'},
{q:'Dad (told me): «I’ll drive you tomorrow.»',a:['Dad told me (that) he would drive me the next day.','Dad told me (that) he would drive me the following day.'],e:'will → would; you → me; tomorrow → the next day.'},
{q:'Ben: «I saw her yesterday.»',a:['Ben said (that) he had seen her the day before.','Ben said (that) he had seen her the previous day.'],e:'Past Simple → Past Perfect; yesterday → the day before.'},
{q:'Lisa: «I must finish my report today.»',a:'Lisa said (that) she had to finish her report that day.',e:'must → had to; my → her; today → that day.'},
{q:'Jack: «I may be late tonight.»',a:'Jack said (that) he might be late that night.',e:'may → might; tonight → that night.'}]},
{t:'7. Random prompt',d:'Бросьте кубик: получите ситуацию. Придумайте косвенную речь, потом сверьтесь с образцом.',k:'dice'},
{t:'8. Я могу…',d:'Самооценка: отметьте, что у вас уже получается.',k:'self'}];

const P=$('#panels'),T=$('#tabs');
EX.forEach((x,n)=>{
 const tb=el('button','',x.t.split('. ')[0]+'. '+x.t.split('. ')[1].split(' ')[0]);tb.title=x.t;
 const p=el('div','panel',`<h2>${x.t}</h2><p class="desc">${x.d}</p>`);
 tb.onclick=()=>{document.querySelectorAll('#tabs button').forEach(b=>b.classList.remove('on'));document.querySelectorAll('.panel').forEach(b=>b.classList.remove('on'));tb.classList.add('on');p.classList.add('on')};
 T.append(tb);P.append(p);if(!n)tb.onclick();
 ({find,mc,in:inp,build,dice,self})[x.k](p,x)});

function find(p){
 const box=el('div','txt');let ts=[];
 FIND.split(/(\{\{.*?\}\})/).forEach(s=>{const m=/^\{\{(.*)\}\}$/.exec(s);
  if(m){const e=el('span','w',m[1]);e.t=1;ts.push(e);box.append(e,' ')}
  else s.split(' ').filter(Boolean).forEach(w=>{const e=el('span','w',w);box.append(e,' ')})});
 box.onclick=e=>{if(e.target.classList.contains('w'))e.target.classList.toggle('sel')};
 const fb=el('div','fb');p.append(box);
 const all=()=>box.querySelectorAll('.w');
 const clr=()=>all().forEach(w=>w.classList.remove('good','miss','err','sel'));
 bar(p,()=>{let g=0,er=0;all().forEach(w=>{w.classList.remove('good','miss','err');const s=w.classList.contains('sel');
   if(w.t&&s){g++;w.classList.add('good')}else if(w.t)w.classList.add('miss');else if(s)er++,w.classList.add('err')});
  fb.innerHTML=FINDE.join('<br>');return `Найдено ${g}/8, лишних: ${er}`},
 ()=>{all().forEach(w=>{w.classList.remove('sel','err');w.classList.toggle('good',!!w.t)});fb.innerHTML=FINDE.join('<br>')},
 ()=>{clr();fb.innerHTML=''});p.append(fb)}

function mc(p,x){
 const sel=[],cards=x.items.map((it,i)=>{const d=el('div','it',`<div><b>${i+1}.</b> ${it.q}</div>`);
  it.o.forEach((o,j)=>{const b=el('button','opt',o);b.onclick=()=>{sel[i]=j;[...d.querySelectorAll('.opt')].forEach((q,k)=>q.className='opt'+(k==j?' on':''))};d.append(b)});
  d.append(el('div','fb'));p.append(d);return d});
 const mark=(i,j,ok)=>{const d=cards[i];d.querySelectorAll('.opt').forEach((q,k)=>{q.className='opt'+(k==x.items[i].c?' ok':k==j?' bad':'')});$('.fb',d).innerHTML=(ok?'✓ ':'✗ ')+x.items[i].e};
 bar(p,()=>{let n=0;x.items.forEach((it,i)=>{const ok=sel[i]==it.c;n+=ok;mark(i,sel[i],ok)});return `Верно: ${n}/8`},
 ()=>x.items.forEach((it,i)=>mark(i,-1,true)),
 ()=>{sel.length=0;cards.forEach(d=>{d.querySelectorAll('.opt').forEach(q=>q.className='opt');$('.fb',d).innerHTML=''})})}

function inp(p,x){
 const cards=x.items.map((it,i)=>{const pt=it.q.split('___');
  const d=el('div','it',`<div><b>${i+1}.</b> ${pt[0]}${pt.length>1?'<input size="14">'+pt[1]:''}</div>${pt.length>1?'':'<input class="w">'}<div class="fb"></div>`);p.append(d);return d});
 bar(p,()=>{let n=0;x.items.forEach((it,i)=>{const d=cards[i],ok=exp(it.a).includes(norm($('input',d).value));n+=ok;d.className='it '+(ok?'ok':'bad');
   $('.fb',d).innerHTML=(ok?'✓ ':'✗ Правильно: <b>'+first(it.a)+'</b>. ')+it.e});return `Верно: ${n}/8`},
 ()=>x.items.forEach((it,i)=>{const d=cards[i];$('input',d).value=first(it.a).replace('(that) ','');d.className='it shown';$('.fb',d).innerHTML='<b>'+first(it.a)+'</b>. '+it.e}),
 ()=>cards.forEach(d=>{$('input',d).value='';d.className='it';$('.fb',d).innerHTML=''}))}

function build(p,x){
 const st=x.items.map(it=>({w:shuf(it.s.split(' ')),pk:[]}));
 const cards=x.items.map((it,i)=>{const d=el('div','it',`<div><b>${i+1}.</b></div><div class="chips ans"></div><div class="chips pool"></div><div class="fb"></div>`);p.append(d);return d});
 const draw=i=>{const d=cards[i],s=st[i],a=$('.ans',d),pl=$('.pool',d);a.innerHTML=pl.innerHTML='';
  s.pk.forEach(k=>{const b=el('button','chip',s.w[k]);b.onclick=()=>{s.pk=s.pk.filter(z=>z!=k);draw(i)};a.append(b)});
  s.w.forEach((w,k)=>{const b=el('button','chip'+(s.pk.includes(k)?' used':''),w);b.onclick=()=>{s.pk.push(k);draw(i)};pl.append(b)})};
 st.forEach((_,i)=>draw(i));
 bar(p,()=>{let n=0;x.items.forEach((it,i)=>{const ok=norm(st[i].pk.map(k=>st[i].w[k]).join(' '))==norm(it.s);n+=ok;cards[i].className='it '+(ok?'ok':'bad');$('.fb',cards[i]).innerHTML=(ok?'✓ ':'✗ Правильно: <b>'+it.s+'</b>. ')+it.e});return `Верно: ${n}/8`},
 ()=>x.items.forEach((it,i)=>{const s=st[i],u=[];s.pk=it.s.split(' ').map(w=>{const k=s.w.findIndex((z,y)=>z==w&&!u.includes(y));u.push(k);return k});draw(i);cards[i].className='it shown';$('.fb',cards[i]).innerHTML='<b>'+it.s+'</b>. '+it.e}),
 ()=>x.items.forEach((it,i)=>{st[i]={w:shuf(it.s.split(' ')),pk:[]};draw(i);cards[i].className='it';$('.fb',cards[i]).innerHTML=''}))}

function dice(p){
 const S=[['Mum: «I’ve bought some milk.»','Mum said (that) she had bought some milk.','Present Perfect → Past Perfect.'],
 ['Your friend: «I’ll be here tomorrow.»','He/She said (that) he/she would be there the next day.','will → would; here → there; tomorrow → the next day.'],
 ['Your boss: «We must finish today.»','The boss said (that) we had to finish that day.','must → had to; today → that day.'],
 ['Your sister: «I saw this film two days ago.»','She said (that) she had seen that film two days before.','Past Simple → Past Perfect; this → that; ago → before.'],
 ['Your teacher: «I’m checking your tests now.»','The teacher said (that) she was checking our tests then.','Present Continuous → Past Continuous; your → our; now → then.'],
 ['Your neighbour: «I can’t come to your party tonight.»','The neighbour said (that) he/she couldn’t come to my party that night.','can’t → couldn’t; your → my; tonight → that night.']];
 const d=el('div','',`<div class="dice">🎲</div><div class="sit">Нажмите «Бросить кубик»</div><textarea rows="2" placeholder="He/She said (that) …"></textarea><div class="fb"></div><div class="bar"><button class="pri">Бросить кубик</button><button>Показать образец</button></div>`);
 p.append(d);let cur=null;const[r,s]=d.querySelectorAll('button');
 r.onclick=()=>{cur=Math.floor(Math.random()*6);$('.dice',d).textContent='🎲 '+(cur+1);$('.sit',d).textContent=S[cur][0];$('textarea',d).value='';$('.fb',d).innerHTML=''};
 s.onclick=()=>{if(cur!=null)$('.fb',d).innerHTML='Образец: <b>'+S[cur][1]+'</b><br>'+S[cur][2]}}

function self(p){
 const L=['Я могу объяснить, чем said отличается от told.','Я могу сдвинуть Present Simple и Continuous в прошедшее.','Я могу использовать Past Perfect для Present Perfect и Past Simple.','Я могу заменить will, can, may, must на would, could, might, had to.','Я знаю, когда время не меняется (could, might, should; слова только что сказаны).','Я могу заменить now, today, tomorrow, yesterday на then, that day и т. д.','Я могу заменить here, this, these на there, that, those.','Я могу пересказать чужие слова в разговоре без подготовки.'];
 const d=el('div','cl');L.forEach(t=>d.append(el('label','',`<input type="checkbox"><span>${t}</span>`)));
 const pr=el('div','prog','<i></i>'),tx=el('div','sc','Готово: 0/8');
 d.onchange=()=>{const n=d.querySelectorAll(':checked').length;$('i',pr).style.width=n/8*100+'%';tx.textContent=`Готово: ${n}/8`+(n==8?' 🎉':'')};
 p.append(d,pr,tx)}
</script>
</body>
</html>
