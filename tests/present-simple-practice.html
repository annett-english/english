<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Present Simple — распорядок дня</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF6EE;
    --paper-2:#F2EBDC;
    --ink:#26221D;
    --ink-soft:#5C554B;
    --line:#DED2B8;
    --gold:#C98A2E;
    --gold-soft:#F1DCB0;
    --dusk:#3E5C82;
    --dusk-soft:#DCE5F0;
    --ok:#4C7A5B;
    --ok-bg:#E4EEE3;
    --bad:#AC4E3B;
    --bad-bg:#F5E3DD;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Manrope',sans-serif;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{
    font-family:'Fraunces',serif;
    font-weight:600;
    margin:0 0 6px;
    color:var(--ink);
  }
  .layout{
    display:grid;
    grid-template-columns:230px 1fr;
    max-width:1180px;
    margin:0 auto;
    min-height:100vh;
  }
  /* ---------- HERO ---------- */
  .hero{
    grid-column:1 / -1;
    padding:48px 32px 28px;
    border-bottom:1px solid var(--line);
    background:
      radial-gradient(1100px 260px at 8% -20%, var(--gold-soft) 0%, transparent 60%),
      radial-gradient(900px 240px at 96% -10%, var(--dusk-soft) 0%, transparent 55%);
  }
  .hero h1{font-size:clamp(28px,4vw,40px); letter-spacing:-0.01em;}
  .hero p.lead{
    max-width:640px;
    color:var(--ink-soft);
    font-size:16px;
    margin-top:8px;
  }
  .timeline{
    margin-top:28px;
    display:flex;
    flex-wrap:wrap;
    gap:0;
    align-items:center;
    position:relative;
  }
  .timeline .step{
    display:flex;
    align-items:center;
    gap:8px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:999px;
    padding:7px 14px 7px 10px;
    font-size:13.5px;
    font-weight:600;
    white-space:nowrap;
    box-shadow:0 1px 0 rgba(38,34,29,0.03);
    opacity:0;
    animation:rise .5s ease forwards;
  }
  .timeline .step .n{
    width:20px;height:20px;border-radius:50%;
    background:var(--gold);
    color:#fff;font-size:11px;font-weight:800;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .timeline .arrow{color:var(--line); font-size:16px; margin:0 6px; flex-shrink:0;}
  @keyframes rise{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  /* ---------- NAV ---------- */
  nav.sidenav{
    padding:24px 16px;
    border-right:1px solid var(--line);
    position:sticky;
    top:0;
    align-self:start;
    height:100vh;
    overflow-y:auto;
  }
  nav.sidenav .navlabel{
    font-size:11px; text-transform:uppercase; letter-spacing:.08em;
    color:var(--ink-soft); margin:0 4px 10px;
  }
  nav.sidenav a{
    display:flex;
    gap:10px;
    align-items:flex-start;
    text-decoration:none;
    color:var(--ink);
    font-size:13.5px;
    font-weight:600;
    padding:9px 10px;
    border-radius:10px;
    margin-bottom:2px;
  }
  nav.sidenav a:hover{ background:var(--paper-2); }
  nav.sidenav a .num{
    color:var(--gold); font-family:'Fraunces',serif; font-weight:700; flex-shrink:0;
  }
  nav.sidenav a span.t{color:var(--ink-soft); font-weight:500;}

  /* ---------- MAIN ---------- */
  main{padding:32px 32px 80px;}
  section.exercise{
    background:#fff;
    border:1px solid var(--line);
    border-radius:20px;
    padding:26px 28px 24px;
    margin-bottom:28px;
    scroll-margin-top:20px;
  }
  section.exercise .exhead{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:16px;
    flex-wrap:wrap;
    border-bottom:1px dashed var(--line);
    padding-bottom:14px;
    margin-bottom:18px;
  }
  section.exercise .exhead .tag{
    display:inline-block;
    font-size:11px; font-weight:700; letter-spacing:.04em;
    color:var(--dusk); background:var(--dusk-soft);
    padding:3px 9px; border-radius:999px; margin-bottom:8px;
  }
  section.exercise .instr{
    color:var(--ink-soft); font-size:14.5px; max-width:640px;
  }
  .btnrow{display:flex; gap:8px; flex-wrap:wrap;}
  button{
    font-family:'Manrope',sans-serif;
    font-size:13.5px; font-weight:700;
    border-radius:10px;
    padding:9px 14px;
    cursor:pointer;
    border:1px solid transparent;
    transition:transform .08s ease;
  }
  button:active{transform:scale(0.97);}
  .btn-primary{ background:var(--ink); color:#fff; }
  .btn-primary:hover{ background:#3a342c; }
  .btn-ghost{ background:#fff; border-color:var(--line); color:var(--ink); }
  .btn-ghost:hover{ border-color:var(--ink); }
  .btn-copy{ background:var(--gold); color:#fff; }
  .btn-copy:hover{ background:#b47a24; }
  .score{
    font-size:13.5px; font-weight:700; color:var(--ink-soft);
    align-self:center;
  }
  .score.ok{color:var(--ok);}

  ol.qlist{ list-style:none; margin:0; padding:0; counter-reset:q; }
  ol.qlist li.qrow{
    counter-increment:q;
    padding:14px 0;
    border-bottom:1px solid var(--paper-2);
    display:flex;
    gap:12px;
  }
  ol.qlist li.qrow:last-child{border-bottom:none;}
  ol.qlist li.qrow::before{
    content:counter(q);
    font-family:'Fraunces',serif; font-weight:700; color:var(--gold);
    font-size:15px; width:22px; flex-shrink:0; padding-top:2px;
  }
  .qbody{flex:1; min-width:0;}
  .qtext{font-size:15px; line-height:1.7;}
  .qtext input.blank{
    font:inherit; font-weight:700; color:var(--dusk);
    border:none; border-bottom:2px solid var(--line);
    background:transparent;
    padding:1px 4px; margin:0 2px;
    width:auto; min-width:70px;
  }
  .qtext input.blank:focus{ outline:none; border-color:var(--dusk); }
  .qtext input.blank.correct{ border-color:var(--ok); color:var(--ok); background:var(--ok-bg); border-radius:5px;}
  .qtext input.blank.wrong{ border-color:var(--bad); color:var(--bad); background:var(--bad-bg); border-radius:5px;}

  input.fullans, textarea.fullans{
    font:inherit; font-size:14.5px;
    width:100%; max-width:560px;
    border:1px solid var(--line); border-radius:9px;
    padding:9px 11px; margin-top:6px;
    background:var(--paper);
    color:var(--ink);
  }
  textarea.fullans{ min-height:44px; resize:vertical; }
  input.fullans:focus, textarea.fullans:focus{ outline:none; border-color:var(--dusk); background:#fff; }
  input.fullans.correct{ border-color:var(--ok); background:var(--ok-bg); }
  input.fullans.wrong{ border-color:var(--bad); background:var(--bad-bg); }

  .feedback{
    margin-top:8px; font-size:13.5px; padding:9px 12px;
    border-radius:9px; display:none; line-height:1.5;
  }
  .feedback.show{display:block;}
  .feedback.ok{ background:var(--ok-bg); color:#33553f;}
  .feedback.bad{ background:var(--bad-bg); color:#7c3524;}
  .feedback b{font-weight:800;}
  .feedback .correct-ans{font-weight:800; color:var(--dusk);}

  .example-box{
    margin-top:8px; font-size:13.5px; color:var(--ink-soft);
    background:var(--paper); border:1px dashed var(--line);
    border-radius:9px; padding:9px 12px; display:none;
  }
  .example-box.show{display:block;}
  .example-box b{color:var(--ink);}
  .link-btn{
    background:none; border:none; padding:0; color:var(--dusk);
    font-size:12.5px; font-weight:700; text-decoration:underline;
    cursor:pointer; margin-top:6px;
  }

  .wordbank{
    display:flex; flex-wrap:wrap; gap:8px; margin:14px 0 20px;
  }
  .wordbank span{
    background:var(--gold-soft); border:1px solid var(--gold);
    color:#6b4a12; font-weight:700; font-size:13px;
    padding:5px 11px; border-radius:999px;
  }
  .cloze-text{ font-size:15.5px; line-height:2.1; }

  footer{
    text-align:center; color:var(--ink-soft); font-size:12.5px;
    padding:20px; border-top:1px solid var(--line);
  }

  @media (max-width:860px){
    .layout{grid-template-columns:1fr;}
    nav.sidenav{
      position:sticky; top:0; height:auto;
      display:flex; overflow-x:auto; gap:4px;
      border-right:none; border-bottom:1px solid var(--line);
      background:var(--paper); z-index:5; padding:12px 16px;
    }
    nav.sidenav .navlabel{display:none;}
    nav.sidenav a{white-space:nowrap; flex-shrink:0;}
    nav.sidenav a span.t{display:none;}
    main{padding:20px 16px 60px;}
    section.exercise{padding:20px 16px;}
  }
</style>
</head>
<body>

<div class="layout">
  <div class="hero">
    <h1>Present Simple: распорядок дня</h1>
    <p class="lead">8 упражнений по 8 заданий — проверка ответов, разбор с объяснением и готовые примеры. Тема — обычный день: от подъёма до сна.</p>
    <div class="timeline" id="timeline"></div>
  </div>

  <nav class="sidenav" id="sidenav"></nav>

  <main id="main"></main>
</div>

<footer>Present Simple Practice · сделано для отработки распорядка дня</footer>

<script>
/* ============ DAILY ROUTINE SEQUENCE (used in hero + word banks) ============ */
const ROUTINE = ["get up","leave home","start work","have lunch","finish work","get home","make dinner","watch TV","go to bed"];

/* ============ NORMALIZATION FOR CHECKING ============ */
function norm(s){
  return (s||"")
    .toLowerCase()
    .replace(/’/g,"'")
    .replace(/\bdo not\b/g,"don't")
    .replace(/\bdoes not\b/g,"doesn't")
    .replace(/[.,!?;:"]/g,"")
    .replace(/\s+/g," ")
    .trim();
}
function matches(input, accepted){
  const n = norm(input);
  if(!n) return false;
  return accepted.some(a => norm(a) === n);
}

/* ============ EXERCISE DATA ============ */
const EXERCISES = [

{ id:"ex1", tag:"Словарь · 1", title:"Переведи на английский", kind:"sentence",
  instr:"Переведи предложения, используя фразы распорядка дня (get up, leave home, have lunch и т.д.). Обрати внимание на окончание -s у глагола после he / she / it.",
  items:[
    {prompt:"Я встаю в 7 утра.", accepted:["I get up at 7 a.m.","I get up at seven a.m.","I get up at 7 am"],
     explain:"get up — «вставать». После <b>I</b> глагол стоит в базовой форме, без -s."},
    {prompt:"Он уходит из дома в 8:15.", accepted:["He leaves home at 8:15.","He leaves home at eight fifteen.","He leaves home at quarter past eight."],
     explain:"leave → <b>leaves</b>: с he/she/it к глаголу на -e добавляем только -s."},
    {prompt:"Она начинает работу в 9 утра.", accepted:["She starts work at 9 a.m.","She starts work at nine a.m.","She starts work at 9 am"],
     explain:"start → <b>starts</b>: стандартное окончание 3-го лица ед. числа."},
    {prompt:"Мы обедаем в час дня.", accepted:["We have lunch at 1 p.m.","We have lunch at one p.m.","We have lunch at one o'clock"],
     explain:"we — форма без окончания: <b>have</b> lunch, а не «has»."},
    {prompt:"Они заканчивают работу в 6 вечера.", accepted:["They finish work at 6 p.m.","They finish work at six p.m.","They finish work at six o'clock"],
     explain:"they — базовая форма глагола: <b>finish</b> (без -es)."},
    {prompt:"Я прихожу домой в половине седьмого.", accepted:["I get home at half past six."],
     explain:"get home — «приходить домой»; half past six = 6:30."},
    {prompt:"Она готовит ужин каждый вечер.", accepted:["She makes dinner every evening."],
     explain:"make → <b>makes</b> (3-е лицо); every evening — маркер регулярности, типичный для Present Simple."},
    {prompt:"Мы ложимся спать в 11 часов.", accepted:["We go to bed at 11 o'clock.","We go to bed at eleven o'clock.","We go to bed at 11."],
     explain:"go to bed — «ложиться спать»; we — глагол без -s."}
  ]
},

{ id:"ex2", tag:"Словарь · 2", title:"Напиши фразу по транскрипции", kind:"sentence",
  instr:"Прочитай транскрипцию про себя и напиши, какая это фраза из распорядка дня.",
  items:[
    {prompt:"/liːv həʊm/", accepted:["leave home"], explain:"«ea» в leave читается [iː], «o» в home — дифтонг [əʊ]."},
    {prompt:"/hæv lʌntʃ/", accepted:["have lunch"], explain:"Оба слова с кратким гласным: [æ] в have, [ʌ] в lunch."},
    {prompt:"/stɑːt wɜːk/", accepted:["start work"], explain:"Долгие гласные [ɑː] и [ɜː] — характерный британский звук в start и work."},
    {prompt:"/ˈfɪnɪʃ wɜːk/", accepted:["finish work"], explain:"Ударение падает на первый слог: FInish."},
    {prompt:"/ɡet həʊm/", accepted:["get home"], explain:"Короткое [e] в get, дифтонг [əʊ] в home."},
    {prompt:"/meɪk ˈdɪnə/", accepted:["make dinner"], explain:"Дифтонг [eɪ] в make; в британском варианте конечная «r» в dinner не читается."},
    {prompt:"/wɒtʃ ˌtiːˈviː/", accepted:["watch TV"], explain:"TV произносится по буквам: [ˌtiːˈviː], основное ударение на второй букве."},
    {prompt:"/ɡəʊ tə bed/", accepted:["go to bed"], explain:"Предлог to в безударной позиции звучит слабо — [tə]."}
  ]
},

{ id:"ex3", tag:"Грамматика", title:"Fill in the gaps — вставь глагол в Present Simple", kind:"blank",
  instr:"Поставь глагол в скобках в правильную форму Present Simple.",
  items:[
    {text:"I usually ___ (get up) at 7 a.m.", blanks:[["get up"]],
     explain:"После <b>I</b> — базовая форма глагола, без окончания."},
    {text:"She ___ (go) to work by bus.", blanks:[["goes"]],
     explain:"Глаголы на -o в 3-м лице ед. числа получают окончание <b>-es</b>: go → goes."},
    {text:"___ you ___ (have) lunch at work?", blanks:[["do"],["have"]],
     explain:"Вопрос с you строится через <b>do</b> + базовая форма глагола: have (без -s)."},
    {text:"He ___ (not / watch) TV in the morning.", blanks:[["doesn't watch","does not watch"]],
     explain:"Отрицание с he/she/it: <b>doesn't</b> + базовая форма (watch, а не watches)."},
    {text:"My sister ___ (start) work at 9 o'clock.", blanks:[["starts"]],
     explain:"My sister = she → 3-е лицо ед. числа → start<b>s</b>."},
    {text:"We ___ (not / have) lunch together on weekends.", blanks:[["don't have","do not have"]],
     explain:"We — множественное число: отрицание через <b>don't</b> + базовая форма."},
    {text:"___ your parents ___ (finish) work early on Fridays?", blanks:[["do"],["finish"]],
     explain:"your parents = they → вопрос через Do, глагол без окончания."},
    {text:"He ___ (make) dinner for the family every day.", blanks:[["makes"]],
     explain:"make → <b>makes</b>: he — 3-е лицо ед. числа."}
  ]
},

{ id:"ex4", tag:"Cloze", title:"Insert the words into the text", kind:"cloze",
  instr:"Вставь в текст подходящие фразы из рамки, изменив форму глагола под подлежащее she (не все слова используются — одно лишнее).",
  bank:["get up","leave home","start work","have lunch","finish work","get home","make dinner","watch TV","go to bed"],
  text:"Anna is a nurse. Every day she ___1 at six o'clock and has a shower. At half past six she ___2 and walks to the bus stop. She ___3 at eight and helps doctors and patients all morning. At half past twelve she ___4 in the hospital canteen. She ___5 at four o'clock, and by five she usually ___6 , tired but happy. In the evening she ___7 for the whole family, and later she often ___8 before going to sleep.",
  blanks:[
    {accepted:["gets up"], explain:"get up → <b>gets up</b>: обычное окончание -s."},
    {accepted:["leaves home"], explain:"leave (на -e) → <b>leaves</b> home."},
    {accepted:["starts work"], explain:"start → <b>starts</b> work."},
    {accepted:["has lunch"], explain:"have — исключение: has, а не «haves»."},
    {accepted:["finishes work"], explain:"finish оканчивается на -sh → добавляем <b>-es</b>: finishes."},
    {accepted:["gets home"], explain:"get → <b>gets</b> home."},
    {accepted:["makes dinner"], explain:"make → <b>makes</b> dinner."},
    {accepted:["watches TV","watches tv"], explain:"watch оканчивается на -tch → добавляем <b>-es</b>: watches."}
  ]
},

{ id:"ex5", tag:"Find the mistake", title:"Найди и исправь ошибку", kind:"sentence",
  instr:"В каждом предложении одна ошибка в форме глагола Present Simple. Впиши исправленное предложение целиком.",
  items:[
    {prompt:"She get up at seven every day.", accepted:["She gets up at seven every day."],
     explain:"3-е лицо ед. числа (she) требует окончания -s: get → <b>gets</b>."},
    {prompt:"He watch TV after dinner.", accepted:["He watches TV after dinner."],
     explain:"Глаголы на -tch добавляют -es: watch → <b>watches</b>."},
    {prompt:"Do she have lunch at home?", accepted:["Does she have lunch at home?"],
     explain:"Для he/she/it в вопросах используется <b>does</b>, а не do."},
    {prompt:"They doesn't finish work until six.", accepted:["They don't finish work until six."],
     explain:"They — множественное число, отрицание через <b>don't</b>, а не doesn't."},
    {prompt:"I usually goes to bed at eleven.", accepted:["I usually go to bed at eleven."],
     explain:"После I глагол без окончания: <b>go</b>, а не goes."},
    {prompt:"He don't make dinner on weekends.", accepted:["He doesn't make dinner on weekends."],
     explain:"He — 3-е лицо ед. числа: отрицание через <b>doesn't</b>."},
    {prompt:"My brother leave home at eight o'clock.", accepted:["My brother leaves home at eight o'clock."],
     explain:"My brother = he → leave<b>s</b> home."},
    {prompt:"We starts work at nine in the morning.", accepted:["We start work at nine in the morning."],
     explain:"We — форма без -s: <b>start</b>, а не starts."}
  ]
},

{ id:"ex6", tag:"Rephrase", title:"Перефразируй предложение", kind:"sentence",
  instr:"Перепиши предложение так, как указано в задании.",
  items:[
    {prompt:"Сделай отрицательным: «I get up at seven.»", accepted:["I don't get up at seven.","I do not get up at seven."],
     explain:"Отрицание: <b>don't</b> + базовая форма глагола (без -s)."},
    {prompt:"Сделай вопросительным: «She has lunch at home.»", accepted:["Does she have lunch at home?"],
     explain:"В вопросе окончание -s «уходит» к does, а глагол возвращается в базовую форму: has → <b>have</b>."},
    {prompt:"Перепиши для he вместо they: «They finish work at six.»", accepted:["He finishes work at six."],
     explain:"He — 3-е лицо ед. числа: finish → <b>finishes</b> (после -sh добавляем -es)."},
    {prompt:"Сделай отрицательным: «He makes dinner every day.»", accepted:["He doesn't make dinner every day.","He does not make dinner every day."],
     explain:"doesn't + базовая форма: <b>make</b> (без -s)."},
    {prompt:"Сделай вопросительным: «We watch TV in the evening.»", accepted:["Do we watch TV in the evening?"],
     explain:"Вопрос с we образуется через <b>do</b>."},
    {prompt:"Перепиши для I вместо my sister: «My sister starts work at nine.»", accepted:["I start work at nine."],
     explain:"I — форма без окончания: <b>start</b>."},
    {prompt:"Сделай отрицательным: «You go to bed late.»", accepted:["You don't go to bed late.","You do not go to bed late."],
     explain:"You — форма без -s, отрицание через <b>don't</b>."},
    {prompt:"Перепиши для the child вместо the children: «The children leave home at eight.»", accepted:["The child leaves home at eight."],
     explain:"the child = он/она (ед. число) → leave<b>s</b>."}
  ]
},

{ id:"ex7", tag:"Творческое · открытые ответы", title:"Finish the sentences — закончи своими идеями", kind:"open",
  instr:"Допиши предложения своими идеями о своём дне. Единственно правильного ответа нет — ориентируйся на пример. Когда закончишь, все ответы можно скопировать одной кнопкой.",
  items:[
    {prompt:"I usually get up at ___.", example:"I usually get up at half past seven."},
    {prompt:"On weekdays I leave home at ___.", example:"On weekdays I leave home at eight o'clock."},
    {prompt:"I have lunch with ___.", example:"I have lunch with my colleagues."},
    {prompt:"In the evening I usually ___.", example:"In the evening I usually watch TV."},
    {prompt:"I never ___ in the morning.", example:"I never make dinner in the morning."},
    {prompt:"My best friend always ___.", example:"My best friend always starts work early."},
    {prompt:"On weekends I don't ___.", example:"On weekends I don't get up early."},

/* ============ RENDER: HERO TIMELINE ============ */
const tl = document.getElementById("timeline");
ROUTINE.forEach((w,i)=>{
  const step = document.createElement("span");
  step.className = "step";
  step.style.animationDelay = (i*0.06)+"s";
  step.innerHTML = `<span class="n">${i+1}</span>${w}`;
  tl.appendChild(step);
  if(i < ROUTINE.length-1){
    const ar = document.createElement("span");
    ar.className="arrow"; ar.textContent="→";
    tl.appendChild(ar);
  }
});

/* ============ RENDER: NAV ============ */
const nav = document.getElementById("sidenav");
nav.innerHTML = `<div class="navlabel">Упражнения</div>` + EXERCISES.map((e,i)=>
  `<a href="#${e.id}"><span class="num">${String(i+1).padStart(2,"0")}</span><span class="t">${e.title}</span></a>`
).join("");

/* ============ RENDER: MAIN ============ */
const main = document.getElementById("main");

EXERCISES.forEach((ex, exIdx) => {
  const section = document.createElement("section");
  section.className = "exercise";
  section.id = ex.id;

  const head = document.createElement("div");
  head.className = "exhead";
  head.innerHTML = `
    <div>
      <span class="tag">${ex.tag}</span>
      <h2>${exIdx+1}. ${ex.title}</h2>
      <p class="instr">${ex.instr}</p>
    </div>
  `;
  const btnrow = document.createElement("div");
  btnrow.className = "btnrow";
  section.appendChild(head);

  if(ex.kind === "open"){
    // ---- OPEN-ENDED EXERCISES (ex7, ex8) ----
    const list = document.createElement("ol");
    list.className = "qlist";
    ex.items.forEach((item,i)=>{
      const li = document.createElement("li");
      li.className = "qrow";
      li.innerHTML = `
        <div class="qbody">
          <div class="qtext">${item.prompt}</div>
          <textarea class="fullans" data-idx="${i}" placeholder="Твой вариант..."></textarea>
          <button class="link-btn" data-role="showex" data-idx="${i}">Показать пример</button>
          <div class="example-box" data-idx="${i}"><b>Пример:</b> ${item.example}</div>
        </div>`;
      list.appendChild(li);
    });
    section.appendChild(list);

    btnrow.innerHTML = `<button class="btn-copy" data-role="copyall">Скопировать все ответы</button>
                         <button class="btn-ghost" data-role="reset">Очистить</button>`;
    section.insertBefore(btnrow, list);

    section.addEventListener("click",(e)=>{
      const role = e.target.getAttribute("data-role");
      if(role === "showex"){
        const idx = e.target.getAttribute("data-idx");
        const box = section.querySelector(`.example-box[data-idx="${idx}"]`);
        box.classList.toggle("show");
        e.target.textContent = box.classList.contains("show") ? "Скрыть пример" : "Показать пример";
      }
      if(role === "copyall"){
        const answers = Array.from(section.querySelectorAll("textarea.fullans"))
          .map((t,i)=> `${i+1}. ${ex.items[i].prompt}\n→ ${t.value.trim() || "(нет ответа)"}`);
        const out = `${ex.title}\n\n` + answers.join("\n\n");
        copyToClipboard(out, e.target);
      }
      if(role === "reset"){
        section.querySelectorAll("textarea.fullans").forEach(t=>t.value="");
        section.querySelectorAll(".example-box").forEach(b=>b.classList.remove("show"));
        section.querySelectorAll(".link-btn").forEach(b=>b.textContent="Показать пример");
      }
    });

  } else if(ex.kind === "sentence"){
    // ---- FULL-SENTENCE ANSWER EXERCISES (ex1, ex2, ex5, ex6) ----
    const list = document.createElement("ol");
    list.className = "qlist";
    ex.items.forEach((item,i)=>{
      const li = document.createElement("li");
      li.className = "qrow";
      li.innerHTML = `
        <div class="qbody">
          <div class="qtext">${item.prompt}</div>
          <input class="fullans" type="text" data-idx="${i}" placeholder="Твой ответ...">
          <div class="feedback" data-idx="${i}"></div>
        </div>`;
      list.appendChild(li);
    });
    section.appendChild(list);

    btnrow.innerHTML = `<button class="btn-primary" data-role="check">Проверить ответы</button>
                         <button class="btn-ghost" data-role="reveal">Показать ответы</button>
                         <button class="btn-ghost" data-role="reset">Очистить</button>
                         <span class="score" data-role="score"></span>`;
    section.insertBefore(btnrow, list);

    section.addEventListener("click",(e)=>{
      const role = e.target.getAttribute("data-role");
      if(role === "check") checkSentences(section, ex, false);
      if(role === "reveal") checkSentences(section, ex, true);
      if(role === "reset") resetSentences(section);
    });

  } else if(ex.kind === "blank"){
    // ---- FILL-IN-THE-BLANK EXERCISE (ex3) ----
    const list = document.createElement("ol");
    list.className = "qlist";
    ex.items.forEach((item,i)=>{
      const parts = item.text.split("___");
      let html = "";
      parts.forEach((p,pi)=>{
        html += p;
        if(pi < parts.length-1){
          html += `<input class="blank" type="text" data-i="${i}" data-b="${pi}" size="8">`;
        }
      });
      const li = document.createElement("li");
      li.className = "qrow";
      li.innerHTML = `
        <div class="qbody">
          <div class="qtext">${html}</div>
          <div class="feedback" data-idx="${i}"></div>
        </div>`;
      list.appendChild(li);
    });
    section.appendChild(list);

    btnrow.innerHTML = `<button class="btn-primary" data-role="check">Проверить ответы</button>
                         <button class="btn-ghost" data-role="reveal">Показать ответы</button>
                         <button class="btn-ghost" data-role="reset">Очистить</button>
                         <span class="score" data-role="score"></span>`;
    section.insertBefore(btnrow, list);

    section.addEventListener("click",(e)=>{
      const role = e.target.getAttribute("data-role");
      if(role === "check") checkBlanks(section, ex, false);
      if(role === "reveal") checkBlanks(section, ex, true);
      if(role === "reset") resetBlanks(section);
    });

  } else if(ex.kind === "cloze"){
    // ---- CLOZE PARAGRAPH EXERCISE (ex4) ----
    const bank = document.createElement("div");
    bank.className = "wordbank";
    bank.innerHTML = ex.bank.map(w=>`<span>${w}</span>`).join("");
    section.appendChild(bank);

    const parts = ex.text.split(/___\d/);
    let html = "";
    parts.forEach((p,pi)=>{
      html += p;
      if(pi < parts.length-1){
        html += `<input class="blank" type="text" data-b="${pi}" size="11">`;
      }
    });
    const wrap = document.createElement("div");
    wrap.className = "cloze-text";
    wrap.innerHTML = html;
    section.appendChild(wrap);

    const fb = document.createElement("div");
    fb.className = "feedback";
    fb.id = "cloze-feedback";
    section.appendChild(fb);

    btnrow.innerHTML = `<button class="btn-primary" data-role="check">Проверить ответы</button>
                         <button class="btn-ghost" data-role="reveal">Показать ответы</button>
                         <button class="btn-ghost" data-role="reset">Очистить</button>
                         <span class="score" data-role="score"></span>`;
    section.insertBefore(btnrow, bank);

    section.addEventListener("click",(e)=>{
      const role = e.target.getAttribute("data-role");
      if(role === "check") checkCloze(section, ex, false);
      if(role === "reveal") checkCloze(section, ex, true);
      if(role === "reset") resetCloze(section);
    });
  }

  main.appendChild(section);
});

/* ============ CHECK / REVEAL LOGIC ============ */

function checkSentences(section, ex, revealOnly){
  let correctCount = 0;
  ex.items.forEach((item,i)=>{
    const input = section.querySelector(`input.fullans[data-idx="${i}"]`);
    const fb = section.querySelector(`.feedback[data-idx="${i}"]`);
    let isCorrect = false;
    if(revealOnly){
      input.value = item.accepted[0];
      input.classList.remove("wrong"); input.classList.add("correct");
      isCorrect = true;
    } else {
      isCorrect = matches(input.value, item.accepted);
      input.classList.remove("correct","wrong");
      input.classList.add(isCorrect ? "correct" : "wrong");
    }
    if(isCorrect) correctCount++;
    fb.className = "feedback show " + (isCorrect ? "ok" : "bad");
    fb.innerHTML = (isCorrect
      ? `<b>${revealOnly ? "Ответ:" : "Верно!"}</b> `
      : `<b>Неверно.</b> Правильно: <span class="correct-ans">${item.accepted[0]}</span>. `)
      + item.explain;
  });
  const scoreEl = section.querySelector('[data-role="score"]');
  if(!revealOnly){
    scoreEl.textContent = `${correctCount} / ${ex.items.length} правильно`;
    scoreEl.className = "score" + (correctCount===ex.items.length ? " ok" : "");
  } else {
    scoreEl.textContent = "";
  }
}

function resetSentences(section){
  section.querySelectorAll("input.fullans").forEach(i=>{ i.value=""; i.classList.remove("correct","wrong"); });
  section.querySelectorAll(".feedback").forEach(f=>{ f.classList.remove("show"); f.innerHTML=""; });
  const scoreEl = section.querySelector('[data-role="score"]');
  if(scoreEl) scoreEl.textContent = "";
}

function checkBlanks(section, ex, revealOnly){
  let correctCount = 0;
  ex.items.forEach((item,i)=>{
    const inputs = section.querySelectorAll(`input.blank[data-i="${i}"]`);
    const fb = section.querySelector(`.feedback[data-idx="${i}"]`);
    let allCorrect = true;
    inputs.forEach((inp,bi)=>{
      const accepted = item.blanks[bi];
      let ok;
      if(revealOnly){
        inp.value = accepted[0];
        ok = true;
      } else {
        ok = matches(inp.value, accepted);
        if(!ok) allCorrect = false;
      }
      inp.classList.remove("correct","wrong");
      inp.classList.add(ok ? "correct" : "wrong");
    });
    if(allCorrect) correctCount++;
    const answerStr = item.blanks.map(b=>b[0]).join(" ... ");
    fb.className = "feedback show " + (allCorrect ? "ok" : "bad");
    fb.innerHTML = (allCorrect
      ? `<b>${revealOnly ? "Ответ:" : "Верно!"}</b> `
      : `<b>Неверно.</b> Правильно: <span class="correct-ans">${answerStr}</span>. `)
      + item.explain;
  });
  const scoreEl = section.querySelector('[data-role="score"]');
  if(!revealOnly){
    scoreEl.textContent = `${correctCount} / ${ex.items.length} правильно`;
    scoreEl.className = "score" + (correctCount===ex.items.length ? " ok" : "");
  } else {
    scoreEl.textContent = "";
  }
}

function resetBlanks(section){
  section.querySelectorAll("input.blank").forEach(i=>{ i.value=""; i.classList.remove("correct","wrong"); });
  section.querySelectorAll(".feedback").forEach(f=>{ f.classList.remove("show"); f.innerHTML=""; });
  const scoreEl = section.querySelector('[data-role="score"]');
  if(scoreEl) scoreEl.textContent = "";
}

function checkCloze(section, ex, revealOnly){
  const inputs = section.querySelectorAll("input.blank");
  const fb = section.querySelector("#cloze-feedback") || section.querySelector(".feedback");
  let correctCount = 0;
  let details = [];
  inputs.forEach((inp,i)=>{
    const b = ex.blanks[i];
    let ok;
    if(revealOnly){
      inp.value = b.accepted[0];
      ok = true;
    } else {
      ok = matches(inp.value, b.accepted);
    }
    inp.classList.remove("correct","wrong");
    inp.classList.add(ok ? "correct" : "wrong");
    if(ok) correctCount++;
    details.push(`<div style="margin-top:6px;"><b>${i+1}.</b> ${ok ? "" : `правильно — <span class="correct-ans">${b.accepted[0]}</span>. `}${b.explain}</div>`);
  });
  fb.className = "feedback show " + (correctCount===inputs.length ? "ok" : "bad");
  fb.innerHTML = `<b>${revealOnly ? "Ответы и объяснения:" : (correctCount+"/"+inputs.length+" правильно.")}</b>` + details.join("");
  const scoreEl = section.querySelector('[data-role="score"]');
  if(scoreEl) scoreEl.textContent = "";
}

function resetCloze(section){
  section.querySelectorAll("input.blank").forEach(i=>{ i.value=""; i.classList.remove("correct","wrong"); });
  const fb = section.querySelector("#cloze-feedback");
  if(fb){ fb.classList.remove("show"); fb.innerHTML=""; }
}

/* ============ CLIPBOARD ============ */
function copyToClipboard(text, btn){
  const done = ()=>{
    const old = btn.textContent;
    btn.textContent = "Скопировано ✓";
    setTimeout(()=>{ btn.textContent = old; }, 1600);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}
function fallbackCopy(text, done){
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand("copy"); done(); }catch(e){}
  document.body.removeChild(ta);
}
