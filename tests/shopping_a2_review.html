<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shopping A2 — повторение</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1b1f2a;--mu:#5d6679;--ac:#2f6fed;--ok:#1a8f4c;--bad:#d03b3b;--bd:#dde1ea;--hl:#fff1b8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--card:#1c212c;--tx:#e8ecf4;--mu:#9aa4b8;--ac:#6c9bff;--ok:#4fd18a;--bad:#ff7b7b;--bd:#2c3342;--hl:#5a4b10}}
:root[data-theme="dark"]{--bg:#12151c;--card:#1c212c;--tx:#e8ecf4;--mu:#9aa4b8;--ac:#6c9bff;--ok:#4fd18a;--bad:#ff7b7b;--bd:#2c3342;--hl:#5a4b10}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:18px 16px 8px;max-width:1150px;margin:auto}
h1{margin:0 0 6px;font-size:24px}h2{margin:0 0 4px;font-size:19px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:16px;max-width:1150px;margin:auto;padding:8px 16px 40px}
@media(max-width:820px){.layout{grid-template-columns:1fr}aside{order:-1;position:static!important}}
aside{position:sticky;top:12px;align-self:start}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.instr{color:var(--mu);margin:0 0 10px;font-size:14px}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:9px;padding:6px 12px}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff}
input,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:6px 9px;min-width:0}
input{width:min(100%,380px)}textarea{width:100%;box-sizing:border-box}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:7px 0}
.n{color:var(--mu);width:20px}.p{flex:1 1 220px}
.fb{font-weight:600;min-width:20px}.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}.fb.show{color:var(--ac);font-weight:500}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}.score{font-weight:600}
.vg{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px}
.vg div{display:flex;gap:6px;align-items:center;font-size:14px}.ipa{color:var(--mu)}
.read{line-height:2.2}
.tile{margin:3px;padding:5px 10px}.tile.on{background:var(--hl)}.built{min-height:40px;border:1px dashed var(--bd);border-radius:9px;padding:3px;flex:1 1 100%}
.pool{flex:1 1 100%}.bank{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}.chip{background:var(--hl);border-radius:20px;padding:2px 11px;font-size:14px}
#plist div{display:flex;justify-content:space-between;gap:6px;padding:3px 0;border-bottom:1px solid var(--bd);font-size:14px}
#plist span.c{color:var(--bad);font-weight:700}
#out{height:150px;margin-top:8px}
</style></head><body>
<header>
<h1>🔁 Shopping — повторение</h1>
<div class="row"><input id="nm" placeholder="Имя ученика / Student name" style="width:240px">
<button class="pri" id="tst">🔊 Проверить звук</button><span class="ipa">Голос: <b id="vname">…</b></span>
<button id="theme">🌓</button></div>
<div class="instr" id="ttsnote"></div>
</header>
<div class="layout"><main id="main"></main>
<aside><div class="card"><h2>⚠️ Проблемные слова</h2><p class="instr">Слова с ошибками (нажми — услышишь).</p><div id="plist"><i class="instr">Пока пусто 🎉</i></div><div class="bar"><button id="pclr">Очистить</button></div></div></aside></div>
<script>
const $=s=>document.querySelector(s);
const h=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const norm=s=>s.toLowerCase().replace(/[’`]/g,"'").replace(/[.,!?;:"]/g,'').replace(/\s+/g,' ').trim();
let ITEMS=[];const P={};

/* AUDIO */
const TTS='speechSynthesis' in window;let voice=null;
function pickVoice(){if(!TTS)return;const vs=speechSynthesis.getVoices();
 voice=vs.find(v=>/Google US English/i.test(v.name))||vs.find(v=>/Samantha/i.test(v.name))||vs.find(v=>v.lang==='en-US'||v.lang==='en_US')||vs.find(v=>/^en/i.test(v.lang))||null;
 $('#vname').textContent=voice?voice.name+' ('+voice.lang+')':'голос по умолчанию (en-US)'}
if(TTS){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}else{$('#vname').textContent='не поддерживается';$('#ttsnote').textContent='Браузер не поддерживает озвучку. Откройте страницу в Chrome / Safari.'}
function say(t,r=.9){if(!TTS)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';if(voice)u.voice=voice;u.rate=r;speechSynthesis.speak(u)}
$('#tst').onclick=()=>{pickVoice();say("Hello! Can I try on these jeans?")};
$('#theme').onclick=()=>{const r=document.documentElement;r.dataset.theme=(r.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))==='dark'?'light':'dark'};

/* PROBLEMS */
function addP(t){P[t]=(P[t]||0)+1;renderP()}
function renderP(){const b=$('#plist');b.innerHTML='';const k=Object.keys(P).sort((a,c)=>P[c]-P[a]);if(!k.length){b.innerHTML='<i class="instr">Пока пусто 🎉</i>';return}
 k.forEach(w=>{const d=h('div');const a=h('a',null,'🔊 '+w);a.style.cursor='pointer';a.onclick=()=>say(w);d.append(a,h('span','c','×'+P[w]));b.append(d)})}
$('#pclr').onclick=()=>{for(const k in P)delete P[k];renderP()};

/* ENGINE */
function addItem(ex,wrap,o){const fb=h('span','fb');wrap.append(fb);
 const it={ex,fb,get:o.get,ans:o.ans,tag:o.tag,label:o.label,judge:(v,a)=>a.split('|').some(x=>norm(x)===norm(v)),ok:null,lg:false};ITEMS.push(it);return it}
function check(ex,sc){let ok=0,tot=0;ITEMS.filter(i=>i.ex===ex).forEach(i=>{tot++;const v=i.get();if(!v.trim()){i.ok=null;i.fb.textContent='';return}
 const r=i.judge(v,i.ans);i.ok=r;i.fb.textContent=r?'✅':'❌';i.fb.className='fb '+(r?'ok':'bad');if(r)ok++;else if(!i.lg){i.lg=true;addP(i.tag)}});sc.textContent=`✅ ${ok} / ${tot}`}
function reveal(ex){ITEMS.filter(i=>i.ex===ex).forEach(i=>{i.fb.textContent=' → '+i.ans.split('|')[0];i.fb.className='fb show'})}
function sec(id,title,instr,build){const s=h('section','card');s.id=id;s.innerHTML=`<h2>${title}</h2><p class="instr">${instr}</p>`;
 const body=h('div'),bar=h('div','bar'),sc=h('span','score');s.append(body,bar);
 const run=()=>{ITEMS=ITEMS.filter(i=>i.ex!==id);body.innerHTML='';sc.textContent='';build(body,id)};
 const b1=h('button','pri','Проверить'),b2=h('button',null,'Показать ответы'),b3=h('button',null,'Заново');
 b1.onclick=()=>check(id,sc);b2.onclick=()=>reveal(id);b3.onclick=run;bar.append(b1,b2,b3,sc);run();$('#main').append(s)}
const inp=()=>{const i=h('input');i.autocomplete='off';i.spellcheck=false;i.autocapitalize='off';return i};
function textList(arr,play){return(body,id)=>shuf(arr).forEach(([p,a,t],n)=>{const r=h('div','row');r.append(h('span','n',n+1));
 if(play){const b=h('button',null,'▶');b.onclick=()=>say(p);const s=h('button',null,'🐢');s.onclick=()=>say(p,.55);r.append(b,s)}else r.append(h('span','p',p));
 const i=inp();r.append(i);addItem(id,r,{get:()=>i.value,ans:a,tag:t,label:play?'🔊 (dictation)':p});body.append(r)})}

/* VOCAB REMINDER */
const W=[['self-service checkout','касса самообслуж.','/ˌself ˈsɜːvɪs ˈtʃekaʊt/'],['shop assistant','продавец','/ʃɒp əˈsɪstənt/'],['trolley','тележка','/ˈtrɒli/'],['customer','покупатель','/ˈkʌstəmə/'],['shopping bag','пакет','/ˈʃɒpɪŋ bæɡ/'],['basket','корзина','/ˈbɑːskɪt/'],['receipt','чек','/rɪˈsiːt/'],['the sales','распродажа','/ðə seɪlz/'],['changing room','примерочная','/ˈtʃeɪndʒɪŋ ruːm/'],['shelf / shelves','полка / полки','/ʃelf/ – /ʃelvz/'],['till','касса','/tɪl/'],['chain store','сеть магазинов','/tʃeɪn stɔː/'],['size','размер','/saɪz/'],['try on','примерять','/traɪ ɒn/'],['fit','подходить по размеру','/fɪt/'],['suit','идти (к лицу)','/suːt/'],['take back','возвращать','/teɪk bæk/']];
(()=>{const s=h('section','card');s.innerHTML='<h2>📚 Быстрое напоминание</h2><p class="instr">Нажми 🔊 и повтори слово вслух.</p>';const g=h('div','vg');
 W.forEach(w=>{const d=h('div');const b=h('button',null,'🔊');b.onclick=()=>say(w[0].replace('/',','));const t=h('span');t.innerHTML=`<b>${w[0]}</b> — ${w[1]} <span class="ipa">${w[2]}</span>`;d.append(b,t);g.append(d)});s.append(g);$('#main').append(s)})();

/* 1. TRANSLATE */
sec('e1','1. Переведи на английский','Напиши перевод руками. Регистр и точки не важны.',textList([
['Мне нужна другая корзина.','I need another basket.|I need a different basket.','basket'],
['Где я могу найти продавца?','Where can I find a shop assistant?','shop assistant'],
['Эти брюки вам очень идут!','These trousers really suit you!|Those trousers really suit you!','suit'],
['Можно примерить эти джинсы?','Can I try on these jeans?','try on'],
['Я хочу вернуть эту футболку в магазин.',"I want to take this T-shirt back.|I want to take back this T-shirt.|I want to take this T-shirt back to the shop.|I'm going to take this T-shirt back.",'take back'],
['На полках много обуви.','There are a lot of shoes on the shelves.|There are many shoes on the shelves.','shelves'],
['Какой у тебя размер обуви?',"What shoe size are you?|What is your shoe size?|What's your shoe size?",'size'],
['Покупатели ждут у кассы.','The customers are waiting at the till.|Customers are waiting at the till.|The customers wait at the till.','customer / till'],
['Положи покупки в пакет.','Put the shopping in the shopping bag.|Put your shopping in the shopping bag.|Put the shopping in a shopping bag.|Put your shopping in a shopping bag.','shopping bag']]));

/* 2. DICTATION */
sec('e2','2. Запиши то, что слышишь','▶ — обычная скорость, 🐢 — медленно. Напиши фразу полностью.',textList([
['Do you have this shirt in a smaller size?','Do you have this shirt in a smaller size?','size'],
['The changing room is next to the shelves.','The changing room is next to the shelves.','changing room / shelves'],
["I'm looking for a shop assistant.","I'm looking for a shop assistant.|I am looking for a shop assistant.",'shop assistant'],
["These shoes don't fit me.","These shoes don't fit me.|These shoes do not fit me.",'fit'],
['That red dress really suits you.','That red dress really suits you.','suit'],
['Please take a trolley or a basket.','Please take a trolley or a basket.|Take a trolley or a basket, please.','trolley / basket'],
["I'd like to take back this bag.","I'd like to take back this bag.|I would like to take back this bag.|I'd like to take this bag back.|I would like to take this bag back.",'take back'],
["Don't forget your receipt!","Don't forget your receipt!|Do not forget your receipt!",'receipt']],1));

/* 3. BUILD THE CHUNK */
const C=['Can I pay at the self-service checkout?','The customer is looking for the changing room.','I need a bigger size, please.','These jeans fit me very well.','She wants to try on a blue jacket.','Put your shopping in the basket.','The sales begin on Friday.','Why do you want to take it back?'];
const CT=['self-service checkout','customer / changing room','size','fit','try on','basket','the sales','take back'];
sec('e3','3. Build the chunk','Нажимай на слова, чтобы собрать предложение. Нажми на слово в рамке — оно вернётся назад.',(body,id)=>{
 shuf(C.map((s,i)=>i)).forEach((k,n)=>{const s=C[k],w=s.split(' ');let ord=shuf(w.map((_,i)=>i));while(ord.join()===w.map((_,i)=>i).join())ord=shuf(ord);
  const sel=[],r=h('div','row'),bt=h('div','built'),pl=h('div','pool');r.append(h('span','n',n+1),bt,pl);
  const draw=()=>{bt.innerHTML='';sel.forEach(i=>{const b=h('button','tile on',w[i]);b.onclick=()=>{sel.splice(sel.indexOf(i),1);draw()};bt.append(b)});
   pl.innerHTML='';ord.filter(i=>!sel.includes(i)).forEach(i=>{const b=h('button','tile',w[i]);b.onclick=()=>{sel.push(i);draw()};pl.append(b)})};draw();
  addItem(id,r,{get:()=>sel.map(i=>w[i]).join(' '),ans:s,tag:CT[k],label:'build (scrambled)'});body.append(r)})});

/* 4. GAP FILL */
const G=[['chain store','chain store'],['the sales|sales','the sales'],['trolley','trolley'],['shop assistant','shop assistant'],['shelves|shelf','shelves'],['size','size'],['try on','try on'],['changing room','changing room'],['fit','fit'],['suited|suits|suit','suited']];
const T4='On Sunday I visited a big [0] with my sister because [1] had just begun. We took a [2] because we wanted to buy a lot. First, a [3] helped us find shirts on the [4]. My sister asked, "What [5] are you?" She wanted to [6] a dress, so we went to the [7]. The dress didn\'t [8] her, but the green skirt really [9] her! We paid at the till and kept the receipt.';
sec('e4','4. Вставь слова в текст','Впиши слова из банка (каждое — один раз). Следи за формой глагола!',(body,id)=>{
 const bk=h('div','bank');shuf(G).forEach(g=>bk.append(h('span','chip',g[1])));const p=h('p','read');
 T4.split(/\[(\d)\]/).forEach((x,i)=>{if(i%2===0)p.append(x);else{const n=+x,w=h('span');const t=inp();t.style.width='150px';t.style.margin='0 3px';w.append(t);
  addItem(id,w,{get:()=>t.value,ans:G[n][0],tag:G[n][1],label:'gap '+(n+1)});p.append(w)}});body.append(bk,p)});

/* COPY */
const EX={e1:'1. Translation',e2:'2. Dictation',e3:'3. Build the chunk',e4:'4. Gap fill'};
const sf=h('section','card');sf.innerHTML='<h2>📋 Ответы ученика</h2><p class="instr">Собрать все ответы с отметками ✔/✘ и скопировать — для отправки учителю.</p>';
const cb=h('button','pri','Собрать и скопировать ответы'),out=h('textarea');out.id='out';out.readOnly=true;
cb.onclick=async()=>{let t='A2 Shopping — review answers\nStudent: '+($('#nm').value||'—')+'\n';let cur='';
 ITEMS.forEach(i=>{if(i.ex!==cur){cur=i.ex;t+='\n'+EX[cur]+'\n'}t+=`• ${i.label} → ${i.get()||'—'}  ${i.ok==null?'':i.ok?'✔':'✘ (correct: '+i.ans.split('|')[0]+')'}\n`});
 const pk=Object.keys(P);t+='\nProblem words: '+(pk.length?pk.map(k=>k+' ×'+P[k]).join(', '):'none')+'\n';out.value=t;
 try{await navigator.clipboard.writeText(t);cb.textContent='✅ Скопировано!'}catch(e){out.select();try{document.execCommand('copy');cb.textContent='✅ Скопировано!'}catch(_){cb.textContent='Скопируйте текст ниже вручную'}}
 setTimeout(()=>cb.textContent='Собрать и скопировать ответы',2500)};
sf.append(cb,out);$('#main').append(sf);
</script></body></html>
