<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shops Vocab Lab</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff3d6;--ink:#2b2140;--cd:#fff;--mut:#6b6280;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1b1430;--ink:#f3eeff;--cd:#2a2145;--mut:#b4a9d0}}
:root[data-theme=dark]{--bg:#1b1430;--ink:#f3eeff;--cd:#2a2145;--mut:#b4a9d0}
html{color-scheme:light dark;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 17px/1.45 Fredoka,Nunito,system-ui,sans-serif;background-image:radial-gradient(var(--mut) 1px,transparent 1px);background-size:26px 26px}
header{text-align:center;padding:22px 12px 6px}
h1{margin:0;font-size:clamp(28px,6vw,46px);letter-spacing:-1px}
h1 span{background:#ff6b9d;color:#2b2140;padding:0 12px;border:3px solid var(--ink);border-radius:14px;display:inline-block;transform:rotate(-2deg);box-shadow:4px 4px 0 var(--ink)}
#pg{margin-top:10px;font-weight:600}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:20px;max-width:1100px;margin:14px auto;padding:0 14px}
aside{position:sticky;top:calc(12px + env(safe-area-inset-top,0px));align-self:start;background:var(--cd);border:3px solid var(--ink);border-radius:18px;box-shadow:5px 5px 0 var(--ink);padding:12px}
aside h3{margin:0 0 8px;font-size:18px}
aside table{width:100%;border-collapse:collapse;font-size:15px}
aside td{padding:4px 2px;border-bottom:1px dashed var(--mut)}aside td:last-child{text-align:right;font-weight:600;color:#ff5a5f}
.card{background:var(--cd);border:3px solid var(--ink);border-radius:20px;box-shadow:6px 6px 0 var(--ink);margin-bottom:24px;overflow:hidden}
.card>*:not(h2){margin-left:16px;margin-right:16px}
h2{margin:0 0 10px;padding:10px 16px;background:var(--c,#7ad7f0);color:#2b2140;border-bottom:3px solid var(--ink);font-size:21px;display:flex;gap:10px;align-items:center}
h2 i{font-style:normal;background:#2b2140;color:#fff;border-radius:50%;min-width:30px;height:30px;display:grid;place-items:center;font-size:16px}
.hint{color:var(--mut);margin-top:0}
.it{padding:10px 0;border-bottom:1px dashed var(--mut)}
.q{margin-bottom:8px;font-size:18px}.big{font-size:38px}
.opts,.chips{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;cursor:pointer;color:var(--ink)}
.opt,.chip,.bar button,.btn{border:3px solid var(--ink);background:var(--cd);border-radius:12px;padding:6px 12px;box-shadow:2px 2px 0 var(--ink)}
.chip{cursor:pointer;user-select:none}
.opt:active,.bar button:active{transform:translate(2px,2px);box-shadow:none}
.sel{background:#ffd23f!important;color:#2b2140!important}
.ok{background:#b8f0d3!important;color:#12402a!important;border-color:#2ec27e!important}
.bad{background:#ffc9cb!important;color:#5a1115!important;border-color:#ff5a5f!important}
.miss{outline:3px dashed #2ec27e;outline-offset:2px}
input{width:100%;font:inherit;padding:8px 12px;border:3px solid var(--ink);border-radius:12px;background:var(--bg);color:var(--ink)}
input.ok{border-color:#2ec27e}input.bad{border-color:#ff5a5f}
.txt{font-size:19px;line-height:2}
.ph{cursor:pointer;border-radius:8px;padding:2px 1px}.ph:hover{background:rgba(255,210,63,.45)}.ph.sel{padding:2px 4px}
.sc2{display:inline-block;background:#2b2140;color:#fff;border-radius:8px;padding:0 8px;margin:2px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 0 16px}
.bar .go{background:#2ec27e;color:#12402a}.bar .st{background:#ff6b9d;color:#2b2140}.bar .sw{background:#7ad7f0;color:#2b2140}
.sc{font-size:20px}
.lock{opacity:.35;pointer-events:none;filter:blur(3px)}
.spk{border:none;background:none;font-size:20px;padding:0 4px}
.wl{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-bottom:12px}
.wc{display:flex;align-items:center;gap:10px;border:3px solid var(--ink);border-radius:14px;padding:8px 10px;background:var(--bg)}
.wc .em{font-size:30px}.wc div{flex:1;display:flex;flex-direction:column;line-height:1.25}.wc small{color:var(--mut)}
textarea{width:calc(100% - 32px);height:150px;margin:8px 16px;font:14px monospace;border:3px solid var(--ink);border-radius:12px;background:var(--bg);color:var(--ink);padding:8px}
@media(max-width:820px){.wrap{grid-template-columns:1fr}aside{position:static;order:-1}}
</style></head><body>
<header><h1><span>Shops</span> Vocab Lab 🛍️</h1><div id="pg"></div></header>
<div class="wrap"><main id="m"></main>
<aside><h3>Проблемные слова 🚩</h3><table id="pw"></table></aside></div>
<script>
const $=s=>document.querySelector(s);
const sh=a=>{a=[...a];for(let i=a.length;i>1;){const j=Math.random()*i--|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const norm=s=>s.toLowerCase().replace(/[^a-z0-9\s-]/g,'').replace(/-/g,' ').replace(/\s+/g,' ').trim();
const W=[
["travel agent’s","турагентство","/ˈtrævl ˌeɪdʒənts/","✈️"],["newsagent’s","газетный киоск, магазин прессы","/ˈnjuːzˌeɪdʒənts/","📰"],["hairdresser’s","парикмахерская","/ˈheəˌdresəz/","💇"],["jeweller’s","ювелирный магазин","/ˈdʒuːələz/","💍"],["fishmonger’s","рыбный магазин","/ˈfɪʃˌmʌŋɡəz/","🐟"],["barber’s","мужская парикмахерская","/ˈbɑːbəz/","💈"],["dry-cleaner’s","химчистка","/ˌdraɪ ˈkliːnəz/","👔"],["estate agent’s","агентство недвижимости","/ɪˈsteɪt ˌeɪdʒənts/","🏠"],["butcher’s","мясная лавка","/ˈbʊtʃəz/","🥩"],["stationer’s","магазин канцтоваров","/ˈsteɪʃənəz/","✏️"],["baker’s / bakery","пекарня, булочная","/ˈbeɪkəz/ · /ˈbeɪkəri/","🥖",["baker’s","bakery"]],["greengrocer’s","овощной магазин","/ˈɡriːnˌɡrəʊsəz/","🥦"],["convenience store / shop","магазин у дома","/kənˈviːniəns stɔː/","🏪",["convenience store","convenience shop"]],["chemist’s / pharmacy","аптека","/ˈkemɪsts/ · /ˈfɑːməsi/","💊",["chemist’s","pharmacy"]],["bookshop / bookstore","книжный магазин","/ˈbʊkʃɒp/","📚",["bookshop","bookstore"]],["electronics shop / store","магазин электроники","/ɪˌlekˈtrɒnɪks ʃɒp/","📺",["electronics shop","electronics store"]],["shoe shop / store","обувной магазин","/ˈʃuː ʃɒp/","👟",["shoe shop","shoe store"]],["clothes shop / clothing store","магазин одежды","/ˈkləʊðz ʃɒp/","👗",["clothes shop","clothing store"]]];
let lp=-1;
const mix=(a,o)=>{let x;do{x=sh([a,...o])}while(x.indexOf(a)===lp);lp=x.indexOf(a);return x};
const mc=(q,a,o,w,say)=>({k:'mc',q,a,o:mix(a,o),w,say});
const oth=(w,n)=>sh(W.filter(x=>x!==w)).slice(0,n);
const ans=w=>[w[0],...(w[4]||[])];
const find=e=>W.find(x=>x[0]===e);
const CX=[["I need to book a flight and a hotel for my summer holiday.","travel agent’s"],["I’d like to buy a daily paper and a magazine.","newsagent’s"],["My sister wants her hair coloured and styled.","hairdresser’s"],["I want to buy a gold ring for my wife.","jeweller’s"],["We’re having salmon tonight, so we need really fresh fish.","fishmonger’s"],["My dad wants a short back and sides and a shave.","barber’s"],["My suit needs cleaning before the wedding.","dry-cleaner’s"],["We’re looking for a flat to rent in the city centre.","estate agent’s"],["Mum is buying sausages and a leg of lamb.","butcher’s"],["I need a notebook, some pens and envelopes.","stationer’s"],["Let’s get some fresh bread and a croissant.","baker’s / bakery"],["I want lettuce, tomatoes and a kilo of apples.","greengrocer’s"],["We’ve run out of milk and it’s 10 p.m. Which shop is still open?","convenience store / shop"],["I need to pick up my prescription.","chemist’s / pharmacy"],["I’m looking for a new novel to read on the plane.","bookshop / bookstore"],["My phone is broken and I need a new charger.","electronics shop / store"],["These trainers are too small. I need new boots.","shoe shop / store"],["I need a new jacket and a pair of jeans.","clothes shop / clothing store"]];
const SIT=[["Your wedding suit is dirty.","dry-cleaner’s","dry clean","I’ll take my suit to the dry-cleaner’s tomorrow."],["You want to book a trip to Spain.","travel agent’s","travel agent","I’ll go to the travel agent’s to book a trip."],["You’re looking for a new flat.","estate agent’s","estate agent","I’ll ask the estate agent’s about flats in the centre."],["You’re cooking a Sunday roast with beef.","butcher’s","butcher","I’ll buy the beef at the butcher’s."],["You want to read the news every morning.","newsagent’s","newsagent","I buy a paper at the newsagent’s every morning."],["You have a bad cold and need medicine.","chemist’s / pharmacy","chemist|pharmacy","I’ll go to the pharmacy to get some medicine."],["You need fresh fish for dinner.","fishmonger’s","fishmonger","I’ll get fresh fish at the fishmonger’s."]];
const T=[
{n:1,title:'Where is it? 🖼️',hint:'Посмотри на картинку и выбери место.',gen:()=>sh(W).slice(0,12).map(w=>mc(`<span class=big>${w[3]}</span>`,w[0],oth(w,3).map(x=>x[0]),w[0]))},
{n:2,title:'Where do you go? 🧭',hint:'Выбери место, куда нужно пойти в этой ситуации.',gen:()=>sh(CX).slice(0,12).map(([t,e])=>mc(t,e,oth(find(e),3).map(x=>x[0]),e))},
{n:3,title:'Listen & choose 🎧',hint:'Нажми 🔊, послушай и выбери перевод.',gen:()=>sh(W).slice(0,10).map(w=>mc(`<button class="spk big" data-s="${w[0]}">🔊</button> Что это значит?`,w[1],oth(w,3).map(x=>x[1]),w[0]))},
{n:4,title:'Translate into English 🇬🇧 (пиши!)',hint:'Напиши название места по-английски. Не забудь ’s.',gen:()=>sh(W).slice(0,7).map(w=>({k:'txt',q:w[1],a:ans(w),w:w[0]}))},
{n:5,title:'Where will you go? 🛍️ (пиши!)',hint:'Напиши предложение (минимум 5 слов), куда ты пойдёшь, и используй слово из подсказки. Грамматику проверит учитель.',gen:()=>sh(SIT).map(([q,p,k,m])=>({k:'txt',q:`${q}<br><small>Используй: <b>${p}</b></small>`,model:m,w:p,test:v=>norm(v).split(' ').length>=5&&new RegExp(k).test(norm(v))}))}
];
const COL=['#7ad7f0','#ffd23f','#ff9ec4','#b8f0d3','#c9b6ff'];
const re=/\[\[(.+?)\|([01])\]\]/g;
let V=null;
function pick(){const v=speechSynthesis.getVoices();V=v.find(x=>/Google US English/i.test(x.name))||v.find(x=>/Samantha/i.test(x.name))||v.find(x=>x.lang==='en-US')||v.find(x=>/^en/.test(x.lang))||null;const n=$('#vn');if(n)n.textContent=V?V.name:'голос по умолчанию'}
let tk=0;
function say(t,cb){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const m=++tk,u=new SpeechSynthesisUtterance(t.replace('/',' or '));u.lang='en-US';if(V)u.voice=V;u.rate=.85;u.onend=()=>{if(cb&&m===tk)cb()};speechSynthesis.speak(u)}
if('speechSynthesis' in window){speechSynthesis.onvoiceschanged=pick;pick()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(b)say(b.dataset.s)});
function mount(it,d){
 if(it.k==='mc'){
  d.insertAdjacentHTML('beforeend','<div class=opts>'+it.o.map(o=>`<button class=opt>${o}</button>`).join('')+'</div>');
  const bs=[...d.querySelectorAll('.opt')];let sel;
  bs.forEach(b=>b.onclick=()=>{sel=b.textContent;bs.forEach(x=>x.classList.toggle('sel',x===b))});
  it.chk=()=>{bs.forEach(b=>{b.classList.remove('ok','bad');if(b.textContent===sel)b.classList.add(sel===it.a?'ok':'bad')});return sel===it.a?[1,1]:[0,1]};
  it.show=()=>{sel=it.a;bs.forEach(b=>{b.classList.remove('bad','sel');b.classList.toggle('ok',b.textContent===it.a)})};
  it.ans=()=>sel||'—';
 }else if(it.k==='txt'){
  d.insertAdjacentHTML('beforeend','<input autocomplete=off autocapitalize=off spellcheck=false placeholder="пиши здесь…">');
  const i=d.querySelector('input');
  it.chk=()=>{const ok=it.test?it.test(i.value):it.a.some(x=>norm(x)===norm(i.value));i.className=ok?'ok':'bad';return[ok?1:0,1]};
  it.show=()=>{i.value=it.model||it.a[0];i.className='ok'};
  it.ans=()=>i.value||'—';
 }else{
  let op=it.opts;
  if(it.text){op=[];d.insertAdjacentHTML('beforeend','<p class=txt>'+it.text.replace(re,(m,t,c)=>{op.push({t,c:+c});return `<span class=ph data-i=${op.length-1}>${t}</span>`})+'</p>')}
  else d.insertAdjacentHTML('beforeend','<div class=chips>'+op.map((o,i)=>`<span class=chip data-i=${i}>${o.t}</span>`).join('')+'</div>');
  const el=[...d.querySelectorAll('[data-i]')],S=new Set(),clr=e=>e.classList.remove('sel','ok','bad','miss');
  el.forEach((e,i)=>e.onclick=()=>{S.has(i)?S.delete(i):S.add(i);e.classList.toggle('sel',S.has(i))});
  it.chk=()=>{let g=0,pr=[];el.forEach((e,i)=>{const c=op[i].c,s=S.has(i);clr(e);if(s)e.classList.add(c?'ok':'bad');else if(c)e.classList.add('miss');if(s&&c)g++;else if(s)g--;else if(c)pr.push(it.w||op[i].t)});return[Math.max(0,g),op.filter(o=>o.c).length,pr]};
  it.show=()=>{el.forEach((e,i)=>{clr(e);if(op[i].c){S.add(i);e.classList.add('ok')}else S.delete(i)})};
  it.ans=()=>[...S].map(i=>op[i].t).join(', ')||'—';
 }
}
function build(t){
 const s=document.createElement('section');s.className='card';s.style.setProperty('--c',COL[t.n%5]);
 s.innerHTML=`<h2><i>${t.n}</i>${t.title}</h2><p class=hint>${t.hint}</p><div class=items></div><div class=bar>${t.timer?'<button class=st>▶ Старт</button>':''}<button class=go>Проверить</button><button class=sw>Показать ответы</button><button class=rs>↻ Заново</button><b class=sc></b></div>`;
 const box=s.querySelector('.items'),sc=s.querySelector('.sc'),go=s.querySelector('.go'),st=s.querySelector('.st');let iv;
 const load=()=>{clearInterval(iv);box.innerHTML='';sc.textContent='';t.sc=null;t.p=[];t.items=t.gen();
  t.items.forEach(it=>{const d=document.createElement('div');d.className='it';if(!it.text)d.innerHTML=`<div class=q>${it.q}${it.say?` <button class=spk data-s="${it.say}">🔊</button>`:''}</div>`;box.append(d);mount(it,d)});
  if(t.timer){box.classList.add('lock');st.hidden=false}stats()};
 if(st)st.onclick=()=>{box.classList.remove('lock');let n=t.timer;sc.textContent=n+' c';st.hidden=true;iv=setInterval(()=>{sc.textContent=--n+' c';if(n<=0){clearInterval(iv);go.click()}},1000)};
 go.onclick=()=>{let g=0,n=0,p=[];t.items.forEach(it=>{let r=it.chk();const pr=r[2];if(it.cheat)r=[0,r[1]];it.r=r;g+=r[0];n+=r[1];if(r[0]<r[1])p.push(...(pr&&pr.length?pr:[it.w]))});t.sc=[g,n];t.p=p.filter(Boolean);clearInterval(iv);sc.textContent=`${g} / ${n}`;stats()};
 s.querySelector('.sw').onclick=()=>{t.items.forEach(it=>{it.show();it.cheat=1});clearInterval(iv);box.classList.remove('lock')};
 s.querySelector('.rs').onclick=load;
 load();return s;
}
function stats(){let g=0,n=0,c={};T.forEach(t=>{if(t.sc){g+=t.sc[0];n+=t.sc[1]}(t.p||[]).forEach(w=>c[w]=(c[w]||0)+1)});
 $('#pg').innerHTML=n?`⭐ Баллы: <span class=sc2>${g} / ${n}</span>`:'Выполняй задания по порядку 👇';
 const r=Object.entries(c).sort((a,b)=>b[1]-a[1]);
 $('#pw').innerHTML=r.length?r.map(([w,k])=>`<tr><td>${w} <button class=spk data-s="${w}">🔊</button></td><td>×${k}</td></tr>`).join(''):'<tr><td>Пока ошибок нет 🎉</td></tr>'}
function report(){let g=0,n=0,o='';T.forEach(t=>{if(t.sc){g+=t.sc[0];n+=t.sc[1]}o+=`\n${t.n}. ${t.title}${t.sc?`  [${t.sc[0]}/${t.sc[1]}]`:'  [не проверено]'}\n`;t.items.forEach(it=>{const q=document.createElement('div');q.innerHTML=it.q;o+=`- ${q.textContent.trim()} → ${it.ans()} ${it.r?(it.r[0]===it.r[1]?'✓':'✗'):'?'}${it.cheat?' (показан ответ)':''}\n`})});
 const c={};T.forEach(t=>(t.p||[]).forEach(w=>c[w]=(c[w]||0)+1));
 return`Shops vocab — результаты\nИтого: ${g}/${n}\nПроблемные слова: ${Object.keys(c).join('; ')||'нет'}\n`+o}
const m=$('#m');
const intro=document.createElement('section');intro.className='card';intro.style.setProperty('--c','#ff9ec4');
intro.innerHTML=`<h2><i>0</i>Shops and services 🎧</h2><p class=hint>Сначала послушай и повтори вслух. Голос: <b id=vn>…</b> (лучше всего Google US English или Samantha).</p><div class=wl>${W.map(w=>`<div class=wc><span class=em>${w[3]}</span><div><b>${w[0]}</b><small>${w[2]}</small><span>${w[1]}</span></div><button class=spk data-s="${w[0]}">🔊</button></div>`).join('')}</div><div class=bar><button class=go id=all>🔊 Прослушать все</button></div>`;
m.append(intro);pick();
$('#all',intro);intro.querySelector('#all').onclick=()=>{const f=i=>{if(i<W.length)say(W[i][0],()=>f(i+1))};f(0)};
T.forEach(t=>m.append(build(t)));
const fin=document.createElement('section');fin.className='card';fin.style.setProperty('--c','#ffd23f');
fin.innerHTML=`<h2><i>🏁</i>Готово! Результаты и звук</h2><p class=hint>Проверь, что звук работает, и скопируй ответы, чтобы отправить учителю.</p><div class=bar><button class=sw id=tst>🔊 Проверить звук</button><button class=go id=cp>📋 Скопировать мои ответы</button><span id=cm></span></div><textarea id=out readonly placeholder="Здесь появятся ответы…"></textarea>`;
m.append(fin);
$('#tst').onclick=()=>{if(!('speechSynthesis' in window)){$('#cm').textContent='Звук не поддерживается — открой в Chrome или Safari';return}say('Audio test. Clear the table. Do the washing-up.');$('#cm').textContent='Голос: '+(V?V.name:'по умолчанию')};
$('#cp').onclick=()=>{const ta=$('#out');ta.value=report();ta.select();try{document.execCommand('copy')}catch(e){}if(navigator.clipboard)navigator.clipboard.writeText(ta.value).catch(()=>{});$('#cm').textContent='Скопировано ✓ (если нет — выдели текст и скопируй вручную)'};
stats();
</script></body></html>
