<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Дофаминовый шопинг — лексика B1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF6EE;
    --card:#FFFFFF;
    --ink:#2E2A26;
    --ink-soft:#6B6559;
    --line:#DCD3C2;
    --accent:#E8436B;
    --accent-dark:#B22D50;
    --mint:#1F8A5F;
    --mint-bg:#E7F5EE;
    --err:#C0392B;
    --err-bg:#FBEAE7;
    --amber:#C9891E;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    line-height:1.5;
  }
  .wrap{
    max-width:1080px;
    margin:0 auto;
    padding:32px 20px 80px;
    display:flex;
    gap:32px;
    align-items:flex-start;
  }
  main{flex:1; min-width:0;}
  aside{
    width:230px;
    flex-shrink:0;
    position:sticky;
    top:24px;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:2.1rem;
    margin:0 0 4px;
    letter-spacing:-0.5px;
  }
  .subtitle{color:var(--ink-soft); margin-bottom:28px; font-size:.98rem;}
  .receipt-tag{
    display:inline-block;
    background:var(--accent);
    color:#fff;
    font-size:.72rem;
    padding:3px 9px;
    border-radius:20px;
    margin-bottom:14px;
    font-weight:600;
  }
  .vocab-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:20px 22px;
    margin-bottom:34px;
  }
  .vocab-card h2{
    font-family:'Fraunces',serif;
    font-size:1.2rem;
    margin:0 0 12px;
  }
  table.vocab{width:100%; border-collapse:collapse; font-size:.94rem;}
  table.vocab td{padding:8px 6px; border-bottom:1px dashed var(--line); vertical-align:middle;}
  table.vocab tr:last-child td{border-bottom:none;}
  .word{font-weight:600;}
  .ipa{color:var(--ink-soft); font-size:.86rem;}
  .ru-tr{color:var(--ink-soft);}
  .speak-btn{
    border:1px solid var(--accent);
    background:#fff;
    color:var(--accent-dark);
    border-radius:50%;
    width:30px; height:30px;
    cursor:pointer;
    font-size:.95rem;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    transition:background .15s;
  }
  .speak-btn:hover{background:var(--accent); color:#fff;}
  .voice-status{font-size:.78rem; color:var(--ink-soft); margin-top:10px;}
  .voice-status.ok{color:var(--mint);}
  .voice-status.bad{color:var(--err);}

  section.exercise{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:22px 24px 20px;
    margin-bottom:26px;
    position:relative;
  }
  section.exercise::before{
    content: attr(data-num);
    position:absolute;
    top:-13px;
    left:20px;
    background:var(--ink);
    color:#fff;
    font-family:'Fraunces',serif;
    font-size:.78rem;
    padding:3px 10px;
    border-radius:20px;
  }
  section.exercise h3{
    font-family:'Fraunces',serif;
    font-size:1.18rem;
    margin:6px 0 4px;
  }
  .instr{color:var(--ink-soft); font-size:.9rem; margin-bottom:16px;}
  .item{
    border-top:1px dashed var(--line);
    padding:12px 0;
  }
  .item:first-of-type{border-top:none;}
  .item p.prompt{margin:0 0 8px; font-size:.97rem;}
  .masked{font-weight:700; letter-spacing:1px; color:var(--accent-dark); background:var(--mint-bg); padding:0 4px; border-radius:4px;}
  .item input[type=text]{
    width:100%;
    max-width:360px;
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:6px;
    font-size:.95rem;
    font-family:'Inter',sans-serif;
  }
  .item textarea{
    width:100%;
    min-height:56px;
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:6px;
    font-size:.95rem;
    font-family:'Inter',sans-serif;
    resize:vertical;
  }
  .item input.correct{border-color:var(--mint); background:var(--mint-bg);}
  .item input.wrong{border-color:var(--err); background:var(--err-bg);}
  .fb{font-size:.85rem; margin-top:4px; min-height:16px;}
  .fb.ok{color:var(--mint);}
  .fb.no{color:var(--err);}
  .btnrow{margin-top:14px; display:flex; gap:10px; flex-wrap:wrap;}
  button.act{
    background:var(--accent);
    color:#fff;
    border:none;
    padding:9px 16px;
    border-radius:6px;
    font-size:.88rem;
    font-weight:600;
    cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  button.act.secondary{background:#fff; color:var(--accent-dark); border:1px solid var(--accent);}
  button.act.ghost{background:#fff; color:var(--ink-soft); border:1px solid var(--line);}
  button.act:hover{opacity:.9;}
  .score{font-size:.85rem; color:var(--ink-soft); margin-left:auto; align-self:center;}
  .copy-note{font-size:.78rem; color:var(--ink-soft); margin-top:6px;}

  aside .side-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:16px;
  }
  aside h4{
    font-family:'Fraunces',serif;
    margin:0 0 10px;
    font-size:1rem;
  }
  #problemList{list-style:none; margin:0; padding:0; font-size:.86rem;}
  #problemList li{
    display:flex; justify-content:space-between;
    padding:6px 0; border-bottom:1px dashed var(--line);
  }
  #problemList li:last-child{border-bottom:none;}
  .pcount{background:var(--err-bg); color:var(--err); border-radius:10px; padding:0 7px; font-size:.75rem; font-weight:700;}
  .empty-note{color:var(--ink-soft); font-size:.83rem;}

  @media (max-width:820px){
    .wrap{flex-direction:column;}
    aside{width:100%; position:static;}
  }
</style>
</head>
<body>
<div class="wrap">
  <main>
    <span class="receipt-tag">B1 · lexis</span>
    <h1>Дофаминовый шопинг</h1>
    <p class="subtitle">Anticipation, spending, consume, reward, ritual, buyer's remorse — 10 упражнений, 6 пунктов в каждом. Слова нужно прописывать руками.</p>

    <div class="vocab-card">
      <h2>Слова урока</h2>
      <table class="vocab" id="vocabTable"></table>
      <div class="voice-status" id="voiceStatus">Загружаю голос браузера…</div>
    </div>

    <div id="exercises"></div>
  </main>

  <aside>
    <div class="side-card">
      <h4>Проблемные слова</h4>
      <ul id="problemList"></ul>
      <p class="empty-note" id="problemEmpty">Пока ошибок нет — отлично!</p>
    </div>
  </aside>
</div>

<script>
/* ---------------- ДАННЫЕ ---------------- */
const vocab = [
  {word:"anticipation", ipa:"/ænˌtɪsɪˈpeɪʃn/", ru:"предвкушение"},
  {word:"spending", ipa:"/ˈspendɪŋ/", ru:"траты, расходы"},
  {word:"consume", ipa:"/kənˈsjuːm/", ru:"потреблять"},
  {word:"reward", ipa:"/rɪˈwɔːrd/", ru:"награда, вознаграждение"},
  {word:"ritual", ipa:"/ˈrɪtʃuəl/", ru:"ритуал"},
  {word:"buyer's remorse", ipa:"/ˈbaɪərz rɪˈmɔːrs/", ru:"угрызения совести покупателя (после покупки)"}
];

function norm(s){
  return (s||"").toLowerCase().trim().replace(/['’]/g,"").replace(/\s+/g," ");
}
function maskWord(w){
  let li=-1;
  return w.split("").map(ch=>{
    if(/[a-z]/i.test(ch)){
      li++;
      return (li%2===0)? ch : "_";
    }
    return ch;
  }).join("");
}

const exercises = [
  {
    id:"ex1", type:"letters",
    title:"1. Вставь пропущенные буквы",
    instr:"Слово в предложении частично скрыто. Впиши слово целиком в поле ниже.",
    items:[
      {sentence:"The __MASK__ of a big sale can make people check their phones every five minutes.", word:"anticipation"},
      {sentence:"Impulse __MASK__ often happens late at night while scrolling through apps.", word:"spending"},
      {sentence:"Some people __MASK__ far more than they actually need.", word:"consume"},
      {sentence:"She treats a new candle as a small __MASK__ for surviving a hard week.", word:"reward"},
      {sentence:"Checking discount codes before bed has become a nightly __MASK__ for him.", word:"ritual"},
      {sentence:"He felt terrible __MASK__ the morning after an expensive online order.", word:"buyer's remorse"}
    ]
  },
  {
    id:"ex2", type:"translate",
    title:"2. Переведи с русского на английский",
    instr:"Напиши английское слово или фразу.",
    items:[
      {prompt:"предвкушение", answer:["anticipation"], word:"anticipation"},
      {prompt:"траты / расходы", answer:["spending"], word:"spending"},
      {prompt:"потреблять", answer:["consume"], word:"consume"},
      {prompt:"награда, вознаграждение", answer:["reward"], word:"reward"},
      {prompt:"ритуал", answer:["ritual"], word:"ritual"},
      {prompt:"угрызения совести покупателя", answer:["buyer's remorse"], word:"buyer's remorse"}
    ]
  },
  {
    id:"ex3", type:"dictation",
    title:"3. Запиши слово на слух",
    instr:"Нажми на 🔊, прослушай слово (Google US English) и запиши его.",
    items:[
      {word:"reward"},
      {word:"buyer's remorse"},
      {word:"spending"},
      {word:"ritual"},
      {word:"anticipation"},
      {word:"consume"}
    ]
  },
  {
    id:"ex4", type:"definition",
    title:"4. Слово по определению",
    instr:"Прочитай определение и напиши подходящее слово.",
    items:[
      {prompt:"the feeling of excitement about something that is going to happen", answer:["spending"], word:"spending", _fixLater:true},
      {prompt:"an action a person regularly repeats in a particular situation", answer:["ritual"], word:"ritual"},
      {prompt:"the regret a person feels after making a purchase", answer:["buyer's remorse"], word:"buyer's remorse"},
      {prompt:"the feeling of excitement about something that is going to happen", answer:["anticipation"], word:"anticipation"},
      {prompt:"something given in return for effort or achievement", answer:["reward"], word:"reward"},
      {prompt:"to buy and use goods or services", answer:["consume"], word:"consume"}
    ]
  },
  {
    id:"ex5", type:"collocation",
    title:"5. Сочетаемость: впиши недостающее слово",
    instr:"Вставь предлог или подходящее слово (of / for / after / on / less и т.д.).",
    items:[
      {prompt:"because of the anticipation ___ the big sale", answer:["of"], word:"anticipation"},
      {prompt:"as a reward ___ finishing the project", answer:["for"], word:"reward"},
      {prompt:"the ritual ___ unwrapping a new package", answer:["of"], word:"ritual"},
      {prompt:"buyer's remorse ___ shopping online at midnight", answer:["after"], word:"buyer's remorse"},
      {prompt:"teenagers spend a lot of money ___ trainers", answer:["on"], word:"spending"},
      {prompt:"doctors say we should try to consume ___ sugary drinks", answer:["less"], word:"consume"}
    ]
  },
  {
    id:"ex6", type:"tense",
    title:"6. Употреби глагол в нужном времени",
    instr:"Поставь глагол в скобках в указанное время.",
    items:[
      {prompt:"She usually ___ (spend) too much money when she's stressed.", tense:"Present Simple", answer:["spends"], word:"spending"},
      {prompt:"Yesterday he ___ (consume) three coffees while shopping online.", tense:"Past Simple", answer:["consumed"], word:"consume"},
      {prompt:"By next year, brands ___ (spend) even more on targeted ads.", tense:"Future Simple", answer:["will spend"], word:"spending"},
      {prompt:"She ___ (reward) herself with a new bag after closing the deal.", tense:"Present Perfect", answer:["has rewarded"], word:"reward"},
      {prompt:"While she ___ (shop) online, she completely forgot the time.", tense:"Past Continuous", answer:["was shopping"], word:"ritual"},
      {prompt:"If people ___ (consume) less, they would save more money.", tense:"2nd Conditional", answer:["consumed"], word:"consume"}
    ]
  },
  {
    id:"ex7", type:"rephrase",
    title:"7. Rephrase",
    instr:"Перефразируй предложение, используя указанное слово.",
    items:[
      {prompt:"He bought new sneakers because he finished the marathon.", use:"reward", sample:"He rewarded himself with new sneakers for finishing the marathon."},
      {prompt:"She always checks sale apps every night before bed.", use:"ritual", sample:"Checking sale apps every night before bed has become her ritual."},
      {prompt:"He regretted buying an expensive jacket the next morning.", use:"buyer's remorse", sample:"He felt buyer's remorse after buying an expensive jacket."},
      {prompt:"She was very excited while waiting for her package to arrive.", use:"anticipation", sample:"She felt the anticipation of her package arriving."},
      {prompt:"People buy and use too many things they don't need.", use:"consume", sample:"People consume too many things they don't need."},
      {prompt:"He wastes a lot of cash on video games.", use:"spend money on", sample:"He spends a lot of money on video games."}
    ]
  },
  {
    id:"ex8", type:"wouldrather",
    title:"8. Would you rather…",
    instr:"Выбери вариант и объясни свой выбор одним-двумя предложениями.",
    items:[
      {prompt:"…get a small reward every day OR one big reward once a month?"},
      {prompt:"…shop online at midnight OR in a crowded mall on the weekend?"},
      {prompt:"…feel the anticipation of a surprise gift OR know exactly what you're getting?"},
      {prompt:"…consume less social media OR less sugar?"},
      {prompt:"…have a shopping ritual you enjoy OR save all your money instead?"},
      {prompt:"…feel buyer's remorse once a year OR never buy anything new again?"}
    ]
  },
  {
    id:"ex9", type:"complete",
    title:"9. Закончи предложение своей идеей",
    instr:"Допиши предложение, используя свои мысли.",
    items:[
      {prompt:"I usually feel the anticipation of … when …"},
      {prompt:"My little shopping ritual is …"},
      {prompt:"The last time I felt buyer's remorse was when …"},
      {prompt:"I try not to consume too much …"},
      {prompt:"I reward myself with … when …"},
      {prompt:"Most of my spending goes on …"}
    ]
  },
  {
    id:"ex10", type:"ownsentence",
    title:"10. Составь своё предложение",
    instr:"Напиши одно собственное предложение с каждым словом.",
    items:[
      {prompt:"anticipation"},
      {prompt:"spending"},
      {prompt:"consume"},
      {prompt:"reward"},
      {prompt:"ritual"},
      {prompt:"buyer's remorse"}
    ]
  }
];

/* ---------------- ГОЛОС ---------------- */
let chosenVoice = null;
function pickVoice(){
  const voices = speechSynthesis.getVoices();
  if(!voices.length) return;
  chosenVoice = voices.find(v=>v.name==="Google US English") ||
                voices.find(v=>v.lang==="en-US" && /google/i.test(v.name)) ||
                voices.find(v=>v.lang==="en-US") ||
                voices.find(v=>/^en/.test(v.lang)) || voices[0];
  const status = document.getElementById("voiceStatus");
  if(chosenVoice){
    status.textContent = "Голос: " + chosenVoice.name + " (" + chosenVoice.lang + ")";
    status.className = "voice-status " + (chosenVoice.name==="Google US English" ? "ok" : "");
    if(chosenVoice.name!=="Google US English"){
      status.textContent += " — «Google US English» не найден в этом браузере, использую ближайший английский голос.";
    }
  } else {
    status.textContent = "Синтез речи недоступен в этом браузере.";
    status.className = "voice-status bad";
  }
}
speechSynthesis.onvoiceschanged = pickVoice;
pickVoice();
setTimeout(pickVoice, 400);

function speak(text){
  if(!('speechSynthesis' in window)){
    alert("Этот браузер не поддерживает озвучку.");
    return;
  }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US";
  if(chosenVoice) u.voice = chosenVoice;
  u.rate = 0.92;
  speechSynthesis.speak(u);
}

/* ---------------- КОПИРОВАНИЕ ---------------- */
async function copyText(text){
  try{
    await navigator.clipboard.writeText(text);
    return true;
  }catch(e){
    try{
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position="fixed"; ta.style.opacity="0";
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      const ok = document.execCommand("copy");
      document.body.removeChild(ta);
      return ok;
    }catch(e2){ return false; }
  }
}

/* ---------------- ОШИБКИ / ПРОБЛЕМНЫЕ СЛОВА ---------------- */
const mistakes = {};
function registerMistake(word){
  if(!word) return;
  mistakes[word] = (mistakes[word]||0)+1;
  renderMistakes();
}
function renderMistakes(){
  const ul = document.getElementById("problemList");
  const empty = document.getElementById("problemEmpty");
  const entries = Object.entries(mistakes).sort((a,b)=>b[1]-a[1]);
  ul.innerHTML = "";
  if(entries.length===0){ empty.style.display="block"; return; }
  empty.style.display="none";
  entries.forEach(([w,c])=>{
    const li = document.createElement("li");
    li.innerHTML = `<span>${w}</span><span class="pcount">${c}</span>`;
    ul.appendChild(li);
  });
}

/* ---------------- РЕНДЕР СЛОВАРЯ ---------------- */
function renderVocab(){
  const table = document.getElementById("vocabTable");
  vocab.forEach(v=>{
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td class="word">${v.word}</td>
      <td class="ipa">${v.ipa}</td>
      <td class="ru-tr">${v.ru}</td>
      <td><button class="speak-btn" title="Прослушать" onclick="speak('${v.word.replace(/'/g,"\\'")}')">🔊</button></td>`;
    table.appendChild(tr);
  });
}

/* ---------------- РЕНДЕР УПРАЖНЕНИЙ ---------------- */
const container = document.getElementById("exercises");

function shuffledIndexes(n){
  const arr = [...Array(n).keys()];
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

exercises.forEach((ex, exIdx)=>{
  const section = document.createElement("section");
  section.className = "exercise";
  section.setAttribute("data-num", "УПР. " + (exIdx+1));
  section.id = ex.id;

  let html = `<h3>${ex.title}</h3><p class="instr">${ex.instr}</p>`;

  // порядок пунктов перемешиваем (кроме диктанта, где важна случайная последовательность слов — уже задана вручную)
  const order = (ex.type==="dictation") ? [...Array(ex.items.length).keys()] : shuffledIndexes(ex.items.length);

  order.forEach((idx, displayPos)=>{
    const it = ex.items[idx];
    html += `<div class="item" data-idx="${idx}">`;

    if(ex.type==="letters"){
      const masked = maskWord(it.word);
      const sentence = it.sentence.replace("__MASK__", `<span class="masked">${masked}</span>`);
      html += `<p class="prompt">${displayPos+1}. ${sentence}</p>
        <input type="text" placeholder="впиши слово целиком">
        <div class="fb"></div>`;
    } else if(ex.type==="translate"){
      html += `<p class="prompt">${displayPos+1}. <strong>${it.prompt}</strong></p>
        <input type="text" placeholder="type in English">
        <div class="fb"></div>`;
    } else if(ex.type==="dictation"){
      html += `<p class="prompt">${displayPos+1}. <button class="speak-btn" onclick="speak('${it.word.replace(/'/g,"\\'")}')">🔊</button></p>
        <input type="text" placeholder="write what you hear">
        <div class="fb"></div>`;
    } else if(ex.type==="definition"){
      html += `<p class="prompt">${displayPos+1}. ${it.prompt}</p>
        <input type="text" placeholder="which word?">
        <div class="fb"></div>`;
    } else if(ex.type==="collocation"){
      html += `<p class="prompt">${displayPos+1}. ${it.prompt}</p>
        <input type="text" placeholder="missing word">
        <div class="fb"></div>`;
    } else if(ex.type==="tense"){
      html += `<p class="prompt">${displayPos+1}. ${it.prompt} <em>(${it.tense})</em></p>
        <input type="text" placeholder="verb form">
        <div class="fb"></div>`;
    } else if(ex.type==="rephrase"){
      html += `<p class="prompt">${displayPos+1}. <strong>Use "${it.use}":</strong> ${it.prompt}</p>
        <textarea placeholder="your rephrased sentence"></textarea>
        <div class="fb sample" style="display:none;"></div>`;
    } else if(ex.type==="wouldrather"){
      html += `<p class="prompt">${displayPos+1}. Would you rather ${it.prompt}</p>
        <textarea placeholder="your choice + why"></textarea>`;
    } else if(ex.type==="complete"){
      html += `<p class="prompt">${displayPos+1}. ${it.prompt}</p>
        <textarea placeholder="finish the sentence"></textarea>`;
    } else if(ex.type==="ownsentence"){
      html += `<p class="prompt">${displayPos+1}. Word: <strong>${it.prompt}</strong></p>
        <textarea placeholder="write your own sentence"></textarea>`;
    }
    html += `</div>`;
  });

  html += `<div class="btnrow">`;
  if(["letters","translate","dictation","definition","collocation","tense"].includes(ex.type)){
    html += `<button class="act" onclick="checkExercise('${ex.id}')">Проверить</button>
      <button class="act secondary" onclick="showAnswers('${ex.id}')">Показать ответы</button>
      <span class="score" id="${ex.id}_score"></span>`;
  } else if(ex.type==="rephrase"){
    html += `<button class="act secondary" onclick="toggleSamples('${ex.id}')">Показать пример ответа</button>
      <button class="act" onclick="copyOpen('${ex.id}')">Скопировать ответы</button>`;
  } else {
    html += `<button class="act" onclick="copyOpen('${ex.id}')">Скопировать ответы</button>`;
  }
  html += `</div><p class="copy-note" id="${ex.id}_copied" style="display:none;">Скопировано в буфер обмена ✓</p>`;

  section.innerHTML = html;
  container.appendChild(section);
});

/* ---------------- ПРОВЕРКА ---------------- */
function getExercise(id){ return exercises.find(e=>e.id===id); }

function checkExercise(id){
  const ex = getExercise(id);
  const section = document.getElementById(id);
  const itemDivs = section.querySelectorAll(".item");
  let correctCount = 0;
  itemDivs.forEach(div=>{
    const idx = parseInt(div.getAttribute("data-idx"));
    const it = ex.items[idx];
    const input = div.querySelector("input[type=text]");
    const fb = div.querySelector(".fb");
    const val = norm(input.value);
    const answers = (it.answer || [it.word]).map(norm);
    const isCorrect = answers.includes(val) && val.length>0;
    input.classList.remove("correct","wrong");
    if(isCorrect){
      input.classList.add("correct");
      fb.textContent = "верно";
      fb.className = "fb ok";
      correctCount++;
    } else {
      input.classList.add("wrong");
      fb.textContent = "неверно, попробуй ещё раз";
      fb.className = "fb no";
      registerMistake(it.word);
    }
  });
  document.getElementById(id+"_score").textContent = correctCount + " / " + itemDivs.length + " правильно";
}

function showAnswers(id){
  const ex = getExercise(id);
  const section = document.getElementById(id);
  const itemDivs = section.querySelectorAll(".item");
  itemDivs.forEach(div=>{
    const idx = parseInt(div.getAttribute("data-idx"));
    const it = ex.items[idx];
    const input = div.querySelector("input[type=text]");
    const answers = it.answer || [it.word];
    input.value = answers[0];
    input.classList.remove("wrong");
    input.classList.add("correct");
    const fb = div.querySelector(".fb");
    fb.textContent = "ответ: " + answers.join(" / ");
    fb.className = "fb ok";
  });
}

function toggleSamples(id){
  const ex = getExercise(id);
  const section = document.getElementById(id);
  const itemDivs = section.querySelectorAll(".item");
  itemDivs.forEach(div=>{
    const idx = parseInt(div.getAttribute("data-idx"));
    const it = ex.items[idx];
    const sampleDiv = div.querySelector(".sample");
    sampleDiv.style.display = sampleDiv.style.display==="none" ? "block" : "none";
    sampleDiv.textContent = "пример: " + it.sample;
  });
}

async function copyOpen(id){
  const ex = getExercise(id);
  const section = document.getElementById(id);
  const itemDivs = section.querySelectorAll(".item");
  let lines = [ex.title, ""];
  itemDivs.forEach((div,i)=>{
    const idx = parseInt(div.getAttribute("data-idx"));
    const it = ex.items[idx];
    const ta = div.querySelector("textarea");
    const label = it.use ? `(${it.use}) ${it.prompt}` : it.prompt;
    lines.push((i+1)+". "+label);
    lines.push("→ " + (ta.value.trim() || "(пусто)"));
    lines.push("");
  });
  const text = lines.join("\n");
  const ok = await copyText(text);
  const note = document.getElementById(id+"_copied");
  note.style.display = "block";
  note.textContent = ok ? "Скопировано в буфер обмена ✓" : "Не удалось скопировать автоматически — выделите текст вручную.";
  note.style.color = ok ? "var(--mint)" : "var(--err)";
  setTimeout(()=>{ note.style.display="none"; }, 4000);
}

renderVocab();
renderMistakes();
