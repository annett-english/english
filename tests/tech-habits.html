<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tech habits & frequency — A2</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1d2433;--mu:#667085;--ac:#3b5bdb;--ok:#2b8a3e;--okb:#e6f6ea;--no:#c92a2a;--nob:#fdeaea;--bd:#dde1ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--card:#1b202b;--tx:#e8ebf2;--mu:#98a2b3;--ac:#8da2ff;--ok:#69db7c;--okb:#173222;--no:#ff8787;--nob:#3a1b1b;--bd:#2d3444}}
:root[data-theme="dark"]{--bg:#12151c;--card:#1b202b;--tx:#e8ebf2;--mu:#98a2b3;--ac:#8da2ff;--ok:#69db7c;--okb:#173222;--no:#ff8787;--nob:#3a1b1b;--bd:#2d3444}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px;display:grid;grid-template-columns:1fr 220px;gap:16px}
main{min-width:0}aside{position:sticky;top:12px;align-self:start}
@media(max-width:800px){.wrap{grid-template-columns:1fr}aside{position:static;order:-1}}
h1{margin:.2em 0}h2{margin:0 0 4px;font-size:1.15rem}
.card,section{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
.ins{color:var(--mu);margin:0 0 8px;font-size:.92rem}
table{width:100%;border-collapse:collapse;font-size:.92rem}td{padding:5px 6px;border-bottom:1px solid var(--bd)}.ipa{color:var(--mu)}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:6px 12px;border-radius:9px;cursor:pointer}
button.p{background:var(--ac);color:var(--card);border-color:var(--ac)}button:hover{filter:brightness(.95)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}.msg{font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:7px 10px;border:1px solid var(--bd);border-radius:10px;margin:6px 0}
.sol{display:none;width:100%;color:var(--ok);font-size:.9rem}.show .sol{display:block}
.good{background:var(--okb);border-color:var(--ok)}.bad{background:var(--nob);border-color:var(--no)}
input[type=text],select,textarea{font:inherit;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:5px 8px}
input.l{width:1.6em;padding:3px 0;text-align:center;font-weight:600}.sp{display:inline-block;width:.6em}
.txt{line-height:2.1}.w{cursor:pointer;border-radius:5px;padding:1px 2px}.w:hover{background:var(--bd)}.w.sel{background:var(--ac);color:var(--card)}
.w.good{background:var(--okb);color:var(--ok)}.w.bad{background:var(--nob);color:var(--no)}
.chip{border:1px solid var(--ac);border-radius:8px;padding:3px 9px;cursor:pointer;background:var(--card)}.ans{min-height:34px;display:flex;gap:6px;flex-wrap:wrap;width:100%;border-bottom:2px dashed var(--bd);padding-bottom:4px}
.bank span{display:inline-block;background:var(--bd);border-radius:8px;padding:2px 10px;margin:2px}
textarea{width:100%;min-height:50px}.num{color:var(--mu);width:1.4em}
#prob li{font-size:.9rem}.tiny{font-size:.82rem;color:var(--mu)}
</style></head><body><div class="wrap"><main>
<h1>📱 Tech habits &amp; how often</h1>
<p class="ins">Уровень A2. Пиши ответы руками, нажимай «Проверить» или «Ответы». Ошибки попадают в «Проблемные слова».</p>

<div class="card"><h2>Слова и выражения</h2>
<p class="ins">🎧 Прослушай каждое выражение (голос Google US English / Samantha). Повтори вслух.</p>
<div class="bar" style="margin:0 0 8px"><button class="p" id="pa">▶ Слушать всё</button><button id="ps">⏹ Стоп</button><button id="pt">🔊 Проверить звук</button><span class="tiny" id="vs"></span></div>
<table id="vt"></table></div>
<div id="exs"></div>
<div class="card"><h2>Готово!</h2><div class="bar"><button class="p" onclick="copyAll()">📋 Скопировать все ответы</button><button onclick="speak('Audio check. Once in a blue moon.')">🔊 Проверка звука</button><span class="msg" id="cm"></span></div></div>
</main>
<aside><div class="card"><h2>⚠ Проблемные слова</h2><p class="tiny">Здесь ошибки из проверок.</p><ul id="prob" style="padding-left:18px;margin:6px 0"></ul><button onclick="clearProb()">Очистить</button></div>
<div class="card"><button class="p" style="width:100%" onclick="copyAll()">📋 Копировать всё</button></div></aside></div>
<script>
const P=[["download a new app","/ˌdaʊnˈləʊd ə njuː æp/","скачать новое приложение"],["send an email","/send ən ˈiːmeɪl/","отправить письмо"],["take a photo or make a video","/teɪk ə ˈfəʊtəʊ ɔː meɪk ə ˈvɪdiəʊ/","сделать фото или снять видео"],["get directions","/ɡet dəˈrekʃnz/","узнать маршрут"],["read a book","/riːd ə bʊk/","читать книгу"],["count your steps","/kaʊnt jɔː steps/","считать шаги"],["listen to a playlist","/ˈlɪsn tə ə ˈpleɪlɪst/","слушать плейлист"],["book a flight","/bʊk ə flaɪt/","забронировать авиабилет"],["get information about your health","/ɡet ˌɪnfəˈmeɪʃn əˈbaʊt jɔː helθ/","получать информацию о здоровье"],["read the news headlines","/riːd ðə njuːz ˈhedlaɪnz/","читать заголовки новостей"],["play a game","/pleɪ ə ɡeɪm/","играть в игру"],["almost never","/ˈɔːlməʊst ˈnevə/","почти никогда"],["once in a blue moon","/wʌns ɪn ə bluː muːn/","раз в сто лет, очень редко"],["very rarely","/ˈveri ˈreəli/","очень редко"]];
const $=(s)=>document.querySelector(s),h=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const norm=s=>s.toLowerCase().replace(/[’‘]/g,"'").replace(/'m\b/g," am").replace(/'re\b/g," are").replace(/'s\b/g," is").replace(/[^a-z ]/g," ").replace(/\s+/g," ").trim();
function sh(a,seed){a=a.slice();let s=seed*9301+49297;for(let i=a.length-1;i>0;i--){s=(s*9301+49297)%233280;const j=Math.floor(s/233280*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
/* AUDIO */
let voice=null;
function pick(){if(!window.speechSynthesis)return;const v=speechSynthesis.getVoices();voice=v.find(x=>/Google US English/i.test(x.name))||v.find(x=>/Samantha/i.test(x.name))||v.find(x=>/en[-_]US/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null;$('#vs').textContent=!window.speechSynthesis?'Озвучка не поддерживается браузером':voice?'Голос: '+voice.name:'Голос загружается… (или используется системный)'}
if(window.speechSynthesis){pick();speechSynthesis.onvoiceschanged=pick}else pick();
let stop=false;
function speak(t,r){return new Promise(res=>{if(!window.speechSynthesis)return res();speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';if(voice)u.voice=voice;u.rate=r||.9;u.onend=u.onerror=()=>res();speechSynthesis.speak(u)})}
$('#pt').onclick=()=>speak('Hello! Audio is working.');
$('#ps').onclick=()=>{stop=true;window.speechSynthesis&&speechSynthesis.cancel()};
$('#pa').onclick=async()=>{stop=false;for(const p of P){if(stop)break;await speak(p[0]);await new Promise(r=>setTimeout(r,500))}};
P.forEach(p=>{const tr=h('tr'),b=h('button','','🔊');b.onclick=()=>speak(p[0]);const c=h('td');c.append(b);tr.append(h('td','',p[0]),h('td','ipa',p[1]),h('td','',p[2]),c);$('#vt').append(tr)});
/* PROBLEMS */
const prob={};function renderProb(){const u=$('#prob');u.innerHTML='';Object.entries(prob).sort((a,b)=>b[1]-a[1]).forEach(([k,v])=>u.append(h('li','',k+' ×'+v)))}
function clearProb(){for(const k in prob)delete prob[k];renderProb()}
function bad(k){if(!k)return;prob[k]=(prob[k]||0)+1;renderProb()}
/* ENGINE */
const E=[];
function sol(el,t){el.append(h('div','sol','✔ '+t))}
function ex(n,title,ins,build){const sec=h('section'),rows=[],body=h('div'),msg=h('span','msg');sec.append(h('h2','',n+'. '+title),h('p','ins',ins),body);
const secSol=build(body,rows);if(secSol)sec.append(h('div','sol','✔ '+secSol));
const bar=h('div','bar'),cb=h('button','p','Проверить'),sb=h('button','','Ответы'),rb=h('button','','Сбросить');
const o={n,title,rows,checked:false};
cb.onclick=()=>{let k=0;rows.forEach(r=>{const g=r.ok();r.el.classList.toggle('good',g&&!r.ng);r.el.classList.toggle('bad',!g);if(g)k++;else bad(r.key)});o.checked=true;msg.textContent=k+' / '+rows.length};
sb.onclick=()=>sec.classList.toggle('show');
rb.onclick=()=>{rows.forEach(r=>{r.clear();r.el.classList.remove('good','bad')});sec.classList.remove('show');msg.textContent='';o.checked=false};
bar.append(cb,sb,rb,msg);sec.append(bar);$('#exs').append(sec);E.push(o)}
function inp(){const i=h('input');i.type='text';i.autocomplete='off';i.autocapitalize='off';i.spellcheck=false;return i}
/* 1 Find in the wild */
ex(1,'Find them in the wild','Read the text once. Then click every stretch of words from the topic (13 phrases). Click the whole phrase, not a single word. Don’t click time words!',(b,rows)=>{
const T="Tom loves his phone, but he {almost never} {plays a game} on it. [Every morning] he {reads the news headlines} and {sends an email} to his boss. He {listens to a playlist} [on the bus]. On holiday, he {takes a photo or makes a video} of everything. Tom {counts his steps} every day, but he {very rarely} {gets information about his health}. He {once in a blue moon} {downloads a new app}, and he {gets directions} only when he is lost. He {books a flight} [twice a year] and {reads a book} on the plane.";
const p=h('p','txt');b.append(p);let last=0;const targets=[];
T.replace(/\{([^}]+)\}|\[([^\]]+)\]/g,(m,a,c,i)=>{p.append(T.slice(last,i));last=i+m.length;const s=h('span','w',a||c);s.onclick=()=>s.classList.toggle('sel');p.append(s);const t=!!a;if(t)targets.push(a);
rows.push({el:s,key:t?a:null,ng:!t,ok:()=>s.classList.contains('sel')===t,ans:()=>s.classList.contains('sel')?s.textContent:'',clear:()=>s.classList.remove('sel')})});
p.append(T.slice(last));
rows.sum=()=>rows.filter(r=>r.ans()).map(r=>r.ans()).join('; ');
return 'Phrases: '+targets.join(' • ')});
/* 2 Missing letters */
ex(2,'Fill in the missing letters','Впиши пропущенные буквы.',(b,rows)=>{
[0,8,2,11,5,12,9,6].forEach(i=>{const w=P[i][0],r=h('div','row'),ins=[];let c=0;const box=h('span');
[...w].forEach(ch=>{if(/[a-z]/.test(ch)){if(c++%3==1){const x=inp();x.className='l';x.maxLength=1;x.oninput=()=>{if(x.value){const n=ins[ins.indexOf(x)+1];n&&n.focus()}};ins.push({x,ch});box.append(x)}else box.append(h('b','',ch))}else box.append(h('span','sp'))});
const xs=ins.map(o=>o.x);ins.forEach((o,k)=>o.x.oninput=()=>{if(o.x.value&&xs[k+1])xs[k+1].focus()});
r.append(box,h('span','tiny','— '+P[i][2]));sol(r,w);b.append(r);
rows.push({el:r,key:w,ok:()=>ins.every(o=>o.x.value.toLowerCase()==o.ch),ans:()=>{let j=0,q=0;return [...w].map(ch=>{if(!/[a-z]/.test(ch))return ' ';return q++%3==1?(xs[j++].value||'_'):ch}).join('')},clear:()=>xs.forEach(x=>x.value='')})})});
/* 3 Dictation */
ex(3,'Listen and write','Нажми 🔊 (или 🐢 — медленно) и напиши услышанное выражение.',(b,rows)=>{
[11,5,3,12,7,6,1,10].forEach((i,n)=>{const r=h('div','row'),x=inp(),a=h('button','','🔊'),s=h('button','','🐢');a.onclick=()=>speak(P[i][0]);s.onclick=()=>speak(P[i][0],.55);x.size=30;
r.append(h('span','num',n+1),a,s,x);sol(r,P[i][0]);b.append(r);
rows.push({el:r,key:P[i][0],ok:()=>norm(x.value)==norm(P[i][0]),ans:()=>x.value,clear:()=>x.value=''})})});
/* 4 Collocations */
const C=[["download","a new app"],["send","an email"],["take","a photo"],["make","a video"],["get","directions"],["count","your steps"],["listen to","a playlist"],["book","a flight"]];
ex(4,'Match the phrases','Выбери подходящее окончание.',(b,rows)=>{
const R=["a flight","a new app","a photo","a playlist","a video","an email","directions","your steps"];
[4,0,6,2,7,1,5,3].forEach((i,n)=>{const c=C[i],r=h('div','row'),s=h('select');s.append(new Option('…',''));R.forEach(o=>s.append(new Option(o,o)));
r.append(h('span','num',n+1),h('b','',c[0]),s);sol(r,c[0]+' '+c[1]);b.append(r);
rows.push({el:r,key:c[0]+' '+c[1],ok:()=>s.value==c[1],ans:()=>c[0]+' '+s.value,clear:()=>s.value=''})})});
/* 5 Tenses */
ex(5,'Verb forms','Поставь глагол в нужную форму (A2): past simple, present simple, be going to, present continuous.',(b,rows)=>{
[["Tom ___ (download) a new app yesterday.","past simple","downloaded","download a new app"],["I almost never ___ (read) the news in the evening.","present simple","read","read the news headlines"],["Look! She ___ (take) a photo right now.","present continuous","is taking","take a photo or make a video"],["Next month we ___ (book) a flight to Rome.","be going to","are going to book","book a flight"],["He very rarely ___ (send) emails on Sunday.","present simple","sends","send an email"],["Last night I ___ (listen) to a new playlist.","past simple","listened","listen to a playlist"],["Be quiet! The children ___ (play) a game.","present continuous","are playing","play a game"],["Tonight I ___ (count) my steps with the new app.","be going to","am going to count","count your steps"]].forEach((d,n)=>{
const r=h('div','row'),x=inp(),p=d[0].split('___');r.append(h('span','num',n+1),p[0],x,p[1],h('span','tiny','['+d[1]+']'));sol(r,d[2]);b.append(r);
rows.push({el:r,key:d[3],ok:()=>norm(x.value)==norm(d[2]),ans:()=>x.value,clear:()=>x.value=''})})});
/* 6 Text gaps */
ex(6,'Complete the text','Вставь слова из рамки. Три выражения частоты подбери по смыслу.',(b,rows)=>{
const F=["almost never","very rarely","once in a blue moon"];
const T="Maria loves technology. Every morning she {reads} the news headlines. At work she {sends} an email to her team. She {listens} to a playlist on the bus. She {counts} her steps with an app, and she {downloads} a new app once a month. But she {almost never} reads a book on her phone, she {very rarely} books a flight online, and she plays a game {once in a blue moon}.";
const ws=[];T.replace(/\{([^}]+)\}/g,(m,a)=>ws.push(a));
b.append(Object.assign(h('div','bank'),{innerHTML:''}));const bk=b.lastChild;sh(ws,3).forEach(w=>bk.append(h('span','',w)));
const p=h('p','txt');b.append(p);let last=0,k=0;
T.replace(/\{([^}]+)\}/g,(m,a,i)=>{p.append(T.slice(last,i));last=i+m.length;const x=inp();x.size=14;p.append('('+(++k)+') ',x);const isF=F.includes(a);
rows.push({el:x,key:a,ok:()=>isF?F.includes(norm(x.value)):norm(x.value)==a,ans:()=>x.value,clear:()=>x.value=''})});
p.append(T.slice(last));return ws.map((w,i)=>(i+1)+') '+w).join('  ')});
/* 7 Build the chunk */
ex(7,'Build the chunk','Нажимай на слова по порядку, чтобы собрать выражение. Нажми на слово в строке, чтобы убрать его.',(b,rows)=>{
[8,0,9,6,2,12,5,7].forEach((i,n)=>{const ph=P[i][0],words=ph.split(' ');let pool=sh(words,n+2);if(pool.join(' ')==ph)pool.reverse();let cur=[];
const r=h('div','row'),an=h('div','ans'),pl=h('div','ans');pl.style.border='0';r.append(h('span','tiny',n+1+'. '+P[i][2]),an,pl);
const rd=()=>{an.innerHTML='';pl.innerHTML='';cur.forEach((j,q)=>{const c=h('span','chip',pool[j]);c.onclick=()=>{cur.splice(q,1);rd()};an.append(c)});
pool.forEach((w,j)=>{if(!cur.includes(j)){const c=h('button','',w);c.onclick=()=>{cur.push(j);rd()};pl.append(c)}})};rd();sol(r,ph);b.append(r);
rows.push({el:r,key:ph,ok:()=>cur.map(j=>pool[j]).join(' ')==ph,ans:()=>cur.map(j=>pool[j]).join(' '),clear:()=>{cur=[];rd()}})})});
/* 8 Mini-situations */
ex(8,'Complete the mini-situations','Выбери выражение, которое подходит по смыслу.',(b,rows)=>{
const S=[["Dad is 70. He doesn’t like new technology. He ___ downloads a new app.","almost never","every day","three times a week","almost never"],["Nina is lost in a new city. She wants to ___.","get directions","book a flight","count her steps","get directions"],["Ola goes to Spain in 2015 and in 2024. She flies ___.","once in a blue moon","every week","twice a day","once in a blue moon"],["Max has a new watch. He likes to ___.","count his steps","read a book","send an email","count his steps"],["I’m not a gamer. I ___ play a game.","very rarely","usually","always","very rarely"],["I need to tell my boss about the meeting. I’ll ___.","send an email","download a new app","play a game","send an email"],["It’s 7 a.m. I want to know the world news. I ___.","read the news headlines","book a flight","take a video","read the news headlines"],["My phone is full of music. Now I ___.","listen to a playlist","get directions","count my steps","listen to a playlist"]];
const pos=[1,0,2,1,2,0,2,1];
S.forEach((d,n)=>{const o=[d[2],d[3]];o.splice(pos[n],0,d[1]);const r=h('div','row'),s=h('select'),pt=d[0].split('___');s.append(new Option('…',''));o.forEach(t=>s.append(new Option(t,t)));
r.append(h('span','num',n+1),pt[0],s,pt[1]);sol(r,d[4]);b.append(r);
rows.push({el:r,key:d[4],ok:()=>s.value==d[4],ans:()=>s.value,clear:()=>s.value=''})})});
/* 9 Own sentences */
ex(9,'Write your own sentences','Напиши свои предложения (минимум 4 слова). Нужно использовать оба выражения.',(b,rows)=>{
[["almost never","read a book","I almost never read a book on my phone."],["once in a blue moon","book a flight","I book a flight once in a blue moon."],["very rarely","send an email","I very rarely send an email at night."],["almost never","play a game","My dad almost never plays a game."],["very rarely","count your steps","I very rarely count my steps."]].forEach((d,n)=>{
const r=h('div','row'),t=h('textarea');t.placeholder='…';r.append(h('div','',(n+1)+'. Use: '+d[0]+' + '+d[1]),t);sol(r,d[2]);b.append(r);
rows.push({el:r,key:d[0],ok:()=>norm(t.value).includes(d[0])&&norm(t.value).split(' ').length>=4,ans:()=>t.value,clear:()=>t.value=''})})});
/* COPY */
function copyAll(){let o='English A2 — Tech habits\n';E.forEach(e=>{o+='\n'+e.n+'. '+e.title+(e.checked?' ('+e.rows.filter(r=>r.ok()&&!r.ng).length+'/'+e.rows.filter(r=>!r.ng).length+')':'')+'\n';
if(e.rows.sum)o+='Selected: '+e.rows.sum()+'\n';else e.rows.forEach((r,i)=>{o+=(i+1)+'. '+(r.ans()||'—')+(e.checked?(r.ok()?' ✓':' ✗'):'')+'\n'})});
const pk=Object.entries(prob).map(([k,v])=>k+' ×'+v).join(', ');if(pk)o+='\nProblem words: '+pk+'\n';
const done=()=>{$('#cm').textContent='Скопировано ✓';setTimeout(()=>$('#cm').textContent='',2500)};
const fb=()=>{const t=h('textarea');t.value=o;document.body.append(t);t.select();try{document.execCommand('copy');done()}catch(e){$('#cm').textContent='Не удалось скопировать'}t.remove()};
try{navigator.clipboard.writeText(o).then(done,fb)}catch(e){fb()}}
</script></body></html>
