<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Dictation, errors, sentence builder</title><meta name="color-scheme" content="light dark">
<style>
:root{--bg:#e6f0ff;--card:#fff;--ink:#1d2340;--mut:#5d6488;--ok:#14a37f;--okb:#d4f6ec;--bad:#e5484d;--badb:#ffe1e2;--sun:#ffd23f;--sel:#ece8ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12162b;--card:#1d2342;--ink:#f1f3ff;--mut:#a3aad1;--okb:#0f3b34;--badb:#4a1f27;--sel:#2c2a5e}}
:root[data-theme="dark"]{--bg:#12162b;--card:#1d2342;--ink:#f1f3ff;--mut:#a3aad1;--okb:#0f3b34;--badb:#4a1f27;--sel:#2c2a5e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.45 "Trebuchet MS",system-ui,sans-serif;background-image:radial-gradient(var(--mut) 1px,transparent 1.5px);background-size:26px 26px;background-attachment:fixed}
.wrap{max-width:820px;margin:0 auto;padding:16px}
.hero{background:#2ec4b6;color:#1d2340;border:3px solid #1d2340;border-radius:28px;padding:18px 22px;box-shadow:6px 6px 0 #1d2340;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center}
.hero h1{margin:0;font-size:clamp(26px,6vw,42px);line-height:1.05}.hero p{margin:4px 0 0}
input.nm{font:inherit;border:3px solid #1d2340;border-radius:14px;padding:8px 12px;background:#fff;color:#1d2340;width:200px}
.card{background:var(--card);border:3px solid var(--ink);border-radius:24px;padding:18px;margin-top:22px;box-shadow:6px 6px 0 var(--a)}
.card h2{margin:0;font-size:23px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.num{background:var(--a);color:#1d2340;border:3px solid var(--ink);border-radius:50%;width:38px;height:38px;display:grid;place-items:center}
.sc{margin-left:auto;font-size:15px;background:var(--sel);border-radius:99px;padding:2px 12px}
.ins{color:var(--mut);margin:6px 0 14px}button{font:inherit;cursor:pointer;color:var(--ink)}
.btn{background:var(--a);color:#1d2340;border:3px solid var(--ink);border-radius:14px;padding:7px 14px;box-shadow:3px 3px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:none}.btn.g{background:var(--card);color:var(--ink)}.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
:focus-visible{outline:3px solid var(--bad);outline-offset:2px}
.q{display:flex;gap:12px;padding:12px;border:2px dashed var(--ink);border-radius:16px;margin-bottom:10px}
.q.ok{background:var(--okb);border:2px solid var(--ok)}.q.bad{background:var(--badb);border:2px solid var(--bad)}.q.show{background:var(--sel);border:2px solid var(--ink)}
.qn{font-weight:700;color:var(--mut);min-width:20px}.qb{flex:1;min-width:0}.qp{margin-bottom:8px}
.inp{font:inherit;width:100%;border:2px solid var(--ink);border-radius:12px;padding:8px 12px;background:var(--card);color:var(--ink)}
.fb{font-size:14px;margin-top:6px}.spk{border:2px solid var(--ink);background:var(--sun);color:#1d2340;border-radius:50%;width:38px;height:38px;margin-right:6px}
.err{background:var(--badb);border-radius:8px;padding:2px 8px}
.pool,.line{display:flex;gap:8px;flex-wrap:wrap;min-height:44px;padding:6px;border-radius:12px}.line{border:2px dashed var(--ink);margin-bottom:8px}
.chip{background:var(--sel);color:var(--ink);border:2px solid var(--ink);border-radius:99px;padding:3px 12px}.chip.used{opacity:.25;pointer-events:none}.line .chip{background:var(--sun);color:#1d2340}
.vbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:14px;color:var(--mut);margin-top:12px}
.vbar select{font:inherit;max-width:100%;border:2px solid var(--ink);border-radius:10px;background:var(--card);color:var(--ink)}
</style></head><body><div class="wrap">
<header class="hero"><div><h1>Listen, fix, build</h1><p>Диктант, поиск ошибок и сборка предложений</p></div><input class="nm" id="nm" placeholder="Имя студента" aria-label="Имя студента"></header>
<div class="vbar"><span id="vst"></span><select id="vsel" aria-label="Голос"></select></div>
<main id="main"></main></div>
<script>
const $=s=>document.querySelector(s),sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const norm=s=>(s||'').toLowerCase().replace(/[’']/g,"'").replace(/[^a-z' ]/g,' ').replace(/\s+/g,' ').trim();
let voices=[],V=null;const TTS='speechSynthesis' in window;
function loadV(){if(!TTS)return;voices=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));const s=$('#vsel');s.innerHTML=voices.map((v,i)=>`<option value="${i}">${v.name}</option>`).join('');const p=voices.find(v=>/google us english/i.test(v.name))||voices.find(v=>/samantha/i.test(v.name))||voices.find(v=>v.lang=='en-US')||voices[0];if(p){V=p;s.value=voices.indexOf(p)}$('#vst').textContent=V?'Голос: '+V.name:'Английский голос не найден'}
function say(t,r=.9){if(!TTS){alert('Озвучка не поддерживается. Открой страницу в Chrome или Safari.');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);if(V)u.voice=V;u.lang='en-US';u.rate=r;setTimeout(()=>speechSynthesis.speak(u),30)}
const P={};const addP=k=>P[k]=(P[k]||0)+1;
const D=[['I put on my coat and left.','put on'],['Can you carry this box for me?','carry'],['She is dressing her baby sister.','dress'],['Take off your hat, please.','take off'],['We get dressed at seven o’clock.','get dressed'],['He never wears a tie.','wear']];
const E=[['She wear a blue dress yesterday.','She wore a blue dress yesterday.','wear'],['He putted on his jacket.','He put on his jacket.','put on'],['I get dress at seven every morning.','I get dressed at seven every morning.','get dressed'],['She is carring a heavy bag.','She is carrying a heavy bag.','carry'],['He get undressed and took a shower.','He got undressed and took a shower.','get undressed'],['Pick off your dirty clothes from the floor.','Pick up your dirty clothes from the floor.','pick up dirty clothes'],['Mum is dressed the baby now.','Mum is dressing the baby now.','dress']];
const S=[['She wears a red coat every winter.','wear'],['Please take off your wet shoes.','take off'],['He got undressed and went to bed.','get undressed'],['Get dressed, we are late!','get dressed'],['I carry a heavy bag to school.','carry'],['Pick up your dirty clothes from the floor.','pick up dirty clothes']];
const X=[['dic','🎧','Dictation','Нажми 🔊 (или 🐢 для медленного темпа), послушай и впиши предложение целиком.','#ffd23f'],['err','🔎','Find & fix','В каждом предложении есть ошибка. Перепиши предложение правильно.','#ff7aa8'],['bld','🧩','Sentence builder','Собери предложение: нажимай на слова по порядку. Нажми на слово в строке, чтобы убрать его.','#6bd0ff']];
const Q={dic:[],err:[]},B={dic:()=>sh(D).map(r=>({a:[r[0]],say:r[0],w:r[1]})),err:()=>sh(E).map(r=>({p:`<span class="err">${r[0]}</span>`,a:[r[1]],w:r[2]}))};
let BL=[];function bnew(){BL=sh(S).map(r=>({a:r[0],w:r[1],ch:sh(r[0].replace(/[.!?,]/g,'').split(' ').map((t,i)=>({t,i}))),pick:[],st:null}));bdraw()}
function draw(id){$('#b-'+id).innerHTML=Q[id].map((q,i)=>`<div class="q" id="q-${id}-${i}"><div class="qn">${i+1}</div><div class="qb"><div class="qp">${q.say?`<button class="spk" data-say="${q.say}" aria-label="Listen">🔊</button><button class="spk" data-say="${q.say}" data-slow="1" aria-label="Slow">🐢</button>`:q.p}</div><input class="inp" data-e="${id}" data-q="${i}" value="${(q.val||'').replace(/"/g,'&quot;')}" placeholder="type here…" autocomplete="off" autocapitalize="off" spellcheck="false"><div class="fb"></div></div></div>`).join('');paint(id)}
function paint(id){let ok=0;Q[id].forEach((q,i)=>{const r=$(`#q-${id}-${i}`);r.className='q'+(q.shown?' show':q.st?' '+q.st:'');r.querySelector('.fb').textContent=q.shown?'💡 '+q.a[0]:q.st=='bad'?'Проверь орфографию, форму слова и порядок слов':q.st=='ok'?'✅ Верно':'';if(q.st=='ok'&&!q.shown)ok++});$('#sc-'+id).textContent=Q[id].some(q=>q.st||q.shown)?ok+'/'+Q[id].length:''}
function check(id){Q[id].forEach(q=>{if(q.shown)return;q.st=q.val&&q.a.some(a=>norm(a)==norm(q.val))?'ok':'bad';if(q.st=='bad')addP(q.w)});paint(id)}
function show(id){Q[id].forEach(q=>{if(q.st!='ok'){if(!q.st)addP(q.w);q.shown=true}});paint(id)}
function reset(id){Q[id]=B[id]();draw(id)}
function bdraw(){$('#b-bld').innerHTML=BL.map((q,i)=>`<div class="q" id="bq-${i}"><div class="qn">${i+1}</div><div class="qb"><div class="line" data-ln="${i}">${q.pick.map(k=>`<button class="chip" data-un="${i}" data-k="${k}">${q.ch.find(c=>c.i==k).t}</button>`).join('')}</div><div class="pool">${q.ch.map(c=>`<button class="chip${q.pick.includes(c.i)?' used':''}" data-pk="${i}" data-k="${c.i}">${c.t}</button>`).join('')}</div><div class="fb"></div></div></div>`).join('');BL.forEach((q,i)=>bpaint(i));bsc()}
function bpaint(i){const q=BL[i],r=$('#bq-'+i);r.className='q'+(q.shown?' show':q.st?' '+q.st:'');r.querySelector('.fb').textContent=q.shown?'💡 '+q.a:q.st=='bad'?'Не совсем: поменяй порядок слов':q.st=='ok'?'✅ Верно':''}
function bsc(){const n=BL.filter(q=>q.st=='ok'&&!q.shown).length;$('#sc-bld').textContent=BL.some(q=>q.st||q.shown)?n+'/'+BL.length:''}
const bline=q=>q.pick.map(k=>q.ch.find(c=>c.i==k).t).join(' ');
function bcheck(){BL.forEach((q,i)=>{if(q.shown)return;q.st=norm(bline(q))==norm(q.a)?'ok':'bad';if(q.st=='bad')addP(q.w);bpaint(i)});bsc()}
function bshow(){BL.forEach((q,i)=>{if(q.st!='ok'){if(!q.st)addP(q.w);q.shown=true}bpaint(i)});bsc()}
function report(){const L=['Name: '+($('#nm').value||'—'),''];[['dic','1. Dictation'],['err','2. Find & fix']].forEach(([id,n])=>{L.push(n+' ('+($('#sc-'+id).textContent||'не проверено')+')');Q[id].forEach((q,i)=>L.push(`  ${i+1}) ${q.say?'(audio)':q.p.replace(/<[^>]+>/g,'')} | answer: ${q.val||'—'} | correct: ${q.a[0]} | ${q.shown?'shown':q.st=='ok'?'OK':q.st=='bad'?'WRONG':'-'}`));L.push('')});L.push('3. Sentence builder ('+($('#sc-bld').textContent||'не проверено')+')');BL.forEach((q,i)=>L.push(`  ${i+1}) answer: ${bline(q)||'—'} | correct: ${q.a} | ${q.shown?'shown':q.st=='ok'?'OK':q.st=='bad'?'WRONG':'-'}`));L.push('','Problem words: '+(Object.keys(P).map(k=>k+' ×'+P[k]).join(', ')||'none'));return L.join('\n')}
let h='';X.forEach((e,i)=>{h+=`<section class="card" style="--a:${e[4]}"><h2><span class="num">${i+1}</span>${e[1]} ${e[2]}<span class="sc" id="sc-${e[0]}"></span></h2><p class="ins">${e[3]}</p><div id="b-${e[0]}"></div><div class="acts"><button class="btn" data-a="check" data-e="${e[0]}">Проверить</button><button class="btn g" data-a="show" data-e="${e[0]}">Показать ответы</button><button class="btn g" data-a="reset" data-e="${e[0]}">Заново</button></div></section>`});
h+=`<section class="card" style="--a:#b8a4ff"><h2><span class="num">📋</span>Мои ответы</h2><p class="ins">Собери все ответы и скопируй, чтобы отправить преподавателю.</p><div class="acts"><button class="btn" id="rep">Собрать и скопировать</button></div><textarea id="rout" class="inp" style="margin-top:12px;min-height:150px" readonly></textarea><div class="fb" id="rst"></div></section>`;
$('#main').innerHTML=h;reset('dic');reset('err');bnew();
if(TTS){loadV();speechSynthesis.onvoiceschanged=loadV;$('#vsel').onchange=e=>{V=voices[e.target.value];$('#vst').textContent='Голос: '+V.name}}else $('#vst').textContent='Озвучка недоступна';
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset;
if(d.say)return say(d.say,d.slow?.55:.9);
if(d.a){if(d.e=='bld')return{check:bcheck,show:bshow,reset:bnew}[d.a]();return{check,show,reset}[d.a](d.e)}
if(d.pk!=null){const q=BL[d.pk];if(q.shown)return;q.pick.push(+d.k);q.st=null;return bdraw()}
if(d.un!=null){const q=BL[d.un];if(q.shown)return;q.pick=q.pick.filter(k=>k!=d.k);q.st=null;return bdraw()}
if(t.id=='rep'){const o=$('#rout');o.value=report();o.select();const ok=()=>$('#rst').textContent='✅ Скопировано! Вставь в чат с преподавателем.',no=()=>{let r=false;try{r=document.execCommand('copy')}catch(x){}r?ok():$('#rst').textContent='Текст выделен: нажми Ctrl/⌘+C'};navigator.clipboard?navigator.clipboard.writeText(o.value).then(ok,no):no()}});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.e){const q=Q[t.dataset.e][t.dataset.q];if(q.shown)return;q.val=t.value;q.st=null;const r=t.closest('.q');r.className='q';r.querySelector('.fb').textContent=''}});
</script></body></html>
