<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Word Forms Gym 2</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏋️</text></svg>">
<style>
:root{--bg:#fff7e6;--card:#fff;--ink:#1d1b3a;--mut:#6b6890;--pri:#5b3df5;--ok:#12a150;--bad:#e5384f;--hot:#ff7a3d;--line:#e6dcc3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17152b;--card:#232042;--ink:#f3f0ff;--mut:#a9a4d4;--pri:#9b86ff;--ok:#3ddc84;--bad:#ff6b81;--hot:#ffa05c;--line:#3a3663}}
:root[data-theme="dark"]{--bg:#17152b;--card:#232042;--ink:#f3f0ff;--mut:#a9a4d4;--pri:#9b86ff;--ok:#3ddc84;--bad:#ff6b81;--hot:#ffa05c;--line:#3a3663}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Trebuchet MS","Segoe UI",system-ui,sans-serif}
header{padding:28px 18px 22px;background:linear-gradient(120deg,#5b3df5,#c23fd8 60%,#ff7a3d);color:#fff;text-align:center}
h1{margin:0;font:800 clamp(28px,6vw,46px)/1.1 "Arial Black",Impact,sans-serif;letter-spacing:-.5px}
header p{margin:8px 0 0;opacity:.92}
#score{display:inline-block;margin-top:12px;background:#fff3;padding:4px 16px;border-radius:99px;font-weight:700}
.wrap{max-width:1100px;margin:0 auto;padding:18px;display:grid;grid-template-columns:1fr 250px;gap:18px;align-items:start}
@media(max-width:820px){.wrap{grid-template-columns:1fr}aside{order:-1;position:static!important}}
section{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:18px;margin-bottom:18px;max-width:100%}
section h2{margin:0 0 4px;font-size:22px}
.intro{color:var(--mut);margin:0 0 12px;font-size:14px}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--pri);color:#fff;margin-left:6px;vertical-align:middle}
.badge.p{background:var(--hot)}
aside{position:sticky;top:12px;background:var(--card);border:2px dashed var(--bad);border-radius:20px;padding:14px}
aside h3{margin:0 0 8px;font-size:16px}
#bad span{display:inline-block;margin:3px;padding:2px 10px;border-radius:99px;background:var(--bad);color:#fff;font-size:14px;cursor:pointer}
button{font:inherit;cursor:pointer;border:2px solid var(--pri);background:transparent;color:var(--pri);border-radius:12px;padding:5px 12px;font-weight:700}
button:hover{background:var(--pri);color:#fff}
button:focus-visible,input:focus-visible{outline:3px solid var(--hot);outline-offset:2px}
button.main{background:var(--pri);color:#fff}
.it{border-top:1px solid var(--line);padding:12px 0}
.q{margin-bottom:8px}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.opts button.sel{background:var(--pri);color:#fff}
input[type=text]{font:inherit;width:100%;max-width:420px;padding:7px 12px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
.fb{margin-left:6px;font-weight:700}
.ok{color:var(--ok)}.no{color:var(--bad)}
.rev{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.rev div{border:1px solid var(--line);border-radius:14px;padding:8px 12px}
.rev small{color:var(--mut)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cols button{display:block;width:100%;margin-bottom:8px;text-align:left}
.cols button.sel{background:var(--hot);border-color:var(--hot);color:#fff}
.cols button.done{visibility:hidden}
.chips button{margin:3px}
.chips .k1{background:var(--hot);border-color:var(--hot);color:#fff}
.chips .k2{background:var(--ok);border-color:var(--ok);color:#fff}
#status{font-size:13px;color:var(--mut)}select{font:inherit;max-width:230px;padding:5px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}table.cw{border-collapse:collapse;margin:12px 0}.cw td{width:34px;height:34px;padding:0;position:relative}.cw td.c{border:2px solid var(--ink);background:var(--card)}.cw input{width:100%;height:100%;border:0;background:transparent;color:var(--ink);text-align:center;font:700 18px inherit;text-transform:uppercase;padding:6px 0 0}.cw td.g{background:#12a15033}.cw td.x{background:#e5384f33}.cw sup{position:absolute;top:0;left:2px;font-size:9px;color:var(--mut);pointer-events:none}.cl{font-size:14px;columns:2 260px}
</style></head>
<body>
<header><h1>Word Forms Gym 2 🔁</h1><p>Повторение: 2 упражнения на узнавание и 1 на письмо</p><div id="score">Баллы: 0</div></header>
<div class="wrap"><main id="main"></main>
<aside><h3>⚠️ Проблемные слова</h3><div id="bad"><small>Пока ошибок нет — отлично!</small></div></aside></div>
<script>
const L=`argue|argument|ˈɑːrɡjuː|ˈɑːrɡjumənt|спорить|спор, аргумент
sell|sale|sel|seɪl|продавать|продажа
serve|service|sɜːrv|ˈsɜːrvɪs|обслуживать|обслуживание, услуга
complain|complaint|kəmˈpleɪn|kəmˈpleɪnt|жаловаться|жалоба
deliver|delivery|dɪˈlɪvər|dɪˈlɪvəri|доставлять|доставка
succeed|success|səkˈsiːd|səkˈses|преуспевать|успех
choose|choice|tʃuːz|tʃɔɪs|выбирать|выбор
value|value|ˈvæljuː|ˈvæljuː|ценить|ценность, стоимость
respond|response|rɪˈspɑːnd|rɪˈspɑːns|отвечать, реагировать|ответ, реакция
achieve|achievement|əˈtʃiːv|əˈtʃiːvmənt|достигать|достижение
consider|consideration|kənˈsɪdər|kənˌsɪdəˈreɪʃn|рассматривать|рассмотрение
agree|agreement|əˈɡriː|əˈɡriːmənt|соглашаться|соглашение, согласие
pay|payment|peɪ|ˈpeɪmənt|платить|платёж, оплата
lose|loss|luːz|lɔːs|терять, проигрывать|потеря, убыток
manage|management|ˈmænɪdʒ|ˈmænɪdʒmənt|управлять, справляться|управление
treat|treatment|triːt|ˈtriːtmənt|лечить, обращаться|лечение, обращение
fail|failure|feɪl|ˈfeɪljər|терпеть неудачу|неудача, провал
demonstrate|demonstration|ˈdemənstreɪt|ˌdemənˈstreɪʃn|демонстрировать|демонстрация
improve|improvement|ɪmˈpruːv|ɪmˈpruːvmənt|улучшать(ся)|улучшение
explain|explanation|ɪkˈspleɪn|ˌekspləˈneɪʃn|объяснять|объяснение
compensate|compensation|ˈkɑːmpenseɪt|ˌkɑːmpenˈseɪʃn|компенсировать|компенсация
attach|attachment|əˈtætʃ|əˈtætʃmənt|прикреплять|вложение, приложение
tempt|temptation|tempt|tempˈteɪʃn|искушать, соблазнять|искушение, соблазн`.split("\n").map(r=>r.split("|"));
const sh=a=>[...a].sort(()=>Math.random()-.5);
const S=[
["Choose the right form","Выбери форму слова, которая подходит по смыслу и грамматике.","c",[
["The two sides signed an ___ yesterday.","agreement",["agree","agreement","argue","argument"],"agree agreement"],
["Don’t ___ with me — I’m right!","argue",["argue","argument","agree","agreement"],"argue argument"],
["They ___ breakfast from 7 to 10 a.m.","serve",["serve","service","sell","sale"],"serve service"],
["We’re proud of this big ___.","success",["succeed","success","fail","failure"],"succeed success"],
["I need a minute to ___ your offer.","consider",["consider","consideration","choose","choice"],"consider consideration"],
["There has been a clear ___ in his English.","improvement",["improve","improvement","explain","explanation"],"improve improvement"],
["Please ___ your invoice by Friday.","pay",["pay","payment","lose","loss"],"pay payment"],
["He ___ the new phone to the audience.","demonstrated",["demonstrated","demonstration","delivered","delivery"],"demonstrate demonstration"]]],
["Listen and choose","Нажми 🔊, послушай слово и выбери, как оно пишется.","l",[]],
["Short story: write the form","Это одна история. Впиши слово в нужной форме (в скобках — исходное).","t",[
["Last week I ordered a laptop, and the ___ was supposed to arrive on Monday. (deliver)",["delivery"],0,"deliver delivery"],
["It came on Friday, so I decided to ___ to the company. (complain)",["complain"],0,"complain complaint"],
["I wrote an email with a clear ___ of the problem. (explain)",["explanation"],0,"explain explanation"],
["The staff ___ to me politely and quickly. (respond)",["responded"],0,"respond response"],
["They promised to ___ me for the delay. (compensate)",["compensate"],0,"compensate compensation"],
["The manager said that ___ takes such cases seriously. (manage)",["management"],0,"manage management"],
["I was happy with the ___ I received. (treat)",["treatment"],0,"treat treatment"],
["In the end, the whole story was a ___. (succeed)",["success"],0,"succeed success"]]]];
// listening items are generated
{const pool=sh(L).slice(0,8);S[1][3]=pool.map(w=>{const k=Math.random()<.5?0:1,a=w[k];const others=sh(L.flatMap(x=>[x[0],x[1]]).filter(x=>x!=a&&x!=w[1-k])).slice(0,2);return["🔊",a,[a,w[1-k],...others],w[0]+" "+w[1]]})}
const bad=new Set(),res=[];let pts=0,tot=0;
const $=(s,p=document)=>p.querySelector(s),el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
function renderBad(){const b=$("#bad");b.innerHTML=bad.size?"":"<small>Пока ошибок нет — отлично!</small>";bad.forEach(w=>{const s=el("span","",w+" 🔊");s.onclick=()=>say(w);b.append(s)})}
function addScore(){$("#score").textContent="Баллы: "+pts+" / "+tot}
let voice=null,chosen=false;
function pick(){const v=speechSynthesis.getVoices().filter(x=>/^en/i.test(x.lang));voice=v.find(x=>/Google US English/i.test(x.name))||v.find(x=>/Samantha/i.test(x.name))||v.find(x=>/natural/i.test(x.name)&&x.lang==="en-US")||v.find(x=>x.lang==="en-US")||v[0]||null;const s=$("#status");if(s)s.textContent=voice?"Голос: "+voice.name:"Английский голос не найден — установи его в настройках устройства"}
if("speechSynthesis" in window)speechSynthesis.onvoiceschanged=pick;
function say(t){if(!("speechSynthesis" in window)){alert("Озвучка не поддерживается в этом браузере");return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);if(!voice)pick();if(voice)u.voice=voice;u.lang="en-US";u.rate=.9;speechSynthesis.speak(u)}
const M=$("#main");
S.forEach((sec,si)=>{const [title,intro,kind,items]=sec;const prod=kind=="t";
const s=el("section","",`<h2>${si+1}. ${title}<span class="badge ${prod?"p":""}">${prod?"писать":"выбрать"}</span></h2><p class=intro>${intro}</p>`);
if(kind=="l"){const st=el("p","","");st.id="status";st.style.fontSize="13px";s.append(st);setTimeout(pick,300)}
sh(items).forEach(it=>{const [q,a,o,w]=it;const d=el("div","it");let get;
if(kind=="l"){const b=el("button","main","🔊 Слушать");b.onclick=()=>say(a);d.append(b)}else d.append(el("div","q",q));
if(kind!="t"){const ow=el("div","opts");let v="";sh(o).forEach(x=>{const b=el("button","",x);b.onclick=()=>{v=x;ow.querySelectorAll("button").forEach(y=>y.classList.remove("sel"));b.classList.add("sel")};ow.append(b)});d.append(ow);get=()=>v}
else{const i=el("input");i.type="text";i.autocomplete="off";i.placeholder="Type here…";d.append(i);get=()=>i.value}
const c=el("button","main","Проверить"),sw=el("button","","Показать ответ"),f=el("span","fb");let counted=false;
const rec={q:kind=="l"?"Listen: "+a:q,a:"",ok:null};res.push(rec);
const text=kind=="t"?a[0]:a;
c.onclick=()=>{const v=get().trim();if(!v){f.textContent="Сначала ответь";f.className="fb";return}
const ok=kind=="t"?a.includes(v.toLowerCase().replace(/[.!]$/,"")):v==a;
rec.a=v;rec.ok=ok;if(!counted){counted=true;tot++;if(ok)pts++;addScore()}
f.className="fb "+(ok?"ok":"no");f.textContent=ok?"✓ Верно!":"✗ Попробуй ещё";if(!ok){w.split(" ").forEach(x=>bad.add(x));renderBad()}};
sw.onclick=()=>{f.className="fb";f.textContent="Ответ: "+text;if(!counted){counted=true;tot++;addScore();w.split(" ").forEach(x=>bad.add(x));renderBad()}};
const r=el("div","row");r.append(c,sw,f);d.append(r);s.append(d)});M.append(s)});
{const s=el("section","","<h2>Итог 📋</h2><p class=intro>Скопируй свои ответы и пришли учителю.</p>");
const cp=el("button","main","📋 Скопировать мои ответы"),m=el("span","fb");
cp.onclick=()=>{let t="Word Forms Gym 2 — результат: "+pts+"/"+tot+"\n\n";res.filter(r=>r.ok!==null).forEach(r=>t+=(r.ok?"✓ ":"✗ ")+r.q+" → "+r.a+"\n");t+="\nПроблемные слова: "+([...bad].join(", ")||"нет");
const ok=()=>m.textContent="Скопировано ✓";const fb=()=>{const x=el("textarea");x.value=t;document.body.append(x);x.select();try{document.execCommand("copy");ok()}catch(e){m.textContent="Не удалось скопировать"}x.remove()};
(navigator.clipboard?navigator.clipboard.writeText(t).then(ok,fb):fb())};
s.append(cp,m);M.append(s)}
</script></body></html>
