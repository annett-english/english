<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Review & Production: wear, carry, dress</title><meta name="color-scheme" content="light dark">
<style>
:root{--bg:#e6f0ff;--card:#fff;--ink:#1d2340;--mut:#5d6488;--ok:#14a37f;--okb:#d4f6ec;--bad:#e5484d;--badb:#ffe1e2;--sun:#ffd23f;--sel:#ece8ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12162b;--card:#1d2342;--ink:#f1f3ff;--mut:#a3aad1;--okb:#0f3b34;--badb:#4a1f27;--sel:#2c2a5e}}
:root[data-theme="dark"]{--bg:#12162b;--card:#1d2342;--ink:#f1f3ff;--mut:#a3aad1;--okb:#0f3b34;--badb:#4a1f27;--sel:#2c2a5e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.45 "Trebuchet MS",system-ui,sans-serif;background-image:radial-gradient(var(--mut) 1px,transparent 1.5px);background-size:26px 26px;background-attachment:fixed}
.wrap{max-width:820px;margin:0 auto;padding:16px}
.hero{background:#ff7aa8;color:#1d2340;border:3px solid #1d2340;border-radius:28px;padding:18px 22px;box-shadow:6px 6px 0 #1d2340;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center}
.hero h1{margin:0;font-size:clamp(26px,6vw,42px);line-height:1.05}.hero p{margin:4px 0 0}
input.nm{font:inherit;border:3px solid #1d2340;border-radius:14px;padding:8px 12px;background:#fff;color:#1d2340;width:200px}
.card{background:var(--card);border:3px solid var(--ink);border-radius:24px;padding:18px;margin-top:22px;box-shadow:6px 6px 0 var(--a)}
.card h2{margin:0;font-size:23px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.num{background:var(--a);color:#1d2340;border:3px solid var(--ink);border-radius:50%;width:38px;height:38px;display:grid;place-items:center}
.sc{margin-left:auto;font-size:15px;background:var(--sel);border-radius:99px;padding:2px 12px}
.ins{color:var(--mut);margin:6px 0 14px}button{font:inherit;cursor:pointer;color:var(--ink)}
.btn{background:var(--a);color:#1d2340;border:3px solid var(--ink);border-radius:14px;padding:7px 14px;box-shadow:3px 3px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:none}.btn.g{background:var(--card);color:var(--ink)}.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
:focus-visible{outline:3px solid var(--bad);outline-offset:2px}
.q{display:flex;gap:12px;padding:12px;border:2px dashed var(--ink);border-radius:16px;margin-bottom:10px}
.q.ok{background:var(--okb);border:2px solid var(--ok)}.q.bad{background:var(--badb);border:2px solid var(--bad)}.q.show{background:var(--sel);border:2px solid var(--ink)}
.qn{font-weight:700;color:var(--mut);min-width:20px}.qb{flex:1;min-width:0}.qp{margin-bottom:8px}.ru{font-size:18px}
.inp,textarea{font:inherit;width:100%;border:2px solid var(--ink);border-radius:12px;padding:8px 12px;background:var(--card);color:var(--ink)}textarea{min-height:90px}
.fb{font-size:14px;margin-top:6px}.spk{border:2px solid var(--ink);background:var(--sun);color:#1d2340;border-radius:50%;width:34px;height:34px}
.bank{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.chip{background:var(--sel);border:2px solid var(--ink);border-radius:99px;padding:2px 12px}
.chip.ok{background:var(--okb);border-color:var(--ok)}.chip.no{background:var(--badb);border-color:var(--bad)}
.scene{font-size:34px;line-height:1}.vbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:14px;color:var(--mut)}
.vbar select{font:inherit;max-width:100%;border:2px solid var(--ink);border-radius:10px;background:var(--card);color:var(--ink)}
</style></head><body><div class="wrap">
<header class="hero"><div><h1>Review & Production</h1><p>wear · carry · dress · put on · take off · get dressed · get undressed · pick up</p></div><input class="nm" id="nm" placeholder="Имя студента" aria-label="Имя студента"></header>
<div class="vbar" style="margin-top:12px"><span id="vst"></span><select id="vsel" aria-label="Голос"></select></div>
<main id="main"></main></div>
<script>
const $=s=>document.querySelector(s),sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const norm=s=>(s||'').toLowerCase().replace(/[’']/g,"'").replace(/[^a-z' ]/g,' ').replace(/\s+/g,' ').trim();
let voices=[],V=null;const TTS='speechSynthesis' in window;
function loadV(){if(!TTS)return;voices=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));const s=$('#vsel');s.innerHTML=voices.map((v,i)=>`<option value="${i}">${v.name}</option>`).join('');const p=voices.find(v=>/google us english/i.test(v.name))||voices.find(v=>/samantha/i.test(v.name))||voices.find(v=>v.lang=='en-US')||voices[0];if(p){V=p;s.value=voices.indexOf(p)}$('#vst').textContent=V?'Голос: '+V.name:'Английский голос не найден'}
function say(t){if(!TTS){alert('Озвучка не поддерживается. Открой страницу в Chrome или Safari.');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);if(V)u.voice=V;u.lang='en-US';u.rate=.9;setTimeout(()=>speechSynthesis.speak(u),30)}
const P={};const addP=k=>P[k]=(P[k]||0)+1;
/* data */
const T1=[['Сегодня на нём чёрный костюм.','He is ___ a black suit.',['wearing','wears'],'wear'],['Помоги мне нести эти сумки.','Help me ___ these bags.',['carry'],'carry'],['Я одеваю дочку каждое утро.','I ___ my daughter every morning.',['dress'],'dress'],['Надень шапку!','___ your hat!',['put on'],'put on'],['Сними мокрые носки.','___ your wet socks.',['take off'],'take off'],['Одевайся быстрее!','___ quickly!',['get dressed'],'get dressed'],['Он разделся и лёг в кровать.','He ___ and went to bed.',['got undressed'],'get undressed'],['Подбери грязную одежду с пола.','___ your dirty clothes from the floor.',['pick up'],'pick up dirty clothes']];
const T2=[['Yesterday Tom ___ (get dressed) in five minutes.',['got dressed'],'get dressed'],['He ___ (put on) his coat because it was cold.',['put on'],'put on'],['He ___ (carry) a heavy bag to the bus stop.',['carried'],'carry'],['On the bus he ___ (take off) his gloves.',['took off'],'take off'],['Tom has never ___ (wear) a tie.',['worn'],'wear'],['At home he ___ (get undressed) and took a shower.',['got undressed'],'get undressed'],['His mum was ___ (dress) his little brother.',['dressing'],'dress'],['She asked Tom to ___ (pick up) the dirty clothes.',['pick up'],'pick up dirty clothes']];
const RX={'wear':/\b(wear|wears|wearing|wore|worn)\b/,'carry':/\b(carry|carries|carrying|carried)\b/,'put on':/\b(put|puts|putting) on\b/,'take off':/\b(take|takes|taking|took|taken) off\b/,'get dressed':/\b(get|gets|getting|got|gotten) dressed\b/,'get undressed':/\b(get|gets|getting|got|gotten) undressed\b/,'pick up':/\b(pick|picks|picking|picked) up\b/};
const T3=[['🌧️🧥','It’s raining and you are going out. What do you do?',['put on'],'When it rains, I put on my raincoat and take an umbrella.'],['🛏️🧦','Describe your morning room routine.',['get dressed','pick up'],'I get dressed quickly, then I pick up my dirty clothes from the floor.'],['🎒📚','What do you usually carry to school or work?',['carry'],'I carry a laptop, a notebook and a bottle of water.'],['👗👟','What are you wearing today?',['wear'],'Today I’m wearing jeans, a white T-shirt and sneakers.'],['🌙🛁','After a long day you are at home. What do you do first?',['take off','get undressed'],'First I take off my shoes, then I get undressed and take a shower.']];
const X=[['t1','🔤','Translate & recall','Review: переведи и впиши пропущенное слово или фразу по памяти.','#ffd23f'],['t2','📖','Tom’s day','Production: вставь слово в нужной форме (Past Simple, Past Participle или -ing).','#2ec4b6'],['t3','🗣️','Say it & write it','Production: напиши 1–2 предложения про каждую ситуацию, используя слова из задания. Затем прочитай вслух.','#ff9f6b']];
const Q={t1:[],t2:[]},W3=[];
const B={t1:()=>sh(T1).map(r=>({p:`<div class="ru">${r[0]}</div>${r[1]}`,ans:r[2],w:r[3]})),t2:()=>sh(T2).map(r=>({p:r[0],ans:r[1],w:r[2]}))};
function draw(id){const bank=id=='t1'?`<div class="bank">${sh(['wear','carry','dress','put on','take off','get dressed','get undressed','pick up']).map(t=>`<span class="chip">${t}</span>`).join('')}</div>`:'';
$('#b-'+id).innerHTML=bank+Q[id].map((q,i)=>`<div class="q" id="q-${id}-${i}"><div class="qn">${i+1}</div><div class="qb"><div class="qp">${q.p}</div><input class="inp" data-e="${id}" data-q="${i}" value="${(q.val||'').replace(/"/g,'&quot;')}" placeholder="type here…" autocomplete="off" autocapitalize="off" spellcheck="false"><div class="fb"></div></div></div>`).join('');paint(id)}
function paint(id){let ok=0;Q[id].forEach((q,i)=>{const r=$(`#q-${id}-${i}`);r.className='q'+(q.shown?' show':q.st?' '+q.st:'');r.querySelector('.fb').textContent=q.shown?'💡 '+q.ans.join(' / '):q.st=='bad'?'Попробуй ещё раз':q.st=='ok'?'✅ Верно':'';if(q.st=='ok'&&!q.shown)ok++});$('#sc-'+id).textContent=Q[id].some(q=>q.st||q.shown)?ok+'/'+Q[id].length:''}
const okq=q=>q.val&&q.ans.some(a=>norm(a)==norm(q.val));
function check(id){Q[id].forEach(q=>{if(q.shown)return;q.st=okq(q)?'ok':'bad';if(q.st=='bad')addP(q.w)});paint(id)}
function show(id){Q[id].forEach(q=>{if(q.st!='ok'){if(!q.st)addP(q.w);q.shown=true}});paint(id)}
function reset(id){Q[id]=B[id]();draw(id)}
/* t3 */
function t3Draw(){$('#b-t3').innerHTML=T3.map((r,i)=>`<div class="q" id="q-t3-${i}"><div class="qn">${i+1}</div><div class="qb"><div class="scene">${r[0]}</div><div class="qp">${r[1]}</div><div class="bank">${r[2].map(w=>`<span class="chip" id="c-${i}-${r[2].indexOf(w)}">${w}</span>`).join('')}</div><textarea data-t3="${i}" placeholder="Write here…" spellcheck="false"></textarea><div class="acts" style="margin-top:8px"><button class="btn g" data-chk="${i}">Проверить</button><button class="btn g" data-mod="${i}">Образец</button><button class="spk" data-say="${r[3]}" aria-label="Listen model">🔊</button></div><div class="fb" id="f-${i}"></div></div></div>`).join('')}
function t3Check(i){const t=' '+norm(document.querySelector(`[data-t3="${i}"]`).value)+' ';let n=0;T3[i][2].forEach((w,j)=>{const f=(RX[w]||RX['pick up']).test(t.trim());$(`#c-${i}-${j}`).className='chip '+(f?'ok':'no');if(f)n++;else addP(w)});W3[i]=n;const tot=T3[i][2].length;$('#f-'+i).textContent=n==tot?'✅ Все слова использованы. Теперь прочитай вслух!':`Использовано ${n} из ${tot}. Добавь недостающее слово (красное).`;$('#sc-t3').textContent=T3.reduce((s,r,k)=>s+(W3[k]||0),0)+'/'+T3.reduce((s,r)=>s+r[2].length,0)}
function report(){const L=['Name: '+($('#nm').value||'—'),''];[['t1','1. Translate & recall'],['t2','2. Tom’s day']].forEach(([id,n])=>{L.push(n+' ('+($('#sc-'+id).textContent||'не проверено')+')');Q[id].forEach((q,i)=>L.push(`  ${i+1}) ${q.p.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim()} | answer: ${q.val||'—'} | correct: ${q.ans[0]} | ${q.shown?'shown':q.st=='ok'?'OK':q.st=='bad'?'WRONG':'-'}`));L.push('')});L.push('3. Say it & write it ('+($('#sc-t3').textContent||'не проверено')+')');T3.forEach((r,i)=>L.push(`  ${i+1}) ${r[1]} | text: ${document.querySelector(`[data-t3="${i}"]`).value.replace(/\s+/g,' ')||'—'} | required: ${r[2].join(', ')}`));L.push('','Problem words: '+(Object.keys(P).map(k=>k+' ×'+P[k]).join(', ')||'none'));return L.join('\n')}
let h='';X.forEach((e,i)=>{h+=`<section class="card" style="--a:${e[4]}"><h2><span class="num">${i+1}</span>${e[1]} ${e[2]}<span class="sc" id="sc-${e[0]}"></span></h2><p class="ins">${e[3]}</p><div id="b-${e[0]}"></div>`+(e[0]!='t3'?`<div class="acts"><button class="btn" data-a="check" data-e="${e[0]}">Проверить</button><button class="btn g" data-a="show" data-e="${e[0]}">Показать ответы</button><button class="btn g" data-a="reset" data-e="${e[0]}">Заново</button></div>`:'')+'</section>'});
h+=`<section class="card" style="--a:#b8a4ff"><h2><span class="num">📋</span>Мои ответы</h2><p class="ins">Собери все ответы и скопируй, чтобы отправить преподавателю.</p><div class="acts"><button class="btn" id="rep">Собрать и скопировать</button></div><textarea id="rout" style="margin-top:12px;min-height:150px" readonly></textarea><div class="fb" id="rst"></div></section>`;
$('#main').innerHTML=h;reset('t1');reset('t2');t3Draw();
if(TTS){loadV();speechSynthesis.onvoiceschanged=loadV;$('#vsel').onchange=e=>{V=voices[e.target.value];$('#vst').textContent='Голос: '+V.name}}else $('#vst').textContent='Озвучка недоступна';
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset;if(d.say)return say(d.say);if(d.a)return{check,show,reset}[d.a](d.e);if(d.chk!=null)return t3Check(d.chk);if(d.mod!=null){$('#f-'+d.mod).textContent='💡 '+T3[d.mod][3];return}
if(t.id=='rep'){const o=$('#rout');o.value=report();o.select();const ok=()=>$('#rst').textContent='✅ Скопировано! Вставь в чат с преподавателем.',no=()=>{let r=false;try{r=document.execCommand('copy')}catch(x){}r?ok():$('#rst').textContent='Текст выделен: нажми Ctrl/⌘+C'};navigator.clipboard?navigator.clipboard.writeText(o.value).then(ok,no):no()}});
document.addEventListener('input',e=>{const t=e.target;if(t.classList.contains('inp')){const q=Q[t.dataset.e][t.dataset.q];if(q.shown)return;q.val=t.value;q.st=null;const r=t.closest('.q');r.className='q';r.querySelector('.fb').textContent=''}});
</script></body></html>
