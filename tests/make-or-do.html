<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>MAKE or DO</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff4e3;--card:#fff;--tx:#2b2540;--mut:#7a7390;--mk:#ff5d8f;--do:#12b3c2;--ok:#22b573;--no:#ee4b4b;--yl:#ffc83d;--ln:#eadfce;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1b1730;--card:#2a2445;--tx:#f3efff;--mut:#a9a2c4;--ln:#3d3660;color-scheme:dark}}
:root[data-theme=dark]{--bg:#1b1730;--card:#2a2445;--tx:#f3efff;--mut:#a9a2c4;--ln:#3d3660;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:500 16px/1.5 Nunito,system-ui,sans-serif;background-image:radial-gradient(circle at 8% 4%,rgba(255,93,143,.25),transparent 32%),radial-gradient(circle at 95% 10%,rgba(18,179,194,.25),transparent 30%)}
header{padding:18px 16px 6px;text-align:center}h1{font:800 clamp(34px,8vw,58px)/1 'Baloo 2',system-ui,sans-serif;margin:0}
h1 .m{color:var(--mk)}h1 .d{color:var(--do)}h1 .o{font-size:.4em;color:var(--mut);margin:0 .3em}
.tools{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:8px}.tools input{padding:7px 12px;border-radius:99px;border:2px solid var(--ln);background:var(--card);color:var(--tx);font:inherit;width:150px}
small{color:var(--mut)}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 14px}nav button{flex:none;border:2px solid var(--ln);background:var(--card);color:var(--tx);border-radius:99px;padding:6px 12px;font:700 14px Nunito,sans-serif;cursor:pointer}nav button.on{background:var(--mk);border-color:var(--mk);color:#fff}
.wrap{display:grid;grid-template-columns:1fr 210px;gap:14px;max-width:1000px;margin:0 auto;padding:0 14px 90px}
@media(max-width:760px){.wrap{grid-template-columns:1fr}aside{order:2}}
main,aside{background:var(--card);border-radius:22px;padding:18px;box-shadow:0 6px 0 var(--ln)}aside{align-self:start;position:sticky;top:10px}aside h3{margin:0 0 8px;font:800 18px 'Baloo 2',sans-serif}
.sec{display:none}.sec.on{display:block}.sec h2{font:800 26px 'Baloo 2',sans-serif;margin:0}.intro{color:var(--mut);margin:2px 0 14px}
.btn,.big,.sp,.pl,.opt,.chip,.rate button,.pwd{font:700 15px Nunito,sans-serif;border:2px solid var(--ln);background:var(--card);color:var(--tx);border-radius:14px;padding:8px 14px;cursor:pointer}
.btn{background:var(--do);border-color:var(--do);color:#fff;margin:4px 6px 0 0}.btn:nth-child(2){background:var(--yl);border-color:var(--yl);color:#2b2540}.btn:nth-child(3){background:var(--card);border-color:var(--ln);color:var(--tx)}
.big{background:var(--mk);border-color:var(--mk);color:#fff;margin:10px 0}.pwd{display:block;width:100%;text-align:left;margin:0 0 6px;padding:5px 10px;background:rgba(255,200,61,.2)}
.sc{font:800 20px 'Baloo 2',sans-serif;margin-left:8px}.ctl{margin-top:14px}
.rv{border-radius:16px;padding:10px;margin-bottom:12px;border:2px solid}.rv.make{border-color:var(--mk)}.rv.do{border-color:var(--do)}.rv h3{margin:0 0 6px;font:800 20px 'Baloo 2',sans-serif}.rv.make h3{color:var(--mk)}.rv.do h3{color:var(--do)}
.rw{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-top:1px dashed var(--ln)}.rw.heard::after{content:'✓';color:var(--ok);font-weight:800}.rw{flex-wrap:nowrap}
.sp{padding:4px 10px}.row{margin:0 0 14px;line-height:2.2}
.ans{font:700 16px Nunito,sans-serif;border:2px solid var(--ln);border-bottom-width:3px;border-radius:10px;padding:3px 8px;background:var(--card);color:var(--tx);min-width:70px;max-width:100%;margin:0 3px}.ans.free{width:min(100%,24em)}
.ans.ok,.opt.ok,.chip.ok{background:rgba(34,181,115,.22);border-color:var(--ok)}.ans.no,.opt.no,.chip.no{background:rgba(238,75,75,.2);border-color:var(--no)}.ans.shown,.opt.shown,.chip.shown{background:rgba(255,200,61,.3);border-color:var(--yl)}
.ph{cursor:pointer;border-radius:6px;padding:1px 2px}.ph.sel{background:rgba(18,179,194,.3)}.ph.ok{background:rgba(34,181,115,.3)}.ph.no{background:rgba(238,75,75,.3)}.ph.miss,.ph.shown{background:rgba(255,200,61,.45)}.txt{font-size:18px;line-height:2}
.q{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px;padding-bottom:10px;border-bottom:1px dashed var(--ln)}.opts{display:flex;gap:6px;flex-wrap:wrap}.opt.sel{border-color:var(--do);background:rgba(18,179,194,.2)}
.pool{display:flex;gap:8px;flex-wrap:wrap;min-height:48px;margin-bottom:12px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}.col{min-height:140px;border-radius:16px;padding:10px;border:3px dashed;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}.col h4{width:100%;margin:0;font:800 20px 'Baloo 2',sans-serif}.col.make{border-color:var(--mk)}.col.make h4{color:var(--mk)}.col.do{border-color:var(--do)}.col.do h4{color:var(--do)}.chip.sel{border-color:var(--mk);transform:scale(1.07)}
.card{min-height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font:800 28px 'Baloo 2',sans-serif;border-radius:22px;background:linear-gradient(135deg,rgba(255,93,143,.25),rgba(18,179,194,.25));cursor:pointer;padding:16px;margin-bottom:8px}.card.back{background:linear-gradient(135deg,rgba(18,179,194,.3),rgba(255,200,61,.3))}.card small{font:500 14px Nunito}.rate{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.bank{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.bank span{background:rgba(255,200,61,.35);padding:3px 12px;border-radius:99px;font-weight:700}
footer{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));text-align:center;background:var(--card);box-shadow:0 -4px 14px rgba(0,0,0,.12)}
#toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:99px;display:none}
</style></head><body>
<header><h1><span class="m">MAKE</span><span class="o">or</span><span class="d">DO</span></h1>
<div class="tools"><input id="nm" placeholder="Твоё имя"><button class="btn" id="tv">🔊 Проверить звук</button><select id="vsel" style="max-width:260px;padding:7px;border-radius:12px;border:2px solid var(--ln);background:var(--card);color:var(--tx);font:inherit"></select><small id="vs"></small></div></header>
<nav id="nav"></nav>
<div class="wrap"><main id="main"></main><aside><h3>⚠️ Проблемные слова</h3><div id="pw"><small>Пока пусто 🎉<br>Ошибки появятся здесь — нажми, чтобы послушать.</small></div></aside></div>
<footer><button class="btn" id="cp">📋 Скопировать мои ответы</button></footer><div id="toast"></div>
<script>
const $=(s,e=document)=>e.querySelector(s),el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const norm=s=>s.toLowerCase().replace(/[’‘]/g,"'").replace(/[.!?,]/g,'').replace(/\s+/g,' ').trim();
const W=[['make','a phone call','позвонить','ə ˈfoʊn kɔːl'],['make','friends','подружиться','frɛndz'],['make','plans','строить планы','plænz'],['make','an excuse','придумать отговорку','ən ɪkˈskjuːs'],['make','an effort','приложить усилия','ən ˈɛfərt'],['make','a decision','принять решение','ə dɪˈsɪʒən'],['make','sure','убедиться','ʃʊr'],['make','a mistake','сделать ошибку','ə mɪˈsteɪk'],['make','a noise','шуметь','ə nɔɪz'],
['do','sport','заниматься спортом','spɔːrt'],['do','exercise','делать упражнения','ˈɛksərsaɪz'],['do','housework','делать работу по дому','ˈhaʊswɜːrk'],['do','your hair','сделать причёску','jʊr hɛr'],['do','your nails','сделать маникюр','jʊr neɪlz'],['do','a course','пройти курс','ə kɔːrs'],['do','your best','сделать всё возможное','jʊr bɛst'],['do','homework','делать домашнее задание','ˈhoʊmwɜːrk']];
const full=w=>w[0]+' '+w[1],ipa=w=>(w[0]=='make'?'meɪk ':'duː ')+w[3];
// audio
let V=null,UV=null;const pick=()=>{try{const all=speechSynthesis.getVoices(),v=all.filter(x=>/^en[-_]/i.test(x.lang)),us=v.filter(x=>/^en[-_]US/i.test(x.lang));V=UV||us.find(x=>/google/i.test(x.name)&&/natural/i.test(x.name))||us.find(x=>/natural/i.test(x.name))||us.find(x=>/Samantha/i.test(x.name))||us.find(x=>/Google US English/i.test(x.name))||us[0]||null;const sl=$('#vsel');if(sl.options.length!=v.length+1){sl.innerHTML='<option value="">Авто (Google US English natural / Samantha)</option>'+v.map((x,i)=>`<option value="${i}">${x.name} (${x.lang})</option>`).join('');sl.onchange=()=>{UV=sl.value===''?null:v[+sl.value];pick();say('Make a decision. Do your best!')}}$('#vs').textContent=V?'Голос: '+V.name:'Голос: по умолчанию (Google/Samantha не найдены)'}catch(e){$('#vs').textContent='Нет звука в этом браузере'}};
const say=(t,q)=>{try{if(!q)speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.9;if(V||pick())u.voice=V;speechSynthesis.speak(u)}catch(e){}};
try{speechSynthesis.onvoiceschanged=pick}catch(e){}pick();
$('#tv').onclick=()=>say('Make a decision. Do your best!');
// problem words
const P={};function bad(k){P[k]=(P[k]||0)+1;const d=$('#pw');d.innerHTML='';Object.entries(P).sort((a,b)=>b[1]-a[1]).forEach(([k,n])=>{const x=el('button','pwd',`${k} <b>×${n}</b>`);x.onclick=()=>say(k.replace(/\(.*\)/,''));d.append(x)})}
// row with {answer|alt~key} inputs, {*example} = free input
function R(s){const p=el('p','row');s.split(/(\{.*?\})/).forEach(x=>{if(x[0]=='{'){let a=x.slice(1,-1),i=el('input','ans');i.autocomplete='off';i.spellcheck=false;i.autocapitalize='off';if(a[0]=='*'){i.className='ans free';i.dataset.a=a.slice(1)}else{const[v,k]=a.split('~');i.dataset.a=v;i.dataset.k=k||v.split('|')[0];i.size=Math.max(7,v.split('|')[0].length+2)}p.append(i)}else p.insertAdjacentHTML('beforeend',x)});return p}
function gen(b){return{check(){let ok=0,n=0;b.querySelectorAll('.ans').forEach(i=>{n++;const f=i.classList.contains('free'),g=f?norm(i.value).split(' ').filter(Boolean).length>=2:i.dataset.a.split('|').includes(norm(i.value));i.classList.remove('ok','no','shown');i.classList.add(g?'ok':'no');if(g)ok++;else if(!f&&i.value)bad(i.dataset.k)});return[ok,n]},show(){b.querySelectorAll('.ans').forEach(i=>{i.value=i.dataset.a.split('|')[0];i.classList.remove('ok','no');i.classList.add('shown')})}}}
const S=[
{e:'📚',n:'Слова',t:'Повторяем слова',i:'Нажми 🔊 и повтори каждую фразу вслух (US English). Прослушанные отмечаются галочкой.',build(b){const tv=el('div','');['make','do'].forEach(v=>{const c=el('div','rv '+v,`<h3>${v.toUpperCase()}</h3>`);W.filter(w=>w[0]==v).forEach(w=>{const r=el('div','rw',`<span><b>${full(w)}</b> <small>/${ipa(w)}/</small><br>${w[2]}</span>`),x=el('button','sp','🔊');x.onclick=()=>{say(full(w));r.classList.add('heard')};r.append(x);c.append(r)});b.append(c)});const a=el('button','big','▶ Послушать все подряд');a.onclick=()=>{speechSynthesis.cancel();W.forEach(w=>say(full(w),1));b.querySelectorAll('.rw').forEach(r=>r.classList.add('heard'))};b.prepend(a);return{check:()=>[b.querySelectorAll('.heard').length,W.length],show(){b.querySelectorAll('.rw').forEach(r=>r.classList.add('heard'))}}}},
{e:'🕵️',n:'В тексте',t:'Find them in the wild',i:'Кликай по целым фразам с make или do. Будь внимателен: есть лишние фразы!',build(b){const T="Yesterday was a really busy day. First, I [made a phone call] to my grandma. Then I [!went to the shop] and [did the housework]. In the afternoon I [!had lunch] with Tom and we [made plans] for the weekend. I [made a mistake] when I [did my homework], but I [did my best] to fix it. Before bed I [!took a shower] and [made an effort] to sleep early.";const p=el('p','txt');T.split(/(\[.*?\])/).forEach(x=>{if(x[0]=='['){const c=x[1]!='!',s=el('span','ph',c?x.slice(1,-1):x.slice(2,-1));s.dataset.c=c?1:'';s.onclick=()=>s.classList.toggle('sel');p.append(s)}else p.append(x)});b.append(p);return{check(){let ok=0,n=0;p.querySelectorAll('.ph').forEach(s=>{const sel=s.classList.contains('sel');s.classList.remove('ok','no','miss');if(s.dataset.c){n++;if(sel){ok++;s.classList.add('ok')}else{s.classList.add('miss');bad(s.textContent)}}else if(sel)s.classList.add('no')});b.dataset.log='Найдено: '+ok+'/'+n;return[ok,n]},show(){p.querySelectorAll('.ph').forEach(s=>{s.classList.remove('sel','no','miss');s.classList.toggle('shown',!!s.dataset.c)})}}}},
{e:'💡',n:'Угадай',t:'Guess the word',i:'Прочитай перевод и впиши фразу (подсказка — первые буквы).',build(b){sh(W).slice(0,8).forEach(w=>{const a=w[1]+(w[1].startsWith('your ')?'|my '+w[1].slice(5):''),r=R(`${w[2]} → <b>${w[0]}</b> {${a}~${full(w)}}`);r.querySelector('input').placeholder=w[1].replace(/(\S)\S*/g,(m,c)=>c+'…');b.append(r)})}},
{e:'👂',n:'Слушай',t:'Listen & pick',i:'Нажми 🔊, послушай фразу и выбери правильное значение.',build(b){const qs=sh(W).slice(0,6),st=qs.map(()=>null);qs.forEach((w,i)=>{const d=el('div','q'),pl=el('button','pl','🔊 Слушать');pl.onclick=()=>say(full(w));const o=el('div','opts');sh([w,...sh(W.filter(x=>x!=w)).slice(0,2)]).forEach(x=>{const c=el('button','opt',x[2]);c.dataset.ok=x==w?1:'';c.onclick=()=>{o.querySelectorAll('.opt').forEach(y=>y.classList.remove('sel'));c.classList.add('sel');st[i]=x};o.append(c)});d.append(pl,o);b.append(d)});return{check(){let ok=0;b.querySelectorAll('.opts').forEach((o,i)=>{o.querySelectorAll('.opt').forEach(c=>{c.classList.remove('ok','no');if(c.classList.contains('sel'))c.classList.add(c.dataset.ok?'ok':'no')});if(st[i]==qs[i])ok++;else if(st[i])bad(full(qs[i]))});b.dataset.log=qs.map((w,i)=>full(w)+' → '+(st[i]?st[i][2]:'—')).join('\n');return[ok,qs.length]},show(){b.querySelectorAll('.opt').forEach(c=>c.classList.toggle('shown',!!c.dataset.ok))}}}},
{e:'⚡',n:'Speed',t:'Speed match',i:'Нажми на слово, затем на колонку MAKE или DO. Чтобы вернуть слово, нажми на него ещё раз. Таймер идёт!',build(b){const ws=sh(W).slice(0,10),t0=Date.now(),pool=el('div','pool'),cols=el('div','cols');let sel=null;const cl={};['make','do'].forEach(v=>{const c=el('div','col '+v,`<h4>${v.toUpperCase()}</h4>`);c.onclick=()=>{if(sel){c.append(sel);sel.classList.remove('sel');sel=null}};cl[v]=c;cols.append(c)});ws.forEach(w=>{const c=el('button','chip',w[1]);c.w=w;c.onclick=e=>{e.stopPropagation();if(c.parentNode!=pool&&!sel){pool.append(c);return}if(sel)sel.classList.remove('sel');sel=sel==c?null:c;c.classList.toggle('sel',!!sel)};pool.append(c)});b.append(pool,cols);return{check(){let ok=0;b.querySelectorAll('.chip').forEach(c=>{c.classList.remove('ok','no');if(c.parentNode==pool)return;const g=c.parentNode==cl[c.w[0]];c.classList.add(g?'ok':'no');if(g)ok++;else bad(full(c.w))});b.dataset.log='Время: '+Math.round((Date.now()-t0)/1000)+' с';return[ok,ws.length]},show(){b.querySelectorAll('.chip').forEach(c=>{cl[c.w[0]].append(c);c.classList.remove('sel','no');c.classList.add('shown')})}}}},
{e:'⏳',n:'Времена',t:'Verb tenses (A2)',i:'Поставь глагол в скобках в нужную форму.',build(b){sh([`Yesterday I {made~make (past)} a big mistake. <small>(make)</small>`,`She {does~do (present)} her homework every evening. <small>(do)</small>`,`We are {making~make (continuous)} plans for the weekend. <small>(make)</small>`,`He has already {done~do (perfect)} the housework. <small>(do)</small>`,`Last year they {did~do (past)} a course in Berlin. <small>(do)</small>`,`Tomorrow I {will make|am going to make~make (future)} a phone call to my gran. <small>(make)</small>`,`Tom {didn't do|did not do~do (negative)} his best in the test. <small>(not do)</small>`,`I {have made|ve made~make (perfect)} two new friends this week. <small>(make)</small>`]).slice(0,6).forEach(s=>b.append(R(s)))}},
{e:'🧩',n:'Текст',t:'Fill in the text',i:'Вставь слова из рамки по смыслу. Слова в рамке перемешаны.',build(b){const bk=el('div','bank');sh(['nails','hair','friends','plans','mistake','excuse','sure','homework','best']).forEach(x=>bk.append(el('span','',x)));b.append(bk,R(`I was nervous about the party, so I did my {nails~do your nails} and my {hair~do your hair} first. At the party I made {friends~make friends} with a girl called Kate, and we made {plans~make plans} to meet again. Then I made a {mistake~make a mistake} — I called her Katie! I made an {excuse~make an excuse} and left. At home I made {sure~make sure} my phone was charged. Finally I did my {homework~do homework} and I did my {best~do your best} to finish it.`))}},
{e:'🔁',n:'Rephrase',t:'Rephrase',i:'Перепиши предложение с make или do, сохранив смысл.',build(b){sh([`<i>I tried very hard in the test.</i><br>→ I {did my best|made an effort~do your best} in the test.`,`<i>She phoned her mum.</i><br>→ She {made a phone call|made a call~make a phone call} to her mum.`,`<i>He decided to leave.</i><br>→ He {made a decision~make a decision} to leave.`,`<i>They became friends at school.</i><br>→ They {made friends~make friends} at school.`,`<i>I cleaned the house.</i><br>→ I {did the housework|did housework~do housework}.`,`<i>He played football yesterday.</i><br>→ He {did sport|did some sport~do sport} yesterday.`,`<i>Don’t be noisy!</i><br>→ Don’t {make a noise|make noise~make a noise}!`,`<i>Check that the door is locked.</i><br>→ Please {make sure~make sure} the door is locked.`]).slice(0,6).forEach(s=>b.append(R(s)))}},
{e:'✍️',n:'Мои идеи',t:'Finish the sentences',i:'Закончи предложения своими идеями (минимум 2 слова). Ответы можно скопировать внизу.',build(b){['When I make a mistake, I {*try again}.','I do my best when {*I study with friends}.','At the weekend I usually do {*sport and housework}.','I often make plans to {*visit my family}.','I like making friends because {*it is fun}.','I make a lot of noise when {*I am happy}.','One day I want to do a course in {*photography}.'].forEach(s=>b.append(R(s)))}},
{e:'🤥',n:'2 truths',t:'Two truths and a lie',i:'Напиши 3 предложения о себе с make/do: две правды и одну ложь. Отметь ложь кружком.',build(b){const nm='lie'+Date.now(),rows=[];for(let i=0;i<3;i++){const r=el('p','row'),t=el('input','ans free');t.placeholder='Sentence '+(i+1)+'…';const rd=el('input');rd.type='radio';rd.name=nm;r.append(t,el('span','','  '),rd,el('small','',' ← ложь'));rows.push([t,rd]);b.append(r)}const rx=/\b(make|makes|made|making|do|does|did|doing|done)\b/i,ex=['I made a mistake in the test yesterday.','I do my nails every Sunday.','I did a course in Chinese last year.'];return{check(){let ok=0;rows.forEach(([t])=>{const g=rx.test(t.value)&&t.value.split(' ').length>3;t.classList.remove('ok','no');t.classList.add(g?'ok':'no');if(g)ok++});const l=rows.some(([,r])=>r.checked);return[ok+(l?1:0),4]},show(){rows.forEach(([t,r],i)=>{t.value=ex[i];r.checked=i==2;t.className='ans free shown'})}}}},
{e:'🃏',n:'Карточки',t:'Flashcards',i:'Переверни карточку и оцени себя. «Не уверен» и «Не знаю» вернутся в конец колоды.',build(b){let q=sh(W),fl=false;const box=el('div','');b.append(box);const draw=()=>{box.innerHTML='';b.dataset.log='Осталось карточек: '+q.length;if(!q.length){box.innerHTML='<h2>🎉 Все карточки выучены!</h2>';return}const w=q[0],c=el('div','card'+(fl?' back':''),fl?`${full(w)}<small>/${ipa(w)}/</small>`:`${w[2]}<small>нажми, чтобы перевернуть</small>`);c.onclick=()=>{fl=!fl;if(fl)say(full(w));draw()};box.append(c,el('small','','Осталось: '+q.length));if(fl){const r=el('div','rate');[['✅ Знаю',0],['🤔 Не уверен',1],['❌ Не знаю',2]].forEach(([l,k])=>{const x=el('button','',l);x.onclick=()=>{q.shift();if(k)q.push(w);if(k==2)bad(full(w));fl=false;draw()};r.append(x)});box.append(r)}};draw();return{check:()=>[W.length-q.length,W.length],show(){fl=!fl;draw()}}}}
];
// UI
const main=$('#main'),nav=$('#nav');
S.forEach((s,i)=>{const sec=el('section','sec'),b=el('div','body'),ct=el('div','ctl'),sc=el('span','sc');sec.append(el('h2','',`${s.e} ${s.t}`),el('p','intro',s.i),b,ct);s.box=b;let H;const go=()=>{b.innerHTML='';sc.textContent='';b.dataset.log='';H=s.build(b)||gen(b)};const mk=(l,f)=>{const x=el('button','btn',l);x.onclick=f;ct.append(x)};go();
mk('✔ Проверить',()=>{const[o,n]=H.check();sc.textContent=`${o} / ${n}`+(o==n?' 🎉':'')});mk('👀 Ответы',()=>H.show());mk('🔄 Заново',go);ct.append(sc);main.append(sec);
const n=el('button','',`${s.e} ${s.n}`);n.onclick=()=>{document.querySelectorAll('.sec').forEach((x,j)=>x.classList.toggle('on',j==i));nav.querySelectorAll('button').forEach((x,j)=>x.classList.toggle('on',j==i));n.scrollIntoView({block:'nearest',inline:'center'})};nav.append(n)});
nav.firstChild.click();
// copy
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2200)};
const txt=n=>n.tagName=='INPUT'?(n.type=='radio'?(n.checked?' ←ЛОЖЬ':''):'['+n.value+']'):n.textContent;
$('#cp').onclick=()=>{const t=`Имя: ${$('#nm').value||'—'}\n\n`+S.map((s,i)=>`${i+1}. ${s.t}\n`+(s.box.dataset.log||[...s.box.querySelectorAll('.row')].map(r=>[...r.childNodes].map(txt).join('')).join('\n'))).join('\n\n')+'\n\nПроблемные слова: '+(Object.entries(P).map(([k,n])=>k+' ×'+n).join(', ')||'нет');
const fb=()=>{const a=el('textarea');a.value=t;document.body.append(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove()};
(navigator.clipboard?navigator.clipboard.writeText(t).catch(fb):Promise.resolve(fb())).then(()=>toast('Скопировано ✅'))};
</script></body></html>
