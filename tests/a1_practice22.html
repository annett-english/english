<style>

<div class="wrap"><main id="m">
<section><h1>🇬🇧 English A1: She is a teacher</h1>
<p class="in">Голос: <b id="vn">…</b>. Нажимай 🔊, чтобы услышать слово.</p>

</main>
<aside><h2>⚠ Проблемные слова</h2><p class="in">Где были ошибки (нажми — услышишь)</p><table id="pw"></table><div class="bt"><button onclick="P={};rp()">Очистить</button></div></aside></div>
<script>
const $=s=>document.querySelector(s);
const norm=s=>s.toLowerCase().replace(/[’]/g,"'").replace(/she's/g,"she is").replace(/they're/g,"they are").replace(/i'm/g,"i am").replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
/* AUDIO */
let V=null;
function pick(){if(!window.speechSynthesis)return;const v=speechSynthesis.getVoices();V=v.find(x=>/Google US English/i.test(x.name))||v.find(x=>/Samantha/i.test(x.name))||v.find(x=>x.lang==='en-US')||v.find(x=>/^en/.test(x.lang))||null;$('#vn').textContent=V?V.name:'по умолчанию'}
if(window.speechSynthesis){pick();speechSynthesis.onvoiceschanged=pick}else $('#vn').textContent='аудио не поддерживается браузером';
function utt(t,r){const u=new SpeechSynthesisUtterance(t);u.lang='en-US';if(V)u.voice=V;u.rate=r||.9;return u}
function say(t,r){if(!window.speechSynthesis)return;speechSynthesis.cancel();speechSynthesis.speak(utt(t,r))}
document.addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(b)say(b.dataset.s,+b.dataset.r||.9)});
/* VOCAB */
const VOC=[["a teacher","ə ˈtiːtʃər","учитель"],["work as","wɜːrk æz","работать (кем-то)"],["as","æz","как"],["she is 25 (years old)","ʃi ɪz ˌtwɛnti ˈfaɪv (jɪrz oʊld)","ей 25 (лет)"],["Spanish","ˈspænɪʃ","испанский / испанка"],["Italian","ɪˈtæljən","итальянский / итальянец"],["live","lɪv","жить"],["Italy","ˈɪtəli","Италия"],["from","frʌm","из, от"],["a runny nose","ə ˈrʌni noʊz","насморк"]];
$('#vg').innerHTML=VOC.map(v=>`<div class="vc"><div><b>${v[0]}</b><br><small>/${v[1]}/</small><br>${v[2]}</div><button data-s="${v[0].replace(/ \(.*/,'')}">🔊</button></div>`).join('');
$('#all').onclick=()=>{if(!window.speechSynthesis)return;speechSynthesis.cancel();VOC.forEach(v=>speechSynthesis.speak(utt(v[0].replace(/ \(.*/,''),.8)))};
const PH=[["She is a teacher.","ʃi ɪz ə ˈtiːtʃər","Она учитель."],["She works as a teacher.","ʃi wɜːrks æz ə ˈtiːtʃər","Она работает учителем."],["She is 25 (years old).","ʃi ɪz ˌtwɛnti ˈfaɪv (jɪrz oʊld)","Ей 25 лет."],["She is Spanish.","ʃi ɪz ˈspænɪʃ","Она испанка."],["They are Italian.","ðeɪ ɑːr ɪˈtæljən","Они итальянцы."],["They live in Italy.","ðeɪ lɪv ɪn ˈɪtəli","Они живут в Италии."],["They are from Italy.","ðeɪ ɑːr frʌm ˈɪtəli","Они из Италии."],["I have a runny nose.","aɪ hæv ə ˈrʌni noʊz","У меня насморк."]];
const sp=t=>t.replace(/ \(.*?\)/g,'');
$('#pg').innerHTML=PH.map(v=>`<div class="vc" style="grid-column:1/-1"><div><b>${v[0]}</b><br><small>/${v[1]}/</small><br>${v[2]}</div><div style="white-space:nowrap"><button data-s="${sp(v[0])}">🔊</button> <button data-s="${sp(v[0])}" data-r=".55">🐢</button></div></div>`).join('');
$('#allp').onclick=()=>{if(!window.speechSynthesis)return;speechSynthesis.cancel();PH.forEach(v=>speechSynthesis.speak(utt(sp(v[0]),.8)))};
/* PROBLEM WORDS */
let P={};
function bump(w){if(w){P[w]=(P[w]||0)+1;rp()}}
function rp(){const k=Object.keys(P).sort((a,b)=>P[b]-P[a]);$('#pw').innerHTML=k.length?k.map(w=>`<tr><td><a href="#" onclick="say('${w}');return false" style="color:inherit">🔊 ${w}</a></td><td>${P[w]}</td></tr>`).join(''):'<tr><td style="color:var(--m);font-weight:400;text-align:left">Пока ошибок нет 👍</td></tr>'}rp();
/* ENGINE */
const E={},B={},T={e1:'1. Вставь пропущенные слова',e2:'2. Переведи на английский',e3:'3. Послушай и напиши',e4:'4. Соедини половинки',e5:'5. Вставь слова в текст',e6:'6. Build the chunk',e7:'7. Repeat & Change'};
function mk(ex,html,o){const d=document.createElement('div');d.className='row';d.innerHTML='<b>'+((E[ex]=E[ex]||[]).length+1)+'</b><div class="c">'+html+'</div><span class="st"></span>';$('#'+ex).appendChild(d);o.el=d;o.st=d.querySelector('.st');o.in=d.querySelector('input,select');
o.val=o.val||(()=>o.in.value);o.ok=o.ok||(()=>o.ans.some(a=>norm(a)===norm(o.val())));o.show=o.show||(()=>{o.in.value=o.ans[0]});E[ex].push(o);return o}
function sec(ex,instr,extra){const s=document.createElement('section');s.innerHTML=`<h2>${T[ex]}</h2><p class="in">${instr}</p><div id="${ex}"></div><div class="bt"><button class="p" onclick="chk('${ex}')">Проверить</button><button onclick="shw('${ex}')">Показать ответы</button><button onclick="rst('${ex}')">Заново (перемешать)</button>${extra||''}</div><div class="sc" id="${ex}s"></div>`;$('#m').appendChild(s);B[ex]()}
function chk(ex){let n=0;E[ex].forEach(o=>{const g=o.ok();if(g)n++;else if(o.val().trim())bump(o.w);o.el.classList.remove('shown');o.el.classList.toggle('good',g);o.el.classList.toggle('bad',!g);if(o.st)o.st.textContent=g?'✓':'✗'});$('#'+ex+'s').textContent=`Верно: ${n} из ${E[ex].length}`}
function shw(ex){E[ex].forEach(o=>{o.show();o.el.classList.remove('good','bad');o.el.classList.add('shown');if(o.st)o.st.textContent='💡'});$('#'+ex+'s').textContent='Показаны правильные ответы'}
function rst(ex){$('#'+ex).innerHTML='';E[ex]=[];$('#'+ex+'s').textContent='';B[ex]()}
const S8=[["She is a teacher","a teacher"],["She works as a teacher","work as"],["She is 25 years old","years old"],["She is Spanish","Spanish"],["They are Italian","Italian"],["They live in Italy","live"],["They are from Italy","from"],["I have a runny nose","a runny nose"]];
const alt=s=>[s,s.replace(' years old','')];
/* 1 */
B.e1=()=>shuffle([["She ","is"," a teacher.","a teacher"],["She ","works"," as a teacher.","work as"],["She is 25 ","years"," old.","years old"],["She is ","Spanish",".","Spanish"],["They are ","Italian",".","Italian"],["They ","live"," in Italy.","live"],["They are ","from"," Italy.","from"],["I have a ","runny"," nose.","a runny nose"]]).forEach(([a,b,c,w])=>mk('e1',`${a}<input> ${c}`,{ans:[b],w,label:a+'___'+c}));
/* 2 */
B.e2=()=>shuffle([["Она учитель.","She is a teacher","a teacher"],["Она работает учителем.","She works as a teacher","work as"],["Ей 25 лет.","She is 25 years old","years old"],["Она испанка.","She is Spanish","Spanish"],["Они итальянцы.","They are Italian","Italian"],["Они живут в Италии.","They live in Italy","live"],["Они из Италии.","They are from Italy","from"],["У меня насморк.","I have a runny nose","a runny nose"]]).forEach(([ru,en,w])=>mk('e2',`${ru}<input class="w">`,{ans:alt(en),w,label:ru}));
/* 3 */
B.e3=()=>shuffle(S8).forEach(([s,w])=>mk('e3',`<button data-s="${s}">🔊</button> <button data-s="${s}" data-r=".55">🐢</button> <input class="w" placeholder="Напиши, что услышал(а)">`,{ans:alt(s),w,label:'(audio)'}));
/* 4 */
B.e4=()=>{const P4=[["She is a","teacher","a teacher"],["She works","as a teacher","work as"],["She is 25","years old","years old"],["She is","Spanish","Spanish"],["They are","Italian","Italian"],["They are from","Italy","from"],["They live","in Italy","live"],["I have","a runny nose","a runny nose"]];const R=shuffle(P4.map(p=>p[1]));
shuffle(P4).forEach(([l,r,w])=>mk('e4',`${l} <select><option value="">— выбери —</option>${R.map(x=>`<option>${x}</option>`).join('')}</select>`,{ans:[r],w,label:l+' …',ok(){return this.in.value===r}}))};
/* 5 */
B.e5=()=>{const A=[["teacher","a teacher"],["as","work as"],["years","years old"],["Spanish","Spanish"],["Italian","Italian"],["live","live"],["from","from"],["runny","a runny nose"]];
const t="Maria is a {1}. She works {2} a teacher in a school. She is 25 {3} old. She is {4}. Her friends are {5}. They {6} in Italy. They are {7} Italy. Today Maria has a {8} nose.";
const d=document.createElement('div');d.innerHTML=`<div class="bank">${shuffle(A.map(a=>a[0])).map(w=>`<span class="ch">${w}</span>`).join('')}</div><p class="txt">${t.replace(/\{(\d)\}/g,'<input data-n="$1"> ($1)')}</p>`;$('#e5').appendChild(d);E.e5=[];
d.querySelectorAll('input').forEach((i,k)=>E.e5.push({el:i,in:i,ans:[A[k][0]],w:A[k][1],label:'gap '+(k+1),val:()=>i.value,ok:()=>norm(i.value)===norm(A[k][0]),show:()=>{i.value=A[k][0]}}))};
/* 6 */
B.e6=()=>shuffle(["She works as a teacher","They are from Italy","She is 25 years old","We live in Italy","He is Spanish","They are Italian","I have a runny nose","She is a teacher"]).forEach(s=>{
const ws=shuffle(s.split(' '));let cur=[];const o=mk('e6','<div class="bank"></div><div class="built"></div>',{ans:[s],w:s.includes('as a')?'work as':s.includes('from')?'from':s.includes('years')?'years old':s.includes('live')?'live':s.includes('runny')?'a runny nose':s.includes('Italian')?'Italian':s.includes('Spanish')?'Spanish':'a teacher',label:'chunk',val:()=>cur.map(i=>ws[i]).join(' '),show:()=>{cur=ws.map((_,i)=>i).sort((a,b)=>s.split(' ').indexOf(ws[a])-s.split(' ').indexOf(ws[b]));dr()}});
const bk=o.el.querySelector('.bank'),bl=o.el.querySelector('.built');
function dr(){bk.innerHTML='';bl.innerHTML='';ws.forEach((x,i)=>{if(!cur.includes(i)){const b=document.createElement('button');b.className='ch';b.textContent=x;b.onclick=()=>{cur.push(i);dr()};bk.appendChild(b)}});cur.forEach(i=>{const b=document.createElement('button');b.className='ch';b.textContent=ws[i];b.onclick=()=>{cur=cur.filter(k=>k!==i);dr()};bl.appendChild(b)})}dr()});
/* 7 */
B.e7=()=>[["She is a teacher.","He is a doctor."],["She works as a teacher.","My dad works as a driver."],["She is 25 years old.","I am 30 years old."],["She is Spanish.","He is French."],["They are Italian.","We are Polish."],["They live in Italy.","I live in Poland."],["They are from Italy.","We are from Poland."],["I have a runny nose.","I have a headache."]].forEach(([m,ex])=>mk('e7',`<i>${m}</i> → <input class="w" placeholder="Твой вариант (поменяй слова)">`,{ans:[ex],label:m,ok(){return this.in.value.trim().length>2}}));
/* BUILD SECTIONS */
sec('e1','Впиши пропущенное слово.');
sec('e2','Переведи фразу. Можно писать she\'s / they\'re.');
sec('e3','Нажми 🔊 (🐢 — медленно), послушай и напиши выражение.');
sec('e4','Выбери вторую половинку для каждого выражения.');
sec('e5','Впиши слова из рамки в текст по смыслу.');
sec('e6','Собери фразу: нажимай на слова по порядку. Нажми на слово внизу, чтобы убрать его.');
sec('e7','Возьми пример и придумай свои предложения. Здесь нет «правильных» ответов — проверь, что всё заполнено. Потом скопируй всё одной кнопкой.','<button onclick="cp7(this)">📋 Скопировать мои ответы (упр. 7)</button>');
function cp7(b){copy(E.e7.map((o,i)=>`${i+1}. ${o.label} → ${o.in.value||'—'}`).join('\n'),b)}
/* 8 QUIZ */
const PR=[100,200,300,500,1000,2000,4000,8000,16000,32000,64000,125000,250000,500000,1000000];
const Q=[["She ___ a teacher.","is",["are","am","do"],"a teacher"],["She works ___ a teacher.","as",["in","at","on"],"work as"],["Ей 25 лет: She is 25 ___ old.","years",["year","age","ages"],"years old"],["They are ___. (из Италии)","Italian",["Italy","Spain","Spanish"],"Italian"],["She is from Spain. She is ___.","Spanish",["Spain","Italian","Italy"],"Spanish"],["They ___ in Italy.","live",["lives","living","is"],"live"],["They are ___ Italy.","from",["in","at","on"],"from"],["«Насморк» по-английски:","a runny nose",["a sunny nose","a funny nose","a fast nose"],"a runny nose"],["«Учитель» по-английски:","teacher",["student","doctor","driver"],"a teacher"],["She ___ in Italy.","lives",["live","living","are"],"live"],["He is ___ Spain. (из Испании)","from",["in","at","to"],"from"],["They ___ Italian.","are",["is","am","do"],"Italian"],["She ___ 25.","is",["has","have","are"],"years old"],["«Они живут в Италии»: They live ___ Italy.","in",["from","at","on"],"live"],["«She works as a teacher» значит:","Она работает учителем",["Она любит учителей","Она учится","Она из учителей"],"work as"]];
let qi=0,qs=0,ql=[],lp=-1;
const qsec=document.createElement('section');qsec.innerHTML='<h2>8. 💰 Кто хочет стать миллионером? (15 вопросов)</h2><p class="in">Выбирай ответ или включи режим «пишу сам».</p><label><input type="checkbox" id="wm" onchange="qr()"> Пишу ответ сам</label><div id="quiz"></div>';$('#m').appendChild(qsec);
function qr(){const c=$('#quiz');if(qi>=15){c.innerHTML=`<p class="qq">🏁 Игра окончена! Верно: ${qs} из 15. Выигрыш: $${qs?PR[qs-1].toLocaleString('en-US'):0}</p><button class="p" onclick="qi=0;qs=0;ql=[];qr()">Играть снова</button>`;return}
const [q,a,ws,w]=Q[qi],wm=$('#wm').checked;let o;do{o=shuffle([a,...ws])}while(o.indexOf(a)===lp);lp=o.indexOf(a);
c.innerHTML=`<p class="lad">Вопрос ${qi+1}/15 · $${PR[qi].toLocaleString('en-US')}</p><p class="qq">${q}</p>`+(wm?`<input id="qa" placeholder="Твой ответ"> <button class="p" id="qb">Ответить</button>`:`<div class="opts">${o.map((x,i)=>`<button>${'ABCD'[i]}. ${x}</button>`).join('')}</div>`)+'<p id="qf"></p>';
const fin=(ans,btns)=>{const g=norm(ans)===norm(a);if(g)qs++;else bump(w);ql.push(`${qi+1}. ${q} — ${ans||'—'} ${g?'✓':'✗ (правильно: '+a+')'}`);btns.forEach(b=>{b.disabled=true;if(b.dataset.v===a)b.classList.add('good');else if(b.dataset.v===ans)b.classList.add('bad')});$('#qf').innerHTML=(g?'✅ Верно! ':'❌ Правильный ответ: <b>'+a+'</b>. ')+'<button class="p" onclick="qi++;qr()">Дальше →</button>'};
if(wm){$('#qb').onclick=()=>{$('#qb').disabled=true;$('#qa').disabled=true;fin($('#qa').value.trim(),[])}}
else c.querySelectorAll('.opts button').forEach((b,i)=>{b.dataset.v=o[i];b.onclick=()=>fin(o[i],[...c.querySelectorAll('.opts button')])})}
qr();
/* END */
function copy(t,btn){const done=()=>{const o=btn.textContent;btn.textContent='✓ Скопировано';setTimeout(()=>btn.textContent=o,1600)};const fb=()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove();done()};if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done,fb);else fb()}
function allText(){let t='English A1 — мои ответы\n';Object.keys(T).forEach(ex=>{t+='\n'+T[ex]+'\n';E[ex].forEach((o,i)=>{const v=o.val()||'—';t+=`${i+1}. ${o.label}: ${v}`+(ex==='e7'?'':o.ok()?' ✓':' ✗ (правильно: '+o.ans[0]+')')+'\n'})});t+='\n8. Quiz\n'+(ql.join('\n')||'—')+'\nИтог: '+qs+'/15\n';const k=Object.keys(P);if(k.length)t+='\nПроблемные слова: '+k.map(w=>w+' ('+P[w]+')').join(', ')+'\n';return t}
