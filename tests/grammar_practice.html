<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Present Simple / Present Continuous / Past Simple — Практика A1-A2</title>
<style>
  :root{
    --ps:#2f6fed;      /* Present Simple */
    --pc:#1a9e6b;      /* Present Continuous */
    --past:#c4592c;    /* Past Simple */
    --bg:#f6f5f2;
    --card:#ffffff;
    --ink:#232323;
    --muted:#6b6b6b;
    --border:#e4e1da;
    --good:#1a9e6b;
    --bad:#c4392c;
    --shadow: 0 2px 10px rgba(0,0,0,.06);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: "Georgia", "Iowan Old Style", ui-serif, serif;
    background:var(--bg);
    color:var(--ink);
    line-height:1.5;
  }
  header{
    background:linear-gradient(135deg,#2f6fed 0%, #1a9e6b 50%, #c4592c 100%);
    color:#fff;
    padding:28px 20px 20px;
    text-align:center;
  }
  header h1{
    margin:0 0 6px;
    font-size:1.6rem;
    font-family: "Trebuchet MS", ui-sans-serif, sans-serif;
  }
  header p{margin:0; opacity:.95; font-size:.95rem;}
  .legend{
    display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin-top:14px;
    font-family: "Trebuchet MS", ui-sans-serif, sans-serif;
    font-size:.82rem;
  }
  .legend span{
    background:rgba(255,255,255,.18);
    padding:4px 10px;
    border-radius:20px;
  }
  nav.tabs{
    position:sticky; top:0; z-index:20;
    display:flex; flex-wrap:wrap; gap:6px;
    background:#fff;
    border-bottom:1px solid var(--border);
    padding:10px 12px;
    font-family: "Trebuchet MS", ui-sans-serif, sans-serif;
    justify-content:center;
  }
  nav.tabs button{
    border:1px solid var(--border);
    background:#fbfaf8;
    color:var(--ink);
    padding:7px 12px;
    border-radius:8px;
    cursor:pointer;
    font-size:.82rem;
    transition:.15s;
  }
  nav.tabs button:hover{background:#efece4;}
  nav.tabs button.active{
    background:var(--ink); color:#fff; border-color:var(--ink);
  }
  main{max-width:880px; margin:0 auto; padding:22px 16px 70px;}
  .toolbar-global{
    display:flex; gap:8px; justify-content:center; margin-bottom:18px; flex-wrap:wrap;
    font-family:"Trebuchet MS", ui-sans-serif, sans-serif;
  }
  .btn{
    font-family:"Trebuchet MS", ui-sans-serif, sans-serif;
    border:none;
    padding:9px 16px;
    border-radius:8px;
    cursor:pointer;
    font-size:.85rem;
    font-weight:600;
    transition:.15s;
  }
  .btn-primary{background:var(--ink); color:#fff;}
  .btn-primary:hover{opacity:.85;}
  .btn-outline{background:#fff; border:1px solid var(--ink); color:var(--ink);}
  .btn-outline:hover{background:#f0efe9;}
  .btn-copy{background:#fff; border:1px solid #999; color:#333;}
  .btn-copy:hover{background:#f0efe9;}
  .exercise{display:none;}
  .exercise.active{display:block; animation:fade .25s ease;}
  @keyframes fade{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}
  .ex-head{margin-bottom:16px;}
  .ex-head h2{
    font-family:"Trebuchet MS", ui-sans-serif, sans-serif;
    margin:0 0 4px; font-size:1.25rem;
  }
  .ex-head p.instr{margin:0; color:var(--muted); font-size:.92rem;}
  .item{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:10px;
    padding:14px 16px;
    margin-bottom:12px;
    box-shadow:var(--shadow);
  }
  .item-num{
    font-family:"Trebuchet MS", ui-sans-serif, sans-serif;
    font-weight:700;
    color:#999;
    font-size:.78rem;
    margin-bottom:6px;
  }
  .item-text{margin-bottom:10px; font-size:1.02rem;}
  .options{display:flex; flex-wrap:wrap; gap:8px;}
  .opt-btn{
    font-family:"Trebuchet MS", ui-sans-serif, sans-serif;
    border:1.5px solid var(--border);
    background:#fbfaf8;
    padding:7px 12px;
    border-radius:7px;
    cursor:pointer;
    font-size:.88rem;
  }
  .opt-btn:hover{border-color:#aaa;}
  .opt-btn.selected{border-color:var(--ink); background:#eee;}
  .opt-btn.correct{border-color:var(--good); background:#e6f6ee; color:#0d6b45;}
  .opt-btn.incorrect{border-color:var(--bad); background:#fbe9e6; color:#a32c1c;}
  input.gap{
    font-family:"Trebuchet MS", ui-sans-serif, sans-serif;
    border:1.5px solid var(--border);
    border-radius:7px;
    padding:7px 10px;
    font-size:.92rem;
    min-width:200px;
  }
  select.tense-select{
    font-family:"Trebuchet MS", ui-sans-serif, sans-serif;
    border:1.5px solid var(--border);
    border-radius:7px;
    padding:6px 8px;
    font-size:.88rem;
  }
  .result-box{
    margin-top:8px;
    font-size:.88rem;
    padding:8px 10px;
    border-radius:7px;
    display:none;
  }
  .result-box.show{display:block;}
  .result-box.ok{background:#e6f6ee; color:#0d6b45; border:1px solid #b8e5cf;}
  .result-box.no{background:#fbe9e6; color:#a32c1c; border:1px solid #f0c3ba;}
  .explain{
    margin-top:6px; font-size:.85rem; color:var(--muted);
    border-left:3px solid #ddd; padding-left:8px;
  }
  .tag{
    display:inline-block; font-family:"Trebuchet MS", ui-sans-serif, sans-serif;
    font-size:.7rem; font-weight:700; letter-spacing:.02em;
    padding:2px 7px; border-radius:10px; color:#fff; margin-right:6px; vertical-align:middle;
  }
  .tag.ps{background:var(--ps);}
  .tag.pc{background:var(--pc);}
  .tag.past{background:var(--past);}
  .score-panel{
    font-family:"Trebuchet MS", ui-sans-serif, sans-serif;
    text-align:center; margin:14px 0; font-weight:700; font-size:1rem;
    display:none;
  }
  .score-panel.show{display:block;}
  .ex-actions{display:flex; gap:8px; flex-wrap:wrap; margin:16px 0; justify-content:center;}
  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:#fff; padding:10px 18px; border-radius:8px;
    font-family:"Trebuchet MS", ui-sans-serif, sans-serif; font-size:.85rem;
    opacity:0; pointer-events:none; transition:.3s; z-index:50;
  }
  .toast.show{opacity:1; bottom:30px;}
  .reveal-box{
    margin-top:10px; padding:10px 12px; background:#faf9f5; border-radius:8px;
    border:1px dashed #ccc; font-size:.9rem; display:none;
  }
  .reveal-box.show{display:block;}
  .drill-part{margin:3px 0;}
  .drill-part b{color:var(--ink);}
  footer{
    text-align:center; padding:20px; color:var(--muted); font-size:.8rem;
    font-family:"Trebuchet MS", ui-sans-serif, sans-serif;
  }
  @media(max-width:600px){
    header h1{font-size:1.25rem;}
    nav.tabs button{font-size:.74rem; padding:6px 9px;}
  }
</style>
</head>
<body>

<header>
  <h1>Present Simple · Present Continuous · Past Simple</h1>
  <p>Интерактивная тренировка грамматики — уровень A1–A2</p>
  <div class="legend">
    <span><span class="tag ps">PS</span>Present Simple</span>
    <span><span class="tag pc">PC</span>Present Continuous</span>
    <span><span class="tag past">Past</span>Past Simple</span>
  </div>
</header>

<nav class="tabs" id="tabs"></nav>

<main>
  <div class="toolbar-global">
    <button class="btn btn-outline" id="showAllBtn">Показать все ответы (везде)</button>
    <button class="btn btn-copy" id="copyAllBtn">📋 Скопировать ВСЕ ответы</button>
  </div>
  <div id="exercises"></div>
</main>

<footer>Правило: Present Simple — факты и привычки · Present Continuous — действие сейчас · Past Simple — законченное действие в прошлом</footer>
<div class="toast" id="toast"></div>

<script>
/* ======================= ДАННЫЕ УПРАЖНЕНИЙ ======================= */

const EX1 = { // Choose the correct answer
  title: "Упражнение 1. Choose the correct answer",
  instr: "Выберите правильный вариант глагола.",
  type: "mcq",
  items: [
    {q:"My sister ___ TV every evening.", opts:["watch","watches","is watching","watched"], correct:1, ex:"Present Simple: привычное действие + «every evening», 3-е лицо ед.ч. → watches."},
    {q:"Look! The children ___ in the garden.", opts:["play","plays","are playing","played"], correct:2, ex:"«Look!» указывает на действие в момент речи → Present Continuous: are playing."},
    {q:"We ___ to Spain last summer.", opts:["go","goes","are going","went"], correct:3, ex:"«last summer» — законченное действие в прошлом → Past Simple: went."},
    {q:"I ___ my homework right now.", opts:["do","does","am doing","did"], correct:2, ex:"«right now» = сейчас, в процессе → Present Continuous: am doing."},
    {q:"He never ___ breakfast.", opts:["eat","eats","is eating","ate"], correct:1, ex:"«never» — маркер привычки, 3-е лицо ед.ч. → Present Simple: eats."},
    {q:"They ___ football yesterday.", opts:["play","plays","are playing","played"], correct:3, ex:"«yesterday» — прошлое действие → Past Simple: played."},
    {q:"She ___ a book at the moment.", opts:["read","reads","is reading","read"], correct:2, ex:"«at the moment» → действие происходит сейчас → Present Continuous: is reading."},
    {q:"Water ___ at 100 degrees.", opts:["boil","boils","is boiling","boiled"], correct:1, ex:"Общеизвестный факт → Present Simple: boils."},
    {q:"I ___ to the cinema two days ago.", opts:["go","goes","am going","went"], correct:3, ex:"«two days ago» — прошлое → Past Simple: went."},
    {q:"Listen! Someone ___ at the door.", opts:["knock","knocks","is knocking","knocked"], correct:2, ex:"«Listen!» → действие сейчас → Present Continuous: is knocking."},
  ]
};

const EX2 = { // Time expressions distribution
  title: "Упражнение 2. Time expressions — распредели по временам",
  instr: "Для каждого слова/выражения выберите, к какому времени оно обычно относится.",
  type: "select",
  items: [
    {phrase:"every day", correct:"ps", ex:"Регулярное действие → Present Simple."},
    {phrase:"usually", correct:"ps", ex:"Наречие частотности → Present Simple."},
    {phrase:"often", correct:"ps", ex:"Наречие частотности → Present Simple."},
    {phrase:"right now", correct:"pc", ex:"Момент речи → Present Continuous."},
    {phrase:"at the moment", correct:"pc", ex:"Момент речи → Present Continuous."},
    {phrase:"Look!", correct:"pc", ex:"Призыв обратить внимание на текущее действие → Present Continuous."},
    {phrase:"yesterday", correct:"past", ex:"Конкретный момент в прошлом → Past Simple."},
    {phrase:"last week", correct:"past", ex:"Законченный период в прошлом → Past Simple."},
    {phrase:"two days ago", correct:"past", ex:"«...ago» = назад → Past Simple."},
    {phrase:"in 2010", correct:"past", ex:"Конкретный год в прошлом → Past Simple."},
  ]
};

const EX3 = { // Find the mistake
  title: "Упражнение 3. Find the mistake",
  instr: "Нажмите на слово, в котором ошибка, затем проверьте себя.",
  type: "mistake",
  items: [
    {parts:["She","don't","like","coffee","at all."], wrong:1, fix:"She doesn't like coffee at all.", ex:"С he/she/it используется doesn't, а не don't."},
    {parts:["I","am work","at","the moment","on a report."], wrong:1, fix:"I am working at the moment on a report.", ex:"В Present Continuous нужна форма am/is/are + verb-ing: am working."},
    {parts:["They","goed","to","the party","last Friday."], wrong:1, fix:"They went to the party last Friday.", ex:"Go — неправильный глагол: 2-я форма went, а не goed."},
    {parts:["He","usually","watch","TV","in the evening."], wrong:2, fix:"He usually watches TV in the evening.", ex:"С he/she/it в Present Simple добавляется -s/-es: watches."},
    {parts:["Look!","The dog","run","after the cat","now."], wrong:2, fix:"Look! The dog is running after the cat now.", ex:"«Look!» и «now» указывают на Present Continuous: is running."},
    {parts:["We","didn't","went","to school","yesterday."], wrong:2, fix:"We didn't go to school yesterday.", ex:"После didn't глагол ставится в базовой форме: didn't go, а не went."},
    {parts:["Does","she","likes","tea or coffee?"], wrong:2, fix:"Does she like tea or coffee?", ex:"После does основной глагол без -s: does she like."},
    {parts:["I","am not","understanding","this rule","right now."], wrong:2, fix:"I don't understand this rule right now.", ex:"Understand — глагол состояния (stative verb), не используется в Continuous."},
    {parts:["Yesterday","I","am","at home","all day."], wrong:2, fix:"Yesterday I was at home all day.", ex:"«Yesterday» требует Past Simple: am → was."},
    {parts:["My parents","is","watching","a film","now."], wrong:1, fix:"My parents are watching a film now.", ex:"Parents — множественное число, значит are, а не is."},
  ]
};

const EX4 = { // Fill in the gaps
  title: "Упражнение 4. Fill in the gaps using the correct form",
  instr: "Впишите правильную форму глагола в скобках.",
  type: "gap",
  items: [
    {before:"She usually ", after:" up at 7 o'clock.", word:"(get)", answers:["gets"], ex:"Present Simple, 3-е лицо ед.ч. → gets."},
    {before:"Look! It ", after:" outside.", word:"(rain)", answers:["is raining"], ex:"«Look!» → Present Continuous → is raining."},
    {before:"We ", after:" our grandparents last weekend.", word:"(visit)", answers:["visited"], ex:"«last weekend» → Past Simple → visited."},
    {before:"He never ", after:" meat.", word:"(eat)", answers:["eats"], ex:"«never» + he → Present Simple → eats."},
    {before:"I ", after:" TV right now, I'm reading.", word:"(not / watch)", answers:["am not watching","'m not watching"], ex:"Отрицание в Present Continuous → am not watching."},
    {before:"They ", after:" to school yesterday because it was Sunday.", word:"(not / go)", answers:["didn't go","did not go"], ex:"Отрицание в Past Simple → didn't + базовая форма → didn't go."},
    {before:"My brother ", after:" English at the moment.", word:"(study)", answers:["is studying"], ex:"«at the moment» → Present Continuous → is studying."},
    {before:"", after:" football yesterday?", word:"(you / play)", answers:["did you play","Did you play"], ex:"Вопрос в Past Simple → did + подлежащее + базовая форма."},
    {before:"", after:" her homework right now?", word:"(she / finish)", answers:["is she finishing","Is she finishing"], ex:"Вопрос в Present Continuous → is + подлежащее + verb-ing."},
    {before:"Water ", after:" at 0 degrees.", word:"(freeze)", answers:["freezes"], ex:"Общеизвестный факт → Present Simple → freezes."},
  ]
};

const EX5 = { // Replace the highlighted word / Rephrase
  title: "Упражнение 5. Replace the highlighted word / Rephrase",
  instr: "Часть А — замените выделенное слово подходящим по смыслу и времени. Часть Б — выберите верный перефраз предложения.",
  type: "mcq",
  items: [
    {q:"She reads books «every day». Replace the highlighted words:", opts:["right now","every week","yesterday","two days ago"], correct:1, ex:"Нужно выражение-маркер Present Simple → every week."},
    {q:"I am cooking dinner «now». Replace the highlighted word:", opts:["usually","at the moment","yesterday","last night"], correct:1, ex:"Нужен маркер Present Continuous → at the moment."},
    {q:"We visited Paris «last year». Replace the highlighted words:", opts:["now","often","two years ago","every year"], correct:2, ex:"Нужен маркер Past Simple → two years ago."},
    {q:"He always drinks coffee in the morning. Replace «always»:", opts:["right now","usually","yesterday","at the moment"], correct:1, ex:"Синонимичный маркер Present Simple → usually."},
    {q:"They are playing football «at the moment». Replace the highlighted words:", opts:["right now","every day","last week","often"], correct:0, ex:"Синонимичный маркер Present Continuous → right now."},
    {q:"Rephrase: «She likes tea.» → Make it negative.", opts:["She not like tea.","She don't like tea.","She doesn't like tea.","She isn't like tea."], correct:2, ex:"Present Simple, 3-е лицо ед.ч. → doesn't + базовая форма."},
    {q:"Rephrase: «They went to the park.» → Make it a question.", opts:["Did they go to the park?","Did they went to the park?","Do they went to the park?","Were they go to the park?"], correct:0, ex:"Past Simple вопрос → Did + подлежащее + базовая форма глагола."},
    {q:"Rephrase: «He is watching TV.» → Make it negative.", opts:["He not watching TV.","He isn't watching TV.","He doesn't watching TV.","He wasn't watching TV."], correct:1, ex:"Present Continuous отрицание → isn't + verb-ing."},
    {q:"Rephrase: «We play tennis on Sundays.» → Make it a question.", opts:["Do we play tennis on Sundays?","Does we play tennis on Sundays?","Are we play tennis on Sundays?","Did we play tennis on Sundays?"], correct:0, ex:"Present Simple вопрос с we → Do we play...?"},
    {q:"Rephrase: «I finished my homework.» → Make it negative.", opts:["I not finished my homework.","I don't finished my homework.","I didn't finish my homework.","I wasn't finish my homework."], correct:2, ex:"Past Simple отрицание → didn't + базовая форма."},
  ]
};

const EX6 = { // What usually comes after?
  title: "Упражнение 6. What usually comes after?",
  instr: "Выберите, какая форма глагола обычно следует за данной конструкцией.",
  type: "mcq",
  items: [
    {q:"She usually ___", opts:["play","plays","playing","played"], correct:1, ex:"После she в Present Simple глагол получает -s → plays."},
    {q:"I am ___", opts:["play","plays","playing","played"], correct:2, ex:"После am/is/are в Continuous — форма verb-ing → playing."},
    {q:"They didn't ___", opts:["play","plays","playing","played"], correct:0, ex:"После didn't всегда базовая форма → play."},
    {q:"Does he ___", opts:["play","plays","playing","played"], correct:0, ex:"После does основной глагол без -s → play."},
    {q:"Look! The baby is ___", opts:["cry","cries","crying","cried"], correct:2, ex:"После am/is/are — verb-ing → crying."},
    {q:"Yesterday we ___", opts:["play","plays","playing","played"], correct:3, ex:"«Yesterday» требует Past Simple → played."},
    {q:"He never ___", opts:["eat","eats","eating","ate"], correct:1, ex:"He + Present Simple → -s форма → eats."},
    {q:"Did you ___ football last night?", opts:["play","plays","playing","played"], correct:0, ex:"После Did — базовая форма → play."},
    {q:"I'm not ___ right now.", opts:["work","works","working","worked"], correct:2, ex:"После am not — verb-ing → working."},
    {q:"My parents usually ___ up early.", opts:["get","gets","getting","got"], correct:0, ex:"Parents = множественное число → без -s → get."},
  ]
};

const EX7 = { // Finish the sentences with your own ideas
  title: "Упражнение 7. Finish the sentences with your own ideas",
  instr: "Закончите предложения своими идеями. Готового «правильного» ответа нет — после ответа посмотрите пример для сравнения.",
  type: "open",
  items: [
    {q:"Every morning I usually ___.", sample:"Every morning I usually drink a cup of tea."},
    {q:"Right now I am ___.", sample:"Right now I am reading this sentence."},
    {q:"Yesterday I ___.", sample:"Yesterday I met my friend in the park."},
    {q:"My best friend never ___.", sample:"My best friend never tells lies."},
    {q:"At the moment my family ___.", sample:"At the moment my family is having dinner."},
    {q:"Last weekend we ___.", sample:"Last weekend we visited our grandparents."},
    {q:"I often ___ on Sundays.", sample:"I often go for a walk on Sundays."},
    {q:"Look! My cat is ___.", sample:"Look! My cat is sleeping on the sofa."},
    {q:"Two years ago I ___.", sample:"Two years ago I lived in another city."},
    {q:"I don't usually ___.", sample:"I don't usually eat fast food."},
  ]
};

const EX8 = { // Drilling: Repeat & Change
  title: "Упражнение 8. Drilling — Repeat & Change",
  instr: "Прочитайте утверждение вслух, затем сами образуйте: вопрос, отрицание и короткий ответ. Нажмите «Показать», чтобы проверить себя.",
  type: "drill",
  items: [
    {base:"She plays tennis.", q:"Does she play tennis?", neg:"She doesn't play tennis.", short:"Yes, she does. / No, she doesn't."},
    {base:"They went to school.", q:"Did they go to school?", neg:"They didn't go to school.", short:"Yes, they did. / No, they didn't."},
    {base:"He is reading a book.", q:"Is he reading a book?", neg:"He isn't reading a book.", short:"Yes, he is. / No, he isn't."},
    {base:"I like pizza.", q:"Do you like pizza?", neg:"I don't like pizza.", short:"Yes, I do. / No, I don't."},
    {base:"We watched a film yesterday.", q:"Did we watch a film yesterday?", neg:"We didn't watch a film yesterday.", short:"Yes, we did. / No, we didn't."},
    {base:"She is cooking dinner now.", q:"Is she cooking dinner now?", neg:"She isn't cooking dinner now.", short:"Yes, she is. / No, she isn't."},
    {base:"They play football on Sundays.", q:"Do they play football on Sundays?", neg:"They don't play football on Sundays.", short:"Yes, they do. / No, they don't."},
    {base:"He finished his homework.", q:"Did he finish his homework?", neg:"He didn't finish his homework.", short:"Yes, he did. / No, he didn't."},
    {base:"I am working at the moment.", q:"Are you working at the moment?", neg:"I am not working at the moment.", short:"Yes, I am. / No, I'm not."},
    {base:"She goes to the gym every day.", q:"Does she go to the gym every day?", neg:"She doesn't go to the gym every day.", short:"Yes, she does. / No, she doesn't."},
  ]
};

const ALL_EX = [EX1,EX2,EX3,EX4,EX5,EX6,EX7,EX8];
const TENSE_LABEL = {ps:"Present Simple", pc:"Present Continuous", past:"Past Simple"};

/* ======================= РЕНДЕР ======================= */

const tabsEl = document.getElementById('tabs');
const exercisesEl = document.getElementById('exercises');

ALL_EX.forEach((ex,i)=>{
  const btn = document.createElement('button');
  btn.textContent = "Упр. "+(i+1);
  btn.onclick = ()=>showTab(i);
  btn.id = "tabbtn"+i;
  tabsEl.appendChild(btn);

  const sec = document.createElement('section');
  sec.className = 'exercise';
  sec.id = 'exsec'+i;

  sec.innerHTML = `
    <div class="ex-head">
      <h2>${ex.title}</h2>
      <p class="instr">${ex.instr}</p>
    </div>
    <div class="items" id="items${i}"></div>
    <div class="score-panel" id="score${i}"></div>
    <div class="ex-actions">
      ${ex.type!=="open" && ex.type!=="drill" ? `<button class="btn btn-primary" data-act="check" data-idx="${i}">Проверить ответы</button>` : ``}
      <button class="btn btn-outline" data-act="reveal" data-idx="${i}">Показать ответы</button>
      <button class="btn btn-copy" data-act="copy" data-idx="${i}">📋 Скопировать ответы этого упражнения</button>
    </div>
  `;
  exercisesEl.appendChild(sec);

  const itemsWrap = sec.querySelector('#items'+i);

  if(ex.type==="mcq"){
    ex.items.forEach((it,qi)=>{
      const div = document.createElement('div');
      div.className='item';
      div.innerHTML = `
        <div class="item-num">${qi+1}</div>
        <div class="item-text">${it.q}</div>
        <div class="options">
          ${it.opts.map((o,oi)=>`<button class="opt-btn" data-oi="${oi}">${o}</button>`).join('')}
        </div>
        <div class="explain" style="display:none;">${it.ex}</div>
      `;
      const buttons = div.querySelectorAll('.opt-btn');
      buttons.forEach(b=>{
        b.onclick = ()=>{
          buttons.forEach(x=>x.classList.remove('selected'));
          b.classList.add('selected');
          div.dataset.selected = b.dataset.oi;
        };
      });
      itemsWrap.appendChild(div);
    });
  }

  if(ex.type==="select"){
    ex.items.forEach((it,qi)=>{
      const div = document.createElement('div');
      div.className='item';
      div.innerHTML = `
        <div class="item-num">${qi+1}</div>
        <div class="item-text">“<b>${it.phrase}</b>” — это выражение обычно относится к:</div>
        <select class="tense-select">
          <option value="">— выбери —</option>
          <option value="ps">Present Simple</option>
          <option value="pc">Present Continuous</option>
          <option value="past">Past Simple</option>
        </select>
        <div class="explain" style="display:none;">${it.ex}</div>
      `;
      itemsWrap.appendChild(div);
    });
  }

  if(ex.type==="mistake"){
    ex.items.forEach((it,qi)=>{
      const div = document.createElement('div');
      div.className='item';
      div.innerHTML = `
        <div class="item-num">${qi+1}</div>
        <div class="item-text options">
          ${it.parts.map((p,pi)=>`<button class="opt-btn" data-pi="${pi}">${p}</button>`).join(' ')}
        </div>
        <div class="explain" style="display:none;">Правильно: <b>${it.fix}</b><br>${it.ex}</div>
      `;
      const buttons = div.querySelectorAll('.opt-btn');
      buttons.forEach(b=>{
        b.onclick = ()=>{
          buttons.forEach(x=>x.classList.remove('selected'));
          b.classList.add('selected');
          div.dataset.selected = b.dataset.pi;
        };
      });
      itemsWrap.appendChild(div);
    });
  }

  if(ex.type==="gap"){
    ex.items.forEach((it,qi)=>{
      const div = document.createElement('div');
      div.className='item';
      div.innerHTML = `
        <div class="item-num">${qi+1}</div>
        <div class="item-text">${it.before}<input type="text" class="gap" placeholder="${it.word}">${it.after}</div>
        <div class="explain" style="display:none;">Ответ: <b>${it.answers[0]}</b> ${it.word} — ${it.ex}</div>
      `;
      itemsWrap.appendChild(div);
    });
  }

  if(ex.type==="open"){
    ex.items.forEach((it,qi)=>{
      const div = document.createElement('div');
      div.className='item';
      div.innerHTML = `
        <div class="item-num">${qi+1}</div>
        <div class="item-text">${it.q}</div>
        <input type="text" class="gap" style="width:100%;" placeholder="Твой вариант...">
        <div class="reveal-box"><i>Пример ответа (твой может отличаться):</i><br>${it.sample}</div>
      `;
      itemsWrap.appendChild(div);
    });
  }

  if(ex.type==="drill"){
    ex.items.forEach((it,qi)=>{
      const div = document.createElement('div');
      div.className='item';
      div.innerHTML = `
        <div class="item-num">${qi+1}</div>
        <div class="item-text"><b>${it.base}</b></div>
        <div style="font-size:.85rem; color:var(--muted); margin-bottom:6px;">Образуй: вопрос → отрицание → короткий ответ</div>
        <div class="reveal-box">
          <div class="drill-part">❓ <b>Question:</b> ${it.q}</div>
          <div class="drill-part">🚫 <b>Negative:</b> ${it.neg}</div>
          <div class="drill-part">💬 <b>Short answer:</b> ${it.short}</div>
        </div>
      `;
      itemsWrap.appendChild(div);
    });
  }
});

function showTab(i){
  document.querySelectorAll('.exercise').forEach((s,idx)=>s.classList.toggle('active', idx===i));
  document.querySelectorAll('nav.tabs button').forEach((b,idx)=>b.classList.toggle('active', idx===i));
  window.scrollTo({top:0, behavior:'smooth'});
}
showTab(0);

/* ======================= ПРОВЕРКА / ПОКАЗ ОТВЕТОВ ======================= */

function normalize(s){
  return s.toLowerCase().replace(/[.?!]/g,'').replace(/\s+/g,' ').trim();
}

function checkExercise(i){
  const ex = ALL_EX[i];
  const items = document.querySelectorAll('#items'+i+' .item');
  let correctCount = 0;

  items.forEach((div,qi)=>{
    const data = ex.items[qi];
    const explainEl = div.querySelector('.explain');

    if(ex.type==="mcq"){
      const sel = div.dataset.selected;
      const buttons = div.querySelectorAll('.opt-btn');
      buttons.forEach(b=>b.classList.remove('correct','incorrect'));
      if(sel!==undefined){
        const selIdx = parseInt(sel);
        if(selIdx===data.correct){ correctCount++; buttons[selIdx].classList.add('correct'); }
        else{
          buttons[selIdx].classList.add('incorrect');
          buttons[data.correct].classList.add('correct');
        }
      } else {
        buttons[data.correct].classList.add('correct');
      }
      explainEl.style.display='block';
    }

    if(ex.type==="select"){
      const sel = div.querySelector('select');
      if(sel.value===data.correct){
        correctCount++;
        sel.style.borderColor = 'var(--good)';
        sel.style.background = '#e6f6ee';
      } else {
        sel.style.borderColor = 'var(--bad)';
        sel.style.background = '#fbe9e6';
      }
      explainEl.style.display='block';
      explainEl.innerHTML = `Правильно: <b>${TENSE_LABEL[data.correct]}</b><br>${data.ex}`;
    }

    if(ex.type==="mistake"){
      const sel = div.dataset.selected;
      const buttons = div.querySelectorAll('.opt-btn');
      buttons.forEach(b=>b.classList.remove('correct','incorrect'));
      if(sel!==undefined){
        const selIdx = parseInt(sel);
        if(selIdx===data.wrong){ correctCount++; buttons[selIdx].classList.add('correct'); }
        else{
          buttons[selIdx].classList.add('incorrect');
          buttons[data.wrong].classList.add('correct');
        }
      } else {
        buttons[data.wrong].classList.add('correct');
      }
      explainEl.style.display='block';
    }

    if(ex.type==="gap"){
      const input = div.querySelector('input.gap');
      const val = normalize(input.value||"");
      const ok = data.answers.some(a=>normalize(a)===val);
      if(ok){ correctCount++; input.style.borderColor='var(--good)'; input.style.background='#e6f6ee'; }
      else { input.style.borderColor='var(--bad)'; input.style.background='#fbe9e6'; }
      explainEl.style.display='block';
    }
  });

  const scoreEl = document.getElementById('score'+i);
  if(scoreEl){
    scoreEl.classList.add('show');
    scoreEl.textContent = `Результат: ${correctCount} из ${ex.items.length}`;
    scoreEl.style.color = correctCount===ex.items.length ? 'var(--good)' : (correctCount===0 ? 'var(--bad)' : 'var(--ink)');
  }
}

function revealExercise(i){
  const ex = ALL_EX[i];
  const items = document.querySelectorAll('#items'+i+' .item');
  items.forEach((div,qi)=>{
    const data = ex.items[qi];
    if(ex.type==="mcq"){
      const buttons = div.querySelectorAll('.opt-btn');
      buttons.forEach(b=>b.classList.remove('incorrect'));
      buttons[data.correct].classList.add('correct');
      div.querySelector('.explain').style.display='block';
    }
    if(ex.type==="select"){
      div.querySelector('select').value = data.correct;
      const explainEl = div.querySelector('.explain');
      explainEl.style.display='block';
      explainEl.innerHTML = `Правильно: <b>${TENSE_LABEL[data.correct]}</b><br>${data.ex}`;
    }
    if(ex.type==="mistake"){
      const buttons = div.querySelectorAll('.opt-btn');
      buttons.forEach(b=>b.classList.remove('incorrect'));
      buttons[data.wrong].classList.add('correct');
      div.querySelector('.explain').style.display='block';
    }
    if(ex.type==="gap"){
      div.querySelector('input.gap').placeholder = data.answers[0];
      div.querySelector('.explain').style.display='block';
    }
    if(ex.type==="open" || ex.type==="drill"){
      div.querySelector('.reveal-box').classList.add('show');
    }
  });
}

function copyExercise(i){
  const ex = ALL_EX[i];
  let text = ex.title + "\n\n";
  ex.items.forEach((data,qi)=>{
    if(ex.type==="mcq"){
      text += `${qi+1}. ${data.q}\nОтвет: ${data.opts[data.correct]}\nПочему: ${data.ex}\n\n`;
    }
    if(ex.type==="select"){
      text += `${qi+1}. ${data.phrase}\nОтвет: ${TENSE_LABEL[data.correct]}\nПочему: ${data.ex}\n\n`;
    }
    if(ex.type==="mistake"){
      text += `${qi+1}. ${data.parts.join(' ')}\nИсправлено: ${data.fix}\nПочему: ${data.ex}\n\n`;
    }
    if(ex.type==="gap"){
      text += `${qi+1}. ${data.before}___${data.after} ${data.word}\nОтвет: ${data.answers[0]}\nПочему: ${data.ex}\n\n`;
    }
    if(ex.type==="open"){
      text += `${qi+1}. ${data.q}\nПример ответа: ${data.sample}\n\n`;
    }
    if(ex.type==="drill"){
      text += `${qi+1}. ${data.base}\nQuestion: ${data.q}\nNegative: ${data.neg}\nShort answer: ${data.short}\n\n`;
    }
  });
  copyToClipboard(text);
}

function copyAll(){
  let text = "PRESENT SIMPLE / PRESENT CONTINUOUS / PAST SIMPLE — ВСЕ ОТВЕТЫ\n";
  text += "=".repeat(50) + "\n\n";
  ALL_EX.forEach((ex,i)=>{
    text += `--- ${ex.title} ---\n\n`;
    ex.items.forEach((data,qi)=>{
      if(ex.type==="mcq"){
        text += `${qi+1}. ${data.q}\nОтвет: ${data.opts[data.correct]} — ${data.ex}\n\n`;
      }
      if(ex.type==="select"){
        text += `${qi+1}. ${data.phrase} → ${TENSE_LABEL[data.correct]} — ${data.ex}\n\n`;
      }
      if(ex.type==="mistake"){
        text += `${qi+1}. ${data.parts.join(' ')}\nИсправлено: ${data.fix} — ${data.ex}\n\n`;
      }
      if(ex.type==="gap"){
        text += `${qi+1}. ${data.before}___${data.after} ${data.word}\nОтвет: ${data.answers[0]} — ${data.ex}\n\n`;
      }
      if(ex.type==="open"){
        text += `${qi+1}. ${data.q}\nПример: ${data.sample}\n\n`;
      }
      if(ex.type==="drill"){
        text += `${qi+1}. ${data.base}\nQ: ${data.q} | Neg: ${data.neg} | Short: ${data.short}\n\n`;
      }
    });
    text += "\n";
  });
  copyToClipboard(text);
}

function copyToClipboard(text){
  navigator.clipboard.writeText(text).then(()=>{
    showToast("Скопировано в буфер обмена ✓");
  }).catch(()=>{
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast("Скопировано в буфер обмена ✓");
  });
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

document.addEventListener('click', (e)=>{
  const act = e.target.dataset.act;
  if(!act) return;
  const idx = parseInt(e.target.dataset.idx);
  if(act==="check") checkExercise(idx);
  if(act==="reveal") revealExercise(idx);
  if(act==="copy") copyExercise(idx);
});

document.getElementById('showAllBtn').onclick = ()=>{
  ALL_EX.forEach((_,i)=>revealExercise(i));
  showToast("Ответы показаны во всех упражнениях");
};
document.getElementById('copyAllBtn').onclick = copyAll;

</script>
