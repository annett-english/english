<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Present Perfect Continuous — практика</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1d2433;--mu:#667;--bd:#dde1ea;--ac:#4f46e5;--ok:#15803d;--okb:#dcfce7;--no:#b91c1c;--nob:#fee2e2;--hi:#eef2ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141c;--card:#1b1e29;--tx:#e8eaf2;--mu:#9aa0b4;--bd:#2d3242;--ac:#818cf8;--ok:#4ade80;--okb:#12301d;--no:#f87171;--nob:#3a1717;--hi:#23264a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12141c;--card:#1b1e29;--tx:#e8eaf2;--mu:#9aa0b4;--bd:#2d3242;--ac:#818cf8;--ok:#4ade80;--okb:#12301d;--no:#f87171;--nob:#3a1717;--hi:#23264a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:.2em 0}h2{font-size:1.15rem;margin:.2em 0}
.mu{color:var(--mu);font-size:.9rem}
details{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;margin:10px 0}
summary{cursor:pointer;font-weight:600}
details li{margin:4px 0}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 0;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav button{flex:none}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--ac)}
button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
button.sel,nav button.on{background:var(--hi);border-color:var(--ac);font-weight:600}
.item{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin:10px 0}
.item.ok{border-color:var(--ok)}.item.bad{border-color:var(--no)}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
input[type=text],textarea{font:inherit;width:100%;max-width:100%;box-sizing:border-box;padding:7px 10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
.acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.fb{margin-top:8px;padding:8px 10px;border-radius:8px;font-size:.93rem;display:none}
.fb.ok{display:block;background:var(--okb)}.fb.no{display:block;background:var(--nob)}.fb.info{display:block;background:var(--hi)}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
.sc{margin-left:auto;font-weight:700}
.tk{display:inline-block;margin:2px;padding:2px 6px;border-radius:6px;border:1px solid var(--bd);cursor:pointer}
.tk.sel{background:var(--hi);border-color:var(--ac)}
.area{min-height:40px;border:1px dashed var(--bd);border-radius:10px;padding:6px;margin:6px 0}
.ladder{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0}
.ladder span{padding:2px 8px;border-radius:6px;border:1px solid var(--bd);font-size:.85rem}
.ladder .cur{background:var(--ac);color:#fff;border-color:var(--ac)}.ladder .done{background:var(--okb)}
.q{font-size:1.1rem;font-weight:600;margin:10px 0}
.qo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:520px){.qo{grid-template-columns:1fr}}
.qo button{text-align:left;padding:10px}
.qo .c{background:var(--okb);border-color:var(--ok)}.qo .w{background:var(--nob);border-color:var(--no)}.qo .h{visibility:hidden}
</style></head><body><main>
<h1>Present Perfect Continuous</h1>
<p class="mu">have/has been + V-ing · 6 упражнений по 8 пунктов, свои предложения и «Кто хочет стать миллионером»</p>
<details><summary>Шпаргалка по правилу</summary><ul id="rules"></ul></details>
<nav id="nav"></nav>
<div id="view"></div>
</main>
<script>
const R={
A:"Форма: подлежащее + have/has been + V-ing. С he/she/it — has, с I/you/we/they — have.",
B:"С for/since и глаголами действия: действие началось в прошлом и продолжается сейчас → Present Perfect Continuous (I have been working here for 2 years).",
C:"Глаголы состояния (know, like, have, want, be) не используются в Continuous — только Present Perfect Simple: I have known him for 10 years.",
D:"С for/since нельзя Present Continuous (am working). Нужно have been working.",
E:"Также для недавних действий, которые только что закончились и результат виден сейчас: She has been crying (видно, что плакала).",
F:"Отрицание: haven’t / hasn’t + been + V-ing.",
G:"Вопрос: Have/Has + подлежащее + been + V-ing? Краткие ответы: Yes, I have. / No, she hasn’t.",
H:"Глаголы live и work: Present Perfect Simple и Continuous означают одно и то же (I’ve lived here = I’ve been living here)."};
document.getElementById("rules").innerHTML=Object.values(R).map(r=>"<li>"+r+"</li>").join("");

const EX=[
{t:"tf",title:"1. True or False — по правилу",intro:"Верно ли утверждение? Объяснение — после проверки.",items:[
["He have been working here for two years.",0,"A","Для he нужно has: He has been working."],
["I have been knowing him for ten years.",0,"C","know — глагол состояния, правильно: I have known him."],
["She has been crying — her eyes are red.",1,"E","Виден результат недавнего действия."],
["I am working here for two years.",0,"D","Нужно: I have been working here for two years."],
["«I’ve lived here since 2010» и «I’ve been living here since 2010» значат одно и то же.",1,"H","live — исключение, обе формы допустимы."],
["На вопрос «Has she been working here?» можно ответить «Yes, she has.»",1,"G","Краткий ответ повторяет вспомогательный глагол has."],
["They hasn’t been working here for two years.",0,"F","С they — haven’t: They haven’t been working."],
["Present Perfect Continuous с for/since описывает действие, которое началось в прошлом и продолжается сейчас.",1,"B","Это основное значение с for/since."]]},
{t:"mc",title:"2. Choose the correct answer",intro:"Выберите правильный вариант.",items:[
["She ___ here since 2019.",["has been working","is working","have been working"],0,"A","since + длящееся действие, she → has."],
["I ___ him for ten years.",["have been knowing","have known","am knowing"],1,"C","know — глагол состояния, только Simple."],
["___ you been waiting long?",["Have","Has","Are"],0,"G","Вопрос: Have + you + been + V-ing?"],
["He ___ been studying.",["hasn’t","haven’t","isn’t"],0,"F","he → hasn’t been studying."],
["Your hands are dirty. — I ___ in the garden.",["have been working","am working","work"],0,"E","Действие только что закончилось, виден результат."],
["We ___ here for two years.",["are living","have been living","live"],1,"D","for two years требует Present Perfect, не Present."],
["They ___ working here for a year.",["haven’t been","hasn’t been","aren’t been"],0,"F","they → haven’t been working."],
["I ___ this phone for three years.",["have been having","have had","am having"],1,"C","have (владеть) — глагол состояния, только Simple."]]},
{t:"find",title:"3. Find the mistake",intro:"Нажмите на слово с ошибкой.",items:[
["She *have* been working here since 2020.","has","A","she требует has."],
["I *am* working here for two years.","have been","D","С for нужен Present Perfect Continuous."],
["We have been *knowing* each other for years.","known (без been)","C","know — глагол состояния: We have known each other."],
["He *haven’t* been sleeping well.","hasn’t","F","he → hasn’t."],
["*Has* they been waiting for an hour?","Have","G","they → Have they been waiting?"],
["I’ve been *live* here since 2010.","living","A","После been нужна форма V-ing."],
["It *have* been raining all day.","has","A","it → has been raining."],
["She has *been* wanting a dog for years.","has wanted (без been)","C","want — глагол состояния, только Simple."]]},
{t:"text",title:"4. Fill in the gaps using the correct form",intro:"Впишите нужную форму глагола. Можно сокращения (’ve, hasn’t).",items:[
["I ___ (work) here for two years.","have been working|’ve been working","B","for two years + действие → have been working."],
["She ___ (not / sleep) well lately.","hasn’t been sleeping|has not been sleeping","F","Отрицание: hasn’t been + V-ing."],
["How long ___ (he / learn) English?","has he been learning","G","Вопрос: Has he been learning?"],
["We ___ (live) here since 2015.","have been living|have lived|’ve been living|’ve lived","H","live — допустимы обе формы."],
["He ___ (know) her for ten years.","has known|’s known","C","know — только Present Perfect Simple."],
["Your eyes are red. ___ (you / cry)?","have you been crying","E","Виден результат недавнего действия."],
["They ___ (not / work) here for a year.","haven’t been working|have not been working","F","they → haven’t been working."],
["It ___ (rain) all morning.","has been raining|’s been raining","B","Действие продолжается до сих пор: has been raining."]]},
{t:"text",title:"5. Rephrase / Change the tense or person",intro:"Перепишите предложение по заданию (можно сокращения).",items:[
["Rephrase with «for»: I started working here two years ago.","I have been working here for two years|I’ve been working here for two years","B","Начало в прошлом + продолжается сейчас → for two years."],
["Change the person (I → she): I have been working here.","She has been working here|She’s been working here","A","she требует has."],
["Make it negative: He has been working here.","He hasn’t been working here|He has not been working here","F","has + not → hasn’t."],
["Make it a question: She has been working here.","Has she been working here","G","Has выносим на первое место."],
["Change the person (he → we): He has been studying.","We have been studying|We’ve been studying","A","we → have."],
["Rephrase with «since»: She began living here in 2010.","She has been living here since 2010|She has lived here since 2010","H","live — оба варианта верны."],
["Make it negative: They have been waiting.","They haven’t been waiting|They have not been waiting","F","have + not → haven’t."],
["Give a short positive answer: Have you been working here for two years?","Yes, I have|Yes I have","G","Краткий ответ: Yes, I have."]]},
{t:"build",title:"6. Sentence Builder",intro:"Соберите предложение, нажимая на слова по порядку.",items:[
["She has been working here since 2020.","A","Has been + V-ing, since — начало периода."],
["Have they been waiting for an hour?","G","Вопрос: Have + they + been + V-ing."],
["I haven’t been sleeping well lately.","F","Отрицание: haven’t been + V-ing."],
["He has known her for ten years.","C","know — только Present Perfect Simple."],
["We have been living here since 2010.","H","live допускает Continuous."],
["Why has she been crying?","E","Вопросительное слово + has + she + been + V-ing."],
["It has been raining all day.","E","Действие длилось и виден результат."],
["They have been learning English for two years.","B","for two years + длящееся действие."]]}
];

const OPEN=["I have been … since …","My friend has been … for …","My family and I have been … for …","I haven’t been … lately because …","Have you been … ?","I’m tired because I’ve been …"];
const QUIZ=[
["She ___ here for two years.",["has been working","is working","have been working","works"],0,"since/for + действие, she → has been working."],
["I ___ him for ten years.",["am knowing","have been knowing","have known","know"],2,"know — глагол состояния, только Present Perfect Simple."],
["Короткий ответ на «Has she been working here?»",["Yes, she is.","Yes, she has.","Yes, she does.","Yes, she been."],1,"Повторяем вспомогательный глагол has."],
["He ___ been sleeping well.",["haven’t","hasn’t","isn’t","don’t"],1,"he → hasn’t been sleeping."],
["Her eyes are red. She ___.",["cries","has been crying","have been crying","was cried"],1,"Недавнее действие с видимым результатом."],
["Какое предложение верное?",["I am living here since 2010.","I live here since 2010.","I’ve been living here since 2010.","I’ve been live here since 2010."],2,"С since нужен Present Perfect (Continuous)."],
["Какой глагол НЕ используется в Present Perfect Continuous?",["work","wait","like","rain"],2,"like — глагол состояния."],
["Какая пара значит одно и то же?",["I’ve lived / I’ve been living","I’ve known / I’ve been knowing","I’m working / I’ve been working","I have / I’ve been having"],0,"live и work допускают обе формы."]];
const PRIZE=["100","200","300","500","1 000","2 000","4 000","8 000"];

const norm=s=>s.toLowerCase().replace(/[’`]/g,"'").replace(/haven't/g,"have not").replace(/hasn't/g,"has not").replace(/'ve/g," have").replace(/'s been/g," has been").replace(/[^a-z ]/g," ").replace(/\s+/g," ").trim();
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const $=(h,p)=>{const d=document.createElement("div");d.innerHTML=h;return d.firstElementChild};

const nav=document.getElementById("nav"),view=document.getElementById("view");
const tabs=[...EX.map((e,i)=>["Упр. "+(i+1),()=>exercise(e)]),["Свои идеи",ideas],["Миллионер",quiz]];
tabs.forEach(([n,f],i)=>{const b=document.createElement("button");b.textContent=n;b.onclick=()=>{[...nav.children].forEach(x=>x.classList.remove("on"));b.classList.add("on");view.innerHTML="";f();scrollTo(0,0)};nav.appendChild(b)});
nav.children[0].click();

function exercise(ex){
 view.appendChild($(`<div><h2>${ex.title}</h2><p class="mu">${ex.intro}</p></div>`));
 const bar=$(`<div class="bar"><button class="pri" data-a="chk">Проверить всё</button><button data-a="ans">Показать все ответы</button><button data-a="rst">Сбросить</button><span class="sc"></span></div>`);
 view.appendChild(bar);
 const box=document.createElement("div");view.appendChild(box);
 let units=[];
 const score=()=>{bar.querySelector(".sc").textContent=units.filter(u=>u.ok).length+" / "+units.length};
 function draw(){
  box.innerHTML="";units=[];
  ex.items.forEach((d,i)=>{
   const it=$(`<div class="item"><b>${i+1}.</b> <span class="body"></span><div class="acts"><button class="pri">Проверить</button><button>Ответ</button></div><div class="fb"></div></div>`);
   const body=it.querySelector(".body"),fb=it.querySelector(".fb"),[bc,ba]=it.querySelectorAll("button");
   const u={ok:false,...mk(ex.t,d,body)};
   const expl=()=>`<br><b>Почему:</b> ${R[u.rule]} ${u.note}`;
   u.check=()=>{if(!u.filled()){fb.className="fb info";fb.textContent="Сначала выберите или введите ответ.";return}
    u.ok=u.test();it.className="item "+(u.ok?"ok":"bad");fb.className="fb "+(u.ok?"ok":"no");
    fb.innerHTML=(u.ok?"✅ Верно!":"❌ Неверно.")+(u.ok?"":" Правильный ответ: <b>"+u.ans+"</b>")+expl();score()};
   u.show=()=>{fb.className="fb info";fb.innerHTML="Ответ: <b>"+u.ans+"</b>"+expl()};
   bc.onclick=u.check;ba.onclick=u.show;units.push(u);box.appendChild(it)});
  score()}
 bar.onclick=e=>{const a=e.target.dataset.a;if(a=="chk")units.forEach(u=>u.check());if(a=="ans")units.forEach(u=>u.show());if(a=="rst")draw()};
 draw();
}

function mk(t,d,body){
 const rule=d[d.length-2],note=d[d.length-1];let sel=null;
 const pick=(btns,fn)=>btns.forEach(b=>b.onclick=()=>{btns.forEach(x=>x.classList.remove("sel"));b.classList.add("sel");sel=fn(b)});
 if(t=="tf"){body.innerHTML=`${d[0]}<div class="opts"><button>True</button><button>False</button></div>`;
  const bs=[...body.querySelectorAll("button")];pick(bs,b=>bs.indexOf(b)==0?1:0);
  return{rule,note,filled:()=>sel!==null,test:()=>sel===d[1],ans:d[1]?"True":"False"}}
 if(t=="mc"){body.innerHTML=`${d[0]}<div class="opts">${d[1].map(o=>`<button>${o}</button>`).join("")}</div>`;
  const bs=[...body.querySelectorAll("button")];pick(bs,b=>bs.indexOf(b));
  return{rule,note,filled:()=>sel!==null,test:()=>sel===d[2],ans:d[1][d[2]]}}
 if(t=="find"){const tk=d[0].split(" "),w=tk.findIndex(x=>x.includes("*"));
  body.innerHTML=`<div>${tk.map(x=>`<span class="tk">${x.replace(/\*/g,"")}</span>`).join(" ")}</div>`;
  const bs=[...body.querySelectorAll(".tk")];pick(bs,b=>bs.indexOf(b));
  return{rule,note,filled:()=>sel!==null,test:()=>sel===w,ans:tk[w].replace(/[*]/g,"").replace(/[.,?]$/,"")+" → "+d[1]}}
 if(t=="text"){body.innerHTML=`${d[0]}<input type="text" autocomplete="off" autocapitalize="off" spellcheck="false">`;
  const inp=body.querySelector("input"),al=d[1].split("|").map(norm);
  return{rule,note,filled:()=>inp.value.trim()!=="",test:()=>al.includes(norm(inp.value)),ans:d[1].split("|")[0]}}
 if(t=="build"){const w=d[0].split(" ");let ch=[];
  body.innerHTML=`<div class="area"></div><div class="pool"></div><button class="clr">Очистить</button>`;
  const area=body.querySelector(".area"),pool=body.querySelector(".pool");
  const draw=()=>{area.innerHTML=ch.map(x=>`<span class="tk sel">${x}</span>`).join(" ");
   pool.innerHTML="";const left=order.slice();ch.forEach(x=>left.splice(left.indexOf(x),1));
   left.forEach(x=>{const s=document.createElement("span");s.className="tk";s.textContent=x;s.onclick=()=>{ch.push(x);draw()};pool.appendChild(s)})};
  const order=shuf(w);draw();body.querySelector(".clr").onclick=()=>{ch=[];draw()};
  return{rule,note,filled:()=>ch.length>0,test:()=>ch.join(" ")===d[0],ans:d[0]}}
}

function ideas(){
 view.appendChild($(`<div><h2>Закончите предложения со своими идеями</h2><p class="mu">Допишите начало (замените …). Потом скопируйте всё одной кнопкой и отправьте учителю или вставьте в заметки.</p></div>`));
 const box=document.createElement("div");view.appendChild(box);
 OPEN.forEach((s,i)=>box.appendChild($(`<div class="item"><b>${i+1}.</b> ${s}<textarea rows="2" placeholder="Напишите своё предложение целиком"></textarea></div>`)));
 const bar=$(`<div class="bar"><button class="pri">📋 Скопировать все ответы</button><span class="mu"></span></div>`);view.appendChild(bar);
 bar.querySelector("button").onclick=async()=>{
  const txt="Present Perfect Continuous — мои предложения\n"+[...box.querySelectorAll("textarea")].map((t,i)=>(i+1)+". "+(t.value.trim()||"(пусто)")).join("\n");
  let ok=false;try{await navigator.clipboard.writeText(txt);ok=true}catch(e){}
  if(!ok){try{const t=document.createElement("textarea");t.value=txt;document.body.appendChild(t);t.select();ok=document.execCommand("copy");t.remove()}catch(e){}}
  bar.querySelector("span").textContent=ok?"Скопировано ✅":"Не удалось скопировать — выделите текст вручную"};
}

function quiz(){
 let n=0,fifty=true,locked=false;
 const root=document.createElement("div");view.appendChild(root);
 function draw(){
  locked=false;const q=QUIZ[n];
  root.innerHTML=`<h2>Кто хочет стать миллионером?</h2>
  <div class="ladder">${PRIZE.map((p,i)=>`<span class="${i==n?"cur":i<n?"done":""}">${i+1}: $${p}${i==3?" ★":""}</span>`).join("")}</div>
  <div class="q">Вопрос ${n+1}. ${q[0]}</div>
  <div class="qo">${q[1].map((o,i)=>`<button data-i="${i}"><b>${"ABCD"[i]}.</b> ${o}</button>`).join("")}</div>
  <div class="bar"><button id="f">50:50</button></div><div class="fb"></div>`;
  const f=root.querySelector("#f"),fb=root.querySelector(".fb"),bs=[...root.querySelectorAll(".qo button")];
  f.disabled=!fifty;
  f.onclick=()=>{if(locked)return;fifty=false;f.disabled=true;shuf(bs.map((_,i)=>i).filter(i=>i!=q[2])).slice(0,2).forEach(i=>bs[i].classList.add("h"))};
  bs.forEach(b=>b.onclick=()=>{if(locked)return;locked=true;const i=+b.dataset.i;bs[q[2]].classList.add("c");
   if(i==q[2]){fb.className="fb ok";fb.innerHTML="✅ Верно! "+q[3]+'<div class="acts"><button class="pri" id="nx">'+(n==QUIZ.length-1?"Завершить":"Дальше")+"</button></div>";
    root.querySelector("#nx").onclick=()=>{n++;n==QUIZ.length?end(true):draw()}}
   else{b.classList.add("w");const safe=n>=4?"$500":"$0";fb.className="fb no";fb.innerHTML="❌ Неверно. "+q[3]+"<br>Ваш выигрыш: <b>"+safe+"</b>"+'<div class="acts"><button class="pri" id="rs">Играть снова</button></div>';
    root.querySelector("#rs").onclick=()=>{n=0;fifty=true;draw()}}})}
 function end(){root.innerHTML=`<h2>🏆 Вы выиграли $${PRIZE[7]}!</h2><p>Вы прошли все вопросы — Present Perfect Continuous у вас в кармане.</p><button class="pri" id="rs">Играть снова</button>`;root.querySelector("#rs").onclick=()=>{n=0;fifty=true;draw()}}
 draw();
}
</script></body></html>
