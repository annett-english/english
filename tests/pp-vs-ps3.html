<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Present Perfect vs Past Simple · B1</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1d2330;--mut:#667;--bd:#dde1ec;--ac:#3b5bdb;--ok:#2b8a3e;--okb:#e6f6ea;--bad:#c92a2a;--badb:#fdecec;--hint:#fff6db;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161c;--card:#1d2029;--tx:#e8eaf0;--mut:#9aa;--bd:#333847;--ac:#7c93f5;--ok:#69db7c;--okb:#17301f;--bad:#ff8787;--badb:#3a1c1c;--hint:#3a3317}}
:root[data-theme="dark"]{--bg:#14161c;--card:#1d2029;--tx:#e8eaf0;--mut:#9aa;--bd:#333847;--ac:#7c93f5;--ok:#69db7c;--okb:#17301f;--bad:#ff8787;--badb:#3a1c1c;--hint:#3a3317}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:820px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:.3em 0}h2{font-size:1.15rem;margin:0 0 4px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:14px 0}
.rules{display:grid;gap:8px}.rule{font-size:.93rem}.rule b{color:var(--ac)}.rule i{color:var(--mut)}
.instr{color:var(--mut);margin:0 0 10px;font-size:.93rem}
ol{padding-left:22px;margin:0}li{margin:0 0 14px;padding:8px 10px;border-radius:10px;border:1px solid transparent}
li.ok{background:var(--okb);border-color:var(--ok)}li.bad{background:var(--badb);border-color:var(--bad)}
.q{margin-bottom:6px}.q small{color:var(--mut)}
input[type=text],textarea,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:6px 9px;max-width:100%}
input[type=text]{width:100%;min-width:140px}textarea{width:100%;min-height:54px;resize:vertical}
.inl{width:180px!important;min-width:120px;display:inline-block}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.chip{border:1px solid var(--bd);border-radius:999px;padding:4px 12px;cursor:pointer;background:var(--bg)}
.chip:has(input:checked){border-color:var(--ac);background:var(--ac);color:#fff}.chip input{display:none}
select{width:100%}
.fb{font-size:.9rem;margin-top:6px;display:none;white-space:pre-line}.fb.on{display:block}
.fb .k{font-weight:700;color:var(--ok)}
.hint{background:var(--hint);border-radius:8px;padding:4px 8px;font-size:.85rem}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
button{font:inherit;cursor:pointer;border-radius:9px;border:1px solid var(--ac);background:var(--ac);color:#fff;padding:7px 14px}
button.s{background:transparent;color:var(--ac)}
.score{font-weight:700;margin-left:auto}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;flex-wrap:wrap;gap:8px;padding:8px 0;background:var(--bg)}
</style></head><body><main>
<h1>📘 Present Perfect vs Past Simple · B1</h1>
<div class="card"><h2>Правила</h2><div class="rules" id="rules"></div></div>
<div class="top">
<button onclick="checkAll()">✅ Проверить всё</button>
<button class="s" onclick="copyAll(false)">📋 Копировать мои ответы</button>
<button class="s" onclick="copyAll(true)">🔑 Копировать ключи</button>
<span id="msg" class="instr" style="align-self:center;margin:0"></span></div>
<div id="root"></div>
</main>
<script>
const R={1:["Жизненный опыт","Present Perfect","I've been to Japan."],2:["Законченное действие, время названо или понятно","Past Simple","We saw it last night."],3:["Недавнее действие с результатом сейчас","Present Perfect","She has broken her leg (она в гипсе)."],4:["Already / yet","Present Perfect","I've already done it."],5:["Точное время (2 years ago)","Past Simple","He left school two years ago."]};
const E=[
{t:"1. Choose the correct answer + выберите правило",i:"Выберите правильную форму, затем объяснение (номер правила).",y:"c",items:[
{q:"I ___ to Japan twice.",o:["have been","went"],a:0,r:1,e:"Опыт жизни, время не указано → Present Perfect."},
{q:"We ___ the film last night.",o:["have seen","saw"],a:1,r:2,e:"Время названо (last night) → Past Simple."},
{q:"Look! She ___ her leg.",o:["broke","has broken"],a:1,r:3,e:"Действие недавнее, результат виден сейчас → Present Perfect."},
{q:"I ___ this film yet. Is it good?",o:["haven't seen","didn't see"],a:0,r:4,e:"Yet в вопросе/отрицании → Present Perfect."},
{q:"He ___ school two years ago.",o:["has left","left"],a:1,r:5,e:"Ago — точное время в прошлом → Past Simple."},
{q:"___ you ever ___ sushi?",o:["Did … eat","Have … eaten"],a:1,r:1,e:"Ever — вопрос об опыте жизни → Present Perfect."},
{q:"My keys are gone. I ___ them.",o:["have lost","lost"],a:0,r:3,e:"Ключей нет сейчас — результат в настоящем → Present Perfect."},
{q:"A: How was the party? B: Great! We ___ a lot.",o:["have danced","danced"],a:1,r:2,e:"Речь о конкретной вечеринке (время понятно из контекста) → Past Simple."}]},
{t:"2. Find the mistake",i:"В каждом предложении есть ошибка. Перепишите предложение правильно.",y:"t",items:[
{q:"I have seen that film last week.",a:["I saw that film last week"],r:5,e:"Last week — точное время → Past Simple: saw."},
{q:"Did you ever try Thai food?",a:["Have you ever tried Thai food"],r:1,e:"Ever + опыт жизни → Have you ever tried…?"},
{q:"She has gone to Spain in 2018.",a:["She went to Spain in 2018"],r:2,e:"In 2018 — время названо → Past Simple."},
{q:"I didn't finish my report yet.",a:["I have not finished my report yet"],r:4,e:"Yet → Present Perfect: haven't finished."},
{q:"Look! He fell off his bike.",a:["Look He has fallen off his bike"],r:3,e:"Look! — результат виден сейчас → Present Perfect."},
{q:"We have met two years ago.",a:["We met two years ago"],r:5,e:"Ago → всегда Past Simple."},
{q:"Has she already left yesterday?",a:["Did she leave yesterday","Did she already leave yesterday"],r:5,e:"Yesterday → Past Simple, поэтому Did she leave…?"}]},
{t:"3. Fill in the gaps using the correct form",i:"Поставьте глагол в скобках в нужную форму (Present Perfect или Past Simple).",y:"t",items:[
{q:"I ___ (never / be) to Canada.",a:["have never been"],r:1,e:"Never + опыт → have never been."},
{q:"She ___ (buy) a new car last month.",a:["bought"],r:2,e:"Last month → Past Simple."},
{q:"Have you ___ (finish) the project yet?",a:["finished"],r:4,e:"Yet → Present Perfect, нужна V3: finished."},
{q:"My brother ___ (break) his arm, so he can't play.",a:["has broken"],r:3,e:"Результат сейчас: он не может играть → has broken."},
{q:"We ___ (move) to Kraków in 2020.",a:["moved"],r:2,e:"In 2020 — время названо → moved."},
{q:"They ___ (already / see) this film.",a:["have already seen"],r:4,e:"Already → have already seen."},
{q:"I ___ (visit) my grandma two days ago.",a:["visited"],r:5,e:"Ago → visited."},
{q:"He ___ (just / come) back from work.",a:["has just come"],r:3,e:"Только что, результат сейчас (он дома) → has just come."}]},
{t:"4. Translate",i:"Переведите на английский.",y:"t",items:[
{q:"Я никогда не был в Италии.",a:["I have never been to Italy","I have never been in Italy"],r:1,e:"Опыт жизни → have never been."},
{q:"Мы познакомились два года назад.",a:["We met two years ago"],r:5,e:"Назад = ago → Past Simple."},
{q:"Она уже сделала домашнее задание.",a:["She has already done her homework","She has done her homework already"],r:4,e:"Already → Present Perfect."},
{q:"Ты когда-нибудь пробовал суши?",a:["Have you ever tried sushi","Have you ever eaten sushi","Have you ever had sushi"],r:1,e:"Когда-нибудь = ever → Present Perfect."},
{q:"Я потерял свою сумку.",a:["I have lost my bag"],r:3,e:"Сумки нет сейчас → have lost."},
{q:"Они ещё не приехали.",a:["They have not arrived yet","They have not come yet"],r:4,e:"Ещё не = not … yet → Present Perfect."},
{q:"Мы смотрели этот фильм вчера.",a:["We watched this film yesterday","We watched this movie yesterday","We saw this film yesterday","We saw this movie yesterday"],r:2,e:"Вчера → Past Simple."}]},
{t:"5. Change the tense / person",i:"Измените предложение по инструкции.",y:"t",items:[
{q:"I have visited Paris. → Add: in 2019.",a:["I visited Paris in 2019"],r:2,e:"С указанием времени → Past Simple."},
{q:"He cleaned his room yesterday. → Present Perfect with already.",a:["He has already cleaned his room"],r:4,e:"Убираем yesterday, добавляем already → has already cleaned."},
{q:"I have seen this film. → Change to she.",a:["She has seen this film"],r:1,e:"С she: has + V3."},
{q:"You have tried sushi. → Make a question with ever.",a:["Have you ever tried sushi"],r:1,e:"Have + you + ever + V3."},
{q:"We saw him two days ago. → Make it negative.",a:["We did not see him two days ago"],r:5,e:"Past Simple отрицание: did not + V1."},
{q:"She has finished her work. → Negative with yet.",a:["She has not finished her work yet"],r:4,e:"has not + V3 + yet."},
{q:"I have lost my bag. → Change to they.",a:["They have lost their bag"],r:3,e:"They have + их (their) вместо my."}]},
{t:"6. Complete the sentences (со своими идеями)",i:"Закончите предложения как хотите. Ответы не проверяются — их можно скопировать кнопкой вверху.",y:"f",items:[
{q:"I have never …",r:1,s:"I have never skied."},
{q:"Last weekend I …",r:2,s:"Last weekend I visited my aunt."},
{q:"I have already … but I haven't … yet.",r:4,s:"I have already cooked dinner but I haven't washed up yet."},
{q:"Two years ago I …",r:5,s:"Two years ago I started learning English."},
{q:"Look! My friend has just …",r:3,s:"Look! My friend has just won a prize."},
{q:"Have you ever …? (вопрос + ваш ответ)",r:1,s:"Have you ever been to Rome? Yes, I have."},
{q:"In 2020 we …",r:2,s:"In 2020 we moved to a new flat."}]}];
const $=id=>document.getElementById(id);
$('rules').innerHTML=Object.entries(R).map(([k,v])=>`<div class="rule"><b>${k}. ${v[0]}</b> — ${v[1]}<br><i>${v[2]}</i></div>`).join('');
const norm=s=>s.toLowerCase().replace(/[’`]/g,"'").replace(/n't/g," not").replace(/'ve/g," have").replace(/[.!?,]/g,"").replace(/\s+/g," ").trim();
function build(){$('root').innerHTML=E.map((x,ei)=>`<div class="card"><h2>${x.t}</h2><p class="instr">${x.i}</p><ol>${x.items.map((it,ii)=>{const id=ei+'_'+ii;let b='';
if(x.y=='c')b=`<div class="q">${it.q.replace('___','<b>___</b>')}</div><div class="opts">${it.o.map((o,k)=>`<label class="chip"><input type="radio" name="r${id}" value="${k}">${o}</label>`).join('')}</div><select id="s${id}"><option value="">Выберите правило…</option>${Object.entries(R).map(([k,v])=>`<option value="${k}">${k}. ${v[0]} (${v[1]})</option>`).join('')}</select>`;
else if(x.y=='t'){const inl=it.q.includes('___');b=inl?`<div class="q">${it.q.replace('___',`<input type="text" class="inl" id="i${id}" autocomplete="off">`)}</div>`:`<div class="q">${it.q}</div><input type="text" id="i${id}" autocomplete="off">`}
else b=`<div class="q">${it.q} <span class="hint">правило ${it.r}: ${R[it.r][0]}</span></div><textarea id="i${id}" placeholder="Ваш вариант…"></textarea>`;
return `<li id="l${id}">${b}<div class="fb" id="f${id}"></div></li>`}).join('')}</ol><div class="bar">${x.y!='f'?`<button onclick="check(${ei})">Проверить</button>`:''}<button class="s" onclick="show(${ei})">Показать ответы</button><span class="score" id="sc${ei}"></span></div></div>`).join('')}
function mine(ei,ii){const x=E[ei],it=x.items[ii],id=ei+'_'+ii;
if(x.y=='c'){const r=document.querySelector(`input[name=r${id}]:checked`),s=$('s'+id).value;return{v:r?it.o[r.value]:'',k:r?+r.value:-1,s}}
return{v:$('i'+id).value.trim()}}
function check(ei){const x=E[ei];let ok=0;x.items.forEach((it,ii)=>{const id=ei+'_'+ii,m=mine(ei,ii),li=$('l'+id),fb=$('f'+id);let good;
if(x.y=='c')good=m.k==it.a&&m.s==it.r;else good=it.a.some(a=>norm(a)==norm(m.v));
if(good)ok++;li.className=good?'ok':'bad';fb.className='fb on';
fb.textContent=good?'✅ Верно! '+it.e:(x.y=='c'&&(m.k<0||!m.s)?'Выберите и форму, и правило.':'❌ Попробуйте ещё раз или нажмите «Показать ответы».')});
$('sc'+ei).textContent=`${ok} / ${x.items.length}`}
function key(ei,ii){const x=E[ei],it=x.items[ii];if(x.y=='c')return`${it.o[it.a]} | правило ${it.r}: ${R[it.r][0]}`;if(x.y=='t')return it.a[0]+(it.a.length>1?' (или: '+it.a.slice(1).join(' / ')+')':'');return it.s}
function show(ei){const x=E[ei];x.items.forEach((it,ii)=>{const fb=$('f'+ei+'_'+ii);fb.className='fb on';
fb.innerHTML=`<span class="k">${x.y=='f'?'Пример':'Ответ'}:</span> ${key(ei,ii)}`+(it.e?`<br>💡 ${it.e}`:`<br>💡 Подсказка: используйте ${R[it.r][1]} (${R[it.r][0].toLowerCase()}).`)})}
function checkAll(){E.forEach((x,i)=>x.y!='f'&&check(i));say('Проверено ✅')}
function say(t){$('msg').textContent=t;setTimeout(()=>$('msg').textContent='',2500)}
function copyAll(keys){let o=keys?'Ключи: Present Perfect vs Past Simple (B1)\n':'Мои ответы: Present Perfect vs Past Simple (B1)\n';
E.forEach((x,ei)=>{o+=`\n${x.t}\n`;x.items.forEach((it,ii)=>{let a;if(keys)a=key(ei,ii)+(it.e?' — '+it.e:'');else{const m=mine(ei,ii);a=(m.v||'—')+(x.y=='c'&&m.s?` | правило ${m.s}`:'')}
o+=`${ii+1}. ${it.q} → ${a}\n`})});
const ta=document.createElement('textarea');ta.value=o;document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}ta.remove();
if(!ok&&navigator.clipboard)navigator.clipboard.writeText(o).then(()=>say('Скопировано 📋'),()=>say('Не удалось скопировать'));else say(ok?'Скопировано 📋':'Не удалось скопировать')}
build();
</script></body></html>
