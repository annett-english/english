<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gerund & Infinitive — упражнения</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7fb;--card:#fff;--tx:#1d2330;--mu:#5d6678;--ac:#3b5bdb;--ok:#2b8a3e;--okb:#e6f6ea;--er:#c92a2a;--erb:#fdecec;--bd:#dfe3ec}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141a;--card:#1b1e27;--tx:#e8eaf0;--mu:#9aa3b5;--ac:#7c95ff;--ok:#69db7c;--okb:#16301d;--er:#ff8787;--erb:#3a1c1c;--bd:#2c313e}}
:root[data-theme="dark"]{--bg:#12141a;--card:#1b1e27;--tx:#e8eaf0;--mu:#9aa3b5;--ac:#7c95ff;--ok:#69db7c;--okb:#16301d;--er:#ff8787;--erb:#3a1c1c;--bd:#2c313e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:820px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:8px 0}
.sub{color:var(--mu);margin:0 0 16px}
.ex{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:16px 0}
.ex h2{font-size:1.15rem;margin:0 0 4px}
.hint{color:var(--mu);margin:0 0 10px;font-size:.92rem}
ol{padding-left:0;list-style:none;margin:0}
li{padding:10px 0;border-top:1px solid var(--bd)}
li .n{display:inline-block;width:1.8em;color:var(--mu);font-weight:600}
input[type=text],select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:5px 8px;margin:2px 4px;min-width:110px;max-width:100%}
input.w{width:100%;box-sizing:border-box;margin:6px 0 0}
li.ok{background:var(--okb)}li.bad{background:var(--erb)}
li.ok input,li.ok select{border-color:var(--ok)}li.bad input,li.bad select{border-color:var(--er)}
.ans{display:none;margin:6px 0 0 1.8em;font-size:.93rem}
.ans b{color:var(--ok)}
li.bad .ans b{color:var(--er)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
button{font:inherit;border:1px solid var(--ac);background:var(--ac);color:#fff;border-radius:8px;padding:7px 14px;cursor:pointer}
button.s{background:transparent;color:var(--ac)}
.sc{margin-left:auto;font-weight:600}
</style></head><body><main>
<h1>Gerund & Infinitive</h1>
<p class="sub">5 упражнений: сначала 26 пунктов на правило, затем по 10 пунктов. Пиши ответы руками, нажимай «Check», а если застрял — «Show answers» (там объяснение).</p>
<div id="root"></div>
</main>
<script>
const RULES=["Gerund: после предлога", "Gerund: в роли подлежащего", "Gerund: после глаголов (enjoy, avoid, finish, keep, suggest…)", "Not + V-ing: отрицание с gerund", "To-infinitive: после прилагательных", "To-infinitive: цель (чтобы)", "To-infinitive: после глаголов (want, need, decide, hope, agree…)", "Not to + Verb: отрицание с инфинитивом", "Verb + человек + to + Verb (ask, tell, want, would like)", "Инфинитив без to: после модальных глаголов", "Инфинитив без to: после make / let + человек", "start / begin / continue: обе формы, значение то же", "like / love / hate: обе формы", "try / remember: значение меняется"];
const RI=[["I'm interested in learning English.", 0, "После предлога (in) всегда gerund."], ["Reading is relaxing.", 1, "Действие в роли подлежащего — gerund."], ["She admitted not telling the truth.", 3, "admit + gerund; отрицание — not + V-ing."], ["It's easy to learn.", 4, "После прилагательного (easy) — to-infinitive."], ["I study to pass the exam.", 5, "to + Verb отвечает на вопрос «зачем?» (цель)."], ["He decided not to go.", 7, "decide + to-infinitive; отрицание — not to + Verb."], ["She told me to wait.", 8, "tell + человек + to + Verb."], ["You must study.", 9, "После модального глагола must — инфинитив без to."], ["My parents let me stay.", 10, "let + человек + инфинитив без to."], ["It started to rain.", 11, "start допускает to-infinitive и gerund (started raining) — значение одинаковое."], ["I like reading.", 12, "like / love / hate: можно I like reading и I like to read."], ["Try using this app.", 13, "try doing = попробовать ради эксперимента. (try to do = постараться.)"], ["I enjoy swimming.", 2, "enjoy — глагол, после которого нужен gerund."], ["I want to buy a new phone.", 6, "want + to-infinitive."], ["She made me laugh.", 10, "make + человек + инфинитив без to."], ["Thanks for helping me.", 0, "После предлога (for) — gerund."], ["Learning languages is fun.", 1, "Gerund как подлежащее."], ["They agreed to help us.", 6, "agree + to-infinitive."], ["It's important to sleep well.", 4, "После прилагательного (important) — to-infinitive."], ["I want you to help me.", 8, "want + человек + to + Verb."], ["We might go out tonight.", 9, "После модального глагола might — инфинитив без to."], ["He avoided answering the question.", 2, "avoid — глагол, после которого нужен gerund."], ["She began working at nine.", 11, "begin допускает обе формы (began to work / working), значение одинаковое."], ["I remember meeting her.", 13, "remember doing = помнить, что делал. (remember to do = не забыть сделать.)"], ["I hate getting up early.", 12, "hate: можно gerund и to-infinitive (hate to get up)."], ["Remember to call me.", 13, "remember to do = не забыть сделать. (remember doing = помнить, что делал.)"]];
const EX=[
{k:'c',t:'1. Choose the rule',h:'Почему в предложении именно такая форма? Выбери правило из списка.',it:RI.map(r=>[r[0],RULES,r[1],r[2]])},
{k:'c',t:'2. Choose the correct answer',h:'Выбери правильную форму. В объяснении — правило.',it:[
["I'm interested in ___ English.",["learn","learning","to learn"],1,"После предлога всегда gerund (V-ing): interested in learning."],
["She made me ___.",["to laugh","laugh","laughing"],1,"make / let + человек + инфинитив без to."],
["He decided ___ abroad.",["to study","studying","study"],0,"После decide используется to-infinitive."],
["I enjoy ___ to music.",["listen","to listen","listening"],2,"После enjoy — gerund."],
["It's easy ___ this rule.",["remembering","to remember","remember"],1,"После прилагательных (easy, difficult, important) — to-infinitive."],
["You should ___ more.",["to sleep","sleep","sleeping"],1,"После модальных глаголов (should, must, can…) — инфинитив без to."],
["___ is good for your health.",["Swim","Swimming","Swims"],1,"В роли подлежащего используем gerund."],
["She told me ___.",["wait","waiting","to wait"],2,"tell + человек + to + Verb."],
["Remember ___ the door when you leave.",["locking","to lock","lock"],1,"remember to do = не забыть сделать. (remember doing = помнить, что делал.)"],
["I stopped ___ sweets last year.",["eating","to eat","eat"],0,"После stop — gerund: перестал есть. (stop to eat = остановился, чтобы поесть.)"]]},
{k:'t',t:'3. Find the mistake',h:'В каждом предложении одна ошибка. Перепиши предложение правильно.',it:[
["I'm good at to cook.",["I'm good at cooking."],"После предлога (at) нужен gerund: cooking."],
["My parents let me to stay out late.",["My parents let me stay out late."],"После let + человек — инфинитив без to."],
["She avoided to answer the question.",["She avoided answering the question."],"avoid + gerund."],
["He can to swim very well.",["He can swim very well."],"После модального глагола can — инфинитив без to."],
["I want that you help me.",["I want you to help me."],"want + человек + to + Verb."],
["We planned going to Spain.",["We planned to go to Spain."],"plan + to-infinitive."],
["She admitted not to tell the truth.",["She admitted not telling the truth."],"admit + gerund; отрицание: not + V-ing."],
["He decided don't go.",["He decided not to go."],"decide + to-infinitive; отрицание: not to + Verb."],
["They made him to apologise.",["They made him apologise.","They made him apologize."],"make + человек + инфинитив без to."],
["Thank you for to help me.",["Thank you for helping me."],"После предлога (for) — gerund."]]},
{k:'t',t:'4. Fill in the gaps using the correct form',h:'Поставь глагол в скобках в нужную форму (gerund, to-infinitive или без to).',it:[
["I don't mind ___ (wait) for you.",["waiting"],"don't mind + gerund."],
["She hopes ___ (get) the job.",["to get"],"hope + to-infinitive."],
["You must ___ (finish) it today.",["finish"],"После модального глагола must — инфинитив без to."],
["He kept ___ (talk) all night.",["talking"],"keep + gerund."],
["They agreed ___ (help) us.",["to help"],"agree + to-infinitive."],
["Would you like ___ (come) with us?",["to come"],"would like + to-infinitive."],
["I'm afraid of ___ (fly).",["flying"],"После предлога (of) — gerund."],
["She told me ___ (not / worry).",["not to worry"],"tell + человек + to + Verb; отрицание: not to + Verb."],
["It started ___ (rain).",["raining","to rain"],"start / begin / continue допускают обе формы без разницы в значении."],
["We spent the whole day ___ (clean) the house.",["cleaning"],"spend time + gerund."]]},
{k:'t',t:'5. Rephrase',h:'Перепиши предложение, используя слово в скобках. Смысл должен остаться тем же.',it:[
["I study because I want to pass the exam. (purpose: to…)",["I study to pass the exam."],"Цель выражаем to-infinitive."],
["\"Wait here,\" she said to me. (told)",["She told me to wait here."],"tell + человек + to + Verb."],
["Swimming is easy. (It's easy…)",["It's easy to swim.","It is easy to swim."],"После прилагательного — to-infinitive."],
["\"Help me,\" he said to her. (asked)",["He asked her to help him."],"ask + человек + to + Verb; местоимения меняются: me → him."],
["I won't go to the party. That's my decision. (decided)",["I decided not to go to the party."],"decide + not to + Verb."],
["I like it when I cook. (like)",["I like cooking.","I like to cook."],"like / love / hate допускают gerund и to-infinitive."],
["My mother allowed me to go out. (let)",["My mother let me go out."],"let + человек + инфинитив без to."],
["She forced me to laugh. (made)",["She made me laugh."],"make + человек + инфинитив без to."],
["\"I didn't tell the truth,\" he said. (admitted)",["He admitted not telling the truth."],"admit + gerund; отрицание: not + V-ing."],
["Don't forget to call me. (Remember…)",["Remember to call me."],"remember to do = не забыть сделать."]]}
];
const norm=s=>s.toLowerCase().replace(/[’‘]/g,"'").replace(/[.,!?;:"]/g,'').replace(/\s+/g,' ').trim();
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
const root=document.getElementById('root');
EX.forEach((ex,i)=>{
 const d=document.createElement('section');d.className='ex';
 let h=`<h2>${ex.t}</h2><p class="hint">${ex.h}</p><ol>`;
 ex.it.forEach((x,j)=>{
  const id=`e${i}_${j}`;let body='';
  if(ex.k==='c'){const sel=`<select id="${id}"><option value="">…</option>${x[1].map((o,n)=>`<option value="${n}">${o}</option>`).join('')}</select>`;body=x[0].includes('___')?esc(x[0]).replace('___',sel):'<b>'+esc(x[0])+'</b><br>'+sel;}
  else if(ex.k==='t'){const inp=`<input type="text" id="${id}" autocomplete="off" autocapitalize="off" spellcheck="false">`;
   body=x[0].includes('___')?esc(x[0]).replace('___',inp):esc(x[0])+`<input type="text" class="w" id="${id}" placeholder="Write the correct sentence" autocomplete="off" spellcheck="false">`;}
  h+=`<li id="li${id}"><span class="n">${j+1}.</span>${body}<div class="ans" id="a${id}"></div></li>`;
 });
 h+=`</ol><div class="bar">`;
 h+=`<button onclick="check(${i})">Check</button><button class="s" onclick="show(${i})">Show answers</button><button class="s" onclick="reset(${i})">Reset</button><span class="sc" id="sc${i}"></span>`;
 d.innerHTML=h+`</div>`;root.appendChild(d);
});
function ansText(ex,x){return ex.k==='c'?x[1][x[2]]:x[1][0];}
function expl(ex,x){return ex.k==='c'?x[3]:x[2];}
function isOk(ex,x,v){if(ex.k==='c')return v!==''&&+v===x[2];return x[1].some(a=>norm(a)===norm(v));}
function mark(i,j,ok,txt,ex,x,showAns){
 const li=document.getElementById(`lie${i}_${j}`),a=document.getElementById(`ae${i}_${j}`);
 li.className=ok?'ok':'bad';a.style.display='block';
 const alt=ex.k==='c'?'':(x[1].length>1?' ('+x[1].join(' / ')+')':'');
 a.innerHTML=(ok?'✅ ':'❌ ')+(ok&&!showAns?'':`<b>${esc(ansText(ex,x))}${alt}</b> — `)+esc(expl(ex,x));
}
function check(i){const ex=EX[i];let n=0;
 ex.it.forEach((x,j)=>{const v=document.getElementById(`e${i}_${j}`).value;const ok=isOk(ex,x,v);if(ok)n++;mark(i,j,ok,v,ex,x,false);});
 document.getElementById('sc'+i).textContent=`Score: ${n}/${ex.it.length}`;}
function show(i){const ex=EX[i];
 ex.it.forEach((x,j)=>{const el=document.getElementById(`e${i}_${j}`);
  el.value=ex.k==='c'?x[2]:x[1][0];mark(i,j,true,'',ex,x,true);});
 document.getElementById('sc'+i).textContent='Answers shown';}
function reset(i){const ex=EX[i];
 ex.it.forEach((x,j)=>{document.getElementById(`e${i}_${j}`).value='';
  document.getElementById(`lie${i}_${j}`).className='';
  const a=document.getElementById(`ae${i}_${j}`);if(a){a.style.display='none';a.innerHTML='';}});
 const s=document.getElementById('sc'+i);if(s)s.textContent='';}
</script></body></html>
