<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Present Simple vs Present Continuous</title>
<style>
:root{--bg:#f7f8fb;--card:#fff;--accent:#4f6bed;--ok:#1e9e5a;--bad:#e0473c;--text:#232633;--muted:#6b7280;--border:#e3e6ec;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#15171f;--card:#1e212b;--text:#eceef3;--muted:#9aa0ac;--border:#2c303c;}}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
.wrap{max-width:760px;margin:0 auto;padding:24px 16px 60px;}
h1{font-size:1.5rem;margin-bottom:4px;}
.sub{color:var(--muted);margin-bottom:24px;font-size:.95rem;}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:26px;}
.card h2{font-size:1.1rem;margin:0 0 4px;}
.card .desc{color:var(--muted);font-size:.85rem;margin-bottom:14px;}
.item{padding:12px 0;border-top:1px solid var(--border);}
.item:first-of-type{border-top:none;}
.item p{margin:0 0 8px;font-weight:500;}
.opts label{display:block;padding:6px 10px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px;cursor:pointer;font-weight:400;}
.opts label:hover{background:rgba(79,107,237,.08);}
input[type=text]{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:.95rem;}
select{padding:6px 8px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);}
textarea{width:100%;min-height:50px;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-family:inherit;font-size:.95rem;}
.word-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-top:1px solid var(--border);}
.word-row:first-of-type{border-top:none;}
.res{margin-top:6px;font-size:.88rem;padding:8px 10px;border-radius:8px;display:none;}
.res.show{display:block;}
.res.ok{background:rgba(30,158,90,.12);color:var(--ok);}
.res.bad{background:rgba(224,71,60,.12);color:var(--bad);}
.res b{display:block;margin-bottom:2px;}
.btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
button{background:var(--accent);color:#fff;border:none;padding:9px 16px;border-radius:8px;font-size:.9rem;cursor:pointer;}
button.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent);}
.score{font-weight:600;margin-left:auto;font-size:.9rem;}
</style>
</head>
<body>
<div class="wrap">
<h1>Present Simple vs Present Continuous</h1>
<div class="sub">6 упражнений • проверка ответов и объяснения к каждому пункту</div>
<div id="app"></div>
</div>
<script>
function norm(s){return s.toLowerCase().replace(/[.,!?;:']/g,'').replace(/\s+/g,' ').trim();}
function matches(val,answers){val=norm(val);return answers.some(a=>norm(a)===val);}

const ex1=[
["She usually ___ (walk) to school.",["walk","walks","is walking"],1,"usually — маркер Present Simple; подлежащее «she» (3-е лицо ед.ч.) → walks."],
["Look! It ___ (rain) outside.",["rains","is raining","rain"],1,"Look! указывает на действие прямо сейчас → Present Continuous: is raining."],
["I ___ (not/like) coffee.",["am not liking","doesn't like","don't like"],2,"like — глагол состояния (state verb), не используется в Continuous; 1 лицо → don't like."],
["They ___ (watch) a movie right now.",["watch","watches","are watching"],2,"right now — маркер момента речи → Present Continuous: are watching."],
["He ___ (play) football every Sunday.",["play","plays","is playing"],1,"every Sunday — регулярность → Present Simple; 3-е лицо ед.ч. → plays."],
["We ___ (study) for exams this week.",["study","studies","are studying"],2,"this week — временное действие вокруг настоящего момента → Present Continuous."],
["Water ___ (boil) at 100 degrees.",["boils","is boiling","boil"],0,"Общеизвестный факт → Present Simple; 3-е лицо ед.ч. (water) → boils."],
["Listen! Somebody ___ (knock) at the door.",["knocks","is knocking","knock"],1,"Listen! = действие происходит сейчас → is knocking."]
];

const ex2words=["always","rarely","hardly ever","never","right now","sometimes","this Monday","this month","every day","three times a week","now","these days","at the moment","on Sundays"];
const ex2simple=new Set(["always","rarely","hardly ever","never","sometimes","every day","three times a week","on Sundays"]);

const ex3=[
["She is knowing the answer.",["She knows the answer."],"know — глагол состояния, не употребляется в Continuous."],
["I am not liking spicy food.",["I don't like spicy food."],"like — state verb → don't like."],
["He watch TV every evening.",["He watches TV every evening."],"3-е лицо ед.ч. требует -s: watches."],
["Look! The children plays in the garden.",["Look! The children are playing in the garden."],"Look! + подлежащее во мн.ч. → are playing."],
["They doesn't work on Saturdays.",["They don't work on Saturdays."],"they — множественное число → don't, а не doesn't."],
["She is having a car.",["She has a car."],"have (иметь, обладать) — состояние, не используется в Continuous → has."],
["We are usually go to the gym after work.",["We usually go to the gym after work."],"нельзя сочетать are + go; usually указывает на Present Simple."],
["Right now, he cooks dinner.",["Right now, he is cooking dinner."],"right now требует Present Continuous: is cooking."]
];

const ex4=[
["she / not / usually / drink / tea",["She doesn't usually drink tea."]],
["they / play / football / at the moment",["They are playing football at the moment."]],
["he / go / to school / every day",["He goes to school every day."]],
["I / read / a book / right now",["I am reading a book right now.","I'm reading a book right now."]],
["we / never / eat / fast food",["We never eat fast food."]],
["it / rain / now",["It is raining now.","It's raining now."]],
["my sister / study / French / this year",["My sister is studying French this year."]],
["the sun / rise / in the east",["The sun rises in the east."]]
];

const ex5=[
["My brother ___ (not/drive) to work; he takes the bus.",["doesn't drive"],"регулярное действие + отрицание, 3 л. ед.ч. → doesn't drive."],
["___ you ___ (listen) to me right now?",["are you listening"],"right now → вопрос в Present Continuous."],
["She ___ (not/watch) TV at the moment; she's cooking.",["isn't watching","is not watching"],"at the moment → Continuous, отрицание при she → isn't watching."],
["___ your father ___ (work) on Saturdays?",["does your father work"],"регулярность (on Saturdays) → вопрос в Present Simple."],
["Look! The baby ___ (sleep) peacefully.",["is sleeping"],"Look! → действие сейчас → is sleeping."],
["We ___ (not/have) classes on Sundays.",["don't have"],"on Sundays — регулярность, we → don't have."],
["He ___ (always/complain) about his job these days.",["is always complaining"],"always + Continuous — особая конструкция для выражения раздражения повторяющимся поведением."],
["The children ___ (play) in the park every afternoon.",["play"],"every afternoon — регулярность, мн.ч. → play (без -s)."]
];

const ex6=[
["She works in a bank.","(?)",["Does she work in a bank?"],"Present Simple, вопрос: Does + подлежащее + основа глагола."],
["They are having lunch now.","(-)",["They aren't having lunch now.","They are not having lunch now."],"Present Continuous, отрицание: aren't + -ing."],
["He doesn't like tea.","(+)",["He likes tea."],"3-е лицо ед.ч. в утверждении → likes."],
["You are watching TV now.","(?)",["Are you watching TV now?"],"Present Continuous, вопрос: Are + you + -ing."],
["We play tennis on Sundays.","(-)",["We don't play tennis on Sundays."],"Present Simple, отрицание: don't + основа глагола."],
["It is raining outside.","(?)",["Is it raining outside?"],"Present Continuous, вопрос: Is + it + -ing."],
["My parents are cooking dinner.","(-)",["My parents aren't cooking dinner.","My parents are not cooking dinner."],"мн.ч. → aren't + -ing."],
["He studies French.","(?)",["Does he study French?"],"3-е лицо ед.ч., вопрос: Does + he + study (без -s)."]
];

const ex7=[
"Right now, I am ...",
"Every day, I usually ...",
"At the moment, my family ...",
"On Sundays, I often ...",
"These days, I am learning ...",
"Question: Ask a friend what they are doing right now (Present Continuous) → ...?"
];

const app=document.getElementById('app');

function card(title,desc,innerId){
  const d=document.createElement('div');d.className='card';
  d.innerHTML=`<h2>${title}</h2><div class="desc">${desc}</div><div id="${innerId}"></div>`;
  app.appendChild(d);return d;
}

// EX1
card("1. Choose the correct answer","Выберите правильный вариант глагола.","e1body");
const e1body=document.getElementById('e1body');
ex1.forEach((q,i)=>{
  const it=document.createElement('div');it.className='item';
  it.innerHTML=`<p>${i+1}. ${q[0]}</p><div class="opts">${q[1].map((o,j)=>`<label><input type="radio" name="e1_${i}" value="${j}"> ${o}</label>`).join('')}</div><div class="res" id="e1r_${i}"></div>`;
  e1body.appendChild(it);
});
e1body.parentElement.insertAdjacentHTML('beforeend','<div class="btns"><button onclick="checkEx1()">Проверить</button><button class="ghost" onclick="showEx1()">Показать ответы</button><span class="score" id="e1score"></span></div>');
function checkEx1(){let ok=0;ex1.forEach((q,i)=>{const sel=document.querySelector(`input[name=e1_${i}]:checked`);const r=document.getElementById('e1r_'+i);r.classList.add('show');
  if(!sel){r.className='res show bad';r.innerHTML=`<b>Не выбрано</b>Правильный ответ: ${q[1][q[2]]}. ${q[3]}`;return;}
  if(+sel.value===q[2]){ok++;r.className='res show ok';r.innerHTML=`<b>Верно ✓</b>${q[3]}`;}
  else{r.className='res show bad';r.innerHTML=`<b>Неверно ✗</b>Правильный ответ: ${q[1][q[2]]}. ${q[3]}`;}
});document.getElementById('e1score').textContent=`${ok}/${ex1.length}`;}
function showEx1(){ex1.forEach((q,i)=>{const r=document.getElementById('e1r_'+i);r.className='res show ok';r.innerHTML=`<b>Ответ: ${q[1][q[2]]}</b>${q[3]}`;});}

// EX2
card("2. Распредели маркеры времени","Выбери, к какому времени относится каждое слово/фраза.","e2body");
const e2body=document.getElementById('e2body');
ex2words.forEach((w,i)=>{
  const row=document.createElement('div');row.className='word-row';
  row.innerHTML=`<span>${w}</span><span><select id="e2_${i}"><option value="">— выбрать —</option><option value="simple">Present Simple</option><option value="cont">Present Continuous</option></select></span>`;
  e2body.appendChild(row);
  e2body.insertAdjacentHTML('beforeend',`<div class="res" id="e2r_${i}"></div>`);
});
e2body.parentElement.insertAdjacentHTML('beforeend','<div class="btns"><button onclick="checkEx2()">Проверить</button><button class="ghost" onclick="showEx2()">Показать ответы</button><span class="score" id="e2score"></span></div>');
function checkEx2(){let ok=0;ex2words.forEach((w,i)=>{const val=document.getElementById('e2_'+i).value;const correct=ex2simple.has(w)?'simple':'cont';const label=correct==='simple'?'Present Simple':'Present Continuous';const r=document.getElementById('e2r_'+i);r.classList.add('show');
  if(val===correct){ok++;r.className='res show ok';r.innerHTML='Верно ✓';}
  else{r.className='res show bad';r.innerHTML=`Правильно: ${label}`;}
});document.getElementById('e2score').textContent=`${ok}/${ex2words.length}`;}
function showEx2(){ex2words.forEach((w,i)=>{const correct=ex2simple.has(w)?'simple':'cont';document.getElementById('e2_'+i).value=correct;const r=document.getElementById('e2r_'+i);r.className='res show ok';r.innerHTML=(correct==='simple'?'Present Simple':'Present Continuous');});}

// EX3
card("3. Найди ошибку","Исправь предложение и напиши правильный вариант целиком.","e3body");
const e3body=document.getElementById('e3body');
ex3.forEach((q,i)=>{
  const it=document.createElement('div');it.className='item';
  it.innerHTML=`<p>${i+1}. ${q[0]}</p><input type="text" id="e3_${i}" placeholder="Исправленное предложение"><div class="res" id="e3r_${i}"></div>`;
  e3body.appendChild(it);
});
e3body.parentElement.insertAdjacentHTML('beforeend','<div class="btns"><button onclick="checkEx3()">Проверить</button><button class="ghost" onclick="showEx3()">Показать ответы</button><span class="score" id="e3score"></span></div>');
function checkEx3(){let ok=0;ex3.forEach((q,i)=>{const val=document.getElementById('e3_'+i).value;const r=document.getElementById('e3r_'+i);r.classList.add('show');
  if(matches(val,q[1])){ok++;r.className='res show ok';r.innerHTML=`<b>Верно ✓</b>${q[2]}`;}
  else{r.className='res show bad';r.innerHTML=`<b>Правильно: ${q[1][0]}</b>${q[2]}`;}
});document.getElementById('e3score').textContent=`${ok}/${ex3.length}`;}
function showEx3(){ex3.forEach((q,i)=>{document.getElementById('e3_'+i).value=q[1][0];const r=document.getElementById('e3r_'+i);r.className='res show ok';r.innerHTML=`<b>${q[1][0]}</b>${q[2]}`;});}

// EX4
card("4. Составь предложение","Используй слова в скобках и поставь глагол в нужную форму.","e4body");
const e4body=document.getElementById('e4body');
ex4.forEach((q,i)=>{
  const it=document.createElement('div');it.className='item';
  it.innerHTML=`<p>${i+1}. (${q[0]})</p><input type="text" id="e4_${i}" placeholder="Твоё предложение"><div class="res" id="e4r_${i}"></div>`;
  e4body.appendChild(it);
});
e4body.parentElement.insertAdjacentHTML('beforeend','<div class="btns"><button onclick="checkEx4()">Проверить</button><button class="ghost" onclick="showEx4()">Показать ответы</button><span class="score" id="e4score"></span></div>');
function checkEx4(){let ok=0;ex4.forEach((q,i)=>{const val=document.getElementById('e4_'+i).value;const r=document.getElementById('e4r_'+i);r.classList.add('show');
  if(matches(val,q[1])){ok++;r.className='res show ok';r.innerHTML='Верно ✓';}
  else{r.className='res show bad';r.innerHTML=`Правильно: ${q[1][0]}`;}
});document.getElementById('e4score').textContent=`${ok}/${ex4.length}`;}
function showEx4(){ex4.forEach((q,i)=>{document.getElementById('e4_'+i).value=q[1][0];const r=document.getElementById('e4r_'+i);r.className='res show ok';r.innerHTML=q[1][0];});}

// EX5
card("5. Заполни пропуски","Поставь глагол в скобках в нужную форму (Present Simple или Continuous).","e5body");
const e5body=document.getElementById('e5body');
ex5.forEach((q,i)=>{
  const it=document.createElement('div');it.className='item';
  it.innerHTML=`<p>${i+1}. ${q[0]}</p><input type="text" id="e5_${i}" placeholder="ответ"><div class="res" id="e5r_${i}"></div>`;
  e5body.appendChild(it);
});
e5body.parentElement.insertAdjacentHTML('beforeend','<div class="btns"><button onclick="checkEx5()">Проверить</button><button class="ghost" onclick="showEx5()">Показать ответы</button><span class="score" id="e5score"></span></div>');
function checkEx5(){let ok=0;ex5.forEach((q,i)=>{const val=document.getElementById('e5_'+i).value;const r=document.getElementById('e5r_'+i);r.classList.add('show');
  if(matches(val,q[1])){ok++;r.className='res show ok';r.innerHTML=`<b>Верно ✓</b>${q[2]}`;}
  else{r.className='res show bad';r.innerHTML=`<b>Правильно: ${q[1][0]}</b>${q[2]}`;}
});document.getElementById('e5score').textContent=`${ok}/${ex5.length}`;}
function showEx5(){ex5.forEach((q,i)=>{document.getElementById('e5_'+i).value=q[1][0];const r=document.getElementById('e5r_'+i);r.className='res show ok';r.innerHTML=`<b>${q[1][0]}</b>${q[2]}`;});}

// EX6
card("6. Измени форму: – / ? / +","Перепиши предложение в указанной форме (отрицание / вопрос / утверждение).","e6body");
const e6body=document.getElementById('e6body');
ex6.forEach((q,i)=>{
  const it=document.createElement('div');it.className='item';
  it.innerHTML=`<p>${i+1}. ${q[0]} <b>${q[1]}</b></p><input type="text" id="e6_${i}" placeholder="ответ"><div class="res" id="e6r_${i}"></div>`;
  e6body.appendChild(it);
});
e6body.parentElement.insertAdjacentHTML('beforeend','<div class="btns"><button onclick="checkEx6()">Проверить</button><button class="ghost" onclick="showEx6()">Показать ответы</button><span class="score" id="e6score"></span></div>');
function checkEx6(){let ok=0;ex6.forEach((q,i)=>{const val=document.getElementById('e6_'+i).value;const r=document.getElementById('e6r_'+i);r.classList.add('show');
  if(matches(val,q[2])){ok++;r.className='res show ok';r.innerHTML=`<b>Верно ✓</b>${q[3]}`;}
  else{r.className='res show bad';r.innerHTML=`<b>Правильно: ${q[2][0]}</b>${q[3]}`;}
});document.getElementById('e6score').textContent=`${ok}/${ex6.length}`;}
function showEx6(){ex6.forEach((q,i)=>{document.getElementById('e6_'+i).value=q[2][0];const r=document.getElementById('e6r_'+i);r.className='res show ok';r.innerHTML=`<b>${q[2][0]}</b>${q[3]}`;});}

// EX7
card("7. Answer + Ask — свои идеи","Закончи предложения своими идеями. Ответы можно скопировать одной кнопкой.","e7body");
const e7body=document.getElementById('e7body');
ex7.forEach((q,i)=>{
  const it=document.createElement('div');it.className='item';
  it.innerHTML=`<p>${i+1}. ${q}</p><textarea id="e7_${i}"></textarea>`;
  e7body.appendChild(it);
});
e7body.parentElement.insertAdjacentHTML('beforeend','<div class="btns"><button onclick="copyEx7()">Скопировать все ответы</button><span class="score" id="e7msg"></span></div>');
function copyEx7(){let text=ex7.map((q,i)=>`${i+1}. ${q}\n${document.getElementById('e7_'+i).value}`).join('\n\n');
  navigator.clipboard.writeText(text).then(()=>{document.getElementById('e7msg').textContent='Скопировано!';}).catch(()=>{document.getElementById('e7msg').textContent='Не удалось скопировать';});}
</script>
</body>
</html>
