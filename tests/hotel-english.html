<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hotel English · тренажёр фраз</title>
<style>
:root{--bg1:#ffe9f3;--bg2:#e4ecff;--card:#fff;--ink:#23213a;--mut:#6b6885;--acc:#6c5ce7;--acc2:#ff7eb6;--ok:#12a36b;--okbg:#d9f7ea;--bad:#e5484d;--badbg:#ffe1e2;--warn:#f5a524;--warnbg:#fff1d6;--line:#e6e3f5;--sel:#e0dbff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg1:#1d1633;--bg2:#10192e;--card:#251f3d;--ink:#f1eefc;--mut:#a9a4c7;--okbg:#103c2e;--badbg:#472026;--warnbg:#463615;--line:#3a3358;--sel:#41388a}}
:root[data-theme="dark"]{color-scheme:dark;--bg1:#1d1633;--bg2:#10192e;--card:#251f3d;--ink:#f1eefc;--mut:#a9a4c7;--okbg:#103c2e;--badbg:#472026;--warnbg:#463615;--line:#3a3358;--sel:#41388a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--bg1),var(--bg2)) fixed;min-height:100vh}
.wrap{max-width:1080px;margin:0 auto;padding:16px;display:grid;grid-template-columns:1fr 250px;gap:16px;align-items:start}
header{grid-column:1/-1;text-align:center;padding:18px 8px 4px}
h1{margin:0;font-size:clamp(26px,5vw,40px);background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
header p{margin:4px 0 0;color:var(--mut)}
.card,aside{background:var(--card);border-radius:22px;padding:18px;margin-bottom:16px;box-shadow:0 8px 24px rgba(108,92,231,.13);border:1px solid var(--line)}
aside{position:sticky;top:12px;margin:0}
aside h3{margin:0 0 8px}
h2{margin:0;font-size:20px}.sub{margin:2px 0 12px;color:var(--mut);font-size:14px}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.w{border:1px solid var(--line);border-radius:16px;padding:10px 12px;position:relative}
.w b{display:block}.w i{color:var(--acc);font-style:normal;font-size:14px}.w span{display:block;color:var(--mut);font-size:14px}
.w .e{font-size:22px}
button{font:inherit;cursor:pointer;border:0}
.b{background:linear-gradient(90deg,var(--acc),var(--acc2));color:#fff;padding:8px 16px;border-radius:999px;font-weight:600}
.ghost{background:transparent;color:var(--acc);border:2px solid var(--acc)}
.sp{background:var(--sel);border-radius:50%;width:38px;height:38px;flex:none}
.w .sp{position:absolute;right:8px;top:8px;width:32px;height:32px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
.sc{font-weight:700;color:var(--acc)}
.q{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0;padding-bottom:10px;border-bottom:1px dashed var(--line)}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{background:var(--card);border:2px solid var(--line);color:var(--ink);border-radius:12px;padding:6px 12px}
.opt:hover{border-color:var(--acc)}
.opt.ok,.ok{background:var(--okbg);border-color:var(--ok)}
.opt.bad,.bad{background:var(--badbg);border-color:var(--bad)}
input,textarea,select{font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:12px;padding:6px 10px;max-width:100%}
input{min-width:200px}textarea{width:100%;min-height:54px}
input.ok,textarea.ok,select.ok{border-color:var(--ok)}input.bad,textarea.bad,select.bad{border-color:var(--bad)}
.fb{font-size:14px;width:100%;color:var(--mut)}
.fb b{color:var(--ok)}
.txt{line-height:2.1;font-size:17px}
.ph{padding:3px 2px;border-radius:8px;cursor:pointer;border:2px solid transparent}
.ph:hover{background:var(--warnbg)}
.ph.sel{background:var(--sel)}
.ph.ok{background:var(--okbg);border-color:var(--ok)}
.ph.bad{background:var(--badbg);border-color:var(--bad)}
.ph.miss{background:var(--warnbg);border:2px dashed var(--warn)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}
.row span.l{min-width:170px;font-weight:600}
.dlg{margin:6px 0}.dlg .who{font-weight:700;color:var(--acc)}
.pw{display:flex;justify-content:space-between;gap:6px;padding:6px 8px;border-radius:10px;background:var(--badbg);margin:5px 0;cursor:pointer;font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--card);border:2px solid var(--line);color:var(--ink);border-radius:999px;padding:4px 12px;font-size:14px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.hint{color:var(--mut);font-size:13px}
@media(max-width:860px){.wrap{grid-template-columns:1fr}aside{position:static;order:-1}}
</style></head><body>
<div class="wrap">
<header><h1>🏨 Hotel English</h1><p>Фразы для отеля: слушай, пиши, проверяй и копируй ответы</p></header>
<main id="main">
<section class="card"><h2>🎧 Сначала вспомним фразы</h2>
<p class="sub">Нажми 🔊 и повтори вслух. Голос: <b id="vn">…</b> (Google US English / Samantha)</p>
<div class="words" id="words"></div>
<div class="bar"><button class="b" id="all">▶ Прослушать все</button></div></section>
</main>
<aside><h3>⚠️ Проблемные слова</h3><p class="hint">Сюда попадают фразы, в которых были ошибки. Нажми — послушай.</p><div id="pw"><p class="hint">Пока пусто 🎉</p></div></aside>
</div>
<script>
const E=[
{id:'ci',en:'check in / check out',say:'check in. check out',ru:'заселиться / выехать из отеля',tr:'/tʃek ɪn/ · /tʃek aʊt/',e:'🛎️'},
{id:'ask',en:'I think I asked for…',say:'I think I asked for',ru:'Кажется, я просил(а)…',tr:'/aɪ θɪŋk aɪ ɑːskt fɔː/',e:'🙋'},
{id:'chg',en:'If you could change …, it would be great',say:'If you could change the room, it would be great',ru:'Если бы вы могли поменять…, было бы здорово',tr:'/ɪf juː kʊd tʃeɪndʒ… ɪt wʊd biː ɡreɪt/',e:'🔄'},
{id:'rev',en:'leave a good / bad review',say:'leave a good review. leave a bad review',ru:'оставить хороший / плохой отзыв',tr:'/liːv ə ɡʊd · bæd rɪˈvjuː/',e:'⭐'},
{id:'nm',en:'never mind',say:'never mind',ru:'неважно, забудьте',tr:'/ˌnevə ˈmaɪnd/',e:'🤷'},
{id:'suf',en:'suffer from bad / slow service',say:'suffer from bad service. suffer from slow service',ru:'страдать от плохого / медленного обслуживания',tr:'/ˈsʌfə frəm ˈsɜːvɪs/',e:'🐌'},
{id:'mix',en:'get something mixed up',say:'get something mixed up',ru:'перепутать что-то',tr:'/ɡet ˈsʌmθɪŋ mɪkst ʌp/',e:'🌀'},
{id:'go',en:'go ahead',say:'go ahead',ru:'пожалуйста, продолжайте / давайте',tr:'/ɡəʊ əˈhed/',e:'👉'},
{id:'ac',en:'get the air conditioning working',say:'get the air conditioning working',ru:'наладить кондиционер',tr:'/ɡet ði eə kənˈdɪʃnɪŋ ˈwɜːkɪŋ/',e:'❄️'}];
const $=s=>document.querySelector(s),sh=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const norm=s=>s.toLowerCase().replace(/[’]/g,"'").replace(/[^a-z' ]/g,' ').replace(/\s+/g,' ').trim();
let V=null;
function pick(){const v=speechSynthesis.getVoices();V=v.find(x=>/Google US English/i.test(x.name))||v.find(x=>/Samantha/i.test(x.name))||v.find(x=>x.lang==='en-US')||v.find(x=>/^en/i.test(x.lang))||null;$('#vn').textContent=V?V.name:'голос по умолчанию'}
if('speechSynthesis' in window){pick();speechSynthesis.onvoiceschanged=pick}else $('#vn').textContent='озвучка недоступна в этом браузере';
function say(t,cb){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.9;if(V)u.voice=V;if(cb)u.onend=cb;speechSynthesis.speak(u)}
document.addEventListener('click',e=>{const s=e.target.closest('[data-say]');if(s)say(s.dataset.say)});
const SP=t=>`<button class="sp" data-say="${t}" title="Слушать">🔊</button>`;
$('#words').innerHTML=E.map(x=>`<div class="w">${SP(x.say)}<span class="e">${x.e}</span><b>${x.en}</b><i>${x.tr}</i><span>${x.ru}</span></div>`).join('');
$('#all').onclick=()=>{let i=0;const n=()=>{if(i<E.length)say(E[i++].say,n)};n()};
const P={};
function bad(id){P[id]=(P[id]||0)+1;$('#pw').innerHTML=Object.keys(P).map(k=>{const x=E.find(e=>e.id===k);return `<div class="pw" data-say="${x.say}"><span>${x.e} ${x.en}</span><b>×${P[k]}</b></div>`}).join('')}
const prodFields=[];
function sec(t,s,o={}){const d=document.createElement('section');d.className='card';d.innerHTML=`<h2>${t}</h2><p class="sub">${s}</p><div class="body"></div><div class="bar">${o.nochk?'':'<button class="b" data-a="chk">Проверить</button>'}<button class="b ghost" data-a="show">Показать ответы</button>${o.copy?'<button class="b ghost" data-a="cp">📋 Скопировать мои ответы</button>':''}<span class="sc"></span></div>`;$('#main').append(d);d.score=(a,b)=>d.querySelector('.sc').textContent=`${a} / ${b}`;d.on=(a,f)=>{const b=d.querySelector(`[data-a=${a}]`);if(b)b.onclick=f};d.body=d.querySelector('.body');return d}
async function copy(t,btn){try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.append(a);a.select();try{document.execCommand('copy')}catch(_){}a.remove()}if(btn){const o=btn.textContent;btn.textContent='✅ Скопировано!';setTimeout(()=>btn.textContent=o,1600)}}
// 1 find in the wild
(()=>{const d=sec('1 · Find them in the wild','Кликай по целым фразам в тексте, где встречаются наши выражения. Будь внимателен: есть лишние фразы!');
const T=`Last week we stayed at the Rose Hotel. We wanted to {{arrive early}}, but we had to [[ci|check in]] after 3 pm. {{The room was nice}}, but it was hot, so we asked them to [[ac|get the air conditioning working]]. [[ask|I think I asked for]] a quiet room, but {{they gave us a room by the street}}. The staff seemed to [[mix|get our bookings mixed up]]. I said, “[[chg|If you could change our room, it would be great]].” The receptionist answered, “[[go|Go ahead]] and take this key.” {{We had dinner downstairs}}. When the key didn’t work, I said, “[[nm|never mind]].” In the morning we had to [[ci|check out]] quickly. Guests [[suf|suffer from slow service]] here, so I decided to [[rev|leave a bad review]].`;
d.body.innerHTML='<p class="txt">'+T.replace(/\[\[(\w+)\|(.+?)\]\]|\{\{(.+?)\}\}/g,(m,id,t,x)=>id?`<span class="ph" data-id="${id}">${t}</span>`:`<span class="ph">${x}</span>`)+'</p>';
const ph=[...d.body.querySelectorAll('.ph')],tg=ph.filter(p=>p.dataset.id);
ph.forEach(p=>p.onclick=()=>{p.classList.remove('ok','bad','miss');p.classList.toggle('sel')});
d.on('chk',()=>{let k=0;ph.forEach(p=>{const s=p.classList.contains('sel');p.classList.remove('ok','bad','miss');if(p.dataset.id&&s){k++;p.classList.add('ok')}else if(p.dataset.id){p.classList.add('miss');bad(p.dataset.id)}else if(s)p.classList.add('bad')});d.score(k,tg.length)});
d.on('show',()=>{ph.forEach(p=>{p.classList.remove('bad','miss','ok');p.classList.toggle('sel',!!p.dataset.id);if(p.dataset.id)p.classList.add('ok')});d.score(tg.length,tg.length)})})();
// 2 listen & pick
(()=>{const d=sec('2 · Listen & pick','Слушай выражение и выбирай его значение. Ответы каждый раз перемешиваются.',{nochk:1});
const it=sh(E).slice(0,6);let k=0,n=0;
it.forEach(x=>{const o=sh([x,...sh(E.filter(e=>e!==x)).slice(0,3)]);const q=document.createElement('div');q.className='q';q.innerHTML=SP(x.say)+'<div class="opts">'+o.map(e=>`<button class="opt" data-id="${e.id}">${e.ru}</button>`).join('')+'</div>';
q.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(q.dataset.d)return;q.dataset.d=1;n++;const r=b.dataset.id===x.id;if(r)k++;else{bad(x.id);b.classList.add('bad')}q.querySelector(`[data-id=${x.id}]`).classList.add('ok');d.score(k,n)});
d.body.append(q)});
d.on('show',()=>{d.body.querySelectorAll('.q').forEach((q,i)=>{q.dataset.d=1;q.querySelector(`[data-id=${it[i].id}]`).classList.add('ok')})})})();
// 3 type by sound
(()=>{const d=sec('3 · Прописать выражение по звуку','Нажми 🔊 (можно слушать сколько угодно) и напиши то, что услышал.');
const it=sh([['check in',['check in'],'ci'],['never mind',['never mind','nevermind'],'nm'],['go ahead',['go ahead'],'go'],['get the air conditioning working',['get the air conditioning working'],'ac'],['I think I asked for a window seat',['i think i asked for a window seat'],'ask'],['We suffer from slow service',['we suffer from slow service'],'suf'],['leave a bad review',['leave a bad review'],'rev']]);
it.forEach(x=>{const q=document.createElement('div');q.className='q';q.innerHTML=SP(x[0])+'<input autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="напиши по-английски"><div class="fb"></div>';d.body.append(q)});
const qs=[...d.body.querySelectorAll('.q')];
d.on('chk',()=>{let k=0;qs.forEach((q,i)=>{const inp=q.querySelector('input'),ok=it[i][1].includes(norm(inp.value));inp.classList.remove('ok','bad');inp.classList.add(ok?'ok':'bad');q.querySelector('.fb').textContent=ok?'✅':'❌ Попробуй ещё раз';if(ok)k++;else bad(it[i][2])});d.score(k,it.length)});
d.on('show',()=>qs.forEach((q,i)=>q.querySelector('.fb').innerHTML='Ответ: <b>'+it[i][0]+'</b>'))})();
// 4 collocations
(()=>{const d=sec('4 · Сочетаемость фраз','Подбери к началу фразы правильное продолжение.');
const pr=[['leave a','bad review'],['suffer from','slow service'],['get the air conditioning','working'],['get my order','mixed up'],['check','out of the hotel'],['go','ahead']];const ids=['rev','suf','ac','mix','ci','go'];
const opts=sh(pr.map(p=>p[1]));
pr.forEach(p=>{const r=document.createElement('div');r.className='row';r.innerHTML=`<span class="l">${p[0]} …</span><select><option value="">— выбери —</option>${opts.map(o=>`<option>${o}</option>`).join('')}</select><span class="fb" style="width:auto"></span>`;d.body.append(r)});
const rs=[...d.body.querySelectorAll('.row')];
d.on('chk',()=>{let k=0;rs.forEach((r,i)=>{const s=r.querySelector('select'),ok=s.value===pr[i][1];s.classList.remove('ok','bad');s.classList.add(ok?'ok':'bad');if(ok)k++;else bad(ids[i])});d.score(k,pr.length)});
d.on('show',()=>rs.forEach((r,i)=>{const s=r.querySelector('select');s.value=pr[i][1];s.className='ok'}))})();
// 5 mini-situations
(()=>{const d=sec('5 · Complete the mini-situations','Впиши подходящее выражение в пропуск. Подсказка по-русски в скобках.');
const it=sh([
['— Sorry, what did you say? — ___, it’s not important.','(неважно)',/^never ?mind$/,'never mind','nm'],
['It’s too hot in my room. Could you ___?','(наладить кондиционер)',/^get the air conditioning working$/,'get the air conditioning working','ac'],
['Hello! I’d like to ___. I have a booking.','(заселиться)',/^check in$/,'check in','ci'],
['— ___ a pasta, not a salad. — Oh, sorry!','(Кажется, я просил)',/^i think i asked for$/,'I think I asked for','ask'],
['— May I sit here? — Yes, ___!','(пожалуйста)',/^go ahead$/,'go ahead','go'],
['The food was awful, so I’ll ___ online.','(оставить плохой отзыв)',/^leave a bad review$/,'leave a bad review','rev'],
['Sorry, I ___ the dates.','(перепутал)',/^(got|have got|ve got) the dates mixed up$|^got the dates mixed up$/,'got the dates mixed up','mix']]);
it.forEach(x=>{const q=document.createElement('div');q.className='q';q.innerHTML='<div>'+x[0].replace('___','<input autocomplete="off" autocapitalize="off" spellcheck="false" style="min-width:230px">')+' <span class="hint">'+x[1]+'</span></div><div class="fb"></div>';d.body.append(q)});
const qs=[...d.body.querySelectorAll('.q')];
d.on('chk',()=>{let k=0;qs.forEach((q,i)=>{const inp=q.querySelector('input'),ok=it[i][2].test(norm(inp.value));inp.className=ok?'ok':'bad';q.querySelector('.fb').textContent=ok?'✅':'❌';if(ok)k++;else bad(it[i][4])});d.score(k,it.length)});
d.on('show',()=>qs.forEach((q,i)=>q.querySelector('.fb').innerHTML='Ответ: <b>'+it[i][3]+'</b>'))})();
// production helper
function prod(d,fields){fields.forEach(f=>prodFields.push(f));
d.on('chk',()=>{let k=0;fields.forEach(f=>{const ok=f.rx.test(norm(f.el.value));f.el.className=ok?'ok':'bad';f.fb.innerHTML=ok?'✅ Выражение использовано':'❌ Проверь, использовано ли нужное выражение';if(ok)k++;else bad(f.id)});d.score(k,fields.length)});
d.on('show',()=>fields.forEach(f=>f.fb.innerHTML='Пример: <b>'+f.sample+'</b>'));
d.on('cp',e=>copy(fields.map(f=>f.label+'\n'+f.el.value).join('\n\n'),d.querySelector('[data-a=cp]')))}
// 6 dialogue
(()=>{const d=sec('6 · Finish the dialogue','Допиши реплики гостя. Ответов может быть много — главное, использовать выражение из подсказки.',{copy:1});
const L=[['Receptionist','Good evening! How can I help you?',null],['You','','check in',/check in/,'Good evening! I’d like to check in, please.','ci'],['Receptionist','Of course. Here is your key. Breakfast is at 8.',null],['You','','попроси поменять номер: If you could change …, it would be great',/if you could change .*would be great|would be great/,'If you could change my room, it would be great.','chg'],['Receptionist','Sure. Anything else?',null],['You','','air conditioning working / never mind',/get the air conditioning working|never mind/,'Yes, could you get the air conditioning working?','ac']];
const f=[];L.forEach(l=>{const r=document.createElement('div');r.className='dlg';if(!l[2]){r.innerHTML=`<span class="who">${l[0]}:</span> ${l[1]}`}else{r.innerHTML=`<span class="who">You:</span> <span class="hint">(${l[2]})</span><textarea></textarea><div class="fb"></div>`;f.push({el:r.querySelector('textarea'),fb:r.querySelector('.fb'),rx:l[3],sample:l[4],id:l[5],label:'Dialogue — '+l[2]+':'})}d.body.append(r)});prod(d,f)})();
// 7 own sentences
(()=>{const d=sec('7 · Напиши своё предложение','Составь своё предложение с каждым выражением.',{copy:1});
const L=[['I think I asked for …',/i think i asked for/,'I think I asked for a double bed.','ask'],['leave a good / bad review',/leav(e|ing) (a )?(good|bad) review|left (a )?(good|bad) review/,'I always leave a good review after a great stay.','rev'],['suffer from slow service',/suffer(ed|ing)? from .*service/,'Many guests suffer from slow service here.','suf'],['get … mixed up',/(get|got|getting|gets) .*mixed up/,'I often get the names mixed up.','mix'],['go ahead',/go ahead/,'Go ahead, please sit down.','go']];
const f=[];L.forEach(l=>{const r=document.createElement('div');r.className='dlg';r.innerHTML=`<b>${l[0]}</b><textarea></textarea><div class="fb"></div>`;f.push({el:r.querySelector('textarea'),fb:r.querySelector('.fb'),rx:l[1],sample:l[2],id:l[3],label:'Sentence — '+l[0]+':'});d.body.append(r)});prod(d,f)})();
// 8 self-assessment
(()=>{const d=sec('8 · Что я теперь знаю','Оцени себя честно. «Повторить» добавит фразу в проблемные слова.',{nochk:1});d.querySelector('[data-a=show]').remove();
const st={};E.forEach(x=>{const r=document.createElement('div');r.className='row';r.innerHTML=`<span class="l">${x.e} ${x.en}</span><div class="chips">${[['know','✅ Знаю'],['almost','🤔 Почти'],['again','🔁 Повторить']].map(c=>`<button class="chip" data-v="${c[0]}">${c[1]}</button>`).join('')}</div>`;
r.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{r.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));b.classList.add('on');if(b.dataset.v==='again'&&st[x.id]!=='again')bad(x.id);st[x.id]=b.dataset.v;const k=Object.values(st).filter(v=>v==='know').length;d.score(k,E.length)});d.body.append(r)})})();
// final
(()=>{const d=sec('🎉 Финиш: звук и копирование','Проверь озвучку и скопируй свои ответы из заданий на продакшн (диалог и предложения).',{nochk:1});d.querySelector('[data-a=show]').remove();
