<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Character adjectives — Extra practice 2</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1d2433;--mu:#6b7488;--ac:#4f46e5;--ok:#16a34a;--bad:#dc2626;--bd:#dde1ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151f;--card:#1c2030;--tx:#e8ebf5;--mu:#98a1b8;--ac:#8b85ff;--ok:#4ade80;--bad:#f87171;--bd:#2d3350}}
:root[data-theme="dark"]{--bg:#12151f;--card:#1c2030;--tx:#e8ebf5;--mu:#98a1b8;--ac:#8b85ff;--ok:#4ade80;--bad:#f87171;--bd:#2d3350}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:auto;padding:12px}h1{margin:6px 0 2px;font-size:1.45rem}h2{margin:0 0 4px;font-size:1.15rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}.in,.mu{color:var(--mu);font-size:.9rem;margin:0 0 8px}
ol{padding-left:22px;margin:6px 0}ol li{margin:10px 0}
button,select{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:9px;padding:6px 11px;max-width:100%}button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
input{font:inherit;border:1.5px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:7px;padding:3px 8px;min-width:90px}
input.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}input.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.ans{color:var(--ok);font-weight:600;margin-left:8px}.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}.sc{font-weight:700}
.pl{padding:2px 9px;margin-right:6px}
</style></head><body><main>
<h1>Extra practice 2 · Character adjectives 🎧</h1>
<p class="mu"><span id="vstat">Голос: загрузка…</span> <select id="vsel" title="Выбрать голос"></select> <button id="tst">🔊 Проверить звук</button></p>
<div id="exs"></div>
<section class="card"><h2>Мои результаты</h2><div class="bar"><button class="p" id="cp">📋 Копировать все мои ответы</button><span class="sc" id="cps"></span></div><p class="mu" id="pw"></p></section>
</main>
<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const n=s=>s.toLowerCase().replace(/[’`]/g,"'").replace(/[\s\-.,!?]+/g,"");
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const spread=a=>{for(let i=1;i<a.length;i++)if(a[i].a[0]===a[i-1].a[0]){const j=a.findIndex((x,k)=>k>i&&x.a[0]!==a[i-1].a[0]&&(!a[i+1]||x.a[0]!==a[i+1].a[0]));if(j>0)[a[i],a[j]]=[a[j],a[i]]}return a};
/* audio */
let voice=null;
const BAD=/^(Eddy|Flo|Grandma|Grandpa|Reed|Rocko|Sandy|Shelley|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Good News|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Albert|Fred|Junior|Kathy|Ralph)\b/i;
function pick(){const all=speechSynthesis.getVoices().filter(v=>/^en([-_]|$)/i.test(v.lang));const good=all.filter(v=>!BAD.test(v.name));
let saved=null;try{saved=localStorage.getItem("voice")}catch(e){}
voice=all.find(v=>v.name===saved)||good.find(x=>/Google US English/i.test(x.name))||good.find(x=>/^Samantha/i.test(x.name))||good.find(x=>/en[-_]US/i.test(x.lang))||good[0]||all[0]||null;
$("#vsel").innerHTML=all.map(v=>`<option value="${v.name}"${v===voice?" selected":""}>${v.name} (${v.lang})</option>`).join("");
const pref=voice&&/Google US English|Samantha/i.test(voice.name);
$("#vstat").textContent=voice?"Голос: "+voice.name+(pref?" ✓":" — выбери лучший из списка:"):"Английский голос не найден — проверь настройки устройства."}
$("#vsel").onchange=e=>{voice=speechSynthesis.getVoices().find(v=>v.name===e.target.value)||voice;try{localStorage.setItem("voice",e.target.value)}catch(x){}say("Hello! My mother is kind and generous.")};
if("speechSynthesis" in window){pick();speechSynthesis.onvoiceschanged=pick}else $("#vstat").textContent="Озвучка не поддерживается этим браузером.";
const say=t=>{if(!("speechSynthesis" in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";if(voice)u.voice=voice;u.rate=.8;speechSynthesis.speak(u)};
$("#tst").onclick=()=>say("Hello! My mother is kind and generous.");
/* exercises */
const WORDS=["kind","talkative","funny","shy","clever","generous","lazy","extrovert","hard-working","mean","unkind","stupid","unfriendly","serious","quiet","fun","swipe"];
const EX=[
{id:"f1",title:"Ex. 1 · Dictation: listen and write",instr:"Нажимай 🔊 и пиши услышанное слово. Слушать можно сколько угодно раз. Новый раунд — новые слова.",audio:1,
gen:()=>shuf(WORDS).slice(0,8).map(w=>({t:"{}",a:[w]}))},
{id:"f2",title:"Ex. 2 · …, but … (opposites in sentences)",instr:"Допиши предложение словом с противоположным смыслом.",items:[
{t:"My brother is lazy, but my sister is {}.",a:["hard-working"]},
{t:"Anna is very talkative, but her brother is {}.",a:["quiet","shy"]},
{t:"He is clever, but his friend is {}.",a:["stupid"]},
{t:"Our teacher is serious, but our coach is {}.",a:["funny","fun"]},
{t:"She is generous, but her husband is {}.",a:["mean"]},
{t:"My uncle is an extrovert, but my aunt is {}.",a:["shy","quiet"]},
{t:"The new neighbour is unfriendly, but the old one was very {}.",a:["friendly","kind"]}]},
{id:"f3",title:"Ex. 3 · Odd one out",instr:"Какое слово лишнее? Напиши его.",items:[
{t:"kind – generous – lazy – friendly → {}",a:["lazy"]},
{t:"shy – quiet – talkative – serious → {}",a:["talkative"]},
{t:"mean – unkind – unfriendly – generous → {}",a:["generous"]},
{t:"extrovert – talkative – funny – shy → {}",a:["shy"]},
{t:"stupid – lazy – unkind – clever → {}",a:["clever"]},
{t:"swipe – kind – shy – lazy → {}",a:["swipe"]},
{t:"dating app – serious – funny – kind → {}",a:["dating app"]}]}
];
const P={};
function rp(){const k=Object.keys(P);$("#pw").textContent=k.length?"Повтори эти слова: "+k.map(w=>w+" ×"+P[w]).join(", "):""}
function build(ex){const box=$("#"+ex.id);ex.cur=(ex.gen?ex.gen():spread(shuf(ex.items))).map(x=>({...x,f:0}));
$("ol",box).innerHTML=ex.cur.map((it,i)=>`<li>${it.t.replace("{}",(ex.audio?`<button class="pl" data-i="${i}" title="Слушать">🔊</button>`:"")+`<input autocomplete="off" autocapitalize="off" spellcheck="false" size="${Math.max(10,it.a[0].length+3)}">`)}<span class="ans"></span></li>`).join("");$(".sc",box).textContent="";ex.score=""}
EX.forEach(ex=>{$("#exs").insertAdjacentHTML("beforeend",`<section class="card" id="${ex.id}" data-ex="${ex.id}"><h2>${ex.title}</h2><p class="in">${ex.instr}</p><ol></ol><div class="bar"><button class="p" data-a="chk">Проверить</button><button data-a="shw">Показать ответы</button><button data-a="rst">${ex.audio?"Новый раунд":"Заново (перемешать)"}</button><span class="sc"></span></div></section>`);build(ex)});
document.addEventListener("click",e=>{const pl=e.target.closest(".pl");if(pl){const ex=EX.find(x=>x.id===pl.closest("[data-ex]").dataset.ex);say(ex.cur[+pl.dataset.i].a[0]);return}
const b=e.target.closest("[data-a]");if(!b)return;const sec=b.closest("[data-ex]"),ex=EX.find(x=>x.id===sec.dataset.ex),a=b.dataset.a;
if(a==="rst")build(ex);
if(a==="chk"){let c=0;$$("li",sec).forEach((li,i)=>{const it=ex.cur[i],inp=$("input",li),ok=it.a.some(x=>n(x)===n(inp.value));inp.classList.toggle("ok",ok);inp.classList.toggle("bad",!ok);if(ok)c++;else if(!it.f){it.f=1;P[it.a[0]]=(P[it.a[0]]||0)+1;rp()}});
ex.score=c+"/"+ex.cur.length;$(".sc",sec).textContent=ex.score+(c===ex.cur.length?" 🎉":"")}
if(a==="shw")$$("li",sec).forEach((li,i)=>$(".ans",li).textContent="→ "+ex.cur[i].a.join(" / "))});
function copy(txt){const done=()=>{$("#cps").textContent="✓ Скопировано";setTimeout(()=>$("#cps").textContent="",1800)};
const fb=()=>{const t=document.createElement("textarea");t.value=txt;document.body.appendChild(t);t.select();try{document.execCommand("copy")}catch(e){}t.remove();done()};
if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(txt).then(done,fb);else fb()}
$("#cp").onclick=()=>{let o="Character adjectives — extra practice 2, мои ответы\n\n";
EX.forEach(ex=>{o+=ex.title+" ("+(ex.score||"не проверено")+")\n";$$("#"+ex.id+" li").forEach((li,i)=>{const c=li.cloneNode(true);$$("input",c).forEach(x=>x.replaceWith("["+x.value+"]"));$$(".ans,.pl",c).forEach(x=>x.remove());
const inp=$("input",li),m=inp.classList.contains("ok")?" ✓":inp.classList.contains("bad")?" ✗ (→ "+ex.cur[i].a[0]+")":"";o+=(i+1)+". "+c.textContent.replace(/\s+/g," ").trim()+m+"\n"});o+="\n"});
o+="Повторить: "+(Object.keys(P).join(", ")||"—");copy(o)};
</script></body></html>
