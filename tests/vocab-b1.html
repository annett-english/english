<style>

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171c;--card:#1e2128;--tx:#e8eaf0;--mut:#9aa1b0;--ac:#8fa6ff;--acs:#262c47;--ok:#5fd68f;--oks:#1d3328;--bad:#ff8787;--bads:#3a2224;--bd:#2f333d}}
:root[data-theme="dark"]{--bg:#15171c;--card:#1e2128;--tx:#e8eaf0;--mut:#9aa1b0;--ac:#8fa6ff;--acs:#262c47;--ok:#5fd68f;--oks:#1d3328;--bad:#ff8787;--bads:#3a2224;--bd:#2f333d}

</style></head><body>
<header><h1>🎧 B1 Vocabulary: Health &amp; Relationships</h1>
<p class="d">Лексика + Past Simple / Past Continuous / Past Perfect. Пишите ответы руками, проверяйте и смотрите ответы.</p>
<div class="bar" style="margin:0"><label>Голос: <select id="vs"></select></label><button onclick="speak('Audio test. Hello, how are you today?')">🔊 Проверить аудио</button><span class="tag" id="vst"></span></div></header>
<div class="wrap"><main id="m"></main>
<aside><div class="box"><h2>⚠️ Проблемные слова</h2><p class="d">Слова, в которых была ошибка.</p><ul id="pw"><li class="tag">Пока нет ошибок 🎉</li></ul><button onclick="mis={};rp()">Очистить</button></div></aside></div>
<script>
const W=[["muscles","мышцы","/ˈmʌslz/"],["skip breakfast","пропускать завтрак","/skɪp ˈbrekfəst/"],["blood sugar levels","уровень сахара в крови","/blʌd ˈʃʊɡə ˈlevlz/"],["lung capacity","объём лёгких","/lʌŋ kəˈpæsəti/"],["liver","печень","/ˈlɪvə/"],["disrupt our body’s","нарушать (ритм) нашего организма","/dɪsˈrʌpt/"],["cause diabetes","вызывать диабет","/kɔːz ˌdaɪəˈbiːtiːz/"],["make us mentally alert","делать нас умственно бодрыми","/ˈmentəli əˈlɜːt/"],["stomach produces acid","желудок вырабатывает кислоту","/ˈstʌmək ˈæsɪd/"],["produce the stress hormone","вырабатывать гормон стресса","/ˈhɔːməʊn/"],
["classmate","одноклассник","/ˈklɑːsmeɪt/"],["fiancé","жених","/fiˈɒnseɪ/"],["close friend","близкий друг","/kləʊs frend/"],["fiancée","невеста","/fiˈɒnseɪ/"],["colleague","коллега","/ˈkɒliːɡ/"],["flatmate","сосед по квартире","/ˈflætmeɪt/"],["couple","пара","/ˈkʌpl/"],["partner","партнёр","/ˈpɑːtnə/"],["ex / ex-partner","бывший / бывшая","/eks/"],["propose","делать предложение","/prəˈpəʊz/"],["be together","быть вместе","/təˈɡeðə/"],["get married","пожениться","/ɡet ˈmærid/"],["lose touch","потерять связь","/luːz tʌtʃ/"],["become friends","подружиться","/bɪˈkʌm frendz/"],["get on","ладить","/ɡet ɒn/"],["break up","расстаться","/breɪk ʌp/"],["get to know","узнавать поближе","/ɡet tə nəʊ/"],["get in touch","связаться","/ɡet ɪn tʌtʃ/"],["go out together","встречаться","/ɡəʊ aʊt/"],["have (sth) in common","иметь общее","/ˈkɒmən/"]];
const $=s=>document.querySelector(s),sh=a=>[...a].sort(()=>Math.random()-.5);
const norm=s=>(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[’‘]/g,"'").replace(/[()]/g,"").replace(/something/g,"sth").replace(/[.!?,]+$/,"").replace(/\s+/g," ").trim();
const say=w=>w.split(" / ")[0].replace("(sth)","something");
let voice=null,voices=[];
function pick(){voices=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));if(!voices.length)return;
 const cur=voice;voice=cur||voices.find(v=>/Google US English/i.test(v.name))||voices.find(v=>/Samantha/i.test(v.name))||voices.find(v=>v.lang==="en-US")||voices[0];
 $("#vs").innerHTML=voices.map((v,i)=>`<option value="${i}" ${v===voice?"selected":""}>${v.name} (${v.lang})</option>`).join("");st()}
function st(){$("#vst").textContent=voice?"Сейчас: "+voice.name:"Голоса не найдены — проверьте браузер"}
$("#vs").onchange=e=>{voice=voices[e.target.value];st();speak("Hello!")};
function speak(t,cb){if(!window.speechSynthesis)return alert("Аудио не поддерживается в этом браузере");speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";if(voice)u.voice=voice;u.rate=.9;if(cb)u.onend=cb;speechSynthesis.speak(u)}
function speakAll(){const q=W.map(w=>say(w[0]));(function n(){if(q.length)speak(q.shift(),n)})()}
if(window.speechSynthesis){pick();speechSynthesis.onvoiceschanged=pick}
let mis={};function rp(){const e=Object.entries(mis);$("#pw").innerHTML=e.length?e.map(([w,n])=>`<li><span>${w} <span class="tag">×${n}</span></span><button class="sp" onclick="speak(say('${w.replace(/'/g,"\\'")}'))">🔊</button></li>`).join(""):'<li class="tag">Пока нет ошибок 🎉</li>'}
const addm=w=>{mis[w]=(mis[w]||0)+1;rp()};
/* usage detection */
const irr={get:"get|got|gotten|getting|gets",know:"know|knew|known|knowing",lose:"lose|lost|losing",break:"break|broke|broken|breaking",become:"become|became|becoming",go:"go|went|gone|going|goes",have:"have|had|has|having",make:"make|made|making",be:"be|was|were|been|being|is|are"};
const stop=new Set(["our","us","the","sth"]);
function used(text,w){const t=norm(text);return w.split(" / ").some(a=>a.replace(/\(sth\)/g,"").replace(/’s/g,"").split(" ").filter(x=>x&&!stop.has(x)).every(k=>{let r=irr[k]?"\\b("+irr[k]+")\\b":k.length<=3?"\\b"+k+"\\b":k.length<=5?"\\b"+k+"\\w*":"\\b"+k.slice(0,-2);return new RegExp(r).test(t)}))}
const chips=(ws,txt)=>ws.map(w=>`<span class="chip ${used(txt,w)?"done":""}">${used(txt,w)?"✔ ":""}${w}</span>`).join("");
const tenses=t=>{const a=/\b(was|were)\s+\w+ing\b/i.test(t),b=/\bhad\s+\w+/i.test(t),c=/\b\w+ed\b|\b(went|got|met|saw|said|took|lost|broke|came|knew|made)\b/i.test(t);return [["Past Simple",c],["Past Continuous",a],["Past Perfect",b]].map(x=>`<span class="chip ${x[1]?"done":""}">${x[1]?"✔ ":""}${x[0]}</span>`).join("")};
/* intro */
const card=w=>`<div class="cd"><button class="sp" onclick="speak(say('${w[0].replace(/'/g,"\\'")}'))">🔊</button><div><b>${w[0]}</b><i>${w[2]}</i> <span>— ${w[1]}</span></div></div>`;
$("#m").innerHTML=`<section><h2>📖 Повторение слов</h2><p class="d">Нажмите 🔊 и прослушайте каждое слово (голос Google US English / Samantha), повторите вслух.</p>
<button class="p" onclick="speakAll()">▶ Прослушать все слова</button><h3>Body &amp; health</h3><div class="cards">${W.slice(0,10).map(card).join("")}</div><h3>Relationships</h3><div class="cards">${W.slice(10).map(card).join("")}</div>
<h3>Past tenses</h3><div class="ex"><b>Past Simple</b> — законченное действие: <i>He proposed last year.</i></div><div class="ex"><b>Past Continuous</b> — was/were + V-ing, процесс в прошлом: <i>I was cooking when she called.</i></div><div class="ex"><b>Past Perfect</b> — had + V3, действие до другого момента в прошлом: <i>They had broken up before I met them.</i></div></section>`;
/* typed tasks */
const T={};
function mount(id,title,desc,gen){T[id]={gen};const s=document.createElement("section");s.id=id;s.innerHTML=`<h2>${title}</h2><p class="d">${desc}</p><div class="body"></div><div class="bar"><button class="p" onclick="chk('${id}')">✔ Проверить</button><button onclick="shw('${id}')">👁 Показать ответы</button><button onclick="rnd('${id}')">🔀 Заново (перемешать)</button><span class="sc"></span></div>`;$("#m").appendChild(s);rnd(id)}
function rnd(id){const t=T[id],g=t.gen();t.items=g.items;const s=$("#"+id);s.querySelector(".sc").textContent="";
 s.querySelector(".body").innerHTML=(g.extra||"")+t.items.map((it,i)=>`<div class="row"><span class="n">${i+1}</span><div>${it.p}</div><div class="in">${it.say?`<button class="sp" onclick="speak(T['${id}'].items[${i}].say)">🔊 Прослушать</button>`:""}<input type="text" autocomplete="off" autocapitalize="none" spellcheck="false"><span class="fb"></span></div></div>`).join("")}
const okv=(it,v)=>it.a.some(x=>norm(x)===norm(v));
function chk(id){const t=T[id];let n=0;$("#"+id).querySelectorAll(".row").forEach((r,i)=>{const inp=r.querySelector("input"),f=r.querySelector(".fb"),it=t.items[i],ok=okv(it,inp.value);inp.classList.toggle("ok",ok);inp.classList.toggle("bad",!ok);f.className="fb "+(ok?"g":"r");f.textContent=ok?"✔":"✘ попробуйте ещё";if(ok)n++;else if(norm(inp.value)&&!it.m){it.m=1;addm(it.w)}if(ok)it.m=0});$("#"+id).querySelector(".sc").textContent=`Результат: ${n}/${t.items.length}`}
function shw(id){const t=T[id];$("#"+id).querySelectorAll(".row").forEach((r,i)=>{const inp=r.querySelector("input");inp.value=t.items[i].a[0];inp.className="ok";const f=r.querySelector(".fb");f.className="fb g";f.textContent="✔ ответ"})}
const split=w=>{const a=w.split(" / ");return a};
mount("t1","1️⃣ Translate → English","Напишите слово или фразу по-английски (8 слов, каждый раз новые).",()=>({items:sh(W).slice(0,8).map(w=>({p:`<b>${w[1]}</b>`,txt:w[1],a:split(w[0]),w:w[0]}))}));
mount("t2","2️⃣ Dictation 🎧","Прослушайте и напишите услышанное (можно слушать много раз).",()=>({items:sh(W).slice(0,8).map(w=>({p:"<span class='tag'>Что вы слышите?</span>",txt:"(аудио)",say:say(w[0]),a:split(w[0]),w:w[0]}))}));
const G=[["Sam and Kate were a lovely ___ ; everyone said they were perfect together.","couple"],["We ___ touch after graduation and met again only ten years later.","lost"],["Maria is my ___ . We share a flat and a kitchen.","flatmate"],["He ___ to her on the beach, and she said yes!","proposed"],["Regular exercise improves your lung ___ .","capacity"],["Skipping meals can ___ our body’s natural rhythm.","disrupt"],["My ___ Anna works in the same office; she is very helpful.","colleague"],["When we first met, we ___ on really well.","got"]];
mount("t3","3️⃣ Gap fill","Вставьте слово из рамки в нужной форме (слова в рамке перемешаны).",()=>{const it=sh(G).map(g=>({p:g[0],txt:g[0],a:[g[1]],w:g[1]}));return{items:it,extra:`<div class="bank">${sh(it).map(i=>`<span class="chip">${i.a[0]==="lost"?"lose":i.a[0]==="proposed"?"propose":i.a[0]==="got"?"get":i.a[0]}</span>`).join("")}</div>`}});
const P=[["When I called Tom, he ___ (have) breakfast.",["was having"],"Past Continuous: was having"],["Last year they ___ (get married) in Kraków.",["got married"],"got married"],["We ___ (lose) touch after she had moved abroad.",["lost"],"lose touch"],["He felt dizzy because he ___ (skip) breakfast.",["had skipped"],"Past Perfect: had skipped"],["While I ___ (talk) to my colleague, the alarm rang.",["was talking"],"Past Continuous: was talking"],["They ___ (be) together for six years before they broke up.",["had been"],"Past Perfect: had been"],["I ___ (propose) to her yesterday, and she said yes!",["proposed"],"propose"],["At 8 p.m. my flatmate ___ (cook) dinner.",["was cooking"],"Past Continuous: was cooking"]];
mount("t4","4️⃣ Past Simple / Continuous / Perfect","Поставьте глагол в нужное прошедшее время (полная форма, например was having).",()=>({items:sh(P).map(g=>({p:g[0],txt:g[0],a:g[1],w:g[2]}))}));
/* free tasks */
let sw=[],ft={};
function newStory(){sw=sh(W).slice(0,5).map(w=>w[0]);upS()}
function upS(){const t=$("#st").value;$("#sc").innerHTML=chips(sw,t);$("#sn").textContent=`Использовано: ${sw.filter(w=>used(t,w)).length}/5`;$("#stn").innerHTML=tenses(t)}
const s5=document.createElement("section");s5.innerHTML=`<h2>5️⃣ Story with 5 words</h2><p class="d">Напишите мини-рассказ (6–8 предложений) в past tenses, используя все 5 слов. Счётчик отмечает использованные.</p><div id="sc"></div><div class="tag" id="sn"></div><textarea id="st" placeholder="Last summer, I was walking home when…" oninput="upS()"></textarea><div id="stn"></div><div class="bar"><button onclick="newStory()">🔀 Новые 5 слов</button><button onclick="$('#sm').hidden=!$('#sm').hidden">👁 Пример</button></div><div class="ex" id="sm" hidden>Example: Last year I was studying in the library when my old classmate got in touch. We had lost touch after school, but we became friends again because we had a lot in common.</div>`;$("#m").appendChild(s5);newStory();
const SIT=["You were at a party and met someone from your past.","You lost your phone on the way to work.","Your flatmate came home very late last night.","You were cooking when something unexpected happened.","A close friend told you surprising news.","You woke up late and skipped breakfast.","You were on holiday when you saw an old classmate.","Last weekend you went to a wedding."];
let rw=[];
function roll(){let k=0;const b=$("#dc"),iv=setInterval(()=>{b.textContent=["🎲","🎯","✨","🎡"][k++%4];if(k>8){clearInterval(iv);b.textContent="🎲";rw=sh(W).slice(0,2+Math.floor(Math.random()*2)).map(w=>w[0]);$("#rs").textContent=SIT[Math.floor(Math.random()*SIT.length)];$("#rt").value="";upR()}},90)}
function upR(){const t=$("#rt").value;$("#rc").innerHTML=chips(rw,t)+"<div>"+tenses(t)+"</div>"}
const s6=document.createElement("section");s6.innerHTML=`<h2>6️⃣ Random prompt</h2><p class="d">Бросьте кубик: получите ситуацию и 2–3 слова. Напишите 3–5 предложений в past tenses.</p><div class="bar"><span class="dice" id="dc">🎲</span><button class="p" onclick="roll()">Бросить кубик</button></div><p><b id="rs">Нажмите «Бросить кубик»</b></p><div id="rc"></div><textarea id="rt" oninput="upR()"></textarea><div class="bar"><button onclick="$('#ra').hidden=!$('#ra').hidden">👁 Подсказка</button></div><div class="ex" id="ra" hidden>Начните так: <i>When… / While I was… / By the time…, I had already…</i><br>Слова: <span id="rtr"></span></div>`;$("#m").appendChild(s6);
$("#ra").addEventListener("toggle",()=>{});new MutationObserver(()=>{$("#rtr").textContent=rw.map(w=>{const x=W.find(v=>v[0]===w);return w+" — "+x[1]}).join("; ")}).observe($("#ra"),{attributes:true});
/* two truths */
const L=[["Tom has lived alone for years and never had a partner.","Last year Tom was cooking when his flatmate burnt the toast.","He had lost touch with most of his classmates by 2020.","Tom skipped breakfast this morning and felt dizzy.",0],["Lena is single and has never been engaged.","Her ex-partner was living in Berlin when they broke up.","Lena’s fiancé proposed to her on a beach.","She had got to know her colleague at university.",1],["Max hates sport and never goes to the gym.","Last week Max was training when he hurt his muscles.","Max’s liver was fine at the last check-up.","He drinks coffee because it makes him mentally alert.",0],["Ola and Piotr met last year and are still together.","They had a lot in common when they became friends.","They broke up in 2022 and haven’t spoken since.","They are a lovely couple.",1],["Sara is an only child and lives with her parents.","She got on well with her classmate Kasia.","While Sara was studying, her flatmate was playing loud music.","Her stomach produces too much acid when she is stressed.",1],["Jan is a doctor who never eats sugar.","Jan says skipping breakfast can disrupt our body’s rhythm.","He believes too much sugar can cause diabetes.","He was eating a huge chocolate cake when I called him.",2]];
function newL(){const el=$("#lb");el.innerHTML=L.map((s,i)=>{const o=sh([1,2,3].map((k,j)=>({t:s[k],lie:j===s[4]})));return`<div class="row" data-i="${i}"><span class="n">${i+1}</span><div><div class="tag">Fact: ${s[0]}</div>${o.map(x=>`<button class="lie" data-lie="${x.lie?1:0}" onclick="gl(this)">${x.t}</button>`).join("")}</div></div>`}).join("");$("#ls").textContent=""}
function gl(b){const r=b.closest(".row");if(r.dataset.d)return;r.dataset.d=1;r.querySelectorAll(".lie").forEach(x=>{if(x.dataset.lie==="1")x.classList.add("ok")});if(b.dataset.lie==="1"){b.classList.add("ok")}else{b.classList.add("bad");addm("Two truths: "+r.querySelector(".tag").textContent.slice(6,30)+"…")}const d=document.querySelectorAll("#lb .row[data-d]").length,g=document.querySelectorAll("#lb .lie.ok.bad").length;const c=[...document.querySelectorAll("#lb .row[data-d]")].filter(x=>!x.querySelector(".bad")).length;$("#ls").textContent=`Найдено лжи: ${c}/${d} из ${L.length}`}
function sl(){document.querySelectorAll("#lb .lie[data-lie='1']").forEach(x=>x.classList.add("ok"))}
const s7=document.createElement("section");s7.innerHTML=`<h2>7️⃣ Two truths and a lie</h2><p class="d">Часть A: в каждом наборе одно предложение противоречит факту — найдите его. Часть B: напишите 3 предложения о себе (2 правды и 1 ложь) с лексикой урока.</p><div id="lb"></div><div class="bar"><button onclick="sl()">👁 Показать ответы</button><button onclick="newL()">🔀 Заново</button><span class="sc" id="ls"></span></div><h3>Part B — ваши предложения</h3><div id="ow">${[1,2,3].map(i=>`<div class="row"><span class="n">${i}</span><div class="in"><input type="text" class="oi" oninput="uo()" placeholder="I was… / I had… (past tense + слово из списка)"><label class="tag"><input type="radio" name="ol" value="${i-1}"> ложь</label></div></div>`).join("")}</div><div id="oc"></div><div class="tag" id="on"></div>`;$("#m").appendChild(s7);newL();
const oi=()=>[...document.querySelectorAll(".oi")].map(x=>x.value);
