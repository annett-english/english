<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Повторение + смена времён (B1)</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1d2433;--mu:#667;--bd:#dde1ea;--ac:#4f46e5;--ok:#15803d;--okb:#dcfce7;--no:#b91c1c;--nob:#fee2e2;--hi:#eef2ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141c;--card:#1b1e29;--tx:#e8eaf2;--mu:#9aa0b4;--bd:#2d3242;--ac:#818cf8;--ok:#4ade80;--okb:#12301d;--no:#f87171;--nob:#3a1717;--hi:#23264a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12141c;--card:#1b1e29;--tx:#e8eaf2;--mu:#9aa0b4;--bd:#2d3242;--ac:#818cf8;--ok:#4ade80;--okb:#12301d;--no:#f87171;--nob:#3a1717;--hi:#23264a;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:.2em 0}h2{font-size:1.15rem;margin:.2em 0}.mu{color:var(--mu);font-size:.9rem}
details{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;margin:10px 0}
summary{cursor:pointer;font-weight:600}details li{margin:4px 0}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 0}nav button{flex:none}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--ac)}button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
button.sel,nav button.on{background:var(--hi);border-color:var(--ac);font-weight:600}
.item{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin:10px 0}
.item.ok{border-color:var(--ok)}.item.bad{border-color:var(--no)}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
input[type=text]{font:inherit;width:100%;box-sizing:border-box;padding:7px 10px;margin-top:6px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
.acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.fb{margin-top:8px;padding:8px 10px;border-radius:8px;font-size:.93rem;display:none}
.fb.ok{display:block;background:var(--okb)}.fb.no{display:block;background:var(--nob)}.fb.info{display:block;background:var(--hi)}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}.sc{margin-left:auto;font-weight:700}
</style></head><body><main>
<h1>Повторение + смена времён · B1</h1>
<p class="mu">4 упражнения по 8 пунктов: Present Perfect Continuous и сравнение времён</p>
<details><summary>Шпаргалка по временам</summary><ul id="rules"></ul></details>
<nav id="nav"></nav><div id="view"></div>
</main>
<script>
const R={
A:"Present Perfect Continuous: have/has been + V-ing. Действие началось в прошлом и длится до сих пор, либо только что закончилось и виден результат.",
B:"Present Perfect Simple: have/has + V3. Важен результат или количество; также глаголы состояния (know, like, have).",
C:"Past Simple: V2 / did + V1. Законченное действие в прошлом с точным временем (yesterday, in 2019, last week, ago).",
D:"Present Simple: V1 / V+s. Привычки и факты (every day, usually, always).",
E:"Present Continuous: am/is/are + V-ing. Действие происходит сейчас (now, right now, at the moment).",
F:"Future Simple: will + V1. Прогноз, решение в момент речи (tomorrow, next week, I think).",
G:"С for/since нельзя Present Simple или Continuous: нужен Present Perfect (Continuous). live и work допускают обе формы.",
H:"Глаголы состояния (know, like, want, have) не используются в Continuous.",
I:"How long → чаще Present Perfect Continuous; How many/How much → Present Perfect Simple.",
J:"Вопрос и отрицание: have/has + been; did/didn’t + V1; do/does + V1; won’t + V1."};
document.getElementById("rules").innerHTML=Object.values(R).map(r=>"<li>"+r+"</li>").join("");
const EX=[
{t:"mc",title:"1. Повторение: Present Perfect Continuous",intro:"Выберите правильный вариант.",items:[
["She ___ here for two years.",["has been working","is working","worked"],0,"G","for two years + действие, длящееся сейчас."],
["I ___ him for ten years.",["have been knowing","have known","know"],1,"H","know — глагол состояния, только Simple."],
["Why are her eyes red? ___ she been crying?",["Has","Have","Is"],0,"J","she → Has she been crying?"],
["They ___ been waiting for an hour.",["haven’t","hasn’t","aren’t"],0,"J","they → haven’t been waiting."],
["How long ___ English?",["have you been learning","do you learn","did you learn"],0,"I","How long + действие, длящееся до сих пор."],
["I’m tired because I ___ all day.",["have been working","work","am working"],0,"A","Недавнее длительное действие с видимым результатом."],
["He ___ living here since 2010.",["has been","is","was"],0,"G","since 2010 → has been living."],
["I’ve lived here since 2010 = I’ve ___ here since 2010.",["been living","been lived","living"],0,"A","been + V-ing; live допускает обе формы."]]},
{t:"mc",title:"2. Choose the correct tense",intro:"Выберите правильное время.",items:[
["I ___ to the gym every Monday.",["go","am going","have been going"],0,"D","every Monday — привычка."],
["Look! It ___ right now.",["rains","is raining","has rained"],1,"E","right now — действие в процессе."],
["We ___ Paris in 2019.",["visited","have visited","have been visiting"],0,"C","in 2019 — точное время в прошлом."],
["I ___ three books this month.",["have read","have been reading","read"],0,"I","Указано количество (three books) → Present Perfect Simple."],
["Don’t call him now — he ___.",["sleeps","is sleeping","will sleep"],1,"E","now — действие происходит в этот момент."],
["I think it ___ tomorrow.",["rains","will rain","has rained"],1,"F","I think + tomorrow — прогноз."],
["She ___ here since she was a child.",["lives","has lived","lived"],1,"G","since → Present Perfect."],
["How many emails ___ today?",["have you written","have you been writing","did you write"],0,"I","How many + незавершённый период (today)."]]},
{t:"text",title:"3. Change the tense",intro:"Перепишите предложение в указанном времени (можно сокращения: I’ve, he’s, didn’t).",items:[
["Past Simple: She works here every day.","She worked here every day","C","Past Simple: V2, работал(а) тогда."],
["Present Perfect Continuous + for two years: I work here.","I have been working here for two years|I’ve been working here for two years","A","for + период → have been working."],
["Present Continuous (now): He plays football.","He is playing football|He is playing football now|He’s playing football|He’s playing football now","E","am/is/are + V-ing."],
["Future Simple (tomorrow): I visit my grandma.","I will visit my grandma tomorrow|I’ll visit my grandma tomorrow","F","will + V1."],
["Present Perfect (already): I finished the report.","I have already finished the report|I’ve already finished the report|I have finished the report already|I’ve finished the report already","B","already — результат важен сейчас: have + V3."],
["Question, Present Perfect Continuous: She has been waiting.","Has she been waiting","J","Has выносим вперёд."],
["Negative, Past Simple: They played tennis yesterday.","They didn’t play tennis yesterday|They did not play tennis yesterday","J","didn’t + V1 (не played)."],
["Present Perfect Continuous + since 2020: She lives in Kraków.","She has been living in Kraków since 2020|She has lived in Kraków since 2020","G","since + live — допустимы обе формы."]]},
{t:"text",title:"4. Fill in the gaps — mixed tenses",intro:"Впишите глагол в нужной форме. Ориентируйтесь на маркеры времени.",items:[
["I ___ (live) here since 2015.","have been living|have lived|’ve been living|’ve lived","G","since → Present Perfect."],
["Yesterday I ___ (meet) an old friend.","met","C","yesterday → Past Simple."],
["Shh! The baby ___ (sleep).","is sleeping|’s sleeping","E","Действие происходит сейчас."],
["She usually ___ (drink) tea in the morning.","drinks","D","usually — привычка, she → drinks."],
["I ___ (wait) for you for an hour! Where were you?","have been waiting|’ve been waiting","A","Длилось до сих пор + for an hour."],
["How many cups of coffee ___ (you / drink) today?","have you drunk","I","How many → Present Perfect Simple."],
["I’m sure they ___ (win) the match tomorrow.","will win|’ll win","F","I’m sure + tomorrow → will."],
["He ___ (not / call) me since Monday.","hasn’t called|has not called|hasn’t been calling|has not been calling","G","since Monday → Present Perfect."]]}
];
const norm=s=>s.toLowerCase().replace(/[’`]/g,"'").replace(/haven't/g,"have not").replace(/hasn't/g,"has not").replace(/doesn't/g,"does not").replace(/don't/g,"do not").replace(/didn't/g,"did not").replace(/won't/g,"will not").replace(/'ve/g," have").replace(/'ll/g," will").replace(/'m/g," am").replace(/'re/g," are").replace(/'s been/g," has been").replace(/'s /g," is ").replace(/[^a-z ]/g," ").replace(/\s+/g," ").trim();
const $=h=>{const d=document.createElement("div");d.innerHTML=h;return d.firstElementChild};
const nav=document.getElementById("nav"),view=document.getElementById("view");
EX.forEach((e,i)=>{const b=document.createElement("button");b.textContent="Упр. "+(i+1);b.onclick=()=>{[...nav.children].forEach(x=>x.classList.remove("on"));b.classList.add("on");view.innerHTML="";exercise(e);scrollTo(0,0)};nav.appendChild(b)});
nav.children[0].click();
function exercise(ex){
 view.appendChild($(`<div><h2>${ex.title}</h2><p class="mu">${ex.intro}</p></div>`));
 const bar=$(`<div class="bar"><button class="pri" data-a="chk">Проверить всё</button><button data-a="ans">Показать все ответы</button><button data-a="rst">Сбросить</button><span class="sc"></span></div>`);
 view.appendChild(bar);const box=document.createElement("div");view.appendChild(box);let units=[];
 const score=()=>{bar.querySelector(".sc").textContent=units.filter(u=>u.ok).length+" / "+units.length};
 function draw(){box.innerHTML="";units=[];
  ex.items.forEach((d,i)=>{
   const it=$(`<div class="item"><b>${i+1}.</b> <span class="body"></span><div class="acts"><button class="pri">Проверить</button><button>Ответ</button></div><div class="fb"></div></div>`);
   const body=it.querySelector(".body"),fb=it.querySelector(".fb"),[bc,ba]=it.querySelectorAll("button");
   const u={ok:false,...mk(ex.t,d,body)};
   const expl=()=>`<br><b>Почему:</b> ${R[u.rule]} ${u.note}`;
   u.check=()=>{if(!u.filled()){fb.className="fb info";fb.textContent="Сначала выберите или введите ответ.";return}
    u.ok=u.test();it.className="item "+(u.ok?"ok":"bad");fb.className="fb "+(u.ok?"ok":"no");
    fb.innerHTML=(u.ok?"✅ Верно!":"❌ Неверно. Правильный ответ: <b>"+u.ans+"</b>")+expl();score()};
   u.show=()=>{fb.className="fb info";fb.innerHTML="Ответ: <b>"+u.ans+"</b>"+expl()};
   bc.onclick=u.check;ba.onclick=u.show;units.push(u);box.appendChild(it)});score()}
 bar.onclick=e=>{const a=e.target.dataset.a;if(a=="chk")units.forEach(u=>u.check());if(a=="ans")units.forEach(u=>u.show());if(a=="rst")draw()};
 draw();
}
function mk(t,d,body){
 const rule=d[d.length-2],note=d[d.length-1];
 if(t=="mc"){let sel=null;body.innerHTML=`${d[0]}<div class="opts">${d[1].map(o=>`<button>${o}</button>`).join("")}</div>`;
  const bs=[...body.querySelectorAll("button")];bs.forEach((b,i)=>b.onclick=()=>{bs.forEach(x=>x.classList.remove("sel"));b.classList.add("sel");sel=i});
  return{rule,note,filled:()=>sel!==null,test:()=>sel===d[2],ans:d[1][d[2]]}}
 body.innerHTML=`${d[0]}<input type="text" autocomplete="off" autocapitalize="off" spellcheck="false">`;
 const inp=body.querySelector("input"),al=d[1].split("|").map(norm);
 return{rule,note,filled:()=>inp.value.trim()!=="",test:()=>al.includes(norm(inp.value)),ans:d[1].split("|")[0]};
}
</script></body></html>
