<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reported Speech B1 — дополнительные упражнения</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1d2233;--mu:#5d647a;--ac:#3b5bdb;--acs:#e7ecff;--ok:#2b8a3e;--oks:#e3f6e8;--bad:#c92a2a;--bads:#fde8e8;--bd:#d9dded;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13151d;--card:#1c1f2b;--tx:#e8eaf3;--mu:#9aa1b8;--ac:#8ea6ff;--acs:#27304f;--ok:#69db7c;--oks:#17301f;--bad:#ff8787;--bads:#3a1c1c;--bd:#323750;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#13151d;--card:#1c1f2b;--tx:#e8eaf3;--mu:#9aa1b8;--ac:#8ea6ff;--acs:#27304f;--ok:#69db7c;--oks:#17301f;--bad:#ff8787;--bads:#3a1c1c;--bd:#323750;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:8px 0 2px}.sub{color:var(--mu);margin:0 0 14px}
#tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}#tabs button{white-space:nowrap}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:7px 12px;border-radius:10px;cursor:pointer}
button.pri,#tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button.pri,:root:not([data-theme="light"]) #tabs button.on{color:#11131a}}
.panel{display:none;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-top:8px}.panel.on{display:block}
.panel h2{margin:0 0 4px;font-size:1.2rem}.desc{color:var(--mu);margin:0 0 12px}
.pre{background:var(--acs);border-left:4px solid var(--ac);border-radius:8px;padding:10px 12px;margin:0 0 12px}
.it{border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin:8px 0}
.it.ok{background:var(--oks);border-color:var(--ok)}.it.bad{background:var(--bads);border-color:var(--bad)}.it.shown{background:var(--acs);border-color:var(--ac)}
input{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:4px 8px;max-width:100%;box-sizing:border-box}
.fb{font-size:.92rem;color:var(--mu);margin-top:6px}.fb:empty{display:none}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}.sc{font-weight:600}
.opt{display:block;width:100%;text-align:left;margin:5px 0}
.opt.on{background:var(--acs);border-color:var(--ac)}.opt.ok{background:var(--oks);border-color:var(--ok)}.opt.bad{background:var(--bads);border-color:var(--bad)}
</style>
</head>
<body>
<main>
<h1>Reported Speech · дополнительно</h1>
<p class="sub">Три упражнения по 8 пунктов: правильно или нет, подбор пары и мини-история.</p>
<div id="tabs"></div><div id="panels"></div>
</main>
<script>
const $=(s,r=document)=>r.querySelector(s);
const norm=s=>s.toLowerCase().replace(/[’‘]/g,"'").replace(/[.!?"“”«»]/g,'').replace(/\s+/g,' ').trim();
const exp=a=>(Array.isArray(a)?a:[a]).map(norm);
const first=a=>Array.isArray(a)?a[0]:a;
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
function bar(p,chk,show,rst){const b=el('div','bar','<button class="pri">Проверить</button><button>Показать ответы</button><button>Сначала</button><span class="sc"></span>');const[a,s,r]=b.querySelectorAll('button'),sc=$('.sc',b);a.onclick=()=>sc.textContent=chk();s.onclick=()=>{show();sc.textContent=''};r.onclick=()=>{rst();sc.textContent=''};p.append(b)}

const TF=['Правильно','Неправильно'];
const EX=[
{t:'1. Right or wrong?',d:'Определите, верна ли фраза в косвенной речи.',k:'mc',items:[
{q:'He said me he was late.',o:TF,c:1,e:'После person нужен told: He told me he was late.'},
{q:'She told me she had seen the film.',o:TF,c:0,e:'Верно: told + person, Past Simple/Present Perfect → Past Perfect.'},
{q:'Tom said he would come the next day.',o:TF,c:0,e:'Верно: will → would, tomorrow → the next day.'},
{q:'They said they will help us.',o:TF,c:1,e:'will → would: They said they would help us.'},
{q:'Ann said she had to go.',o:TF,c:0,e:'Верно: must → had to.'},
{q:'He said he had arrived yesterday.',o:TF,c:1,e:'yesterday → the day before: He said he had arrived the day before.'},
{q:'She said she might be late.',o:TF,c:0,e:'Верно: may → might.'},
{q:'I told that I was ready.',o:TF,c:1,e:'Нужно said (I said I was ready) или told him (I told him I was ready).'}]},
{t:'2. Match the pair',d:'К прямой речи подберите верный пересказ.',k:'mc',items:[
{q:'«I’m cooking.»',o:['She said she was cooking.','She said she cooked.','She said she is cooking.'],c:0,e:'Present Continuous → Past Continuous.'},
{q:'«We’ll wait here.»',o:['They said they would wait here.','They said they would wait there.','They said they will wait there.'],c:1,e:'will → would; here → there.'},
{q:'«I haven’t seen it.»',o:['He said he hasn’t seen it.','He said he didn’t see it.','He said he hadn’t seen it.'],c:2,e:'Present Perfect → Past Perfect.'},
{q:'«I can’t swim.»',o:['She said she can’t swim.','She said she couldn’t swim.','She said she wouldn’t swim.'],c:1,e:'can’t → couldn’t.'},
{q:'«I went there yesterday.»',o:['He said he had gone there the day before.','He said he went there yesterday.','He said he had gone there tomorrow.'],c:0,e:'Past Simple → Past Perfect; yesterday → the day before.'},
{q:'«I must study tonight.»',o:['She said she must study tonight.','She said she would study that night.','She said she had to study that night.'],c:2,e:'must → had to; tonight → that night.'},
{q:'«I’m leaving next week.»',o:['They said they were leaving the following week.','They said they are leaving next week.','They said they left the following week.'],c:0,e:'am/are leaving → were leaving; next week → the following week.'},
{q:'«I may call you now.»',o:['He said he may call me now.','He said he might call you then.','He said he might call me then.'],c:2,e:'may → might; you → me; now → then.'}]},
{t:'3. Olga’s message',pre:'«I’m moving to Gdańsk next month. I’ve found a job. I can’t come to your birthday tonight, but I’ll call you tomorrow. I saw your sister here yesterday. I’m very happy! I must pack my things now. I’ll send you the address.»',d:'Вы пересказываете сообщение Olga другу. Впишите пропущенное слово или выражение.',k:'in',items:[
{q:'Olga said she ___ to Gdańsk the following month.',a:'was moving',e:'am moving → was moving.'},
{q:'She told me she ___ a job.',a:'had found',e:'Present Perfect → Past Perfect.'},
{q:'She said she ___ come to my birthday that night.',a:['couldn’t','could not'],e:'can’t → couldn’t; tonight → that night.'},
{q:'She said she ___ me the next day.',a:'would call',e:'will → would; tomorrow → the next day.'},
{q:'She said she had seen my sister there ___.',a:['the day before','the previous day'],e:'yesterday → the day before.'},
{q:'Olga told me she ___ very happy.',a:'was',e:'am → was.'},
{q:'She said she ___ pack her things then.',a:'had to',e:'must → had to; now → then.'},
{q:'She said she ___ me the address.',a:'would send',e:'will → would.'}]}];

const P=$('#panels'),T=$('#tabs');
EX.forEach((x,n)=>{
 const tb=el('button','',x.t.split(' ').slice(0,2).join(' '));tb.title=x.t;
 const p=el('div','panel',`<h2>${x.t}</h2><p class="desc">${x.d}</p>${x.pre?'<div class="pre">'+x.pre+'</div>':''}`);
 tb.onclick=()=>{document.querySelectorAll('#tabs button,.panel').forEach(b=>b.classList.remove('on'));tb.classList.add('on');p.classList.add('on')};
 T.append(tb);P.append(p);if(!n)tb.onclick();
 (x.k=='mc'?mc:inp)(p,x)});

function mc(p,x){
 const sel=[],cards=x.items.map((it,i)=>{const d=el('div','it',`<div><b>${i+1}.</b> ${it.q}</div>`);
  it.o.forEach((o,j)=>{const b=el('button','opt',o);b.onclick=()=>{sel[i]=j;[...d.querySelectorAll('.opt')].forEach((q,k)=>q.className='opt'+(k==j?' on':''))};d.append(b)});
  d.append(el('div','fb'));p.append(d);return d});
 const mark=(i,j,ok)=>{const d=cards[i];d.querySelectorAll('.opt').forEach((q,k)=>{q.className='opt'+(k==x.items[i].c?' ok':k==j?' bad':'')});$('.fb',d).innerHTML=(ok?'✓ ':'✗ ')+x.items[i].e};
 bar(p,()=>{let n=0;x.items.forEach((it,i)=>{const ok=sel[i]==it.c;n+=ok;mark(i,sel[i],ok)});return `Верно: ${n}/8`},
 ()=>x.items.forEach((it,i)=>mark(i,-1,true)),
 ()=>{sel.length=0;cards.forEach(d=>{d.querySelectorAll('.opt').forEach(q=>q.className='opt');$('.fb',d).innerHTML=''})})}

function inp(p,x){
 const cards=x.items.map((it,i)=>{const pt=it.q.split('___');
  const d=el('div','it',`<div><b>${i+1}.</b> ${pt[0]}<input size="14">${pt[1]}</div><div class="fb"></div>`);p.append(d);return d});
 bar(p,()=>{let n=0;x.items.forEach((it,i)=>{const d=cards[i],ok=exp(it.a).includes(norm($('input',d).value));n+=ok;d.className='it '+(ok?'ok':'bad');
   $('.fb',d).innerHTML=(ok?'✓ ':'✗ Правильно: <b>'+first(it.a)+'</b>. ')+it.e});return `Верно: ${n}/8`},
 ()=>x.items.forEach((it,i)=>{const d=cards[i];$('input',d).value=first(it.a);d.className='it shown';$('.fb',d).innerHTML='<b>'+first(it.a)+'</b>. '+it.e}),
 ()=>cards.forEach(d=>{$('input',d).value='';d.className='it';$('.fb',d).innerHTML=''}))}
</script>
</body>
</html>
