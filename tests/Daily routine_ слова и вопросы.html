<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily routine: слова и вопросы</title>
<style>
:root{--bg:#f4f1ff;--card:#fff;--ink:#241b45;--mut:#6b6490;--pri:#6c4cf5;--pri2:#ff6fb1;--ok:#17a673;--bad:#e5484d;--line:#e3dcff;--chip:#efe9ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17132b;--card:#221c3d;--ink:#f1edff;--mut:#a59fc8;--line:#3a3166;--chip:#322a58;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17132b;--card:#221c3d;--ink:#f1edff;--mut:#a59fc8;--line:#3a3166;--chip:#322a58;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Nunito","Segoe UI",system-ui,sans-serif}
header{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;padding:28px 18px 22px;text-align:center}
header h1{margin:0 0 4px;font-size:clamp(24px,5vw,38px)}
header p{margin:0;opacity:.92}
.bar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center;margin-top:14px;font-size:14px}
nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:14px 12px 0}
nav a{background:var(--card);border:2px solid var(--line);color:var(--ink);padding:5px 12px;border-radius:99px;text-decoration:none;font-size:14px;font-weight:700}
.wrap{max-width:1100px;margin:0 auto;padding:16px;display:grid;grid-template-columns:1fr 250px;gap:18px;align-items:start}
@media (max-width:860px){.wrap{grid-template-columns:1fr}aside{order:-1;position:static!important}}
section,.side{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:18px;margin-bottom:18px;box-shadow:0 6px 0 var(--line)}
aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
h2{margin:0 0 4px;font-size:21px}
.ins{color:var(--mut);margin:0 0 12px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.card{background:var(--chip);border-radius:14px;padding:10px 12px;position:relative}
.card b{display:block;font-size:17px}.card i{color:var(--pri);font-style:normal;font-size:14px}.card small{display:block;color:var(--mut)}
button{font:inherit;font-weight:800;border:0;border-radius:12px;padding:8px 14px;cursor:pointer;background:var(--pri);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.2)}
button:active{transform:translateY(2px);box-shadow:none}
button.sec{background:var(--chip);color:var(--ink)}
button.snd{position:absolute;right:8px;top:8px;padding:4px 9px;background:var(--card);color:var(--ink)}
button:disabled{opacity:.4;cursor:default}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 10px;border-radius:12px;margin-bottom:6px;border:2px solid transparent;background:var(--chip)}
.row.ok{border-color:var(--ok)}.row.no{border-color:var(--bad)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:10px;padding:5px 9px;min-width:110px;max-width:100%}
input.wide,textarea{width:100%}
.fb{font-weight:900}.ok .fb{color:var(--ok)}.no .fb{color:var(--bad)}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.score{font-weight:900;color:var(--pri)}
.rule{background:var(--chip);border-left:6px solid var(--pri2);border-radius:12px;padding:10px 14px;margin:8px 0}
.rule code{background:var(--card);padding:2px 8px;border-radius:8px;font-weight:800;display:inline-block;margin:2px 0}
.ex{cursor:pointer;display:block;margin:3px 0}
.chip{display:inline-block;background:var(--pri2);color:#fff;border-radius:99px;padding:2px 10px;margin:3px 3px 0 0;font-weight:700;font-size:14px}
.big{font-size:26px;font-weight:900;text-align:center;margin:10px 0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts button{background:var(--chip);color:var(--ink);text-align:left}
.opts button.good{background:var(--ok);color:#fff}.opts button.wrong{background:var(--bad);color:#fff}
.bank span{display:inline-block;background:var(--chip);border-radius:8px;padding:1px 9px;margin:2px;font-weight:700}
.pop{position:fixed;left:50%;top:40%;font-size:80px;transform:translate(-50%,-50%);animation:pop 1s forwards;pointer-events:none;z-index:9}
@keyframes pop{to{opacity:0;transform:translate(-50%,-120%) scale(1.6)}}
#out{width:100%;min-height:120px;margin-top:8px}
</style></head><body>
<header><h1>🌞 My Daily Routine</h1><p>Слова + вопросы в Present Simple</p>
<div class="bar"><span id="vs">🔊 Голос: …</span><button class="sec" id="vt">Проверить звук</button></div></header>
<nav><a href="#s-rec">📚 Слова</a><a href="#s-vocab">🧩 Лексика</a><a href="#s-mil">💰 Миллионер</a><a href="#s-rule">❓ Правила</a><a href="#s-gram">✏️ Грамматика</a><a href="#s-copy">📋 Ответы</a></nav>
<div class="wrap"><main id="m"></main>
<aside><div class="side"><h2>⚠️ Проблемные слова</h2><p class="ins">Здесь появятся слова, где была ошибка.</p><div id="pw"></div></div></aside></div>
<script>
const $=s=>document.querySelector(s);
const norm=s=>s.toLowerCase().replace(/[’'`]/g,"").replace(/[.,!?;:"]/g,"").replace(/\s+/g," ").trim();
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const M=$("#m"),probs=new Set();
/* ---------- audio ---------- */
let voice=null;
function pick(){const vs=speechSynthesis.getVoices();voice=vs.find(v=>v.name==="Google US English")||vs.find(v=>/samantha/i.test(v.name))||vs.find(v=>v.lang==="en-US")||vs.find(v=>/^en/.test(v.lang))||null;
$("#vs").textContent=voice?"🔊 Голос: "+voice.name:"🔇 Голос не найден — проверьте звук браузера"}
function say(t,done){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";if(voice)u.voice=voice;u.rate=.9;if(done)u.onend=done;speechSynthesis.speak(u)}catch(e){$("#vs").textContent="🔇 Аудио недоступно"}}
if("speechSynthesis" in window){pick();speechSynthesis.onvoiceschanged=pick}
$("#vt").onclick=()=>say("Hello! Let’s practise English.");
/* ---------- data ---------- */
const V=[
["go shopping","/ɡoʊ ˈʃɑːpɪŋ/","ходить за покупками","I go shopping at weekends."],
["go running","/ɡoʊ ˈrʌnɪŋ/","ходить на пробежку","I go running twice a week."],
["meet somebody for a coffee","/miːt ˈsʌmbɑːdi fɔːr ə ˈkɔːfi/","встретиться за чашечкой кофе","I often meet my friends for a coffee."],
["meet somebody for lunch","/miːt ˈsʌmbɑːdi fɔːr lʌntʃ/","встретиться за обедом","I sometimes meet my colleagues for lunch."],
["check messages","/tʃek ˈmesɪdʒɪz/","проверять сообщения","I check my messages in the morning."],
["check emails","/tʃek ˈiːmeɪlz/","проверять электронную почту","I check my emails every day."],
["spend time online","/spend taɪm ˌɑːnˈlaɪn/","проводить время в интернете","I spend a lot of time online."],
["spend time with your family","/spend taɪm wɪð jɔːr ˈfæməli/","проводить время с семьёй","I like to spend time with my family."],
["go to the party","/ɡoʊ tə ðə ˈpɑːrti/","идти на вечеринку","I’m going to the party tonight."],
["go to the meeting","/ɡoʊ tə ðə ˈmiːtɪŋ/","идти на встречу / собрание","I have to go to the meeting at 10."],
["get up early","/ɡet ʌp ˈɜːrli/","рано вставать","I usually get up early."],
["get up late","/ɡet ʌp leɪt/","поздно вставать","I sometimes get up late at weekends."]];
const W=k=>V.find(v=>v[0].startsWith(k))[0];
function bad(w){if(w&&!probs.has(w)){probs.add(w);$("#pw").innerHTML=[...probs].map(x=>`<span class="chip">${x}</span>`).join("")}}
function boom(){const e=document.createElement("div");e.className="pop";e.textContent="🎉";document.body.append(e);setTimeout(()=>e.remove(),1000)}
function sec(id,t,ins){const s=document.createElement("section");s.id=id;s.innerHTML=`<h2>${t}</h2><p class="ins">${ins}</p>`;M.append(s);return s}
const btn=(t,c,f)=>{const b=document.createElement("button");b.textContent=t;if(c)b.className=c;if(f)b.onclick=f;return b};
/* ---------- recap ---------- */
{const s=sec("s-rec","📚 Повторим слова","Нажимай 🔊 — слушай и повторяй вслух. Потом попробуй вспомнить перевод, не глядя.");
const g=document.createElement("div");g.className="grid";
V.forEach(v=>{const c=document.createElement("div");c.className="card";c.innerHTML=`<b>${v[0]}</b><i>${v[1]}</i><small>${v[2]}</small><small>👉 ${v[3]}</small>`;c.append(btn("🔊","snd",()=>say(v[0]+". "+v[3])));g.append(c)});
s.append(g);const t=document.createElement("div");t.className="tools";
t.append(btn("▶️ Слушать все слова","",()=>{let i=0;const n=()=>{if(i<V.length)say(V[i++][0],()=>setTimeout(n,500))};n()}),btn("⏹ Стоп","sec",()=>speechSynthesis.cancel()));s.append(t)}
/* ---------- exercise engine ---------- */
const EX=[];
function mk(o){const s=sec(o.id,o.t,o.ins);EX.push(o);o.rows=[];
if(o.bank){const b=document.createElement("div");b.className="bank";b.innerHTML=shuffle(o.bank).map(x=>`<span>${x}</span>`).join("");s.append(b)}
o.items.forEach(it=>{const r=document.createElement("div");r.className="row";let c;
if(o.kind==="match"){c=document.createElement("select");c.innerHTML='<option value="">—</option>'+o.pool.map(p=>`<option>${p}</option>`).join("")}
else if(o.kind==="free"){c=document.createElement("textarea");c.rows=2}
else{c=document.createElement("input");c.autocomplete="off";c.spellcheck=false}
const fb=document.createElement("span");fb.className="fb";const p=it.q.split("___");
if(p.length>1){r.append(p[0],c,p[1])}else{r.append(it.q);if(o.kind!=="match"){c.classList.add("wide")}r.append(c)}
r.append(fb);s.append(r);o.rows.push({it,c,fb,r})});
const t=document.createElement("div");t.className="tools";const sc=document.createElement("span");sc.className="score";
const val=x=>o.kind==="match"?x.it.a.includes(x.c.value):x.it.a.map(norm).includes(norm(x.c.value));
if(o.kind!=="free")t.append(btn("✅ Проверить","",()=>{let n=0;o.rows.forEach(x=>{const ok=val(x);x.r.classList.toggle("ok",ok);x.r.classList.toggle("no",!ok);x.fb.textContent=ok?"✓":"✗";if(ok)n++;else bad(x.it.w)});sc.textContent=n+" / "+o.rows.length;if(n===o.rows.length)boom()}));
t.append(btn(o.kind==="free"?"💡 Пример":"👀 Показать ответы","sec",()=>{o.rows.forEach(x=>{x.c.value=x.it.a[0];x.r.classList.remove("ok","no");x.fb.textContent=""});sc.textContent=""}));
t.append(btn("🔄 Заново","sec",()=>{o.rows.forEach(x=>{x.c.value="";x.r.classList.remove("ok","no");x.fb.textContent=""});sc.textContent=""}),sc);s.append(t)}
/* ---------- vocab exercises ---------- */
const m1=["go shopping","go running","meet somebody for a coffee","meet somebody for lunch","check messages","check emails","spend time online","spend time with your family"].map(k=>V.find(v=>v[0]===k));
mk({id:"s-vocab",t:"1️⃣ Match: слово ↔ перевод",ins:"Выбери правильный перевод.",kind:"match",pool:shuffle(m1.map(v=>v[2])),items:shuffle(m1).map(v=>({q:v[0],a:[v[2]],w:v[0]}))});
/* speed match */
{const s=sec("s-speed","2️⃣ Speed match ⚡","45 секунд: выбирай правильный перевод как можно быстрее.");
const wd=document.createElement("div");wd.className="big";wd.textContent="Готов?";const bs=document.createElement("div");bs.className="opts";const info=document.createElement("div");info.className="score";
let sc=0,left=0,tm=null,cur;window.speedScore="не играл(а)";
const next=()=>{cur=V[Math.floor(Math.random()*V.length)];wd.textContent=cur[0];bs.innerHTML="";shuffle([cur,...shuffle(V.filter(v=>v!==cur)).slice(0,3)]).forEach(o=>bs.append(btn(o[2],"",()=>{if(o===cur)sc++;else bad(cur[0]);info.textContent=`⏱ ${left}с · ✅ ${sc}`;next()})))};
const go=btn("▶️ Старт","",()=>{sc=0;left=45;go.disabled=true;next();clearInterval(tm);tm=setInterval(()=>{left--;info.textContent=`⏱ ${left}с · ✅ ${sc}`;if(left<=0){clearInterval(tm);bs.innerHTML="";wd.textContent=`Результат: ${sc} 🎯`;window.speedScore=sc;go.disabled=false;go.textContent="🔁 Ещё раз";if(sc>=10)boom()}},1000)});
s.append(wd,bs,info,go)}
mk({id:"s-halves",t:"3️⃣ Соедини половинки",ins:"Выбери окончание выражения.",kind:"match",
pool:shuffle(["shopping","a coffee","lunch","messages","with my family","late","party"]),
items:shuffle([["go","shopping"],["meet my friends for","a coffee"],["meet my colleagues for","lunch"],["check my","messages"],["spend time","with my family"],["get up","late"],["go to the","party"]]).map(x=>({q:x[0],a:[x[1]],w:x[0]==="go to the"?W("go to the party"):x[0]==="go"?W("go shopping"):x[0].startsWith("meet my f")?W("meet somebody for a"):x[0].startsWith("meet")?W("meet somebody for l"):x[0]==="check my"?W("check m"):x[0]==="get up"?W("get up late"):W("spend time with")}))});
mk({id:"s-col",t:"4️⃣ Допиши словосочетание",ins:"Впиши одно слово. В скобках подсказка по-русски.",items:shuffle([
{q:"I check my ___ in the morning. (сообщения)",a:["messages"],w:W("check m")},
{q:"I often spend time ___ my family. (с)",a:["with"],w:W("spend time with")},
{q:"I get up ___ at weekends. (поздно)",a:["late"],w:W("get up late")},
{q:"She goes ___ twice a week. (на пробежку)",a:["running"],w:W("go running")},
{q:"I sometimes meet my colleagues ___ lunch. (за)",a:["for"],w:W("meet somebody for l")},
{q:"I’m going ___ the party tonight. (на)",a:["to"],w:W("go to the party")},
{q:"He spends a lot of time ___ . (в интернете)",a:["online"],w:W("spend time online")},
{q:"Let’s meet ___ a coffee. (за чашечкой)",a:["for"],w:W("meet somebody for a")}])});
mk({id:"s-ctx",t:"5️⃣ Вставь слово по контексту",ins:"Выбери слово из рамки и впиши его.",bank:["shopping","running","lunch","messages","up","party","online","with"],items:shuffle([
{q:"I go ___ at weekends. I buy clothes and food.",a:["shopping"],w:W("go shopping")},
{q:"She goes ___ in the park twice a week.",a:["running"],w:W("go running")},
{q:"We sometimes meet for ___ in a café at 1 o’clock.",a:["lunch"],w:W("meet somebody for l")},
{q:"I check my ___ before work.",a:["messages"],w:W("check m")},
{q:"What time do you get ___ at weekends?",a:["up"],w:W("get up late")},
{q:"I’m going to the ___ tonight. It’s my friend’s birthday.",a:["party"],w:W("go to the party")},
{q:"Teenagers spend a lot of time ___ .",a:["online"],w:W("spend time online")},
{q:"I like to spend time ___ my family.",a:["with"],w:W("spend time with")}])});
mk({id:"s-own",t:"6️⃣ Напиши своё предложение",ins:"Проверь себя сам(а) или вместе с учителем. «Пример» — подсказка.",kind:"free",items:[
{q:"go running — про себя",a:["I go running on Sundays."]},{q:"meet somebody for lunch — про друга (he/she)",a:["My friend meets her colleagues for lunch."]},
{q:"spend time online — про брата/сестру",a:["My brother spends a lot of time online."]},{q:"get up — про свой выходной",a:["I get up late at weekends."]}]});
mk({id:"s-tl",t:"7️⃣ Two truths and a lie 🤥",ins:"Напиши 3 предложения о себе: 2 правды и 1 ложь. Партнёр угадывает, где ложь!",kind:"free",items:[
{q:"Sentence 1",a:["I go shopping at weekends."]},{q:"Sentence 2",a:["I check my emails every day."]},{q:"Sentence 3",a:["I get up at five o’clock."]}]});
/* ---------- millionaire ---------- */
{const s=sec("s-mil","8️⃣ Кто хочет стать миллионером? 💰","15 вопросов. Несгораемые суммы: вопрос 5 и вопрос 10. Подсказки: 50:50 и 💡.");
const L=[100,200,300,500,1000,2000,4000,8000,16000,32000,64000,125000,250000,500000,1000000];
const Q=[
["«ходить на пробежку»",["go running","do running","make running","walk running"],"go + -ing: go shopping, go running."],
["I ___ my emails every day.",["check","checks","checking","does check"],"I → глагол без -s."],
["«встретиться за обедом»",["meet for lunch","meet on lunch","meet with lunch","meet in lunch"],"Предлог для еды: for."],
["She ___ up early.",["gets","get","getting","does gets"],"she → глагол + -s."],
["Which question is correct?",["Does he like to get up late?","Do he like to get up late?","Does he likes to get up late?","Does he like to gets up late?"],"he → does + глагол без -s."],
["I like to spend time ___ my family.",["with","to","at","for"],"«С семьёй» = with."],
["What time ___ you get up?",["do","does","are","is"],"you → do."],
["«проверять сообщения»",["check messages","control messages","test messages","verify messages"],"Часто используем check."],
["She ___ shopping at weekends.",["goes","go","gos","is go"],"go → goes для she."],
["Which question is correct?",["Where does she go shopping?","Where she does go shopping?","Where does she goes shopping?","Where do she go shopping?"],"Слово + does + she + go."],
["«проводить время в интернете» — spend time ___",["online","in online","at online","by online"],"Одно слово."],
["«идти на собрание»",["go to the meeting","go in the meeting","go at the meeting","go on the meeting"],"Идти куда-то = go to."],
["Which sentence is correct?",["He doesn’t check his emails.","He doesn’t checks his emails.","He don’t check his emails.","He not check his emails."],"doesn’t + глагол без -s."],
["How often ___ you meet friends for a coffee?",["do","does","are","have"],"you → do."],
["Question for: “He gets up at six.”",["What time does he get up?","What time do he get up?","What time does he gets up?","What time he gets up?"],"What time + does + he + get up."]];
const top=document.createElement("div");top.className="big";const hint=document.createElement("div");hint.className="ins";const bx=document.createElement("div");bx.className="opts";const tl=document.createElement("div");tl.className="tools";
let i=0,f5=false,hh=false,res="не играл(а)";const lv=()=>i>=10?L[9]:i>=5?L[4]:0;
const end=(m)=>{bx.innerHTML="";hint.textContent="";top.textContent=m;res=m;tl.querySelectorAll("button").forEach(b=>b.disabled=true);r.disabled=false;r.style.display=""};
const draw=()=>{const [q,o,h]=Q[i];hint.textContent="";top.innerHTML=`Вопрос ${i+1}/15 · 💰 ${L[i].toLocaleString("ru")}${i===4||i===9?" 🔒":""}<br><span style="font-size:19px">${q}</span>`;bx.innerHTML="";
shuffle(o).forEach(x=>{const b=btn(x,"",()=>{if(x===o[0]){b.className="good";if(i===14){end("🏆 МИЛЛИОН! Ты чемпион!");boom()}else setTimeout(()=>{i++;draw()},500)}else{b.className="wrong";bad(q.length<40?q:null);setTimeout(()=>end(`Неверно. Правильно: «${o[0]}». Ты уносишь 💰 ${lv().toLocaleString("ru")}`),600)}});bx.append(b)})};
const b5=btn("50:50","sec",()=>{if(f5)return;f5=true;b5.disabled=true;const c=Q[i][1][0];shuffle([...bx.children].filter(b=>b.textContent!==c)).slice(0,2).forEach(b=>{b.disabled=true;b.textContent="—"})});
const bh=btn("💡 Подсказка","sec",()=>{if(hh)return;hh=true;bh.disabled=true;hint.textContent="💡 "+Q[i][2]});
const r=btn("🔁 Играть","",()=>{i=0;f5=hh=false;b5.disabled=bh.disabled=false;r.style.display="none";draw()});
tl.append(b5,bh,r);s.append(top,hint,bx,tl);b5.disabled=bh.disabled=true;window.milRes=()=>res}
/* ---------- rules ---------- */
{const s=sec("s-rule","❓ Напоминание: как строить вопрос","Нажимай на примеры, чтобы послушать.");
s.insertAdjacentHTML("beforeend",`<div class="rule"><b>Формула:</b><br><code>вопросительное слово</code> + <code>do / does</code> + <code>кто</code> + <code>глагол</code> + …</div>
