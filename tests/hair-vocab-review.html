<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hair & Grooming — повторение</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f4ef;--card:#fff;--tx:#1f2328;--mut:#6b7280;--bd:#e3dfd6;--ac:#2f6f5e;--ok:#1a7f4b;--okb:#dff3e8;--bad:#b42318;--badb:#fde8e6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#16181a;--card:#202326;--tx:#e9e9e6;--mut:#9aa0a6;--bd:#33373b;--ac:#6fc2a8;--ok:#6fd49b;--okb:#1d3528;--bad:#ff8a7e;--badb:#3d2220}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:24px;margin:8px 0 4px}h2{font-size:18px;margin:0 0 4px}
.sub{color:var(--mut);font-size:14px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:1fr 260px;gap:16px;align-items:start}
@media(max-width:820px){.grid{grid-template-columns:1fr}aside{order:-1}}
aside{position:sticky;top:12px}
.vocab{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.w{display:flex;align-items:center;gap:8px;border:1px solid var(--bd);border-radius:10px;padding:8px 10px}
.w b{display:block}.w i{color:var(--mut);font-style:normal;font-size:13px}.w small{display:block;font-size:13px}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:6px 12px}
button:hover{border-color:var(--ac)}.sp{padding:4px 8px;flex:none}
.pri{background:var(--ac);color:var(--bg);border-color:var(--ac)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px;font-size:14px}#vstat{color:var(--mut)}
ol{padding-left:24px;margin:8px 0}li{margin:12px 0}.q{display:block;margin-bottom:4px}
.bank{background:var(--bg);border:1px dashed var(--bd);border-radius:8px;padding:8px 10px;font-weight:600;color:var(--ac);margin-bottom:8px}
input[type=text],textarea{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
input.ok{border-color:var(--ok);background:var(--okb)}input.bad{border-color:var(--bad);background:var(--badb)}
.res{font-size:14px;margin-top:3px}.res .g{color:var(--ok)}.res .r{color:var(--bad)}.res .a{color:var(--mut)}
.hint{font-size:13px;color:var(--mut)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}.score{font-weight:600;margin-left:auto}
table{width:100%;border-collapse:collapse;font-size:14px}td{padding:4px 2px;border-bottom:1px solid var(--bd)}
#rep{height:180px;margin-top:8px;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
<h1>Hair & Grooming — повторение 🔁</h1>
<p class="sub">Быстрый повтор слов и 3 упражнения. Все ответы пишем руками.</p>

<div class="card">
<h2>Слова</h2>
<p class="sub">🎧 Задание: прослушайте каждое слово (Google US English / Samantha) и повторите вслух.</p>
<div class="vocab" id="vocab"></div>
<div class="bar">
<button class="pri" id="playall">▶ Прослушать все</button>
<button id="vtest">🔈 Проверить звук</button>
<label>Скорость <input type="range" id="rate" min="0.6" max="1.1" step="0.1" value="0.9"></label>
<span id="vstat"></span>
</div>
</div>

<div class="grid">
<main id="main"></main>
<aside>
<div class="card">
<h2>Проблемные слова</h2>
<p class="sub">Слова, в которых была ошибка</p>
<table id="prob"></table>
<div class="ctl"><button id="clrp">Очистить</button></div>
</div>
</aside>
</div>

<div class="card">
<h2>Итог</h2>
<div class="ctl">
<button class="pri" id="chkall">Проверить всё</button>
<button id="copy">📋 Скопировать мои ответы</button>
<span id="cstat" class="hint"></span>
</div>
<textarea id="rep" readonly placeholder="Здесь появится отчёт с вашими ответами и правильными вариантами"></textarea>
</div>
</div>

<script>
const V=[['dry','/draɪ/','сушить'],['style','/staɪl/','делать укладку'],['straighten','/ˈstreɪtn/','выпрямлять'],['wash','/wɑːʃ/','мыть'],['curl','/kɜːrl/','завивать'],['tie','/taɪ/','завязывать, собирать'],['grow','/ɡroʊ/','отращивать'],['shave','/ʃeɪv/','брить(ся)'],['cut','/kʌt/','стричь'],['pluck','/plʌk/','выщипывать'],['brush','/brʌʃ/','расчёсывать'],['braid','/breɪd/','плести косу'],['dye','/daɪ/','красить (волосы)'],['a bad haircut','/ə bæd ˈherkʌt/','неудачная стрижка'],['greasy hair','/ˈɡriːsi her/','жирные волосы'],['frizzy hair','/ˈfrɪzi her/','пушистые, непослушные волосы']];
const TR=Object.fromEntries(V.map(v=>[v[0],v[2]]));
const $=s=>document.querySelector(s);
const norm=s=>s.toLowerCase().replace(/[’`]/g,"'").replace(/[^a-z' ]/g,' ').replace(/\s+/g,' ').trim();

/* audio */
let voice=null;
function pick(){const v=speechSynthesis.getVoices();voice=v.find(x=>/google us english/i.test(x.name))||v.find(x=>/samantha/i.test(x.name))||v.find(x=>x.lang==='en-US'||x.lang==='en_US')||v.find(x=>/^en/i.test(x.lang))||null;
$('#vstat').textContent=!('speechSynthesis' in window)?'⚠ Озвучка не поддерживается этим браузером':voice?'Голос: '+voice.name:'⚠ Английский голос не найден — откройте страницу в Chrome или Safari';}
function say(t,cb){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';if(voice)u.voice=voice;u.rate=+$('#rate').value;if(cb)u.onend=cb;speechSynthesis.speak(u);}
if('speechSynthesis' in window){pick();speechSynthesis.onvoiceschanged=pick;}
$('#vtest').onclick=()=>{pick();say('Audio check. Wash, dry, brush, braid.');};
$('#playall').onclick=()=>{let i=0;const n=()=>{if(i<V.length)say(V[i++][0],()=>setTimeout(n,350));};n();};
$('#vocab').innerHTML=V.map(v=>`<div class="w"><button class="sp" data-s="${v[0]}" aria-label="Прослушать">🔊</button><div><b>${v[0]}</b><i>${v[1]}</i><small>${v[2]}</small></div></div>`).join('');
document.addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(b)say(b.dataset.s);});

/* data: [question, [accepted], tag] */
const BANK='dry · style · straighten · wash · curl · tie · grow · shave · cut · pluck · brush · braid · dye · a bad haircut · greasy hair · frizzy hair';
const EX=[
{t:'1. Вставьте подходящее слово или выражение',d:'Впишите нужное слово из рамки. Если нужно, поставьте глагол в правильную форму.',bank:BANK,it:[
['It\'s cold! Don\'t go out with wet hair, ___ it first.',['dry'],'dry'],
['He ___ his beard every morning with a razor.',['shaves'],'shave'],
['My hair is so ___ after a week without shampoo.',['greasy','greasy hair'],'greasy hair'],
['I\'m going to ___ my hair blue for the party.',['dye'],'dye'],
['She ___ her eyebrows with tweezers.',['plucks'],'pluck'],
['My mum always ___ my hair into two braids when I was little.',['braided'],'braid'],
['I\'m so upset. I got ___ yesterday and my hair is too short.',['a bad haircut'],'a bad haircut'],
['Please ___ your hair back; it\'s in your eyes.',['tie'],'tie'],
['She has ___ hair, so she always uses a lot of conditioner.',['frizzy','frizzy hair'],'frizzy hair'],
['You should ___ your hair before you go to bed.',['brush'],'brush']]},
{t:'2. Какое слово подходит к определению?',d:'Прочитайте определение и напишите слово по теме (глагол — в начальной форме).',it:[
['hair that is dry, puffy and hard to control',['frizzy hair','frizzy'],'frizzy hair'],
['to put colour on your hair',['dye'],'dye'],
['to make hair wavy or curly',['curl'],'curl'],
['to remove hair from the face with a razor',['shave'],'shave'],
['to make hair look nice with gel or a hairdryer',['style'],'style'],
['to let your hair become longer',['grow'],'grow'],
['hair that is oily and looks dirty',['greasy hair','greasy'],'greasy hair'],
['to make hair dry with warm air',['dry','blow dry','blow-dry'],'dry'],
['to make hair straight',['straighten'],'straighten'],
['to remove hair one by one with tweezers',['pluck'],'pluck']]},
{t:'3. Найдите ошибку и перепишите предложение правильно',d:'В каждом предложении есть одна ошибка (время, форма глагола или порядок слов). Напишите верный вариант целиком.',it:[
['She wash her hair every day.',['She washes her hair every day'],'wash'],
['Yesterday I cuted my hair.',['Yesterday I cut my hair','I cut my hair yesterday'],'cut'],
['Tomorrow I will to tie my hair back.',['Tomorrow I will tie my hair back',"Tomorrow I'll tie my hair back"],'tie'],
['He was dry his hair when the phone rang.',['He was drying his hair when the phone rang'],'dry'],
['She has grew her hair for two years.',['She has grown her hair for two years',"She's grown her hair for two years"],'grow'],
['He is have a bad haircut.',['He has a bad haircut',"He's got a bad haircut",'He has got a bad haircut','He is having a bad haircut'],'a bad haircut'],
['I didn\'t brushed my hair this morning.',["I didn't brush my hair this morning",'I did not brush my hair this morning'],'brush'],
['My brother have shaved his head last week.',['My brother shaved his head last week','Last week my brother shaved his head'],'shave'],
['Look! She braids her hair now.',['Look! She is braiding her hair',"Look! She's braiding her hair",'She is braiding her hair',"She's braiding her hair",'Look she is braiding her hair now','She is braiding her hair now'],'braid']]}
];

/* render */
$('#main').innerHTML=EX.map((e,x)=>`<section class="card"><h2>${e.t}</h2><p class="sub">${e.d}</p>${e.bank?'<div class="bank">'+e.bank+'</div>':''}<ol>${e.it.map((q,i)=>`<li><span class="q">${q[0]}</span><input type="text" id="i${x}_${i}" autocomplete="off" autocapitalize="off" spellcheck="false"><div class="res" id="r${x}_${i}"></div></li>`).join('')}</ol>
<div class="ctl"><button class="pri" data-c="${x}">Проверить</button><button data-a="${x}">Показать ответы</button><button data-z="${x}">Сбросить</button><span class="score" id="s${x}"></span></div></section>`).join('');

/* problems */
let P={};const last={};
function drawP(){const k=Object.keys(P).sort((a,b)=>P[b]-P[a]);$('#prob').innerHTML=k.length?k.map(w=>`<tr><td><button class="sp" data-s="${w}">🔊</button></td><td><b>${w}</b><br><span class="hint">${TR[w]}</span></td><td>×${P[w]}</td></tr>`).join(''):'<tr><td class="hint">Пока ошибок нет 👍</td></tr>';}
$('#clrp').onclick=()=>{P={};drawP();};drawP();
function bad(tag,key,val){if(last[key]!==val){last[key]=val;P[tag]=(P[tag]||0)+1;}}

/* check */
function check(x){const e=EX[x];let ok=0;
e.it.forEach((q,i)=>{const inp=$('#i'+x+'_'+i),r=$('#r'+x+'_'+i),v=inp.value;inp.classList.remove('ok','bad');
if(!v.trim()){r.innerHTML='';return;}const n=norm(v);
if(q[1].some(a=>norm(a)==n)){ok++;inp.classList.add('ok');r.innerHTML='<span class="g">✓ Верно</span>';}
else{inp.classList.add('bad');r.innerHTML='<span class="r">✗ Попробуйте ещё</span>';bad(q[2],x+'_'+i,n);}});
$('#s'+x).textContent=ok+' / '+e.it.length;drawP();}
function show(x){EX[x].it.forEach((q,i)=>{$('#r'+x+'_'+i).innerHTML+=` <span class="a">→ ${q[1].join(' / ')}</span>`;});}
function reset(x){EX[x].it.forEach((q,i)=>{const n=$('#i'+x+'_'+i);n.value='';n.className='';$('#r'+x+'_'+i).innerHTML='';delete last[x+'_'+i];});$('#s'+x).textContent='';}
document.addEventListener('click',e=>{const t=e.target;if(t.dataset.c!==undefined)check(+t.dataset.c);if(t.dataset.a!==undefined)show(+t.dataset.a);if(t.dataset.z!==undefined)reset(+t.dataset.z);});

/* report */
function report(){let o='HAIR & GROOMING — ПОВТОРЕНИЕ — мои ответы\n',tot=0,okc=0;
EX.forEach((e,x)=>{o+='\n'+e.t+'\n';e.it.forEach((q,i)=>{const inp=$('#i'+x+'_'+i),v=inp.value.trim(),c=inp.classList;
const m=!v?'—':c.contains('ok')?'✓':c.contains('bad')?'✗':'?';tot++;if(m=='✓')okc++;
o+=`${i+1}. ${q[0]}\n   Мой ответ: ${v||'(пусто)'} ${m}\n   Правильно: ${q[1].join(' / ')}\n`;});});
o+='\nВерно: '+okc+' из '+tot+'\nПроблемные слова: '+(Object.keys(P).map(w=>w+' ×'+P[w]).join(', ')||'нет')+'\n';return o;}
$('#chkall').onclick=()=>{EX.forEach((e,x)=>check(x));$('#rep').value=report();};
$('#copy').onclick=()=>{EX.forEach((e,x)=>check(x));const t=report(),a=$('#rep');a.value=t;a.select();
const ok=()=>$('#cstat').textContent='✓ Скопировано';const fb=()=>{try{document.execCommand('copy')?ok():$('#cstat').textContent='Выделите текст ниже и скопируйте (Ctrl/Cmd+C)';}catch(_){$('#cstat').textContent='Выделите текст ниже и скопируйте (Ctrl/Cmd+C)';}};
(navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(t).then(ok,fb):fb());};
</script>
</body>
</html>
