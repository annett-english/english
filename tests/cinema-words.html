<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cinema Words · B1</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4efe6;--card:#fffdf8;--ink:#1c1a17;--mut:#6b655c;--gold:#b8860b;--red:#b3261e;--grn:#1f7a45;--line:#d9d0bf;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0d0c;--card:#1a1816;--ink:#f3ecdd;--mut:#a39b8c;--gold:#f5c542;--red:#ff6b5e;--grn:#5fd18a;--line:#2e2a25;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e0d0c;--card:#1a1816;--ink:#f3ecdd;--mut:#a39b8c;--gold:#f5c542;--red:#ff6b5e;--grn:#5fd18a;--line:#2e2a25;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Manrope,system-ui,sans-serif}
.strip{height:18px;background:repeating-linear-gradient(90deg,var(--ink) 0 14px,transparent 14px 28px) center/100% 8px no-repeat,var(--gold)}
header{padding:18px 16px 8px;max-width:1100px;margin:auto}
h1{font:400 clamp(38px,8vw,64px)/1 'Bebas Neue',Impact,sans-serif;letter-spacing:2px;margin:0}
h1 span{color:var(--gold)}
.sub{color:var(--mut);font-size:14px}
#nav{display:flex;gap:6px;flex-wrap:wrap;max-width:1100px;margin:8px auto;padding:0 16px}
#nav button{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:var(--card);color:var(--ink);font-weight:800;cursor:pointer}
#nav button.on{background:var(--gold);color:#111;border-color:var(--gold)}
.wrap{display:grid;grid-template-columns:1fr 240px;gap:16px;max-width:1100px;margin:auto;padding:8px 16px 40px}
@media(max-width:800px){.wrap{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
h2{font:400 32px/1.1 'Bebas Neue',Impact,sans-serif;letter-spacing:1px;margin:0 0 4px}
.ins{color:var(--mut);margin:0 0 14px}
.btn{background:var(--gold);color:#111;border:0;border-radius:10px;padding:9px 16px;font-weight:800;cursor:pointer;font-family:inherit;font-size:15px}
.btn.g{background:transparent;color:var(--ink);border:2px solid var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px;align-items:center}
.q{border:2px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.q.ok{border-color:var(--grn)}.q.bad{border-color:var(--red)}
.qt{margin-bottom:8px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:8px 12px;font:inherit;cursor:pointer;text-align:left}
.opt:hover{border-color:var(--gold)}
.opt.sel,.opt.pick{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 22%,transparent)}
.opt.right{border-color:var(--grn);background:color-mix(in srgb,var(--grn) 25%,transparent)}
.opt.done{opacity:.35}
.shake{animation:sh .4s;border-color:var(--red)}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
input[type=text],select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;max-width:520px}
textarea{max-width:none;min-height:60px}
.spk{border:0;background:var(--gold);border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:16px}
.ans{display:none;color:var(--grn);font-weight:700;margin-top:6px}
.ans.v{display:block}
.mut{color:var(--mut)}
.res{font-weight:800;color:var(--gold);margin-top:8px}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.w{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.w b{font-size:18px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cols>div{display:grid;gap:8px;align-content:start}
.bar{font-size:20px;margin-bottom:10px}
aside .card{position:sticky;top:12px}
aside h3{font:400 24px 'Bebas Neue',Impact,sans-serif;margin:0 0 8px;color:var(--red)}
.p{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:14px}
.p i{font-style:normal;background:var(--red);color:#fff;border-radius:8px;padding:0 7px;font-size:12px}
.sa button{margin:2px}
.sa .opt{padding:4px 9px;font-size:13px}
</style></head><body>
<div class="strip"></div>
<header><h1>CINEMA <span>WORDS</span> · B1</h1>
<div class="sub">Film vocabulary · <span id="vs"></span> <button class="btn g" style="padding:3px 10px;font-size:13px" onclick="say('Lights, camera, action!')">🔊 тест звука</button></div></header>
<div id="nav"></div>
<div class="wrap"><main class="card"><h2 id="ti"></h2><p class="ins" id="in"></p><div id="box"></div>
<div class="row"><button class="btn g" id="pv">← Назад</button><button class="btn" id="nx">Дальше →</button></div></main>
<aside><div class="card"><h3>Проблемные слова</h3><div id="pw"></div></div></aside></div>
<script>
const W=[["scene","сцена","siːn"],["on set","на съёмочной площадке","ɒn set"],["be shot","сниматься, быть снятым","biː ʃɒt"],["epic","эпопея, эпический фильм","ˈepɪk"],["action film","боевик","ˈækʃn fɪlm"],["musical","мюзикл","ˈmjuːzɪkl"],["comedy","комедия","ˈkɒmədi"],["animation","анимация, мультфильм","ˌænɪˈmeɪʃn"],["historical film","исторический фильм","hɪˈstɒrɪkl fɪlm"],["science fiction film","научно-фантастический фильм","ˌsaɪəns ˈfɪkʃn fɪlm"],["rom-com","романтическая комедия","ˈrɒm kɒm"],["thriller","триллер","ˈθrɪlə"],["war film","военный фильм","ˈwɔː fɪlm"],["western","вестерн","ˈwestən"],["horror film","фильм ужасов","ˈhɒrə fɪlm"],["drama","драма","ˈdrɑːmə"]];
const $=s=>document.querySelector(s);
const sh=a=>{a=[...a];for(let i=a.length;i>1;){let j=Math.random()*i--|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const wd=e=>W.find(x=>x[0]==e);
const N=s=>s.toLowerCase().replace(/[’']/g,'').replace(/[^a-zа-я0-9]+/g,' ').replace(/ /g,'');
const strip=s=>s.replace(/<[^>]+>/g,'');
const opts4=w=>[w[1],...sh(W.filter(x=>x[1]!=w[1])).slice(0,3).map(x=>x[1])];
let V=null,LOG={},P={},SA={},tmr=0,cur=0;
function pick(){const v=speechSynthesis.getVoices();V=v.find(x=>/Google US English/i.test(x.name))||v.find(x=>/Samantha/i.test(x.name))||v.find(x=>x.lang=='en-US')||v.find(x=>/^en/.test(x.lang))||null;$('#vs').textContent='Голос: '+(V?V.name:'системный')}
if('speechSynthesis' in window){speechSynthesis.onvoiceschanged=pick;pick()}else $('#vs').textContent='озвучка не поддерживается браузером';
function utt(t){const u=new SpeechSynthesisUtterance(t);u.lang='en-US';if(V)u.voice=V;u.rate=.9;return u}
function say(t){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();speechSynthesis.speak(utt(t))}
function sayAll(){speechSynthesis.cancel();W.forEach(w=>speechSynthesis.speak(utt(w[0])))}
function bad(e){P[e]=(P[e]||0)+1;renderP()}
function renderP(){const k=Object.keys(P).sort((a,b)=>P[b]-P[a]);$('#pw').innerHTML=k.length?'':'<span class="mut">Пока пусто — отлично!</span>';k.forEach(e=>{const d=document.createElement('div');d.className='p';d.innerHTML=`<span><b>${e}</b><br><span class="mut">${wd(e)[1]}</span></span><span><i>${P[e]}</i> <button class="spk" style="width:26px;height:26px;font-size:12px">🔊</button></span>`;d.querySelector('button').onclick=()=>say(e);$('#pw').append(d)})}
async function copy(t,b){try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.append(a);a.select();try{document.execCommand('copy')}catch(_){}a.remove()}const o=b.textContent;b.textContent='Скопировано ✓';setTimeout(()=>b.textContent=o,1600)}
function report(){let s='CINEMA WORDS · B1\n';for(const k in LOG)s+='\n== '+k+' ==\n'+LOG[k].join('\n')+'\n';const pk=Object.keys(P);if(pk.length)s+='\n== Проблемные слова ==\n'+pk.map(e=>e+' ('+P[e]+')').join(', ')+'\n';const sk=Object.keys(SA);if(sk.length)s+='\n== Самооценка ==\n'+sk.map(e=>e+': '+SA[e]).join('\n');return s}
function mk(box,ex,gen){
 const g=gen(),items=g.items||g;box.innerHTML=g.pre?`<p style="line-height:1.9">${g.pre}</p>`:'';const L=[];
 items.forEach((it,n)=>{const d=document.createElement('div');d.className='q';const t=document.createElement('div');t.className='qt';t.innerHTML=`<b>${n+1}.</b> `;
  if(it.say){const b=document.createElement('button');b.className='spk';b.textContent='🔊';b.onclick=()=>say(it.say);t.append(b,' ')}
  t.insertAdjacentHTML('beforeend',it.q||'');d.append(t);let get;
  if(it.kind=='c'){const o=document.createElement('div');o.className='opts';let v='';sh(it.opts).forEach(x=>{const b=document.createElement('button');b.className='opt';b.textContent=x;b.onclick=()=>{o.querySelectorAll('.opt').forEach(y=>y.classList.remove('sel'));b.classList.add('sel');v=x};o.append(b)});d.append(o);get=()=>v;it.reveal=()=>o.querySelectorAll('.opt').forEach(b=>b.classList.toggle('right',b.textContent==it.ans))}
  else if(it.kind=='s'){const s=document.createElement('select');s.innerHTML='<option value="">— выбери —</option>'+sh(it.opts).map(x=>`<option>${x}</option>`).join('');d.append(s);get=()=>s.value}
  else{const i=document.createElement('input');i.type='text';i.autocomplete='off';i.spellcheck=false;i.placeholder='пиши здесь…';d.append(i);get=()=>i.value}
  const a=document.createElement('div');a.className='ans';a.textContent='✔ '+(it.model||(Array.isArray(it.ans)?it.ans[0]:it.ans));d.append(a);
  L.push({it,d,a,get});box.append(d)});
 const r=document.createElement('div');r.className='res';
 const row=document.createElement('div');row.className='row';
 const mb=(txt,f,c)=>{const b=document.createElement('button');b.className='btn '+(c||'');b.textContent=txt;b.onclick=f;row.append(b)};
 mb('✓ Проверить',()=>{let k=0;LOG[ex.t]=L.map(({it,d,get},n)=>{const v=get();const ok=it.ok?it.ok(v):it.kind=='t'?it.ans.some(x=>N(x)==N(v)):v===it.ans;d.classList.remove('ok','bad');d.classList.add(ok?'ok':'bad');if(ok)k++;else bad(it.w);return `${n+1}. ${strip(it.q).slice(0,70)} → ${v||'—'} ${ok?'✓':'✗'}`});r.textContent=`Результат: ${k} / ${L.length}`+(k==L.length?' 🎬 Отлично!':'')});
 mb('👁 Показать ответы',()=>L.forEach(({it,a})=>{a.classList.add('v');it.reveal&&it.reveal()}),'g');
 mb('↻ Заново (новый порядок)',()=>mk(box,ex,gen),'g');
 box.append(row,r)}
const E=[
{t:'Повторим слова',i:'Посмотри на слова, транскрипцию и перевод. Нажми 🔊 — слушай и повторяй вслух (голос Google US English / Samantha).',run(b){b.innerHTML='<div class="row" style="margin-top:0"><button class="btn" onclick="sayAll()">▶ Прослушать все</button><button class="btn g" onclick="speechSynthesis.cancel()">■ Стоп</button></div><div class="words"></div>';W.forEach(w=>{const d=document.createElement('div');d.className='w';d.innerHTML=`<div><b>${w[0]}</b><br><span class="mut">/${w[2]}/</span><br>${w[1]}</div><button class="spk">🔊</button>`;d.querySelector('button').onclick=()=>say(w[0]);b.lastChild.append(d)})}},
{t:'Listen & pick',i:'Нажми 🔊, послушай слово и выбери его значение.',run(b){mk(b,this,()=>sh(W).slice(0,8).map(w=>({kind:'c',say:w[0],q:'Что это значит?',opts:opts4(w),ans:w[1],w:w[0]})))}},
{t:'Speed match',i:'60 секунд! Нажми слово слева и его перевод справа. Чем больше пар — тем лучше.',run(b){
 b.innerHTML='<div class="bar"><b id="tm">60</b> с · <b id="sc">0</b> пар</div><button class="btn" id="go">▶ Старт</button><div id="ar"></div>';let sc=0,sel=null,on=false,left=0,t=60;
 const card=(w,side)=>{const c=document.createElement('button');c.className='opt';c.textContent=side=='en'?w[0]:w[1];c.onclick=()=>{if(!on||c.disabled)return;if(side=='en')say(w[0]);
  if(sel&&sel.side!=side){const a=sel.b;if(sel.w===w){[a,c].forEach(x=>{x.disabled=true;x.classList.add('done')});sc++;$('#sc').textContent=sc;sel=null;if(--left==0)round()}else{bad(w[0]);bad(sel.w[0]);[a,c].forEach(x=>x.classList.add('shake'));setTimeout(()=>[a,c].forEach(x=>x.classList.remove('shake','pick')),400);sel=null}}
  else{if(sel)sel.b.classList.remove('pick');sel={w,side,b:c};c.classList.add('pick')}};return c};
 const round=()=>{const ws=sh(W).slice(0,6);$('#ar').innerHTML='<div class="cols"><div></div><div></div></div>';const cs=$('#ar').querySelectorAll('.cols>div');sh(ws).forEach(w=>cs[0].append(card(w,'en')));sh(ws).forEach(w=>cs[1].append(card(w,'ru')));left=6;sel=null};
 $('#go').onclick=()=>{clearInterval(tmr);sc=0;t=60;on=true;$('#sc').textContent=0;$('#tm').textContent=60;round();tmr=setInterval(()=>{$('#tm').textContent=--t;if(t<=0){clearInterval(tmr);on=false;LOG['Speed match']=['Пар за 60 с: '+sc];$('#ar').innerHTML=`<p class="res">Время! Ты собрал(а) ${sc} пар. ${sc>=15?'🏆 Супер!':'Попробуй ещё раз.'}</p>`}},1000)}}},
{t:'Напиши по звуку',i:'Послушай и напиши выражение по-английски (в скобках — подсказка).',run(b){mk(b,this,()=>sh(W).slice(0,8).map(w=>({kind:'t',say:w[0],q:`<span class="mut">(${w[1]})</span>`,ans:[w[0],...(w[0]=='be shot'?['to be shot']:w[0]=='science fiction film'?['sci-fi film']:[])],w:w[0]})))}},
{t:'Which sentence sounds natural?',i:'Выбери предложение, которое звучит естественно.',run(b){const D=[["The actors were on set at six a.m.","The actors were in set at six a.m.","on set"],["The last scene made everyone cry.","The last scene made everyone to cry.","scene"],["Most of the film was shot in Morocco.","Most of the film shot in Morocco.","be shot"],["It’s a funny rom-com about two rivals who fall in love.","It’s a funny rom-com about two rivals who fall on love.","rom-com"],["Gladiator is a historical epic set in ancient Rome.","Gladiator is a historic epic set in ancient Rome.","historical film"],["I can’t watch horror films alone; they scare me.","I can’t watch horror films alone; they scary me.","horror film"],["A western is usually set in the American Wild West.","A western is usually set at the American Wild West.","western"],["The thriller kept me on the edge of my seat.","The thriller kept me at the edge of my seat.","thriller"]];
 mk(b,this,()=>sh(D).slice(0,7).map(d=>({kind:'c',q:'Какое звучит естественно?',opts:[d[0],d[1]],ans:d[0],w:d[2]})))}},
{t:'Допиши недостающую часть',i:'Впиши пропущенную часть выражения.',run(b){const D=[["I like science ___ films about space.","fiction","science fiction film"],["The movie was ___ in Iceland.","shot","be shot"],["The actors are on ___ all day.","set","on set"],["A rom-___ is a romantic comedy.","com","rom-com"],["A ___ film is made to scare people.","horror","horror film"],["A ___ film shows soldiers in battle.","war","war film"],["A historical ___ is set in the past.","film","historical film"],["An action ___ has fights and chases.","film","action film"]];
 mk(b,this,()=>sh(D).slice(0,7).map(d=>({kind:'t',q:d[0],ans:[d[1]],w:d[2]})))}},
{t:'Вставь слова в текст',i:'Выбери слово для каждого пропуска. Одно слово лишнее!',run(b){const bank=["epic","historical","scene","shot","on set","rom-com","horror films","western"],ans=["epic","historical","scene","shot","on set","rom-com","horror films"],ew=["epic","historical film","scene","be shot","on set","rom-com","horror film"];
 mk(b,this,()=>({pre:'Last Saturday I watched an <b>(1)</b> about Roman soldiers. It was a <b>(2)</b> film, so everything looked like real history. The most exciting <b>(3)</b> was the battle at the end. It was <b>(4)</b> in Morocco, and the actors spent months <b>(5)</b> in the desert. My sister prefers a <b>(6)</b> — a funny love story — but I can’t stand <b>(7)</b>: they are too scary for me.<br><span class="mut">Слова: '+sh(bank).join(' · ')+'</span>',items:ans.map((a,i)=>({kind:'s',q:`Пропуск (${i+1})`,opts:bank,ans:a,w:ew[i]}))}))}},
{t:'Контекст: угадай значение',i:'Прочитай предложение и выбери значение выделенного слова.',run(b){const S=[["The first <b>scene</b> is set in a quiet village.","scene"],["Everyone was nervous <b>on set</b> on the first day.","on set"],["The movie <b>was shot</b> in Italy last summer.","be shot"],["It’s an <b>epic</b> about a hero who saves his people over many years.","epic"],["I couldn’t sleep after that <b>horror film</b>.","horror film"],["The <b>thriller</b> kept me guessing until the very end.","thriller"],["We watched a classic <b>western</b> with cowboys and horses.","western"],["Toy Story is a famous <b>animation</b> made with computers.","animation"],["My grandmother loves old <b>musicals</b> — she knows all the songs.","musical"],["It’s a <b>war film</b> about soldiers in 1944.","war film"]];
 mk(b,this,()=>sh(S).slice(0,8).map(s=>{const w=wd(s[1]);return{kind:'c',say:strip(s[0]),q:s[0],opts:opts4(w),ans:w[1],w:s[1]}}))}},
{t:'Перевод RU → EN',i:'Переведи на английский. Если твой вариант верный, но не засчитан — сравни с образцом.',run(b){const T=[["Этот фильм снимали в Исландии.",["The film was shot in Iceland.","This film was shot in Iceland.","This movie was shot in Iceland.","The movie was shot in Iceland."],"be shot"],["Последняя сцена была очень грустной.",["The last scene was very sad.","The final scene was very sad.","The last scene was really sad."],"scene"],["Актёры целый день были на съёмочной площадке.",["The actors were on set all day.","The actors were on set all day long.","The actors were on set the whole day."],"on set"],["Я люблю романтические комедии.",["I love rom-coms.","I like rom-coms.","I love romantic comedies.","I like romantic comedies."],"rom-com"],["Вестерн — это фильм про Дикий Запад.",["A western is a film about the Wild West.","A western is a movie about the Wild West.","Westerns are films about the Wild West.","A western is a film set in the Wild West."],"western"],["Фильм ужасов меня очень напугал.",["The horror film scared me a lot.","The horror film really scared me.","The horror movie scared me a lot.","The horror film scared me very much."],"horror film"]];
 mk(b,this,()=>sh(T).map(t=>({kind:'t',q:t[0],ans:t[1],w:t[2]})))}},
{t:'Rephrase',i:'Перепиши предложение, используя указанное слово. Правильный вариант может быть разным — образец смотри в «Показать ответы».',run(b){const R=[["They filmed the movie in Spain.","<b>be shot</b>",/shot/,"The movie was shot in Spain.","be shot"],["It’s a very long, exciting film about a hero’s adventures.","<b>epic</b>",/epic/,"It’s an epic about a hero’s adventures.","epic"],["It’s a love story and it’s also very funny.","<b>rom-com</b>",/romcom/,"It’s a rom-com.","rom-com"],["The actors are working on the film now.","<b>on set</b>",/onset/,"The actors are on set now.","on set"],["It’s a film about soldiers fighting in a battle.","<b>war film</b>",/warfilm/,"It’s a war film about soldiers.","war film"]];
 mk(b,this,()=>sh(R).map(r=>({kind:'t',q:`${r[0]}<br><span class="mut">Используй:</span> ${r[1]}`,ok:v=>r[2].test(N(v))&&v.trim().split(/\s+/).length>=3,model:r[3],ans:[r[3]],w:r[4]})))}},
{t:'Закончи предложения',i:'Допиши предложения со своими идеями. Потом нажми «Скопировать» и отправь учителю.',run(b){const S=["My favourite film genre is … because …","I never watch … because …","The most exciting scene I remember is …","If I were on set of a film, I would …","A good rom-com should have …","I’d like to be in a film that was shot in …"];b.innerHTML='';const TA=S.map(s=>{const d=document.createElement('div');d.className='q';d.innerHTML=`<div class="qt"><b>${s}</b></div><textarea placeholder="Your ideas…"></textarea>`;b.append(d);return d.querySelector('textarea')});
