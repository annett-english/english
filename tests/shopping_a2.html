<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shopping A2 — тренажёр</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1b1f2a;--mu:#5d6679;--ac:#2f6fed;--ok:#1a8f4c;--bad:#d03b3b;--bd:#dde1ea;--hl:#fff1b8;--okbg:#d9f3e3;--badbg:#fadcdc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--card:#1c212c;--tx:#e8ecf4;--mu:#9aa4b8;--ac:#6c9bff;--ok:#4fd18a;--bad:#ff7b7b;--bd:#2c3342;--hl:#5a4b10;--okbg:#17402b;--badbg:#4a2323}}
:root[data-theme="dark"]{--bg:#12151c;--card:#1c212c;--tx:#e8ecf4;--mu:#9aa4b8;--ac:#6c9bff;--ok:#4fd18a;--bad:#ff7b7b;--bd:#2c3342;--hl:#5a4b10;--okbg:#17402b;--badbg:#4a2323}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:18px 16px 8px;max-width:1150px;margin:auto}
h1{margin:0 0 6px;font-size:24px}h2{margin:0 0 4px;font-size:19px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:16px;max-width:1150px;margin:auto;padding:8px 16px 40px}
@media(max-width:820px){.layout{grid-template-columns:1fr}aside{order:-1;position:static!important}}
aside{position:sticky;top:12px;align-self:start}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.instr{color:var(--mu);margin:0 0 10px;font-size:14px}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:9px;padding:6px 12px}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff}
button:hover{filter:brightness(.95)}
input,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:6px 9px;min-width:0}
input{width:min(100%,380px)}textarea{width:100%;box-sizing:border-box}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:7px 0}
.n{color:var(--mu);width:20px}.p{flex:1 1 220px}
.fb{font-weight:600;min-width:20px}.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}.fb.show{color:var(--ac);font-weight:500}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}.score{font-weight:600}
table{width:100%;border-collapse:collapse;font-size:15px}td,th{padding:5px 6px;border-bottom:1px solid var(--bd);text-align:left}
.ipa{color:var(--mu);font-family:"Segoe UI",Arial,sans-serif}
.read{line-height:2.1}.tok{padding:2px 3px;border-radius:6px;cursor:pointer;border:1px solid transparent}
.tok:hover{background:var(--hl)}.tok.sel{background:var(--hl);border-color:#d9b400}
.tok.good{background:var(--okbg);border-color:var(--ok)}.tok.miss{border:1px dashed var(--bad);background:var(--badbg)}.tok.wrong{background:var(--badbg);text-decoration:line-through}
.tile{margin:3px;padding:5px 10px}.tile.on{background:var(--hl)}.built{min-height:40px;border:1px dashed var(--bd);border-radius:9px;padding:3px;flex:1 1 100%}
.pool{flex:1 1 100%}.bank{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}.chip{background:var(--hl);border-radius:20px;padding:2px 11px;font-size:14px}
.chips button.on{background:var(--ac);color:#fff}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:9px 12px}.q{font-size:18px;margin:8px 0}.prize{color:var(--ac);font-weight:700}
.gap{width:140px;margin:0 3px}
#plist div{display:flex;justify-content:space-between;gap:6px;padding:3px 0;border-bottom:1px solid var(--bd);font-size:14px}
#plist span.c{color:var(--bad);font-weight:700}
#out{height:150px;margin-top:8px}.res{margin-top:8px}.bad{color:var(--bad)}
</style></head><body>
<header>
<h1>🛍️ Shopping — A2 тренажёр</h1>
<div class="row"><input id="nm" placeholder="Имя ученика / Student name" style="width:240px">
<button class="pri" id="tst">🔊 Проверить звук</button><span class="ipa">Голос: <b id="vname">…</b></span>
<button id="theme">🌓</button></div>
<div class="instr" id="ttsnote"></div>
</header>
<div class="layout"><main id="main"></main>
<aside><div class="card"><h2>⚠️ Проблемные слова</h2><p class="instr">Слова, в которых были ошибки (нажми — услышишь).</p><div id="plist"><i class="instr">Пока пусто 🎉</i></div><div class="bar"><button id="pclr">Очистить</button></div></div></aside></div>

<script>
const $=s=>document.querySelector(s);
const h=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const norm=s=>s.toLowerCase().replace(/[’`]/g,"'").replace(/[.,!?;:"]/g,'').replace(/\s+/g,' ').trim();
const LOG={};let ITEMS=[];const P={};

/* ---------- AUDIO ---------- */
const TTS='speechSynthesis' in window;let voice=null;
function pickVoice(){if(!TTS)return;const vs=speechSynthesis.getVoices();
 voice=vs.find(v=>/Google US English/i.test(v.name))||vs.find(v=>/Samantha/i.test(v.name))||vs.find(v=>v.lang==='en-US'||v.lang==='en_US')||vs.find(v=>/^en/i.test(v.lang))||null;
 $('#vname').textContent=voice?voice.name+' ('+voice.lang+')':'голос по умолчанию (en-US)'}
if(TTS){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
else{$('#vname').textContent='не поддерживается';$('#ttsnote').textContent='Этот браузер не поддерживает озвучку. Откройте страницу в Chrome / Safari.'}
function say(t,r=.9,q=false){if(!TTS)return;if(!q)speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';if(voice)u.voice=voice;u.rate=r;speechSynthesis.speak(u)}
$('#tst').onclick=()=>{pickVoice();say("Hello! Welcome to the shop. Can I try on this shirt?")};
$('#theme').onclick=()=>{const r=document.documentElement;r.dataset.theme=(r.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))==='dark'?'light':'dark'};

/* ---------- DATA ---------- */
const W=[
['self-service checkout','касса самообслуживания','/ˌself ˈsɜːvɪs ˈtʃekaʊt/','self-service checkout|self-checkout|self service checkout'],
['shop assistant','продавец-консультант','/ʃɒp əˈsɪstənt/'],
['trolley','тележка','/ˈtrɒli/'],
['customer','покупатель','/ˈkʌstəmə/'],
['shopping bag','пакет для покупок','/ˈʃɒpɪŋ bæɡ/'],
['basket','корзина','/ˈbɑːskɪt/'],
['receipt','чек','/rɪˈsiːt/'],
['the sales','распродажа','/ðə seɪlz/','the sales|sales'],
['changing room','примерочная','/ˈtʃeɪndʒɪŋ ruːm/'],
['shelf / shelves','полка / полки','/ʃelf/ – /ʃelvz/','shelf|shelves'],
['till','касса (аппарат)','/tɪl/'],
['chain store','сеть магазинов','/tʃeɪn stɔː/'],
['size','размер','/saɪz/'],
['try on','примерять','/traɪ ɒn/','try on|tried on|try-on'],
['fit','подходить по размеру','/fɪt/'],
['suit','идти (к лицу)','/suːt/','suit|suits|suited'],
['take back','возвращать в магазин','/teɪk bæk/','take back|took back']];
const F=[["What size are you?","Какой у вас размер?"],["Can I try on this shirt?","Можно примерить эту рубашку?"],["This shirt doesn't fit me.","Эта рубашка мне не подходит по размеру."],["That jacket really suits you!","Эта куртка вам очень идёт!"],["I'm going to take these trousers back.","Я собираюсь вернуть эти брюки."]];

/* ---------- PROBLEMS ---------- */
function addP(t){P[t]=(P[t]||0)+1;renderP()}
function renderP(){const b=$('#plist');b.innerHTML='';const k=Object.keys(P).sort((a,c)=>P[c]-P[a]);if(!k.length){b.innerHTML='<i class="instr">Пока пусто 🎉</i>';return}
 k.forEach(w=>{const d=h('div');const a=h('a',null,'🔊 '+w);a.style.cursor='pointer';a.onclick=()=>say(w);d.append(a,h('span','c','×'+P[w]));b.append(d)})}
$('#pclr').onclick=()=>{for(const k in P)delete P[k];renderP()};

/* ---------- ENGINE ---------- */
function addItem(ex,wrap,o){const fb=h('span','fb');wrap.append(fb);
 const it={ex,fb,get:o.get,ans:o.ans,tag:o.tag,label:o.label,judge:o.judge||((v,a)=>a.split('|').some(x=>norm(x)===norm(v))),ok:null,lg:false};ITEMS.push(it);return it}
function check(ex,sc){let ok=0,tot=0;ITEMS.filter(i=>i.ex===ex).forEach(i=>{tot++;const v=i.get();if(!v.trim()){i.ok=null;i.fb.textContent='';return}
 const r=i.judge(v,i.ans);i.ok=r;i.fb.textContent=r?'✅':'❌';i.fb.className='fb '+(r?'ok':'bad');if(r)ok++;else if(!i.lg){i.lg=true;addP(i.tag)}});
 sc.textContent=`✅ ${ok} / ${tot}`}
function reveal(ex){ITEMS.filter(i=>i.ex===ex).forEach(i=>{i.fb.textContent=' → '+i.ans.split('|')[0];i.fb.className='fb show'})}
function sec(id,title,instr,build,c={}){const s=h('section','card');s.id=id;
 s.innerHTML=`<h2>${title}</h2><p class="instr">${instr}</p><div class="body"></div>`;
 const body=h('div'),bar=h('div','bar'),sc=h('span','score');s.querySelector('.body').replaceWith(body);s.append(bar);
 const run=()=>{ITEMS=ITEMS.filter(i=>i.ex!==id);body.innerHTML='';sc.textContent='';build(body,id)};
 if(!c.nobar){const b1=h('button','pri','Проверить'),b2=h('button',null,'Показать ответы'),b3=h('button',null,'Заново');
  b1.onclick=()=>c.check?c.check(body,sc):check(id,sc);b2.onclick=()=>c.reveal?c.reveal(body,sc):reveal(id);b3.onclick=run;bar.append(b1,b2,b3,sc)}
 run();$('#main').append(s)}
const inp=()=>{const i=h('input');i.autocomplete='off';i.spellcheck=false;i.autocapitalize='off';return i};
function textList(arr,play){return(body,id)=>shuf(arr).forEach(([p,a,t],n)=>{const r=h('div','row');r.append(h('span','n',n+1));
 if(play){const b=h('button',null,'▶');b.onclick=()=>say(p);const s=h('button',null,'🐢');s.onclick=()=>say(p,.55);r.append(b,s)}else r.append(h('span','p')),r.lastChild.innerHTML=p;
 const i=inp();r.append(i);addItem(id,r,{get:()=>i.value,ans:a,tag:t,label:play?'🔊 (dictation)':p.replace(/<[^>]+>/g,'')});body.append(r)})}

/* ---------- 0. VOCAB ---------- */
(()=>{const s=h('section','card');s.innerHTML=`<h2>📚 Слова и фразы</h2><p class="instr">Нажми 🔊 и прослушай каждое слово (голос Google US English / Samantha). Повтори вслух!</p>`;
 const t=h('table');t.innerHTML='<tr><th></th><th>English</th><th>Перевод</th><th>Транскрипция</th></tr>';
 W.forEach(w=>{const r=h('tr');const b=h('button',null,'🔊');b.onclick=()=>say(w[0].replace('/',','));const c=h('td');c.append(b);r.append(c);
  [[w[0]],[w[1]],[w[2],'ipa']].forEach(([x,k],i)=>r.append(h('td',k,x)));if(1)r.children[1].style.fontWeight=600;t.append(r)});
 const ph=h('table');F.forEach(f=>{const r=h('tr');const b=h('button',null,'🔊');b.onclick=()=>say(f[0]);const c=h('td');c.append(b);r.append(c,h('td',null,f[0]),h('td',null,f[1]));ph.append(r)});
 const all=h('button','pri','▶ Прослушать всё подряд');all.onclick=()=>{speechSynthesis.cancel();W.forEach(w=>say(w[0].replace('/',','),.85,true));F.forEach(f=>say(f[0],.85,true))};
 s.append(t,h('h2',null,'Фразы'),ph,h('div','bar')),s.lastChild.append(all);$('#main').append(s)})();

/* ---------- 1. FIND IN THE WILD ---------- */
const T1=`Last Saturday I went to a big [[chain store]] because [[the sales]] had started. Many [[customers]] were there. I took a [[basket]], but then I needed a [[trolley]]. A [[shop assistant]] asked, "[[What size are you?]]" I wanted to [[try on]] a shirt, so I went to the [[changing room]]. The shirt [[didn't fit me]], but the jacket [[really suited me]]! The clothes were on the [[shelves]] near the [[till]]. I used the [[self-service checkout]], put everything in a [[shopping bag]] and kept the [[receipt]]. Later I decided to [[take back]] the trousers.`;
const e1=(b)=>b.querySelectorAll('.tok');
sec('e1','1. Find them in the wild','Read the text once. Then click every stretch of words from the topic. Click the whole phrase, not a single word.',(body)=>{
 const p=h('p','read');const mk=(x,t)=>{const e=h('span','tok',x);e.dataset.t=t;e.onclick=()=>e.classList.toggle('sel');p.append(e,' ')};
 T1.split(/(\[\[.*?\]\])/).forEach(pt=>pt.startsWith('[[')?mk(pt.slice(2,-2),1):pt.split(/\s+/).filter(Boolean).forEach(w=>mk(w,0)));body.append(p)},
 {check(b,sc){let f=0,t=0,w=0;e1(b).forEach(e=>{const s=e.classList.contains('sel'),T=e.dataset.t==='1';e.classList.remove('good','miss','wrong');
  if(T){t++;if(s){f++;e.classList.add('good')}else{e.classList.add('miss');if(!e.dataset.lg){e.dataset.lg=1;addP(e.textContent)}}}else if(s){w++;e.classList.add('wrong')}});
  sc.textContent=`Найдено ${f}/${t}, лишних: ${w}`;LOG.e1='1. Find them in the wild: '+sc.textContent},
  reveal(b,sc){e1(b).forEach(e=>{if(e.dataset.t==='1')e.classList.add('sel')});this.check(b,sc)}});

/* ---------- 2. RU → EN ---------- */
sec('e2','2. Переведи на английский','Напиши перевод руками. Регистр и точки не важны.',textList([
['Где примерочная?','Where is the changing room?','changing room'],
['Мне нужна тележка.','I need a trolley.|I need a shopping trolley.','trolley'],
['Сохраните чек.','Keep the receipt.|Keep your receipt.|Please keep the receipt.','receipt'],
['Я плачу на кассе самообслуживания.',"I pay at the self-service checkout.|I'm paying at the self-service checkout.|I pay at the self-checkout.|I'm paying at the self-checkout.",'self-service checkout'],
['Распродажа началась.','The sales have started.|The sales started.','the sales'],
['Покупатель стоит у кассы.','The customer is at the till.|The customer is standing at the till.','customer / till'],
['Книги стоят на полках.','The books are on the shelves.','shelves'],
['Продавец работает в сети магазинов.','The shop assistant works in a chain store.|The shop assistant works at a chain store.','shop assistant / chain store']]));

/* ---------- 3. DICTATION ---------- */
sec('e3','3. Запиши то, что слышишь','Нажми ▶ (обычная скорость) или 🐢 (медленно) и напиши фразу полностью.',textList([
['What size are you?','What size are you?','size'],
['Can I try on this shirt?','Can I try on this shirt?','try on'],
[`This shirt doesn't fit me.`,`This shirt doesn't fit me.|This shirt does not fit me.`,'fit'],
['That jacket really suits you!','That jacket really suits you!','suit'],
[`I'm going to take these trousers back.`,`I'm going to take these trousers back.|I am going to take these trousers back.`,'take back'],
['Keep your receipt, please.','Keep your receipt, please.|Keep your receipt please.','receipt'],
['Take a basket, please.','Take a basket, please.','basket'],
['Put it in a shopping bag.','Put it in a shopping bag.','shopping bag']],1));

/* ---------- 4. TENSES ---------- */
sec('e4','4. Измени время глагола','Перепиши предложение в указанном времени.',textList([
['I take a basket. <i>(Past Simple)</i>','I took a basket.','take'],
['She tries on a jacket. <i>(Past Simple)</i>','She tried on a jacket.','try on'],
[`The shirt doesn't fit me. <i>(Past Simple)</i>`,`The shirt didn't fit me.|The shirt did not fit me.`,'fit'],
['We pay at the till. <i>(Present Perfect)</i>',"We have paid at the till.|We've paid at the till.",'till'],
['He takes back the trousers. <i>(Future: will)</i>',"He will take back the trousers.|He'll take back the trousers.",'take back'],
['I keep the receipt. <i>(Present Continuous)</i>',"I am keeping the receipt.|I'm keeping the receipt.",'receipt'],
['The jacket suits you. <i>(Past Simple)</i>','The jacket suited you.','suit'],
['They use the self-service checkout. <i>(Present Perfect)</i>',"They have used the self-service checkout.|They've used the self-service checkout.|They have used the self-checkout.|They've used the self-checkout.",'self-service checkout']]));

/* ---------- 5. GAP FILL ---------- */
const G=[['the sales|sales','the sales'],['chain store','chain store'],['basket','basket'],['trolley','trolley'],['shop assistant','shop assistant'],['shelves|shelf','shelves'],['changing room','changing room'],['try on','try on'],['suited|suits|suit','suited'],['self-service checkout|self-checkout|till','self-service checkout']];
const T5='Yesterday [0] started, so I went to a big [1]. I took a [2], but it was too small, so I changed it for a [3]. A [4] showed me the jackets on the [5]. I went to the [6] to [7] one. It really [8] me! I paid at the [9] and kept the receipt.';
sec('e5','5. Вставь слова в текст','Впиши подходящие слова из банка (каждое — один раз). Следи за формой глагола!',(body,id)=>{
 const bk=h('div','bank');shuf(G).forEach(g=>bk.append(h('span','chip',g[1])));const p=h('p','read');
 T5.split(/\[(\d)\]/).forEach((x,i)=>{if(i%2===0)p.append(x);else{const n=+x,w=h('span');const t=inp();t.className='gap';t.style.width='150px';w.append(t);
  addItem(id,w,{get:()=>t.value,ans:G[n][0],tag:G[n][1],label:'gap '+(n+1)});p.append(w)}});body.append(bk,p)});

/* ---------- 6. BUILD THE CHUNK ---------- */
const C=['Use the basket, please.','Do you have this jacket in a bigger size?','The sales start on Monday.','Put the receipt in your shopping bag.','I like to try on shoes.','Where can I find a shop assistant?',"This blue shirt doesn't suit me.",'I want to take back this jacket.'];
const CT=['basket','size','the sales','receipt / shopping bag','try on','shop assistant','suit','take back'];
sec('e6','6. Build the chunk','Нажимай на слова, чтобы собрать предложение. Нажми на слово в рамке — оно вернётся назад.',(body,id)=>{
 shuf(C.map((s,i)=>i)).forEach((k,n)=>{const s=C[k],w=s.split(' ');let ord=shuf(w.map((_,i)=>i));while(ord.join()===w.map((_,i)=>i).join()&&w.length>2)ord=shuf(ord);
  const sel=[],r=h('div','row'),bt=h('div','built'),pl=h('div','pool');r.append(h('span','n',n+1),bt,pl);
  const draw=()=>{bt.innerHTML='';sel.forEach(i=>{const b=h('button','tile on',w[i]);b.onclick=()=>{sel.splice(sel.indexOf(i),1);draw()};bt.append(b)});
   pl.innerHTML='';ord.filter(i=>!sel.includes(i)).forEach(i=>{const b=h('button','tile',w[i]);b.onclick=()=>{sel.push(i);draw()};pl.append(b)})};draw();
  addItem(id,r,{get:()=>sel.map(i=>w[i]).join(' '),ans:s,tag:CT[k],label:'build: '+s.slice(0,0)+'(scrambled)'});body.append(r)})});

/* ---------- 7. MINI DIALOGUES ---------- */
const D=[
['Ты хочешь примерить рубашку, но она не подходит по размеру.',['try on','fit'],`A: Can I try on this shirt?\nB: Yes, the changing room is over there.\nA: It doesn't fit me. Do you have a bigger size?`,'try on / fit'],
['Похвали куртку друга.',['suit'],`A: That jacket really suits you!\nB: Thanks! I bought it in the sales.`,'suit'],
['Ты возвращаешь брюки продавцу и показываешь чек.',['back','receipt'],`A: I'd like to take these trousers back.\nB: Do you have the receipt?\nA: Yes, here you are.`,'take back / receipt'],
['В супермаркете: тебе нужна тележка, а платишь ты на кассе самообслуживания.',['trolley','checkout'],`A: Excuse me, where are the trolleys?\nB: Next to the entrance.\nA: And where is the self-service checkout?`,'trolley / self-service checkout'],
['Узнай у продавца, где примерочная и какие есть размеры.',['changing room','size'],`A: Where is the changing room, please?\nB: Over there. What size are you?\nA: I'm a medium.`,'changing room / size']];
sec('e7','7. Write mini-dialogues','Напиши мини-диалог (A / B, 2–4 реплики). Проверка ищет ключевые слова, ответ-образец — под кнопкой «Показать ответы».',(body,id)=>{
 shuf(D).forEach(([sit,keys,model,tag],n)=>{const r=h('div');r.append(h('p',null,(n+1)+'. '+sit));const t=h('textarea');t.rows=3;r.append(t);
  const it=addItem(id,r,{get:()=>t.value,ans:model,tag,label:sit,judge:(v)=>v.length>15&&keys.every(k=>v.toLowerCase().includes(k))});
  it.fb.style.whiteSpace='pre-wrap';body.append(r)})});

/* ---------- 8. RETRIEVE ---------- */
sec('e8','8. Write as many words as you remember','Закрой словарь и впиши все слова по теме, которые помнишь (через запятую или с новой строки).',(body)=>{
 const t=h('textarea');t.rows=5;t.placeholder='trolley, receipt, ...';const r=h('div','res');body.append(t,r)},
 {check(b,sc){const v=b.querySelector('textarea').value;const miss=[];let f=0;W.forEach(w=>{new RegExp('\\b('+(w[3]||w[0])+')\\b','i').test(v)?f++:miss.push(w[0])});
  sc.textContent=`Вспомнили ${f} / ${W.length}`;b.querySelector('.res').innerHTML='Не хватает: <b>'+miss.join(', ')+'</b>';LOG.e8='8. Retrieve: '+sc.textContent+' | missing: '+miss.join(', ');
  if(v.trim()&&!b.dataset.lg){b.dataset.lg=1;miss.forEach(addP)}},
  reveal(b){b.querySelector('.res').innerHTML='Все слова: <b>'+W.map(w=>w[0]).join(', ')+'</b>'}});

/* ---------- 9. THREE WEAK WORDS ---------- */
sec('e9','9. Choose 3 words you are least confident','Выбери 3 самых трудных слова (или нажми «из проблемных») — получишь задания: перевод, аудио-диктант и своё предложение.',(body,id)=>{
 const sel=new Set(),cs=h('div','chips row'),box=h('div');
 W.forEach((w,i)=>{const b=h('button',null,w[0]);b.onclick=()=>{if(sel.has(i))sel.delete(i);else if(sel.size<3)sel.add(i);b.classList.toggle('on',sel.has(i))};cs.append(b)});
 const go=h('button','pri','Создать задания'),pr=h('button',null,'Взять из проблемных');
 const gen=()=>{ITEMS=ITEMS.filter(i=>i.ex!==id);box.innerHTML='';sel.forEach(k=>{const w=W[k],ans=w[3]||w[0],f=ans.split('|')[0];box.append(h('h3',null,w[0]));
   let r=h('div','row');r.append(h('span','p',`① Переведи: «${w[1]}»`));let i=inp();r.append(i);addItem(id,r,{get:()=>i.value,ans,tag:w[0],label:'translate: '+w[1]});box.append(r);
   r=h('div','row');const b=h('button',null,'▶');b.onclick=()=>say(f);r.append(h('span',null,'② Послушай и напиши:'),b);i=inp();r.append(i);addItem(id,r,{get:()=>i.value,ans,tag:w[0],label:'🔊 audio word'});box.append(r);
   r=h('div','row');r.append(h('span','p',`③ Напиши своё предложение со словом «${f}»`));i=inp();i.style.width='min(100%,480px)';r.append(i);
   addItem(id,r,{get:()=>i.value,ans:'(sentence with "'+f+'")',tag:w[0],label:'own sentence',judge:v=>v.trim().split(/\s+/).length>=3&&new RegExp('\\b('+ans+')\\b','i').test(v)});box.append(r)})};
 go.onclick=()=>{if(sel.size)gen()};
 pr.onclick=()=>{const k=Object.keys(P).sort((a,c)=>P[c]-P[a]).map(t=>W.findIndex(w=>w[0]===t||t.includes(w[0].split(' ')[0]))).filter(i=>i>=0);
  sel.clear();k.slice(0,3).forEach(i=>sel.add(i));[...cs.children].forEach((b,i)=>b.classList.toggle('on',sel.has(i)));if(sel.size)gen()};
 const rw=h('div','row');rw.append(go,pr);body.append(cs,rw,box)});

/* ---------- 10. MILLIONAIRE ---------- */
const Q=[
['A person who buys things in a shop','customer',['shop assistant','basket','till'],'customer'],
['You push it round the supermarket.','trolley',['receipt','shelf','till'],'trolley'],
['Paper that shows what you paid','receipt',['shelf','size','basket'],'receipt'],
['You try clothes on here.','changing room',['till','shelf','trolley'],'changing room'],
['"What ___ are you?" — "Medium."','size',['fit','suit','till'],'size'],
['"This shirt doesn\'t ___ me. It\'s too small."','fit',['suit','size','shelf'],'fit'],
['Which verb means "looks good on you" (идёт)?','suit',['fit','try','take'],'suit'],
['"I\'m going to ___ these trousers back — they are too small."','take',['make','do','say'],'take back'],
['You pay here in a shop.','till|checkout',['shelf','basket','changing room'],'till'],
['Many shops with the same name, e.g. Zara or H&M','chain store',['shopping bag','receipt','shelf'],'chain store'],
['Prices are lower during ___.','the sales|sales',['the receipt','the trolley','the size'],'the sales'],
['Plural of "shelf":','shelves',['shelfs','shelfes','shelvs'],'shelves'],
['Past Simple of "try on":','tried on',['trying on','try on','tryed on'],'try on'],
['You can pay here without a cashier.','self-service checkout|self-checkout',['changing room','shelf','basket'],'self-service checkout'],
['Translate: «примерять»','try on',['take back','fit','suit'],'try on']];
const PR=[100,200,300,500,1000,2000,4000,8000,16000,32000,64000,125000,250000,500000,1000000];
sec('e10','10. Кто хочет стать миллионером? 💰','15 вопросов. Выбирай вариант или переключись на режим «Писать самому». Ошибка — игра заканчивается.',(body)=>{
 let n=0,mode='mc';LOG.quiz='';const bar=h('div','row'),box=h('div');bar.append(h('b',null,'Режим:'));
 [['mc','Варианты'],['tx','Писать самому']].forEach(([m,t])=>{const b=h('button',null,t);b.onclick=()=>{mode=m;n=0;render()};bar.append(b)});body.append(bar,box);
 function done(ok,given){const [,c,,t]=Q[n];if(ok){n++;render();return}addP(t);const won=n?PR[n-1]:0;
  LOG.quiz=`10. Millionaire: stopped at Q${n+1}, answered "${given}", correct "${c.split('|')[0]}", prize ${won}`;
  box.innerHTML='';const d=h('div','bad','❌ Неверно. Правильный ответ: '+c.split('|')[0]+'. Ваш выигрыш: '+won.toLocaleString('ru')+' £');const b=h('button','pri','Играть снова');b.onclick=()=>{n=0;render()};box.append(d,b)}
 function render(){box.innerHTML='';if(n>=15){LOG.quiz='10. Millionaire: WON 1 000 000';box.append(h('h2',null,'🎉 Миллион фунтов! Ты выиграл!'));return}
  const [q,c,ds]=Q[n];box.append(h('div','prize','Вопрос '+(n+1)+' / 15 · за '+PR[n].toLocaleString('ru')+' £'),h('div','q',q));
  if(mode==='mc')shuf([c.split('|')[0],...ds]).forEach(o=>{const b=h('button','opt',o);b.onclick=()=>done(c.split('|').includes(o),o);box.append(b)});
  else{const i=inp(),b=h('button','pri','Ответить');const go=()=>done(c.split('|').some(x=>norm(x)===norm(i.value)),i.value);b.onclick=go;i.onkeydown=e=>{if(e.key==='Enter')go()};box.append(i,b)}}
 render()},{nobar:1});

/* ---------- COPY ---------- */
const sf=h('section','card');sf.innerHTML=`<h2>📋 Ответы ученика</h2><p class="instr">Нажми, чтобы собрать все ответы (с отметками ✔/✘ и правильными вариантами) и скопировать их — для отправки учителю.</p>`;
const EX={e2:'2. Translation',e3:'3. Dictation',e4:'4. Tenses',e5:'5. Gap fill',e6:'6. Build the chunk',e7:'7. Mini-dialogues',e9:'9. Weak words'};
const cb=h('button','pri','Собрать и скопировать ответы'),out=h('textarea');out.id='out';out.readOnly=true;
cb.onclick=async()=>{let t='A2 Shopping — answers\nStudent: '+($('#nm').value||'—')+'\n\n'+(LOG.e1||'1. Find them in the wild: not checked')+'\n';
 let cur='';ITEMS.forEach(i=>{if(i.ex!==cur){cur=i.ex;t+='\n'+EX[cur]+'\n'}const v=(i.get()||'—').replace(/\n/g,' / ');
  t+=`• ${i.label} → ${v}  ${i.ok==null?'':i.ok?'✔':'✘ (correct: '+i.ans.split('|')[0].replace(/\n/g,' / ')+')'}\n`});
 t+='\n'+(LOG.e8||'8. Retrieve: not checked')+'\n'+(LOG.quiz||'10. Millionaire: not played')+'\n';
 const pk=Object.keys(P);t+='\nProblem words: '+(pk.length?pk.map(k=>k+' ×'+P[k]).join(', '):'none')+'\n';
 out.value=t;try{await navigator.clipboard.writeText(t);cb.textContent='✅ Скопировано!'}catch(e){out.select();try{document.execCommand('copy');cb.textContent='✅ Скопировано!'}catch(_){cb.textContent='Выдели текст ниже и скопируй вручную'}}
 setTimeout(()=>cb.textContent='Собрать и скопировать ответы',2500)};
sf.append(cb,out);$('#main').append(sf);
</script></body></html>
