<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Describing Appearance — Hair & Face</title>
<style>
:root{--bg:#f6f3ee;--c:#fff;--t:#222;--m:#6b6b6b;--a:#3b6fd4;--ok:#1f8f4e;--no:#c93636;--b:#ddd5c8;--hl:#fff3b8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1b1c1f;--c:#26282c;--t:#eee;--m:#a0a0a0;--a:#7aa2f7;--ok:#5fd08a;--no:#ff7b7b;--b:#3a3d43;--hl:#5a4f1c}}
:root[data-theme=dark]{--bg:#1b1c1f;--c:#26282c;--t:#eee;--m:#a0a0a0;--a:#7aa2f7;--ok:#5fd08a;--no:#ff7b7b;--b:#3a3d43;--hl:#5a4f1c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.w{max-width:1100px;margin:auto;padding:16px;display:grid;grid-template-columns:1fr 230px;gap:16px}
@media(max-width:800px){.w{grid-template-columns:1fr}}
h1{margin:.2em 0}h2{margin:0 0 4px;font-size:1.15rem}.in{color:var(--m);margin:0 0 10px;font-size:.92rem}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:16px;margin-bottom:14px}
aside .card{position:sticky;top:12px}
.vg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.v{border:1px solid var(--b);border-radius:8px;padding:8px;display:flex;justify-content:space-between;gap:6px}
.v b{display:block}.v i{color:var(--m);font-size:.85rem}.v small{display:block}
button{font:inherit;cursor:pointer;border:1px solid var(--b);background:var(--c);color:var(--t);border-radius:8px;padding:5px 11px}
button.pr{background:var(--a);color:#fff;border-color:var(--a)}
.sp{padding:2px 8px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}.sc{font-weight:600}
ol{padding-left:22px;margin:0}li{margin:8px 0}
input,textarea,select{font:inherit;color:var(--t);background:var(--bg);border:1px solid var(--b);border-radius:8px;padding:4px 8px}
input{width:min(260px,100%);margin-left:6px}textarea{width:100%;min-height:60px;margin:2px 0 8px}
input.ok,select.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--bg))}
input.bad,select.bad{border-color:var(--no);background:color-mix(in srgb,var(--no) 15%,var(--bg))}
.m{margin-left:6px;font-weight:700}.q code{background:var(--hl);padding:0 5px;border-radius:4px;font-size:1rem}
.p{cursor:pointer;border-radius:4px;padding:0 1px}.p:hover{background:var(--hl)}.p.sel{background:var(--hl);outline:2px solid var(--a)}
.p.ok{background:color-mix(in srgb,var(--ok) 30%,transparent)}.p.bad{background:color-mix(in srgb,var(--no) 30%,transparent)}.p.miss{outline:2px dashed var(--no)}
#pw div{display:flex;justify-content:space-between;border-bottom:1px solid var(--b);padding:3px 0}
#pw em{color:var(--m);font-size:.9rem}
img{max-width:100%;border-radius:10px;display:block;margin:0 auto 10px}
.cb{display:flex;flex-wrap:wrap;gap:6px}.cb label{border:1px solid var(--b);border-radius:20px;padding:2px 10px;cursor:pointer}
</style></head><body><div class="w"><main>
<h1>Hair & Face 💇</h1>
<div class="card"><h2>Words to remember</h2><p class="in">Нажми 🔊 и послушай. Голос: <b id="vn">…</b> <button onclick="say('Audio check. Curly red hair and a thick beard.')">🔈 Проверить звук</button> <button onclick="playAll()">▶ Все слова</button></p><div class="vg" id="vg"></div></div>
<div id="ex"></div>
<div id="fr"></div>
<div class="card"><h2>📋 Copy everything</h2><p class="in">Имя: <input id="nm" placeholder="Your name"></p><button class="pr" onclick="copyAll()">Copy all my answers</button> <span id="cm" class="sc"></span></div>
</main><aside><div class="card"><h2>⚠ Проблемные слова</h2><div id="pw"><em>Пока ошибок нет 🎉</em></div><button style="margin-top:8px" onclick="P={};rp()">Очистить</button></div></aside></div>
<script>
const $=s=>document.querySelector(s);
const W=[["spiky","/ˈspaɪki/","торчащие, колючие"],["straight","/streɪt/","прямые"],["wavy","/ˈweɪvi/","волнистые"],["curly","/ˈkɜːrli/","кудрявые"],["coily","/ˈkɔɪli/","мелкие кудри (афро)"],["light brown","/laɪt braʊn/","светло-русые"],["grey/gray","/ɡreɪ/","седые"],["ash blonde","/æʃ blɑːnd/","пепельный блонд"],["red","/red/","рыжие"],["dark brown","/dɑːrk braʊn/","тёмно-каштановые"],["short","/ʃɔːrt/","короткие"],["medium-length","/ˈmiːdiəm leŋθ/","средней длины"],["long","/lɔːŋ/","длинные"],["bald","/bɔːld/","лысый"],["beard","/bɪrd/","борода"],["moustache","/ˈmʌstæʃ/","усы"],["stubble","/ˈstʌbl/","щетина"],["eyebrows","/ˈaɪbraʊz/","брови"],["eyelashes","/ˈaɪlæʃɪz/","ресницы"],["ponytail","/ˈpoʊniteɪl/","хвост"],["bun","/bʌn/","пучок"],["braids/plaits","/breɪdz, plæts/","косички"]];
let voice=null,P={};
function pick(){const v=speechSynthesis.getVoices();voice=v.find(x=>/Google US English/i.test(x.name))||v.find(x=>/Samantha/i.test(x.name))||v.find(x=>x.lang=='en-US'||x.lang=='en_US')||null;$('#vn').textContent=voice?voice.name:'голос по умолчанию'}
try{speechSynthesis.onvoiceschanged=pick;pick()}catch(e){$('#vn').textContent='нет аудио в браузере'}
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/\//g,', '));u.lang='en-US';if(voice)u.voice=voice;u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
function playAll(){try{speechSynthesis.cancel();W.forEach(w=>{const u=new SpeechSynthesisUtterance(w[0].replace(/\//g,', '));u.lang='en-US';if(voice)u.voice=voice;u.rate=.85;speechSynthesis.speak(u)})}catch(e){}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(b)say(b.dataset.s)});
try{P=JSON.parse(localStorage.getItem('pw1')||'{}')}catch(e){}
function rp(){try{localStorage.setItem('pw1',JSON.stringify(P))}catch(e){}const k=Object.entries(P).sort((a,b)=>b[1]-a[1]);$('#pw').innerHTML=k.length?k.map(([w,n])=>`<div><span>${w} <button class="sp" data-s="${w}">🔊</button></span><em>×${n}</em></div>`).join(''):'<em>Пока ошибок нет 🎉</em>'}
function add(w){if(!w)return;P[w]=(P[w]||0)+1;rp()}
$('#vg').innerHTML=W.map(w=>`<div class="v"><div><b>${w[0]}</b><i>${w[1]}</i><small>${w[2]}</small></div><button class="sp" data-s="${w[0]}">🔊</button></div>`).join('');
const norm=s=>s.toLowerCase().replace(/[.!?,]/g,'').replace(/\s+/g,' ').trim();
const EX=[];
function mk(title,ins){const s=document.createElement('section');s.className='card';s.innerHTML=`<h2>${title}</h2><p class="in">${ins}</p><div class="b"></div><div class="bar"><button class="pr">Check</button><button>Show answers</button><button>Reset</button><span class="sc"></span></div>`;$('#ex').append(s);const bt=s.querySelectorAll('.bar button');return{s,b:s.querySelector('.b'),c:bt[0],a:bt[1],r:bt[2],sc:s.querySelector('.sc')}}
function typed(title,ins,items,h){const x=mk(title,ins);x.b.innerHTML='<ol>'+items.map((it,i)=>`<li><span class="q">${it[0]}</span>${it[4]?` <button class="sp" data-s="${it[4]}">🔊</button>`:''}<input autocomplete="off" autocapitalize="off" spellcheck="false"><span class="m"></span></li>`).join('')+'</ol>';
const L=[...x.b.querySelectorAll('li')],nm=s=>{s=norm(s);return h?s.replace(/ hair$/,''):s};
const ok=(i,v)=>items[i][1].some(a=>nm(a)==nm(v));
x.c.onclick=()=>{let n=0;L.forEach((l,i)=>{const p=l.querySelector('input'),m=l.querySelector('.m'),v=p.value;const g=v.trim()&&ok(i,v);p.className=g?'ok':'bad';m.textContent=g?'✓':'✗';if(g)n++;else if(p.dataset.l!==v){p.dataset.l=v;add(items[i][2])}});x.sc.textContent=`${n}/${items.length}`};
x.a.onclick=()=>L.forEach((l,i)=>{const p=l.querySelector('input');p.value=items[i][1][0];p.className='ok';l.querySelector('.m').textContent='💡'});
x.r.onclick=()=>{L.forEach(l=>{const p=l.querySelector('input');p.value='';p.className='';p.dataset.l='';l.querySelector('.m').textContent=''});x.sc.textContent=''};
EX.push(()=>title+'\n'+L.map((l,i)=>{const p=l.querySelector('input');return `${i+1}. ${p.value||'—'} ${p.value&&ok(i,p.value)?'✓':'✗ (answer: '+items[i][1][0]+')'}`}).join('\n')+'\n'+x.sc.textContent)}
/* 1 find */
{const x=mk('Exercise 1 — Find them in the wild','Read the text once. Then click every stretch of words from the topic. Click the whole phrase, not a single word.');
const T=(w,t)=>`<span class="p t" data-w="${w}">${t}</span>`,D=t=>`<span class="p">${t}</span>`;
x.b.innerHTML=`<p style="line-height:2">Meet my friends at the party. Tom is ${D('tall')} with ${T('spiky','spiky dark brown hair')}, ${T('beard','a thick beard')} and ${T('moustache','a moustache')}. Anna wears ${D('a green shirt')} and has ${T('long','long straight light brown hair')} with ${T('eyebrows','thick eyebrows')}. Mark has ${T('wavy','wavy ash blonde hair')}, ${T('stubble','light stubble')} and ${D('blue eyes')}. Lily is ${D('very friendly')}; she has ${T('curly','curly red hair')} in ${T('ponytail','a ponytail')}. Old Jack is ${T('bald','bald')} with ${T('grey/gray','a grey beard')}. Zoe has ${T('coily','coily dark brown hair')}, styled in ${T('braids/plaits','braids')} and ${T('bun','a bun')}.</p>`;
const S=[...x.b.querySelectorAll('.p')];S.forEach(p=>p.onclick=()=>p.classList.toggle('sel'));
x.c.onclick=()=>{let n=0,t=0;S.forEach(p=>{p.classList.remove('ok','bad','miss');const is=p.classList.contains('t'),se=p.classList.contains('sel');if(is)t++;if(is&&se){p.classList.add('ok');n++}else if(!is&&se)p.classList.add('bad');else if(is){p.classList.add('miss');add(p.dataset.w)}});x.sc.textContent=`${n}/${t}`};
x.a.onclick=()=>S.forEach(p=>{p.classList.remove('bad','miss');p.classList.toggle('sel',p.classList.contains('t'));if(p.classList.contains('t'))p.classList.add('ok')});
x.r.onclick=()=>{S.forEach(p=>p.classList.remove('sel','ok','bad','miss'));x.sc.textContent=''};
EX.push(()=>'Exercise 1 — Find them in the wild\nSelected: '+S.filter(p=>p.classList.contains('sel')).map(p=>p.textContent).join(' | ')+'\n'+x.sc.textContent)}
typed('Exercise 2 — Missing letters','Заполни пропуски и впиши слово целиком. Подсказка — перевод.',[
['eye_ro_s <i>(брови)</i>',['eyebrows'],'eyebrows'],['_oil_ <i>(афро-кудри)</i>',['coily'],'coily'],['m_u_tac_e <i>(усы)</i>',['moustache','mustache'],'moustache'],['s_i_y <i>(торчащие)</i>',['spiky'],'spiky'],['pon_yt_il <i>(хвост)</i>',['ponytail'],'ponytail'],['b_ld <i>(лысый)</i>',['bald'],'bald'],['e_ela_h_s <i>(ресницы)</i>',['eyelashes'],'eyelashes'],['pl_i_s <i>(косички)</i>',['plaits','braids'],'braids/plaits'],['a_h bl_nde <i>(пепельный блонд)</i>',['ash blonde'],'ash blonde']]);
typed('Exercise 3 — Listen & write','Нажми 🔊 (можно несколько раз) и впиши то, что услышал(а).',[
['1.',['light stubble'],'stubble',,'light stubble'],['2.',['a messy bun','messy bun'],'bun',,'a messy bun'],['3.',['medium-length','medium length'],'medium-length',,'medium-length hair'],['4.',['grey','gray'],'grey/gray',,'grey hair'],['5.',['a thick beard','thick beard'],'beard',,'a thick beard'],['6.',['wavy'],'wavy',,'wavy hair'],['7.',['dark brown eyebrows'],'eyebrows',,'dark brown eyebrows'],['8.',['short spiky'],'spiky',,'short spiky hair'],['9.',['long braids','long plaits'],'braids/plaits',,'long braids']].map(i=>{i[0]='Write what you hear:';return i}),1);
/* 4 sort */
{const C=['Hair texture/style','Hair colour','Hair length','Face hair & features','Updo (hairstyle)'];
const I=[['spiky',0],['red',1],['bun',4],['stubble',3],['long',2],['coily',0],['eyelashes',3],['ash blonde',1],['braids/plaits',4],['medium-length',2]];

['My grandfather is <code>___</code> — he lost all his hair years ago.',['bald'],'bald'],['Santa Claus has a long white <code>___</code> and rosy cheeks.',['beard'],'beard'],['She tied her hair in a high <code>___</code> for the gym.',['ponytail'],'ponytail'],['The punk’s hair stood up in <code>___</code> points.',['spiky'],'spiky'],['He doesn’t shave daily, so he has <code>___</code> on his chin.',['stubble'],'stubble'],['She has long dark <code>___</code> that make her eyes look big.',['eyelashes'],'eyelashes'],['Her hair isn’t straight or curly — it falls in soft <code>___</code> waves.',['wavy'],'wavy'],['He has a thick <code>___</code> above his lip, like a cowboy.',['moustache','mustache'],'moustache'],['Her hair is full of tight little spirals — it’s <code>___</code>.',['coily'],'coily']]);

['<code>(wavy / ash blonde / medium-length)</code> hair',['medium-length wavy ash blonde','medium length wavy ash blonde'],'medium-length'],['<code>(curly / long / red)</code> hair',['long curly red'],'curly'],['<code>(coily / dark brown / short)</code> hair',['short coily dark brown'],'coily'],['<code>(grey / wavy / long)</code> hair',['long wavy grey','long wavy gray'],'wavy'],['<code>(short / grey / straight)</code> hair',['short straight grey','short straight gray'],'straight'],['<code>(light brown / straight / long)</code> hair',['long straight light brown'],'light brown'],['<code>(spiky / short / red)</code> hair',['short spiky red'],'spiky'],['<code>(medium-length / curly / dark brown)</code> hair',['medium-length curly dark brown','medium length curly dark brown'],'dark brown']],1);

{const s=document.createElement('section');s.className='card';s.innerHTML=`<h2>Exercise 10 — Write as many words as you remember</h2><p class="in">Закрой словарь вверху и впиши все слова темы, которые помнишь (через запятую или с новой строки).</p><textarea style="min-height:100px"></textarea><div class="bar"><button class="pr">Check</button><span class="sc"></span></div><div class="r"></div>`;$('#fr').append(s);const ta=s.querySelector('textarea'),r=s.querySelector('.r');
const keys=[['spiky'],['straight'],['wavy'],['curly'],['coily'],['light brown'],['grey','gray'],['ash blonde'],['red'],['dark brown'],['short'],['medium-length','medium length'],['long'],['bald'],['beard'],['moustache','mustache'],['stubble'],['eyebrows'],['eyelashes'],['ponytail'],['bun'],['braids','plaits']];
let fn=0;s.querySelector('button').onclick=()=>{const t=ta.value.toLowerCase();const f=keys.map(k=>k.some(x=>new RegExp('(^|[^a-z])'+x+'([^a-z]|$)').test(t)));fn=f.filter(Boolean).length;s.querySelector('.sc').textContent=`${fn}/${keys.length}`;r.innerHTML='<b>Forgotten:</b> '+(f.every(Boolean)?'none 🎉':keys.map((k,i)=>f[i]?'':W[i][0]).filter(Boolean).join(', '));keys.forEach((k,i)=>{if(!f[i])add(W[i][0])})};
EX.push(()=>'Exercise 10 — Retrieve ('+fn+'/22)\n'+(ta.value||'—'))}
{const s=document.createElement('section');s.className='card';s.innerHTML=`<h2>Exercise 11 — Choose 3 words you are least confident with</h2><p class="in">Отметь ровно 3 слова — и выполни задания с ними.</p><div class="cb">${W.map(w=>`<label><input type="checkbox" value="${w[0]}" style="width:auto;margin:0 4px 0 0">${w[0]}</label>`).join('')}</div><div class="t" style="margin-top:12px"></div>`;$('#fr').append(s);
const cbs=[...s.querySelectorAll('input')],t=s.querySelector('.t');
const draw=()=>{const sel=cbs.filter(c=>c.checked);if(sel.length>3){event.target.checked=false;return}
t.innerHTML=sel.length==3?sel.map(c=>`<div class="card" style="background:var(--bg)"><b>${c.value}</b> <button class="sp" data-s="${c.value}">🔊</button><br>1. Translate into Russian:<br><input><br>2. Write a sentence with it:<textarea></textarea>3. Describe someone you know using it:<textarea></textarea></div>`).join('')+'<button class="pr cc">Copy this part</button> <span class="sc"></span>':'<em>Выбери ещё '+(3-sel.length)+'</em>'};
s.addEventListener('change',e=>{if(e.target.type=='checkbox')draw()});
t.addEventListener('click',e=>{if(e.target.classList.contains('cc'))cp(g(),t.querySelector('.sc'))});
const g=()=>'Exercise 11 — Least confident words\n'+[...t.querySelectorAll('.card')].map(c=>{const f=c.querySelectorAll('input,textarea');return `${c.querySelector('b').textContent}\n1) ${f[0].value||'—'}\n2) ${f[1].value||'—'}\n3) ${f[2].value||'—'}`}).join('\n\n');EX.push(g)}
/* copy */
function cp(txt,el){const ok=()=>{if(el){el.textContent='✓ Copied!';setTimeout(()=>el.textContent='',2500)}};try{navigator.clipboard.writeText(txt).then(ok,fb)}catch(e){fb()}function fb(){const a=document.createElement('textarea');a.value=txt;document.body.append(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove();ok()}}
function copyAll(){const pw=Object.entries(P).map(([w,n])=>w+' ×'+n).join(', ')||'none';cp('Student: '+($('#nm').value||'—')+'\n\n'+EX.map(f=>f()).join('\n\n')+'\n\nProblem words: '+pw,$('#cm'))}
