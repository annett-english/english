<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Food vocabulary A1</title>
<style>
:root{--bg:#fbf8f3;--fg:#2a2a2a;--card:#fff;--mut:#6b6b6b;--ac:#2f7d4f;--ac2:#e8f3ec;--bd:#e5dfd3;--ok:#1f8f4e;--bad:#c93c3c;--okb:#e3f5ea;--badb:#fbe6e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16181a;--fg:#ececec;--card:#1f2326;--mut:#a0a6a8;--ac:#5cc489;--ac2:#223a2c;--bd:#343a3d;--ok:#5cc489;--bad:#ff7b7b;--okb:#1f3a2a;--badb:#442525}}
:root[data-theme="dark"]{--bg:#16181a;--fg:#ececec;--card:#1f2326;--mut:#a0a6a8;--ac:#5cc489;--ac2:#223a2c;--bd:#343a3d;--ok:#5cc489;--bad:#ff7b7b;--okb:#1f3a2a;--badb:#442525}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px;display:grid;grid-template-columns:1fr 230px;gap:16px}
main{min-width:0}aside{position:sticky;top:12px;align-self:start;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;max-height:80vh;overflow:auto;font-size:14px}
@media(max-width:800px){.wrap{grid-template-columns:1fr}aside{order:-1;position:static;max-height:150px}}
h1{margin:8px 0}h2{margin:0 0 4px;font-size:20px}.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:0 0 16px}
.ins{color:var(--mut);margin:0 0 12px}button{font:inherit;cursor:pointer;border:1px solid var(--ac);background:var(--ac);color:#fff;border-radius:8px;padding:6px 12px}
button.g{background:transparent;color:var(--ac)}button.sp{padding:4px 9px;background:var(--ac2);color:var(--fg);border-color:var(--bd)}
input{font:inherit;padding:6px 8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg);min-width:0;width:170px}input.wide{width:100%;margin-top:4px}input.gap{width:120px}
.it{padding:8px 10px;border-radius:10px;border:1px solid transparent;display:flex;flex-wrap:wrap;gap:8px;align-items:center}.items{counter-reset:i}.it::before{counter-increment:i;content:counter(i)".";font-weight:700;color:var(--mut);min-width:22px}
.it.ok{background:var(--okb);border-color:var(--ok)}.it.bad{background:var(--badb);border-color:var(--bad)}.ans{color:var(--ok);font-weight:600}.em{font-size:34px}.st{flex:1 1 100%}
.bar{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sc{font-weight:700}
.opt,.chip,.cell{background:var(--card);color:var(--fg);border:1px solid var(--bd)}.opt.on,.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.bank{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.bank span{background:var(--ac2);padding:2px 10px;border-radius:99px}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}.w{border:1px solid var(--bd);border-radius:10px;padding:8px;display:flex;gap:8px;align-items:center}.w small{color:var(--mut);display:block}
.q{font-size:19px;font-weight:600;margin:8px 0}.qo{display:grid;grid-template-columns:1fr 1fr;gap:8px}.qo button{text-align:left;padding:10px}.qo .right{background:var(--ok);color:#fff}.qo .wrong{background:var(--bad);color:#fff}
.qg{display:grid;grid-template-columns:1fr 130px;gap:12px}.lad{font-size:13px;margin:0;padding:0;list-style:none}.lad li{padding:1px 6px;border-radius:6px}.lad .cur{background:var(--ac);color:#fff}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;max-width:380px}.cell{aspect-ratio:1;padding:0;font-weight:700;text-transform:uppercase}.cell.s{background:#f5c542;color:#222}.cell.f{background:var(--ac);color:#fff}
.wl{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.wl span{background:var(--ac2);padding:2px 10px;border-radius:99px}.wl .d{text-decoration:line-through;opacity:.6}
textarea{width:100%;min-height:140px;font:14px/1.4 ui-monospace,monospace;background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:8px;padding:8px}
table{width:100%;border-collapse:collapse}td{padding:3px 2px;border-bottom:1px solid var(--bd)}
</style></head><body>
<noscript><p style="padding:16px;background:#fde;color:#900;margin:0">JavaScript отключён. Откройте файл в обычном браузере (Chrome, Safari, Edge).</p></noscript>
<script>window.onerror=function(m,u,l){var d=document.createElement('p');d.style.cssText='padding:12px;background:#fde;color:#900;margin:0;font:14px monospace';d.textContent='Ошибка скрипта: '+m+' (строка '+l+'). Отправьте этот текст — я исправлю.';document.body.prepend(d)}</script>
<div class="wrap"><main>
<h1>🔁 Review · Food &amp; Drink A1</h1>
<p class="ins">Повторение: 4 упражнения по 10 пунктов. Слова и порядок каждый раз разные — нажимайте «Новое задание ↻».</p>
<div id="exs"></div>
<section class="card"><h2>✅ Final check / Итог</h2>
<div class="bar"><button class="g" id="atest">🔊 Проверить аудио</button><span id="vname" class="sc"></span></div>
<div class="bar"><input id="nm" placeholder="Your name"><button id="cp">📋 Скопировать все ответы</button><span id="cpm" class="sc"></span></div>
<textarea id="out" readonly placeholder="Здесь появятся ваши ответы…"></textarea></section>
</main>
<aside><b>⚠ Проблемные слова</b><div id="pw" style="margin-top:6px"></div><button class="g" style="margin-top:8px;padding:2px 8px" onclick="P={};sv();renderP()">Очистить</button></aside></div>
<script>
const W=[
["courgette|zucchini","цукини","/kɔːˈʒet/ · /zuˈkiːni/","","v","A ___ is a long green vegetable, like a small cucumber."],
["prawns|shrimps","креветки","/prɔːnz/ · /ʃrɪmps/","🦐","p","I like ___ with garlic and rice."],
["sparkling water","газированная вода","/ˈspɑːklɪŋ ˈwɔːtə/","🫧","d","Can I have a glass of ___, please?"],
["mushrooms","грибы","/ˈmʌʃruːmz/","🍄","v","We put ___ on the pizza."],
["herbs","травы, зелень","/hɜːbz/","🌿","o","Basil and parsley are ___."],
["olives","оливки","/ˈɒlɪvz/","🫒","o","A Greek salad has feta cheese and black ___."],
["potatoes","картофель","/pəˈteɪtəʊz/","🥔","v","French fries are made from ___."],
["lettuce","салат (латук)","/ˈletɪs/","🥬","v","I put ___ and tomato in my sandwich."],
["chillies|chilies","перец чили","/ˈtʃɪliz/","🌶️","v","Be careful! These ___ are very hot."],
["sugar","сахар","/ˈʃʊɡə/","🍬","o","I don’t take ___ in my tea."],
["pasta","паста, макароны","/ˈpæstə/","🍝","c","Spaghetti is a kind of ___."],
["noodles","лапша","/ˈnuːdlz/","🍜","c","In China people eat a lot of ___ with soup."],
["lemonade","лимонад","/ˌleməˈneɪd/","🥤","d","On a hot day I drink cold ___."],
["butter","сливочное масло","/ˈbʌtə/","🧈","o","Put some ___ on your toast."],
["cucumber","огурец","/ˈkjuːkʌmbə/","🥒","v","A ___ is green and has a lot of water."],
["orange","апельсин","/ˈɒrɪndʒ/","🍊","f","I have an ___ and a glass of juice for breakfast."],
["strawberry","клубника","/ˈstrɔːbəri/","🍓","f","I love ___ ice cream."],
["melon","дыня","/ˈmelən/","🍈","f","A ___ is big and sweet, green or yellow inside."],
["peas","горох","/piːz/","","v","Green ___ are small and round."],
["lamb","баранина","/læm/","🐑","p","In Greece they often eat ___ at Easter."],
["chicken","курица","/ˈtʃɪkɪn/","🍗","p","Roast ___ with potatoes is my favourite dinner."],
["bread","хлеб","/bred/","🍞","c","I buy fresh ___ at the bakery."],
["cereal","хлопья","/ˈsɪəriəl/","🥣","c","Kids often eat ___ with milk for breakfast."],
["yoghurt|yogurt","йогурт","/ˈjɒɡət/","🥛","o","I eat ___ with honey and fruit."],
["bell pepper|pepper","(болгарский) перец","/bel ˈpepə/","🫑","v","A red ___ is sweet, not hot."],
["onion","лук","/ˈʌnjən/","🧅","v","When I cut an ___, I cry."],
["oil","растительное масло","/ɔɪl/","","o","Olive ___ is good for salads."],
["fish","рыба","/fɪʃ/","🐟","p","My cat loves ___."],
["pear","груша","/peə/","🍐","f","An apple and a ___ are fruit."],
["aubergine|eggplant","баклажан","/ˈəʊbəʒiːn/ · /ˈeɡplɑːnt/","🍆","v","Moussaka is made with ___ and meat."]
].map((a,i)=>({i,en:a[0],ru:a[1],ipa:a[2],e:a[3],c:a[4],s:a[5]}));
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],R=a=>a.slice().sort(()=>Math.random()-.5);
const D=w=>w.en.split('|')[0],DD=w=>w.en.split('|').join(' / ');
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const norm=s=>s.toLowerCase().replace(/[.!?,]/g,'').replace(/\s+/g,' ').trim();
const use={};const pick=(n,f=()=>1)=>R(R(W.filter(f)).sort((a,b)=>(use[a.i]||0)-(use[b.i]||0)).slice(0,n).map(w=>(use[w.i]=(use[w.i]||0)+1,w)));
/* audio */
let V=null;const TTS='speechSynthesis' in window;
function pv(){const l=speechSynthesis.getVoices();V=l.find(v=>/Google US English/i.test(v.name))||l.find(v=>/Samantha/i.test(v.name))||l.find(v=>v.lang==='en-US')||l.find(v=>/^en/i.test(v.lang))||null;$('#vname').textContent=V?'Голос: '+V.name:'Голос по умолчанию'}
if(TTS){pv();speechSynthesis.onvoiceschanged=pv}
function utt(t,r){const u=new SpeechSynthesisUtterance(t);u.lang='en-US';if(V)u.voice=V;u.rate=r;return u}
function say(t,r=.9){if(!TTS){alert('Ваш браузер не поддерживает озвучку. Попробуйте Chrome или Safari.');return}speechSynthesis.cancel();speechSynthesis.speak(utt(t,r))}
document.addEventListener('click',e=>{const b=e.target.closest('[data-say]');if(b)say(b.dataset.say,+b.dataset.r||.9)});
$('#atest').onclick=()=>{say('Audio check. One, two, three. Can you hear me?');pv()};
const SP=(t,r)=>`<button class="sp" data-say="${esc(t)}"${r?' data-r="'+r+'"':''}>${r?'🐢':'🔊'}</button>`;
/* problems */
let P={};try{const q=JSON.parse(localStorage.getItem('foodA1_pw')||'{}');Object.keys(q).forEach(k=>{if(/^\d+$/.test(k)&&W[+k]&&+q[k]>0)P[k]=+q[k]})}catch(e){}
function sv(){try{localStorage.setItem('foodA1_pw',JSON.stringify(P))}catch(e){}}
function addProb(i){P[i]=(P[i]||0)+1;sv();renderP()}
function renderP(){const k=Object.keys(P).sort((a,b)=>P[b]-P[a]);$('#pw').innerHTML=k.length?'<table>'+k.map(i=>`<tr><td>${SP(D(W[i]))}</td><td><b>${D(W[i])}</b><br><small>${W[i].ru}</small></td><td>×${P[i]}</td></tr>`).join('')+'</table>':'<small>Пока пусто — ошибки появятся здесь.</small>'}
renderP();
/* exercise engine */
const I=o=>`<div class="it"${o.w!=null?' data-w="'+o.w+'"':''} data-a="${esc(o.a||'')}" data-q="${esc(o.q)}"${o.free?' data-free="1" data-min="'+(o.min||2)+'"':''}${o.need?' data-need="'+esc(o.need)+'"':''}>${o.body}<span class="ans" hidden>${o.ans||''}</span></div>`;
const val=it=>it.dataset.v!==undefined?it.dataset.v:((it.querySelector('input')||{}).value||'');
/* review */
const TT={1:'Translate into English',2:'Fix the spelling',3:'Choose the right word',4:'Listen and complete'};
const IN={1:'Переведите слово на английский.',2:'В слове ошибка! Напишите его правильно.',3:'Выберите подходящее слово по смыслу.',4:'Прослушайте предложение (🐢 — медленно) и впишите пропущенное слово.'};
function typo(w){const x=D(w);const i=1+Math.random()*(x.length-3)|0;const k=Math.random()*3|0;let r;if(k===0)r=x.slice(0,i)+x[i+1]+x[i]+x.slice(i+2);else if(k===1)r=x.slice(0,i)+x.slice(i+1);else r=x.slice(0,i)+x[i]+x.slice(i);return r===x||x.includes(' ')?x.replace(/[aeiou]/,m=>'aeiou'[('aeiou'.indexOf(m)+1)%5]):r}
const B={};
B[1]=()=>pick(10).map(w=>I({w:w.i,a:w.en,q:w.ru+' →',body:`<b>${w.ru}</b> →<input placeholder="English">`,ans:DD(w)+' '+SP(D(w))})).join('');
B[2]=()=>pick(10).map(w=>I({w:w.i,a:w.en,q:'fix: '+typo(w),body:`<span class="wd">❌ <b class="bw"></b></span><input placeholder="correct spelling">`,ans:DD(w)+' '+w.ipa})).join('');
B[3]=()=>pick(10).map(w=>{const d=R(W.filter(x=>x.c!==w.c&&!/ /.test(D(x))))[0];const o=R([w,d]);return I({w:w.i,a:w.en,q:w.s,body:`<span class="st">${w.s.replace('___','<b>___</b>')}</span>`+o.map(x=>`<button class="opt" onclick="sel(this)">${D(x)}</button>`).join(''),ans:DD(w)})}).join('');
B[4]=()=>pick(10).map(w=>I({w:w.i,a:w.en,q:'[audio] '+w.s,body:SP(w.s.replace('___',D(w)))+SP(w.s.replace('___',D(w)),.5)+`<span>${w.s.replace('___','<input class="gap">')}</span>`,ans:DD(w)})).join('');
function sel(b){const it=b.closest('.it');it.dataset.v=b.textContent;it.querySelectorAll('.opt').forEach(x=>x.classList.toggle('on',x===b))}
function mount(n){$('#ex'+n).innerHTML=`<h2>Review ${n}. ${TT[n]}</h2><p class="ins">${IN[n]}</p><div class="items">${B[n]()}</div><div class="bar"><button onclick="chk(${n})">Проверить</button><button class="g" onclick="show(${n})">Показать ответы</button><button class="g" onclick="mount(${n})">Новое задание ↻</button><span class="sc"></span></div>`;if(n===2)$$('#ex2 .it').forEach(it=>{it.querySelector('.bw').textContent=it.dataset.q.slice(5)})}
function chk(n){let ok=0,t=0;$$('#ex'+n+' .it').forEach(it=>{t++;const v=val(it).trim();const g=!!v&&it.dataset.a.split('|').map(norm).includes(norm(v));it.classList.toggle('ok',g);it.classList.toggle('bad',!g);if(g)ok++;else if(v)addProb(+it.dataset.w)});$('#ex'+n+' .sc').textContent='✔ '+ok+' / '+t}
function show(n){$$('#ex'+n+' .ans').forEach(a=>a.hidden=false)}
$('#exs').innerHTML=[1,2,3,4].map(n=>`<section class="card" id="ex${n}"></section>`).join('');[1,2,3,4].forEach(mount);
$('#cp').onclick=async()=>{let o=`Name: ${$('#nm').value||'—'} | Level: A1 | Review: Food & Drink | ${new Date().toLocaleDateString()}\n`;
for(let n=1;n<=4;n++){o+=`\nReview ${n}: ${TT[n]}\n`;$$('#ex'+n+' .it').forEach((it,k)=>{o+=`${k+1}) ${it.dataset.q} → ${val(it).trim()||'—'}${it.classList.contains('ok')?' ✔':it.classList.contains('bad')?' ✘':''}\n`})}
const k=Object.keys(P).sort((a,b)=>P[b]-P[a]);o+='\nProblem words: '+(k.length?k.map(i=>D(W[i])+' ×'+P[i]).join(', '):'—')+'\n';
const t=$('#out');t.value=o;t.select();let ok=false;try{await navigator.clipboard.writeText(o);ok=true}catch(e){try{ok=document.execCommand('copy')}catch(e2){}}
$('#cpm').textContent=ok?'Скопировано ✔':'Выделите текст ниже и скопируйте (Ctrl/Cmd+C)'};
$('#atest').onclick=()=>{say('Audio check. One, two, three. Can you hear me?');pv()};
</script></body></html>
