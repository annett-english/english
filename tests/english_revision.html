<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English A2 — Повторение</title>
<style>
:root{--bg:#f6f7fb;--fg:#1d2433;--card:#fff;--mut:#6b7488;--ac:#3b6ef5;--ok:#1e9e5a;--bad:#d9433b;--bd:#e1e5ee;--okb:#e4f6ec;--badb:#fde8e6;--shb:#e6eefe;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--fg:#e8ebf2;--card:#1b202b;--mut:#9aa3b8;--ac:#7c9cff;--ok:#4cc38a;--bad:#ff7b72;--bd:#2c3342;--okb:#16352a;--badb:#3c1f1e;--shb:#1f2a47}}
:root[data-theme="dark"]{--bg:#12151c;--fg:#e8ebf2;--card:#1b202b;--mut:#9aa3b8;--ac:#7c9cff;--ok:#4cc38a;--bad:#ff7b72;--bd:#2c3342;--okb:#16352a;--badb:#3c1f1e;--shb:#1f2a47}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:16px 16px 8px;max-width:1100px;margin:auto}
h1{margin:0 0 6px;font-size:1.5rem}
.vbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.9rem;color:var(--mut)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:16px;max-width:1100px;margin:auto;padding:8px 16px 40px}
@media(max-width:820px){.layout{grid-template-columns:1fr}aside{order:-1}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:16px}
h2{margin:0 0 4px;font-size:1.15rem}
.ins{margin:0 0 10px;color:var(--mut);font-size:.93rem}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:9px;padding:6px 12px}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
button:hover{filter:brightness(.96)}
.sp{padding:2px 7px;border-radius:20px}
.grp h3{margin:12px 0 6px;font-size:1rem}
.vg{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px}
.v{display:flex;gap:6px;align-items:baseline;padding:5px 8px;border:1px solid var(--bd);border-radius:9px;font-size:.92rem}
.v i{color:var(--mut);font-style:normal;font-size:.85rem}.v span{color:var(--mut)}
.note{background:var(--shb);border-radius:9px;padding:8px 12px;font-size:.92rem;margin-top:10px}
ol.body{padding-left:0;list-style:none;margin:0}
ol.body li,.crow{padding:7px 10px;border-radius:9px;margin-bottom:4px;border:1px solid transparent}
p.body{line-height:2.4}
.n{display:inline-block;min-width:1.6em;color:var(--mut);font-weight:600}
input{font:inherit;color:var(--fg);background:var(--bg);border:1.5px solid var(--bd);border-radius:7px;padding:3px 8px;margin:0 4px;max-width:100%}
input:focus{outline:2px solid var(--ac);border-color:var(--ac)}
.h{color:var(--mut);font-size:.88rem}
.ok{background:var(--okb)}.bad{background:var(--badb)}.shown{background:var(--shb)}
span.ok input,li.ok input{border-color:var(--ok)}span.bad input,li.bad input{border-color:var(--bad)}
.btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}.res{font-weight:700}
.bank{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}.bank b{background:var(--shb);padding:2px 10px;border-radius:20px;font-weight:600}
.cb.on{background:var(--ac);color:#fff;border-color:var(--ac)}.cb{margin-left:4px;padding:3px 9px;font-size:.88rem}
aside .card{position:sticky;top:12px}
table{width:100%;border-collapse:collapse;font-size:.9rem}td{padding:4px 2px;border-bottom:1px solid var(--bd)}
.hm{font-size:2rem;letter-spacing:.35em;text-align:center;margin:8px 0;font-family:ui-monospace,Menlo,monospace;word-break:break-all}
.kb{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}.kb button{width:34px;padding:5px 0;text-transform:uppercase}.kb button:disabled{opacity:.35}
textarea{width:100%;min-height:120px;background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:9px;padding:8px;font:.85rem ui-monospace,Menlo,monospace;margin-top:8px}
</style></head><body>
<header><h1>🌍 English A2 — повторение</h1>
<div class="vbar"><span id="vs">Проверяю аудио…</span><button id="vt" class="sp">🔊 Тест звука</button><span id="vr"></span></div></header>
<div class="layout"><main id="main"></main>
<aside><div class="card"><h2>⚠️ Проблемные слова</h2><p class="ins">Слова, где была ошибка</p><table id="pt"></table><div class="btns"><button id="pc" class="sp">Очистить</button></div></div></aside></div>
<script>
const $=s=>document.querySelector(s),el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const norm=s=>s.toLowerCase().replace(/[’`]/g,"'").replace(/-/g,' ').replace(/\band\b/g,' ').replace(/[.,!?]/g,'').replace(/\s+/g,' ').trim();
function shuffle(a,key){let r;for(let t=0;t<40;t++){r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[r[i],r[j]]=[r[j],r[i]]}
if(!key||!r.some((x,i)=>i>1&&key(x)==key(r[i-1])&&key(x)==key(r[i-2])))break}return r}
/* ---------- audio ---------- */
let voice=null;
function pick(){if(!('speechSynthesis' in window)){$('#vs').textContent='❌ В этом браузере нет синтеза речи. Открой в Chrome/Safari.';return}
const vs=speechSynthesis.getVoices();
voice=vs.find(v=>/Google US English/i.test(v.name))||vs.find(v=>/Samantha/i.test(v.name))||vs.find(v=>v.lang==='en-US')||vs.find(v=>/^en/i.test(v.lang))||null;
$('#vs').textContent=voice?'Голос: '+voice.name+' ('+voice.lang+')':'Английский голос не найден — установи English (US) в настройках системы'}
function utt(t){const u=new SpeechSynthesisUtterance(t);if(voice)u.voice=voice;u.lang='en-US';u.rate=.85;return u}
function say(t){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();speechSynthesis.speak(utt(t))}
function sayAll(a){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();a.forEach(t=>speechSynthesis.speak(utt(t)))}
if('speechSynthesis' in window){speechSynthesis.onvoiceschanged=pick;pick();setTimeout(pick,800)}else pick();
$('#vt').onclick=()=>{if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=utt('Hello! The audio is working.');
$('#vr').textContent='…';u.onstart=()=>$('#vr').textContent='✅ звук идёт';u.onerror=()=>$('#vr').textContent='❌ ошибка звука';speechSynthesis.speak(u);
setTimeout(()=>{if($('#vr').textContent==='…')$('#vr').textContent='❌ звука нет — проверь громкость/голос'},2500)};
/* ---------- vocabulary ---------- */
const V={"☀️ Weather":[["warm","wɔːrm","тёплый"],["cloudy","ˈklaʊdi","облачно"],["raining","ˈreɪnɪŋ","идёт дождь"],["windy","ˈwɪndi","ветрено"],["foggy","ˈfɔːɡi","туманно"],["wet","wet","мокрый"],["snowing","ˈsnoʊɪŋ","идёт снег"],["sunny","ˈsʌni","солнечно"],["hot","hɑːt","жаркий"],["cold","koʊld","холодный"]],
"⛰️ Nature":[["mountains","ˈmaʊntnz","горы"],["the sky","ðə skaɪ","небо"],["a volcano","vɑːlˈkeɪnoʊ","вулкан"],["grass","ɡræs","трава"],["a field","fiːld","поле"],["a hill","hɪl","холм"],["a river","ˈrɪvər","река"],["a lake","leɪk","озеро"],["a sea","siː","море"],["a forest","ˈfɔːrɪst","лес"],["a waterfall","ˈwɔːtərfɔːl","водопад"],["an ocean","ˈoʊʃn","океан"],["a cave","keɪv","пещера"],["a tree","triː","дерево"]],
"✈️ Travel":[["book a flight","bʊk ə flaɪt","забронировать билет"],["go by train","ɡoʊ baɪ treɪn","ехать на поезде"],["accommodation","əˌkɑːməˈdeɪʃn","жильё"],["rent a car","rent ə kɑːr","арендовать машину"],["stay in a hotel","steɪ ɪn ə hoʊˈtel","остановиться в отеле"],["eat out","iːt aʊt","есть вне дома"],["buy souvenirs","baɪ ˌsuːvəˈnɪrz","покупать сувениры"],["have a good time","hæv ə ɡʊd taɪm","хорошо проводить время"],["meet new people","miːt nuː ˈpiːpl","знакомиться с людьми"],["leave a review","liːv ə rɪˈvjuː","оставить отзыв"],["have an adventure","hæv ən ədˈventʃər","пережить приключение"],["make sure","meɪk ʃʊr","убедиться"]],
"🔢 Big numbers":[["hundred","ˈhʌndrəd","сто"],["thousand","ˈθaʊznd","тысяча"],["million","ˈmɪljən","миллион"],["billion","ˈbɪljən","миллиард"]]};
const main=$('#main');
const rem=el('section','card');rem.innerHTML='<h2>📚 Напоминание</h2><p class="ins">Задание: нажми 🔊, послушай слово и повтори вслух 2 раза. Потом нажми «Слушать всё».</p>';
for(const g in V){const d=el('div','grp');d.innerHTML=`<h3>${g}</h3>`;const b=el('button','sp','▶ Слушать всё');b.onclick=()=>sayAll(V[g].map(x=>x[0].replace(/^(a|an|the) /,'')));d.firstChild.append(' ',b);
const gr=el('div','vg');V[g].forEach(([w,t,r])=>{const v=el('div','v',`<button class="sp">🔊</button><b>${w}</b><i>/${t}/</i><span>— ${r}</span>`);v.firstChild.onclick=()=>say(w);gr.append(v)});d.append(gr);rem.append(d)}
rem.append(el('div','note','<b>Comparative / superlative:</b> big → bigger → the biggest · hot → hotter → the hottest · comfortable → more comfortable → the most comfortable · good → better → the best · bad → worse → the worst.<br><b>Big numbers:</b> без точного числа — hundreds / thousands / millions + <b>of</b> (hundreds of people).'));
main.append(rem);
/* ---------- problem words ---------- */
const prob={};
function addProb(it){const k=it.n||it.a.split('|')[0];prob[k]={say:it.say||it.a.split('|')[0],ru:it.h||''};drawProb()}
function drawProb(){const t=$('#pt');t.innerHTML='';const ks=Object.keys(prob);if(!ks.length){t.innerHTML='<tr><td class="h">Пока пусто 👍</td></tr>';return}
ks.forEach(k=>{const r=el('tr','',`<td><b>${k}</b><br><span class="h">${prob[k].ru}</span></td><td><button class="sp">🔊</button></td>`);r.querySelector('button').onclick=()=>say(prob[k].say);t.append(r)})}
$('#pc').onclick=()=>{for(const k in prob)delete prob[k];drawProb()};drawProb();
/* ---------- exercises ---------- */
const CATS=["Weather","Landscape","Travel phrases"];
const EX=[
{t:"Weather & nature — впиши слово",i:"Впиши пропущенное слово (подсказка по-русски в скобках).",items:[
{q:"Take an umbrella! It's ___ outside.",a:"raining",h:"идёт дождь"},{q:"The Pacific is the biggest ___ in the world.",a:"ocean",h:"океан"},
{q:"I can't see the road. It's very ___.",a:"foggy",h:"туманно"},{q:"The ___ erupted and lava ran down the mountain.",a:"volcano",h:"вулкан"},
{q:"It's −10°C today. It's really ___.",a:"cold",h:"холодно"},{q:"We took photos of a beautiful ___ — water fell from the high rocks.",a:"waterfall",h:"водопад"},
{q:"Hold your hat! It's very ___ today.",a:"windy",h:"ветрено"},{q:"Bats live in a dark ___ in the mountains.",a:"cave",h:"пещера"}]},
{t:"Comparative & superlative",i:"Поставь слово в скобках в правильную форму (с the, если нужно).",size:16,items:[
{q:"Russia is ___ (big) than Poland.",a:"bigger"},{q:"Everest is ___ (high) mountain in the world.",a:"the highest"},
{q:"Today is ___ (hot) than yesterday.",a:"hotter"},{q:"This is ___ (good) hotel in the city.",a:"the best"},
{q:"Trains are ___ (comfortable) than buses.",a:"more comfortable"},{q:"The Nile is one of ___ (long) rivers in the world.",a:"the longest"},
{q:"Planes are ___ (expensive) than trains.",a:"more expensive"},{q:"Last winter was ___ (bad) than this winter.",a:"worse"}]},
{t:"Verb tenses (A2)",i:"Поставь глагол в нужную форму: Present Simple / Continuous, Past Simple, Future.",size:16,items:[
{q:"Yesterday we ___ (go) to the museum.",a:"went"},{q:"She usually ___ (eat) out on Fridays.",a:"eats"},
{q:"Look! It ___ (rain) now.",a:"is raining"},{q:"I ___ (book) a flight last week.",a:"booked"},
{q:"Next summer they ___ (rent) a flat in Spain.",a:"will rent|are going to rent"},{q:"We ___ (stay) in a small hotel last year.",a:"stayed"},
{q:"Right now I ___ (look) for souvenirs.",a:"am looking"},{q:"He ___ (not / leave) a review yesterday.",a:"didn't leave|did not leave"}]},
{t:"Travel story — вставь слова по смыслу",i:"Вставь слова из рамки в текст. Каждое слово — один раз.",inline:1,size:11,bank:["make","souvenirs","by","booked","out","accommodation","stayed","rented"],items:[
{q:"Last summer I ___ a flight to Italy.",a:"booked"},{q:"We also found ___ near the city centre.",a:"accommodation"},
{q:"We went ___ train from Rome to Florence.",a:"by"},{q:"In Florence we ___ a car for a week.",a:"rented"},
{q:"We ___ in a small hotel.",a:"stayed"},{q:"Every evening we ate ___ in local restaurants.",a:"out"},
{q:"I bought some ___ for my family.",a:"souvenirs"},{q:"Before you travel, ___ sure you have your passport.",a:"make"}]},
{t:"Big numbers — запиши словами",i:"Напиши числа словами (and и дефис можно ставить как в учебнике).",size:30,items:[
{q:"345,678 =",n:"345,678",a:"three hundred and forty-five thousand six hundred and seventy-eight"},
{q:"9,876,543 =",n:"9,876,543",a:"nine million eight hundred and seventy-six thousand five hundred and forty-three"},
{q:"12,345,678 =",n:"12,345,678",a:"twelve million three hundred and forty-five thousand six hundred and seventy-eight"},
{q:"120,000 =",n:"120,000",a:"one hundred and twenty thousand"},{q:"7,000,000 =",n:"7,000,000",a:"seven million"},
{q:"___ of people came to the concert.",a:"hundreds",h:"сотни"},{q:"___ of tourists visit Krakow every year.",a:"thousands",h:"тысячи"},{q:"There are ___ of stars in the sky.",a:"millions",h:"миллионы"}]},
{t:"Categorise — сортируй",i:"Выбери категорию для каждого слова.",cat:1,items:[
["foggy",0,"туманно"],["waterfall",1,"водопад"],["book a flight",2,"забронировать билет"],["hill",1,"холм"],["sunny",0,"солнечно"],["buy souvenirs",2,"покупать сувениры"],["snowing",0,"идёт снег"],["river",1,"река"]].map(x=>({q:x[0],a:CATS[x[1]],n:x[0],say:x[0],h:x[2]}))}
];
function build(ex,i){
const s=el('section','card');s.innerHTML=`<h2>${i+1}. ${ex.t}</h2><p class="ins">${ex.i}</p>`+(ex.bank?`<div class="bank">${shuffle(ex.bank).map(b=>`<b>${b}</b>`).join('')}</div>`:'');
const body=el(ex.inline?'p':'ol','body'),bt=el('div','btns'),res=el('span','res');
const bc=el('button','p','Проверить'),bs=el('button','','Показать ответы'),br=el('button','','↻ Заново');bt.append(bc,bs,br,res);s.append(body,bt);
const fill=()=>{body.innerHTML='';res.textContent='';ex.cur=[];const items=(ex.inline?ex.items:shuffle(ex.items,ex.cat?x=>x.a:null));
items.forEach((it,k)=>{const row=el(ex.inline?'span':'li','');const r={it,row};
if(ex.cat){row.className='crow';row.innerHTML=`<span class="n">${k+1}.</span><b>${it.q}</b> <button class="sp">🔊</button> <span class="h">${it.h}</span> `;row.querySelector('.sp').onclick=()=>say(it.q);
let sel='';const bs2=CATS.map(c=>{const b=el('button','cb',c);b.onclick=()=>{r.set(c);r.shown=false};row.append(b);return b});
r.get=()=>sel;r.set=v=>{sel=v;bs2.forEach(b=>b.classList.toggle('on',b.textContent===v))}}
else{const p=it.q.split('___'),inp=el('input');inp.size=ex.size||12;inp.autocomplete='off';inp.autocapitalize='off';inp.spellcheck=false;inp.oninput=()=>{r.shown=false};
row.append(el('span','n',(k+1)+'.'),document.createTextNode(' '+p[0]));if(p.length>1){row.append(inp,document.createTextNode(p[1]))}else row.append(inp);
if(it.h&&!ex.inline)row.append(el('span','h',' ('+it.h+')'));r.get=()=>inp.value;r.set=v=>{inp.value=v}
if(ex.inline)row.append(' ')}
ex.cur.push(r);body.append(row)})};
const okOf=r=>!r.shown&&r.it.a.split('|').some(a=>norm(a)===norm(r.get()));
bc.onclick=()=>{let n=0;ex.cur.forEach(r=>{const ok=okOf(r);r.row.classList.remove('ok','bad','shown');r.row.classList.add(ok?'ok':'bad');if(ok)n++;else addProb(r.it)});
res.textContent=`✅ ${n} / ${ex.cur.length}`+(n==ex.cur.length?' 🎉 Отлично!':'')};
bs.onclick=()=>{ex.cur.forEach(r=>{r.set(r.it.a.split('|')[0]);r.shown=true;r.row.classList.remove('ok','bad');r.row.classList.add('shown')});res.textContent='Ответы показаны'};
br.onclick=fill;fill();ex.okOf=okOf;return s}
EX.forEach((ex,i)=>main.append(build(ex,i)));
/* ---------- hangman ---------- */
const HW=[["volcano","вулкан"],["waterfall","водопад"],["accommodation","жильё"],["souvenirs","сувениры"],["foggy","туманный"],["adventure","приключение"],["thousand","тысяча"],["forest","лес"],["review","отзыв"],["cave","пещера"],["ocean","океан"],["million","миллион"]];
let last=-1;const hs=el('section','card');hs.innerHTML='<h2>7. Hangman 🎯</h2><p class="ins">Угадай слово по буквам (можно нажимать клавиши на клавиатуре). 6 жизней.</p><div class="hm" id="hm"></div><p class="h" id="hh" style="text-align:center"></p><div class="kb" id="kb"></div><div class="btns"><button class="p" id="hn">Новое слово</button><span class="res" id="hr"></span></div>';main.append(hs);
let hw,hl,hg,over;
function hang(){let i;do{i=Math.random()*HW.length|0}while(i==last);last=i;hw=HW[i];hl=6;hg=new Set;over=false;$('#hr').textContent='';$('#hh').textContent='Подсказка: '+hw[1]+' · букв: '+hw[0].length;
const kb=$('#kb');kb.innerHTML='';'abcdefghijklmnopqrstuvwxyz'.split('').forEach(c=>{const b=el('button','',c);b.id='k'+c;b.onclick=()=>guess(c);kb.append(b)});draw()}
function draw(){$('#hm').textContent=hw[0].split('').map(c=>hg.has(c)||over?c:'_').join(' ');$('#hr').textContent=over?$('#hr').textContent:'❤️'.repeat(hl)+'🖤'.repeat(6-hl)}
function guess(c){if(over||hg.has(c))return;hg.add(c);$('#k'+c).disabled=true;if(!hw[0].includes(c))hl--;
if(hl<=0){over=true;draw();$('#hr').textContent='😢 Слово: '+hw[0];addProb({a:hw[0],h:hw[1]});say(hw[0])}
else if(hw[0].split('').every(x=>hg.has(x))){over=true;draw();$('#hr').textContent='🎉 Верно! '+hw[0];say(hw[0])}else draw()}
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.ctrlKey||e.metaKey)return;if(/^[a-z]$/i.test(e.key))guess(e.key.toLowerCase())});
$('#hn').onclick=hang;hang();
/* ---------- copy ---------- */
const cs=el('section','card');cs.innerHTML='<h2>📋 Отправить учителю</h2><p class="ins">Скопируй свои ответы вместе с правильными и вставь в чат.</p><input id="nm" placeholder="Имя" size="18"><div class="btns"><button class="p" id="cp">Скопировать мои ответы</button><span class="res" id="cr"></span></div><textarea id="ct" readonly placeholder="Здесь появится текст…"></textarea>';main.append(cs);
$('#cp').onclick=async()=>{const L=['English A2 — '+($('#nm').value||'ученик')+' — '+new Date().toLocaleDateString()];
EX.forEach((ex,i)=>{if(!ex.cur)return;L.push('','Ex '+(i+1)+'. '+ex.t);ex.cur.forEach((r,k)=>{const v=r.get().trim()||'—',a=r.it.a.split('|')[0],ok=ex.okOf(r);
L.push(`${k+1}) ${r.it.n&&!ex.cat?r.it.n+' ':''}${v} ${r.shown?'(ответ показан: '+a+')':ok?'✓':'✗ → '+a}`)})});
L.push('','Problem words: '+(Object.keys(prob).join(', ')||'—'));const t=L.join('\n'),ta=$('#ct');ta.value=t;
try{await navigator.clipboard.writeText(t);$('#cr').textContent='✅ Скопировано'}catch(e){ta.select();try{document.execCommand('copy');$('#cr').textContent='✅ Скопировано'}catch(_){$('#cr').textContent='Выдели текст ниже и скопируй вручную'}}};
</script></body></html>
