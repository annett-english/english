<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vocab Party A2 🎧</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff4e0;--card:#fff;--ink:#2a2150;--mut:#7a6f9b;--line:#e6dcf5;--a:#7c4dff;--b:#ff5d8f;--c:#06b58a;--d:#ffb703;--bad:#e5384f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17122e;--card:#251d4a;--ink:#f3eeff;--mut:#a99fd0;--line:#3a2f6b}}
:root[data-theme="dark"]{--bg:#17122e;--card:#251d4a;--ink:#f3eeff;--mut:#a99fd0;--line:#3a2f6b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font-family:Fredoka,'Trebuchet MS',system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 10% 0,rgba(124,77,255,.25),transparent 40%),radial-gradient(circle at 95% 10%,rgba(255,93,143,.22),transparent 38%),var(--bg);min-height:100vh}
.wrap{max-width:1100px;margin:auto;padding:18px}
h1{margin:0;font-size:2rem}h1 span{background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mut);margin:2px 0 14px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.tabs button{flex:none;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:7px 13px;font:inherit;font-size:.85rem;cursor:pointer}
.tabs button.on{background:linear-gradient(90deg,var(--a),var(--b));color:#fff;border-color:transparent;transform:translateY(-2px)}
.lay{display:grid;grid-template-columns:1fr 250px;gap:16px;align-items:start}
@media(max-width:800px){.lay{grid-template-columns:1fr}}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 8px 0 var(--line)}
.side{position:sticky;top:12px}.side h3{margin:0 0 8px}
.side .it{display:flex;justify-content:space-between;gap:6px;padding:6px 9px;border-radius:12px;background:rgba(229,56,79,.12);margin-bottom:5px;cursor:pointer;font-size:.9rem}
.side .it b{color:var(--bad)}.empty{color:var(--mut);font-size:.9rem}
h2{margin:0 0 4px}.intro{color:var(--mut);margin:0 0 14px}
.q{padding:12px;border:2px dashed var(--line);border-radius:16px;margin-bottom:10px}
.q.good{border-color:var(--c);background:rgba(6,181,138,.1)}.q.wrong{border-color:var(--bad)}
.pr{font-weight:500;font-size:1.05rem}.ru{color:var(--mut);font-size:.9rem;margin:2px 0 6px}
.gap{display:inline-block;min-width:60px;border-bottom:3px solid var(--b)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
input{flex:1;min-width:150px;font:inherit;padding:9px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
input:focus{outline:none;border-color:var(--a)}
.b{font:inherit;border:0;border-radius:12px;padding:9px 15px;background:var(--a);color:#fff;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.b:active{transform:translateY(3px);box-shadow:none}
.b.g{background:var(--d);color:#2a2150}.b.ok{background:var(--c)}.b.w{background:var(--d);color:#2a2150}.b.no{background:var(--bad)}.b.sm{padding:5px 11px}
.fb{margin-top:6px;font-size:.95rem;min-height:1px}.fb.bad{color:var(--bad)}.fb.good{color:var(--c)}
.sc{margin-top:10px;font-weight:600;color:var(--a)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.o,.m{font:inherit;padding:10px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;text-align:center}
.o:hover,.m:hover{border-color:var(--a)}.o.good,.m.done{background:rgba(6,181,138,.18);border-color:var(--c)}.o.bad{background:rgba(229,56,79,.15);border-color:var(--bad)}
.m.sel{border-color:var(--b);background:rgba(255,93,143,.15)}.m:disabled{cursor:default}
.m.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:12px}.col{display:grid;gap:8px}
.fc{text-align:center;padding:26px 10px;border-radius:22px;background:linear-gradient(135deg,rgba(124,77,255,.18),rgba(255,93,143,.18));margin-bottom:6px}
.big{font-size:2.2rem;font-weight:600}.ipa{color:var(--mut);margin:4px 0 10px}.tr{font-size:1.5rem;margin-top:12px;color:var(--b);font-weight:600}
.meta{color:var(--mut);margin-bottom:6px}.done{text-align:center;font-size:1.3rem;padding:20px}
table{width:100%;border-collapse:collapse}td{padding:7px 6px;border-bottom:1px solid var(--line)}td:first-child{font-weight:600}.ip{color:var(--mut)}
.ph span{display:inline-block;background:var(--bg);border:2px solid var(--line);padding:4px 10px;border-radius:99px;margin:3px 2px;font-size:.9rem}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin:3px 0}.chip{font:inherit;font-size:.85rem;border:2px solid var(--line);border-radius:99px;background:var(--card);color:var(--ink);padding:3px 9px;cursor:pointer}.chip.on{background:var(--a);color:#fff;border-color:var(--a)}
.sa{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px;padding:5px 0;border-bottom:1px solid var(--line)}
#st{font-size:.9rem;margin-top:8px;color:var(--mut)}
</style></head><body><div class="wrap">
<h1>🎧 <span>Vocab Party</span> A2</h1>
<p class="sub">Слушай, пиши руками, исправляй ошибки — слова, которые не получились, попадают в «Проблемные слова».</p>
<div class="tabs" id="tabs"></div>
<div class="lay"><div class="card" id="main"></div>
<aside class="card side"><h3>⚠️ Проблемные слова</h3><div id="prob"><div class="empty">Пока пусто — это хорошо 😉</div></div></aside></div></div>
<script>
const V=[["bowl","миска","/boʊl/"],["fried rice","жареный рис","/fraɪd raɪs/"],["berries","ягоды","/ˈberiz/"],["blueberry","черника","/ˈbluːberi/"],["navy blue","тёмно-синий","/ˈneɪvi bluː/"],["soy","соя","/sɔɪ/"],["pork fat","свиной жир","/pɔːrk fæt/"],["celery","сельдерей","/ˈseləri/"],["coriander","кинза","/ˌkɔːriˈændər/"],["overcooked","переваренный","/ˌoʊvərˈkʊkt/"],["undercooked","недоготовленный","/ˌʌndərˈkʊkt/"],["suitcase","чемодан","/ˈsuːtkeɪs/"],["suit (n.)","костюм","/suːt/"],["suit (v.)","подходить","/suːt/"],["calm","спокойный","/kɑːm/"],["zodiac sign","знак зодиака","/ˈzoʊdiæk saɪn/"],["low battery","низкий заряд","/loʊ ˈbætəri/"],["told me","говорил(а) мне","/toʊld miː/"]];
const PH=["I really like / hate …","I like this meat very much / so much.","It’s a story of my life.","What’s your zodiac sign?","Anything else? — Что-то ещё?","I thought … — Я думала …","for — для","I will go to the place where it rains."];
const sh=a=>[...a].sort(()=>Math.random()-.5);
const nz=s=>s.toLowerCase().replace(/[’`]/g,"'").replace(/[.!?,;]/g,'').replace(/\s+/g,' ').trim();
const clean=w=>w.replace(/\s*\(.*\)/,'');
const S={},log=[],prob={},sa={};
function bad(w){prob[w]=(prob[w]||0)+1;const p=document.getElementById('prob');p.innerHTML=Object.entries(prob).sort((a,b)=>b[1]-a[1]).map(([w,n])=>`<div class="it" data-w="${w}"><span>🔊 ${w}</span><b>×${n}</b></div>`).join('');p.querySelectorAll('.it').forEach(e=>e.onclick=()=>say(clean(e.dataset.w)))}
let voice,vname='';
function pick(){if(!window.speechSynthesis)return;const v=speechSynthesis.getVoices();voice=v.find(x=>/Google US English/i.test(x.name))||v.find(x=>/Samantha/i.test(x.name))||v.find(x=>x.lang==='en-US')||v.find(x=>/^en/.test(x.lang));vname=voice?voice.name:'';const e=document.getElementById('st');if(e)e.textContent=voice?'🔊 Голос: '+vname:'⚠️ Английский голос не найден — попробуй Chrome или Safari.'}
if(window.speechSynthesis){speechSynthesis.onvoiceschanged=pick;pick()}
function say(t){if(!window.speechSynthesis){alert('Озвучка не поддерживается в этом браузере');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';if(voice)u.voice=voice;u.rate=.9;speechSynthesis.speak(u)}
const upd=(el,ex,ok,n,extra='')=>{S[ex]={ok,n};el.querySelector('.sc').textContent=`✓ ${ok} / ${n} ${extra}`};
const L=(ex,q,s,a,ok)=>log.push({ex,q,s,a,ok});

function intro(el){
 el.innerHTML=`<h2>👋 Разминка: слова</h2><p class="intro">Нажми 🔊 и повтори вслух каждое слово. Голос: Google US English / Samantha.</p>
 <table>${V.map(v=>`<tr><td>${v[0]}</td><td class="ip">${v[2]}</td><td>${v[1]}</td><td><button class="b sm" data-w="${v[0]}">🔊</button></td></tr>`).join('')}</table>
 <div class="row"><button class="b g" id="all">▶ Прослушать все</button><button class="b" id="test">🎤 Проверить звук</button></div><div id="st"></div>
 <h3>Полезные фразы</h3><div class="ph">${PH.map(p=>`<span>${p}</span>`).join('')}</div>`;
 el.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>say(clean(b.dataset.w)));
 el.querySelector('#test').onclick=()=>say('Hello! The sound works.');
 el.querySelector('#all').onclick=()=>{speechSynthesis.cancel();V.forEach(v=>{const u=new SpeechSynthesisUtterance(clean(v[0]));u.lang='en-US';if(voice)u.voice=voice;u.rate=.85;speechSynthesis.speak(u)})};pick()}

function cards(el){
 const deck=sh(V).slice(0,10).map(x=>[...x]),total=deck.length;let known=0,flip=false;
 const draw=()=>{
  if(!deck.length){S.f={ok:known,n:total};el.innerHTML=`<h2>🃏 Flashcards</h2><div class="done">🎉 Колода пройдена!<br>С первого раза знал(а): ${known} / ${total}</div><button class="b" id="rs">↻ Заново</button>`;el.querySelector('#rs').onclick=()=>cards(el);return}
  const c=deck[0];
  el.innerHTML=`<h2>🃏 Flashcards</h2><p class="intro">Вспомни перевод и оцени себя. «Не уверен» и «Не знаю» вернутся в конец колоды.</p><div class="meta">Осталось карточек: ${deck.length}</div><div class="fc"><div class="big">${c[0]}</div><div class="ipa">${c[2]}</div><button class="b sm" id="pl">🔊</button>${flip?`<div class="tr">${c[1]}</div>`:''}</div>`+(flip?`<div class="row"><button data-k="1" class="b ok">✅ Знаю</button><button data-k="2" class="b w">🤔 Не уверен</button><button data-k="3" class="b no">❌ Не знаю</button></div>`:`<div class="row"><button class="b" id="fl">Показать перевод</button></div>`);
  el.querySelector('#pl').onclick=()=>say(clean(c[0]));
  if(!flip)el.querySelector('#fl').onclick=()=>{flip=true;draw()};
  el.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;L('Flashcards',c[0],['знаю','не уверен','не знаю'][k-1],c[1],k==1);deck.shift();if(k==1){if(!c.r)known++}else{c.r=1;if(k==3)bad(c[0]);deck.push(c)}flip=false;draw()})};
 draw()}

function listen(el){
 const P=V.filter(x=>x[0]!='suit (v.)'),qs=sh(P).slice(0,8);let ok=0,n=0;
 el.innerHTML=`<h2>👂 Listen &amp; pick</h2><p class="intro">Нажми 🔊, послушай слово и выбери перевод.</p><div id="qs"></div><div class="sc"></div><button class="b" id="rs">↻ Заново</button>`;
 el.querySelector('#rs').onclick=()=>listen(el);
 qs.forEach((w,i)=>{const o=sh([w,...sh(P.filter(x=>x!==w)).slice(0,3)]);let done=false;
  const d=document.createElement('div');d.className='q';
  d.innerHTML=`<div class="pr">${i+1}. <button class="b sm">🔊</button> <button class="b g sm">👁 Show answer</button> <span class="rv"></span></div><div class="opts">${o.map(x=>`<button class="o">${x[1]}</button>`).join('')}</div>`;
  const bs=[...d.querySelectorAll('.o')],fin=(g)=>{done=true;bs.forEach((b,j)=>{if(o[j]===w)b.classList.add('good')});d.querySelector('.rv').textContent='→ '+w[0]};
  d.querySelector('.sm').onclick=()=>say(clean(w[0]));
  d.querySelector('.g').onclick=()=>{if(done)return;fin();n++;bad(w[0]);L('Listen',w[0],'(показан ответ)',w[1],false);upd(el,'l',ok,n)};
  bs.forEach((b,j)=>b.onclick=()=>{if(done)return;n++;const r=o[j]===w;if(r){ok++}else{b.classList.add('bad');bad(w[0])}fin();L('Listen',w[0],o[j][1],w[1],r);upd(el,'l',ok,n)});
  el.querySelector('#qs').append(d)});upd(el,'l',0,0)}

function match(el,id,title,intro,pairs){
 pairs=sh(pairs).slice(0,8);let sel=null,ok=0,wr=0;
 const A=sh(pairs.map((p,i)=>[p[0],i])),B=sh(pairs.map((p,i)=>[p[1],i]));
 const bt=(x,s)=>`<button class="m" data-s="${s}" data-i="${x[1]}">${x[0]}</button>`;
 el.innerHTML=`<h2>${title}</h2><p class="intro">${intro}</p><div class="mt"><div class="col">${A.map(x=>bt(x,'l')).join('')}</div><div class="col">${B.map(x=>bt(x,'r')).join('')}</div></div><div class="row"><button class="b g" id="sa">👁 Show answers</button><button class="b" id="rs">↻ Заново</button></div><div class="sc"></div>`;
 const ms=[...el.querySelectorAll('.m')];
 ms.forEach(b=>b.onclick=()=>{if(b.disabled)return;
  if(b.dataset.s=='l'){ms.forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel=b;return}
  if(!sel)return;const i=+sel.dataset.i,p=pairs[i];
  if(+b.dataset.i==i){sel.classList.add('done');b.classList.add('done');sel.disabled=b.disabled=true;sel.classList.remove('sel');ok++;L(title,p[0],p[1],p[1],true)}
  else{b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),400);wr++;bad(p[2]);L(title,p[0],b.textContent,p[1],false);sel.classList.remove('sel')}
  sel=null;upd(el,id,ok,pairs.length,`(ошибок: ${wr})`)});
 el.querySelector('#sa').onclick=()=>{ms.forEach(b=>{b.classList.add('done');b.disabled=true});pairs.forEach(p=>{if(!p[3])bad(p[2])});el.querySelector('.sc').textContent='Ответы показаны: '+pairs.map(p=>p[0]+' = '+p[1]).join(' · ')};
 el.querySelector('#rs').onclick=()=>match(el,id,title,intro,pairs);upd(el,id,0,pairs.length)}

function typed(el,id,title,intro,items){
 items=sh(items);let ok=0;
 el.innerHTML=`<h2>${title}</h2><p class="intro">${intro}</p><div id="qs"></div><div class="sc"></div><button class="b" id="rs">↻ Заново</button>`;
 el.querySelector('#rs').onclick=()=>typed(el,id,title,intro,items);
 items.forEach((it,i)=>{let solved=false;
  const d=document.createElement('div');d.className='q';
  d.innerHTML=`<div class="pr">${i+1}. ${it.q.replace('___','<span class="gap">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>')}</div>${it.ru?`<div class="ru">${it.ru}</div>`:''}<div class="row"><input placeholder="пиши здесь…" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="b">Check</button><button class="b g">👁 Show answer</button></div><div class="fb"></div>`;
  const inp=d.querySelector('input'),fb=d.querySelector('.fb');
  const chk=()=>{if(solved||!inp.value.trim())return;const v=inp.value.trim(),r=it.a.some(x=>nz(x)===nz(v));L(title,it.q,v,it.a[0],r);
   if(r){solved=true;ok++;d.className='q good';fb.className='fb good';fb.textContent='✅ Верно!'+(it.a.length>1?' Также: '+it.a.slice(1).join(' / '):'')}
   else{d.classList.add('wrong');fb.className='fb bad';fb.textContent='❌ Почти! Попробуй ещё раз или нажми Show answer.';bad(it.w)}upd(el,id,ok,items.length)};
  d.querySelectorAll('.b')[0].onclick=chk;inp.onkeydown=e=>{if(e.key=='Enter')chk()};
  d.querySelector('.g').onclick=()=>{if(solved)return;solved=true;bad(it.w);L(title,it.q,'(показан ответ)',it.a[0],false);fb.className='fb';fb.textContent='👁 '+it.a.join('  /  ');d.className='q'};
  el.querySelector('#qs').append(d)});upd(el,id,0,items.length)}

const GAP=[{q:"I ate the pasta, but it was ___. It was too soft.",ru:"Я съела макароны, но они были переварены.",a:["overcooked"],w:"overcooked"},
{q:"The chicken is still pink inside. It’s ___.",ru:"Курица всё ещё розовая внутри. Она недоготовлена.",a:["undercooked"],w:"undercooked"},
{q:"Put the rice in the ___ and add some soy sauce.",ru:"Положи рис в миску.",a:["bowl"],w:"bowl"},
{q:"My phone often has a low ___.",ru:"У моего телефона часто низкий заряд.",a:["battery"],w:"low battery"},
{q:"I put my clothes in the ___ before the trip.",ru:"Я положила вещи в чемодан.",a:["suitcase"],w:"suitcase"},
{q:"This dress ___ me. It looks great!",ru:"Это платье мне идёт (подходит).",a:["suits"],w:"suit (v.)"},
{q:"Don’t worry. Stay ___.",ru:"Не волнуйся. Оставайся спокойным.",a:["calm"],w:"calm"},
{q:"I hate ___ in soup. It tastes like soap!",ru:"Кинза.",a:["coriander"],w:"coriander"},
{q:"What’s your zodiac ___? I’m Leo.",ru:"Знак зодиака.",a:["sign"],w:"zodiac sign"},
{q:"He wears a dark ___ blue jacket.",ru:"Тёмно-синий.",a:["navy"],w:"navy blue"}];
const FIX=[{q:"I very like berries.",ru:"Исправь ошибку (калька «я очень люблю»).",a:["I really like berries","I like berries very much","I like berries so much"],w:"I really like"},
{q:"I very hate celery.",ru:"Исправь ошибку.",a:["I really hate celery","I hate celery very much","I hate celery so much"],w:"I really hate"},
{q:"I like this meat very.",ru:"Исправь ошибку.",a:["I like this meat very much","I like this meat so much"],w:"very much / so much"},
{q:"This dress suits to me.",ru:"Лишний предлог.",a:["This dress suits me"],w:"suit (v.)"},
{q:"The pasta is overcooking.",ru:"Нужна форма «переваренный».",a:["The pasta is overcooked","The pasta was overcooked"],w:"overcooked"},
{q:"My phone has low battery.",ru:"Не хватает артикля.",a:["My phone has a low battery","My phone often has a low battery"],w:"low battery"},
{q:"She told to me about it.",ru:"Лишний предлог.",a:["She told me about it"],w:"told me"},
{q:"I’m calm person.",ru:"Не хватает артикля.",a:["I’m a calm person","I am a calm person"],w:"calm"},
{q:"I will go to the place where is raining.",ru:"Нужно подлежащее «it».",a:["I will go to the place where it’s raining","I will go to the place where it is raining","I will go to the place where it rains"],w:"it rains"}];
const REP=[{q:"Я очень люблю чернику.",a:["I really like blueberries","I like blueberries very much","I like blueberries so much"],w:"blueberry"},
{q:"Это платье мне идёт.",a:["This dress suits me","The dress suits me"],w:"suit (v.)"},
{q:"У моего телефона часто низкий заряд.",a:["My phone often has a low battery","My phone often has low battery"],w:"low battery"},
{q:"Я думала, будет дождь.",a:["I thought it would rain","I thought it was going to rain"],w:"I thought"},
{q:"Макароны переварены.",a:["The pasta is overcooked","The pasta was overcooked","Pasta is overcooked"],w:"overcooked"},
{q:"Он говорил мне об этом.",a:["He told me about it","He was telling me about it"],w:"told me"},
{q:"Какой у тебя знак зодиака?",a:["What’s your zodiac sign","What is your zodiac sign"],w:"zodiac sign"},
{q:"Это история моей жизни.",a:["It’s a story of my life","It is a story of my life","This is a story of my life"],w:"story of my life"},
{q:"Я ненавижу сельдерей.",a:["I really hate celery","I hate celery so much","I hate celery very much"],w:"celery"}];
const HALF=[["fried","rice","fried rice"],["navy","blue","navy blue"],["zodiac","sign","zodiac sign"],["pork","fat","pork fat"],["low","battery","low battery"],["overcooked","pasta","overcooked"],["soy","sauce","soy"],["it’s a story of","my life","story of my life"],["calm","person","calm"]];

function fin(el){
 const ex=[['f','Flashcards'],['l','Listen & pick'],['m','Match'],['g','Gaps'],['h','Halves'],['x','Find mistakes'],['r','Rephrase']];
 el.innerHTML=`<h2>🏁 Что я теперь знаю</h2><p class="intro">Оцени каждое слово честно.</p>
 ${V.map(v=>`<div class="sa"><span><b>${v[0]}</b> — ${v[1]}</span><span class="chips" data-w="${v[0]}">${['✅ знаю','🤔 не уверен','❌ не знаю'].map((t,k)=>`<button class="chip${sa[v[0]]==k?' on':''}" data-k="${k}">${t}</button>`).join('')}</span></div>`).join('')}
 <h3>Результаты</h3><div>${ex.map(e=>`${e[1]}: <b>${S[e[0]]?S[e[0]].ok+'/'+S[e[0]].n:'—'}</b>`).join(' · ')}</div>
 <div class="row"><button class="b" id="cp">📋 Скопировать мои ответы</button></div><div class="fb" id="cm"></div>`;
 el.querySelectorAll('.chips').forEach(c=>c.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{sa[c.dataset.w]=+b.dataset.k;c.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));b.classList.add('on')}));
 el.querySelector('#cp').onclick=()=>{
  const t=['VOCAB PARTY A2 — результаты',ex.map(e=>e[1]+': '+(S[e[0]]?S[e[0]].ok+'/'+S[e[0]].n:'—')).join('; '),'','Проблемные слова: '+(Object.keys(prob).join(', ')||'нет'),'','Самооценка: '+V.map(v=>v[0]+' '+(['✅','🤔','❌'][sa[v[0]]]||'?')).join(', '),'','Ответы ученика:',...log.map(l=>`[${l.ex}] ${l.q} → ${l.s} ${l.ok?'✓':'✗ (верно: '+l.a+')'}`)].join('\n');
  const done=()=>{el.querySelector('#cm').className='fb good';el.querySelector('#cm').textContent='✅ Скопировано! Отправь это преподавателю.'};
  const fb=()=>{const a=document.createElement('textarea');a.value=t;document.body.append(a);a.select();try{document.execCommand('copy');done()}catch(e){el.querySelector('#cm').textContent='Не удалось скопировать'}a.remove()};
  (navigator.clipboard?navigator.clipboard.writeText(t).then(done,fb):fb())}}

const SEC=[['👋 Слова',intro],['🃏 Flashcards',cards],['👂 Listen',listen],
['🔗 Match',e=>match(e,'m','🔗 Match: word ↔ translation','Соедини английское слово с переводом: сначала слева, потом справа.',V.map(v=>[v[0],v[1],v[0]]))],
['✍️ Gaps',e=>typed(e,'g','✍️ Вставь слово','Впиши нужное слово по контексту.',GAP)],
['🧩 Halves',e=>match(e,'h','🧩 Соедини половинки','Собери выражения: слева начало, справа конец.',HALF)],
['🔍 Mistakes',e=>typed(e,'x','🔍 Find mistakes (русские ловушки)','В предложении ошибка. Перепиши его правильно целиком.',FIX)],
['🗣 Rephrase',e=>typed(e,'r','🗣 Say it in English','Напиши по-английски полным предложением.',REP)],
['🏁 Итог',fin]];
const tabs=document.getElementById('tabs'),main=document.getElementById('main'),pans=[];
SEC.forEach((s,i)=>{const p=document.createElement('div');p.hidden=true;main.append(p);pans.push(p);if(i<SEC.length-1)s[1](p);
 const b=document.createElement('button');b.textContent=s[0];b.onclick=()=>{pans.forEach((x,j)=>x.hidden=j!=i);[...tabs.children].forEach((x,j)=>x.classList.toggle('on',j==i));if(i==SEC.length-1)s[1](p)};tabs.append(b)});
tabs.children[0].click();
</script></body></html>
