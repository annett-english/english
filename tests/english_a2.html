<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>English A2: make / have / do / go</title>
<style>
:root{--bg:#f7f5f0;--cd:#fff;--tx:#1d1d1f;--mu:#6b6b70;--ac:#2f6fed;--ok:#1f9d55;--no:#d64545;--bd:#e2ded5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181b;--cd:#202226;--tx:#ecebe8;--mu:#9a9aa0;--ac:#6b9bff;--ok:#4cc885;--no:#ff7a7a;--bd:#33353b}}
:root[data-theme="dark"]{--bg:#17181b;--cd:#202226;--tx:#ecebe8;--mu:#9a9aa0;--ac:#6b9bff;--ok:#4cc885;--no:#ff7a7a;--bd:#33353b}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:12px;display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:14px}
aside{position:sticky;top:8px;align-self:start;background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:10px;max-height:80vh;overflow:auto}
@media(max-width:800px){.wrap{grid-template-columns:1fr}aside{order:-1;position:static;max-height:150px}}
section,.card{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
h1{font-size:1.4rem;margin:.2em 0}h2{font-size:1.1rem;margin:0 0 4px}h3{margin:0 0 6px;font-size:.95rem}
.d,small,.mu{color:var(--mu);font-size:.88rem}.sc{float:right;color:var(--ac);font-weight:700}
ol{padding-left:22px;margin:8px 0}li{margin:7px 0}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1.5px solid var(--bd);border-radius:8px;padding:5px 8px;max-width:100%}
input{width:min(280px,100%)}textarea{width:100%;box-sizing:border-box}
li input[placeholder$="…"]{width:110px}.in input{width:100px}
.ok{border-color:var(--ok)!important}.no{border-color:var(--no)!important}
.ans{display:none;color:var(--ok);font-size:.88rem;margin-left:6px}.show .ans{display:inline-block}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:8px;padding:5px 11px}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.bt{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
table{border-collapse:collapse;width:100%}td,th{padding:4px 6px;border-bottom:1px solid var(--bd);text-align:left;font-size:.9rem}
.tw{overflow-x:auto}.ipa{display:none;color:var(--mu);margin:0 6px}.ipa.on{display:inline}
.pic{font-size:2rem;display:inline-block;width:46px;vertical-align:middle}
.ln{margin:6px 0}.bank span{display:inline-block;background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:1px 10px;margin:2px}
#hw{font:700 1.8rem/1.3 ui-monospace,monospace;letter-spacing:.2em}#kb button{width:34px;margin:2px;padding:4px 0}
#kb button:disabled{opacity:.35}
</style></head><body><div class="wrap"><main>
<h1>📝 English A2 — make · have · do · go · try</h1>
<div class="card">Имя: <input id="nm" placeholder="Your name"></div>

<section id="intro"><h2>Words / Слова</h2>
<p class="d">🎧 Прослушайте слова и повторите вслух. Голос: Google US English / Samantha.</p>
<div class="bt"><button class="p" id="pa">▶ Прослушать все</button><button class="at">🔊 Проверить звук</button><span class="mu" id="vs"></span></div>
<div class="tw"><table id="vt"></table></div></section>

<div id="ex"></div>

<section id="hm"><h2>9. Hangman <span class="sc" id="hl"></span></h2><p class="d" id="hh"></p><div id="hw"></div><div id="kb"></div><p id="hr"></p><button id="hn">Новое слово</button></section>

<section><h2>Готово!</h2><p class="d">Проверьте звук и скопируйте ответы, чтобы отправить учителю.</p>
<div class="bt"><button class="at">🔊 Проверить звук</button><button class="p" id="cp">📋 Скопировать мои ответы</button></div>
<textarea id="out" rows="6" style="margin-top:8px;display:none"></textarea></section>
</main>
<aside><h3>⚠️ Проблемные слова</h3><table id="pt"></table><p class="mu" id="pe">Пока ошибок нет 🎉</p><button id="pc">Очистить</button></aside></div>
<script>
const V=[["make a shopping list","meɪk ə ˈʃɑːpɪŋ lɪst","составить список покупок"],["make a to-do list","meɪk ə tə ˈduː lɪst","составить список дел"],["make a bucket list","meɪk ə ˈbʌkɪt lɪst","составить список желаний"],["have a new experience","hæv ə nuː ɪkˈspɪriəns","получить новый опыт"],["write down a plan","raɪt daʊn ə plæn","записать план"],["do something spontaneously","duː ˈsʌmθɪŋ spɑːnˈteɪniəsli","сделать что-то спонтанно"],["go on holiday","ɡoʊ ɑːn ˈhɑːlədeɪ","поехать в отпуск"],["ride a horse","raɪd ə hɔːrs","кататься на лошади"],["learn a language","lɜːrn ə ˈlæŋɡwɪdʒ","учить язык"],["go for a walk","ɡoʊ fər ə wɔːk","пойти гулять"],["make a dream come true","meɪk ə driːm kʌm truː","осуществить мечту"],["try a recipe","traɪ ə ˈresəpi","попробовать рецепт"],["get in a taxi","ɡet ɪn ə ˈtæksi","сесть в такси"],["take a photo","teɪk ə ˈfoʊtoʊ","сфотографировать"],["do karaoke","duː ˌkæriˈoʊki","петь караоке"],["learn a new skill","lɜːrn ə nuː skɪl","освоить новый навык"],["bake a cake","beɪk ə keɪk","испечь торт"],["go to a festival","ɡoʊ tə ə ˈfestɪvl","пойти на фестиваль"],["try a new sport","traɪ ə nuː spɔːrt","попробовать новый спорт"],["read a book","riːd ə bʊk","прочитать книгу"],["have a picnic","hæv ə ˈpɪknɪk","устроить пикник"],["explore a new place","ɪkˈsplɔːr ə nuː pleɪs","исследовать новое место"]];
const $=s=>document.querySelector(s),nm=s=>s.toLowerCase().replace(/[.,!?'’]/g,'').replace(/\s+/g,' ').trim();
let voice=null;
function pick(){const vs=speechSynthesis.getVoices();voice=vs.find(v=>v.name==='Google US English')||vs.find(v=>/samantha/i.test(v.name))||vs.find(v=>v.lang==='en-US'||v.lang==='en_US')||vs.find(v=>/^en/i.test(v.lang))||null;$('#vs').textContent=voice?'Голос: '+voice.name:'⚠️ Английский голос не найден на этом устройстве'}
function say(t,r=.9,q){try{if(!q)speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';if(voice)u.voice=voice;u.rate=r;speechSynthesis.speak(u)}catch(e){}}
try{pick();speechSynthesis.onvoiceschanged=pick}catch(e){$('#vs').textContent='⚠️ Озвучка не поддерживается браузером'}
$('#vt').innerHTML='<tr><th></th><th>English</th><th>Транскрипция</th><th>Перевод</th></tr>'+V.map(v=>`<tr><td><button data-say="${v[0]}">▶</button></td><td><b>${v[0]}</b></td><td class="mu">/${v[1]}/</td><td>${v[2]}</td></tr>`).join('');
$('#pa').onclick=()=>{try{speechSynthesis.cancel()}catch(e){}V.forEach(v=>say(v[0],.85,1))};
document.querySelectorAll('.at').forEach(b=>b.onclick=()=>{pick();say('Audio test. Make a list, have a picnic, go for a walk.')});
document.addEventListener('click',e=>{const b=e.target.closest('[data-say]');if(b)say(b.dataset.say,+b.dataset.r||.9);const t=e.target.closest('[data-tg]');if(t)t.nextElementSibling.classList.toggle('on')});
// problem words
const P=new Map();
function prob(w){P.set(w,(P.get(w)||0)+1);rp()}
function rp(){const a=[...P].sort((x,y)=>y[1]-x[1]);$('#pt').innerHTML=a.map(x=>`<tr><td>${x[0]}</td><td>×${x[1]}</td></tr>`).join('');$('#pe').style.display=a.length?'none':''}
$('#pc').onclick=()=>{P.clear();rp()};
// exercises
const inp=(a,ph='',p)=>`<input data-a="${a}" data-p="${p||a.split('|')[0]}" placeholder="${ph}" autocomplete="off" autocapitalize="off" spellcheck="false"><span class="ans">${a.split('|')[0]}</span>`;
const g=(a,n)=>`<span class="in">(${n}) ${inp(a,a[0]+'…')}</span>`;
const VB=['make','have','do','go','try','take','get','ride','read','learn'];
const sel=a=>`<select data-a="${a}" data-p="${a}"><option value="">—</option>${VB.slice().sort().map(v=>`<option>${v}</option>`).join('')}</select><span class="ans">${a}</span>`;
const bank=w=>`<p class="bank">${w.slice().sort(()=>Math.random()-.5).map(x=>`<span>${x}</span>`).join('')}</p>`;
const L=(l)=>l.map(x=>`<li>${x}</li>`).join('');
const gaps=['bucket','ride','learn','for','photo','picnic','festival','karaoke','experience'];
const E=[
["Перевод с русского на английский","Напишите по-английски.",'<ol>'+L([["составить список покупок","make a shopping list"],["поехать в отпуск","go on holiday"],["кататься на лошади","ride a horse"],["сфотографировать","take a photo"],["петь караоке","do karaoke"],["испечь торт","bake a cake"],["сесть в такси","get in a taxi"],["устроить пикник","have a picnic"],["прочитать книгу","read a book"],["исследовать новое место","explore a new place"]].map(x=>x[0]+'<br>'+inp(x[1],'…',x[1])))+'</ol>'],
["Sort by verb","Выберите глагол к каждому выражению.",'<ol>'+L([["a picnic","have"],["on holiday","go"],["a bucket list","make"],["a photo","take"],["karaoke","do"],["a language","learn"],["in a taxi","get"],["a recipe","try"],["a horse","ride"],["for a walk","go"]].map(x=>sel(x[1])+' <b>'+x[0]+'</b>'))+'</ol>'],
["Дописать недостающую часть","Вставьте глагол, предлог или существительное.",'<ol>'+L([["Let's go","for","a walk."],["Can you","do","karaoke?"],["We get","in","a taxi."],["I want to ride a","horse","."],["She makes a bucket","list","."],["He wants to try a new","sport","."],["They go","on","holiday in July."],["I want to learn a new","skill","."],["Let's","take","a photo here!"]].map(x=>x[0]+' '+inp(x[1],x[1][0]+'…')+' '+x[2]))+'</ol>'],
["Напиши по звуку","Нажмите ▶ (или 🐢 — медленно), напишите выражение. «IPA» — произношение.",'<ol>'+L(["ride a horse","do karaoke","have a picnic","bake a cake","get in a taxi","learn a new skill","go for a walk","try a new sport"].map(p=>{const v=V.find(x=>x[0]==p);return `<button data-say="${p}">▶</button> <button data-say="${p}" data-r=".55">🐢</button> <button data-tg>IPA</button><span class="ipa">/${v[1]}/</span> `+inp(p,'…',p)}))+'</ol>'],
["Составь предложение по картинке","Напишите предложение (минимум 3 слова) со словом из подсказки.",'<ol>'+L([["📸","take, photo","photo","I take a photo."],["🐴","ride, horse","horse","She rides a horse."],["🎂","bake, cake","cake","He bakes a cake."],["🧺","have, picnic","picnic","They have a picnic."],["🎤","do, karaoke","karaoke","We do karaoke."],["🚕","get in, taxi","taxi","I get in a taxi."],["📚","read, book","book","He reads a book."],["🎪","go to, festival","festival","We go to a festival."]].map(x=>`<span class="pic">${x[0]}</span><small>${x[1]}</small><br><input data-k="${x[2]}" data-p="${x[2]}" placeholder="…" autocomplete="off" spellcheck="false" style="width:min(320px,100%)"><span class="ans">${x[3]}</span>`))+'</ol>'],
["Вставь слова в текст","Впишите слова по смыслу.",bank(gaps)+`<p>Anna has a ${g('bucket',1)} list with many dreams. She wants to ${g('ride',2)} a horse and ${g('learn',3)} a new language. Last weekend she went ${g('for',4)} a walk with her friend and took a ${g('photo',5)} of a beautiful lake. Then they had a ${g('picnic',6)} in the park. In the evening they went to a ${g('festival',7)} and did ${g('karaoke',8)}. It was a great new ${g('experience',9)}!</p>`],
["Finish the dialogue","Допишите пропущенные слова.",[["A","Are you free on Saturday?"],["B",`Yes! Let's go ${g('for',1)} a walk in the park.`],["A",`Great! I'll bake a ${g('cake',2)} for us.`],["B",`Nice. Can you take a ${g('photo',3)} of the lake too?`],["A",`Sure. In the evening, we can ${g('do',4)} karaoke.`],["B",`Fun! I want to try a new ${g('sport',5)} too, maybe tennis.`],["A",`Let's get ${g('in',6)} a taxi to the center.`],["B",`OK. It will be a ${g('new',7)} experience for me!`],["A",`And I'll make a ${g('shopping',8)} list so we don't forget anything.`]].map(x=>`<div class="ln"><b>${x[0]}:</b> ${x[1]}</div>`).join('')],
["Finish the sentences (свои идеи)","Закончите предложения как хотите. Проверка не нужна — можно посмотреть примеры.",'<ol>'+L([["My bucket list: I want to","ride a horse in the mountains."],["Next weekend I want to","have a picnic with my friends."],["I want to learn","Spanish because I love Spain."],["A new experience for me was","going to a festival."],["I'd like to go to","Italy on holiday."],["Something spontaneous I can do is","go for a walk at night."]].map(x=>x[0]+'<br><textarea rows="1" data-f="1" placeholder="…"></textarea><span class="ans">'+x[1]+'</span>'))+'</ol>']
];
$('#ex').innerHTML=E.map((e,i)=>`<section class="ex" id="e${i}"><h2>${i+1}. ${e[0]} <span class="sc"></span></h2><p class="d">${e[1]}</p>${e[2]}<div class="bt">${i<7?'<button class="p" data-c>Проверить</button>':''}<button data-s>Показать ответы</button><button data-r>Сбросить</button></div></section>`).join('');
$('#ex').addEventListener('click',e=>{const x=e.target.closest('.ex');if(!x)return;
if(e.target.closest('[data-c]')){let ok=0,n=0;x.querySelectorAll('[data-a],[data-k]').forEach(el=>{n++;const v=nm(el.value);const r=el.dataset.a?el.dataset.a.split('|').some(a=>nm(a)===v):(v.split(' ').length>=3&&v.includes(el.dataset.k));const pv=el.dataset.st;el.classList.toggle('ok',r);el.classList.toggle('no',!r);el.dataset.st=r?1:0;if(r)ok++;else if(pv!=='0')prob(el.dataset.p)});x.querySelector('.sc').textContent=ok+'/'+n}
if(e.target.closest('[data-s]'))x.classList.add('show');
if(e.target.closest('[data-r]')){x.classList.remove('show');x.querySelector('.sc').textContent='';x.querySelectorAll('input,select,textarea').forEach(el=>{el.value='';el.classList.remove('ok','no');delete el.dataset.st})}});
// hangman
const HW=[["language","язык"],["horse","лошадь"],["photo","фото"],["picnic","пикник"],["festival","фестиваль"],["karaoke","караоке"],["experience","опыт"],["recipe","рецепт"],["holiday","отпуск"],["sport","спорт"],["skill","навык"],["spontaneously","спонтанно"]];
let hw,gs,ms,hs=[0,0];
$('#kb').innerHTML=[...'abcdefghijklmnopqrstuvwxyz'].map(c=>`<button>${c}</button>`).join('');
function hd(){const w=hw[0],won=[...w].every(c=>gs.has(c)),lost=ms>=7;$('#hw').textContent=[...w].map(c=>gs.has(c)||lost?c:'_').join(' ');$('#hl').textContent='❤️'.repeat(7-ms)+'🖤'.repeat(ms);$('#hh').textContent='Подсказка: '+hw[1]+' ('+w.length+' букв)';
$('#hr').textContent=won?'🎉 Верно!':lost?'😢 Слово: '+w:'';$('#kb').querySelectorAll('button').forEach(b=>b.disabled=gs.has(b.textContent)||won||lost);if(won||lost)say(w)}
function hnew(){hw=HW[Math.floor(Math.random()*HW.length)];gs=new Set();ms=0;hd()}
$('#kb').onclick=e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const c=b.textContent;gs.add(c);if(!hw[0].includes(c))ms++;if(ms==7)prob(hw[0]);hd()};
$('#hn').onclick=hnew;hnew();rp();
// copy
$('#cp').onclick=()=>{let t='Student: '+($('#nm').value||'—')+'\n';document.querySelectorAll('.ex').forEach((x,i)=>{t+='\n'+(i+1)+'. '+E[i][0]+' '+x.querySelector('.sc').textContent+'\n';x.querySelectorAll('[data-a],[data-k],[data-f]').forEach((el,j)=>{const st=el.dataset.st;t+=(j+1)+') '+(el.value||'—')+(st==='1'?' ✓':st==='0'?' ✗':'')+'\n'})});
t+='\nHangman: '+$('#hr').textContent+'\nProblem words: '+([...P].map(x=>x[0]+' ×'+x[1]).join(', ')||'none');
const o=$('#out');o.style.display='block';o.value=t;o.select();try{navigator.clipboard.writeText(t).then(()=>$('#cp').textContent='✅ Скопировано')}catch(e){}};
</script></body></html>
