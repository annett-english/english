<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Wear, carry, dress – practice</title><meta name="color-scheme" content="light dark">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#e6f0ff;--card:#fff;--ink:#1d2340;--mut:#5d6488;--ok:#14a37f;--okb:#d4f6ec;--bad:#e5484d;--badb:#ffe1e2;--sun:#ffd23f;--sel:#ece8ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12162b;--card:#1d2342;--ink:#f1f3ff;--mut:#a3aad1;--okb:#0f3b34;--badb:#4a1f27;--sel:#2c2a5e}}
:root[data-theme="dark"]{--bg:#12162b;--card:#1d2342;--ink:#f1f3ff;--mut:#a3aad1;--okb:#0f3b34;--badb:#4a1f27;--sel:#2c2a5e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.45 Fredoka,"Trebuchet MS",system-ui,sans-serif;background-image:radial-gradient(var(--mut) 1px,transparent 1.5px);background-size:26px 26px;background-attachment:fixed}
.wrap{max-width:1040px;margin:0 auto;padding:16px}
.hero{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--sun);color:#1d2340;border:3px solid #1d2340;border-radius:28px;padding:18px 22px;box-shadow:6px 6px 0 #1d2340;position:relative}
.hero h1{margin:0;font-size:clamp(28px,6vw,46px);line-height:1.05;font-weight:600}.hero p{margin:4px 0 0}
.hero:after{content:"👕👖🧦🧥";position:absolute;right:18px;top:-18px;font-size:28px;letter-spacing:6px;transform:rotate(4deg)}
input.nm{font:inherit;border:3px solid #1d2340;border-radius:14px;padding:8px 12px;background:#fff;color:#1d2340;width:200px}
.grid{display:grid;gap:18px;margin-top:22px;grid-template-columns:1fr}
@media(min-width:900px){.grid{grid-template-columns:1fr 250px}aside{order:2;position:sticky;top:12px;align-self:start}}
.card{background:var(--card);border:3px solid var(--ink);border-radius:24px;padding:18px;margin-bottom:22px;box-shadow:6px 6px 0 var(--a,var(--ink))}
.card h2{margin:0;font-size:24px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.num{background:var(--a);color:#1d2340;border:3px solid var(--ink);border-radius:50%;width:38px;height:38px;display:grid;place-items:center;font-size:18px}
.sc{margin-left:auto;font-size:15px;background:var(--sel);border-radius:99px;padding:2px 12px}
.ins{color:var(--mut);margin:6px 0 14px}
button{font:inherit;cursor:pointer;color:var(--ink)}
.btn{background:var(--a,var(--sun));color:#1d2340;border:3px solid var(--ink);border-radius:14px;padding:7px 14px;box-shadow:3px 3px 0 var(--ink);transition:transform .08s}
.btn:active{transform:translate(3px,3px);box-shadow:none}.btn.g{background:var(--card);color:var(--ink)}.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
:focus-visible{outline:3px solid var(--bad);outline-offset:2px}
.q{display:flex;gap:12px;padding:12px;border:2px dashed var(--ink);border-radius:16px;margin-bottom:10px}
.q.ok{background:var(--okb);border-style:solid;border-color:var(--ok)}.q.bad{background:var(--badb);border-style:solid;border-color:var(--bad)}.q.show{background:var(--sel);border-style:solid}
.qn{font-weight:600;color:var(--mut);min-width:20px}.qb{flex:1;min-width:0}.qp{margin-bottom:8px}
.opts{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.opt{text-align:left;background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:8px 12px}
.opt.sel{background:var(--sel);box-shadow:inset 0 0 0 2px var(--ink)}.opt.right{background:var(--ok);color:#fff;border-color:var(--ok)}.opt.wrong{background:var(--bad);color:#fff;border-color:var(--bad)}
.inp,textarea{font:inherit;width:100%;border:2px solid var(--ink);border-radius:12px;padding:8px 12px;background:var(--card);color:var(--ink)}textarea{min-height:110px}
.fb{font-size:14px;margin-top:6px;min-height:0}.spk{border:2px solid var(--ink);background:var(--sun);color:#1d2340;border-radius:50%;width:34px;height:34px}
.bank{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.chip{background:var(--sel);border:2px solid var(--ink);border-radius:99px;padding:2px 12px}
.chip.ok{background:var(--okb);border-color:var(--ok)}.chip.no{background:var(--badb);border-color:var(--bad)}
.rev{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.w{border:2px solid var(--ink);border-radius:16px;padding:10px 12px;display:flex;gap:10px;align-items:center}.w b{font-size:18px}.w small{color:var(--mut);display:block}
.ipa{color:var(--a2,#7b61ff);font-weight:500}
.vbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}.vbar select{font:inherit;max-width:100%;border:2px solid var(--ink);border-radius:10px;background:var(--card);color:var(--ink);padding:4px}
aside .card{padding:14px;margin:0}aside h3{margin:0 0 8px;font-size:18px}aside ul{list-style:none;margin:0;padding:0}
aside li{display:flex;justify-content:space-between;gap:6px;padding:4px 8px;border-radius:10px;background:var(--badb);margin-bottom:6px;cursor:pointer}
aside summary{cursor:pointer;font-size:18px;font-weight:600}
.bg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:460px;margin:12px 0}
.cell{min-height:64px;border:3px solid var(--ink);border-radius:14px;background:var(--card);font-size:15px;padding:4px}.cell.d{background:var(--ok);color:#fff}.cell.fl{animation:fl .6s 3}.cell.sk{animation:sk .3s}
@keyframes fl{50%{background:var(--sun);color:#1d2340}}@keyframes sk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.calls{background:var(--sel);border-radius:14px;padding:10px 14px;min-height:46px}
.rate{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.rate button{border:2px solid var(--ink);background:var(--card);border-radius:12px;padding:4px 10px}.rate button.on{background:var(--sun);color:#1d2340;box-shadow:2px 2px 0 var(--ink)}
.bar{height:16px;border:2px solid var(--ink);border-radius:99px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .4s}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div class="wrap">
<header class="hero"><div><h1>Wear, carry & get dressed</h1><p>8 слов, 8 заданий. Слушай, пиши, проверяй себя.</p></div><input class="nm" id="nm" placeholder="Имя студента" aria-label="Имя студента"></header>
<div class="grid"><aside><details class="card" id="pd" open style="--a:#ff6b6b"><summary>⚠️ Проблемные слова <span id="pc"></span></summary><ul id="pl" style="margin-top:10px"></ul><small class="ins">Нажми на слово, чтобы послушать.</small></details></aside><main id="main"></main></div></div>
<script>
const W=[
{k:'wear',b:'wear',ipa:'/wer/',ru:'носить (быть одетым во что-либо)',d:'to have clothes or accessories on your body',s:'It’s freezing, so Anna always <b>wears</b> a thick scarf and gloves.',v:['wore','worn']},
{k:'carry',b:'carry',ipa:'/ˈkæri/',ru:'носить с собой, нести',d:'to hold something and take it from place to place',s:'He <b>carries</b> a heavy bag of books to school every day.',v:['carried','carried']},
{k:'dress',b:'dress',ipa:'/dres/',ru:'одевать (кого-то); одеваться',d:'to put clothes on someone, or on yourself',s:'Every morning I <b>dress</b> my little son before kindergarten.',v:['dressed','dressed']},
{k:'put on',b:'put on',ipa:'/pʊt ɑːn/',ru:'надевать (само действие)',d:'to place clothes on your body',s:'It started to rain, so I <b>put on</b> my raincoat.',v:['put on','put on']},
{k:'take off',b:'take off',ipa:'/teɪk ɔːf/',ru:'снимать одежду или аксессуары',d:'to remove clothes or accessories from your body',s:'Please <b>take off</b> your wet shoes at the door.',v:['took off','taken off']},
{k:'get dressed',b:'get dressed',ipa:'/ɡet drest/',ru:'одеваться (процесс)',d:'to put your clothes on in the morning, for example',s:'Hurry up! <b>Get dressed</b>, we leave in ten minutes.',v:['got dressed','got dressed']},
{k:'get undressed',b:'get undressed',ipa:'/ɡet ˌʌnˈdrest/',ru:'раздеваться',d:'to take all your clothes off',s:'The doctor asked him to <b>get undressed</b> to the waist.',v:['got undressed','got undressed']},
{k:'pick up dirty clothes',b:'pick up',ipa:'/pɪk ʌp ˈdɜːrti kloʊðz/',ru:'подбирать грязную одежду (с пола)',d:'to lift unwashed clothes from the floor',s:'Please <b>pick up</b> your dirty clothes from the floor and put them in the basket.',v:['picked up','picked up'],m:['pick up dirty clothes','pick up']}];
const EX=[['def','📖','Definitions','Слово ↔ определение: выбери правильную пару.','#ffd23f'],['lis','🎧','Listen & pick','Послушай слово и выбери его значение.','#2ec4b6'],['vrb','🔁','Verb forms','Впиши нужную форму глагола.','#ff9f6b'],['ctx','🕵️','Context','Угадай значение выделенного слова по предложению.','#b8a4ff'],['rep','✍️','Rephrase','Замени выделенную идею словом или фразой из списка. Подсказка в скобках.','#ff7aa8'],['sit','🎭','Mini-situations','Дополни мини-ситуации. Подходящее слово есть в банке слов.','#6bd0ff'],['wri','🧠','Write what you remember','Напиши по памяти как можно больше слов из урока, потом сверься.','#9be564'],['bin','🎯','Bingo','Слушай или читай подсказку и нажимай на нужное слово.','#ffd23f'],['slf','🌟','What I know now','Оцени каждое слово честно.','#2ec4b6']];
const $=s=>document.querySelector(s),sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const norm=s=>(s||'').toLowerCase().replace(/[’']/g,"'").replace(/[^a-z' ]/g,' ').replace(/\s+/g,' ').trim();
const strip=h=>{const d=document.createElement('div');d.innerHTML=h;return d.textContent};
/* voice */
let voices=[],V=null;const TTS='speechSynthesis' in window;
function loadV(){if(!TTS)return;voices=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));const s=$('#vsel');if(!s)return;s.innerHTML=voices.map((v,i)=>`<option value="${i}">${v.name} (${v.lang})</option>`).join('');const p=voices.find(v=>/google us english/i.test(v.name))||voices.find(v=>/samantha/i.test(v.name))||voices.find(v=>v.lang=='en-US')||voices[0];if(p){V=p;s.value=voices.indexOf(p)}$('#vst').textContent=V?'Голос: '+V.name:'Английский голос не найден: установи его в системе.'}
function say(t,cb){if(!TTS){alert('Браузер не поддерживает озвучку. Открой страницу в Chrome или Safari.');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);if(V)u.voice=V;u.lang='en-US';u.rate=.9;if(cb)u.onend=cb;setTimeout(()=>speechSynthesis.speak(u),30)}
function sayAll(a,i=0){if(i<a.length)say(a[i],()=>setTimeout(()=>sayAll(a,i+1),350))}
/* problems */
const P={};function addP(k){P[k]=(P[k]||0)+1;drawP()}
function drawP(){const e=Object.entries(P);$('#pc').textContent=e.length?`(${e.length})`:'';$('#pl').innerHTML=e.length?e.map(([k,n])=>`<li data-say="${k}"><span>${k}</span><b>×${n}</b></li>`).join(''):'<li style="background:var(--okb);cursor:default">Пока ошибок нет 🎉</li>'}
/* builders */
function mc(w,prompt,ok,pool,audio){const o=sh(pool.filter(x=>x!==ok)).slice(0,3).map(t=>({t,ok:0}));o.push({t:ok,ok:1});return{w,prompt,audio,opts:o}}
function fix(qs){let p=-1;qs.forEach(q=>{if(!q.opts)return;let n=0;do{q.opts=sh(q.opts);n++}while(q.opts.findIndex(o=>o.ok)==p&&n<9);p=q.opts.findIndex(o=>o.ok)});return qs}
const RP=[['wear','She has a blue coat on.','She ___ a blue coat. (носить)',['wears','is wearing']],['carry','He holds a big box and walks upstairs.','He is ___ a big box. (нести)',['carrying']],['dress','Mum helps the baby with her clothes.','Mum is ___ the baby. (одевать)',['dressing']],['take off','Remove your hat in the church.','___ your hat in the church. (снять)',['take off']],['get dressed','Mark is putting his clothes on right now.','Mark is getting ___. (одеваться)',['dressed']],['get undressed','Lisa is removing her clothes before a shower.','Lisa is getting ___ before a shower. (раздеваться)',['undressed']],['put on','Place the jacket on your body, it’s cold!','___ your jacket, it’s cold! (надеть)',['put on']],['pick up dirty clothes','Lift the socks from the floor, please.','Please ___ the socks from the floor. (подобрать)',['pick up']]];
const SI=[['wear','“What is she ___ to the party?” “A green dress.”',['wearing']],['put on','“It’s minus five!” “___ your hat and gloves!”',['put on']],['get undressed','I’m exhausted. I just want to ___ and go to bed.',['get undressed']],['take off','Dad, I can’t ___ my boots. They’re too tight!',['take off']],['pick up dirty clothes','My room is a mess. I need to ___ all my dirty clothes from the floor.',['pick up']],['dress','Grandma can’t ___ herself, so I help her every morning.',['dress']],['carry','Can you ___ this suitcase for me? It’s very heavy.',['carry']],['get dressed','We have five minutes. ___ and come downstairs!',['get dressed']]];
const B={
def:()=>fix(sh(W).map(x=>Math.random()<.5?mc(x.k,`<i>${x.d}</i>`,x.k,W.map(y=>y.k)):mc(x.k,`What does <b>${x.k}</b> mean?`,x.d,W.map(y=>y.d)))),
lis:()=>fix(sh(W).map(x=>mc(x.k,'Listen and choose the meaning',x.ru,W.map(y=>y.ru),x.k))),
vrb:()=>sh(W).map(x=>{const j=Math.random()<.5?0:1,a=[x.v[j]];if(j&&x.k.startsWith('get'))a.push(x.v[1].replace('got','gotten'));return{w:x.k,prompt:`<b>${x.b}</b> → ${j?'Past Participle (V3)':'Past Simple (V2)'}`,ans:a}}),
ctx:()=>fix(sh(W).map(x=>mc(x.k,x.s+'<br><small>What does the bold part mean?</small>',x.ru,W.map(y=>y.ru)))),
rep:()=>sh(RP).map(r=>({w:r[0],prompt:`${r[1]}<br><b>${r[2]}</b>`,ans:r[3]})),
sit:()=>sh(SI).map(r=>({w:r[0],prompt:r[1],ans:r[2]}))};
const Q={},BANK=()=>`<div class="bank">${sh(W.map(w=>w.b=='pick up'?'pick up':w.k).concat(['wearing','carrying','dressing'])).map(t=>`<span class="chip">${t}</span>`).join('')}</div>`;
function draw(id){Q[id].forEach(q=>{});$('#b-'+id).innerHTML=(id=='sit'?BANK():'')+Q[id].map((q,i)=>`<div class="q" id="q-${id}-${i}"><div class="qn">${i+1}</div><div class="qb"><div class="qp">${q.audio?`<button class="spk" data-say="${q.audio}" aria-label="Listen">🔊</button> `:''}${q.prompt}</div>`+(q.opts?`<div class="opts">${q.opts.map((o,j)=>`<button class="opt" data-e="${id}" data-q="${i}" data-o="${j}">${o.t}</button>`).join('')}</div>`:`<input class="inp" data-e="${id}" data-q="${i}" value="${(q.val||'').replace(/"/g,'&quot;')}" placeholder="type here…" autocomplete="off" autocapitalize="off" spellcheck="false">`)+`<div class="fb"></div></div></div>`).join('');paint(id)}
function paint(id){let ok=0;Q[id].forEach((q,i)=>{const r=$(`#q-${id}-${i}`);r.className='q'+(q.shown?' show':q.st?' '+q.st:'');const fb=r.querySelector('.fb');const cor=q.opts?q.opts.find(o=>o.ok).t:q.ans.join(' / ');fb.textContent=q.shown?'💡 '+cor:q.st=='bad'?'Попробуй ещё раз':q.st=='ok'?'✅ Верно':'';if(q.st=='ok'&&!q.shown)ok++;if(q.opts)r.querySelectorAll('.opt').forEach((b,j)=>{b.classList.toggle('sel',q.val===j);b.classList.toggle('right',!!q.shown&&q.opts[j].ok);b.classList.toggle('wrong',q.st=='bad'&&q.val===j&&!q.shown)})});$('#sc-'+id).textContent=Q[id].some(q=>q.st||q.shown)?`${ok}/${Q[id].length}`:''}
function isOk(q){return q.opts?q.val!=null&&q.opts[q.val].ok:q.val&&q.ans.some(a=>norm(a)==norm(q.val))}
function check(id){Q[id].forEach(q=>{if(q.shown)return;const o=isOk(q);q.st=o?'ok':'bad';if(!o)addP(q.w)});paint(id)}
function show(id){Q[id].forEach(q=>{if(q.st!='ok'){q.shown=true;if(q.st!='bad')addP(q.w)}});paint(id)}
function reset(id){Q[id]=B[id]();draw(id)}
/* write */
const WR={};function wrCheck(){const t=' '+norm($('#wt').value)+' ';let n=0;$('#wres').innerHTML=W.map(w=>{const f=(w.m||[w.k]).some(m=>t.includes(' '+m+' '));if(f)n++;else addP(w.k);return`<span class="chip ${f?'ok':'no'}">${f?'✅':'❌'} ${f?w.k:'???'}</span>`}).join('');WR.n=n;$('#sc-wri').textContent=n+'/8'}
function wrShow(){$('#wres').innerHTML=W.map(w=>`<span class="chip">${w.k} – ${w.ru}</span>`).join('')}
/* bingo */
let BG={};function bgNew(){const c=sh(W.map(w=>w.k));c.splice(4,0,'★');BG={c,d:new Set(['★']),q:sh(W.map(w=>w.k)),cur:null,hit:0,miss:0,bingo:false,called:0};bgDraw();$('#bcall').textContent='Нажми «Следующая подсказка»'}
function bgDraw(){$('#bgrid').innerHTML=BG.c.map(k=>`<button class="cell${BG.d.has(k)?' d':''}" data-k="${k}">${k=='★'?'★ free':k}</button>`).join('')}
function bgNext(){if(BG.cur){bgClue();return}if(!BG.q.length){$('#bcall').textContent='🏁 Все подсказки пройдены!';return}BG.cur=BG.q.shift();BG.mode=Math.random()<.5;BG.called++;bgClue();$('#bgn').textContent='Следующая подсказка'}
function bgClue(){const w=W.find(x=>x.k==BG.cur);if(BG.mode){$('#bcall').textContent='🎧 Послушай слово…';say(w.k)}else $('#bcall').innerHTML='📖 <i>'+w.d+'</i>'}
function bgPick(k){if(k=='★')return;if(!BG.cur){$('#bcall').textContent='Сначала нажми «Следующая подсказка»';return}const cell=[...document.querySelectorAll('.cell')].find(c=>c.dataset.k==k);if(k==BG.cur){BG.d.add(k);BG.hit++;BG.cur=null;bgDraw();const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];const b=L.some(l=>l.every(i=>BG.d.has(BG.c[i])));$('#bcall').textContent=b?'🎉 BINGO! Линия собрана, играй дальше.':'✅ Верно!';if(b)BG.bingo=true;$('#sc-bin').textContent=BG.hit+'/8'}else{BG.miss++;addP(BG.cur);cell.classList.add('sk');setTimeout(()=>cell.classList.remove('sk'),400);$('#bcall').textContent='❌ Не то. Послушай ещё раз.'}}
function bgReveal(){if(!BG.cur)return;const c=[...document.querySelectorAll('.cell')].find(c=>c.dataset.k==BG.cur);c.classList.add('fl');addP(BG.cur)}
/* self */
const SELF={};const LV=['😕 Не уверен','🙂 Почти','😎 Знаю'];
function slfDraw(){$('#b-slf').innerHTML=W.map(w=>`<div class="w" style="display:block;margin-bottom:8px"><b>${w.k}</b> <span class="ipa">${w.ipa}</span><div class="rate">${LV.map((l,j)=>`<button data-s="${w.k}" data-l="${j}" class="${SELF[w.k]===j?'on':''}">${l}</button>`).join('')}</div></div>`).join('')+`<div class="acts"><button class="btn" id="sdone">Показать итог</button></div><div id="sres"></div>`}
function slfRes(){const n=W.filter(w=>SELF[w.k]===2).length,rev=W.filter(w=>SELF[w.k]!==2).map(w=>w.k);$('#sres').innerHTML=`<p>Я уверенно знаю <b>${n} из 8</b> слов.</p><div class="bar"><i style="width:${n/8*100}%"></i></div><p>${rev.length?'Повтори: '+rev.join(', '):'Супер! Все слова твои 🎉'}</p>`;$('#sc-slf').textContent=n+'/8'}
/* report */
function report(){const L=['Name: '+($('#nm').value||'—'),''];['def','lis','vrb','ctx','rep','sit'].forEach(id=>{const e=EX.find(x=>x[0]==id);L.push(`${EX.indexOf(e)+1}. ${e[2]} (${$('#sc-'+id).textContent||'не проверено'})`);Q[id].forEach((q,i)=>{const s=q.opts?(q.val!=null?q.opts[q.val].t:'—'):(q.val||'—'),c=q.opts?q.opts.find(o=>o.ok).t:q.ans[0];L.push(`  ${i+1}) ${strip(q.prompt).replace(/\s+/g,' ')} | answer: ${s} | correct: ${c} | ${q.shown?'shown':q.st=='ok'?'OK':q.st=='bad'?'WRONG':'-'}`)});L.push('')});L.push('7. Memory: '+($('#wt').value.replace(/\s+/g,' ')||'—')+' ('+($('#sc-wri').textContent||'-')+')','8. Bingo: correct '+BG.hit+', mistakes '+BG.miss+(BG.bingo?', BINGO':''),'9. Self-check: '+W.map(w=>w.k+' '+(SELF[w.k]!=null?LV[SELF[w.k]].slice(0,2):'-')).join('; '),'','Problem words: '+(Object.keys(P).map(k=>k+' ×'+P[k]).join(', ')||'none'));return L.join('\n')}
/* init */
function init(){let h=`<section class="card" style="--a:#ff6b6b;--a2:#7b61ff"><h2><span class="num">👂</span>Warm-up: words & sounds</h2><p class="ins">Послушай каждое слово и повтори вслух (голос Google US English / Samantha).</p><div class="vbar"><button class="btn" id="all">▶ Слушать всё</button><select id="vsel" aria-label="Голос"></select><span id="vst"></span></div><div class="rev">${W.map(w=>`<div class="w"><button class="spk" data-say="${w.k}" aria-label="Listen">🔊</button><div><b>${w.k}</b> <span class="ipa">${w.ipa}</span><small>${w.ru}</small></div></div>`).join('')}</div></section>`;
EX.forEach((e,i)=>{h+=`<section class="card" style="--a:${e[4]}"><h2><span class="num">${i+1}</span>${e[1]} ${e[2]}<span class="sc" id="sc-${e[0]}"></span></h2><p class="ins">${e[3]}</p><div id="b-${e[0]}"></div>`;
if(B[e[0]])h+=`<div class="acts"><button class="btn" data-a="check" data-e="${e[0]}">Проверить</button><button class="btn g" data-a="show" data-e="${e[0]}">Показать ответы</button><button class="btn g" data-a="reset" data-e="${e[0]}">Заново</button></div>`;
if(e[0]=='wri')h+=`<textarea id="wt" placeholder="wear, carry, …"></textarea><div class="acts"><button class="btn" id="wc">Проверить</button><button class="btn g" id="ws">Показать слова</button></div><div class="bank" id="wres" style="margin-top:12px"></div>`;
if(e[0]=='bin')h+=`<div class="calls" id="bcall"></div><div class="bg" id="bgrid"></div><div class="acts"><button class="btn" id="bgn">Следующая подсказка</button><button class="btn g" id="bgr">Показать ответ</button><button class="btn g" id="bgz">Новая карточка</button></div>`;
h+='</section>'});
h+=`<section class="card" style="--a:#ff7aa8"><h2><span class="num">📋</span>Мои ответы</h2><p class="ins">Собери все ответы и скопируй, чтобы отправить преподавателю.</p><div class="acts"><button class="btn" id="rep">Собрать и скопировать</button></div><textarea id="rout" style="margin-top:12px;min-height:160px" readonly></textarea><div id="rst" class="fb"></div></section>`;
$('#main').innerHTML=h;Object.keys(B).forEach(reset);bgNew();slfDraw();drawP();
if(matchMedia('(max-width:899px)').matches)$('#pd').open=false;
if(TTS){loadV();speechSynthesis.onvoiceschanged=loadV;$('#vsel').onchange=e=>{V=voices[e.target.value];$('#vst').textContent='Голос: '+V.name}}else $('#vst').textContent='Озвучка недоступна в этом браузере.'}
document.addEventListener('click',e=>{const t=e.target.closest('button,li');if(!t)return;const d=t.dataset;
if(d.say)return say(d.say);
if(d.o!=null){const q=Q[d.e][d.q];if(q.shown)return;q.val=+d.o;q.st=null;return paint(d.e)}
if(d.a)return{check,show,reset}[d.a](d.e);
if(d.k)return bgPick(d.k);
if(d.s){SELF[d.s]=+d.l;return slfDraw()}
const id=t.id;
if(id=='all')sayAll(W.map(w=>w.k));
else if(id=='wc')wrCheck();else if(id=='ws')wrShow();
else if(id=='bgn')bgNext();else if(id=='bgr')bgReveal();else if(id=='bgz')bgNew();
else if(id=='sdone')slfRes();
else if(id=='rep'){const o=$('#rout');o.value=report();o.select();const ok=()=>$('#rst').textContent='✅ Скопировано! Вставь в чат с преподавателем.',no=()=>{try{document.execCommand('copy')?ok():$('#rst').textContent='Текст выделен: нажми Ctrl/⌘+C'}catch(x){$('#rst').textContent='Текст выделен: нажми Ctrl/⌘+C'}};navigator.clipboard?navigator.clipboard.writeText(o.value).then(ok,no):no()}});
document.addEventListener('input',e=>{const t=e.target;if(t.classList.contains('inp')){const q=Q[t.dataset.e][t.dataset.q];if(q.shown)return;q.val=t.value;q.st=null;const r=t.closest('.q');r.className='q';r.querySelector('.fb').textContent=''}});
init();
</script></body></html>
