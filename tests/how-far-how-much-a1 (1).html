<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>How far? How much? How many? — A1</title>
<style>
:root{--bg:#f3f6f8;--card:#fff;--tx:#14212b;--mu:#5c6b76;--bd:#d5dde3;--ac:#0b6e8a;--acb:#e2f2f7;--ok:#17803f;--okb:#e3f4ea;--no:#c0342a;--nob:#fceceb;--hl:#ffe9a8}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12181d;--card:#1b242b;--tx:#e8eef2;--mu:#98a8b3;--bd:#2f3d47;--ac:#5cc3df;--acb:#17323c;--ok:#5fd18b;--okb:#153322;--no:#ff8277;--nob:#3b1e1b;--hl:#5a4a14}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#12181d;--card:#1b242b;--tx:#e8eef2;--mu:#98a8b3;--bd:#2f3d47;--ac:#5cc3df;--acb:#17323c;--ok:#5fd18b;--okb:#153322;--no:#ff8277;--nob:#3b1e1b;--hl:#5a4a14}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 "Avenir Next","Segoe UI",system-ui,sans-serif}
header{padding:28px 16px 22px;background:var(--card);border-bottom:1px solid var(--bd);position:relative}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:14px;background:repeating-linear-gradient(90deg,var(--ac) 0 2px,transparent 2px 10px),repeating-linear-gradient(90deg,var(--ac) 0 2px,transparent 2px 50px);background-size:100% 6px,100% 14px;background-repeat:no-repeat;opacity:.55}
.in{max-width:1020px;margin:0 auto}
h1{margin:0 0 4px;font:700 clamp(26px,5vw,38px)/1.15 Georgia,"Times New Roman",serif}
h2{margin:0 0 4px;font:700 20px/1.3 Georgia,serif}
.sub{color:var(--mu);margin:0 0 12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.wrap{max-width:1020px;margin:0 auto;padding:16px;display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:16px;align-items:start}
aside{position:sticky;top:10px;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px}
aside h3{margin:0 0 6px;font-size:15px}
#pw{margin:0;padding:0;list-style:none;font-size:14px}
#pw li{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dashed var(--bd)}
#pw b{color:var(--no)}
section{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-bottom:16px}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:6px 12px}
button:hover{border-color:var(--ac)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--ac);outline-offset:1px}
.p{background:var(--ac);color:#fff;border-color:var(--ac)}
:root[data-theme="dark"] .p{color:#08222b}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .p{color:#08222b}}
.sp{padding:2px 8px;font-size:14px}
table{border-collapse:collapse;width:100%}
td{padding:5px 8px;border-bottom:1px solid var(--bd);vertical-align:middle}
td.ipa{color:var(--ac);white-space:nowrap}
td.ru{color:var(--mu)}
.tw{overflow-x:auto}
.it{padding:8px 10px;margin:6px 0;border:1px solid var(--bd);border-radius:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.it.ok{background:var(--okb);border-color:var(--ok)}
.it.bad{background:var(--nob);border-color:var(--no)}
.n{color:var(--mu);min-width:1.4em}
input[type=text],textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:5px 8px}
input.g{width:11em}
input.w{flex:1 1 260px}
textarea{width:100%;min-height:110px}
.hint{color:var(--mu);font-size:14px}
.ans{flex-basis:100%;color:var(--ok);font-size:14px;display:none}
.ans.on{display:block}
.m{font-weight:700;min-width:1.2em}
.opt{margin:0}
.opt.sel{background:var(--acb);border-color:var(--ac)}
.opt.right{background:var(--okb);border-color:var(--ok)}
.opt.wrong{background:var(--nob);border-color:var(--no)}
.pool,.built{display:flex;flex-wrap:wrap;gap:6px}
.built{min-height:38px;padding:3px;border-bottom:2px solid var(--bd);flex:1 1 100%}
.chip{display:inline-block;padding:3px 10px;border:1px solid var(--bd);border-radius:999px;margin:2px;font-size:14px}
.chip.u{background:var(--hl);border-color:var(--hl)}
.sc{display:flex;gap:6px}
.sc button.on{background:var(--acb);border-color:var(--ac);font-weight:700}
.sum{margin-top:6px;font-weight:700}
.toast{color:var(--ok);font-weight:700}
@media(max-width:780px){.wrap{grid-template-columns:1fr}aside{position:static;order:-1}}
@media(prefers-reduced-motion:no-preference){.it{transition:background .2s}}
</style>
</head>
<body>
<header><div class="in">
<h1>How far? How much? How many?</h1>
<p class="sub">A1 · размеры, цены, количество · пиши слова руками, потом нажимай «Проверить»</p>
<div class="bar"><button class="p" onclick="say('Hello! Can you hear me? How far is the station?')">🔊 Проверить звук</button><select id="vsel" onchange="setVoice(this.value)" aria-label="Голос" style="max-width:230px;font:inherit;padding:5px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx)"></select><span class="hint" id="vstat"></span><span style="flex:1"></span><button onclick="copyAll()">📋 Копировать всё</button><span class="toast" id="toast"></span></div>
</div></header>
<div class="wrap">
<main id="main">
<section><h2>Words to remember</h2><p class="sub">Нажми 🔊 и послушай каждое слово. Повтори вслух.</p><div class="tw"><table id="rec"></table></div></section>
</main>
<aside><h3>Проблемные слова</h3><ul id="pw"></ul><p class="hint" id="pwe">Пока ошибок нет.</p><button class="sp" onclick="PW={};rpw()">Очистить</button></aside>
</div>
<script>
const $=s=>document.querySelector(s);
const norm=s=>String(s).toLowerCase().replace(/[’‘]/g,"'").replace(/[-–]/g,' ').replace(/[.,!?;:"]/g,'').replace(/\s+/g,' ').trim();
/* ---------- audio ---------- */
let V=null,userV=null;
function pickVoice(){const vs=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));if(userV)V=vs.find(v=>v.name===userV)||V;else V=vs.find(v=>/google us english.*natural 1/i.test(v.name))||vs.find(v=>/google us english/i.test(v.name))||vs.find(v=>/samantha/i.test(v.name))||vs.find(v=>/^en[-_]US/i.test(v.lang))||vs[0]||null;$('#vsel').innerHTML=vs.map(v=>`<option value="${v.name}"${V&&v.name===V.name?' selected':''}>${v.name} (${v.lang})</option>`).join('');$('#vstat').textContent=vs.length?'':'Голос по умолчанию';}
function setVoice(n){userV=n;pickVoice();say('Hello! How far is the station?');}
function say(t){if(!('speechSynthesis' in window)){$('#vstat').textContent='В этом браузере нет озвучки';return;}if(!V)pickVoice();speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(t).replace(/’/g,"'"));u.lang='en-US';if(V)u.voice=V;u.rate=.85;speechSynthesis.speak(u);}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
/* ---------- data ---------- */
const REC=[['how far','haʊ fɑː','как далеко'],['how long','haʊ lɒŋ','как долго / какой длины'],['how many','haʊ ˈmeni','сколько (счётные)'],['how much','haʊ mʌtʃ','сколько (несчётные) / цена'],['how old','haʊ əʊld','сколько лет'],['tall','tɔːl','высокий (рост)'],['high','haɪ','высокий (над землёй)'],['deep','diːp','глубокий'],['weigh','weɪ','весить'],['weight','weɪt','вес'],['luggage','ˈlʌɡɪdʒ','багаж'],['coin','kɔɪn','монета'],['traffic light','ˈtræfɪk laɪt','светофор'],['skyscraper','ˈskaɪskreɪpə','небоскрёб'],['sky','skaɪ','небо'],['kilometre','ˈkɪləmiːtə','километр'],['litre','ˈliːtə','литр'],['metre','ˈmiːtə','метр']];
const P=[2,0,3,1,3,0,2,1];
const EX=[
{id:1,k:'gap',t:'1. Fill the gap',h:'Впиши пропущенное слово.',items:[
{q:'The suitcase ___ 20 kilos.',a:['weighs'],w:'weigh',r:'весит'},
{q:'How ___ is the lake?',a:['deep'],w:'deep',r:'какой глубины'},
{q:'There aren’t ___ people here.',a:['many'],w:'many / much',r:'не очень много'},
{q:'How ___ are you? — I’m 1 metre 80.',a:['tall'],w:'tall / high',r:'какого роста'},
{q:'I don’t have ___ money.',a:['much'],w:'many / much',r:'не очень много'},
{q:'How ___ does it take? — Five minutes.',a:['long'],w:'how long',r:'как долго'},
{q:'The ___ is red. Stop!',a:['traffic light'],w:'traffic light',r:'светофор'},
{q:'There are many ___ in New York.',a:['skyscrapers'],w:'skyscraper',r:'небоскрёбы'}]},
{id:2,k:'pick',t:'2. Listen & pick',h:'Нажми 🔊 и выбери значение.',items:[
{s:'how deep',c:'какой глубины',d:['какой высоты','как далеко','сколько лет'],w:'deep'},
{s:'luggage',c:'багаж',d:['монета','светофор','вес'],w:'luggage'},
{s:'how old',c:'сколько лет',d:['какого роста','сколько стоит','как долго'],w:'how old'},
{s:'weigh',c:'весить',d:['вес','сказать','стоить'],w:'weigh / weight'},
{s:'coin',c:'монета',d:['небо','литр','метр'],w:'coin'},
{s:'not many',c:'не очень много (счётные)',d:['очень много','как далеко','сколько стоит'],w:'many / much'},
{s:'how far',c:'как далеко',d:['как долго','сколько весит','какой глубины'],w:'how far'},
{s:'skyscraper',c:'небоскрёб',d:['небо','светофор','станция'],w:'skyscraper / sky'}]},
{id:3,k:'write',t:'3. Write the question',h:'Напиши вопрос к ответу.',items:[
{q:'It’s 2 kilometres. (the station)',a:['How far is the station','How far is it'],w:'how far',r:'как далеко станция?'},
{q:'I’m twenty-five.',a:['How old are you'],w:'how old',r:'сколько тебе лет?'},
{q:'They cost 5 euros. (these vegetables)',a:['How much do these vegetables cost','How much are these vegetables'],w:'how much',r:'сколько стоят эти овощи?'},
{q:'The mountain is 800 metres high.',a:['How high is the mountain'],w:'high',r:'какой высоты гора?'},
{q:'It takes 5 minutes.',a:['How long does it take'],w:'how long',r:'сколько это занимает?'},
{q:'It weighs 2 kilos. (this apple)',a:['How much does this apple weigh','How much does it weigh'],w:'weigh',r:'сколько весит яблоко?'},
{q:'I have three books.',a:['How many books do you have'],w:'how many',r:'сколько у тебя книг?'},
{q:'I’m 1 metre 80.',a:['How tall are you'],w:'tall',r:'какого ты роста?'}]},
{id:4,k:'dict',t:'4. Listen & write',h:'Послушай и напиши предложение целиком.',items:[
{s:'How far is the station?',a:['How far is the station?'],w:'how far'},
{s:'I would like a sandwich.',a:['I would like a sandwich.'],w:'I would like'},
{s:'The suitcase weighs 20 kilos.',a:['The suitcase weighs 20 kilos.'],w:'weigh'},
{s:'How deep is the lake?',a:['How deep is the lake?'],w:'deep'},
{s:'I found a coin.',a:['I found a coin.'],w:'coin'},
{s:'Where is my luggage?',a:['Where is my luggage?'],w:'luggage'},
{s:'The sky is blue today.',a:['The sky is blue today.'],w:'sky'},
{s:'How much is this T-shirt?',a:['How much is this T-shirt?'],w:'how much'}]},
{id:5,k:'build',t:'5. Build the chunk',h:'Нажимай на части по порядку, чтобы собрать фразу. Нажми на часть в строке — она вернётся.',items:[
{c:['How far','is','the station?'],w:'how far'},
{c:['How many','books','do you have?'],w:'how many'},
{c:['It takes','5 minutes','to walk there.'],w:'it takes'},
{c:['I would like','a sandwich.'],w:'I would like'},
{c:['How much','does','this bag','weigh?'],w:'weigh'},
{c:['How deep','is','the lake?'],w:'deep'},
{c:['The city is','10 kilometres','away.'],w:'kilometre'},
{c:['I don’t have','much','money.'],w:'much'}]},
{id:6,k:'rc',t:'6. Repeat & Change',h:'Послушай образец и напиши свою фразу, поменяв слова. Например: How far is the airport?',items:[
{m:'How far is the station?'},{m:'How old are you?'},{m:'How deep is the lake?'},{m:'It takes 5 minutes to walk there.'},{m:'The suitcase weighs 20 kilos.'},{m:'I don’t have much money.'},{m:'There aren’t many people here.'},{m:'How much is this T-shirt?'}]}
];
const STORY=[['how far','how far'],['how long','how long'],['how many','how many'],['how much','how much'],['weigh','weigh'],['luggage','luggage'],['traffic light','traffic light'],['tall','\\btall\\b'],['deep','\\bdeep\\b'],['skyscraper','skyscraper']];
const CAN=['Я могу спросить, как далеко что-то находится','Я могу спросить, сколько что-то занимает времени','Я знаю разницу many / much','Я могу спросить о возрасте и росте','Я могу спросить о высоте и глубине','Я могу спросить цену: How much…?','Я могу сказать, сколько что-то весит','Я знаю слова: luggage, coin, traffic light, skyscraper'];
/* ---------- state ---------- */
const S={};let PW={};const SA=[];
EX.forEach(e=>S[e.id]=e.items.map(()=>e.k==='build'?[]:''));
function rpw(){const k=Object.keys(PW).sort((a,b)=>PW[b]-PW[a]);$('#pw').innerHTML=k.map(x=>`<li><span>${x}</span><b>×${PW[x]}</b></li>`).join('');$('#pwe').style.display=k.length?'none':'block';}
/* ---------- render ---------- */
$('#rec').innerHTML=REC.map(r=>`<tr><td><b>${r[0]}</b></td><td class="ipa">/${r[1]}/</td><td class="ru">${r[2]}</td><td><button class="sp" aria-label="Listen: ${r[0]}" onclick="say('${r[0]}')">🔊</button></td></tr>`).join('');
const sh=(a,i)=>{const b=[...a].reverse();if(i%2&&b.length>2)b.push(b.shift());return b;};
function itemHTML(e,it,i){const id=`${e.id}_${i}`,n=`<span class="n">${i+1}.</span>`,m=`<span class="m" id="m${id}"></span>`,an=`<div class="ans" id="a${id}"></div>`;
 if(e.k==='gap'){const [a,b]=it.q.split('___');return n+`<span>${a}<input type="text" class="g" id="i${id}" oninput="S[${e.id}][${i}]=this.value" autocomplete="off" autocapitalize="off" spellcheck="false">${b}</span><span class="hint">(${it.r})</span>`+m+an;}
 if(e.k==='pick'){const o=[...it.d];o.splice(P[i],0,it.c);return n+`<button class="sp" aria-label="Listen" onclick="say('${it.s}')">🔊</button>`+o.map(x=>`<button class="opt" data-v="${x}" onclick="pk(${e.id},${i},this)">${x}</button>`).join('')+m+an;}
 if(e.k==='write')return n+`<span>${it.q}</span><input type="text" class="w" id="i${id}" oninput="S[${e.id}][${i}]=this.value" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Write the question…">`+m+an;
 if(e.k==='dict')return n+`<button class="sp" aria-label="Listen" onclick="say('${it.s}')">🔊</button><input type="text" class="w" id="i${id}" oninput="S[${e.id}][${i}]=this.value" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type what you hear…">`+m+an;
 if(e.k==='build')return n+`<div style="flex:1 1 280px"><div class="built" id="b${id}"></div><div class="pool" id="p${id}"></div></div>`+m+an;
 return n+`<span>${it.m}</span><button class="sp" aria-label="Listen" onclick="say('${it.m}')">🔊</button><input type="text" class="w" id="i${id}" oninput="S[${e.id}][${i}]=this.value" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Your sentence…">`;}
function rb(e,i){const it=e.items[i],id=`${e.id}_${i}`,bt=S[e.id][i];const order=sh(it.c.map((_,j)=>j),i);
 $('#b'+id).innerHTML=bt.map(j=>`<button class="sp" onclick="bk(${e.id},${i},${j},0)">${it.c[j]}</button>`).join('');
 $('#p'+id).innerHTML=order.filter(j=>!bt.includes(j)).map(j=>`<button class="sp" onclick="bk(${e.id},${i},${j},1)">${it.c[j]}</button>`).join('');}
function bk(eid,i,j,add){const a=S[eid][i];if(add)a.push(j);else a.splice(a.indexOf(j),1);rb(EX[eid-1],i);}
function pk(eid,i,b){S[eid][i]=b.dataset.v;b.parentNode.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel',x===b));}
const main=$('#main');
EX.forEach(e=>{const s=document.createElement('section');s.innerHTML=`<h2>${e.t}</h2><p class="sub">${e.h}</p>`+e.items.map((it,i)=>`<div class="it" id="it${e.id}_${i}">${itemHTML(e,it,i)}</div>`).join('')+`<div class="bar" style="margin-top:8px">${e.k==='rc'?'':`<button class="p" onclick="chk(${e.id})">Проверить</button><button onclick="shw(${e.id})">Показать ответы</button>`}<button onclick="rst(${e.id})">Сбросить</button><span class="sum" id="sum${e.id}"></span></div>`;main.appendChild(s);if(e.k==='build')e.items.forEach((_,i)=>rb(e,i));});
const st=document.createElement('section');
st.innerHTML=`<h2>7. Story with 5 words</h2><p class="sub">Напиши мини-рассказ (3–5 предложений) и используй минимум 5 слов из списка.</p><div id="chips">${STORY.map(x=>`<span class="chip" data-r="${x[1]}">${x[0]}</span>`).join('')}</div><p class="sum" id="cnt">Использовано: 0 / 5</p><textarea id="story" placeholder="At the airport, my luggage weighs…" autocapitalize="off" spellcheck="false"></textarea>`;main.appendChild(st);
$('#story').oninput=()=>{const t=$('#story').value.toLowerCase();let n=0;document.querySelectorAll('#chips .chip').forEach(c=>{const u=new RegExp(c.dataset.r).test(t);c.classList.toggle('u',u);if(u)n++;});$('#cnt').textContent='Использовано: '+n+' / 5'+(n>=5?' ✓':'');};
const saS=document.createElement('section');
saS.innerHTML=`<h2>Что я теперь знаю</h2><p class="sub">Оцени себя честно.</p>`+CAN.map((c,i)=>`<div class="it"><span style="flex:1 1 240px">${c}</span><span class="sc" id="sc${i}">${['знаю','не уверен','не знаю'].map(v=>`<button class="sp" onclick="sa(${i},'${v}')">${v}</button>`).join('')}</span></div>`).join('')+`<p class="sum" id="sas"></p><div class="bar"><button class="p" onclick="copyAll()">📋 Копировать всё</button></div>`;main.appendChild(saS);
function sa(i,v){SA[i]=v;document.querySelectorAll('#sc'+i+' button').forEach(b=>b.classList.toggle('on',b.textContent===v));const c=x=>SA.filter(y=>y===x).length;$('#sas').textContent=`Знаю: ${c('знаю')} · не уверен: ${c('не уверен')} · не знаю: ${c('не знаю')}`;}
/* ---------- check / show / reset ---------- */
function good(e,i){const it=e.items[i],v=S[e.id][i];if(e.k==='pick')return v===it.c;if(e.k==='build')return v.length===it.c.length&&v.every((j,x)=>j===x);return it.a.some(a=>norm(a)===norm(v));}
function ansText(e,i){const it=e.items[i];if(e.k==='pick')return it.s+' = '+it.c;if(e.k==='build')return it.c.join(' ');return it.a[0];}
function chk(id){const e=EX[id-1];let ok=0;e.items.forEach((it,i)=>{const g=good(e,i),el=$(`#it${id}_${i}`);el.classList.toggle('ok',g);el.classList.toggle('bad',!g);$(`#m${id}_${i}`).textContent=g?'✓':'✗';if(g)ok++;else PW[it.w]=(PW[it.w]||0)+1;
 if(e.k==='pick')el.querySelectorAll('.opt').forEach(b=>{b.classList.remove('right','wrong');if(b.dataset.v===it.c)b.classList.add('right');else if(b.dataset.v===S[id][i])b.classList.add('wrong');});});
 $('#sum'+id).textContent=`${ok} / ${e.items.length}`;rpw();}
function shw(id){const e=EX[id-1];e.items.forEach((it,i)=>{const a=$(`#a${id}_${i}`);a.textContent='✔ '+ansText(e,i);a.classList.add('on');});}
function rst(id){const e=EX[id-1];S[id]=e.items.map(()=>e.k==='build'?[]:'');e.items.forEach((it,i)=>{const el=$(`#it${id}_${i}`);el.classList.remove('ok','bad');const m=$(`#m${id}_${i}`),a=$(`#a${id}_${i}`),inp=$(`#i${id}_${i}`);if(m)m.textContent='';if(a){a.classList.remove('on');a.textContent='';}if(inp)inp.value='';el.querySelectorAll('.opt').forEach(b=>b.classList.remove('sel','right','wrong'));if(e.k==='build')rb(e,i);});$('#sum'+id).textContent='';}
/* ---------- copy ---------- */
function allText(){let o='A1 · How far? How much? How many?\n';EX.forEach(e=>{o+='\n'+e.t+'\n';e.items.forEach((it,i)=>{let v=S[e.id][i];if(e.k==='build')v=v.map(j=>it.c[j]).join(' ');const q=e.k==='rc'?it.m+' → ':e.k==='gap'?it.q+' → ':e.k==='write'?it.q+' → ':e.k==='pick'?it.s+' → ':'';let mk='';if(e.k!=='rc')mk=v?(good(e,i)?' ✓':' ✗ ('+ansText(e,i)+')'):' — (пусто)';o+=(i+1)+'. '+q+(v||'')+mk+'\n';});});
 o+='\n7. Story\n'+($('#story').value||'—')+'\n\nЧто я теперь знаю\n'+CAN.map((c,i)=>c+': '+(SA[i]||'—')).join('\n');const k=Object.keys(PW);if(k.length)o+='\n\nПроблемные слова: '+k.map(x=>x+' ×'+PW[x]).join(', ');return o;}
function copyAll(){const t=allText(),ok=()=>{$('#toast').textContent='Скопировано ✓';setTimeout(()=>$('#toast').textContent='',2500);};
 const fb=()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');ok();}catch(x){$('#toast').textContent='Не удалось скопировать';}a.remove();};
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(ok,fb);else fb();}
rpw();
