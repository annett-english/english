<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Food vocabulary A1</title>
<style>
:root{--bg:#fbf8f3;--fg:#2a2a2a;--card:#fff;--mut:#6b6b6b;--ac:#2f7d4f;--ac2:#e8f3ec;--bd:#e5dfd3;--ok:#1f8f4e;--bad:#c93c3c;--okb:#e3f5ea;--badb:#fbe6e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16181a;--fg:#ececec;--card:#1f2326;--mut:#a0a6a8;--ac:#5cc489;--ac2:#223a2c;--bd:#343a3d;--ok:#5cc489;--bad:#ff7b7b;--okb:#1f3a2a;--badb:#442525}}
:root[data-theme="dark"]{--bg:#16181a;--fg:#ececec;--card:#1f2326;--mut:#a0a6a8;--ac:#5cc489;--ac2:#223a2c;--bd:#343a3d;--ok:#5cc489;--bad:#ff7b7b;--okb:#1f3a2a;--badb:#442525}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px;display:grid;grid-template-columns:1fr 230px;gap:16px}
main{min-width:0}aside{position:sticky;top:12px;align-self:start;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;max-height:80vh;overflow:auto;font-size:14px}
@media(max-width:800px){.wrap{grid-template-columns:1fr}aside{order:-1;position:static;max-height:150px}}
h1{margin:8px 0}h2{margin:0 0 4px;font-size:20px}.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:0 0 16px}
.ins{color:var(--mut);margin:0 0 12px}button{font:inherit;cursor:pointer;border:1px solid var(--ac);background:var(--ac);color:#fff;border-radius:8px;padding:6px 12px}
button.g{background:transparent;color:var(--ac)}button.sp{padding:4px 9px;background:var(--ac2);color:var(--fg);border-color:var(--bd)}
input{font:inherit;padding:6px 8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg);min-width:0;width:170px}input.wide{width:100%;margin-top:4px}input.gap{width:120px}
.it{padding:8px 10px;border-radius:10px;border:1px solid transparent;display:flex;flex-wrap:wrap;gap:8px;align-items:center}.items{counter-reset:i}.it::before{counter-increment:i;content:counter(i)".";font-weight:700;color:var(--mut);min-width:22px}
.it.ok{background:var(--okb);border-color:var(--ok)}.it.bad{background:var(--badb);border-color:var(--bad)}.ans{color:var(--ok);font-weight:600}.em{font-size:34px}.st{flex:1 1 100%}
.bar{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sc{font-weight:700}
.opt,.chip,.cell{background:var(--card);color:var(--fg);border:1px solid var(--bd)}.opt.on,.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.bank{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.bank span{background:var(--ac2);padding:2px 10px;border-radius:99px}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}.w{border:1px solid var(--bd);border-radius:10px;padding:8px;display:flex;gap:8px;align-items:center}.w small{color:var(--mut);display:block}

.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;max-width:380px}.cell{aspect-ratio:1;padding:0;font-weight:700;text-transform:uppercase}.cell.s{background:#f5c542;color:#222}.cell.f{background:var(--ac);color:#fff}
.wl{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.wl span{background:var(--ac2);padding:2px 10px;border-radius:99px}.wl .d{text-decoration:line-through;opacity:.6}
textarea{width:100%;min-height:140px;font:14px/1.4 ui-monospace,monospace;background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:8px;padding:8px}
table{width:100%;border-collapse:collapse}td{padding:3px 2px;border-bottom:1px solid var(--bd)}
</style></head><body>
<noscript><p style="padding:16px;background:#fde;color:#900;margin:0">JavaScript отключён. Откройте файл в обычном браузере (Chrome, Safari, Edge).</p></noscript>
<script>window.onerror=function(m,u,l){var d=document.createElement('p');d.style.cssText='padding:12px;background:#fde;color:#900;margin:0;font:14px monospace';d.textContent='Ошибка скрипта: '+m+' (строка '+l+'). Отправьте этот текст — я исправлю.';document.body.prepend(d)}</script>
<div class="wrap"><main>
<h1>🥗 Food &amp; Drink · A1</h1>
<section class="card"><h2>Words / Слова</h2><p class="ins">Прослушайте каждое слово (голос Google US English или Samantha) и повторите вслух. Нажмите 🔊.</p>
<div class="bar" style="margin:0 0 10px"><button id="pall">▶ Прослушать все слова</button><button class="g" data-say="Hello! Let’s learn food words.">🔊 Тест звука</button></div><div class="words" id="wl"></div></section>
<div id="exs"></div>
<section class="card" id="quiz"></section>
<section class="card" id="wsr"></section>

<div class="bar"><button class="g" id="atest">🔊 Проверить аудио</button><span id="vname" class="sc"></span></div>
<div class="bar"><input id="nm" placeholder="Your name"><button id="cp">📋 Скопировать все ответы</button><span id="cpm" class="sc"></span></div>

</main>
<aside><b>⚠ Проблемные слова</b><div id="pw" style="margin-top:6px"></div><button class="g" style="margin-top:8px;padding:2px 8px" onclick="P={};sv();renderP()">Очистить</button></aside></div>
<script>
const W=[
["courgette|zucchini","цукини","/kɔːˈʒet/ · /zuˈkiːni/","","v","A ___ is a long green vegetable, like a small cucumber."],
["prawns|shrimps","креветки","/prɔːnz/ · /ʃrɪmps/","🦐","p","I like ___ with garlic and rice."],
["sparkling water","газированная вода","/ˈspɑːklɪŋ ˈwɔːtə/","🫧","d","Can I have a glass of ___, please?"],
["mushrooms","грибы","/ˈmʌʃruːmz/","🍄","v","We put ___ on the pizza."],
["herbs","травы, зелень","/hɜːbz/","🌿","o","Basil and parsley are ___."],
["olives","оливки","/ˈɒlɪvz/","🫒","o","A Greek salad has feta cheese and black ___."],
["potatoes","картофель","/pəˈteɪtəʊz/","🥔","v","French fries are made from ___."],
["lettuce","салат (латук)","/ˈletɪs/","🥬","v","I put ___ and tomato in my sandwich."],
["chillies|chilies","перец чили","/ˈtʃɪliz/","🌶️","v","Be careful! These ___ are very hot."],
["sugar","сахар","/ˈʃʊɡə/","🍬","o","I don’t take ___ in my tea."],
["pasta","паста, макароны","/ˈpæstə/","🍝","c","Spaghetti is a kind of ___."],
["noodles","лапша","/ˈnuːdlz/","🍜","c","In China people eat a lot of ___ with soup."],
["lemonade","лимонад","/ˌleməˈneɪd/","🥤","d","On a hot day I drink cold ___."],
["butter","сливочное масло","/ˈbʌtə/","🧈","o","Put some ___ on your toast."],
["cucumber","огурец","/ˈkjuːkʌmbə/","🥒","v","A ___ is green and has a lot of water."],
["orange","апельсин","/ˈɒrɪndʒ/","🍊","f","I have an ___ and a glass of juice for breakfast."],
["strawberry","клубника","/ˈstrɔːbəri/","🍓","f","I love ___ ice cream."],
["melon","дыня","/ˈmelən/","🍈","f","A ___ is big and sweet, green or yellow inside."],
["peas","горох","/piːz/","","v","Green ___ are small and round."],
["lamb","баранина","/læm/","🐑","p","In Greece they often eat ___ at Easter."],
["chicken","курица","/ˈtʃɪkɪn/","🍗","p","Roast ___ with potatoes is my favourite dinner."],
["bread","хлеб","/bred/","🍞","c","I buy fresh ___ at the bakery."],
["cereal","хлопья","/ˈsɪəriəl/","🥣","c","Kids often eat ___ with milk for breakfast."],
["yoghurt|yogurt","йогурт","/ˈjɒɡət/","🥛","o","I eat ___ with honey and fruit."],
["bell pepper|pepper","(болгарский) перец","/bel ˈpepə/","🫑","v","A red ___ is sweet, not hot."],
["onion","лук","/ˈʌnjən/","🧅","v","When I cut an ___, I cry."],
["oil","растительное масло","/ɔɪl/","","o","Olive ___ is good for salads."],
["fish","рыба","/fɪʃ/","🐟","p","My cat loves ___."],
["pear","груша","/peə/","🍐","f","An apple and a ___ are fruit."],
["aubergine|eggplant","баклажан","/ˈəʊbəʒiːn/ · /ˈeɡplɑːnt/","🍆","v","Moussaka is made with ___ and meat."]
].map((a,i)=>({i,en:a[0],ru:a[1],ipa:a[2],e:a[3],c:a[4],s:a[5]}));
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],R=a=>a.slice().sort(()=>Math.random()-.5);
const D=w=>w.en.split('|')[0],DD=w=>w.en.split('|').join(' / ');
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const norm=s=>s.toLowerCase().replace(/[.!?,]/g,'').replace(/\s+/g,' ').trim();
const use={};const pick=(n,f=()=>1)=>R(R(W.filter(f)).sort((a,b)=>(use[a.i]||0)-(use[b.i]||0)).slice(0,n).map(w=>(use[w.i]=(use[w.i]||0)+1,w)));
/* audio */
let V=null;const TTS='speechSynthesis' in window;
function pv(){const l=speechSynthesis.getVoices();V=l.find(v=>/Google US English/i.test(v.name))||l.find(v=>/Samantha/i.test(v.name))||l.find(v=>v.lang==='en-US')||l.find(v=>/^en/i.test(v.lang))||null;$('#vname').textContent=V?'Голос: '+V.name:'Голос по умолчанию'}
if(TTS){pv();speechSynthesis.onvoiceschanged=pv}
function utt(t,r){const u=new SpeechSynthesisUtterance(t);u.lang='en-US';if(V)u.voice=V;u.rate=r;return u}
function say(t,r=.9){if(!TTS){alert('Ваш браузер не поддерживает озвучку. Попробуйте Chrome или Safari.');return}speechSynthesis.cancel();speechSynthesis.speak(utt(t,r))}
document.addEventListener('click',e=>{const b=e.target.closest('[data-say]');if(b)say(b.dataset.say,+b.dataset.r||.9)});
$('#pall').onclick=()=>{if(!TTS)return say('');speechSynthesis.cancel();W.forEach(w=>speechSynthesis.speak(utt(D(w),.85)))};
$('#atest').onclick=()=>{say('Audio check. One, two, three. Can you hear me?');pv()};
const SP=(t,r)=>`<button class="sp" data-say="${esc(t)}"${r?' data-r="'+r+'"':''}>${r?'🐢':'🔊'}</button>`;
/* words */
$('#wl').innerHTML=W.map(w=>`<div class="w">${SP(D(w))}<div><b>${w.e} ${DD(w)}</b><small>${w.ipa}</small><small>${w.ru}</small></div></div>`).join('');
/* problems */
let P={};try{const q=JSON.parse(localStorage.getItem('foodA1_pw')||'{}');Object.keys(q).forEach(k=>{if(/^\d+$/.test(k)&&W[+k]&&+q[k]>0)P[k]=+q[k]})}catch(e){}
function sv(){try{localStorage.setItem('foodA1_pw',JSON.stringify(P))}catch(e){}}
function addProb(i){P[i]=(P[i]||0)+1;sv();renderP()}
function renderP(){const k=Object.keys(P).sort((a,b)=>P[b]-P[a]);$('#pw').innerHTML=k.length?'<table>'+k.map(i=>`<tr><td>${SP(D(W[i]))}</td><td><b>${D(W[i])}</b><br><small>${W[i].ru}</small></td><td>×${P[i]}</td></tr>`).join('')+'</table>':'<small>Пока пусто — ошибки появятся здесь.</small>'}
renderP();
/* exercise engine */
const I=o=>`<div class="it"${o.w!=null?' data-w="'+o.w+'"':''} data-a="${esc(o.a||'')}" data-q="${esc(o.q)}"${o.free?' data-free="1" data-min="'+(o.min||2)+'"':''}${o.need?' data-need="'+esc(o.need)+'"':''}>${o.body}<span class="ans" hidden>${o.ans||''}</span></div>`;
const val=it=>it.dataset.v!==undefined?it.dataset.v:((it.querySelector('input')||{}).value||'');
const TT={1:'Picture → word',2:'Listen and write',3:'Fill the gaps',4:'Find the extra word',5:'Finish the sentences',6:'Write your own sentence',7:'3 words I’m least sure about'};
const IN={1:'Посмотрите на картинку и напишите слово по-английски.',2:'Нажмите 🔊 (🐢 — медленно) и напишите слово, которое услышали.',3:'Вставьте слова из рамки в предложения по смыслу.',4:'Find the extra word — найдите лишнее слово в каждой группе.',5:'Закончите предложения со своими идеями.',6:'Напишите своё предложение с каждым словом.',7:'Выберите 3 слова, в которых вы уверены меньше всего, и выполните задания на них.'};
const B={};
B[1]=()=>pick(8,w=>w.e).map(w=>I({w:w.i,a:w.en,q:'[picture '+w.e+']',body:`<span class="em">${w.e}</span><input placeholder="word">`,ans:DD(w)+' '+w.ipa+' '+SP(D(w))})).join('');
B[2]=()=>pick(9).map(w=>I({w:w.i,a:w.en,q:'[audio]',body:SP(D(w))+SP(D(w),.5)+'<input placeholder="what do you hear?">',ans:DD(w)+' '+w.ipa+' — '+w.ru})).join('');
B[3]=()=>{const ws=pick(9);return `<div class="bank">${R(ws).map(w=>'<span>'+D(w)+'</span>').join('')}</div>`+ws.map(w=>I({w:w.i,a:w.en,q:w.s,body:'<span>'+w.s.replace('___','<input class="gap">')+'</span>',ans:DD(w)})).join('')};
B[4]=()=>{const used=new Set();return Array.from({length:8},()=>{const cat='vfpc'[Math.random()*4|0];const same=R(W.filter(w=>w.c===cat)).slice(0,3);const odd=R(W.filter(w=>w.c!==cat&&!used.has(w.i)))[0];used.add(odd.i);const o=R([...same,odd]);return I({w:odd.i,a:odd.en,q:'extra: '+o.map(D).join(', '),body:o.map(w=>`<button class="opt" onclick="sel(this)">${D(w)}</button>`).join(''),ans:'← '+DD(odd)+' ('+odd.ru+')'})}).join('')};
const ST=[["My favourite food is","pasta with chicken."],["For breakfast I usually eat","cereal with yoghurt."],["I never eat","onions because I don’t like them."],["At a restaurant I often order","fish and potatoes."],["In my fridge there is","some butter and yoghurt."],["I like to drink","lemonade in summer."],["On my pizza I want","mushrooms and olives."],["My mother cooks","lamb with vegetables."],["A good salad has","lettuce, cucumber and onion."],["I can’t live without","bread and cheese."]];
B[5]=()=>R(ST).slice(0,8).map(s=>I({free:1,q:s[0]+' …',body:`<span class="st"><b>${s[0]}</b></span><input class="wide" placeholder="your idea…">`,ans:'e.g. '+s[0]+' '+s[1]})).join('');
const need=w=>w.en.split('|').map(x=>x.slice(0,Math.max(3,x.length-2))).join('|');
const model=w=>w.s.replace('___',D(w));
B[6]=()=>pick(8).map(w=>I({w:w.i,free:1,min:3,need:need(w),q:'word: '+D(w),body:`<span class="st"><b>${DD(w)}</b> ${SP(D(w))}</span><input class="wide" placeholder="Write a sentence with this word">`,ans:'e.g. '+model(w)})).join('');
B[7]=()=>`<div class="bank">${W.map(w=>`<button class="chip" data-i="${w.i}" onclick="t7(this)">${D(w)}</button>`).join('')}</div><button class="g" onclick="mk7()">Создать задания ➜</button><div id="t7"></div>`;
function sel(b){const it=b.closest('.it');it.dataset.v=b.textContent;it.querySelectorAll('.opt').forEach(x=>x.classList.toggle('on',x===b))}
function t7(b){b.classList.toggle('on');if($$('#ex7 .chip.on').length>3)b.classList.remove('on')}
function mk7(){const s=$$('#ex7 .chip.on').map(b=>W[+b.dataset.i]);if(s.length<3)return alert('Выберите ровно 3 слова');s.forEach(w=>addProb(w.i));
$('#t7').innerHTML=s.map(w=>I({w:w.i,a:w.en,q:'RU→EN: '+w.ru,body:`<span>«${w.ru}» →</span><input>`,ans:DD(w)})+I({w:w.i,a:w.en,q:'[audio]',body:SP(D(w))+SP(D(w),.5)+'<input placeholder="what do you hear?">',ans:DD(w)})+I({w:w.i,free:1,min:3,need:need(w),q:'sentence: '+D(w),body:`<span class="st">Your sentence with <b>${D(w)}</b>:</span><input class="wide">`,ans:'e.g. '+model(w)})).join('')}
function mount(n){$('#ex'+n).innerHTML=`<h2>Exercise ${n}. ${TT[n]}</h2><p class="ins">${IN[n]}</p><div class="items">${B[n]()}</div><div class="bar"><button onclick="chk(${n})">Проверить</button><button class="g" onclick="show(${n})">Показать ответы</button><button class="g" onclick="mount(${n})">Новое задание ↻</button><span class="sc"></span></div>`}
function chk(n){let ok=0,t=0;$$('#ex'+n+' .it').forEach(it=>{t++;const v=val(it).trim();let g;if(it.dataset.free)g=v.split(/\s+/).filter(Boolean).length>=+it.dataset.min&&(!it.dataset.need||it.dataset.need.split('|').some(x=>v.toLowerCase().includes(x)));else g=!!v&&it.dataset.a.split('|').map(norm).includes(norm(v));it.classList.toggle('ok',!!g);it.classList.toggle('bad',!g);if(g)ok++;else if(v&&it.dataset.w!=null)addProb(+it.dataset.w)});$('#ex'+n+' .sc').textContent='✔ '+ok+' / '+t}
function show(n){$$('#ex'+n+' .ans').forEach(a=>a.hidden=false)}
$('#exs').innerHTML=[1,2,3,4,5,6,7].map(n=>`<section class="card" id="ex${n}"></section>`).join('');[1,2,3,4,5,6,7].forEach(mount);
/* quiz */
const L=[100,200,300,500,1000,2000,4000,8000,16000,32000,64000,125000,250000,500000,1000000];let Q,qi,qd,qe;
const CN={v:'vegetable',f:'fruit',p:'meat or fish'};
function qNew(){qi=0;qe=false;Q=R(W).slice(0,15).map((w,k)=>{let t=k%5;if(t===2&&!w.e)t=0;if(t===3&&!CN[w.c])t=4;const ot=R(W.filter(x=>x!==w));let q,c,o;
if(t===0){q=`Как по-английски «${w.ru}»?`;c=D(w);o=ot.slice(0,3).map(D)}
else if(t===1){q=`Что значит «${D(w)}»?`;c=w.ru;o=ot.slice(0,3).map(x=>x.ru)}
else if(t===2){q='What is this? '+w.e;c=D(w);o=ot.slice(0,3).map(D)}
else if(t===3){q='Which one is a '+CN[w.c]+'?';c=D(w);o=ot.filter(x=>x.c!==w.c).slice(0,3).map(D)}
else{q=w.s;c=D(w);o=ot.filter(x=>x.c!==w.c).slice(0,3).map(D)}
return{q,c,o:R([c,...o]),w:w.i}});qd=0;qr()}
function qr(){const el=$('#quiz');if(qe){el.innerHTML=`<h2>💰 Game over</h2><p class="q">Ваш выигрыш: ${qd?L[qd-1].toLocaleString():0} $ ${qd===15?'🏆 MILLIONAIRE!':''}</p><button onclick="qNew()">Играть снова</button>`;return}
const x=Q[qi];el.innerHTML=`<h2>💰 Who Wants to Be a Millionaire?</h2><p class="ins">15 вопросов. Ошибка — игра окончена.</p><div class="qg"><div><div class="q">${qi+1}. ${x.q}</div><div class="qo">${x.o.map((o,j)=>`<button class="g" data-o="${esc(o)}" onclick="qa(this)">${'ABCD'[j]}. ${o}</button>`).join('')}</div><div class="bar"><button class="g" id="f5" onclick="f50()">50:50</button></div></div><ol class="lad" reversed>${L.map((v,k)=>`<li class="${k===qi?'cur':''}">${k+1}. ${v.toLocaleString()} $</li>`).reverse().join('')}</ol></div>`}
function f50(){const x=Q[qi];const w=$$('#quiz .qo button').filter(b=>b.dataset.o!==x.c);R(w).slice(0,2).forEach(b=>b.style.visibility='hidden');$('#f5').disabled=true}
function qa(b){const x=Q[qi];const r=b.dataset.o===x.c;$$('#quiz .qo button').forEach(z=>{z.disabled=true;if(z.dataset.o===x.c)z.classList.add('right')});if(r){qd=qi+1;setTimeout(()=>{qi++;if(qi>=15)qe=true;qr()},900)}else{b.classList.add('wrong');addProb(x.w);setTimeout(()=>{qe=true;qr()},1500)}}
qNew();
/* word search */
let G,PL,FD,F1,WSS=0;
function wsNew(){const N=10;G=Array.from({length:N},()=>Array(N).fill(''));PL=[];FD=new Set();F1=null;
R(W.filter(w=>/^[a-z]{4,8}$/.test(D(w)))).slice(0,8).forEach(w=>{const s=D(w).toUpperCase();for(let t=0;t<300;t++){const[dr,dc]=[[0,1],[1,0],[1,1]][Math.random()*3|0],r=Math.random()*N|0,c=Math.random()*N|0;if(r+dr*(s.length-1)>=N||c+dc*(s.length-1)>=N)continue;let ok=1;for(let k=0;k<s.length;k++){const x=G[r+dr*k][c+dc*k];if(x&&x!==s[k])ok=0}if(!ok)continue;for(let k=0;k<s.length;k++)G[r+dr*k][c+dc*k]=s[k];PL.push({w,s,r,c,dr,dc});break}});
G.forEach(r=>r.forEach((x,j)=>{if(!x)r[j]='ABCDEFGHIJKLMNOPRSTUVW'[Math.random()*22|0]}));wsr(false)}
function wsr(rev){$('#wsr').innerHTML=`<h2>🔎 Word Search</h2><p class="ins">Найдите английские слова (→ ↓ ↘). Нажмите первую и последнюю букву слова.</p><div class="wl">${PL.map(p=>`<span class="${FD.has(p.s)||rev?'d':''}">${p.w.ru} (${p.s.length})${FD.has(p.s)||rev?' = '+p.s.toLowerCase():''}</span>`).join('')}</div><div class="grid">${G.map((r,i)=>r.map((x,j)=>`<button class="cell" data-r="${i}" data-c="${j}">${x}</button>`).join('')).join('')}</div><div class="bar"><b class="sc">${FD.size} / ${PL.length}</b><button class="g" onclick="wsr(true);hl(true)">Показать ответы</button><button class="g" onclick="wsNew()">Новая сетка ↻</button></div>`;FD.forEach(s=>hl(false,s));$$('#wsr .cell').forEach(b=>b.onclick=()=>wc(b))}
function cells(p){return Array.from({length:p.s.length},(_,k)=>$(`#wsr .cell[data-r="${p.r+p.dr*k}"][data-c="${p.c+p.dc*k}"]`))}
function hl(all,s){PL.filter(p=>all||p.s===s).forEach(p=>cells(p).forEach(c=>c.classList.add('f')))}
function wc(b){const r=+b.dataset.r,c=+b.dataset.c;if(!F1){F1=[r,c];b.classList.add('s');return}
const[r1,c1]=F1;F1=null;$$('#wsr .cell.s').forEach(x=>x.classList.remove('s'));const a=r-r1,d=c-c1;if(!(a===0||d===0||Math.abs(a)===Math.abs(d)))return;const n=Math.max(Math.abs(a),Math.abs(d))+1,sr=Math.sign(a),sc=Math.sign(d);let t='';for(let k=0;k<n;k++)t+=G[r1+sr*k][c1+sc*k];const p=PL.find(p=>p.s===t||p.s===[...t].reverse().join(''));if(p){FD.add(p.s);wsr(false)}}
wsNew();
/* copy all */
$('#cp').onclick=async()=>{let o=`Name: ${$('#nm').value||'—'} | Level: A1 | Topic: Food & Drink | ${new Date().toLocaleDateString()}\n`;
for(let n=1;n<=7;n++){const its=$$('#ex'+n+' .it');if(!its.length)continue;o+=`\nExercise ${n}: ${TT[n]}\n`;its.forEach((it,k)=>{o+=`${k+1}) ${it.dataset.q} → ${val(it).trim()||'—'}${it.classList.contains('ok')?' ✔':it.classList.contains('bad')?' ✘':''}\n`})}
o+=`\nQuiz: ${qd?L[qd-1]:0} $ (${qd}/15)\nWord search: ${FD.size}/${PL.length} found\n`;const k=Object.keys(P).sort((a,b)=>P[b]-P[a]);o+='\nProblem words: '+(k.length?k.map(i=>D(W[i])+' ×'+P[i]).join(', '):'—')+'\n';
const t=$('#out');t.value=o;t.select();let ok=false;try{await navigator.clipboard.writeText(o);ok=true}catch(e){try{ok=document.execCommand('copy')}catch(e2){}}
$('#cpm').textContent=ok?'Скопировано ✔':'Выделите текст ниже и скопируйте (Ctrl/Cmd+C)'};
</script></body></html>
