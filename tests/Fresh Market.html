/* ---------- helpers ---------- */
var $=function(s,r){return (r||document).querySelector(s);};
function h(tag,attrs){
  var e=document.createElement(tag);
  if(attrs)for(var k in attrs){var v=attrs[k];if(v==null||v===false)continue;
    if(k==='class')e.className=v;else if(k==='html')e.innerHTML=v;
    else if(k.indexOf('on')===0)e.addEventListener(k.slice(2),v);else e.setAttribute(k,v===true?'':v);}
  for(var i=2;i<arguments.length;i++){var kids=[].concat(arguments[i]);
    for(var j=0;j<kids.length;j++){var c=kids[j];if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(c));}}
  return e;
}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function norm(s){return String(s||'').toLowerCase().replace(/[’`]/g,"'").replace(/[^a-z' ]/g,' ').replace(/\s+/g,' ').trim().replace(/^(a|an|the) /,'').replace(/s$/,'');}
function lev(a,b){var m=[],i,j;for(i=0;i<=a.length;i++){m[i]=[i];}for(j=1;j<=b.length;j++)m[0][j]=j;
  for(i=1;i<=a.length;i++)for(j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return m[a.length][b.length];}
var toastT;
function toast(msg){var t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('on');},2400);}

/* ---------- state ---------- */
var S={problems:{},score:{},log:{},know:{}};
var usage={};WORDS.forEach(function(w){usage[w.id]=0;});
function pick(n,filter){
  var pool=shuffle(WORDS.filter(filter||function(){return true;})).sort(function(a,b){return usage[a.id]-usage[b.id];});
  var r=pool.slice(0,n);r.forEach(function(w){usage[w.id]++;});return shuffle(r);
}
function byId(id){return WORDS.filter(function(w){return w.id===id;})[0];}
function miss(w){S.problems[w.id]=(S.problems[w.id]||0)+1;renderProbs();}

/* ---------- audio ---------- */
var voice=null,queue=null,hasTTS=('speechSynthesis' in window)&&typeof SpeechSynthesisUtterance!=='undefined';
function pickVoice(){
  if(!hasTTS){$('#voiceName').textContent='Голос: озвучка недоступна в этом браузере';return;}
  var vs=speechSynthesis.getVoices()||[];
  var en=vs.filter(function(v){return /^en/i.test(v.lang);});
  voice=vs.filter(function(v){return /Google US English/i.test(v.name);})[0]
    ||vs.filter(function(v){return /Samantha/i.test(v.name);})[0]
    ||en.filter(function(v){return /en[-_]US/i.test(v.lang);})[0]||en[0]||null;
  var el=$('#voiceName');
  if(!voice)el.textContent='Голос: английский голос не найден, используется системный';
  else if(/Google US English|Samantha/i.test(voice.name))el.textContent='Голос: '+voice.name;
  else el.textContent='Голос: '+voice.name+' (запасной вариант)';
}
function mkUtt(text,rate){
  var u=new SpeechSynthesisUtterance(text);u.lang='en-US';if(voice)u.voice=voice;u.rate=rate||0.9;return u;
}
function stopAll(){if(queue)queue.stop=true;queue=null;markPlaying(null);if(hasTTS)speechSynthesis.cancel();}
function say(text,rate){
  if(!hasTTS){toast('Озвучка недоступна в этом браузере');return;}
  stopAll();setTimeout(function(){speechSynthesis.speak(mkUtt(text,rate));},40);
}
function markPlaying(id){
  document.querySelectorAll('.vcard').forEach(function(c){c.classList.toggle('playing',c.getAttribute('data-id')===id);});
}
function playAll(list){
  if(!hasTTS){toast('Озвучка недоступна в этом браузере');return;}
  stopAll();var i=0,tok={stop:false};queue=tok;
  function next(){
    if(tok.stop||i>=list.length){if(queue===tok){queue=null;markPlaying(null);}return;}
    var w=list[i++];markPlaying(w.id);
    var u=mkUtt(w.say,0.9);u.onend=function(){setTimeout(next,380);};u.onerror=function(){setTimeout(next,0);};
    speechSynthesis.speak(u);
  }
  setTimeout(next,60);
}
function sndBtn(text,slow){
  return h('button',{class:'snd'+(slow?' slow':''),type:'button','aria-label':slow?'Послушать медленно':'Послушать',onclick:function(){say(text,slow?0.55:0.9);}},slow?'🐢':'🔊');
}

/* ---------- task shell ---------- */
var TASKS=[];
function shell(n,key,title,en,desc,build,opt){
  opt=opt||{};
  var sec=h('section',{class:'task',id:'t'+n});
  var body=h('div'),fb=h('div',{class:'feedback',role:'status','aria-live':'polite'}),cur=null;
  function mk(){body.replaceChildren();cur=build();body.append(cur.el);fb.textContent='';fb.className='feedback';}
  function record(r,revealed){
    S.log[key]=r.log;
    if(!revealed){S.score[key]={ok:r.ok,total:r.total};
      fb.textContent=(r.ok===r.total?'🎉 ':'')+'Верно: '+r.ok+' из '+r.total+(r.note?'. '+r.note:'');
      fb.className='feedback '+(r.ok===r.total?'good':'meh');}
    updateProgress();
  }
  sec.append(h('div',{class:'task-head'},h('div',{class:'num'},String(n)),h('div',null,h('div',{class:'en'},en),h('h2',null,title),h('p',null,desc))),body);
  if(!opt.noCheck){
    sec.append(h('div',{class:'foot'},
      h('button',{class:'btn primary',type:'button',onclick:function(){record(cur.check(),false);}},'Проверить'),
      h('button',{class:'btn',type:'button',onclick:function(){var r=cur.show();record({log:r},true);fb.textContent='Ответы показаны. Попробуйте ещё раз с новыми словами.';fb.className='feedback';}},'Посмотреть ответы'),
      h('button',{class:'btn ghost',type:'button',onclick:function(){mk();}},'Заново'),fb));
  }
  mk();
  TASKS.push({n:n,key:key,title:title});
  return {sec:sec,cur:function(){return cur;},rebuild:mk};
}
function runCheck(items){
  var ok=0,log=[];
  items.forEach(function(it){var g=it.get(),r=it.test(g);it.mark(r);if(r)ok++;else miss(it.w);
    log.push({q:it.q,given:g===''?'—':g,correct:it.correct,ok:r});});
  return {ok:ok,total:items.length,log:log};
}
function runShow(items){
  var log=items.map(function(it){var g=it.get();return {q:it.q,given:g===''?'—':g,correct:it.correct,ok:false,revealed:true};});
  items.forEach(function(it){it.reveal();});return log;
}
function updateProgress(){
  var ok=0,total=0;
  TASKS.forEach(function(t){var s=S.score[t.key];var d=$('#d'+t.n);if(!d)return;
    d.className='dot'+(s?(s.ok===s.total?' full':' part'):'');if(s){ok+=s.ok;total+=s.total;}});
  $('#total').textContent='★ '+ok+' / '+total;
}

/* ---------- report ---------- */
function buildReport(){
  var L=['Fresh Market: результаты ученика',new Date().toLocaleString('ru-RU')];
  TASKS.forEach(function(t){
    if(t.key==='t1')return;
    var s=S.score[t.key],lg=S.log[t.key]||[];
    L.push('');L.push(t.n+'. '+t.title+(s?' — '+s.ok+'/'+s.total:(lg.length?'':' — не выполнено')));
    lg.forEach(function(e){L.push('  '+(e.revealed?'•':(e.ok?'✔':'✘'))+' '+e.q+' → '+e.given+((e.ok||!e.correct)?'':'   (правильно: '+e.correct+')')+(e.revealed?'   [показан ответ]':''));});
  });
  var ids=Object.keys(S.problems);
  L.push('');L.push('Проблемные слова: '+(ids.length?ids.map(function(i){return i+' ×'+S.problems[i];}).join(', '):'нет'));
  return L.join('\n');
}

/* ---------- 2. find in the wild ---------- */
var storyIdx=Math.floor(Math.random()*3);
function buildFind(){
  var st=STORIES[storyIdx++%STORIES.length];
  var targets=st.filter(function(c){return c[1];}).map(function(c){return byId(c[1]);});
  var chips=h('ul',{class:'chips'},shuffle(targets).map(function(w){return h('li',{class:'chip'},w.ru);}));
  var els=[];
  var box=h('div',{class:'story',lang:'en'});
  st.forEach(function(c){
    var s=h('span',{class:'chunk',tabindex:'0',role:'button','aria-pressed':'false'},c[0]);
    function tg(){s.classList.toggle('sel');s.setAttribute('aria-pressed',s.classList.contains('sel'));}
    s.addEventListener('click',tg);
    s.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();tg();}});
    els.push({el:s,w:c[1]?byId(c[1]):null,text:c[0].trim()});box.append(s);
  });
  function clear(){els.forEach(function(x){x.el.classList.remove('ok','wrong','miss');});}
  return {
    el:h('div',null,h('p',{class:'legend'},'Найдите в тексте фразы со словами: '),chips,box),
    check:function(){
      clear();var ok=0,log=[],wrong=0;
      els.forEach(function(x){var sel=x.el.classList.contains('sel');
        if(x.w){if(sel){ok++;x.el.classList.add('ok');}else{x.el.classList.add('miss');miss(x.w);}
          log.push({q:x.w.ru,given:sel?'выбрано: '+x.text:'не найдено',correct:x.text,ok:sel});}
        else if(sel){wrong++;x.el.classList.add('wrong');log.push({q:'лишняя фраза',given:x.text,correct:'—',ok:false});}});
      return {ok:ok,total:targets.length,log:log,note:wrong?'Лишних фраз: '+wrong:''};
    },
    show:function(){clear();var log=[];els.forEach(function(x){if(x.w){x.el.classList.add('sel','ok');log.push({q:x.w.ru,given:x.el.classList.contains('sel')?'—':'—',correct:x.text,ok:false,revealed:true});}else x.el.classList.remove('sel');});return log;}
  };
}

/* ---------- 6. missing letters ---------- */
function buildFill(){
  var ws=pick(8);
  var items=ws.map(function(w){
    var s=w.fill,idx=[];
    for(var i=1;i<s.length;i++)if(s[i]!==' ')idx.push(i);
    var n=Math.min(4,idx.length,Math.max(2,Math.round(idx.length*0.4)));
    var blanks=shuffle(idx).slice(0,n),inputs=[];
    var box=h('div',{class:'letters',lang:'en'});
    for(var k=0;k<s.length;k++){
      if(s[k]===' '){box.append(h('span',{class:'lt sp'}));continue;}
      if(blanks.indexOf(k)>-1){
        (function(k){
          var inp=h('input',{class:'li',type:'text',maxlength:'1',autocomplete:'off',autocapitalize:'none',spellcheck:'false','aria-label':'буква '+(k+1)});
          inp._k=k;
          inp.addEventListener('input',function(){inp.value=inp.value.slice(-1);var at=inputs.indexOf(inp);if(inp.value&&inputs[at+1])inputs[at+1].focus();});
          inp.addEventListener('keydown',function(e){var at=inputs.indexOf(inp);if(e.key==='Backspace'&&!inp.value&&inputs[at-1]){inputs[at-1].focus();}});
          inputs.push(inp);box.append(inp);
        })(k);
      }else box.append(h('span',{class:'lt'},s[k]));
    }
    var ans=h('div',{class:'ans',hidden:true});
    var row=h('div',{class:'q'},h('div',{class:'big',style:'font-size:1.8rem;width:44px'},w.emo),h('div',{style:'flex:1 1 220px;min-width:0'},h('div',{class:'legend'},w.ru),box),ans);
    function typed(){var arr=s.split('');inputs.forEach(function(i){arr[i._k]=i.value?i.value.toLowerCase():'_';});return arr.join('');}
    return {w:w,el:row,q:w.ru,correct:s,
      get:function(){return typed();},
      test:function(){var ok=true;inputs.forEach(function(i){var g=i.value.toLowerCase()===s[i._k];i.classList.remove('ok','bad');i.classList.add(g?'ok':'bad');if(!g)ok=false;});return ok;},
      mark:function(ok){row.className='q '+(ok?'ok':'bad');ans.hidden=ok;ans.replaceChildren('Правильно: ',h('b',null,s));},
      reveal:function(){inputs.forEach(function(i){i.value=s[i._k];i.classList.remove('bad');i.classList.add('ok');});row.className='q ok';}};
  });
  return {el:h('div',{class:'qs two'},items.map(function(i){return i.el;})),check:function(){return runCheck(items);},show:function(){return runShow(items);}};
}

    return {w:w,el:row,q:w.disp,correct:CATS[w.cat][0],
      get:function(){return sel?CATS[sel][0]:'';},
      test:function(){return sel===w.cat;},
      mark:function(ok){row.className='q '+(ok?'ok':'bad');btns.forEach(function(x){x.b.classList.remove('good','wrong');if(x.c===w.cat)x.b.classList.add('good');else if(x.c===sel)x.b.classList.add('wrong');});},
      reveal:function(){row.className='q ok';btns.forEach(function(x){x.b.classList.toggle('good',x.c===w.cat);});}};
  });
  return {el:h('div',{class:'qs'},items.map(function(i){return i.el;})),check:function(){return runCheck(items);},show:function(){return runShow(items);}};
}

/* ---------- 9. write as many as you remember ---------- */
function buildRecall(){
  var ta=h('textarea',{class:'inp',id:'recall',placeholder:'Напишите слова по-английски через запятую или с новой строки…',lang:'en',spellcheck:'false',autocapitalize:'none'});
  var out=h('div');
  var count=h('div',{class:'legend'},'Слов в списке: 0 из '+WORDS.length);
  ta.addEventListener('input',function(){count.textContent='Слов написано: '+parse().length+' (всего в списке '+WORDS.length+')';});
  function parse(){return ta.value.split(/[,;\n]+/).map(function(x){return x.trim();}).filter(Boolean);}
  function find(tok){var n=norm(tok);return WORDS.filter(function(w){return w.alts.map(norm).indexOf(n)>-1;})[0]||null;}
  function chipList(found,warn){
    return h('ul',{class:'chips'},WORDS.map(function(w){
      var ok=found.indexOf(w.id)>-1,wn=warn[w.id];
      return h('li',{class:'chip '+(ok?'ok':(wn?'warn':'no'))},(ok?'✔ ':(wn?'≈ ':'')),w.disp,ok?'':h('span',{class:'legend'},' · '+w.ru),wn?h('span',{class:'legend'},' · вы написали: '+wn):'');}));
  }
  return {
    el:h('div',null,ta,count,out),
    check:function(){
      var found=[],warn={},unknown=[];
      parse().forEach(function(t){
        var w=find(t);
        if(w){if(found.indexOf(w.id)<0)found.push(w.id);return;}
        var parts=t.split(/\s+/),hit=false;
        if(parts.length>1)parts.forEach(function(p){var x=find(p);if(x){hit=true;if(found.indexOf(x.id)<0)found.push(x.id);}});
        if(hit)return;
        var best=null,bd=9,n=norm(t);
        WORDS.forEach(function(x){x.alts.forEach(function(a){var d=lev(n,norm(a));if(d<bd){bd=d;best=x;}});});
        if(best&&bd<=2&&found.indexOf(best.id)<0&&n.length>2)warn[best.id]=t;else unknown.push(t);
      });
      Object.keys(warn).forEach(function(id){miss(byId(id));});
      var missing=WORDS.filter(function(w){return found.indexOf(w.id)<0;});
      out.replaceChildren(h('p',{class:'legend'},'✔ вспомнили · ≈ ошибка в написании · серые не вспомнили'),chipList(found,warn),
        unknown.length?h('p',{class:'legend'},'Не из списка: '+unknown.join(', ')):null);
      var log=[{q:'написано слов',given:parse().join(', ')||'—',correct:'—',ok:true}];
      missing.forEach(function(w){log.push({q:w.ru,given:warn[w.id]||'—',correct:w.disp,ok:false});});
      return {ok:found.length,total:WORDS.length,log:log,note:Object.keys(warn).length?'Проверьте написание слов с ≈':''};
    },
    show:function(){out.replaceChildren(chipList(WORDS.map(function(w){return w.id;}),{}));return [{q:'слова из списка',given:parse().join(', ')||'—',correct:WORDS.map(function(w){return w.disp;}).join(', '),ok:false,revealed:true}];}
  };
}

/* ---------- 10. self-assessment ---------- */
function buildKnow(){
  var meter=h('div',{class:'meter'}),legend=h('div',{class:'legend'});
  var LAB=['ещё нет','почти','знаю'];
  function upd(){
    var c=[0,0,0],set=0;WORDS.forEach(function(w){if(S.know[w.id]!=null){c[S.know[w.id]]++;set++;}});
    meter.replaceChildren(h('i',{class:'m2',style:'width:'+(c[2]/WORDS.length*100)+'%'}),h('i',{class:'m1',style:'width:'+(c[1]/WORDS.length*100)+'%'}),h('i',{class:'m0',style:'width:'+(c[0]/WORDS.length*100)+'%'}));
    legend.textContent='Знаю: '+c[2]+' · почти: '+c[1]+' · ещё нет: '+c[0]+' · не отмечено: '+(WORDS.length-set);
    var log=[];WORDS.forEach(function(w){if(S.know[w.id]!=null)log.push({q:w.disp,given:LAB[S.know[w.id]],correct:'—',ok:true});});
    S.log.t10=log;
  }
  var box=h('div',{class:'know'});
  WORDS.forEach(function(w){
    var b=h('button',{class:'kw',type:'button','data-s':'',onclick:function(){var s=S.know[w.id];s=(s==null)?2:(s+2)%3;S.know[w.id]=s;b.setAttribute('data-s',s);b.title=LAB[s];upd();}},w.emo+' '+w.disp);
    box.append(b);
  });
  var ex=h('div',{class:'foot'},h('button',{class:'btn ghost sm',type:'button',onclick:function(){var ids=WORDS.filter(function(w){return S.know[w.id]===0||S.know[w.id]===1;});if(!ids.length){toast('Нет слов со статусом «почти» или «ещё нет»');return;}playAll(ids);}},'▶ Послушать слова, которые ещё учу'));
  upd();
  return {el:h('div',null,h('p',{class:'legend'},'Нажимайте на слово: зелёный = знаю, жёлтый = почти, красный = ещё нет.'),box,meter,legend,ex)};
}
