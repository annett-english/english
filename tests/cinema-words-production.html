<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cinema Words · Production</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4efe6;--card:#fffdf8;--ink:#1c1a17;--mut:#6b655c;--gold:#b8860b;--red:#b3261e;--grn:#1f7a45;--line:#d9d0bf;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0d0c;--card:#1a1816;--ink:#f3ecdd;--mut:#a39b8c;--gold:#f5c542;--red:#ff6b5e;--grn:#5fd18a;--line:#2e2a25;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e0d0c;--card:#1a1816;--ink:#f3ecdd;--mut:#a39b8c;--gold:#f5c542;--red:#ff6b5e;--grn:#5fd18a;--line:#2e2a25;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Manrope,system-ui,sans-serif}
.strip{height:18px;background:repeating-linear-gradient(90deg,var(--ink) 0 14px,transparent 14px 28px) center/100% 8px no-repeat,var(--gold)}
header{padding:18px 16px 8px;max-width:1100px;margin:auto}
h1{font:400 clamp(36px,8vw,60px)/1 'Bebas Neue',Impact,sans-serif;letter-spacing:2px;margin:0}
h1 span{color:var(--gold)}
.sub{color:var(--mut);font-size:14px}
#nav{display:flex;gap:8px;max-width:1100px;margin:8px auto;padding:0 16px}
#nav button{height:36px;padding:0 16px;border-radius:18px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:800 14px Manrope,sans-serif;cursor:pointer}
#nav button.on{background:var(--gold);color:#111;border-color:var(--gold)}
.wrap{display:grid;grid-template-columns:1fr 240px;gap:16px;max-width:1100px;margin:auto;padding:8px 16px 40px}
@media(max-width:800px){.wrap{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
h2{font:400 32px/1.1 'Bebas Neue',Impact,sans-serif;letter-spacing:1px;margin:0 0 4px}
.ins{color:var(--mut);margin:0 0 14px}
.btn{background:var(--gold);color:#111;border:0;border-radius:10px;padding:9px 16px;font-weight:800;cursor:pointer;font-family:inherit;font-size:15px}
.btn.g{background:transparent;color:var(--ink);border:2px solid var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px;align-items:center}
.q{border:2px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.q.ok{border-color:var(--grn)}.q.bad{border-color:var(--red)}
.qt{margin-bottom:8px}
input[type=text],textarea{font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;max-width:520px}
textarea{max-width:none;min-height:130px}
.spk{border:0;background:var(--gold);border-radius:50%;width:30px;height:30px;cursor:pointer;font-size:14px}
.ans{display:none;color:var(--grn);font-weight:700;margin-top:6px}
.ans.v{display:block}
.mut{color:var(--mut)}
.res{font-weight:800;color:var(--gold);margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{border:2px solid var(--line);border-radius:20px;padding:2px 12px;font-size:14px}
.chip.on{border-color:var(--grn);background:color-mix(in srgb,var(--grn) 25%,transparent);font-weight:800}
aside h3{font:400 24px 'Bebas Neue',Impact,sans-serif;margin:0 0 8px;color:var(--red)}
aside .card{position:sticky;top:12px}
.p{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:14px}
.p i{font-style:normal;background:var(--red);color:#fff;border-radius:8px;padding:0 7px;font-size:12px}
</style></head><body>
<div class="strip"></div>
<header><h1>CINEMA <span>WORDS</span> · PRODUCTION</h1>
<div class="sub">Повторение: пишем и говорим сами · <span id="vs"></span> <button class="btn g" style="padding:3px 10px;font-size:13px" onclick="say('Lights, camera, action!')">🔊 тест звука</button></div></header>
<div id="nav"></div>
<div class="wrap"><main class="card"><h2 id="ti"></h2><p class="ins" id="in"></p><div id="box"></div></main>
<aside><div class="card"><h3>Проблемные слова</h3><div id="pw"></div></div></aside></div>
<script>
const W=[["scene","сцена",["scene"]],["on set","на съёмочной площадке",["on set"]],["be shot","сниматься, быть снятым",["be shot","to be shot"]],["epic","эпопея, эпический фильм",["epic"]],["action film","боевик",["action film","action movie"]],["musical","мюзикл",["musical"]],["comedy","комедия",["comedy"]],["animation","анимация, мультфильм",["animation"]],["historical film","исторический фильм",["historical film","historical movie"]],["science fiction film","научно-фантастический фильм",["science fiction film","sci-fi film","sci fi film"]],["rom-com","романтическая комедия",["rom-com","romcom","romantic comedy"]],["thriller","триллер",["thriller"]],["war film","военный фильм",["war film","war movie"]],["western","вестерн",["western"]],["horror film","фильм ужасов",["horror film","horror movie"]],["drama","драма",["drama"]]];
const DEF={"scene":"a part of a film in one place and time","on set":"at the place where a film is being made","be shot":"to be filmed","epic":"a long film about heroes and great events","action film":"a film with fights, chases and explosions","musical":"a film where characters sing and dance","comedy":"a funny film that makes you laugh","animation":"a film made of drawings or computer images","historical film":"a film about events in the past","science fiction film":"a film about the future, space or robots","rom-com":"a funny film about love","thriller":"an exciting film that keeps you nervous until the end","war film":"a film about soldiers and battles","western":"a film about cowboys in the American Wild West","horror film":"a scary film made to frighten people","drama":"a serious film about real-life problems"};
const $=s=>document.querySelector(s);
const sh=a=>{a=[...a];for(let i=a.length;i>1;){let j=Math.random()*i--|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const N=s=>s.toLowerCase().replace(/[’']/g,'').replace(/[^a-zа-я0-9]+/g,' ').replace(/ /g,'');
let V=null,LOG={},P={},tmr=0,cur=0;
function pick(){const v=speechSynthesis.getVoices();V=v.find(x=>/Google US English/i.test(x.name))||v.find(x=>/Samantha/i.test(x.name))||v.find(x=>x.lang=='en-US')||v.find(x=>/^en/.test(x.lang))||null;$('#vs').textContent='Голос: '+(V?V.name:'системный')}
if('speechSynthesis' in window){speechSynthesis.onvoiceschanged=pick;pick()}else $('#vs').textContent='озвучка не поддерживается';
function say(t){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';if(V)u.voice=V;u.rate=.9;speechSynthesis.speak(u)}
function bad(e){P[e]=(P[e]||0)+1;renderP()}
function renderP(){const k=Object.keys(P).sort((a,b)=>P[b]-P[a]);$('#pw').innerHTML=k.length?'':'<span class="mut">Пока пусто — отлично!</span>';k.forEach(e=>{const d=document.createElement('div');d.className='p';d.innerHTML=`<span><b>${e}</b><br><span class="mut">${W.find(x=>x[0]==e)[1]}</span></span><span><i>${P[e]}</i> <button class="spk" style="width:26px;height:26px;font-size:12px">🔊</button></span>`;d.querySelector('button').onclick=()=>say(e);$('#pw').append(d)})}
async function copy(t,b){try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.append(a);a.select();try{document.execCommand('copy')}catch(_){}a.remove()}const o=b.textContent;b.textContent='Скопировано ✓';setTimeout(()=>b.textContent=o,1600)}
function report(){let s='CINEMA WORDS · PRODUCTION\n';for(const k in LOG)s+='\n== '+k+' ==\n'+LOG[k].join('\n')+'\n';const pk=Object.keys(P);if(pk.length)s+='\n== Проблемные слова ==\n'+pk.map(e=>e+' ('+P[e]+')').join(', ');return s}
function bar(box,btns){const r=document.createElement('div');r.className='row';btns.forEach(([t,f,c])=>{const b=document.createElement('button');b.className='btn '+(c||'');b.textContent=t;b.onclick=e=>f(e.target);r.append(b)});box.append(r)}
function typing(box,ex,gen){
 box.innerHTML='';const items=gen(),L=[];
 items.forEach((it,n)=>{const d=document.createElement('div');d.className='q';d.innerHTML=`<div class="qt"><b>${n+1}.</b> ${it.q}</div>`;
  const i=document.createElement('input');i.type='text';i.autocomplete='off';i.spellcheck=false;i.placeholder='пиши здесь…';d.append(i);
  const a=document.createElement('div');a.className='ans';a.innerHTML=`✔ ${it.ans[0]} `;const s=document.createElement('button');s.className='spk';s.textContent='🔊';s.onclick=()=>say(it.ans[0]);a.append(s);d.append(a);
  const h=document.createElement('button');h.className='btn g';h.style.cssText='margin-top:6px;padding:3px 10px;font-size:13px';h.textContent='💡 первая буква';h.onclick=()=>{i.placeholder=it.ans[0][0]+' …  ('+it.ans[0].length+' букв)'};d.append(h);
  L.push({it,i,d,a});box.append(d)});
 const r=document.createElement('div');r.className='res';
 bar(box,[['✓ Проверить',()=>{let k=0;LOG[ex.t]=L.map(({it,i,d},n)=>{const ok=it.ans.some(x=>N(x)==N(i.value));d.classList.remove('ok','bad');d.classList.add(ok?'ok':'bad');if(ok)k++;else bad(it.w);return `${n+1}. ${it.q.replace(/<[^>]+>/g,'')} → ${i.value||'—'} ${ok?'✓':'✗'}`});r.textContent=`Результат: ${k} / ${L.length}`+(k==L.length?' 🎬 Отлично!':'')}],['👁 Показать ответы',()=>L.forEach(x=>x.a.classList.add('v')),'g'],['↻ Заново',()=>typing(box,ex,gen),'g']]);
 box.append(r)}
const E=[
{t:'Вспомни слово',i:'Прочитай русский перевод и напиши слово или выражение по-английски. Без вариантов ответа — только память!',run(b){typing(b,this,()=>sh(W).map(w=>({q:`<b>${w[1]}</b>`,ans:w[2],w:w[0]})))}},
{t:'Definition → word',i:'Прочитай английское определение и напиши, о каком слове речь.',run(b){typing(b,this,()=>sh(W).map(w=>({q:`<i>“${DEF[w[0]]}”</i>`,ans:w[2],w:w[0]})))}},
{t:'Write your mini-review',i:'Напиши 4–6 предложений о фильме, который ты смотрел(а). Постарайся использовать не меньше 6 слов из списка — они загорятся, когда ты их употребишь.',run(b){
 const T=["Describe a film you watched recently.","Describe your perfect weekend movie night.","Describe a film you would never watch again.","Recommend a film to a friend and explain why."];
 const R=[[/\bscenes?\b/,"scene"],[/\bon set\b/,"on set"],[/\b(was|were|is|are|be|been) shot\b/,"be shot"],[/\bepics?\b/,"epic"],[/\baction (film|movie)s?\b/,"action film"],[/\bmusicals?\b/,"musical"],[/\bcomed(y|ies)\b/,"comedy"],[/\banimations?\b/,"animation"],[/\bhistorical (film|movie)s?\b/,"historical film"],[/\b(science fiction|sci fi)( film| movie)?s?\b/,"science fiction film"],[/\brom ?coms?\b/,"rom-com"],[/\bthrillers?\b/,"thriller"],[/\bwar (film|movie)s?\b/,"war film"],[/\bwesterns?\b/,"western"],[/\bhorror (film|movie)s?\b/,"horror film"],[/\bdramas?\b/,"drama"]];
 b.innerHTML=`<p><b id="tp"></b></p><textarea id="tx" placeholder="Write here… (e.g. Last weekend I watched a thriller. The last scene…)"></textarea><div class="chips" id="ch"></div><div class="res" id="cn"></div>`;
 $('#tp').textContent=T[Math.random()*T.length|0];
 const ch=$('#ch');R.forEach(r=>{const c=document.createElement('span');c.className='chip';c.textContent=r[1];ch.append(c)});
 const upd=()=>{const t=$('#tx').value.toLowerCase().replace(/-/g,' ').replace(/[’']/g,"'");let k=0;const used=[];R.forEach((r,i)=>{const on=r[0].test(t);ch.children[i].classList.toggle('on',on);if(on){k++;used.push(r[1])}});const wc=(t.match(/\S+/g)||[]).length;$('#cn').textContent=`Слов: ${wc} · Использовано выражений: ${k} / 6 ${k>=6?'🎬':''}`;LOG['Mini-review']=[$('#tp').textContent,$('#tx').value||'—','Использованы: '+(used.join(', ')||'—')]};
 $('#tx').oninput=upd;upd();
 bar(b,[['🔊 Прослушать мой текст',()=>say($('#tx').value||'Write something first.'),'g'],['📋 Скопировать текст',e=>{upd();copy(LOG['Mini-review'].join('\n'),e)}],['📋 Скопировать весь отчёт',e=>{upd();copy(report(),e)},'g'],['↻ Другая тема',()=>{$('#tp').textContent=T[Math.random()*T.length|0];upd()},'g']])}}
];
E.forEach((e,i)=>{const b=document.createElement('button');b.textContent=`${i+1}. ${['Recall','Definitions','Mini-review'][i]}`;b.onclick=()=>show(i);$('#nav').append(b)});
function show(i){try{speechSynthesis.cancel()}catch(e){}cur=i;[...$('#nav').children].forEach((b,j)=>b.classList.toggle('on',j==i));const e=E[i];$('#ti').textContent=`${i+1}. ${e.t}`;$('#in').textContent=e.i;e.run($('#box'))}
renderP();show(0);
</script></body></html>
