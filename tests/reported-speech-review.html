<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reported Speech B1 — повторение</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1d2233;--mu:#5d647a;--ac:#3b5bdb;--acs:#e7ecff;--ok:#2b8a3e;--oks:#e3f6e8;--bad:#c92a2a;--bads:#fde8e8;--bd:#d9dded;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13151d;--card:#1c1f2b;--tx:#e8eaf3;--mu:#9aa1b8;--ac:#8ea6ff;--acs:#27304f;--ok:#69db7c;--oks:#17301f;--bad:#ff8787;--bads:#3a1c1c;--bd:#323750;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#13151d;--card:#1c1f2b;--tx:#e8eaf3;--mu:#9aa1b8;--ac:#8ea6ff;--acs:#27304f;--ok:#69db7c;--oks:#17301f;--bad:#ff8787;--bads:#3a1c1c;--bd:#323750;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:8px 0 2px}.sub{color:var(--mu);margin:0 0 14px}
#tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}#tabs button{white-space:nowrap}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:7px 12px;border-radius:10px;cursor:pointer}
button.pri,#tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button.pri,:root:not([data-theme="light"]) #tabs button.on{color:#11131a}}
.panel{display:none;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-top:8px}.panel.on{display:block}
.panel h2{margin:0 0 4px;font-size:1.2rem}.desc{color:var(--mu);margin:0 0 12px}
.it{border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin:8px 0}
.it.ok{background:var(--oks);border-color:var(--ok)}.it.bad{background:var(--bads);border-color:var(--bad)}.it.shown{background:var(--acs);border-color:var(--ac)}
input{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:4px 8px;max-width:100%;box-sizing:border-box}
input.w{width:100%;margin-top:6px}
.fb{font-size:.92rem;color:var(--mu);margin-top:6px}.fb:empty{display:none}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}.sc{font-weight:600}
.opt{display:block;width:100%;text-align:left;margin:5px 0}
.opt.on{background:var(--acs);border-color:var(--ac)}.opt.ok{background:var(--oks);border-color:var(--ok)}.opt.bad{background:var(--bads);border-color:var(--bad)}
</style>
</head>
<body>
<main>
<h1>Reported Speech · повторение</h1>
<p class="sub">4 упражнения по 8 пунктов: смешанный выбор, поиск ошибок, обратный перевод в прямую речь и пересказ.</p>
<div id="tabs"></div><div id="panels"></div>
</main>
<script>
const $=(s,r=document)=>r.querySelector(s);
const norm=s=>s.toLowerCase().replace(/[’‘]/g,"'").replace(/[.!?"“”«»]/g,'').replace(/\s+/g,' ').trim();
const exp=a=>{let r=[];(Array.isArray(a)?a:[a]).forEach(x=>x.includes('(that)')?r.push(x.replace('(that) ',''),x.replace('(that)','that')):r.push(x));return r.map(norm)};
const first=a=>Array.isArray(a)?a[0]:a;
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
function bar(p,chk,show,rst){const b=el('div','bar','<button class="pri">Проверить</button><button>Показать ответы</button><button>Сначала</button><span class="sc"></span>');const[a,s,r]=b.querySelectorAll('button'),sc=$('.sc',b);a.onclick=()=>sc.textContent=chk();s.onclick=()=>{show();sc.textContent=''};r.onclick=()=>{rst();sc.textContent=''};p.append(b)}

const EX=[
{t:'1. Mixed choice',d:'Выберите верный вариант: времена, said/told, слова-указатели.',k:'mc',items:[
{q:'«I’ve lost my keys.» → He said …',o:['he lost his keys','he had lost his keys','he has lost his keys'],c:1,e:'Present Perfect → Past Perfect; my → his.'},
{q:'«I’ll come tomorrow.» → She said she would come …',o:['tomorrow','the next day','yesterday'],c:1,e:'tomorrow → the next day / the following day.'},
{q:'She ___ us she was happy.',o:['said','told','say'],c:1,e:'told + person (us). Без person нужен said.'},
{q:'«I may be late.» → He said he ___ be late.',o:['may','might','would'],c:1,e:'may → might.'},
{q:'«I’ve just spoken to Adam. He said he ___ come tonight.»',o:['can’t','couldn’t','оба варианта возможны'],c:2,e:'Слова переданы сразу после разговора, поэтому время может остаться прежним; could, might, should обычно не меняются.'},
{q:'«I had finished.» → He said he …',o:['had finished','has finished','finished'],c:0,e:'Past Perfect не меняется.'},
{q:'«I like these shoes.» → She said she liked ___ shoes.',o:['these','those','the'],c:1,e:'these → those (this → that).'},
{q:'«I saw him two days ago.» → He said he had seen him two days ___.',o:['ago','before','later'],c:1,e:'ago → before.'}]},
{t:'2. Find and fix',d:'В каждом предложении ошибка. Перепишите предложение правильно.',k:'in',items:[
{q:'He told that he was hungry.',a:['He said (that) he was hungry.','He told me (that) he was hungry.'],e:'told нужен person (told me); без него говорим said.'},
{q:'Tom said he will come tomorrow.',a:['Tom said (that) he would come the next day.','Tom said (that) he would come the following day.'],e:'will → would; tomorrow → the next day.'},
{q:'She said she has finished her homework.',a:'She said (that) she had finished her homework.',e:'Present Perfect → Past Perfect.'},
{q:'He said me that he was busy.',a:'He told me (that) he was busy.',e:'После person нужен told, а не said.'},
{q:'They said they were leaving next week.',a:['They said (that) they were leaving the following week.','They said (that) they were leaving the week after.'],e:'next week → the following week.'},
{q:'Anna said she must leave.',a:'Anna said (that) she had to leave.',e:'must → had to.'},
{q:'He said he can swim here.',a:'He said (that) he could swim there.',e:'can → could; here → there.'},
{q:'I told her I called her the day before.',a:'I told her (that) I had called her the day before.',e:'Past Simple → Past Perfect (had called).'}]},
{t:'3. Back to direct speech',d:'Восстановите прямую речь из косвенной.',k:'in',items:[
{q:'She said she was tired. → «___»',a:['I’m tired.','I am tired.'],e:'was → am/is: Past Simple → Present Simple.'},
{q:'He told me he would call me the next day. → «___»',a:['I’ll call you tomorrow.','I will call you tomorrow.'],e:'would → will; me → you; the next day → tomorrow.'},
{q:'They said they had finished. → «___»',a:['We’ve finished.','We have finished.','We finished.'],e:'Past Perfect ← Present Perfect или Past Simple.'},
{q:'She said she couldn’t come that night. → «___»',a:['I can’t come tonight.','I cannot come tonight.'],e:'couldn’t → can’t; that night → tonight.'},
{q:'Tom said he was working there then. → «___»',a:['I’m working here now.','I am working here now.'],e:'was working → am working; there → here; then → now.'},
{q:'Anna said she had to leave. → «___»',a:['I must leave.','I have to leave.'],e:'had to → must (или have to).'},
{q:'He said he had seen her the day before. → «___»',a:'I saw her yesterday.',e:'had seen → saw; the day before → yesterday.'},
{q:'Mum said she liked that song. → «___»',a:'I like this song.',e:'liked → like; that → this.'}]},
{t:'4. Rephrase mix',d:'Перепишите в косвенную речь. (that) можно писать или опускать.',k:'in',items:[
{q:'Mia: «I’m learning Polish.»',a:'Mia said (that) she was learning Polish.',e:'Present Continuous → was learning.'},
{q:'Tom (told me): «I’ll send you an email tonight.»',a:'Tom told me (that) he would send me an email that night.',e:'told me; will → would; you → me; tonight → that night.'},
{q:'The kids (told us): «We’ve cleaned our room.»',a:'The kids told us (that) they had cleaned their room.',e:'Present Perfect → Past Perfect; we/our → they/their.'},
{q:'Ola (told him): «I can’t help you today.»',a:'Ola told him (that) she couldn’t help him that day.',e:'can’t → couldn’t; you → him; today → that day.'},
{q:'Paul: «I must call my mum now.»',a:'Paul said (that) he had to call his mum then.',e:'must → had to; now → then.'},
{q:'Eva (told me): «I visited Berlin last year.»',a:['Eva told me (that) she had visited Berlin the year before.','Eva told me (that) she had visited Berlin the previous year.'],e:'Past Simple → Past Perfect; last year → the year before.'},
{q:'Dan: «I may come here tomorrow.»',a:['Dan said (that) he might come there the next day.','Dan said (that) he might come there the following day.'],e:'may → might; here → there; tomorrow → the next day.'},
{q:'They: «We’re buying this house next month.»',a:['They said (that) they were buying that house the following month.','They said (that) they were buying that house the month after.'],e:'are buying → were buying; this → that; next month → the following month.'}]}];

const P=$('#panels'),T=$('#tabs');
EX.forEach((x,n)=>{
 const tb=el('button','',x.t.split(' ')[0]+' '+x.t.split(' ').slice(1,2));tb.title=x.t;
 const p=el('div','panel',`<h2>${x.t}</h2><p class="desc">${x.d}</p>`);
 tb.onclick=()=>{document.querySelectorAll('#tabs button,.panel').forEach(b=>b.classList.remove('on'));tb.classList.add('on');p.classList.add('on')};
 T.append(tb);P.append(p);if(!n)tb.onclick();
 (x.k=='mc'?mc:inp)(p,x)});

function mc(p,x){
 const sel=[],cards=x.items.map((it,i)=>{const d=el('div','it',`<div><b>${i+1}.</b> ${it.q}</div>`);
  it.o.forEach((o,j)=>{const b=el('button','opt',o);b.onclick=()=>{sel[i]=j;[...d.querySelectorAll('.opt')].forEach((q,k)=>q.className='opt'+(k==j?' on':''))};d.append(b)});
  d.append(el('div','fb'));p.append(d);return d});
 const mark=(i,j,ok)=>{const d=cards[i];d.querySelectorAll('.opt').forEach((q,k)=>{q.className='opt'+(k==x.items[i].c?' ok':k==j?' bad':'')});$('.fb',d).innerHTML=(ok?'✓ ':'✗ ')+x.items[i].e};
 bar(p,()=>{let n=0;x.items.forEach((it,i)=>{const ok=sel[i]==it.c;n+=ok;mark(i,sel[i],ok)});return `Верно: ${n}/8`},
 ()=>x.items.forEach((it,i)=>mark(i,-1,true)),
 ()=>{sel.length=0;cards.forEach(d=>{d.querySelectorAll('.opt').forEach(q=>q.className='opt');$('.fb',d).innerHTML=''})})}

function inp(p,x){
 const cards=x.items.map((it,i)=>{const pt=it.q.split('___');
  const d=el('div','it',`<div><b>${i+1}.</b> ${pt[0]}${pt.length>1?'<input size="16">'+pt[1]:''}</div>${pt.length>1?'':'<input class="w">'}<div class="fb"></div>`);p.append(d);return d});
 bar(p,()=>{let n=0;x.items.forEach((it,i)=>{const d=cards[i],ok=exp(it.a).includes(norm($('input',d).value));n+=ok;d.className='it '+(ok?'ok':'bad');
   $('.fb',d).innerHTML=(ok?'✓ ':'✗ Правильно: <b>'+first(it.a)+'</b>. ')+it.e});return `Верно: ${n}/8`},
 ()=>x.items.forEach((it,i)=>{const d=cards[i];$('input',d).value=first(it.a).replace('(that) ','');d.className='it shown';$('.fb',d).innerHTML='<b>'+first(it.a)+'</b>. '+it.e}),
 ()=>cards.forEach(d=>{$('input',d).value='';d.className='it';$('.fb',d).innerHTML=''}))}
</script>
</body>
</html>
