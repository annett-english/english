<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Used to · Would · Past Simple — Review</title>
<style>
:root{--bg:#f6f4ef;--fg:#1e2430;--mut:#5d6573;--card:#fff;--bd:#dcd8cc;--ac:#2c5aa0;--acbg:#e6eefa;--ok:#1d7a46;--okbg:#e2f4e9;--bad:#b3261e;--badbg:#fbe6e4;--warn:#9a6700;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#14171d;--fg:#e8eaf0;--mut:#a0a8b6;--card:#1d222b;--bd:#323a47;--ac:#7fa8e6;--acbg:#22304a;--ok:#6fd49a;--okbg:#173425;--bad:#ff8f87;--badbg:#3b1f1e;--warn:#f0c04a;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:820px;margin:0 auto;padding:20px 14px 60px}h1{font-size:1.6rem;margin:.2em 0}h2{font-size:1.15rem;margin:0 0 4px;display:flex;gap:10px;align-items:center}
.sub,.ins{color:var(--mut)}.sub{margin:0 0 16px}.ins{margin:2px 0 12px;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:16px 0}
.n{background:var(--ac);color:var(--bg);border-radius:50%;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;font-size:.9rem;flex:none}
.it{padding:8px 10px;border-radius:10px;margin:6px 0;border:1px solid transparent}.it.ok{background:var(--okbg);border-color:var(--ok)}.it.bad{background:var(--badbg);border-color:var(--bad)}.it p{margin:0 0 4px}
.op{display:inline-block;margin:2px 12px 2px 0;cursor:pointer}
.why{display:none;font-size:.9rem;margin-top:4px;color:var(--mut)}.why.on{display:block}
input[type=text]{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:4px 8px;width:100%;box-sizing:border-box;margin-top:4px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:9px;padding:6px 14px}button.b{background:var(--ac);color:var(--bg);border-color:var(--ac)}button:disabled{opacity:.5;cursor:default}
.sc{font-weight:700;margin-left:auto}.tag{font-size:.8rem;background:var(--acbg);border-radius:6px;padding:1px 7px;margin-left:6px}
.mil{display:grid;grid-template-columns:1fr 130px;gap:14px}@media(max-width:600px){.mil{grid-template-columns:1fr}}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}@media(max-width:600px){.ans{grid-template-columns:1fr}}
.ans button{text-align:left;padding:10px}.ans button.ok{background:var(--okbg);border-color:var(--ok)}.ans button.bad{background:var(--badbg);border-color:var(--bad)}.ans button.hid{visibility:hidden}
.lad{list-style:none;margin:0;padding:0;font-size:.85rem;display:flex;flex-direction:column-reverse}.lad li{padding:2px 8px;border-radius:6px;color:var(--mut)}.lad li.done{color:var(--ok)}.lad li.cur{background:var(--acbg);color:var(--fg);font-weight:700}
.q{font-size:1.05rem;font-weight:600}
</style></head><body><main>
<h1>Review: used to · would · Past Simple</h1>
<p class="sub">Повторение · B1+ · 3 упражнения · после проверки — объяснения</p>
<div id="ex"></div></main>
<script>
const $=(s,e=document)=>e.querySelector(s),$$=(s,e=document)=>[...e.querySelectorAll(s)];
const norm=s=>s.toLowerCase().replace(/[’‘]/g,"'").replace(/[.!?]+$/,'').replace(/\s+/g,' ').trim();
function mk(n,title,ins,body,init,bar=1){const s=document.createElement('section');s.className='card';s.innerHTML=`<h2><span class="n">${n}</span>${title}</h2><p class="ins">${ins}</p>${body}${bar?'<div class="bar"><button class="b" data-a="check">Проверить</button><button data-a="show">Показать ответы</button><button data-a="reset">Сбросить</button><span class="sc"></span></div>':''}`;$('#ex').append(s);const f=init(s);$$('.bar button',s).forEach(b=>b.onclick=()=>f[b.dataset.a]())}
const sc=(s,t)=>$('.sc',s).textContent=t;
const why=(it,ok,t)=>{const w=$('.why',it);w.classList.add('on');w.innerHTML=(ok?'✓ ':'✗ ')+t};

/* 1 choose */
const C=[
["When I was little, I ___ afraid of the dark.",["would be","used to be","was being"],1,"Состояние в прошлом → <b>used to be</b>. Would не сочетается с глаголами состояния."],
["Every Sunday we ___ around Grandma’s table.",["would gather","have gathered","were gathering"],0,"Повторяющееся действие → <b>would gather</b> (gather around)."],
["Last winter I ___ my hand at knitting.",["used to try","tried","would try"],1,"<i>Last winter</i> — конкретное время → <b>Past Simple</b>."],
["___ a movie marathon every Christmas?",["Did you use to have","Did you used to have","Were you use to have"],0,"В вопросе после <b>did</b> — <b>use to</b> без -d."],
["I ___ believe in magic, but now I don’t.",["would","used to","was"],1,"Believe — состояние, которого больше нет → <b>used to believe</b>."],
["In the evenings, Dad ___ up a comforting homemade meal for us.",["would whip","was whipping","has whipped"],0,"Привычное повторяющееся действие → <b>would whip up</b>."],
["We ___ to Spain in 2019.",["used to go","would go","went"],2,"Конкретный год → <b>Past Simple</b> (went)."],
["She ___ nostalgic when she found the old photos.",["used to feel","felt","would feel"],1,"Единичная реакция на конкретное событие → <b>Past Simple</b>."]];
mk(1,'Choose the correct form','Выберите правильный вариант.',C.map((c,i)=>`<div class="it"><p>${i+1}. ${c[0].replace('___','<b>___</b>')}</p>${c[1].map((o,j)=>`<label class="op"><input type="radio" name="c${i}" value="${j}"> ${o}</label>`).join('')}<div class="why"></div></div>`).join(''),s=>{const it=$$('.it',s);return{check(){let k=0;it.forEach((e,i)=>{const v=$('input:checked',e),ok=v&&+v.value==C[i][2];e.className='it '+(ok?'ok':'bad');k+=ok?1:0;why(e,ok,C[i][3])});sc(s,`${k}/${C.length}`)},show(){it.forEach((e,i)=>$$('input',e)[C[i][2]].checked=true);this.check()},reset(){it.forEach(e=>{e.className='it';$$('input',e).forEach(x=>x.checked=false);$('.why',e).classList.remove('on')});sc(s,'')}}});

/* 2 error correction */
const E=[
["I would have a red bike when I was six.",["(used to have|\\bhad) a red bike"],"I used to have a red bike when I was six.","Have здесь — состояние, would невозможен: <b>used to have</b> (или Past Simple <i>had</i>).",["would"]],
["Did you used to hunker down with a book?",["^did you use to hunker down with a book"],"Did you use to hunker down with a book?","После did — <b>use to</b> без -d."],
["We used to go to Kraków last weekend.",["\\bwent to krak"],"We went to Kraków last weekend.","<i>Last weekend</i> — одно конкретное событие → <b>Past Simple</b>.",["used to"]],
["He didn’t used to like winter.",["didn't use to like winter"],"He didn’t use to like winter.","После didn’t — <b>use to</b> без -d."],
["When I was young, I would know all the carols by heart.",["(used to know|\\bknew)"],"When I was young, I used to know all the carols by heart.","Know — глагол состояния, would нельзя → <b>used to know</b> (или knew).",["would"]],
["Mum would bake a cake once, and it was a disaster.",["\\bbaked\\b"],"Mum baked a cake once, and it was a disaster.","<i>Once</i> — единичный случай → <b>Past Simple</b>.",["would","used to"]],
["I use to beat the winter blues with a movie marathon.",["^i used to beat the winter blues"],"I used to beat the winter blues with a movie marathon.","В утверждении нужна форма <b>used to</b> (с -d).",[]]];
mk(2,'Error correction','В каждом предложении есть одна ошибка. Перепишите предложение правильно.',E.map((e,i)=>`<div class="it"><p>${i+1}. <i>${e[0]}</i></p><input type="text" autocomplete="off" autocapitalize="off"><div class="why"></div></div>`).join(''),s=>{const it=$$('.it',s);return{check(){let k=0;it.forEach((e,i)=>{const v=norm($('input',e).value),d=E[i],ok=d[1].every(r=>new RegExp(r,'i').test(v))&&!(d[4]||[]).some(r=>new RegExp('\\b'+r+'\\b','i').test(v));e.className='it '+(ok?'ok':'bad');k+=ok?1:0;why(e,ok,(ok?'':`Правильно: <b>${d[2]}</b><br>`)+d[3])});sc(s,`${k}/${E.length}`)},show(){it.forEach((e,i)=>$('input',e).value=E[i][2]);this.check()},reset(){it.forEach(e=>{e.className='it';$('input',e).value='';$('.why',e).classList.remove('on')});sc(s,'')}}});

/* 3 millionaire */
const Q=[
["I ___ Santa Claus when I was little.",["used to believe","would believe","was believing","have believed"],0,"Believe — состояние в прошлом → used to believe."],
["Which sentence is about ONE single event?",["We would visit Gran every Sunday.","I used to have a pamper session.","I tried baking bread last week.","She would catch up on TV."],2,"Last week — конкретное время → Past Simple."],
["She ___ here as a child, but now she lives abroad.",["would live","used to live","was living","lives"],1,"Состояние, которого нет сейчас → used to live."],
["Negative of “I used to like snow”:",["I didn’t used to like snow","I didn’t use to like snow","I not used to like snow","I wouldn’t used to like snow"],1,"После didn’t — use to без -d."],
["Which verb is NOT natural after “would” for a past habit?",["gather","whip up","believe","curl up"],2,"Believe — состояние, would для состояний не используется."],
["“Evoke memories” — это:",["вызывать воспоминания","стирать из памяти","записывать истории","рассказывать сказки"],0,"Evoke memories = вызывать воспоминания."],
["Every Christmas, we ___ the tree together.",["would decorate","used to be decorated","decorating","have decorate"],0,"Повторяющееся действие → would decorate."],
["Nothing ___ a movie marathon on a cold night.",["beats","beat","is beating","has beaten"],0,"Nothing beats… — устойчивое выражение: ничто не сравнится."],
["Which is correct with a specific time?",["In 2015, we used to move to Kraków.","In 2015, we would move to Kraków.","In 2015, we moved to Kraków.","In 2015, we were using to move."],2,"Конкретный год и одно событие → Past Simple."],
["Did she use to ___ up on her favourite TV series?",["catch","caught","catching","catches"],0,"После did — начальная форма: use to catch up."]];
mk(3,'Who Wants to Be a Millionaire?','10 вопросов. Ошибка — игра заканчивается. Одна подсказка 50:50.',`<div class="mil"><div><div class="q"></div><div class="ans"></div><div class="why"></div><div class="bar"><button id="f">50:50</button><button id="r">Начать заново</button><span class="sc"></span></div></div><ol class="lad"></ol></div>`,s=>{
let i=0,used=false,over=false;const lad=$('.lad',s),qe=$('.q',s),ae=$('.ans',s),w=$('.why',s),f=$('#f',s);
const money=n=>['100','200','300','500','1 000','2 000','4 000','8 000','16 000','32 000'][n]+' pts';
function draw(){lad.innerHTML=Q.map((_,k)=>`<li class="${k<i?'done':k==i&&!over?'cur':''}">${k+1}. ${money(k)}</li>`).join('');if(i>=Q.length){qe.textContent='🎉 Вы выиграли миллион! 10/10';ae.innerHTML='';sc(s,'10/10');return}
const q=Q[i];qe.textContent=`${i+1}. ${q[0]}`;w.className='why';ae.innerHTML=q[1].map((o,j)=>`<button data-j="${j}">${'ABCD'[j]}. ${o}</button>`).join('');$$('button',ae).forEach(b=>b.onclick=()=>pick(+b.dataset.j));sc(s,`Уровень ${i+1}/10`)}
function pick(j){if(over)return;const q=Q[i],bs=$$('button',ae);if(j==q[2]){bs[j].classList.add('ok');w.className='why on';w.innerHTML='✓ '+q[3];i++;over=true;setTimeout(()=>{over=false;draw()},1300)}else{over=true;bs[j].classList.add('bad');bs[q[2]].classList.add('ok');w.className='why on';w.innerHTML=`✗ Правильный ответ: <b>${'ABCD'[q[2]]}</b>. ${q[3]}<br>Игра окончена: ${i}/10.`;sc(s,`${i}/10`);$$('.lad li',s).forEach((l,k)=>l.className=k<i?'done':'')}}
f.onclick=()=>{if(used||over)return;used=true;f.disabled=true;const q=Q[i];[...Array(4).keys()].filter(k=>k!=q[2]).sort(()=>Math.random()-.5).slice(0,2).forEach(k=>$$('button',ae)[k].classList.add('hid'))};
$('#r',s).onclick=()=>{i=0;used=false;over=false;f.disabled=false;draw()};draw();return{}},0);
</script></body></html>
