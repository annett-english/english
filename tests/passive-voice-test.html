<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><title>Passive Voice: вопросы, перевод и итоговый тест</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1d2433;--mu:#667085;--bd:#dfe3ec;--ac:#4f46e5;--act:#fff;--ok:#16794c;--okb:#e6f6ee;--bad:#b42318;--badb:#fdecea;--sel:#eef0ff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141c;--card:#1b1e29;--tx:#e8eaf2;--mu:#9aa3b8;--bd:#2d3243;--ac:#8b86ff;--act:#12141c;--ok:#5fd3a0;--okb:#14301f;--bad:#ff8a80;--badb:#3a1a1a;--sel:#262a40;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12141c;--card:#1b1e29;--tx:#e8eaf2;--mu:#9aa3b8;--bd:#2d3243;--ac:#8b86ff;--act:#12141c;--ok:#5fd3a0;--okb:#14301f;--bad:#ff8a80;--badb:#3a1a1a;--sel:#262a40;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:820px;margin:0 auto;padding:16px}h1{font-size:1.6rem;margin:8px 0}h2{font-size:1.15rem;margin:0 0 4px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:16px 0}
.task,.mu{color:var(--mu);margin:0 0 12px;font-size:.93rem}
.it{border-top:1px solid var(--bd);padding:10px 8px;border-radius:8px}.it:first-of-type{border-top:0}
.it p{margin:0 0 6px}.it.ok{background:var(--okb)}.it.bad{background:var(--badb)}
.fb{font-size:.9rem;margin-top:6px}.ok .fb{color:var(--ok)}.bad .fb{color:var(--bad)}
.opts label{display:flex;gap:8px;padding:5px 0;cursor:pointer}
input[type=text]{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:6px 8px;width:100%}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:7px 12px}
button.pri{background:var(--ac);color:var(--act);border-color:var(--ac)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}.sc{font-weight:600;margin-left:auto}
.cue{display:inline-block;padding:2px 8px;border-radius:99px;font-size:.85rem;background:var(--sel)}
#tot{position:sticky;top:env(safe-area-inset-top,0px);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:6px 12px;z-index:5;font-weight:600}
.grade{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--sel);font-weight:600}
</style></head><body><main>
<h1>Passive Voice: вопросы, перевод, итоговый тест</h1>
<p class="mu">Упражнение 1 — вопросы и отрицания, 2 — перевод с русского, 3 — итоговый тест с оценкой.</p>
<div id="tot"></div><div id="ex"></div>
</main>
<script>
const $=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const norm=s=>s.toLowerCase().replace(/[’']/g,"'").replace(/[.!?,;]/g,"").replace(/\s+/g," ").trim();
const mark=(it,ok,m)=>{it.classList.remove("ok","bad");if(ok!==null)it.classList.add(ok?"ok":"bad");const f=it.querySelector(".fb");if(f)f.innerHTML=m||""};
const B={};
B.mcq=(ex,box)=>{
 const its=ex.items.map((d,i)=>{const it=$("div","it",`<p><b>${i+1}.</b> ${d.q}</p><div class="opts">${d.o.map((o,j)=>`<label><input type="radio" name="${ex.id}${i}" value="${j}"> <span>${o}</span></label>`).join("")}</div><div class="fb"></div>`);box.append(it);return it});
 const v=i=>{const r=its[i].querySelector("input:checked");return r?+r.value:-1};
 return{check:()=>{let n=0;ex.items.forEach((d,i)=>{const ok=v(i)==d.a;n+=ok;mark(its[i],v(i)<0?null:ok,v(i)<0?"":ok?"✔ "+d.e:"✖ Не верно. Проверьте, кто выполняет действие и в каком оно времени.")});return n},
 show:()=>ex.items.forEach((d,i)=>{its[i].querySelectorAll("input")[d.a].checked=true;mark(its[i],true,"✔ "+d.e)}),
 reset:()=>its.forEach(it=>{it.querySelectorAll("input").forEach(r=>r.checked=false);mark(it,null)})}};
B.text=(ex,box)=>{
 const its=ex.items.map((d,i)=>{const it=$("div","it",`<p><b>${i+1}.</b> ${d.q}</p><input type="text" autocomplete="off" autocapitalize="off" spellcheck="false"><div class="fb"></div>`);box.append(it);return it});
 const f=i=>its[i].querySelector("input");
 return{check:()=>{let n=0;ex.items.forEach((d,i)=>{const val=f(i).value;if(!val.trim())return mark(its[i],null);const ok=d.a.some(a=>norm(a)==norm(val));n+=ok;mark(its[i],ok,ok?"✔ "+d.e:"✖ Не совсем. Проверьте порядок слов, форму be и V3.")});return n},
 show:()=>ex.items.forEach((d,i)=>{f(i).value=d.a[0];mark(its[i],true,`✔ <b>${d.a[0]}</b><br>${d.e}`)}),
 reset:()=>its.forEach((it,i)=>{f(i).value="";mark(it,null)})}};
const EX=[
{t:"1. Questions & negatives",task:"Преобразуйте пассивное предложение в вопрос или отрицание (можно использовать сокращения).",type:"text",items:[
{q:"The letter was sent yesterday. → <span class=cue>question</span>",a:["Was the letter sent yesterday?"],e:"В вопросе be выходит на первое место: Was + подлежащее + V3."},
{q:"Cars are made here. → <span class=cue>negative</span>",a:["Cars are not made here.","Cars aren't made here."],e:"Отрицание ставится после be: are not made."},
{q:"The road is being repaired. → <span class=cue>question</span>",a:["Is the road being repaired?"],e:"Первым выходит is: Is + подлежащее + being + V3."},
{q:"My bike has been stolen. → <span class=cue>negative</span>",a:["My bike has not been stolen.","My bike hasn't been stolen."],e:"not после has: has not been stolen."},
{q:"The results will be announced tomorrow. → <span class=cue>question</span>",a:["Will the results be announced tomorrow?"],e:"will выходит вперёд, be + V3 остаются после подлежащего."},
{q:"The room must be cleaned. → <span class=cue>negative</span>",a:["The room must not be cleaned.","The room mustn't be cleaned."],e:"not после модального глагола: must not be cleaned."},
{q:"The work had been finished. → <span class=cue>question</span>",a:["Had the work been finished?"],e:"Had выходит вперёд: Had + подлежащее + been + V3."},
{q:"The walls were being painted. → <span class=cue>negative</span>",a:["The walls were not being painted.","The walls weren't being painted."],e:"not после were: were not being painted."}]},
{t:"2. Translate into English",task:"Переведите на английский, используя Passive. Подсказки в скобках.",type:"text",items:[
{q:"Этот мост построили в 1950 году. <span class=cue>bridge, build</span>",a:["This bridge was built in 1950."],e:"Прошедшее время, исполнитель неважен: was built."},
{q:"Мой телефон украли. <span class=cue>phone, steal</span>",a:["My phone was stolen.","My phone has been stolen."],e:"Подходят Past Simple (was stolen) и Present Perfect (has been stolen)."},
{q:"Результаты объявят завтра. <span class=cue>results, announce</span>",a:["The results will be announced tomorrow."],e:"Будущее: will be + announced."},
{q:"Сейчас ремонтируют дорогу. <span class=cue>road, repair</span>",a:["The road is being repaired now.","The road is being repaired."],e:"Процесс идёт сейчас: is being repaired."},
{q:"Работа должна быть сделана до пятницы. <span class=cue>work, must, do, by Friday</span>",a:["The work must be done by Friday.","The work must be done before Friday."],e:"Модальный глагол: must be done."},
{q:"Мне задали много вопросов. <span class=cue>ask, a lot of questions</span>",a:["I was asked a lot of questions.","I was asked many questions."],e:"Русское «мне» становится подлежащим I: I was asked."},
{q:"По-английски говорят во многих странах. <span class=cue>English, speak</span>",a:["English is spoken in many countries."],e:"Общий факт: Present Simple Passive."}]},
{t:"3. Итоговый тест",task:"Выберите правильный вариант. После проверки вы увидите оценку.",type:"mcq",grade:true,items:[
{q:"Which sentence is Passive?",o:["They are building a hotel.","A hotel is being built.","A hotel is big."],a:1,e:"is being built — Present Continuous Passive."},
{q:"My car ___ last week.",o:["stole","was stolen","is stolen"],a:1,e:"Last week — Past Simple Passive: was stolen."},
{q:"Passive of «Someone has opened the door»:",o:["Opened has the door.","The door has been opened.","The door has being opened."],a:1,e:"Present Perfect Passive: has been + V3."},
{q:"The windows ___ every Friday.",o:["were cleaned","are cleaned","are being cleaned"],a:1,e:"Every Friday — регулярность, Present Simple Passive."},
{q:"The film ___ by millions of people.",o:["has seen","has been seeing","has been seen"],a:2,e:"Фильм посмотрели: has been seen."},
{q:"Passive of «They must finish it»:",o:["It must been finished.","It must finish.","It must be finished."],a:2,e:"Modal + be + V3."},
{q:"A new metro line ___ in our city at the moment.",o:["is built","builds","is being built"],a:2,e:"At the moment — is being built."},
{q:"___ the cake made by your mum?",o:["Did","Has","Was"],a:2,e:"Вопрос в Past Simple Passive: Was + подлежащее + V3."},
{q:"The email ___ yet.",o:["hasn’t sent","hasn’t been sent","wasn’t being sent"],a:1,e:"Yet — Present Perfect; отрицание: hasn’t been sent."},
{q:"Romeo and Juliet ___ by Shakespeare.",o:["wrote","was written","has been writing"],a:1,e:"Пьесу написали: was written."}]}];
const tot=[],all=EX.reduce((s,e)=>s+e.items.length,0),T=document.getElementById("tot");
const upTot=()=>T.textContent=`Итого: ${tot.reduce((a,b)=>a+(b||0),0)} верных из ${all}`;
EX.forEach((ex,k)=>{ex.id="e"+k;const s=$("section","card",`<h2>${ex.t}</h2><p class="task">${ex.task}</p>`);const box=$("div");s.append(box);
 const api=B[ex.type](ex,box),N=ex.items.length;
 const bar=$("div","bar",'<button class="pri">Проверить</button><button>Показать ответы</button><button>Сбросить</button><span class="sc"></span>');
 const[b1,b2,b3]=bar.querySelectorAll("button"),sc=bar.querySelector(".sc"),g=$("div","grade");g.hidden=true;
 b1.onclick=()=>{const n=api.check();tot[k]=n;sc.textContent=`${n} / ${N}`;upTot();
  if(ex.grade){const r=n/N;g.hidden=false;g.textContent=r>=.9?"Оценка 5: отлично! Пассив освоен.":r>=.7?"Оценка 4: хорошо. Повторите пункты с ошибками.":r>=.5?"Оценка 3: неплохо, но стоит вернуться к таблице времён.":"Оценка 2: повторите правило и пройдите первый файл ещё раз."}};
 b2.onclick=()=>{api.show();tot[k]=0;sc.textContent="Ответы показаны";g.hidden=true;upTot()};
 b3.onclick=()=>{api.reset();tot[k]=0;sc.textContent="";g.hidden=true;upTot()};
 s.append(bar,g);document.getElementById("ex").append(s)});
upTot();
</script></body></html>
