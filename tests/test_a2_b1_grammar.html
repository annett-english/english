<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тест A2–B1: Grammar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Literata:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eaeef6;--sheet:#fff;--ink:#121a3b;--muted:#5d6788;--line:#dde3f0;--chip:#e6eaf6;--accent:#2c47f5;--accent-fg:#fff;--mark:#ffdf4d;--mark-ink:#1a1a1a;--sel-bg:#121a3b;--sel-fg:#fff;--dark-bg:#121a3b;--dark-fg:#e9edff;
--sans:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--serif:Literata,Georgia,"Times New Roman",serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1126;--sheet:#141b36;--ink:#e9edff;--muted:#97a0c4;--line:#263054;--chip:#263054;--accent:#8ea2ff;--accent-fg:#0c1126;--mark:#ffd84a;--sel-bg:#e9edff;--sel-fg:#0c1126;--dark-bg:#1d2750}}
:root[data-theme="dark"]{--bg:#0c1126;--sheet:#141b36;--ink:#e9edff;--muted:#97a0c4;--line:#263054;--chip:#263054;--accent:#8ea2ff;--accent-fg:#0c1126;--mark:#ffd84a;--sel-bg:#e9edff;--sel-fg:#0c1126;--dark-bg:#1d2750}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;padding:28px 14px 120px}
.wrap{max-width:720px;margin:0 auto}

.hero{padding:8px 6px 28px}
.level{font-weight:800;font-size:clamp(4.6rem,23vw,8.4rem);line-height:.9;letter-spacing:-.05em;color:var(--accent);margin:0}
.hero h1{font-size:1.5rem;font-weight:700;margin:14px 0 18px;letter-spacing:-.01em}
.steps{margin:0 0 22px;padding-left:1.2em;color:var(--muted);font-size:.98rem;max-width:34em}
.steps li{margin-bottom:4px;padding-left:4px}
.steps b{color:var(--ink);font-weight:600}
.demo{font-family:var(--serif);font-size:1.2rem;border-left:4px solid var(--accent);padding:2px 0 2px 14px}

.blank{display:inline-block;min-width:3.2em;text-align:center;border-bottom:2px solid var(--muted);padding:0 .25em;margin:0 .1em;line-height:1.25;font-family:var(--sans);font-weight:600;font-size:.94em;background:linear-gradient(var(--mark),var(--mark)) no-repeat left/0% 100%;color:var(--mark-ink);transition:background-size .25s ease}
.blank.filled{background-size:100% 100%;border-bottom-color:transparent;border-radius:3px}
.demo .blank{animation:fill 1.1s .5s ease both;min-width:4.6em}
@keyframes fill{from{background-size:0% 100%;color:transparent}to{background-size:100% 100%;color:var(--mark-ink)}}

.sheet{background:var(--sheet);border-radius:22px;margin-bottom:26px;overflow:hidden}
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:0;padding:22px 22px 16px;font-size:1.3rem;font-weight:800;letter-spacing:-.02em}
.sh small{font-size:.85rem;font-weight:500;color:var(--muted);letter-spacing:0;white-space:nowrap}
.q{display:grid;grid-template-columns:2.5rem 1fr;padding:20px 22px 22px;border-top:1px solid var(--line)}
.n{font-weight:800;font-size:1.05rem;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px;transition:color .2s}
.q.done .n{color:var(--accent)}
.qt{font-family:var(--serif);font-size:1.15rem;line-height:1.55;max-width:34em}
.hint{font-family:var(--sans);font-size:.8em;color:var(--muted);margin-left:.2em}
.opts{grid-column:2;display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
label.opt{position:relative;display:inline-flex;align-items:center;gap:8px;padding:7px 15px 7px 8px;border:1.5px solid var(--line);border-radius:999px;cursor:pointer;font-size:.97rem;font-weight:500;transition:background .15s,color .15s,border-color .15s}
label.opt:hover{border-color:var(--ink)}
label.opt input{position:absolute;opacity:0;pointer-events:none}
label.opt:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
.k{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--chip);font-size:.72rem;font-weight:700}
label.opt.on{background:var(--sel-bg);color:var(--sel-fg);border-color:var(--sel-bg)}
label.opt.on .k{background:var(--mark);color:var(--mark-ink)}
label.unsure{border-style:dashed;color:var(--muted);padding-left:15px}
label.unsure.on{color:var(--sel-fg)}

.bar{position:sticky;bottom:0;margin:0 -14px;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);z-index:5}
.bar::before{content:"";position:absolute;left:0;top:-1px;height:3px;width:var(--p,0%);background:var(--accent);transition:width .25s}
.bar-in{max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:14px}
.cnt{font-size:.95rem;color:var(--muted)}
.cnt b{font-size:1.5rem;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;margin-right:2px}
button{font:inherit;font-weight:700;background:var(--accent);color:var(--accent-fg);border:0;border-radius:14px;padding:13px 22px;cursor:pointer}
button:active{opacity:.85}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

#res{display:none;background:var(--dark-bg);color:var(--dark-fg);border-radius:22px;padding:22px;margin-bottom:26px}
#res h2{margin:0 0 6px;font-size:1.3rem;font-weight:800;letter-spacing:-.02em}
#note{margin:0 0 14px;font-size:.92rem;opacity:.75}
#ans{width:100%;min-height:120px;resize:vertical;border:1.5px solid rgba(255,255,255,.2);border-radius:12px;background:transparent;color:inherit;padding:12px;font:.95rem/1.6 ui-monospace,Menlo,Consolas,monospace}
#copy{margin-top:12px;background:var(--mark);color:var(--mark-ink);width:100%}
#cs{margin-top:8px;min-height:1.3em;font-size:.9rem;text-align:center}
@media (max-width:420px){.q,.sh{padding-left:16px;padding-right:16px}.q{grid-template-columns:2.1rem 1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.demo .blank{background-size:100% 100%}}
</style>
</head>
<body>
<div class="wrap">
<header class="hero">
  <p class="level">A2–B1</p>
  <h1>Тест по грамматике</h1>
  <ol class="steps">
    <li>Выберите <b>a</b>, <b>b</b> или <b>c</b>: слово встанет на место пропуска.</li>
    <li>Не уверены — выберите <b>не уверена / не уверен</b>. Это нормально.</li>
    <li>Внизу нажмите <b>«Собрать ответы»</b> и отправьте текст преподавателю.</li>
  </ol>
  <div class="demo">I <span class="blank filled">have lived</span> here since 2020.</div>
</header>

<main id="quiz"></main>

<section id="res">
  <h2>Ваши ответы</h2>
  <p id="note"></p>
  <textarea id="ans" readonly></textarea>
  <button id="copy">Скопировать ответы</button>
  <div id="cs"></div>
</section>

<div class="bar" id="bar"><div class="bar-in">
  <div class="cnt"><b id="cnt">0</b>из 30</div>
  <button id="collect">Собрать ответы</button>
</div></div>
</div>

<script>
const sections = [
 {t:"Предлоги in / on / at", sub:"1–6", c:"var(--c1)", qs:[
  ["My birthday is ___ June.",["at","on","in"]],
  ["The lesson starts ___ 9 o’clock.",["at","in","on"]],
  ["We usually go to the beach ___ Sundays.",["in","on","at"]],
  ["She’s waiting for you ___ the bus stop.",["at","in","on"]],
  ["There’s a great picture ___ the wall.",["in","on","at"]],
  ["I don’t like going out ___ night.",["in","on","at"]]
 ]},
 {t:"Времена", sub:"7–16", c:"var(--c2)", qs:[
  ["She usually ___ (drink) coffee in the morning.",["drinks","is drinking","drink"]],
  ["Be quiet! The baby ___ (sleep).",["sleeps","sleep","is sleeping"]],
  ["Yesterday we ___ (go) to the cinema.",["went","go","have gone"]],
  ["When I called, he ___ (cook) dinner.",["cooked","was cooking","has cooked"]],
  ["I ___ (visit) Paris three times.",["visited","am visiting","have visited"]],
  ["I ___ (live) here since 2020.",["live","have lived","lived"]],
  ["When we arrived, the film ___ (already/start).",["has started","started","had started"]],
  ["He was sad because his best friend ___ (leave) without saying goodbye.",["left","had left","has left"]],
  ["Look at the sky! It ___ (rain).",["will rain","is going to rain","rains"]],
  ["I’m cold. I think I ___ (close) the window.",["will close","am going to close","am closing"]]
 ]},
 {t:"Условные предложения", sub:"17–22", c:"var(--c3)", qs:[
  ["If you heat ice, it ___ (melt).",["melts","will melt","melted"]],
  ["If it rains tomorrow, we ___ (stay) at home.",["stay","would stay","will stay"]],
  ["If I ___ (have) a million dollars, I would travel the world.",["have","had","would have"]],
  ["If I were you, I ___ (take) that job.",["would take","will take","took"]],
  ["If she had studied, she ___ (pass) the exam.",["would pass","passed","would have passed"]],
  ["I won’t go to the party ___ you come with me.",["if","unless","when"]]
 ]},
 {t:"Другая грамматика", sub:"23–30", c:"var(--c4)", qs:[
  ["This car is ___ than that one.",["faster","more fast","fastest"]],
  ["You ___ park here. It’s forbidden.",["don’t have to","can","mustn’t"]],
  ["The window ___ (break) by someone last night.",["broke","is broken","was broken"]],
  ["I enjoy ___ (listen) to music.",["to listen","listening","listen"]],
  ["She wants ___ (be) a doctor.",["to be","be","being"]],
  ["The man ___ lives next door is a teacher.",["which","who","whose"]],
  ["Do you know where ___?",["is the station","the station is","does the station"]],
  ["She said she ___ tired.",["was","is","has been"]]
 ]}
];
const TOTAL = 30, L = ["a","b","c"], answers = {};
const quiz = document.getElementById("quiz");
let n = 0;
sections.forEach(s => {
  const first = n + 1, last = n + s.qs.length;
  const sheet = document.createElement("section");
  sheet.className = "sheet";
  sheet.innerHTML = `<h2 class="sh">${s.t}<small>вопросы ${first}–${last}</small></h2>`;
  s.qs.forEach(([q, opts]) => {
    n++; const num = n;
    const row = document.createElement("div");
    row.className = "q";
    const text = q.replace(/\(([^)]*)\)/g, '<span class="hint">($1)</span>')
                  .replace("___", '<span class="blank"></span>');
    let o = opts.map((t, i) => `<label class="opt"><input type="radio" name="q${num}" value="${L[i]}"><span class="k">${L[i]}</span>${t}</label>`).join("");
    o += `<label class="opt unsure"><input type="radio" name="q${num}" value="d">не уверена / не уверен</label>`;
    row.innerHTML = `<div class="n">${num}</div><div class="qt">${text}</div><div class="opts">${o}</div>`;
    sheet.appendChild(row);
    const blank = row.querySelector(".blank");
    row.querySelectorAll("input").forEach(inp => inp.addEventListener("change", () => {
      answers[num] = inp.value;
      row.querySelectorAll("label.opt").forEach(l => l.classList.remove("on"));
      inp.closest("label").classList.add("on");
      row.classList.add("done");
      const idx = L.indexOf(inp.value);
      blank.textContent = idx < 0 ? "?" : opts[idx];
      blank.classList.add("filled");
      const k = Object.keys(answers).length;
      document.getElementById("cnt").textContent = k;
      document.getElementById("bar").style.setProperty("--p", (k / TOTAL * 100) + "%");
    }));
  });
  quiz.appendChild(sheet);
});
document.getElementById("collect").addEventListener("click", () => {
  const out = []; let missing = 0;
  for (let i = 1; i <= TOTAL; i++) { if (!answers[i]) missing++; out.push(`${i}.${answers[i] || "?"}`); }
  document.getElementById("ans").value = out.join(" ");
  document.getElementById("note").textContent = missing
    ? `Без ответа: ${missing}. Они отмечены знаком «?». Можно вернуться и дополнить.`
    : "Все вопросы отвечены. Скопируйте текст и отправьте преподавателю.";
  const r = document.getElementById("res");
  r.style.display = "block";
  r.scrollIntoView({behavior: "smooth", block: "start"});
  document.getElementById("cs").textContent = "";
});
document.getElementById("copy").addEventListener("click", async () => {
  const ta = document.getElementById("ans"), st = document.getElementById("cs");
  ta.select();
  try { await navigator.clipboard.writeText(ta.value); st.textContent = "Скопировано. Вставьте в сообщение."; }
  catch (e) { st.textContent = "Скопируйте текст вручную: он выделен."; }
});
</script>
</body>
</html>
