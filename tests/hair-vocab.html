<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hair & Grooming — тренажёр</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f4ef;--card:#fff;--tx:#1f2328;--mut:#6b7280;--bd:#e3dfd6;--ac:#2f6f5e;--acb:#e3f1ec;--ok:#1a7f4b;--okb:#dff3e8;--bad:#b42318;--badb:#fde8e6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#16181a;--card:#202326;--tx:#e9e9e6;--mut:#9aa0a6;--bd:#33373b;--ac:#6fc2a8;--acb:#23362f;--ok:#6fd49b;--okb:#1d3528;--bad:#ff8a7e;--badb:#3d2220}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:24px;margin:8px 0 4px}h2{font-size:18px;margin:0 0 4px}
.sub{color:var(--mut);font-size:14px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:1fr 260px;gap:16px;align-items:start}
@media(max-width:820px){.grid{grid-template-columns:1fr}aside{order:-1}}
aside{position:sticky;top:12px}
.vocab{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.w{display:flex;align-items:center;gap:8px;border:1px solid var(--bd);border-radius:10px;padding:8px 10px}
.w b{display:block}.w i{color:var(--mut);font-style:normal;font-size:13px}.w small{display:block;font-size:13px}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:6px 12px}
button:hover{border-color:var(--ac)}
.sp{padding:4px 8px;flex:none}
.pri{background:var(--ac);color:var(--bg);border-color:var(--ac)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px;font-size:14px}
#vstat{color:var(--mut)}
ol{padding-left:24px;margin:8px 0}li{margin:12px 0}
.q{display:block;margin-bottom:4px}
input[type=text],textarea{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
input.ok,textarea.ok{border-color:var(--ok);background:var(--okb)}input.bad,textarea.bad{border-color:var(--bad);background:var(--badb)}
.res{font-size:14px;margin-top:3px;min-height:1px}.res .g{color:var(--ok)}.res .r{color:var(--bad)}.res .a{color:var(--mut)}
.hint{font-size:13px;color:var(--mut)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}.score{font-weight:600;margin-left:auto}
.chips{color:var(--ac);font-weight:600}
table{width:100%;border-collapse:collapse;font-size:14px}td{padding:4px 2px;border-bottom:1px solid var(--bd)}
#rep{height:180px;margin-top:8px;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
<h1>Hair & Grooming ✂️</h1>
<p class="sub">Повторите слова, прослушайте их и выполните 6 упражнений. Все ответы пишем руками.</p>

<div class="card">
<h2>Слова: послушайте и повторите</h2>
<p class="sub">🎧 Задание: нажмите на 🔊 у каждого слова и повторите вслух. Голос: Google US English / Samantha.</p>
<div class="vocab" id="vocab"></div>
<div class="bar">
<button class="pri" id="playall">▶ Прослушать все</button>
<button id="vtest">🔈 Проверить звук</button>
<label>Скорость <input type="range" id="rate" min="0.6" max="1.1" step="0.1" value="0.9"></label>
<span id="vstat"></span>
</div>
</div>

<div class="grid">
<main id="main"></main>
<aside>
<div class="card">
<h2>Проблемные слова</h2>
<p class="sub">Слова, в которых была ошибка</p>
<table id="prob"></table>
<div class="ctl"><button id="clrp">Очистить</button></div>
</div>
</aside>
</div>

<div class="card">
<h2>Итог</h2>
<div class="ctl">
<button class="pri" id="chkall">Проверить всё</button>
<button id="copy">📋 Скопировать мои ответы</button>
<span id="cstat" class="hint"></span>
</div>
<textarea id="rep" readonly placeholder="Здесь появится отчёт с вашими ответами и правильными вариантами"></textarea>
</div>
</div>

<script>
const V=[['dry','/draɪ/','сушить'],['style','/staɪl/','делать укладку'],['straighten','/ˈstreɪtn/','выпрямлять'],['wash','/wɑːʃ/','мыть'],['curl','/kɜːrl/','завивать'],['tie','/taɪ/','завязывать, собирать'],['grow','/ɡroʊ/','отращивать'],['shave','/ʃeɪv/','брить(ся)'],['cut','/kʌt/','стричь'],['pluck','/plʌk/','выщипывать'],['brush','/brʌʃ/','расчёсывать'],['braid','/breɪd/','плести косу'],['dye','/daɪ/','красить (волосы)'],['a bad haircut','/ə bæd ˈherkʌt/','неудачная стрижка'],['greasy hair','/ˈɡriːsi her/','жирные волосы'],['frizzy hair','/ˈfrɪzi her/','пушистые, непослушные волосы']];
const TR=Object.fromEntries(V.map(v=>[v[0],v[2]]));
const $=s=>document.querySelector(s);
const norm=s=>s.toLowerCase().replace(/[’`]/g,"'").replace(/[^a-z' ]/g,' ').replace(/\s+/g,' ').trim();

/* ---------- audio ---------- */
let voice=null;
function pick(){const v=speechSynthesis.getVoices();voice=v.find(x=>/google us english/i.test(x.name))||v.find(x=>/samantha/i.test(x.name))||v.find(x=>x.lang==='en-US'||x.lang==='en_US')||v.find(x=>/^en/i.test(x.lang))||null;
$('#vstat').textContent=!('speechSynthesis' in window)?'⚠ Озвучка не поддерживается этим браузером':voice?'Голос: '+voice.name:'⚠ Английский голос не найден — откройте страницу в Chrome или Safari';}
function say(t,cb){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';if(voice)u.voice=voice;u.rate=+$('#rate').value;if(cb)u.onend=cb;speechSynthesis.speak(u);}
if('speechSynthesis' in window){pick();speechSynthesis.onvoiceschanged=pick;}
$('#vtest').onclick=()=>{pick();say('Audio check. Wash, dry, brush, braid.');};
$('#playall').onclick=()=>{let i=0;const n=()=>{if(i<V.length)say(V[i++][0],()=>setTimeout(n,350));};n();};
$('#vocab').innerHTML=V.map(v=>`<div class="w"><button class="sp" data-s="${v[0]}" aria-label="Прослушать">🔊</button><div><b>${v[0]}</b><i>${v[1]}</i><small>${v[2]}</small></div></div>`).join('');
document.addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(b)say(b.dataset.s);});

/* ---------- data: [question, [accepted answers], word-tag] ---------- */
const EX=[
{t:'1. Переведите на английский',d:'Напишите предложение по-английски.',m:'eq',it:[
['Мне нужно высушить волосы.',['I need to dry my hair'],'dry'],
['Он отращивает бороду.',['He is growing a beard',"He's growing a beard",'He is growing his beard',"He's growing his beard"],'grow'],
['Завяжи волосы.',['Tie your hair','Tie your hair back','Tie back your hair'],'tie'],
['У меня жирные волосы.',['I have greasy hair',"I've got greasy hair",'I have got greasy hair'],'greasy hair'],
['Она хочет выпрямить волосы.',['She wants to straighten her hair'],'straighten'],
['Он побрился сегодня утром.',['He shaved this morning','He shaved in the morning'],'shave'],
['Мама заплела мне косу.',['My mom braided my hair','My mum braided my hair','My mother braided my hair'],'braid'],
['У неё пушистые волосы.',['She has frizzy hair',"She's got frizzy hair",'She has got frizzy hair'],'frizzy hair'],
['Расчеши волосы перед школой.',['Brush your hair before school'],'brush'],
['Это плохая стрижка.',["It's a bad haircut",'It is a bad haircut','This is a bad haircut',"That's a bad haircut",'That is a bad haircut'],'a bad haircut']]},
{t:'2. Расставьте слова по порядку',d:'Составьте предложение и напишите его целиком. Вариантов может быть несколько.',m:'eq',it:[
['last / hair / dyed / she / month / her',['She dyed her hair last month','Last month she dyed her hair'],'dye'],
['every / she / eyebrows / plucks / week / her',['She plucks her eyebrows every week','Every week she plucks her eyebrows'],'pluck'],
['curl / often / you / hair / do / your',['Do you often curl your hair','Do you curl your hair often'],'curl'],
['barber / is / hair / cutting / a / his',['A barber is cutting his hair'],'cut'],
['her / hates / hair / she / frizzy',['She hates her frizzy hair'],'frizzy hair'],
['going / hair / style / I\'m / to / my / tonight',["I'm going to style my hair tonight","Tonight I'm going to style my hair",'I am going to style my hair tonight','Tonight I am going to style my hair'],'style'],
['his / every / washes / morning / hair / he',['He washes his hair every morning','Every morning he washes his hair'],'wash'],
['got / yesterday / a / haircut / bad / she',['She got a bad haircut yesterday','Yesterday she got a bad haircut'],'a bad haircut']]},
{t:'3. Поставьте глагол в нужное время',d:'Время выберите сами (A2–B1: Present/Past/Future, Continuous, Present Perfect). Напишите только форму глагола.',m:'eq',it:[
['Yesterday I ___ (wash) my hair with a new shampoo.',['washed'],'wash'],
['Right now she ___ (dry) her hair.',['is drying',"'s drying"],'dry'],
['My sister usually ___ (braid) her hair before sport.',['braids'],'braid'],
['He ___ (cut) his hair twice this year.',['has cut',"'s cut"],'cut'],
['When I called, she ___ (brush) her hair.',['was brushing'],'brush'],
['Next week I ___ (dye) my hair red. I have already decided.',['am going to dye',"'m going to dye"],'dye'],
['I ___ never ___ (shave) my head. (одно слово между: never)',['have shaved',"'ve shaved"],'shave'],
['If it rains, my hair ___ (get) frizzy.',['will get',"'ll get"],'frizzy hair'],
['She ___ (grow) her hair for two years.',['has grown',"'s grown"],'grow']]},
{t:'4. Rephrase — перефразируйте',d:'Напишите предложение с тем же смыслом, используя слово в скобках.',m:'eq',it:[
['I used a hairdryer on my hair. (dried)',['I dried my hair','I dried my hair with a hairdryer'],'dry'],
['The hairdresser cut my hair badly. (got)',['I got a bad haircut','I got a bad haircut from the hairdresser'],'a bad haircut'],
['Her hair is very oily. (greasy)',['Her hair is very greasy','She has greasy hair','She has very greasy hair'],'greasy hair'],
['Can you put my hair into a braid? (braid)',['Can you braid my hair','Could you braid my hair'],'braid'],
['He removed his beard this morning. (shaved)',['He shaved this morning','He shaved his beard this morning'],'shave'],
['I did not cut my hair for a year. (grew)',['I grew my hair for a year','I grew my hair out for a year'],'grow'],
['She uses a hairbrush every night. (brushes)',['She brushes her hair every night'],'brush'],
['Mary wants wavy hair tonight. (curl)',['Mary wants to curl her hair tonight','Mary is going to curl her hair tonight'],'curl']]},
{t:'5. Predict the ending — придумайте окончание',d:'Закончите предложение своими словами (3+ слова). Авто-проверка ищет подходящее слово из темы; сравните с примером.',m:'kw',it:[
['She didn\'t wash her hair for a week, so …',['greas','oily','dirty'],'greasy hair','it was greasy.'],
['I went to a new hairdresser and she cut too much, so I got …',['haircut','bad','cut'],'a bad haircut','a really bad haircut.'],
['It was raining and humid, so my hair became …',['frizz'],'frizzy hair','frizzy.'],
['He wanted to look different, so he …',['dye','shav','cut','grow','style','curl'],'dye','dyed his hair blue.'],
['My hair is very curly, so every morning I …',['straight','brush','style','dry'],'straighten','straighten it.'],
['Her hair was so long that her mum …',['braid','tie','tied','brush','cut'],'braid','braided it every day.'],
['He had a beard for years, but yesterday he …',['shav','cut'],'shave','shaved it off.'],
['Her eyebrows were too thick, so she …',['pluck','cut','shape'],'pluck','plucked them.']]}
];

/* ---------- render ---------- */
const main=$('#main');
main.innerHTML=EX.map((e,x)=>`<section class="card" id="e${x}"><h2>${e.t}</h2><p class="sub">${e.d}</p><ol>${e.it.map((q,i)=>`<li><span class="q">${/\//.test(q[0])&&e.t[0]=='2'?'<span class="chips">'+q[0]+'</span>':q[0]}</span><input type="text" id="i${x}_${i}" autocomplete="off" autocapitalize="off" spellcheck="false"><div class="res" id="r${x}_${i}"></div></li>`).join('')}</ol>
<div class="ctl"><button class="pri" data-c="${x}">Проверить</button><button data-a="${x}">Показать ответы</button><button data-z="${x}">Сбросить</button><span class="score" id="s${x}"></span></div></section>`).join('')+
`<section class="card" id="e5"><h2>6. Write as many words as you remember</h2><p class="sub">Не подглядывая в список, напишите все слова по теме, которые помните (по одному в строке или через запятую).</p>
<textarea id="free" rows="6" spellcheck="false" autocapitalize="off"></textarea><div class="res" id="fr"></div>
<div class="ctl"><button class="pri" data-c="5">Проверить</button><button data-a="5">Показать слова</button><button data-z="5">Сбросить</button><span class="score" id="s5"></span></div></section>`;

/* ---------- problems ---------- */
let P={};
function drawP(){const k=Object.keys(P).sort((a,b)=>P[b]-P[a]);$('#prob').innerHTML=k.length?k.map(w=>`<tr><td><button class="sp" data-s="${w}">🔊</button></td><td><b>${w}</b><br><span class="hint">${TR[w]}</span></td><td>×${P[w]}</td></tr>`).join(''):'<tr><td class="hint">Пока ошибок нет 👍</td></tr>';}
$('#clrp').onclick=()=>{P={};drawP();};drawP();

/* ---------- check logic ---------- */
const last={};
function bad(tag,key,val){if(last[key]!==val){last[key]=val;P[tag]=(P[tag]||0)+1;}}
function ansText(e,q){return e.m=='kw'?q[3]:q[1].join(' / ');}
function check(x){
if(x==5)return checkFree();
const e=EX[x];let ok=0,done=0;
e.it.forEach((q,i)=>{const inp=$('#i'+x+'_'+i),r=$('#r'+x+'_'+i),v=inp.value;
inp.classList.remove('ok','bad');if(!v.trim()){r.innerHTML='';return;}done++;
const n=norm(v);let good=e.m=='kw'?(n.split(' ').length>=3&&q[1].some(k=>n.includes(k))):q[1].some(a=>norm(a)==n);
if(good){ok++;inp.classList.add('ok');r.innerHTML='<span class="g">✓ Верно</span>'+(e.m=='kw'?' <span class="a">Пример: '+q[3]+'</span>':'');}
else{inp.classList.add('bad');r.innerHTML='<span class="r">✗ Попробуйте ещё</span>';bad(q[2],x+'_'+i,n);}});
$('#s'+x).textContent=ok+' / '+e.it.length;drawP();}
function show(x){
if(x==5){$('#fr').innerHTML='<span class="a">Все слова: '+V.map(v=>v[0]).join(', ')+'</span>';return;}
const e=EX[x];e.it.forEach((q,i)=>{const r=$('#r'+x+'_'+i);r.innerHTML+=` <span class="a">→ ${ansText(e,q)}</span>`;});}
function reset(x){
if(x==5){$('#free').value='';$('#free').className='';$('#fr').innerHTML='';$('#s5').textContent='';return;}
EX[x].it.forEach((q,i)=>{const n=$('#i'+x+'_'+i);n.value='';n.className='';$('#r'+x+'_'+i).innerHTML='';delete last[x+'_'+i];});$('#s'+x).textContent='';}
const ALT={'a bad haircut':['bad haircut','haircut'],'greasy hair':['greasy hair','greasy'],'frizzy hair':['frizzy hair','frizzy']};
function freeRes(){const t=' '+norm($('#free').value)+' ';const f=[],m=[];V.forEach(v=>{(( ALT[v[0]]||[v[0]]).some(a=>t.includes(' '+a+' '))?f:m).push(v[0]);});return{f,m};}
function checkFree(){const v=$('#free').value.trim();if(!v){$('#fr').innerHTML='';return;}const{f,m}=freeRes();
m.forEach(w=>bad(w,'free_'+w,norm(v)));$('#free').className=m.length?'':'ok';
$('#fr').innerHTML=`<span class="g">Вспомнили: ${f.length} из ${V.length}</span>`+(m.length?` <span class="r">Не хватает: ${m.join(', ')}</span>`:' 🎉');
$('#s5').textContent=f.length+' / '+V.length;drawP();}
document.addEventListener('click',e=>{const t=e.target;if(t.dataset.c!==undefined)check(+t.dataset.c);if(t.dataset.a!==undefined)show(+t.dataset.a);if(t.dataset.z!==undefined)reset(+t.dataset.z);});

/* ---------- report / copy ---------- */
function report(){let o='HAIR & GROOMING — мои ответы\n';let tot=0,okc=0;
EX.forEach((e,x)=>{o+='\n'+e.t+'\n';e.it.forEach((q,i)=>{const v=$('#i'+x+'_'+i).value.trim(),c=$('#i'+x+'_'+i).classList;
const mark=!v?'—':c.contains('ok')?'✓':c.contains('bad')?'✗':'?';tot++;if(mark=='✓')okc++;
o+=`${i+1}. ${e.t[0]=='2'?q[0]:q[0]}\n   Мой ответ: ${v||'(пусто)'} ${mark}\n   Правильно: ${ansText(e,q)}\n`;});});
const fv=$('#free').value.trim(),{f,m}=freeRes();
o+='\n6. Write as many words as you remember\n   Мои слова: '+(fv.replace(/\n/g,', ')||'(пусто)')+'\n   Вспомнил: '+f.length+'/'+V.length+(m.length?'; не хватает: '+m.join(', '):'')+'\n';
o+='\nВерно в упр. 1–5: '+okc+' из '+tot+'\nПроблемные слова: '+(Object.keys(P).map(w=>w+' ×'+P[w]).join(', ')||'нет')+'\n';return o;}
$('#chkall').onclick=()=>{for(let x=0;x<6;x++)check(x);$('#rep').value=report();};
$('#copy').onclick=()=>{for(let x=0;x<6;x++)check(x);const t=report(),a=$('#rep');a.value=t;a.select();
const ok=()=>$('#cstat').textContent='✓ Скопировано';const fb=()=>{try{document.execCommand('copy')?ok():$('#cstat').textContent='Выделите текст ниже и скопируйте (Ctrl/Cmd+C)';}catch(_){$('#cstat').textContent='Выделите текст ниже и скопируйте (Ctrl/Cmd+C)';}};
(navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(t).then(ok,fb):fb());};
</script>
</body>
</html>
