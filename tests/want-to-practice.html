let qi=0;const ql=[];const mq=$("#ex");const qs=document.createElement("section");qs.className="sec";qs.innerHTML="<h2>7. Кто хочет стать миллионером? 💰</h2><p class=inst>15 вопросов. Часть — с вариантами, часть нужно написать самому. Несгораемые суммы: 1 000 и 32 000.</p><div class=mil id=mil></div>";mq.append(qs);
