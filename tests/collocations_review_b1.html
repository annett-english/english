<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>B1 Review: collocations</title>
<style>
:root{--bg:#f6f6f2;--cd:#fff;--tx:#1d1d1f;--mu:#6b6b70;--ac:#2563eb;--ok:#15803d;--okb:#dcfce7;--no:#b91c1c;--nob:#fee2e2;--bd:#deded8;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141416;--cd:#1e1e21;--tx:#ececee;--mu:#9a9aa2;--ac:#7aa2ff;--ok:#6ee7a0;--okb:#12301f;--no:#fca5a5;--nob:#3a1818;--bd:#33333a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141416;--cd:#1e1e21;--tx:#ececee;--mu:#9a9aa2;--ac:#7aa2ff;--ok:#6ee7a0;--okb:#12301f;--no:#fca5a5;--nob:#3a1818;--bd:#33333a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1100px;margin:auto;padding:16px;display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:16px}
@media(max-width:820px){.wrap{grid-template-columns:1fr}}
h1{font-size:1.4rem;margin:0}h2{font-size:1.1rem;margin:0 0 4px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--cd);border:1px solid var(--bd);border-radius:8px;padding:6px 10px}
button{cursor:pointer}button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) button.p{color:#111}}
.in{color:var(--mu);margin:0 0 8px}
.it{padding:7px 8px;border-radius:8px;margin:4px 0;border:1px solid transparent}
.it.good{background:var(--okb);border-color:var(--ok)}.it.bad{background:var(--nob);border-color:var(--no)}
.it input{width:100%;box-sizing:border-box;margin-top:4px}.sm{width:15em!important}
.res{font-size:.9rem;min-height:1em}.res b{color:var(--ac)}.sc{font-weight:600;color:var(--mu)}
details{margin-top:6px}details td{padding:2px 10px 2px 0}
aside .card{position:sticky;top:12px}aside ul{padding-left:0;list-style:none;margin:6px 0;max-height:60vh;overflow:auto}
aside li{padding:4px 0;border-bottom:1px solid var(--bd);font-size:.92rem;cursor:pointer}aside li span{color:var(--no);font-weight:600}
#man{width:100%;height:120px;box-sizing:border-box}
</style></head><body><div class="wrap"><main>
<div class="card"><h1>B1 · Review: friendship · leadership · membership · partnership · relationship</h1>
<div class="bar"><label>Голос: <select id="vs"></select></label><button id="tst">🔊 Проверить звук</button><button id="all" class="p">📋 Скопировать все ответы</button><span id="msg" class="in"></span></div>
<div id="vst" class="in"></div><textarea id="man" hidden></textarea>
<details><summary>Подсказка: все выражения</summary><table id="ref"></table></details></div>
<div id="ex"></div></main>
<aside><div class="card"><h2>Проблемные слова</h2><p class="in">Выражения, в которых была ошибка. Нажмите, чтобы послушать.</p><ul id="pl"></ul><button id="pc">Очистить</button></div></aside></div>
<script>
const $=s=>document.querySelector(s),sh=a=>[...a].sort(()=>Math.random()-.5);
const V=[["form a friendship","завязать дружбу"],["develop a friendship","развивать дружбу"],["build a friendship","выстраивать дружбу"],["end a friendship","закончить дружбу"],["show leadership","проявлять лидерские качества"],["develop / build leadership skills","развивать лидерские навыки"],["get membership","получить членство"],["apply for membership","подать заявку на вступление"],["cancel membership","отменить членство"],["form / develop / build / end a partnership","создать / развивать / выстраивать / прекратить партнёрство"],["form / develop / build / end a relationship","начать / развивать / выстраивать / закончить отношения"]];
$("#ref").innerHTML=V.map(([e,r])=>`<tr><td><b>${e}</b></td><td>${r}</td></tr>`).join("");
const E=[
{t:"1. Translate the expression",i:"Напишите выражение по-английски.",it:[["отменить членство",["cancel membership"]],["завязать дружбу",["form a friendship"]],["развивать партнёрство",["develop a partnership"]],["проявлять лидерские качества",["show leadership"]],["закончить отношения",["end a relationship"]],["развивать лидерские навыки",["develop leadership skills","build leadership skills"]],["подать заявку на вступление",["apply for membership"]],["выстраивать дружбу",["build a friendship"]]].map(([q,a])=>({q,a}))},
{t:"2. Choose the correct collocation",i:"Выберите правильное сочетание.",it:[["My brother wants to ___ at the tennis club.","apply for membership","form membership","develop membership"],["Good teachers ___ in every lesson.","show leadership","form leadership","end leadership"],["It takes time to ___ with new colleagues.","build a relationship","apply a relationship","show a relationship"],["The two firms plan to ___ next year.","form a partnership","show a partnership","apply for a partnership"],["I’m going to ___ because I moved away.","cancel my membership","close my membership","break my membership"],["You can ___ by taking part in team projects.","develop leadership skills","make leadership skills","do leadership skills"],["They stopped speaking and finally ___.","ended their friendship","closed their friendship","finished their friendship"],["How did you ___ with your best friend?","form a friendship","do a friendship","take a friendship"]].map(([q,a,x,y])=>({q,a:[a],o:[a,x,y]}))},
{t:"3. Translate the sentence",i:"Переведите предложение на английский.",it:[["Мы завязали дружбу в школе.",["formed","friendship"],"We formed a friendship at school."],["Она отменила членство в клубе.",["cancel","membership"],"She cancelled her membership of the club."],["Он проявил лидерские качества.",["show","leadership"],"He showed leadership."],["Они развивают партнёрство с польской фирмой.",["develop","partnership"],"They are developing a partnership with a Polish firm."],["Я хочу подать заявку на вступление в клуб.",["appl","membership"],"I want to apply for membership of the club."],["Им нужно выстроить доверительные отношения.",["build","relationship"],"They need to build a trusting relationship."],["Они закончили отношения год назад.",["end","relationship"],"They ended the relationship a year ago."],["Как развивать лидерские навыки?",["develop","leadership"],"How can I develop leadership skills?"]].map(([q,k,m])=>({q,k,m}))}
];
let P={};try{P=JSON.parse(localStorage.getItem("pr")||"{}")}catch(e){}
const norm=s=>s.toLowerCase().replace(/[’']/g,"'").replace(/[.,!?;]/g,"").replace(/\s+/g," ").trim();
const ok=(it,v)=>{const x=norm(v);return it.a?it.a.map(norm).includes(x):it.k.every(k=>x.includes(k))};
const row=(i,j)=>$(`#e${i} [data-j="${j}"]`);
const disp=it=>it.m||(it.q.includes("___")?it.q.replace("___",it.a[0]):it.a[0]);
function drawP(){const k=Object.keys(P);$("#pl").innerHTML=k.length?k.map(w=>`<li data-act="say" data-s="${w.replace(/"/g,"")}">🔊 ${w} <span>×${P[w]}</span></li>`).join(""):"<li>Пока ошибок нет 🎉</li>";try{localStorage.setItem("pr",JSON.stringify(P))}catch(e){}}
function draw(i){const ex=E[i];let h=`<h2>${ex.t} <span class="sc"></span></h2><p class="in">${ex.i}</p>`;
ex.it.forEach((it,j)=>{if(it.o&&!it.oo)it.oo=sh(it.o);
const f=it.o?`<select data-f><option value="">—</option>${it.oo.map(o=>`<option>${o}</option>`).join("")}</select>`:`<input data-f class="${it.k?"":"sm"}" autocomplete="off" autocapitalize="off" spellcheck="false">`;
const inl=it.q.includes("___");h+=`<div class="it" data-j="${j}"><div>${j+1}. ${inl?it.q.replace("___",f):it.q}</div>${inl?"":f}<div class="res"></div></div>`});
h+='<div class="bar"><button class="p" data-act="chk">Проверить</button><button data-act="shw">Показать ответы</button><button data-act="rst">Сбросить</button></div>';$("#e"+i).innerHTML=h}
const getV=(i,j)=>{const f=row(i,j).querySelector("[data-f]");return f?f.value.trim():""};
function chk(i){let n=0;E[i].it.forEach((it,j)=>{const r=row(i,j),g=ok(it,getV(i,j));r.classList.toggle("good",g);r.classList.toggle("bad",!g);r.querySelector(".res").textContent=g?"✓":"✗";if(g)n++;else{const d=disp(it);P[d]=(P[d]||0)+1}});$(`#e${i} .sc`).textContent=n+" / "+E[i].it.length;drawP()}
function shw(i){E[i].it.forEach((it,j)=>{row(i,j).querySelector(".res").innerHTML="→ <b>"+disp(it)+"</b>"})}
function txt(){let t="B1 Review — мои ответы\n";E.forEach((ex,i)=>{t+=`\n${ex.t}\n`;ex.it.forEach((it,j)=>{const v=getV(i,j)||"—";t+=`${j+1}. `+(it.q.includes("___")?it.q.replace("___","["+v+"]"):it.q+" → "+v)+"\n"})});return t}
function msg(m){$("#msg").textContent=m;setTimeout(()=>$("#msg").textContent="",4000)}
async function cp(t){try{await navigator.clipboard.writeText(t);msg("Скопировано ✓")}catch(e){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();let g=false;try{g=document.execCommand("copy")}catch(_){}a.remove();msg(g?"Скопировано ✓":"Скопируйте текст из поля ниже вручную");if(!g){const m=$("#man");m.hidden=false;m.value=t;m.select()}}}
let VO=[];
function lv(){if(!("speechSynthesis"in window)){$("#vst").textContent="Озвучка не поддерживается этим браузером.";return}VO=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));const s=$("#vs");s.innerHTML=VO.map((v,k)=>`<option value="${k}">${v.name} (${v.lang})</option>`).join("");let k=VO.findIndex(v=>/Google US English/i.test(v.name));if(k<0)k=VO.findIndex(v=>/Samantha/i.test(v.name));if(k<0)k=VO.findIndex(v=>v.lang.replace("_","-")=="en-US");s.value=Math.max(k,0);$("#vst").textContent=VO.length?"":"Английские голоса не найдены."}
function say(t){if(!("speechSynthesis"in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";const v=VO[$("#vs").value];if(v)u.voice=v;u.rate=.9;speechSynthesis.speak(u)}
if("speechSynthesis"in window)speechSynthesis.onvoiceschanged=lv;lv();
$("#ex").innerHTML=E.map((_,i)=>`<section class="card" id="e${i}"></section>`).join("");E.forEach((_,i)=>draw(i));drawP();
$("#tst").onclick=()=>{say("Audio test. Build a relationship.");msg("Если вы слышите голос — звук работает")};
$("#all").onclick=()=>cp(txt());$("#pc").onclick=()=>{P={};drawP()};
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,s=b.closest("section"),i=s?+s.id.slice(1):0;
if(a=="say")say(b.dataset.s);else if(a=="chk")chk(i);else if(a=="shw")shw(i);else if(a=="rst")draw(i)});
</script></body></html>
