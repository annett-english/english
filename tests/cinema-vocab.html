<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cinema Vocab: кинотренажёр</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&family=Bungee&display=swap">
<style>
:root{--bg:#f6efe0;--card:#fffaf0;--ink:#1d1a2b;--mut:#6b6580;--acc:#d62839;--gold:#f2a900;--ok:#1f9d55;--no:#d62839;--line:#e3d6b8;--okbg:#d9f3e3;--nobg:#fbdadd;--shbg:#fff0c2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14122a;--card:#1f1c3d;--ink:#f4eee0;--mut:#a9a3c7;--acc:#ff4d5e;--gold:#ffc83d;--ok:#4ade80;--no:#ff6b78;--line:#38336a;--okbg:#17402b;--nobg:#4a1d2a;--shbg:#4a3d10}}
:root[data-theme="dark"]{--bg:#14122a;--card:#1f1c3d;--ink:#f4eee0;--mut:#a9a3c7;--acc:#ff4d5e;--gold:#ffc83d;--ok:#4ade80;--no:#ff6b78;--line:#38336a;--okbg:#17402b;--nobg:#4a1d2a;--shbg:#4a3d10}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Rubik,system-ui,sans-serif}
header{background:#14122a;color:#fff;text-align:center;padding:28px 16px 34px;border-bottom:14px solid transparent;border-image:repeating-linear-gradient(90deg,#14122a 0 14px,#f2a900 14px 26px) 14}
h1{font:2.2rem/1.1 Bungee,Rubik,sans-serif;margin:0;color:#f2a900;letter-spacing:.03em}
header p{margin:8px 0 0;color:#cfc9ee}
.wrap{max-width:1040px;margin:0 auto;padding:18px 14px 60px;display:grid;grid-template-columns:1fr 210px;gap:18px;align-items:start}
@media(max-width:800px){.wrap{grid-template-columns:1fr}aside{order:-1;position:static!important}}
aside{position:sticky;top:12px;background:var(--card);border:2px dashed var(--acc);border-radius:14px;padding:12px}
aside h3{margin:0 0 8px;font:1rem Bungee,sans-serif;color:var(--acc)}
.chip{display:inline-block;margin:2px;padding:2px 9px;border-radius:99px;background:var(--nobg);color:var(--no);font-weight:500;font-size:.88rem}
.chip.g{background:var(--okbg);color:var(--ok)}
.card{background:var(--card);border:1px solid var(--line);border-left:8px solid var(--gold);border-radius:6px 18px 18px 6px;padding:16px 18px;margin-bottom:20px}
.card h2{margin:0 0 2px;font:1.25rem Bungee,sans-serif}
.hint{color:var(--mut);margin:0 0 12px;font-size:.93rem}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.w{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--bg)}
.w b{font-size:1.05rem}.w i{color:var(--mut);font-size:.85rem;display:block;font-style:normal}
.w div{flex:1}
button{font:inherit;cursor:pointer;border:2px solid var(--ink);background:var(--gold);color:#1d1a2b;border-radius:10px;padding:6px 13px;font-weight:700}
button:hover{transform:translateY(-1px)}button.sec{background:transparent;color:var(--ink)}
.sp{background:var(--acc);color:#fff;border-color:var(--acc);border-radius:99px;padding:4px 10px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.score{font-weight:700;color:var(--mut)}
.row{padding:8px 0;border-bottom:1px dashed var(--line)}
.row input{font:inherit;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:3px 8px;width:170px;max-width:100%}
.row textarea{display:block;width:100%;font:inherit;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:8px;margin-top:6px;min-height:64px}
.row.ok input{border-color:var(--ok);background:var(--okbg)}.row.no input{border-color:var(--no);background:var(--nobg)}.row.sh input{border-color:var(--gold);background:var(--shbg)}
.m{margin-left:8px;font-weight:700}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.opt{background:var(--bg);color:var(--ink);border-color:var(--line)}
.opt.ok{background:var(--okbg);border-color:var(--ok)}.opt.no{background:var(--nobg);border-color:var(--no)}.opt.sh{background:var(--shbg);border-color:var(--gold)}
.ph{cursor:pointer;border-radius:6px;padding:1px 0}.ph:hover{background:var(--shbg)}
.ph.sel{background:var(--shbg);outline:2px solid var(--gold)}.ph.ok{background:var(--okbg);outline:2px solid var(--ok)}.ph.no{background:var(--nobg);outline:2px solid var(--no)}.ph.miss{outline:2px dashed var(--no)}
.text{font-size:1.1rem;line-height:2}
.sa button{margin:2px;padding:3px 9px}.sa button.on{background:var(--ink);color:var(--bg)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;opacity:0;transition:opacity .2s;pointer-events:none}.toast.on{opacity:1}
#vs{font-size:.85rem;color:var(--mut)}
</style>
</head>
<body>
<header><h1>🎬 Cinema Vocab</h1><p>15 слов о кино: слушай, пиши, проверяй</p></header>
<div class="wrap"><main id="main"></main>
<aside><h3>Проблемные слова</h3><div id="prob"><span class="hint">Пока пусто. Ошибки появятся здесь.</span></div></aside></div>
<div class="toast" id="toast"></div>
<script>
const W=[["subtitles","/ˈsʌbtaɪtəlz/","субтитры"],["soundtrack","/ˈsaʊndtræk/","саундтрек"],["star","/stɑːr/","звезда"],["special effects","/ˌspeʃəl ɪˈfekts/","спецэффекты"],["set","/set/","съёмочная площадка, декорации"],["critic","/ˈkrɪtɪk/","критик"],["scene","/siːn/","сцена"],["audience","/ˈɔːdiəns/","зрители"],["trailer","/ˈtreɪlər/","трейлер"],["extra","/ˈekstrə/","статист"],["sequel","/ˈsiːkwəl/","сиквел, продолжение"],["plot","/plɒt/","сюжет"],["review","/rɪˈvjuː/","рецензия, отзыв"],["script","/skrɪpt/","сценарий"],["cast","/kæst/","актёрский состав"]];
const RU=Object.fromEntries(W.map(w=>[w[0],w[2]]));
const $=s=>document.querySelector(s);
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const norm=s=>s.toLowerCase().trim().replace(/\s+/g," ");
const prob=new Set();
function bad(w){prob.add(w);$("#prob").innerHTML=[...prob].map(x=>`<span class="chip">${x}</span>`).join("")}
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),1800)}
/* голос */
let voice=null;
function pick(){const v=speechSynthesis.getVoices();voice=v.find(x=>/google us english/i.test(x.name))||v.find(x=>/samantha/i.test(x.name))||v.find(x=>x.lang==="en-US")||v.find(x=>x.lang.startsWith("en"))||null;
const vs=$("#vs");if(!vs)return;vs.textContent=voice?"Голос: "+voice.name+" ✓":"Английский голос не найден. Откройте страницу в Chrome или Safari.";}
if("speechSynthesis" in window){pick();speechSynthesis.onvoiceschanged=pick}
function speak(t,cb){if(!("speechSynthesis" in window)){toast("Озвучка недоступна в этом браузере");return}
speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.9;if(voice)u.voice=voice;if(cb)u.onend=cb;speechSynthesis.speak(u)}
function playAll(){let i=0;const n=()=>{if(i<W.length)speak(W[i++][0],()=>setTimeout(n,500))};n()}
/* помощники */
const sec=(id,t,h,body,btns)=>`<section class="card" id="${id}"><h2>${t}</h2><p class="hint">${h}</p>${body}<div class="bar">${btns}<span class="score"></span></div></section>`;
const bCheck='<button data-a="check">Проверить</button><button class="sec" data-a="show">Показать ответы</button>';
const bCopy='<button data-a="copy">📋 Скопировать мои идеи</button>';
function typed(id,t,h,items){return sec(id,t,h,items.map(([q,a,w])=>`<div class="row" data-ans="${a.join("|")}" data-w="${w}">${q.replace("___",'<input autocomplete="off" autocapitalize="off" spellcheck="false">')}<span class="m"></span></div>`).join(""),bCheck)}
function free(id,t,h,items,extra=""){return sec(id,t,h,extra+items.map(q=>`<div class="row"><span class="q">${q}</span><textarea placeholder="Пишите здесь..."></textarea></div>`).join(""),bCopy)}
function choice(id,t,h,items,intro=""){let prev=-1;
const html=items.map(([q,c,w],n)=>{let o,k=0;do{o=shuf([c,...shuf(W.map(x=>x[2]).filter(x=>x!==c)).slice(0,3)]);k++}while(o.indexOf(c)===prev&&k<9);prev=o.indexOf(c);
return `<div class="row" data-c="${c}" data-w="${w}"><div>${q}</div><div class="opts">${o.map(x=>`<button class="opt">${x}</button>`).join("")}<button class="sec" data-a="one">👁</button></div></div>`}).join("");
return sec(id,t,h,intro+html,"")}
/* контент */
const gap=[["I always watch the ___ before I buy a ticket.",["trailer"],"trailer"],["He learned his lines from the ___.",["script"],"script"],["I cannot follow films in French without ___.",["subtitles"],"subtitles"],["The ___ clapped when the film ended.",["audience"],"audience"],["They built a huge ___ in the desert.",["set"],"set"],["A ___ said the acting was weak.",["critic"],"critic"],["The film was a hit, so they made a ___.",["sequel"],"sequel"],["I loved the ___: the music was perfect.",["soundtrack"],"soundtrack"],["The ___ of the film is too complicated.",["plot"],"plot"],["The ___ includes many famous actors.",["cast"],"cast"]];
const ctx=[["The <b>special effects</b> were so good that the dragon looked real.","спецэффекты","special effects"],["He was only an <b>extra</b>, so he had no lines in the film.","статист","extra"],["I cannot wait for the <b>sequel</b>: the first part ended so suddenly!","сиквел, продолжение","sequel"],["The <b>critic</b> said the acting was weak and the ending predictable.","критик","critic"],["The <b>audience</b> laughed and clapped at the end.","зрители","audience"],["In the final <b>scene</b>, the hero finally meets his father.","сцена","scene"]];
const wild=[["Last Friday I went to the cinema with my friends. ",""],["We had seen the trailer online, ","trailer"],["so the whole audience was excited. ","audience"],["The film is a sequel, ","sequel"],["and the main star plays a spy. ","star"],["The plot was a bit slow, ","plot"],["but the special effects were amazing. ","special effects"],["The soundtrack made every scene better. ","soundtrack,scene"],["After the film we ate pizza. ",""],["A critic wrote a bad review, ","critic,review"],["but we loved it. ",""],["Then we went home by bus. ",""]];
const five=shuf(W).slice(0,5).map(x=>x[0]);
$("#main").innerHTML=
sec("s0","Слова на сегодня","Прослушайте каждое слово. Голос: Google US English или Samantha.",`<div class="words">${W.map(w=>`<div class="w"><div><b>${w[0]}</b><i>${w[1]}</i>${w[2]}</div><button class="sp" data-say="${w[0]}">🔊</button></div>`).join("")}</div><div id="vs"></div>`,'<button data-a="all">▶ Слушать все слова</button>')+
sec("s1","1. Find them in the wild","Кликайте по целым фразам, где спрятаны слова из списка. Можно выбрать несколько.",`<div class="text">${wild.map(([t,w])=>`<span class="ph" data-w="${w}">${t}</span>`).join("")}</div>`,bCheck)+
choice("s2","2. Listen &amp; pick","Нажмите 🔊, послушайте слово и выберите значение. 👁 показывает ответ.",shuf(W).slice(0,8).map(w=>[`<button class="sp" data-say="${w[0]}">🔊 Слушать</button>`,w[2],w[0]]))+
typed("s3","3. Перевод","Впишите английское слово.",shuf(W).map(w=>[`${w[2]} = ___`,[w[0]],w[0]]))+
typed("s4","4. Вставьте слово по контексту","Впишите нужное слово из списка.",shuf(gap).slice(0,8))+
choice("s5","5. Угадайте значение по предложению","Что значит выделенное слово?",shuf(ctx))+
free("s6","6. Rephrase","Перепишите предложение своими словами, используя слово в скобках.",shuf([["The story of the film was boring. (use: plot)"],["Before the film they showed a short advert. (use: trailer)"],["I read what the film critic wrote about the movie. (use: review)"],["The actors in the film were all famous. (use: cast)"]]).map(x=>x[0]))+
free("s7","7. Expand the sentence","Сделайте предложение длиннее: добавьте детали и одно слово из списка.",shuf(["The film was good.","The scene was exciting.","The script was funny.","The set looked real."]))+
free("s8","8. Finish the sentence","Закончите предложения со своими идеями.",shuf(["My favourite sequel is ... because ...","If I were a critic, I would write a review about ...","The best soundtrack I know is ... because ...","I would love to be an extra in a scene where ...","The plot of my dream film is about ..."]).slice(0,4))+
free("s9","9. Story with 5 words","Напишите мини-рассказ (3-5 предложений) со всеми пятью словами.",["Your story:"],`<div id="five" class="bar">${five.map(w=>`<span class="chip" data-f="${w}">${w}</span>`).join("")}<b id="fc">0/5</b></div>`)+
sec("s10","10. Write what you remember","Не подглядывайте! Впишите слова по памяти через запятую.",'<div class="row"><textarea id="rec" placeholder="trailer, plot, ..."></textarea></div><div id="recout"></div>',bCheck)+
sec("s11","11. Что я теперь знаю","Оцените себя по каждому слову.",`<div class="sa">${W.map(w=>`<div class="row" data-w="${w[0]}"><b>${w[0]}</b> <span class="b"><button data-s="2">✅ знаю</button><button data-s="1">🤔 не уверен</button><button data-s="0">❌ повторю</button></span></div>`).join("")}</div><div id="sum" class="hint"></div>`,'<button data-a="all2">📋 Скопировать все мои идеи</button>');
pick();
/* пересчёт баллов */
const score=(s,ok,n)=>s.querySelector(".score").textContent=`Верно: ${ok} из ${n}`;
function copy(text){text=text.trim();const ok=()=>toast("Скопировано ✓");
if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(text).then(ok,fb);else fb();
function fb(){const t=document.createElement("textarea");t.value=text;document.body.appendChild(t);t.select();try{document.execCommand("copy");ok()}catch(e){toast("Выделите и скопируйте текст вручную")}t.remove()}}
const own=s=>"== "+s.querySelector("h2").textContent+" ==\n"+[...s.querySelectorAll(".row")].map(r=>(r.querySelector(".q")?.textContent||"")+"\n→ "+r.querySelector("textarea").value).join("\n\n");
function recheck(){const t=$("#rec").value.toLowerCase();return W.map(w=>[w[0],new RegExp("\\b"+w[0]+"\\b").test(t)])}
document.addEventListener("click",e=>{const b=e.target.closest("button,.ph");if(!b)return;
if(b.dataset.say){speak(b.dataset.say);return}
const s=b.closest("section");
if(b.classList.contains("ph")){if(!b.classList.contains("ok")&&!b.classList.contains("no"))b.classList.toggle("sel");return}
if(b.classList.contains("opt")){const r=b.closest(".row");if(r.dataset.done)return;r.dataset.done=1;const ok=b.textContent===r.dataset.c;
b.classList.add(ok?"ok":"no");if(!ok){bad(r.dataset.w);r.querySelectorAll(".opt").forEach(o=>{if(o.textContent===r.dataset.c)o.classList.add("sh")})}
score(s,s.querySelectorAll(".opt.ok").length,s.querySelectorAll(".row").length);return}
if(b.dataset.s){b.parentNode.querySelectorAll("button").forEach(x=>x.classList.remove("on"));b.classList.add("on");
const all=[...document.querySelectorAll("#s11 .on")].map(x=>+x.dataset.s);$("#sum").textContent=`Знаю: ${all.filter(x=>x==2).length}, не уверен: ${all.filter(x=>x==1).length}, повторю: ${all.filter(x=>x==0).length}`;return}
const a=b.dataset.a;if(!a)return;
if(a==="all")return playAll();
if(a==="all2")return copy(["s6","s7","s8","s9"].map(i=>own($("#"+i))).join("\n\n"));
if(a==="copy")return copy(own(s));
if(a==="one"){const r=b.closest(".row");r.querySelectorAll(".opt").forEach(o=>{if(o.textContent===r.dataset.c)o.classList.add("sh")});return}
if(s.id==="s1"){let ok=0,tot=0;s.querySelectorAll(".ph").forEach(p=>{const t=!!p.dataset.w;p.classList.remove("sel","ok","no","miss");
if(a==="show"){if(t)p.classList.add("ok");return}
if(t)tot++;const was=p.dataset.pick==="1";
if(was){p.classList.add(t?"ok":"no");if(t)ok++}else if(t)p.classList.add("miss")});
if(a==="check")score(s,ok,tot);return}
if(s.id==="s10"){const r=recheck(),f=r.filter(x=>x[1]).length;
$("#recout").innerHTML=r.map(x=>`<span class="chip ${x[1]?"g":""}">${x[0]}</span>`).join("");
if(a==="check"){score(s,f,15);r.forEach(x=>{if(!x[1])bad(x[0])})}else{$("#recout").innerHTML=W.map(w=>`<span class="chip g">${w[0]}</span>`).join("")}return}
if(s.querySelector("[data-ans]")){let ok=0;s.querySelectorAll("[data-ans]").forEach(r=>{const i=r.querySelector("input"),m=r.querySelector(".m"),A=r.dataset.ans.split("|");r.classList.remove("ok","no","sh");
if(a==="show"){i.value=A[0];r.classList.add("sh");m.textContent="";return}
const g=A.includes(norm(i.value));r.classList.add(g?"ok":"no");m.textContent=g?"✓":"✗";m.style.color=g?"var(--ok)":"var(--no)";if(g)ok++;else bad(r.dataset.w)});
if(a==="check")score(s,ok,s.querySelectorAll("[data-ans]").length)}});
/* для задания 1 запоминаем выбор до проверки */
document.addEventListener("click",e=>{const p=e.target.closest(".ph");if(p&&!p.classList.contains("ok")&&!p.classList.contains("no"))p.dataset.pick=p.classList.contains("sel")?"1":"0"},true);
/* ставим pick после переключения */
document.addEventListener("click",e=>{const p=e.target.closest(".ph");if(p)setTimeout(()=>{p.dataset.pick=p.classList.contains("sel")?"1":"0"},0)});
/* задание 1: «показать» помечает пропущенные красным, поэтому дублируем логику проверки */
$("#s1").addEventListener("click",e=>{if(e.target.dataset.a==="check"){const m=[...$("#s1").querySelectorAll(".ph")].filter(p=>p.dataset.w&&p.dataset.pick!=="1");m.forEach(p=>p.dataset.w.split(",").forEach(bad));
$("#s1").querySelectorAll(".ph").forEach(p=>{if(p.dataset.pick==="1"){p.classList.add(p.dataset.w?"ok":"no")}})}});
/* счётчик слов в рассказе */
$("#s9 textarea").addEventListener("input",e=>{const t=e.target.value.toLowerCase();let n=0;
document.querySelectorAll("[data-f]").forEach(c=>{const u=new RegExp("\\b"+c.dataset.f+"\\b").test(t);c.classList.toggle("g",u);if(u)n++});$("#fc").textContent=n+"/5"});
</script>
</body>
</html>
