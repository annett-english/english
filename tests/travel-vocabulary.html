<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travel Vocabulary Practice</title>
<style>
  :root{
    --blue:#2563eb; --blue-dark:#1d4ed8; --green:#16a34a; --red:#dc2626;
    --bg:#f4f6fb; --card:#ffffff; --border:#e2e8f0; --text:#1e293b; --muted:#64748b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Segoe UI',Roboto,Arial,sans-serif; background:var(--bg); color:var(--text);
    padding:24px;
  }
  h1{font-size:26px; margin-bottom:4px;}
  .subtitle{color:var(--muted); margin-bottom:20px;}
  .layout{display:flex; gap:20px; align-items:flex-start;}
  .main{flex:1; min-width:0;}
  .sidebar{
    width:230px; position:sticky; top:20px; background:var(--card); border:1px solid var(--border);
    border-radius:12px; padding:16px; flex-shrink:0;
  }
  .sidebar h3{margin-top:0; font-size:15px;}
  .sidebar table{width:100%; border-collapse:collapse; font-size:13px;}
  .sidebar td{padding:4px 2px; border-bottom:1px solid var(--border);}
  .sidebar .empty{color:var(--muted); font-size:13px;}
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:12px; padding:20px;
    margin-bottom:22px;
  }
  .card h2{margin-top:0; font-size:19px; display:flex; align-items:center; gap:8px;}
  .badge{
    background:var(--blue); color:white; font-size:12px; padding:2px 8px; border-radius:20px;
  }
  .instructions{color:var(--muted); font-size:14px; margin-bottom:14px;}
  table.vocab{width:100%; border-collapse:collapse; font-size:14px;}
  table.vocab th, table.vocab td{padding:8px 6px; border-bottom:1px solid var(--border); text-align:left; vertical-align:top;}
  table.vocab th{color:var(--muted); font-weight:600; font-size:12px; text-transform:uppercase;}
  .play-btn{
    background:var(--blue); color:white; border:none; border-radius:6px; width:30px; height:30px;
    cursor:pointer; font-size:14px;
  }
  .play-btn:hover{background:var(--blue-dark);}
  .q-row{
    display:flex; gap:10px; align-items:center; padding:10px 0; border-bottom:1px dashed var(--border); flex-wrap:wrap;
  }
  .q-num{width:22px; color:var(--muted); font-weight:600;}
  .q-prompt{flex:1; min-width:200px;}
  .q-prompt small{display:block; color:var(--muted); font-size:12px; margin-top:2px;}
  input[type=text]{
    padding:8px 10px; border:1px solid var(--border); border-radius:8px; font-size:14px; width:260px; max-width:100%;
  }
  input.correct{border-color:var(--green); background:#f0fdf4;}
  input.incorrect{border-color:var(--red); background:#fef2f2;}
  select{padding:7px; border-radius:8px; border:1px solid var(--border); font-size:14px;}
  select.correct{border-color:var(--green); background:#f0fdf4;}
  select.incorrect{border-color:var(--red); background:#fef2f2;}
  textarea{
    width:100%; min-height:44px; padding:8px 10px; border:1px solid var(--border); border-radius:8px;
    font-size:14px; font-family:inherit; resize:vertical;
  }
  .answer-hint{font-size:13px; color:var(--blue-dark); margin-top:4px; display:none;}
  .answer-hint.show{display:block;}
  .btn{
    background:var(--blue); color:#fff; border:none; padding:9px 16px; border-radius:8px; cursor:pointer;
    font-size:14px; margin-right:8px; margin-top:10px;
  }
  .btn:hover{background:var(--blue-dark);}
  .btn.secondary{background:#64748b;}
  .btn.secondary:hover{background:#475569;}
  .btn.green{background:var(--green);}
  .result-line{font-size:13px; font-weight:600; margin-top:10px;}
  .cat-row{display:flex; align-items:center; justify-content:space-between; padding:8px 0; border-bottom:1px dashed var(--border);}
  .cat-buttons button{
    border:1px solid var(--border); background:#fff; padding:6px 12px; border-radius:20px; cursor:pointer; font-size:13px; margin-left:6px;
  }
  .cat-buttons button.active-yes{background:#dcfce7; border-color:var(--green); color:#166534;}
  .cat-buttons button.active-no{background:#fee2e2; border-color:var(--red); color:#991b1b;}
  .note{font-size:12px; color:var(--muted); font-style:italic; margin-top:8px;}
</style>
</head>
<body>

<h1>✈️ Travel Vocabulary Practice</h1>
<p class="subtitle">Повторение слов + 9 письменных упражнений. Прописывайте слова руками — это лучше запоминается!</p>

<div class="layout">
  <div class="main">

    <!-- WORD LIST -->
    <div class="card">
      <h2>📖 Слова для повторения <span class="badge">14 фраз</span></h2>
      <p class="instructions">Нажмите 🔊, чтобы прослушать произношение (голос Google US English).</p>
      <table class="vocab">
        <thead><tr><th style="width:36px"></th><th>English</th><th>Transcription</th><th>Русский</th></tr></thead>
        <tbody id="vocabTableBody"></tbody>
      </table>
    </div>

    <!-- EXERCISES CONTAINER -->
    <div id="exercisesContainer"></div>

  </div>

  <div class="sidebar">
    <h3>⚠️ Проблемные слова</h3>
    <div id="problemWords"><div class="empty">Пока ошибок нет 🙂</div></div>
  </div>
</div>

<script>
/* ===================== DATA ===================== */
const VOCAB = [
 {id:1, full:"book a flight / a train / accommodation", short:"book a flight", ru:"забронировать билет / поезд / жильё",
  ipa:"/bʊk ə flaɪt/", def:"to reserve a place on a plane, train, etc. before you travel",
  blanked:"b__k a fl__ht", collocGap:"___ a flight", collocAnswer:"book",
  firstHalf:"book", secondHalf:"a flight",
  mistakeSentence:"I want to book a flights to Rome next month.", mistakeAnswer:"a flight",
  starter:"This year I really want to book a flight to"},

 {id:2, full:"go by train / bus / plane", short:"go by train", ru:"ехать на поезде / автобусе / самолёте",
  ipa:"/ɡəʊ baɪ treɪn/", def:"to travel using a particular kind of transport",
  blanked:"g_ b_ tr__n", collocGap:"___ by train", collocAnswer:"go",
  firstHalf:"go", secondHalf:"by train",
  mistakeSentence:"We usually going by train when we travel around Europe.", mistakeAnswer:"go",
  starter:"I love it when we go by train because"},

 {id:3, full:"rent a car / a flat", short:"rent a car", ru:"арендовать машину / квартиру",
  ipa:"/rent ə kɑː/", def:"to pay money regularly to use something that belongs to someone else, e.g. a car or a flat",
  blanked:"r_nt a c_r", collocGap:"___ a car", collocAnswer:"rent",
  firstHalf:"rent", secondHalf:"a car",
  mistakeSentence:"She wants to rent car for the weekend trip.", mistakeAnswer:"rent a car",
  starter:"If I rent a car on my next trip, I will"},

 {id:4, full:"stay in a hotel / hostel", short:"stay in a hotel", ru:"остановиться в отеле / хостеле",
  ipa:"/steɪ ɪn ə həʊˈtel/", def:"to live somewhere for a short time as a visitor",
  blanked:"st_y _n a h_t_l", collocGap:"___ in a hotel", collocAnswer:"stay",
  firstHalf:"stay", secondHalf:"in a hotel",
  mistakeSentence:"They stayed on a hotel near the beach.", mistakeAnswer:"in a hotel",
  starter:"When I stay in a hotel, I always"},

 {id:5, full:"eat out (in local restaurants)", short:"eat out", ru:"есть вне дома (в местных ресторанах)",
  ipa:"/iːt aʊt/", def:"to have a meal at a restaurant instead of at home",
  blanked:"e_t _ut", collocGap:"___ out", collocAnswer:"eat",
  firstHalf:"eat", secondHalf:"out",
  mistakeSentence:"We like to eating out on Fridays with our friends.", mistakeAnswer:"eat out",
  starter:"I really enjoy eating out because"},

 {id:6, full:"visit museums and art galleries", short:"visit museums and art galleries", ru:"посещать музеи и художественные галереи",
  ipa:"/ˈvɪzɪt mjuːˈziːəmz ənd ɑːt ˈɡælriz/", def:"to go to places where art and historical objects are shown to the public",
  blanked:"v_s_t mus__ms _nd _rt g_ll_r__s", collocGap:"___ museums and art galleries", collocAnswer:"visit",
  firstHalf:"visit", secondHalf:"museums and art galleries",
  mistakeSentence:"Tourists often visits museums and art gallery in the city centre.", mistakeAnswer:"visit museums and art galleries",

 {id:7, full:"buy souvenirs", short:"buy souvenirs", ru:"покупать сувениры",

  blanked:"b_y s_uven_rs", collocGap:"___ souvenirs", collocAnswer:"buy",

  mistakeSentence:"I bought souvenir for my family from every city.", mistakeAnswer:"souvenirs",
  starter:"My favourite souvenirs to buy are"},

 {id:8, full:"have a good time", short:"have a good time", ru:"хорошо проводить время",
  ipa:"/hæv ə ɡʊd taɪm/", def:"to enjoy yourself",
  blanked:"h_ve a g__d t_me", collocGap:"___ a good time", collocAnswer:"have",
  firstHalf:"have", secondHalf:"a good time",
  mistakeSentence:"I hope you have the good time on your trip.", mistakeAnswer:"a good time",
  starter:"To have a good time on holiday, I usually"},

 {id:9, full:"meet new people", short:"meet new people", ru:"знакомиться с новыми людьми",
  ipa:"/miːt njuː ˈpiːpl/", def:"to get to know people you have not known before",
  blanked:"m__t n_w pe_ple", collocGap:"___ new people", collocAnswer:"meet",
  firstHalf:"meet", secondHalf:"new people",
  mistakeSentence:"It's fun to meeting new people while travelling.", mistakeAnswer:"meet new people",
  starter:"When I meet new people abroad, I"},

 {id:10, full:"leave a review of (the hotel)", short:"leave a review", ru:"оставить отзыв о (отеле)",
  ipa:"/liːv ə rɪˈvjuː/", def:"to write your opinion about a place or service online after using it",
  blanked:"le_ve a rev__w", collocGap:"___ a review", collocAnswer:"leave",

 {id:11, full:"have an adventure", short:"have an adventure", ru:"пережить приключение",

  starter:"My idea of having an adventure is"},

  blanked:"m_ke y__r dre_ms c_me tr_e", collocGap:"make ___ dreams come true", collocAnswer:"your",
  firstHalf:"make", secondHalf:"your dreams come true",
  mistakeSentence:"Travelling helps make you dreams come true.", mistakeAnswer:"your",
  starter:"Travelling can make your dreams come true when"},

 {id:13, full:"do courses", short:"do courses", ru:"проходить курсы",

  blanked:"d_ c__rses", collocGap:"___ courses", collocAnswer:"do",
  firstHalf:"do", secondHalf:"courses",

  starter:"I would like to do courses in"},

 {id:14, full:"make sure", short:"make sure", ru:"убедиться",
  ipa:"/meɪk ʃʊə/", def:"to check something so that you are certain it is true or has been done",
  blanked:"m_ke s_re", collocGap:"___ sure", collocAnswer:"make",

  starter:"Before travelling, make sure you"}

const VALID_COMBOS = VOCAB.map(v => norm(v.firstHalf + " " + v.secondHalf));

/* ===================== HELPERS ===================== */
function norm(s){
  return (s||"").toString().trim().toLowerCase().replace(/[.,!?;:]/g,"").replace(/\s+/g," ");
}
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function pick10(){ return shuffle(VOCAB).slice(0,10); }

/* problem words tracker */
const mistakes = {}; // id -> count
function registerMistake(id){
  mistakes[id] = (mistakes[id]||0)+1;
  renderProblemWords();
}
function renderProblemWords(){
  const box = document.getElementById('problemWords');
  const entries = Object.entries(mistakes).sort((a,b)=>b[1]-a[1]);
  if(entries.length===0){
    box.innerHTML = '<div class="empty">Пока ошибок нет 🙂</div>';
    return;
  }
  let html = '<table>';
  entries.slice(0,10).forEach(([id,count])=>{
    const v = VOCAB.find(x=>x.id==id);
    html += `<tr><td>${v.short}</td><td style="text-align:right;color:var(--red);font-weight:600;">${count}</td></tr>`;
  });
  html += '</table>';
  box.innerHTML = html;
}

/* speech synthesis */
let voices = [];
function loadVoices(){ voices = window.speechSynthesis.getVoices(); }
loadVoices();
if(typeof window.speechSynthesis !== 'undefined'){
  window.speechSynthesis.onvoiceschanged = loadVoices;
}
function speak(text){
  if(!('speechSynthesis' in window)){ alert('Синтез речи не поддерживается в этом браузере'); return; }
  const utter = new SpeechSynthesisUtterance(text);
  const v = voices.find(v=>v.name.includes('Google US English')) || voices.find(v=>v.lang==='en-US') || voices[0];
  if(v) utter.voice = v;
  utter.lang = 'en-US';
  utter.rate = 0.9;
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(utter);
}

/* ===================== RENDER VOCAB TABLE ===================== */
const vocabBody = document.getElementById('vocabTableBody');
VOCAB.forEach(v=>{
  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td><button class="play-btn" onclick="speak('${v.short.replace(/'/g,"\\'")}')">🔊</button></td>
    <td><strong>${v.full}</strong></td>
    <td style="color:var(--muted)">${v.ipa}</td>
    <td>${v.ru}</td>`;
  vocabBody.appendChild(tr);
});

/* ===================== EXERCISE BUILDERS ===================== */
const container = document.getElementById('exercisesContainer');

function makeCard(title, instructions){
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<h2>${title}</h2><p class="instructions">${instructions}</p><div class="qs"></div>`;
  container.appendChild(card);
  return card.querySelector('.qs');
}
function addButtons(qsEl, checkFn, showFn){
  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <button class="btn" data-role="check">✅ Проверить</button>
    <button class="btn secondary" data-role="show">👁 Показать ответы</button>
    <div class="result-line"></div>`;
  wrap.querySelector('[data-role="check"]').onclick = checkFn;
  wrap.querySelector('[data-role="show"]').onclick = showFn;
  qsEl.parentElement.appendChild(wrap);
  return wrap.querySelector('.result-line');
}

/* ---------- Exercise 1: Fill in missing letters ---------- */
(function ex1(){
  const items = pick10();
  const qs = makeCard('1️⃣ Вставьте пропущенные буквы', 'Впишите фразу целиком, восстановив пропущенные буквы.');
  items.forEach((v,i)=>{
    const row = document.createElement('div'); row.className='q-row';
    row.innerHTML = `<div class="q-num">${i+1}.</div>
      <div class="q-prompt"><strong>${v.blanked}</strong><small>${v.ru}</small></div>
      <input type="text" data-id="${v.id}" placeholder="Введите слово...">
      <div class="answer-hint">Ответ: ${v.short}</div>`;
    qs.appendChild(row);
  });
  const result = addButtons(qs, ()=>{
    let correct=0;
    qs.querySelectorAll('input').forEach(inp=>{
      const v = VOCAB.find(x=>x.id==inp.dataset.id);
      const ok = norm(inp.value)===norm(v.short);
      inp.classList.remove('correct','incorrect');
      inp.classList.add(ok?'correct':'incorrect');
      if(ok) correct++; else registerMistake(v.id);
    });
    result.textContent = `Правильно: ${correct}/10`;
  }, ()=>{
    qs.querySelectorAll('.answer-hint').forEach(h=>h.classList.toggle('show'));
  });
})();

/* ---------- Exercise 6: Match the halves ---------- */
(function ex6(){
  const items = pick10();
  const rightOptions = shuffle(items.map(v=>v.secondHalf));
  const qs = makeCard('6️⃣ Соедините половинки выражений', 'Выберите правильное окончание для каждого начала фразы.');
  items.forEach((v,i)=>{
    const row = document.createElement('div'); row.className='q-row';
    const options = rightOptions.map(o=>`<option value="${o}">${o}</option>`).join('');
    row.innerHTML = `<div class="q-num">${i+1}.</div>
      <div class="q-prompt"><strong>${v.firstHalf}</strong> ...</div>
      <select data-id="${v.id}"><option value="">— выберите —</option>${options}</select>
      <div class="answer-hint">Ответ: ${v.firstHalf} ${v.secondHalf}</div>`;
    qs.appendChild(row);
  });
  const result = addButtons(qs, ()=>{
    let correct=0;
    qs.querySelectorAll('select').forEach(sel=>{
      const v = VOCAB.find(x=>x.id==sel.dataset.id);
      const combo = norm(v.firstHalf + " " + sel.value);
      const ok = VALID_COMBOS.includes(combo) && sel.value !== "";
      sel.classList.remove('correct','incorrect');
      sel.classList.add(ok?'correct':'incorrect');
      if(ok) correct++; else registerMistake(v.id);
    });
    result.textContent = `Правильно: ${correct}/10`;
  }, ()=>{
    qs.querySelectorAll('.answer-hint').forEach(h=>h.classList.toggle('show'));
  });
})();

/* ---------- Exercise 9: Complete the sentences (own ideas) ---------- */
(function ex9(){
  const items = pick10();
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<h2>9️⃣ Закончите предложения своими идеями ✍️</h2>
    <p class="instructions">Допишите каждое предложение своими мыслями. Правильного ответа нет — важна практика письма.</p>
    <div class="qs"></div>
    <button class="btn green" id="copyAllBtn">📋 Скопировать все ответы</button>
    <span id="copyStatus" style="font-size:13px;color:var(--green);margin-left:8px;"></span>`;
  container.appendChild(card);
  const qs = card.querySelector('.qs');
  items.forEach((v,i)=>{
    const row = document.createElement('div'); row.className='q-row';
    row.innerHTML = `<div class="q-num">${i+1}.</div>
      <div class="q-prompt" style="flex:0 0 100%;">
        <strong>${v.starter} ...</strong>
        <textarea data-num="${i+1}" data-starter="${v.starter.replace(/"/g,'&quot;')}" placeholder="Продолжите предложение..."></textarea>
      </div>`;
    qs.appendChild(row);
  });
  card.querySelector('#copyAllBtn').onclick = ()=>{
    let text = '';
    qs.querySelectorAll('textarea').forEach(t=>{
      const val = t.value.trim();
      text += `${t.dataset.num}. ${t.dataset.starter} ${val}\n`;
    });
    navigator.clipboard.writeText(text).then(()=>{
      document.getElementById('copyStatus').textContent = 'Скопировано! ✅';
      setTimeout(()=>{document.getElementById('copyStatus').textContent='';}, 2500);
    }).catch(()=>{
      alert('Не удалось скопировать автоматически. Вот текст:\n\n'+text);
    });
  };
})();
