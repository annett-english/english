<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vocabulary Workbook — тетрадь слов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF7F0;
    --paper-2:#F3EEDF;
    --ink:#263238;
    --ink-soft:#5B6670;
    --accent:#2F6F63;
    --accent-dark:#1F4E45;
    --amber:#C97B2E;
    --line:#DCD5C0;
    --error:#B3413A;
    --error-bg:#FBEAE8;
    --success:#2E8B57;
    --success-bg:#EAF5EE;
    --shadow: 0 2px 10px rgba(38,42,33,.08);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    background-image:
      linear-gradient(var(--paper) 39px, var(--line) 40px);
    background-size: 100% 40px;
  }
  .wrap{
    max-width:1180px;
    margin:0 auto;
    padding:28px 24px 80px;
  }
  header.top{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:20px;
    margin-bottom:18px;
    padding-bottom:14px;
    border-bottom:3px solid var(--ink);
  }
  h1{
    font-family:'Fraunces',serif;
    font-size:2.5rem;
    font-weight:700;
    margin:0;
    line-height:1.05;
  }
  .subtitle{
    font-family:'Caveat',cursive;
    font-size:1.4rem;
    color:var(--accent-dark);
    margin-top:4px;
  }
  .unit-tag{
    font-family:'Fraunces',serif;
    font-style:italic;
    color:var(--ink-soft);
    font-size:.95rem;
    text-align:right;
  }

  /* ===== word reminder table ===== */
  .word-panel{
    background:#fff;
    border:1px solid var(--line);
    border-radius:10px;
    box-shadow:var(--shadow);
    padding:18px 20px 20px;
    margin-bottom:26px;
  }
  .word-panel h2{
    font-family:'Fraunces',serif;
    font-size:1.3rem;
    margin:0 0 4px;
  }
  .word-panel p.hint{
    margin:0 0 14px;
    color:var(--ink-soft);
    font-size:.9rem;
  }
  .word-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
    gap:10px;
  }
  .word-card{
    display:flex;
    align-items:center;
    gap:10px;
    border:1px solid var(--line);
    border-radius:8px;
    padding:9px 11px;
    background:var(--paper-2);
  }
  .word-card .num{
    font-family:'Fraunces',serif;
    font-weight:700;
    color:var(--accent);
    font-size:1rem;
    width:20px;
  }
  .word-card .info{flex:1; min-width:0;}
  .word-card .en{font-weight:600; font-size:.95rem;}
  .word-card .ipa{font-size:.8rem; color:var(--ink-soft); font-family:'Fraunces',serif;}
  .word-card .ru{font-size:.82rem; color:var(--ink-soft); margin-top:1px;}
  .listen-btn{
    flex-shrink:0;
    width:32px;height:32px;
    border-radius:50%;
    border:1px solid var(--accent);
    background:#fff;
    color:var(--accent);
    cursor:pointer;
    font-size:.95rem;
    display:flex;align-items:center;justify-content:center;
    transition:.15s;
  }
  .listen-btn:hover{background:var(--accent); color:#fff;}

  /* ===== layout: main + sidebar ===== */
  .layout{
    display:grid;
    grid-template-columns:1fr 250px;
    gap:22px;
    align-items:start;
  }
  @media (max-width:860px){
    .layout{grid-template-columns:1fr;}
    .sidebar{order:-1;}
  }

  /* ===== tabs ===== */
  .tabs{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-bottom:0;
  }
  .tab-btn{
    font-family:'Fraunces',serif;
    font-size:.85rem;
    font-weight:600;
    padding:9px 14px 8px;
    border:1px solid var(--ink);
    border-bottom:none;
    background:var(--paper-2);
    color:var(--ink-soft);
    border-radius:8px 8px 0 0;
    cursor:pointer;
    position:relative;
    top:1px;
  }
  .tab-btn.active{
    background:#fff;
    color:var(--ink);
    box-shadow:0 -2px 6px rgba(0,0,0,.04);
  }
  .tab-btn .n{color:var(--amber); margin-right:4px;}

  .exercise-panel{
    background:#fff;
    border:1px solid var(--ink);
    border-radius:0 10px 10px 10px;
    box-shadow:var(--shadow);
    padding:22px 24px 26px;
    display:none;
  }
  .exercise-panel.active{display:block;}
  .ex-title{
    font-family:'Fraunces',serif;
    font-size:1.35rem;
    margin:0 0 4px;
  }
  .ex-desc{
    color:var(--ink-soft);
    font-size:.9rem;
    margin:0 0 18px;
  }

  .item{
    display:grid;
    grid-template-columns:28px 1fr;
    gap:10px;
    padding:12px 0;
    border-bottom:1px dashed var(--line);
  }
  .item:last-of-type{border-bottom:none;}
  .item .idx{
    font-family:'Fraunces',serif;
    font-weight:700;
    color:var(--amber);
  }
  .item .prompt{
    font-size:.98rem;
    margin-bottom:8px;
    line-height:1.4;
  }
  .item .prompt b{color:var(--accent-dark);}
  .item input[type=text]{
    width:100%;
    max-width:460px;
    padding:8px 10px;
    border:1.5px solid var(--line);
    border-radius:6px;
    font-family:'Fraunces',serif;
    font-size:1rem;
    background:var(--paper);
    color:var(--ink);
  }
  .item input[type=text]:focus{outline:2px solid var(--accent); border-color:var(--accent);}
  .item input.correct{border-color:var(--success); background:var(--success-bg);}
  .item input.wrong{border-color:var(--error); background:var(--error-bg);}
  .feedback{
    display:inline-block;
    margin-left:8px;
    font-size:.85rem;
    font-weight:600;
  }
  .feedback.correct{color:var(--success);}
  .feedback.wrong{color:var(--error);}
  .answer-reveal{
    margin-top:5px;
    font-size:.85rem;
    color:var(--accent-dark);
    font-style:italic;
    display:none;
  }
  .answer-reveal.show{display:block;}

  .choice-row{display:flex; flex-direction:column; gap:6px; max-width:600px;}
  .choice-opt{
    border:1.5px solid var(--line);
    border-radius:6px;
    padding:8px 12px;
    cursor:pointer;
    font-size:.92rem;
    display:flex;
    gap:8px;
  }
  .choice-opt:hover{border-color:var(--accent);}
  .choice-opt.selected{border-color:var(--accent); background:var(--paper-2);}
  .choice-opt.correct{border-color:var(--success); background:var(--success-bg);}
  .choice-opt.wrong{border-color:var(--error); background:var(--error-bg);}
  .choice-opt .letter{font-family:'Fraunces',serif; font-weight:700; color:var(--amber);}

  .mini-listen{
    display:inline-flex;
    align-items:center;
    gap:6px;
    border:1px solid var(--accent);
    color:var(--accent);
    background:#fff;
    border-radius:14px;
    padding:4px 10px;
    font-size:.82rem;
    cursor:pointer;
    margin-bottom:8px;
  }
  .mini-listen:hover{background:var(--accent); color:#fff;}

  .toolbar{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:18px;
    padding-top:16px;
    border-top:2px solid var(--ink);
    align-items:center;
  }
  .btn{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:.88rem;
    padding:9px 16px;
    border-radius:20px;
    border:1.5px solid var(--ink);
    background:var(--ink);
    color:#fff;
    cursor:pointer;
  }
  .btn.secondary{background:#fff; color:var(--ink);}
  .btn.amber{background:var(--amber); border-color:var(--amber);}
  .btn.copy{background:var(--accent); border-color:var(--accent);}
  .btn:active{transform:translateY(1px);}
  .score-tag{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:.95rem;
    margin-left:auto;
    color:var(--accent-dark);
  }
  .copied-note{font-size:.8rem; color:var(--success); font-weight:600;}

  /* ===== sidebar ===== */
  .sidebar{
    position:sticky;
    top:20px;
    background:var(--paper-2);
    border:1px solid var(--line);
    border-radius:10px;
    padding:16px 16px 18px;
    box-shadow:var(--shadow);
  }
  .sidebar::before{
    content:"";
    display:block;
    height:6px;
    width:60%;
    background:repeating-linear-gradient(90deg, var(--ink) 0 6px, transparent 6px 14px);
    opacity:.35;
    margin-bottom:12px;
    border-radius:3px;
  }
  .sidebar h3{
    font-family:'Caveat',cursive;
    font-size:1.5rem;
    margin:0 0 2px;
    color:var(--accent-dark);
  }
  .sidebar .sub{
    font-size:.78rem;
    color:var(--ink-soft);
    margin:0 0 12px;
  }
  #problemList{
    list-style:none;
    margin:0;padding:0;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  #problemList li{
    background:#fff;
    border:1px solid var(--error);
    border-left:4px solid var(--error);
    border-radius:6px;
    padding:7px 10px;
    font-size:.85rem;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
  }
  #problemList li .cnt{
    background:var(--error);
    color:#fff;
    font-size:.72rem;
    font-weight:700;
    border-radius:10px;
    padding:1px 7px;
    flex-shrink:0;
  }
  .empty-note{
    font-size:.85rem;
    color:var(--ink-soft);
    font-style:italic;
  }
  .clear-btn{
    margin-top:12px;
    font-size:.78rem;
    background:none;
    border:none;
    color:var(--ink-soft);
    text-decoration:underline;
    cursor:pointer;
    padding:0;
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div>
      <h1>Vocabulary Workbook</h1>
      <div class="subtitle">пропиши слова своей рукой ✍️</div>
    </div>
    <div class="unit-tag">10 phrases · gender &amp; stereotypes<br>7 упражнений</div>
  </header>

  <section class="word-panel">
    <h2>Слова для повторения</h2>
    <p class="hint">Прочитай, прослушай произношение 🔊 и вспомни перевод — потом переходи к упражнениям.</p>
    <div class="word-grid" id="wordGrid"></div>
  </section>

  <div class="layout">
    <main>
      <div class="tabs" id="tabs"></div>
      <div id="panels"></div>
    </main>

    <aside class="sidebar">
      <h3>Проблемные слова</h3>
      <p class="sub">сюда попадают фразы, в которых ты ошибся</p>
      <ul id="problemList"></ul>
      <p class="empty-note" id="emptyNote">Пока ошибок нет — отлично!</p>
      <button class="clear-btn" id="clearProblems">очистить список</button>
    </aside>
  </div>

</div>

<script>
/* ============ DATA ============ */
const WORDS = [
  {en:"be considered", ipa:"/bi kənˈsɪdəd/", ru:"считаться (кем-то / чем-то)", def:"to think that someone or something is something"},
  {en:"dress sb", ipa:"/dres/", ru:"одевать кого-то", def:"to put clothes on someone"},
  {en:"gender equality", ipa:"/ˈdʒendə ɪˈkwɒləti/", ru:"гендерное равенство", def:"when men and women have the same rights"},
  {en:"be suitable for", ipa:"/bi ˈsuːtəbl fə/", ru:"подходить для", def:"to be good or right for something or someone"},
  {en:"be delicate", ipa:"/bi ˈdelɪkət/", ru:"быть хрупким / деликатным", def:"to be easy to break or need careful handling"},
  {en:"be influenced by a stereotype", ipa:"/bi ˈɪnfluənst baɪ ə ˈsteriətaɪp/", ru:"находиться под влиянием стереотипа", def:"to think or act because of a common idea about a group of people"},
  {en:"be more likely to choose", ipa:"/bi mɔː ˈlaɪkli tə tʃuːz/", ru:"с большей вероятностью выбрать", def:"to probably choose something"},
  {en:"be less likely to choose", ipa:"/bi les ˈlaɪkli tə tʃuːz/", ru:"с меньшей вероятностью выбрать", def:"to probably not choose something"},
  {en:"allow to choose for themselves", ipa:"/əˈlaʊ tə tʃuːz fə ðəmˈselvz/", ru:"позволять выбирать самим", def:"to let someone make their own choice"},
  {en:"encourage", ipa:"/ɪnˈkʌrɪdʒ/", ru:"поощрять / вдохновлять", def:"to give someone support or confidence to do something"}
];

const EXERCISES = [
  {
    id:"letters", title:"1. Вставь пропущенные буквы", type:"fill",
    desc:"Впиши слово или фразу целиком, ориентируясь на пропуски.",
    items: WORDS.map((w,i)=>({
      prompt:[
        "be c_ns_d_r_d","dr_ss sb","g_nd_r _qu_l_ty","be s__t_bl_ f_r","be d_l_c_t_",
        "be _nfl__nc_d by a st_r_ _typ_","be m_r_ l_k_ly t_ ch__s_","be l_ss l_k_ly t_ ch__s_",
        "_ll_w t_ ch__s_ f_r th_ms_lv_s","_nc__r_g_"
      ][i],
      answers:[w.en]
    }))
  },
  {
    id:"translate", title:"2. Переведи с русского", type:"fill",
    desc:"Напиши английскую фразу по русскому переводу.",
    items: WORDS.map((w,i)=>({
      prompt:[
        "считаться (например, хорошим другом)","одевать кого-то (ребёнка)","гендерное равенство",
        "подходить (для этой работы)","быть хрупким / деликатным","находиться под влиянием стереотипа",
        "с большей вероятностью выбрать (что-то)","с меньшей вероятностью выбрать (что-то)",
        "позволять выбирать самим","поощрять"
      ][i],
      answers:[w.en]
    }))
  },
  {
    id:"dictation", title:"3. Запиши слово на слух", type:"listen",
    desc:"Нажми 🔊, послушай фразу и запиши её по-английски.",
    items: WORDS.map(w=>({ prompt:"", speak:w.en, answers:[w.en] }))
  },
  {
    id:"definition", title:"4. Угадай слово по определению", type:"fill",
    desc:"Прочитай определение на английском и напиши нужную фразу.",
    items: WORDS.map(w=>({ prompt:w.def, answers:[w.en] }))
  },
  {
    id:"collocation", title:"5. Сочетаемость: впиши пропущенное слово", type:"fill",
    desc:"Заполни пропуск в предложении нужной формой слова/фразы.",
    items: [
      {prompt:"Pink is often ____ a girl's colour.", answers:["considered","is considered"]},
      {prompt:"Parents often ____ their children in warm clothes for winter.", answers:["dress"]},
      {prompt:"Toy shops should promote ____ by offering neutral toys for everyone.", answers:["gender equality"]},
      {prompt:"This board game is ____ children aged 5 to 8.", answers:["suitable for"]},
      {prompt:"Please handle the old vase carefully — it ____.", answers:["is delicate","delicate"]},
      {prompt:"Many children ____ when they choose toys or clothes.", answers:["are influenced by a stereotype","is influenced by a stereotype"]},
      {prompt:"In the study, girls ____ pink toys than blue ones.", answers:["were more likely to choose","are more likely to choose"]},
      {prompt:"Boys ____ dolls than cars in the shop.", answers:["were less likely to choose","are less likely to choose"]},
      {prompt:"Good parents ____ their children to choose their own clothes.", answers:["allow"]},
      {prompt:"Teachers should ____ all children to try different activities.", answers:["encourage"]}
    ]
  },
  {
    id:"natural", title:"6. Какое предложение звучит естественно?", type:"choice",
    desc:"Выбери вариант A или B, который грамматически и по смыслу верен.",
    items: [
      {a:"She is considered as a good doctor.", b:"She is considered a good doctor.", correct:"B"},
      {a:"Mother dressed the baby in a warm coat.", b:"Mother dressed the baby with a warm coat.", correct:"A"},
      {a:"Gender equality means equal rights for men and women.", b:"Gender equality means men and women wear the same clothes.", correct:"A"},
      {a:"This film is suitable for children.", b:"This film is suitable to children.", correct:"A"},
      {a:"Be careful, this glass is delicate.", b:"Be careful, this glass is delicated.", correct:"A"},
      {a:"He was influenced by a stereotype about boys and sports.", b:"He was influenced from a stereotype about boys and sports.", correct:"A"},
      {a:"Girls are more likely choose dolls.", b:"Girls are more likely to choose dolls.", correct:"B"},
      {a:"Boys are less likely to choose pink clothes.", b:"Boys are less likely choosing pink clothes.", correct:"A"},
      {a:"Parents should allow children choose for themselves.", b:"Parents should allow children to choose for themselves.", correct:"B"},
      {a:"Teachers encourage students to try new things.", b:"Teachers encourage students try new things.", correct:"A"}
    ]
  },
  {
    id:"finish", title:"7. Закончи предложение своей идеей", type:"open",
    desc:"Здесь нет единственно верного ответа — просто закончи мысль. Есть пример ответа для сравнения.",
    items: [
      {prompt:"I think a good friend is considered someone who ___.", model:"…always supports you and tells the truth."},
      {prompt:"When I was little, my parents used to dress me in ___.", model:"…bright, comfortable clothes for playing outside."},
      {prompt:"Gender equality is important because ___.", model:"…everyone should have the same chances in life, no matter their gender."},
      {prompt:"This job would be suitable for someone who ___.", model:"…is patient, organised and enjoys working with people."},
      {prompt:"I always take care of my phone because it is delicate and ___.", model:"…could break easily if I drop it."},
      {prompt:"Sometimes people are influenced by a stereotype when they ___.", model:"…judge others by their appearance instead of getting to know them."},
      {prompt:"In my class, girls are more likely to choose ___.", model:"…art or literature classes."},
      {prompt:"In my class, boys are less likely to choose ___.", model:"…dance or cooking classes."},
      {prompt:"Parents should allow children to choose for themselves when ___.", model:"…it comes to hobbies, clothes and friends."},
      {prompt:"Teachers can encourage students by ___.", model:"…praising their effort, not just their results."}
    ]
  }
];

/* ============ PROBLEM WORDS ============ */
let problemWords = {}; // en -> count

function addProblem(en){
  problemWords[en] = (problemWords[en]||0)+1;
  renderProblems();
}
function renderProblems(){
  const ul = document.getElementById('problemList');
  const empty = document.getElementById('emptyNote');
  const entries = Object.entries(problemWords).sort((a,b)=>b[1]-a[1]);
  ul.innerHTML = entries.map(([w,c])=>`<li><span>${w}</span><span class="cnt">${c}</span></li>`).join('');
  empty.style.display = entries.length ? 'none' : 'block';
}
document.getElementById('clearProblems').onclick = ()=>{
  problemWords = {};
  renderProblems();
};

/* ============ SPEECH ============ */
function speak(text){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  u.rate = 0.9;
  const voices = window.speechSynthesis.getVoices();
  const enVoice = voices.find(v=>v.lang && v.lang.startsWith('en'));
  if(enVoice) u.voice = enVoice;
  window.speechSynthesis.speak(u);
}
window.speechSynthesis && window.speechSynthesis.getVoices();
window.speechSynthesis && (window.speechSynthesis.onvoiceschanged = ()=>{});

/* ============ NORMALIZE / CHECK ============ */
function norm(s){
  return (s||'').toString().trim().toLowerCase()
    .replace(/[.,!?;:"']/g,'')
    .replace(/\s+/g,' ');
}
function isCorrect(userVal, answers){
  const u = norm(userVal);
  if(!u) return false;
  return answers.some(a=>norm(a)===u);
}

/* ============ RENDER WORD LIST ============ */
const wordGrid = document.getElementById('wordGrid');
wordGrid.innerHTML = WORDS.map((w,i)=>`
  <div class="word-card">
    <div class="num">${i+1}</div>
    <div class="info">
      <div class="en">${w.en}</div>
      <div class="ipa">${w.ipa}</div>
      <div class="ru">${w.ru}</div>
    </div>
    <button class="listen-btn" onclick="speak('${w.en.replace(/'/g,"\\'")}')" title="слушать">🔊</button>
  </div>
`).join('');

/* ============ RENDER TABS + PANELS ============ */
const tabsEl = document.getElementById('tabs');
const panelsEl = document.getElementById('panels');

tabsEl.innerHTML = EXERCISES.map((ex,i)=>`
  <button class="tab-btn ${i===0?'active':''}" data-idx="${i}"><span class="n">${i+1}</span>${ex.title.replace(/^\d+\.\s*/,'')}</button>
`).join('');

panelsEl.innerHTML = EXERCISES.map((ex,exi)=>{
  let itemsHtml = '';

  ex.items.forEach((it,ii)=>{
    if(ex.type==='fill' || ex.type==='listen'){
      itemsHtml += `
      <div class="item" data-ex="${exi}" data-i="${ii}">
        <div class="idx">${ii+1}</div>
        <div>
          ${ex.type==='listen'
            ? `<button class="mini-listen" onclick="speak('${it.speak.replace(/'/g,"\\'")}')">🔊 слушать</button>`
            : `<div class="prompt">${it.prompt}</div>`
          }
          <input type="text" placeholder="твой ответ..." data-ex="${exi}" data-i="${ii}">
          <span class="feedback" id="fb-${exi}-${ii}"></span>
          <div class="answer-reveal" id="ans-${exi}-${ii}">✓ ${it.answers[0]}</div>
        </div>
      </div>`;
    } else if(ex.type==='choice'){
      itemsHtml += `
      <div class="item" data-ex="${exi}" data-i="${ii}">
        <div class="idx">${ii+1}</div>
        <div>
          <div class="choice-row">
            <div class="choice-opt" data-letter="A" onclick="selectChoice(${exi},${ii},'A')"><span class="letter">A</span> ${it.a}</div>
            <div class="choice-opt" data-letter="B" onclick="selectChoice(${exi},${ii},'B')"><span class="letter">B</span> ${it.b}</div>
          </div>
          <span class="feedback" id="fb-${exi}-${ii}"></span>
        </div>
      </div>`;
    } else if(ex.type==='open'){
      itemsHtml += `
      <div class="item" data-ex="${exi}" data-i="${ii}">
        <div class="idx">${ii+1}</div>
        <div>
          <div class="prompt">${it.prompt}</div>
          <input type="text" placeholder="закончи предложение своими словами..." data-ex="${exi}" data-i="${ii}">
          <div class="answer-reveal" id="ans-${exi}-${ii}">💡 пример: ${it.model}</div>
        </div>
      </div>`;
    }
  });

  const copyLabel = ex.type==='open' ? 'Скопировать мои ответы' : 'Скопировать ответы';

  return `
  <div class="exercise-panel ${exi===0?'active':''}" id="panel-${exi}">
    <div class="ex-title">${ex.title}</div>
    <div class="ex-desc">${ex.desc}</div>
    ${itemsHtml}
    <div class="toolbar">
      <button class="btn" onclick="checkExercise(${exi})">Проверить</button>
      <button class="btn secondary" onclick="showAnswers(${exi})">Показать ответы</button>
      <button class="btn copy" onclick="copyAnswers(${exi})">${copyLabel}</button>
      <span class="copied-note" id="copied-${exi}"></span>
      <span class="score-tag" id="score-${exi}"></span>
    </div>
  </div>`;
}).join('');

/* ============ TAB SWITCH ============ */
tabsEl.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.onclick = ()=>{
    tabsEl.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    panelsEl.querySelectorAll('.exercise-panel').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-'+btn.dataset.idx).classList.add('active');
  };
});

/* ============ CHOICE SELECTION ============ */
let choiceState = {}; // "exi-ii" -> letter
function selectChoice(exi,ii,letter){
  choiceState[exi+'-'+ii] = letter;
  const item = document.querySelector(`.item[data-ex="${exi}"][data-i="${ii}"]`);
  item.querySelectorAll('.choice-opt').forEach(o=>{
    o.classList.remove('selected','correct','wrong');
    if(o.dataset.letter===letter) o.classList.add('selected');
  });
}

/* ============ CHECK ============ */
function checkExercise(exi){
  const ex = EXERCISES[exi];
  let correctCount = 0, totalCheckable = 0;

  ex.items.forEach((it,ii)=>{
    if(ex.type==='fill' || ex.type==='listen'){
      totalCheckable++;
      const input = document.querySelector(`input[data-ex="${exi}"][data-i="${ii}"]`);
      const fb = document.getElementById(`fb-${exi}-${ii}`);
      const ok = isCorrect(input.value, it.answers);
      input.classList.remove('correct','wrong');
      input.classList.add(ok?'correct':'wrong');
      fb.textContent = ok ? '✓ верно' : '✗ неверно';
      fb.className = 'feedback ' + (ok?'correct':'wrong');
      if(ok) correctCount++; else addProblem(WORDS[ii].en);
    } else if(ex.type==='choice'){
      totalCheckable++;
      const key = exi+'-'+ii;
      const chosen = choiceState[key];
      const item = document.querySelector(`.item[data-ex="${exi}"][data-i="${ii}"]`);
      const fb = document.getElementById(`fb-${exi}-${ii}`);
      item.querySelectorAll('.choice-opt').forEach(o=>{
        o.classList.remove('correct','wrong');
        if(o.dataset.letter===it.correct) o.classList.add('correct');
        else if(o.dataset.letter===chosen) o.classList.add('wrong');
      });
      const ok = chosen===it.correct;
      fb.textContent = chosen ? (ok?'✓ верно':'✗ неверно') : 'нет ответа';
      fb.className = 'feedback ' + (ok?'correct':'wrong');
      if(ok) correctCount++; else addProblem(WORDS[ii].en);
    }
    // 'open' type is not auto-checked
  });

  const scoreTag = document.getElementById(`score-${exi}`);
  if(ex.type==='open'){
    scoreTag.textContent = 'открытые ответы — сверься с примерами 💡';
  } else {
    scoreTag.textContent = `результат: ${correctCount} / ${totalCheckable}`;
  }
}

/* ============ SHOW ANSWERS ============ */
function showAnswers(exi){
  const ex = EXERCISES[exi];
  ex.items.forEach((it,ii)=>{
    if(ex.type==='fill' || ex.type==='listen' || ex.type==='open'){
      const rev = document.getElementById(`ans-${exi}-${ii}`);
      rev.classList.add('show');
    } else if(ex.type==='choice'){
      const item = document.querySelector(`.item[data-ex="${exi}"][data-i="${ii}"]`);
      item.querySelectorAll('.choice-opt').forEach(o=>{
        if(o.dataset.letter===it.correct) o.classList.add('correct');
      });
    }
  });
}

/* ============ COPY ANSWERS ============ */
function copyAnswers(exi){
  const ex = EXERCISES[exi];
  let lines = [];
  ex.items.forEach((it,ii)=>{
    if(ex.type==='fill' || ex.type==='listen'){
      lines.push(`${ii+1}. ${it.answers[0]}`);
    } else if(ex.type==='choice'){
      lines.push(`${ii+1}. ${it.correct} — ${it.correct==='A'?it.a:it.b}`);
    } else if(ex.type==='open'){
      const input = document.querySelector(`input[data-ex="${exi}"][data-i="${ii}"]`);
      const userText = input && input.value.trim();
      lines.push(`${ii+1}. ${it.prompt.replace('___', userText || it.model)}`);
    }
  });
  const text = lines.join('\n');
  const note = document.getElementById(`copied-${exi}`);

  const done = ()=>{ note.textContent = 'скопировано ✓'; setTimeout(()=>note.textContent='',1800); };

  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done));
  } else {
    fallbackCopy(text,done);
  }
}
function fallbackCopy(text,cb){
  const ta = document.createElement('textarea');
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand('copy'); cb(); }catch(e){}
  document.body.removeChild(ta);
}
</script>
</body>
</html>
