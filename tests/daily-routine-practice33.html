<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily routine — тренажёр A1</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap">
<style>
:root{--bg:#eef3fa;--card:#fff;--ink:#1c2536;--mute:#5d6b82;--line:#d5deec;--acc:#2456d6;--accbg:#e4ecff;--ok:#1b7f4b;--okbg:#dff5e8;--bad:#b3261e;--badbg:#fde5e3;--shown:#fff3d1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121826;--card:#1b2437;--ink:#e8edf7;--mute:#9aa8c2;--line:#2c3855;--acc:#7da2ff;--accbg:#24325a;--ok:#6fdc9f;--okbg:#17372a;--bad:#ff9d94;--badbg:#412323;--shown:#443a18;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121826;--card:#1b2437;--ink:#e8edf7;--mute:#9aa8c2;--line:#2c3855;--acc:#7da2ff;--accbg:#24325a;--ok:#6fdc9f;--okbg:#17372a;--bad:#ff9d94;--badbg:#412323;--shown:#443a18;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Nunito,system-ui,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px;display:grid;grid-template-columns:1fr 250px;gap:16px}
@media(max-width:820px){.wrap{grid-template-columns:1fr}aside{order:-1;position:static!important}}
header{grid-column:1/-1}
h1{font-size:30px;margin:8px 0 4px;font-weight:800}
h2{font-size:20px;margin:0 0 2px}
.sub{color:var(--mute);margin:0 0 10px}
section,aside .box,.top{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
aside{position:sticky;top:12px;align-self:start}
aside h3{margin:0 0 8px;font-size:17px}
.ins{color:var(--mute);margin:0 0 12px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 12px}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
.pri{background:var(--acc);border-color:var(--acc);color:#fff}
:root:not([data-theme="light"]) .pri{color:#0d1630}
.ghost{color:var(--mute)}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.score{font-weight:800;margin-left:6px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-top:10px}
.v{border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;gap:8px;align-items:center;justify-content:space-between}
.v b{display:block}.v i{color:var(--mute);font-style:normal;font-size:14px}.v small{color:var(--mute)}
.spk{padding:4px 8px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 10px;border-radius:10px;border:1px solid transparent}
.row .n{font-weight:800;color:var(--mute);width:22px}
.row .q{flex:1 1 220px}
.row input{flex:1 1 200px;font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.row.ok{background:var(--okbg);border-color:var(--ok)}.row.bad{background:var(--badbg);border-color:var(--bad)}.row.shown{background:var(--shown)}
.fb{font-weight:800;width:18px}
.ipa{color:var(--mute);margin-left:6px}
.chip{margin:3px 4px 3px 0;background:var(--accbg);border-color:transparent}
.chip.on{background:var(--acc);color:#fff}
:root:not([data-theme="light"]) .chip.on{color:#0d1630}
.chip.used{opacity:.35}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.bad{background:var(--badbg);color:var(--bad)}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mt>div{display:flex;flex-direction:column;align-items:flex-start}
.ans{min-height:40px;border-bottom:2px dashed var(--line);margin:6px 0;padding:4px 0}
.ans i{color:var(--mute);font-size:14px}
.ws{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;max-width:380px}
.ws button{padding:0;aspect-ratio:1;font-weight:800;text-transform:uppercase}
.ws .f{background:var(--okbg);color:var(--ok)}.ws .s{background:var(--acc);color:#fff}
.wl{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}.wl span{padding:2px 10px;border-radius:99px;background:var(--accbg)}.wl .d{text-decoration:line-through;background:var(--okbg);color:var(--ok)}
table{width:100%;border-collapse:collapse;font-size:15px}td{padding:4px 2px;border-bottom:1px solid var(--line)}td:last-child{text-align:right;color:var(--bad);font-weight:800}
.top{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.top input{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
#vs{color:var(--mute);font-size:14px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;display:none}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>Daily routine</h1>
<p class="sub">Тренажёр A1: повседневные выражения. Пишите ответы руками, проверяйте и смотрите ответы.</p>
<div class="top">
<button class="pri" id="test">🔊 Проверить звук</button>
<span id="vs">Ищу голос…</span>
<input id="name" placeholder="Ваше имя" aria-label="Ваше имя">
<button id="copy">📋 Скопировать мои ответы</button>
</div>
</header>
<main>
<section>
<h2>Повторяем слова</h2>
<p class="ins">Нажмите 🔊 и послушайте каждое выражение. Голос: Google US English / Samantha (если есть на устройстве).</p>
<button id="all">▶ Прослушать все</button>
<div class="vgrid" id="vg"></div>
</section>
<div id="ex"></div>
</main>
<aside>
<div class="box">
<h3>Проблемные слова</h3>
<table id="pt"></table>
<p class="ins" id="pe">Пока ошибок нет.</p>
<button class="ghost" id="pc">Очистить</button>
</div>
</aside>
</div>
<div id="toast"></div>
<script>
const V=[["wake up","weɪk ʌp","просыпаться"],["get up","ɡet ʌp","вставать"],["brush my teeth","brʌʃ maɪ tiːθ","чистить зубы"],["take a shower","teɪk ə ˈʃaʊər","принимать душ"],["have a shower","hæv ə ˈʃaʊər","принимать душ"],["get dressed","ɡet drest","одеваться"],["get undressed","ɡet ʌnˈdrest","раздеваться"],["have breakfast","hæv ˈbrekfəst","завтракать"],["check my phone","tʃek maɪ foʊn","проверять телефон"],["work from home","wɜːrk frʌm hoʊm","работать из дома"],["get to the shop","ɡet tə ðə ʃɑːp","добираться до магазина"],["get to work","ɡet tə wɜːrk","добираться до работы"],["get home","ɡet hoʊm","приходить домой"],["get","ɡet","получать"],["leave home","liːv hoʊm","уходить из дома"],["tidy my room","ˈtaɪdi maɪ ruːm","убирать комнату"],["go for a walk","ɡoʊ fər ə wɔːk","идти гулять"],["go to bed","ɡoʊ tə bed","ложиться спать"],["eat popcorn","iːt ˈpɑːpkɔːrn","есть попкорн"],["eat cookies","iːt ˈkʊkiz","есть печенье"],["read books","riːd bʊks","читать книги"],["buy flowers","baɪ ˈflaʊərz","покупать цветы"],["do skincare","duː ˈskɪnker","делать уход за кожей"],["do exercise","duː ˈeksərsaɪz","делать зарядку"],["do yoga","duː ˈjoʊɡə","заниматься йогой"],["listen to music","ˈlɪsn tə ˈmjuːzɪk","слушать музыку"],["drink coffee","drɪŋk ˈkɔːfi","пить кофе"],["take photos","teɪk ˈfoʊtoʊz","фотографировать"],["go shopping","ɡoʊ ˈʃɑːpɪŋ","ходить по магазинам"]];
const $=s=>document.querySelector(s);
const norm=s=>s.toLowerCase().replace(/[’`]/g,"'").replace(/[.!?,]/g,"").replace(/\s+/g," ").trim();
const shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const ipaOf=p=>(V.find(v=>v[0]==p)||[])[1]||"";
function toast(t){const e=$("#toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",2200)}

/* ---- audio ---- */
let voice=null;
function pick(){const vs=speechSynthesis.getVoices();voice=vs.find(v=>/Google US English/i.test(v.name))||vs.find(v=>/Samantha/i.test(v.name))||vs.find(v=>v.lang=="en-US"||v.lang=="en_US")||vs.find(v=>/^en/i.test(v.lang))||null;$("#vs").textContent=voice?"Голос: "+voice.name:"Английский голос не найден — проверьте настройки устройства"}
function utter(t){const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.85;if(voice)u.voice=voice;u.onerror=()=>$("#vs").textContent="Не удалось воспроизвести звук. Проверьте громкость и разрешения браузера.";return u}
function say(t){if(!window.speechSynthesis){toast("Браузер не поддерживает озвучку");return}speechSynthesis.cancel();speechSynthesis.speak(utter(t))}
if(window.speechSynthesis){pick();speechSynthesis.onvoiceschanged=pick}else $("#vs").textContent="Озвучка не поддерживается в этом браузере";
$("#test").onclick=()=>{pick();say("Hello! Wake up, get up, brush my teeth.")};
$("#all").onclick=()=>{if(!window.speechSynthesis)return;speechSynthesis.cancel();V.forEach(v=>speechSynthesis.speak(utter(v[0])))};
document.addEventListener("click",e=>{const t=e.target.closest("[data-s]");if(t)say(t.dataset.s);const q=e.target.closest("[data-i]");if(q){const p=q.parentNode.querySelector(".ipa");p.hidden=!p.hidden}});
$("#vg").innerHTML=V.map(v=>`<div class="v"><div><b>${v[0]}</b><i>/${v[1]}/</i><br><small>${v[2]}</small></div><button class="spk" data-s="${v[0]}" aria-label="Прослушать ${v[0]}">🔊</button></div>`).join("");

/* ---- problem words ---- */
const P={};
function bad(k){P[k]=(P[k]||0)+1;drawP()}
function drawP(){const k=Object.keys(P);$("#pt").innerHTML=k.map(w=>`<tr><td><button class="spk" data-s="${w}">🔊</button> ${w}</td><td>×${P[w]}</td></tr>`).join("");$("#pe").hidden=k.length>0}
$("#pc").onclick=()=>{for(const k in P)delete P[k];drawP()};

/* ---- exercise shell ---- */
const X=[];
function sec(t,ins,fn){const s=document.createElement("section");s.innerHTML=`<h2>${t}</h2><p class="ins">${ins}</p><div class="body"></div><div class="btns"><button class="pri">Проверить</button><button>Показать ответы</button><button class="ghost">Сначала</button><span class="score" aria-live="polite"></span></div>`;$("#ex").append(s);const b=s.querySelector(".body"),[c,sh,r]=s.querySelectorAll("button"),sc=s.querySelector(".score");const o=fn(b);c.onclick=()=>sc.textContent=o.check();sh.onclick=()=>{o.show();sc.textContent=""};r.onclick=()=>{o.reset();sc.textContent=""};X.push({t,out:o.out})}

function typed(t,ins,items,dict){sec(t,ins,b=>{
b.innerHTML=items.map((it,i)=>`<div class="row"><span class="n">${i+1}</span><div class="q">${dict?`<button class="spk" data-s="${it.a[0]}" aria-label="Прослушать">🔊</button> <button class="ghost" data-i="${i}">транскрипция</button><span class="ipa" hidden>/${ipaOf(it.a[0])}/</span>`:it.q}</div><input autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Ответ ${i+1}"><span class="fb"></span></div>`).join("");
const R=[...b.querySelectorAll(".row")],val=r=>r.querySelector("input").value;
return{check(){let n=0;R.forEach((r,i)=>{const ok=items[i].a.some(a=>norm(a)==norm(val(r)));r.className="row "+(ok?"ok":"bad");r.querySelector(".fb").textContent=ok?"✓":"✗";ok?n++:bad(items[i].k)});return`Верно: ${n}/${items.length}`},
show(){R.forEach((r,i)=>{r.querySelector("input").value=items[i].a[0];r.className="row shown";r.querySelector(".fb").textContent=""})},
reset(){R.forEach(r=>{r.querySelector("input").value="";r.className="row";r.querySelector(".fb").textContent=""})},
out(){return R.map((r,i)=>`${i+1}. ${dict?"(аудио)":items[i].q} → ${val(r)||"—"} ${r.classList.contains("ok")?"✓":r.classList.contains("bad")?"✗ (правильно: "+items[i].a[0]+")":r.classList.contains("shown")?"(ответ показан)":""}`).join("\n")}}})}

/* 1 RU→EN */
const tr=[["просыпаться","wake up"],["чистить зубы","brush my teeth"],["завтракать","have breakfast"],["приходить домой","get home"],["читать книги","read books"],["уходить из дома","leave home"],["пить кофе","drink coffee"],["делать зарядку","do exercise","do exercises"]];
typed("Упр. 1. Перевод с русского на английский","Напишите выражение по-английски.",shuf(tr).map(([q,...a])=>({q,a,k:a[0]})));
/* 2 dictation */
typed("Упр. 2. Напишите по звуку","Нажмите 🔊, послушайте и напишите выражение. Нужна подсказка — откройте транскрипцию.",shuf(["go to bed","take photos","eat cookies","get dressed","check my phone","listen to music","buy flowers"]).map(p=>({a:[p],k:p})),true);
/* 3 tenses */
typed("Упр. 3. Измените глагол: Present, Past, Future","Впишите всю фразу в нужном времени (Present Simple, Past Simple, Future Simple).",shuf([
["She ___ (wake up) at seven every day. [Present]",["wakes up"],"wake up"],
["Yesterday I ___ (go to bed) late. [Past]",["went to bed"],"go to bed"],
["Tomorrow he ___ (buy flowers) for his mum. [Future]",["will buy flowers","'ll buy flowers"],"buy flowers"],
["Last night we ___ (eat popcorn) at the cinema. [Past]",["ate popcorn"],"eat popcorn"],
["My dad ___ (drink coffee) every morning. [Present]",["drinks coffee"],"drink coffee"],
["Yesterday she ___ (take photos) in the park. [Past]",["took photos"],"take photos"],
["He ___ (do yoga) on Sundays. [Present]",["does yoga"],"do yoga"],
["Next week they ___ (go shopping). [Future]",["will go shopping","'ll go shopping"],"go shopping"]
]).map(([q,a,k])=>({q,a,k})));

/* 4 match */
sec("Упр. 4. Соедините половинки","Нажмите на левую часть, потом на подходящую правую. Нажмите на левую ещё раз, чтобы изменить выбор.",b=>{
const M=[["wake","up"],["brush","my teeth"],["take","a shower"],["have","breakfast"],["go for","a walk"],["listen","to music"],["buy","flowers"]];
const ord=shuf(M.map((_,i)=>i));let m={},sel=null,res=null;
const full=i=>M[i][0]+" "+M[i][1];
function draw(){const used=Object.values(m);b.innerHTML=`<div class="mt"><div>${M.map((p,i)=>`<button class="chip ${sel===i?"on":""} ${res?(res[i]?"ok":"bad"):""}" data-l="${i}">${p[0]}${m[i]!=null?" → <b>"+M[m[i]][1]+"</b>":""}</button>`).join("")}</div><div>${ord.map(j=>`<button class="chip ${used.includes(j)?"used":""}" data-r="${j}">${M[j][1]}</button>`).join("")}</div></div>`}
b.onclick=e=>{const t=e.target.closest("button");if(!t)return;res=null;if(t.dataset.l!=null){sel=+t.dataset.l;delete m[sel]}else if(t.dataset.r!=null&&sel!=null){const j=+t.dataset.r;for(const k in m)if(m[k]===j)delete m[k];m[sel]=j;sel=null}draw()};
draw();
return{check(){res={};let n=0;M.forEach((_,i)=>{res[i]=m[i]===i;res[i]?n++:bad(full(i))});draw();return`Верно: ${n}/${M.length}`},
show(){M.forEach((_,i)=>m[i]=i);res=null;sel=null;draw()},
reset(){m={};res=null;sel=null;draw()},
out(){return M.map((_,i)=>`${i+1}. ${M[i][0]} → ${m[i]!=null?M[m[i]][1]:"—"} ${m[i]===i?"✓":m[i]!=null?"✗ (правильно: "+full(i)+")":""}`).join("\n")}}});

/* 5 rephrase */
typed("Упр. 5. Rephrase — перефразируйте","Замените подчёркнутую часть так, чтобы смысл остался тем же. Впишите пропущенные слова.",shuf([
["I take a shower. → I ___ a shower.",["have"],"have a shower"],
["I arrive home at six. → I ___ home at six.",["get"],"get home"],
["I have a shower. → I ___ a shower.",["take"],"take a shower"],
["I go to the shop by bus. → I ___ the shop by bus.",["get to"],"get to the shop"],
["I receive a message every day. → I ___ a message every day.",["get"],"get"],
["I eat breakfast at eight. → I ___ breakfast at eight.",["have"],"have breakfast"],
["I wake up at seven. → I ___ at seven.",["get up"],"get up"]
]).map(([q,a,k])=>({q,a,k})));

/* 6 build the chunk */
sec("Упр. 6. Build the chunk — соберите выражение","Нажимайте на слова по порядку. Нажмите на слово в ответе, чтобы убрать его.",b=>{
const I=shuf([["идти гулять","go for a walk"],["добираться до магазина","get to the shop"],["слушать музыку","listen to music"],["убирать комнату","tidy my room"],["принимать душ","take a shower"],["работать из дома","work from home"]]);
const st=I.map(([r,a])=>({w:shuf(a.split(" ")),c:[]}));let res=[];
const txt=i=>st[i].c.map(j=>st[i].w[j]).join(" ");
function draw(){b.innerHTML=I.map(([r,a],i)=>`<div class="row ${res[i]===1?"ok":res[i]===0?"bad":""}"><span class="n">${i+1}</span><div class="q">${r}<div class="ans">${st[i].c.map(j=>`<button class="chip on" data-c="${i},${j}">${st[i].w[j]}</button>`).join("")||"<i>нажимайте слова по порядку</i>"}</div><div>${st[i].w.map((w,j)=>st[i].c.includes(j)?"":`<button class="chip" data-p="${i},${j}">${w}</button>`).join("")}</div></div></div>`).join("")}
b.onclick=e=>{const t=e.target.closest("button");if(!t)return;res=[];if(t.dataset.p){const[i,j]=t.dataset.p.split(",");st[i].c.push(+j)}else if(t.dataset.c){const[i,j]=t.dataset.c.split(",");st[i].c=st[i].c.filter(x=>x!=j)}draw()};
draw();
return{check(){let n=0;I.forEach(([r,a],i)=>{const ok=txt(i)==a;res[i]=ok?1:0;ok?n++:bad(a)});draw();return`Верно: ${n}/${I.length}`},
show(){I.forEach(([r,a],i)=>{const u=[];a.split(" ").forEach(w=>u.push(st[i].w.findIndex((x,k)=>x==w&&!u.includes(k))));st[i].c=u});res=[];draw()},
reset(){st.forEach(s=>s.c=[]);res=[];draw()},
out(){return I.map(([r,a],i)=>`${i+1}. ${r} → ${txt(i)||"—"} ${res[i]===1?"✓":res[i]===0?"✗ (правильно: "+a+")":""}`).join("\n")}}});

/* 7 word search */
sec("Упр. 7. Word search — найдите 7 слов","Нажмите на первую букву слова, затем на последнюю. Слова идут вправо, вниз или по диагонали вниз-вправо.",b=>{
const W=["YOGA","MUSIC","COFFEE","BOOKS","PHOTOS","COOKIES","POPCORN"],N=10,D=[[1,0],[0,1],[1,1]];
let g,found,fc,s1;
function init(){do{g=Array.from({length:N},()=>Array(N).fill(""));let ok=0;for(const w of shuf(W)){for(let t=0;t<300;t++){const[dx,dy]=D[Math.floor(Math.random()*3)],x=Math.floor(Math.random()*N),y=Math.floor(Math.random()*N);if(x+dx*(w.length-1)>=N||y+dy*(w.length-1)>=N)continue;let f=1;for(let i=0;i<w.length;i++){const c=g[y+dy*i][x+dx*i];if(c&&c!=w[i])f=0}if(!f)continue;for(let i=0;i<w.length;i++)g[y+dy*i][x+dx*i]=w[i];ok++;break}}if(ok==W.length)break}while(1);
g=g.map(r=>r.map(c=>c||"ABCDEFGHIKLMNOPRSTUWY"[Math.floor(Math.random()*21)]));found=new Set();fc=new Set();s1=null}
function mark(w){for(let y=0;y<N;y++)for(let x=0;x<N;x++)for(const[dx,dy]of D){const l=[];for(let i=0;i<w.length;i++){const xx=x+dx*i,yy=y+dy*i;if(xx>=N||yy>=N||g[yy][xx]!=w[i])break;l.push(yy*N+xx)}if(l.length==w.length){found.add(w);l.forEach(c=>fc.add(c));return}}}
function draw(){b.innerHTML=`<div class="ws">${g.map((r,y)=>r.map((c,x)=>`<button class="${fc.has(y*N+x)?"f":s1&&s1[0]==x&&s1[1]==y?"s":""}" data-x="${x}" data-y="${y}" aria-label="${c}">${c}</button>`).join("")).join("")}</div><div class="wl">${W.map(w=>`<span class="${found.has(w)?"d":""}">${w.toLowerCase()}</span>`).join("")}</div>`}
b.onclick=e=>{const t=e.target.closest("button");if(!t||t.dataset.x==null)return;const x=+t.dataset.x,y=+t.dataset.y;if(!s1){s1=[x,y]}else{const ax=x-s1[0],ay=y-s1[1],n=Math.max(Math.abs(ax),Math.abs(ay)),dx=Math.sign(ax),dy=Math.sign(ay);if((ax==0||ay==0||Math.abs(ax)==Math.abs(ay))&&n>0){let s="",l=[];for(let i=0;i<=n;i++){s+=g[s1[1]+dy*i][s1[0]+dx*i];l.push((s1[1]+dy*i)*N+s1[0]+dx*i)}const r=[...s].reverse().join("");const w=W.find(w=>w==s||w==r);if(w){found.add(w);l.forEach(c=>fc.add(c))}}s1=null}draw()};
init();draw();
return{check(){W.filter(w=>!found.has(w)).forEach(w=>bad(w.toLowerCase()));return`Найдено: ${found.size}/${W.length}`},
show(){W.forEach(mark);s1=null;draw()},
reset(){init();draw()},
out(){return"Найдено слов: "+found.size+"/"+W.length+" ("+(W.filter(w=>found.has(w)).join(", ").toLowerCase()||"—")+")"}}});

/* ---- copy answers ---- */
$("#copy").onclick=()=>{const t=`Имя: ${$("#name").value||"—"}\n\n`+X.map(x=>x.t+"\n"+x.out()).join("\n\n")+"\n\nПроблемные слова: "+(Object.keys(P).map(k=>k+" ×"+P[k]).join(", ")||"нет");
const fb=()=>{const a=document.createElement("textarea");a.value=t;document.body.append(a);a.select();try{document.execCommand("copy");toast("Ответы скопированы")}catch(e){toast("Не удалось скопировать")}a.remove()};
try{navigator.clipboard.writeText(t).then(()=>toast("Ответы скопированы"),fb)}catch(e){fb()}};
</script>
</body>
</html>
